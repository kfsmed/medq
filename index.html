    </div>
    <div class="card" id="list" aria-live="polite"></div>
    <details class="card"><summary style="cursor:pointer;font-weight:600;color:var(--plum);min-height:28px">${t("b.adv")}</summary>
      <div class="stack" style="margin-top:12px">
        <p class="muted small">${t("b.advSub")}</p>
        <input type="file" id="bankfile" accept="application/json,.json" class="input">
        <div class="row">${Bank.source === "custom" ? `<button class="btn btn-ghost btn-sm" id="resetbank">${t("b.reset")}</button>` : ""}<button class="btn btn-ghost btn-sm" id="copyfmt">${t("b.copyJson")}</button></div>
      </div></details>
  </div>`;
  let filter = "all", term = "";
  const p = User.progress();
  const draw = () => {
    const flags = User.flags, favs = User.favs, notes = Store.get("notes", {}), tp = $("#tp").value, show = $("#showans").checked, sb = $("#srcb") ? $("#srcb").value : "";
    const words = term.toLowerCase().split(/\s+/).filter(Boolean);
    const list = Bank.questions.filter(q => (!tp || q.topic === tp) && (!sb || q.source === sb) &&
      (filter === "all" || (filter === "fav" && favs.has(q.id)) || (filter === "flag" && flags.has(q.id)) || (filter === "wrong" && p[q.id] && p[q.id].last && !p[q.id].last.ok) || (filter === "notes" && notes[q.id])) &&
      words.every(w => (q.id + " " + (Bank.sourceName[q.source] || "") + " " + q.concept + " " + q.stem + " " + q.options.join(" ") + " " + q.explanation + " " + q.memoryTrick + " " + (notes[q.id] || "")).toLowerCase().indexOf(w) >= 0));
    const hl = s => { let r = esc(s); words.forEach(w => { const re = new RegExp("(" + esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"); r = r.replace(re, "<mark>$1</mark>"); }); return r; };
    $("#cnt").textContent = qn(list.length); $("#cnt").dataset.n = list.length; $("#practise").disabled = !list.length;
    const shown = list.slice(0, 200);
    $("#list").innerHTML = list.length ? shown.map(q => { const r = p[q.id];
      return `<div class="qrow"><div class="qmeta"><span class="pill">${L(Bank.topicName[q.topic])}</span><span class="qid"><bdi dir="ltr" class="ltr">${hl(q.id)} · ${esc(q.concept)}${q.source ? " · " + esc(Bank.sourceName[q.source] || q.source) : ""}</bdi></span>${q.repeatOf ? `<span class="pill" title="${esc(t("b.repeatOf", {id: q.repeatOf}))}">${t("b.repeat")}</span>` : ""}${r ? `<span class="pill ${r.last && r.last.ok ? "sage" : "bad"}">${t("b.correctN", {c: r.c, n: r.n})}</span>` : ""}<span class="spacer"></span>
        <button class="icon-btn" data-flag="${esc(q.id)}" aria-pressed="${flags.has(q.id)}" aria-label="${esc(t("b.flagQ", {id: q.id}))}">${ICON.flag}</button>
        <button class="icon-btn" data-fav="${esc(q.id)}" aria-pressed="${favs.has(q.id)}" aria-label="${esc(t("b.favQ", {id: q.id}))}">${favs.has(q.id) ? ICON.starOn : ICON.star}</button></div>
        <div dir="ltr" lang="en" class="ltr"><p style="margin:0">${hl(q.stem)}</p>
        <ul class="opts-list">${q.options.map((o, i) => `<li class="${show && i === q.answer ? "correct" : ""}">${LETTERS[i]}. ${hl(o)}${show && i === q.answer ? " ✓" : ""}</li>`).join("")}</ul></div>
        ${notes[q.id] ? `<p class="small" style="margin-top:8px"><strong>${t("b.yourNote")}</strong> <span dir="auto">${hl(notes[q.id])}</span></p>` : ""}
        ${show && q.explanation ? `<p class="small muted cx" dir="${cdir(q.explanation)}" style="margin-top:6px">${hl(q.explanation)}</p>` : ""}${show && q.memoryTrick ? `<p class="small cx" dir="${cdir(q.memoryTrick)}" style="margin-top:4px;color:var(--plum-2)">💡 ${hl(q.memoryTrick)}</p>` : ""}${show && q.note ? `<p class="small cx" dir="${cdir(q.note)}" style="margin-top:6px;color:var(--warn)">${esc(q.note)}</p>` : ""}</div>`; }).join("") + (list.length > shown.length ? `<p class="muted small" style="padding-top:12px">${t("r.andMore", {n: list.length - shown.length})}</p>` : "") : `<p class="muted">${t("b.noMatch")}</p>`;
    $$("[data-flag]").forEach(b => b.onclick = () => { User.toggleSet("flags", b.dataset.flag); draw(); });
    $$("[data-fav]").forEach(b => b.onclick = () => { User.toggleSet("favs", b.dataset.fav); draw(); });
    $("#practise").onclick = () => startSession("train", list.map(q => q.id), {feedback: User.prefs().feedback});
  };
  let tm = null; $("#q").addEventListener("input", e => { clearTimeout(tm); tm = setTimeout(() => { term = e.target.value.trim(); draw(); }, 150); });
  $("#tp").onchange = draw; $("#showans").onchange = draw; if ($("#srcb")) $("#srcb").onchange = draw;
  $$("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; $$("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); });
  draw();
  $("#bankfile").onchange = e => { const f = e.target.files && e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { let data; try { data = JSON.parse(rd.result); } catch(err) { openDialog({title: t("b.badJsonT"), body: `<p>${t("b.badJsonB")}</p>`, actions: [{label: t("common.ok"), cls: "btn-pri"}]}); return; }
      const errs = validateBank(data);
      if (errs.length) { openDialog({title: t("b.problemsT"), body: `<ul dir="auto">${errs.slice(0,12).map(x => `<li>${esc(x)}</li>`).join("")}</ul>${errs.length>12?`<p>${t("r.andMore", {n: errs.length-12})}</p>`:""}`, actions: [{label: t("common.ok"), cls: "btn-pri"}]}); return; }
      if (!Store.set("customBank", data)) { toast(t("b.tooLarge")); }
      useBank(data, "custom"); toast(t("b.loaded", {n: data.questions.length})); render(); };
    rd.onerror = () => toast(t("b.readErr")); rd.readAsText(f); };
  const rb = $("#resetbank"); if (rb) rb.onclick = async () => { Store.del("customBank"); await loadBank(); toast(t("b.restored")); render(); };
  $("#copyfmt").onclick = async () => { const data = {title: Bank.title, credit: Bank.credit || undefined, topics: Bank.topics, sources: Bank.sources, questions: Bank.questions}; toast(await copyText(JSON.stringify(data, null, 2)) ? t("b.copied") : t("r.copyNo")); };
}

// ---------- keyboard ----------
function shortcutsHelp() {
  const rows = [["1 – 5 / A – E","k.choose"],[t("k.arrows"),"k.nav"],["Enter","k.enter"],["F","k.flag"],["S","k.fav"],["H","k.hint"],["K","k.conf"],["N","k.notes"],["W","k.draw"],["P","k.pad"],["G","k.grid"],["?","k.help"]];
  openDialog({title: t("k.title"), body: `<table class="kbdtbl">${rows.map(r => `<tr><td><kbd dir="ltr">${esc(r[0])}</kbd></td><td>${t(r[1])}</td></tr>`).join("")}</table>`, actions: [{label: t("common.close"), cls: "btn-pri"}]});
}
document.addEventListener("keydown", e => {
  if (dlgStack.length) { if (e.key === "Escape") { e.preventDefault(); dlgStack[dlgStack.length-1].close("dismiss"); } return; }
  if ($(".langscreen")) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tg = e.target;
  const typing = tg && (tg.tagName === "TEXTAREA" || tg.tagName === "SELECT" || tg.isContentEditable || (tg.tagName === "INPUT" && !/^(checkbox|radio|button|submit|range|file)$/i.test(tg.type)));
  if (typing) { if (e.key === "Escape") tg.blur(); return; }
  if (!S || !$("#qpane")) { if (e.key === "?") { e.preventDefault(); shortcutsHelp(); } return; }
  const k = e.key, kl = k.toLowerCase(), id = S.qids[S.idx];
  const keyIdx = {"1":0,"2":1,"3":2,"4":3,"5":4,"6":5,"a":0,"b":1,"c":2,"d":3,"e":4}[kl];
  if (keyIdx != null) { e.preventDefault(); const b = $$(".opt")[keyIdx]; if (b && !b.disabled && !drawing) b.click(); return; }
  // arrows follow the reading direction: in Arabic (RTL) the left arrow moves forward
  const fwd = isRTL() ? "ArrowLeft" : "ArrowRight", back = isRTL() ? "ArrowRight" : "ArrowLeft";
  if (k === fwd) { e.preventDefault(); goto(S.idx + 1); }
  else if (k === back) { e.preventDefault(); goto(S.idx - 1); }
  else if (k === "Enter") { if (tg && tg.tagName === "BUTTON") return; e.preventDefault(); const cb = $("#checkbtn"); if (cb && !cb.disabled) cb.click(); else if (S.idx < S.qids.length - 1) goto(S.idx + 1); else finishSession(false); }
  else if (kl === "f") { e.preventDefault(); $("#flagbtn").click(); }
  else if (kl === "s") { e.preventDefault(); $("#favbtn").click(); }
  else if (kl === "h") { const hb = $("#hintbtn"); if (hb) { e.preventDefault(); hb.click(); } }
  else if (kl === "n") { e.preventDefault(); $("#notebtn").click(); }
  else if (kl === "w") { e.preventDefault(); setDrawing(!drawing); }
  else if (kl === "p") { e.preventDefault(); openScratchpad(id); }
  else if (kl === "g") { e.preventDefault(); navOpen ? closeNav() : openNav(); }
  else if (kl === "k") { e.preventDefault(); const seq = [undefined, "sure", "unsure", "guess"]; const nx = seq[(seq.indexOf(S.conf[id]) + 1) % seq.length]; const b = nx ? $(`[data-conf="${nx}"]`) : $(`[data-conf="${S.conf[id]}"]`); if (b) b.click(); }
  else if (k === "Escape") { if (drawing) setDrawing(false); else if (navOpen) closeNav(); }
  else if (k === "?") { e.preventDefault(); shortcutsHelp(); }
});

window.addEventListener("storage", e => {
  if (!e.key || e.key.indexOf("medq.v1.") !== 0) return;
  if (S && e.key === "medq.v1." + slotOf(S.mode)) { const fresh = getActive(slotOf(S.mode)); if (!fresh || fresh.id !== S.id) { S = null; toast(t("s.otherTab")); go("home"); } }
});

// ---------- boot ----------
(async function boot() {
 try {
  const saved = storedLang();
  LANG = saved === "ar" ? "ar" : "en";
  applyLang();
  $("#langbtn").onclick = toggleLang;
  await loadBank();
  window.__medqBooted = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist().catch(() => {}); }).catch(() => {}); } catch(e) {}
  if (!saved) { const chosen = await langScreen(); setLang(chosen, false); }
  const ex = Store.get("active.exam", null);
  if (ex && !ex.submitted && ex.endsAt && now() >= ex.endsAt && ex.qids.every(id => Bank.byId[id])) { S = ex; await finishSession("time"); return; }
  render();
 } catch (e) { if (window.__medqFail) window.__medqFail((e && (e.message || e)) || "Startup error"); else throw e; }
})();

</script>
</body>
