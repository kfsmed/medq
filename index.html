ource":"RASHAD","stem":"One of the Irregular bones is :","options":["Hip bone","femur","rib","tarsal bone"],"answer":0,"explanation":"الـ irregular bones ليها أشكال مختلفة زي الـ vertebrae والـ hip bone. الـ femur long، والـ rib flat، والـ tarsal short.","memoryTrick":"Hip = Irregular.","stemAr":"واحدة من الـ irregular bones هي:","whyWrong":[null,"الـ femur long.","الـ rib flat.","الـ tarsal short."]},{"id":"RASHAD-02","topic":"anat","concept":"Skeleton & types of bones","source":"RASHAD","stem":"The axial skeleton includes one of the following:","options":["The skull","The clavicle","The hip bone .","The phalanges."],"answer":0,"explanation":"الـ skull في الـ head، فهو من الـ axial skeleton (head و neck و trunk).","memoryTrick":null,"stemAr":"الـ axial skeleton بيشمل واحدة من دول:","whyWrong":[null,"⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","الـ phalanges في الإيد (upper extremity)، فهي appendicular."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"RASHAD-03","topic":"anat","concept":"Skeleton & types of bones","source":"RASHAD","stem":"patella is :","options":["sesamoid bone","short bone","pneumatic bone","irregular bone"],"answer":0,"explanation":"الـ patella sesamoid bone.","memoryTrick":"Patella = Sesamoid.","stemAr":"الـ patella هي:","whyWrong":[null,"مش short.","مفيهاش هوا.","مش irregular."]},{"id":"RASHAD-04","topic":"anat","concept":"Bone structure, blood supply & growth","source":"RASHAD","stem":"Regarding the yellow bone marrow , one statement is true :","options":["It is present in the shaft of long bones in the adult","It is present in the vertebra, skull and ribs in the adult","It is concerned with the formation of blood cells","The sternum is suitable for bone marrow aspiration"],"answer":0,"explanation":"الـ bone marrow بيختلف مع السن: عند الولادة red بس، وفي الطفولة الـ yellow بيحل محل الـ red في الـ long bones، وفي الكبار الـ medullary cavity بتاعة كل الـ long bones فيها yellow marrow بس، وا natomical position, planes & terms","source":"RASHAD","stem":"The term which means near to the trunk is:","options":["Medial","superficial","Proximal","distal"],"answer":2,"explanation":"الـ proximal = أقرب للـ trunk أو لمكان اتصال الطرف. الـ distal = أبعد.","memoryTrick":"Proximal = Proximity (قريب).","stemAr":"المصطلح اللي معناه قريب من الـ trunk هو:","whyWrong":["الـ medial ناحية الـ midline.","الـ superficial ناحية السطح.",null,"الـ distal بعيد عن الـ trunk."]},{"id":"RASHAD-35","topic":"anat","concept":"Anatomical position, planes & terms","source":"RASHAD","stem":"Palmar surface means:","options":["the sole of the foot","the anterior surface of the hand","the posterior surface of the hand","the posterior surface of the foot"],"answer":1,"explanation":"الـ palmar surface = الـ anterior surface of the hand.","memoryTrick":"Palmar = قدام الإيد.","stemAr":"الـ palmar surface معناها:","whyWrong":["الـ sole.",null,"الـ dorsum.","مش لليد."]},{"id":"RASHAD-36","topic":"anat","concept":"Movements","source":"RASHAD","stem":"Adduction of the fingers means:","options":["Moving the finger away from the body","Moving the finger away from the middle finger","Moving the finger towards the middle finger","Moving the finger towards the body"],"answer":2,"explanation":"الإجابة المعتمدة: الـ adduction في الأصابع = تقريبها ناحية الـ middle finger. (الـ adduction عمومًا = moving towards the median plane).","memoryTrick":null,"stemAr":"الـ adduction للأصابع معناها:","whyWrong":["⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","ده الـ abduction (بعيد عن الـ middle finger).",null,"⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"RASHAD-37","topic":"anat","concept":"Bone structure, blood supply & growth","source":"RASHAD","stem":"Regarding the primary ossification center all are true except:","options":["it appears in the diaphysis","it form the shaft","it appears during intrauterine life","it form the epiphysis"],"answer":3,"explanatio الـ sphenoid فيه sinus.","الـ maxilla فيها sinus.","الـ frontal فيه sinus."]},{"id":"RASHAD-40","topic":"anat","concept":"Movements","source":"RASHAD","stem":"Regarding terms of movements one is wrong:","options":["Flexion is forward movement except at knee joint","Adduction is movement away from the midline","Pivot joint is a uniaxial","Shoulder joint is polyaxial"],"answer":1,"explanation":"الغلط B: الـ adduction = moving towards the median plane، والـ abduction = moving away.","memoryTrick":"Add = نضيف للنص.","stemAr":"بخصوص مصطلحات الحركة، واحدة غلط:","whyWrong":["⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.",null,"⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"RASHAD-41","topic":"anat","concept":"Anatomical position, planes & terms","source":"RASHAD","stem":"Anatomical position means all the following except:","options":["Body is erect","Arms are adducted","Palms of the hands are facing backwards","Legs are close to each other","Face is directed forwards"],"answer":2,"explanation":"الغلط C: في الـ anatomical position الـ palms بتبص لقدام مش لورا.","memoryTrick":"Palms Forward.","stemAr":"الـ anatomical position معناه كل دول ما عدا:","whyWrong":["صح.","صح.",null,"صح.","صح."]},{"id":"SCALP-01","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"Regarding Scalp, all are true Except:","options":["Its wounds bleed profusely.","Its wounds gape if the aponeurosis is cut.","It has no sebaceous glands.","Its veins communicate with the intracranial venous sinuses.","It contains a muscle of facial expression."],"answer":2,"explanation":"الغلط C: جلد الـ scalp فيه sebaceous glands و hair follicles كتير.","memoryTrick":"Scalp = مليان sebaceous glands.","stemAr":"بخصوص الـ scalp، كل دول صح ما عدا:","whyWrong":["جملة صح: الـ connective tissue بيمنع الأوعية تنكمش فالنزيف بيبقى profuse.","جملة صح: لو الـ aponeurosis اتقطعت الجرح بيفتح (gaping).",null,"جملة صح: الـ emissary veins (valveless) بتوصل أوردة الـ scalp بالـ diploic veins والـ venous sinuses.","جملة صح: فيه الـ occipitofrontalis (بيرفع الحواجب في تعبيرات المفاجأة)."]},{"id":"SCALP-02","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"choose one correct statement regarding the scalp:","options":["Its wounds gape if superficial to aponeurosis.","Its blood vessels and nerves lie in the loose areolar connective tissue layer.","Its wounds do not bleed easily.","Bleeding beneath the periosteum usually extends under its whole extent.","Its infections can spread through emissary veins to cranial cavity."],"answer":4,"explanation":"الصح E: الـ emissary veins بتفتح في الـ loose areolar tissue وبتنقل أي infection لجوه (الـ venous sinuses).","memoryTrick":"Emissary veins = طريق العدوى.","stemAr":"اختاري جملة واحدة صح عن الـ scalp:","whyWrong":["بالعكس: الجرح فوق الـ aponeurosis مش بيفتح. الـ gaping لما الـ aponeurosis نفسها تتقطع.","الأوعية والأعصاب في الـ connective tissue layer (الطبقة التانية).","بالعكس: الجروح بتنزف profuse.","الـ pericranium firmly adherent للـ sutures.",null]},{"id":"SCALP-03","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"Regarding the scalp the following statements are true Except: -","options":["Infection from scalp wounds can spread to superior sagittal sinus.","Its blood vessels run in the loose subaponeurotic space.","Its skin, superficial fascia and aponeurosis move as one layer.","Frontal bellies of occipito-frontalis can corrugate skin of forehead.","Occipital bellies are supplied by facial nerve."],"answer":1,"explanation":"الغلط B: الأوعية والأعصاب في الـ connective tissue layer (الطبقة التانية) مش في الـ loose subaponeurotic space.","memoryTrick":"الأوعية في الـ C (Connective tissue).","stemAr":"بخصوص الـ scalp، كل الجمل دي صح ما عدا:","whyWrong":["صح.",null,"صح.","صح.","صح."]},{"id":"SCALP-04","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"The plane of movement of the scalp is between:","options":["Skin and epicranial aponeurosis.","Epicranial aponeurosis (galea aponeurotica) and pericranium.","Skin and subcutaneous","Pericranium and skull.","None or the above."],"answer":1,"explanation":"الـ scalp (أول 3 طبقات) بيتحرك كوحدة واحدة فوق الـ loose areolar tissue، يعني بين الـ aponeurosis والـ pericranium.","memoryTrick":"الحركة على الـ L (Loose).","stemAr":"مستوى حركة الـ scalp بيكون بين:","whyWrong":["الجلد والـ aponeurosis بيتحركوا مع بعض كوحدة.",null,"الجلد والـ subcutaneous لازقين.","الـ pericranium لازق في العظم.","فيه إجابة صح."]},{"id":"SCALP-05","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"Bleeding beneath the pericranium of the scalp:","options":["Spreads underneath all of the scalp.","Makes a swelling that takes the shape of the underlying bone.","Reaches to the upper eyelids.","Reaches to the back of neck.","Reaches the extradural space."],"answer":1,"explanation":"الـ pericranium loosely attached للعظم لكن firmly adherent للـ sutures، فالنزيف تحته بيتحصر في حدود العظمة وبياخد شكلها. أما النزيف في الـ loose areolar tissue فبيعمل swelling في الـ scalp كله و black eye.","memoryTrick":"تحت الـ pericranium = شكل العظمة.","stemAr":"النزيف تحت الـ pericranium بتاع الـ scalp:","whyWrong":["النزيف تحت الـ pericranium بيتحصر بالـ sutures.",null,"اللي بيوصل للعين (black eye) النزيف في الـ loose areolar tissue.","النزيف تحت الـ pericranium بيتحصر بالـ sutures.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"SCALP-06","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"which of the following layers of tile scalp does infection tend to spread:","options":["Skin.","Connective tissue layer.","Aponeurotic layer","Loose areolar tissue layer.","Periosteal layer."],"answer":3,"explanation":"العدوى بتنتشر بسهولة في الـ loose areolar tissue layer.","memoryTrick":"Loose = ينتشر بسهولة.","stemAr":"العدوى بتميل تنتشر في أنهي طبقة من طبقات الـ scalp؟","whyWrong":["سطحي.","العدوى فيه بتفضل محصورة بالألياف.","طبقة وترية.",null,"بيحصر."]},{"id":"SCALP-07","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"The large blood vessels of the scalp found in the:","options":["Skin.","Subcutaneous tissue.","Epicranial aponeurosis.","Subaponeurotic tissue.","Pericranium."],"answer":1,"explanation":"الـ connective tissue (dense subcutaneous tissue) فيها أوعية وأعصاب الـ scalp، والألياف بتمنع الأوعية تنكمش بعد الجرح فالنزيف بيبقى profuse.","memoryTrick":"C = الأوعية (Connective).","stemAr":"الـ blood vessels الكبيرة في الـ scalp موجودة في:","whyWrong":["مش في الجلد.",null,"مش في الـ aponeurosis.","الـ loose areolar tissue فيها emissary veins وشوية small arteries، مش الأوعية الكبيرة.","مش في الـ pericranium."]},{"id":"MONA-01","topic":"embryo","concept":"Gametogenesis","source":"MONA","stem":"The part of the sperm containing proteolytic enzymes to digest the zona pellucida is the:","options":["capacitor","head","corona","acrosome","cumulus"],"answer":3,"explanation":"الـ head فيه الـ nucleus ومتغطي من قدام بالـ acrosome. الـ acrosome فيه digestive enzymes، وفي الـ acrosomal reaction بيطلّع proteolytic enzymes (زي trypsin-like substances) بتساعد الـ sperm يعدّي الـ zona pellucida.","memoryTrick":"Acrosome = الإنزيمات.","stemAr":"الجزء في الـ sperm اللي فيه proteolytic enzymes بتهضم الـ zona pellucida هو:","whyWrong":["مفيش جزء في الـ sperm اسمه capacitator. الـ capacitation عملية adaptation للـ sperm في الـ female genital tract.","الـ head فيه الـ nucleus والـ acrosome، لكن الإنزيمات نفسها جوه الـ acrosome، فهو الإجابة الأدق.","الـ corona radiata من الأغلفة اللي حوالين الـ ovum، مش جزء من الـ sperm.",null,"الـ cumulus مش من أجزاء الـ sperm."]},{"id":"MONA-02","topic":"embryo","concept":"Gametogenesis","source":"MONA","stem":"The ovulated mammalian oocyte is arrested at:","options":["prophase of meiosis I","metaphase of meiosis I","prophase of meiosis II","metaphase of meiosis II","none of the above"],"answer":3,"explanation":"عند الـ ovulation الـ secondary oocyte بيدخل الـ meiosis II ويقف في الـ metaphase II، ولو حصل fertilization بيكمّلها في الـ uterine tube ويطلع mature ovum + second polar body.","memoryTrick":"Metaphase II.","stemAr":"الـ oocyte بعد الـ ovulation في الثدييات بيكون واقف (arrested) عند:","whyWrong":["الـ primary oocyte بيقف في الـ prophase I من قبل الولادة، والـ block ده بيتشال عند الـ puberty، فوقت الـ ovulation بيكون كمّل الـ meiosis I.","وقت الـ ovulation الـ oocyte كمّل الـ meiosis I بالفعل وبقى secondary oocyte.","الـ secondary oocyte بيقف في الـ metaphase II مش الـ prophase II.",null,"فيه إجابة صح من الاختيارات."]},{"id":"MONA-03","topic":"embryo","concept":"Implantation & second week","source":"MONA","stem":"The seven-day blastocyst:","options":["has a single layer of trophoblast at the embryonic pole","has an amniotic cavity","is attached to the endometrial epithelium","is surrounded by a degenerating zona pellucida","is called the hypoblast"],"answer":2,"explanation":"الـ implantation بيبدأ حوالي اليوم السادس: الـ blastocyst بيتخلص من الـ zona pellucida (hatching) وبعدين apposition و adhesion مع الـ endometrium. فاليوم السابع بيكون لازق في الـ endometrial epithelium.","memoryTrick":"Day 7 = بيلزق.","stemAr":"الـ blastocyst عمره سبع أيام:","whyWrong":["الـ trophoblast بيتمايز لطبقتين (cyto + syncytio) في الأسبوع التاني.","الـ amniotic cavity بتظهر بعدين جوه الـ epiblast في الأسبوع التاني.",null,"الـ blastocyst بيتخلص من الـ zona (hatching) قبل الـ implantation.","الـ hypoblast طبقة من الـ bilaminar germ disc، مش اسم الـ blastocyst."]},{"id":"MONA-04","topic":"embryo","concept":"Fertilization & cleavage","source":"MONA","stem":"Haploid nuclei that fuse at fertilization are called:","options":["homunculi","mitotic figures","centrioles","nucleoli","pronuclei"],"answer":4,"explanation":"في الـ fertilization الـ sperm (23) والـ oocyte (23) كل واحد بيكوّن pronucleus، والنواتين بيندمجوا فيتكون الـ zygote (46)، وبيظهر الـ zygote في اليوم الأول بـ 2 pronuclei و 2 polar bodies.","memoryTrick":"Pronuclei = قبل النواة.","stemAr":"الـ haploid nuclei اللي بتندمج وقت الـ fertilization اسمها:","whyWrong":["الـ homunculi مش اسم النوى اللي بتندمج.","الـ mitotic figures شكل الـ chromosomes أثناء الـ mitosis.","الـ centrioles ليها دور في الـ cell division وتكوين الـ cilia.","الـ nucleoli بتكوّن الـ rRNA والـ ribosomal subunits.",null]},{"id":"MONA-05","topic":"embryo","concept":"Implantation & second week","source":"MONA","stem":"The first week of human development is characterized by formation of the:","options":["inner cell mass","trophoblast","blastocyst","all of the above"],"answer":3,"repeatOf":"EM2023-25","explanation":"في الأسبوع الأول بيحصل cleavage وتكوين الـ blastocyst اللي فيه inner cell mass و trophoblast، فكلهم صح.","memoryTrick":"Week 1 = Blastocyst بكل أجزاؤه.","stemAr":"الأسبوع الأول من نمو الإنسان بيتميز بتكوين:","whyWrong":["صح بس ناقص، كلهم بيتكونوا.","صح بس ناقص.","صح بس ناقص.",null]},{"id":"MONA-06","topic":"embryo","concept":"Implantation & second week","source":"MONA","stem":"During implantation, the blastocyst:","options":["implants in the endometrium","usually attaches to endometrial epithelium at its embryonic pole","usually implants in the posterior wall of the body of the uterus","causes change in the endometrial tissues","all of the above are correct"],"answer":4,"explanation":"الـ implantation: الـ blastocyst بيندفن في الـ endometrium عن طريق الـ trophoblast، والمكان الطبيعي الـ posterior wall of the uterus near the fundus، وبيحصل decidual reaction (تغيرات في خلايا الـ endometrium). فكل الاختيارات صح.","memoryTrick":"All of the above.","stemAr":"أثناء الـ implantation، الـ blastocyst:","whyWrong":["صح بس ناقص.","صح بس ناقص.","صح بس ناقص.","صح بس ناقص.",null]},{"id":"MONA-07","topic":"embryo","concept":"Gametogenesis","source":"MONA","stem":"Capacitation of the sperm:","options":["is caused by the zona pellucida","occurs in the male","prevents polyspermy","is essential for fertilization","removes the head of the sperm"],"answer":3,"explanation":"الـ capacitation = adaptation للـ sperms في الـ female genital tract (حوالي 7 ساعات). بيحصل تغيير في الـ cell membrane بتاع الـ sperm وبتتشال طبقة glycoprotein (cleaning of the sperm).\nالنتيجة: منطقة الـ acrosomal cap بتتغير فيبقى الـ acrosome reaction ممكن، والـ sperm بيبقى hyperactive. ومن غير capacitation مفيش fertilization.","memoryTrick":"Capacitation = تأشيرة دخول للـ fertilization (بتتعمل جوه الست).","stemAr":"الـ capacitation بتاعة الـ sperm:","whyWrong":["الـ capacitation بتحصل في الـ female genital tract بشيل طبقة الـ glycoprotein، مش بسبب الـ zona.","بتحصل في الـ female genital tract مش في الذكر.","بعد دخول الـ sperm الـ ovum بيعمل cortical and zonal reaction، وده مش الـ capacitation.",null,"الـ capacitation بتشيل طبقة glycoprotein، مش بتشيل الـ head."]},{"id":"MONA-08","topic":"embryo","concept":"Fertilization & cleavage","source":"MONA","stem":"The early stages of cleavage are characterized by:","options":["formation of a hollow ball of cells","formation of the zona pellucida","increase in the size of the cells in the zygote","increase in the number of cells in the zygote","none of the above"],"answer":3,"explanation":"الـ cleavage = سلسلة انقسامات mitotic سريعة بعد الـ fertilization، مش مصحوبة بـ growth، فعدد الخلايا (blastomeres) بيزيد وحجم كل خلية بيصغر مع كل انقسام.","memoryTrick":"العدد يزيد.","stemAr":"المراحل الأولى من الـ cleavage بتتميز بـ:","whyWrong":["الـ hollow ball (فيه blastocele) ده الـ blastocyst، بيتكون بعد الـ morula.","الـ zona pellucida موجودة حوالين الـ ovum من الأول، والـ blastomeres بتفضل جواها.","بالعكس، حجم الخلايا بيصغر مع كل انقسام.",null,"فيه إجابة صح من الاختيارات."]},{"id":"MONA-09","topic":"embryo","concept":"Implantation & second week","source":"MONA","stem":"The most common site for implantation in ectopic pregnancy is:","options":["internal os of the uterus","mesentery","ovary","uterine tube","other"],"answer":3,"explanation":"بعد الـ implantation الطبيعي بيكون في الـ posterior wall of the uterus near the fundus. الـ abnormal implantation بره الرحم: 95% في الـ fallopian tube، أو في الـ ovary، أو في الـ peritoneal wall. وجوه الرحم: placenta previa.","memoryTrick":"Ectopic = Tube (95%).","stemAr":"أشهر مكان للـ implantation في الـ ectopic pregnancy هو:","whyWrong":["الـ implantation عند الـ internal os جوه الرحم = placenta previa.","الـ peritoneal implantation بره الرحم، لكنه مش الأشهر.","الـ ovary من أماكن الـ implantation بره الرحم، لكنه مش الأشهر.",null,"فيه إجابة صح من الاختيارات."]},{"id":"MONA-10","topic":"embryo","concept":"Fertilization & cleavage","source":"MONA","stem":"With the light microscope, the zona pellucida appears as a translucent membrane surrounding the:","options":["primary oocyte","zygote","morula","very early blastocyst","all of the above are correct"],"answer":4,"explanation":"الـ zona pellucida بتظهر حوالين الـ oocyte من مرحلة الـ primary follicle، وبتفضل حوالين الـ zygote والـ blastomeres والـ morula، لحد ما الـ blastocyst يتخلص منها (hatching) قبل الـ implantation.","memoryTrick":"Zona = لحد الـ hatching.","stemAr":"بالـ light microscope، الـ zona pellucida بتظهر كغشا شفاف حوالين:","whyWrong":["صح بس ناقص.","صح بس ناقص.","صح بس ناقص.","صح بس ناقص.",null]},{"id":"MONA-11","topic":"embryo","concept":"Implantation & second week","source":"MONA","stem":"The amniotic cavity develops:","options":["on the tenth day","within the outer cell mass","within the inner cell mass near the cytotrophoblast","in extraembryonic mesoderm","none of the above"],"answer":2,"explanation":"الـ amniotic cavity بتظهر كـ cavity صغيرة جوه الـ epiblast (من الـ inner cell mass)، وخلايا الـ epiblast اللي جنب الـ cytotrophoblast اسمها amnioblasts.","memoryTrick":"جوه الـ ICM.","stemAr":"الـ amniotic cavity بتتكون:","whyWrong":["⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","الـ outer layer بتاع الـ blastocyst هو الـ trophoblast، والـ amniotic cavity جوه الـ inner cell mass.",null,"الـ cavities في الـ extraembryonic mesoderm بتكوّن الـ chorionic cavity.","فيه إجابة صح من الاختيارات."]},{"id":"MONA-12","topic":"embryo","concept":"Implantation & second week","source":"MONA","stem":"During the second week of development, the trophoblast differentiates into:","options":["syncytiotrophoblast","ectoderm","intraembryonic mesoderm","yolk sac (secondary)"],"answer":0,"explanation":"في الأسبوع التاني الـ trophoblast بيتمايز لـ:\n• Cytotrophoblast: inner layer من mononucleated cells.\n• Syncytiotrophoblast: outer multinucleated zone من غير cell boundaries.","memoryTrick":"Week 2 = Two (Syncytio + Cyto).","stemAr":"في الأسبوع التاني من النمو، الـ trophoblast بيتمايز لـ:","whyWrong":[null,"الـ ectoderm مش من تمايز الـ trophoblast.","الـ intraembryonic mesoderm مش من تمايز الـ trophoblast.","الـ yolk sac مرتبط بالـ hypoblast (الـ exocoelomic membrane)، مش الـ trophoblast."]},{"id":"MONA-13","topic":"embryo","concept":"Implantation & second week","source":"MONA","stem":"The first two intraembryonic germ layers to differentiate are the:","options":["ectoderm and hypoblast","epiblast and hypoblast","ectoderm and endoderm","ectoderm and mesoderm"],"answer":1,"explanation":"في الأسبوع التاني الـ inner cell mass بيتمايز لـ bilaminar germ disc: epiblast (high columnar ناحية الـ amniotic cavity) و hypoblast (small cuboidal ناحية الـ blastocyst cavity).","memoryTrick":"Epi + Hypo أولًا.","stemAr":"أول اتنين intraembryonic germ layers بيتمايزوا هما:","whyWrong":["أول طبقتين هما epiblast و hypoblast، والـ ectoderm مش منهم.",null,"أول طبقتين هما epiblast و hypoblast.","أول طبقتين هما epiblast و hypoblast."]},{"id":"MONA-14","topic":"embryo","concept":"Implantation & second week","source":"MONA","stem":"The blastocoele becomes the:","options":["amniotic cavity","extraembryonic coelom","primary yolk sac","chorionic cavity","secondary cavity"],"answer":2,"explanation":"الـ exocoelomic (Heuser's) membrane بتمتد من الـ hypoblast وبتحيط بالـ blastocyst cavity، فالـ cavity دي تتسمى primitive (primary) yolk sac.","memoryTrick":"Blastocoele ➜ Primary yolk sac.","stemAr":"الـ blastocoele بيتحول لـ:","whyWrong":["الـ amniotic cavity بتظهر جوه الـ epiblast.","الـ extraembryonic coelom هو الـ chorionic cavity، وبيتكون جوه الـ extraembryonic mesoderm.",null,"الـ chorionic cavity بتتكون جوه الـ extraembryonic mesoderm.","مش هو الاسم اللي الـ blastocele بيتحول له."]},{"id":"MONA-15","topic":"embryo","concept":"Implantation & second week","source":"MONA","stem":"The bilaminar germ disc:","options":["consists of epiblast and mesoblast","is derived from the outer cells of the morula","forms the embryo proper","synthesizes human chorionic gonadotropin, HCG"],"answer":2,"explanation":"الـ bilaminar germ disc (epiblast + hypoblast) بيتكون من الـ inner cell mass (future embryo)، فهو اللي بيكوّن الـ embryo proper. أما الـ hCG فبيفرزه الـ syncytiotrophoblast.","memoryTrick":"Disc = الجنين نفسه.","stemAr":"الـ bilaminar germ disc:","whyWrong":["الـ bilaminar disc = epiblast + hypoblast، مش mesoblast.","الـ disc من الـ inner cell mass، مش من الخلايا الخارجية (اللي بتبقى trophoblast).",null,"الـ hCG بيفرزه الـ syncytiotrophoblast."]},{"id":"MONA-16","topic":"embryo","concept":"Fetal membranes & placenta","source":"MONA","stem":"The wall of the chorionic sac is composed of:","options":["cytotrophoblast and syncytiotrophoblast","two layers of trophoblast lined by extraembryonic somatic mesoderm","trophoblast and exocoelomic membrane","extraembryonic splanchnic mesoderm and both layers of trophoblast","none of the above"],"answer":1,"explanation":"الـ chorion هو أبعد fetal membrane حوالين الـ embryo، ومكوّن من:\n1. Extraembryonic somatic mesoderm.\n2. Cytotrophoblast.\n3. Syncytiotrophoblast.","memoryTrick":"Chorion = Trophoblast (cyto + syncytio) + Somatic mesoderm.","stemAr":"جدار الـ chorionic sac مكوّن من:","whyWrong":["ناقص الطبقة التالتة: الـ extraembryonic somatic mesoderm.",null,"الـ exocoelomic membrane بتحيط بالـ blastocyst cavity وتحولها لـ primitive yolk sac، مش جزء من الـ chorion.","الـ chorion مبطن بالـ somatic مش الـ splanchnic mesoderm.","فيه إجابة صح من الاختيارات."]},{"id":"MONA-17","topic":"embryo","concept":"Fetal membranes & placenta","source":"MONA","stem":"The most distinctive characteristic of a primary chorionic villus is its:","options":["cytotrophoblastic shell","extraembryonic somatic mesodermal core","bushy appearance","cytotrophoblastic core"],"answer":3,"explanation":"الإجابة المعتمدة: الـ primary chorionic villus مميز بإن الـ core بتاعه cytotrophoblast. الـ primary chorionic villi بتظهر في اليوم 13 تقريبًا.","memoryTrick":null,"stemAr":"أكتر صفة مميزة للـ primary chorionic villus هي:","whyWrong":["⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.",null],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"MONA-18","topic":"embryo","concept":"Implantation & second week","source":"MONA","stem":"Implantation of human embryos typically occurs:","options":["about 1 day after fertilization","about one week (i.e. 7 days) after fertilization","about two weeks (i.e. 14 days) after fertilization","after gastrulation","at the same time as neural tube closure F) NONE of the above"],"answer":1,"explanation":"الـ implantation بتبدأ حوالي اليوم السادس بعد الـ fertilization (آخر الأسبوع الأول) وبتخلص في اليوم 11 أو 12.","memoryTrick":"Implantation: تبدأ Day 6 وتخلص Day 11-12.","stemAr":"الـ implantation للـ human embryos بيحصل عادةً:","whyWrong":["بعد يوم واحد لسه في الـ cleavage (أول cleavage بعد حوالي 30 ساعة) جوه الـ fallopian tube.",null,"في اليوم 14 الـ implantation بيكون خلص بالفعل (بيخلص يوم 11-12).","الـ implantation بيبدأ حوالي اليوم 6، يعني في آخر الأسبوع الأول، مش بعد مراحل لاحقة.","الـ implantation بيبدأ حوالي اليوم 6، قبل مراحل زي قفل الـ neural tube بكتير."]},{"id":"HIST-01","topic":"histo","concept":"Cytoplasmic organelles","source":"HIST","stem":"Which of the following is not a membranous organelles","options":["Lysosomes","Peroxisome","Mitochondria","Ribosomes"],"answer":3,"explanation":"الـ organelles نوعين:\n• Membranous: plasma membrane، mitochondria، ER، Golgi، lysosomes، peroxisomes.\n• Non-membranous: ribosomes، cytoskeleton، proteasomes.","memoryTrick":"Ribosome = بدون غشاء.","stemAr":"أنهي واحد من دول مش membranous organelle؟","whyWrong":["الـ lysosomes membranous.","الـ peroxisome membranous.","الـ mitochondria double membrane.",null]},{"id":"HIST-02","topic":"histo","concept":"Cytoplasmic organelles","source":"HIST","stem":"Which organelle is considered the powerhouse of the cell","options":["RER","SER","Golgi apparatus","Mitochondria"],"answer":3,"explanation":"الـ mitochondria فيها الإنزيمات اللازمة للـ aerobic respiration وإنتاج الطاقة، وعشان كده اسمها power-house of the cell. الطاقة بتتخزن كـ ATP عن طريق الـ oxidative phosphorylation.","memoryTrick":"Mito = ⚡ ATP.","stemAr":"أنهي organelle يعتبر الـ powerhouse (محطة الطاقة) بتاع الخلية؟","whyWrong":["الـ rER لتصنيع البروتين.","الـ sER للـ lipids والـ steroids والـ detoxification.","الـ Golgi للـ packing وتعديل البروتينات.",null]},{"id":"HIST-03","topic":"histo","concept":"Cytoplasmic organelles","source":"HIST","stem":"What are folds on the inner mitochondria membrane called","options":["Plasmalemma","Glycocalyx","Protoplasm","Cristae"],"answer":3,"explanation":"الـ inner mitochondrial membrane بيعمل طيات شبه الرفوف اسمها cristae، بتزوّد مساحة السطح، وعددها بيتناسب مع احتياج الخلية للطاقة.","memoryTrick":"Cristae.","stemAr":"الطيّات (folds) اللي في الـ inner mitochondrial membrane اسمها إيه؟","whyWrong":["الـ cell membrane.","الـ cell coat.","الـ protoplasm مش اسم طيات الـ mitochondria. الطيات دي اسمها cristae.",null]},{"id":"HIST-04","topic":"histo","concept":"Cytoplasmic organelles","source":"HIST","stem":"The cytoplasmic organelle which contains DNA&RNa","options":["RER","SER","Lysosomes","Mitochondria"],"answer":3,"explanation":"الـ mitochondria عندها genetic apparatus خاص: circular DNA و mRNA و tRNA و rRNA في الـ matrix.","memoryTrick":"Mitochondria = DNA.","stemAr":"الـ cytoplasmic organelle اللي فيه DNA و RNA:","whyWrong":["الـ RER مفيهوش DNA.","الـ SER مفيهوش DNA.","الـ lysosomes مفيهاش DNA.",null]},{"id":"HIST-05","topic":"histo","concept":"Cytoplasmic organelles","source":"HIST","stem":"Membranous organelles is prominent in the cells that synthesize steroids hormones","options":["RER","SER","Mitochondria","Golgi apparatus"],"answer":1,"explanation":"الـ sER بيكون well-developed في الخلايا اللي بتصنع fat و steroid hormones (زي الـ adrenal cortex والـ endocrine cells والـ liver cells). من وظايفه تصنيع الـ steroid hormones (cortisone و testosterone).","memoryTrick":"Steroid = Smooth.","stemAr":"أنهي membranous organelle بيكون واضح في الخلايا اللي بتصنع steroid hormones؟","whyWrong":["الـ rER لتصنيع البروتين، والـ steroids مش بروتينات.",null,"الـ mitochondria وظيفتها الأساسية الـ cell respiration وإنتاج الطاقة (ATP)، مش هي الـ organelle المميزة لتصنيع الـ steroids.","الـ Golgi شغله packing و concentration وتعديل البروتينات اللي جاية من الـ rER، مش تصنيع الـ steroids."]},{"id":"HIST-06","topic":"histo","concept":"Cytoplasmic organelles","source":"HIST","stem":"Two organelles share in the formation of lysosomes","options":["RER&SER","SER& Golgi","RER& Golgi","Golgi & cell membrane"],"answer":2,"explanation":"الـ lysosomes بتتكون بمشاركة الـ rER (تصنيع الإنزيمات) والـ Golgi (التغليف).","memoryTrick":"rER + Golgi.","stemAr":"اتنين organelles بيشاركوا في تكوين الـ lysosomes:","whyWrong":["الـ SER مش بيصنع الإنزيمات.","نفس الكلام.",null,"الـ cell membrane مش بيشارك."]},{"id":"HIST-07","topic":"histo","concept":"Cytoplasmic organelles","source":"HIST","stem":"Which of these organelles is abundant in macrophages?","options":["Ribosomes","RER","Golgi apparatus","Lysosomes"],"answer":3,"explanation":"الـ lysosomes بتكون abundant في الـ phagocytic cells (الـ macrophages والـ neutrophils)، وفيها بتكون كبيرة لدرجة إنها تتشاف بالـ LM.","memoryTrick":"Macrophage = Lysosome-rich.","stemAr":"أنهي organelle من دول بيكون كتير في الـ macrophages؟","whyWrong":["الـ ribosomes كتير في الخلايا اللي بتصنع بروتين.","الـ RER كتير في الـ secretory cells.","الـ Golgi كتير في الـ secretory cells.",null]},{"id":"HIST-08","topic":"histo","concept":"Cytoplasmic organelles","source":"HIST","stem":"When a primary lysosomes Fuses with pinocytic vesicles ,it became","options":["Auto lysosomes","Residual bodies","Heterolysosomes","Multivesicular bodies"],"answer":3,"explanation":"اندماج الـ primary lysosome مع pinocytic vesicles بيكوّن الـ multivesicular body.","memoryTrick":"Pino + Lysosome = Multivesicular.","stemAr":"لما الـ primary lysosome يندمج مع pinocytic vesicles بيبقى:","whyWrong":["الـ autolysosome بيهضم organelles الخلية.","الـ residual body فضلات بعد الهضم.","الـ heterolysosome بيهضم مواد صلبة من برا.",null]},{"id":"HIST-09","topic":"histo","concept":"Cell membrane & transport","source":"HIST","stem":"What process is nicknamed\"cell drinking\"","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":2,"repeatOf":"EM2019B-10","explanation":"الـ pinocytosis (cell drinking) نوع من الـ endocytosis: invaginations صغيرة في الغشا بتبلع extracellular fluid وتكوّن pinocytic vesicles. أما الـ phagocytosis (cell eating) فلبلع المواد الصلبة.","memoryTrick":"Pino = Pint (شرب) / Phago = أكل.","stemAr":"أنهي عملية اسمها الشائع \"cell drinking\" (شرب الخلية)؟","whyWrong":["الـ endocytosis مصطلح عام بيشمل الـ phagocytosis والـ pinocytosis والـ receptor-mediated endocytosis.","الـ exocytosis إخراج محتوى vesicle لبره الخلية.",null,"الـ phagocytosis = cell eating (بلع مواد صلبة)."]},{"id":"HIST-10","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"HIST","stem":"The wall of the centrioles is formed of...... Microtubules","options":["9","20","27","18"],"answer":2,"explanation":"جدار الـ centriole = 9 triplets = 27 microtubule.","memoryTrick":"9×3 = 27.","stemAr":"جدار الـ centrioles مكوّن من ...... microtubule","whyWrong":["9 عدد الـ triplets مش الـ microtubules.","20 للـ cilium axoneme.",null,"18 = 9 doublets من غير الاتنين اللي في النص."]},{"id":"HIST-11","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"HIST","stem":"The axoneme of the cilia has.... Microtubules","options":["9","18","20","27"],"answer":2,"explanation":"الـ axoneme بتاع الـ cilium = 9 doublets + 2 central = 20 microtubule.","memoryTrick":"9×2+2 = 20.","stemAr":"الـ axoneme بتاع الـ cilia فيه .... microtubule","whyWrong":["9 عدد المجموعات.","18 من غير الـ central pair.",null,"27 للـ centriole."]},{"id":"HIST-12","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"HIST","stem":"The flagella has ...... Microtubules","options":["9","18","20","27"],"answer":2,"explanation":"الـ flagellum نفس تركيب الـ cilium: 9×2+2 = 20 microtubule.","memoryTrick":"Flagellum = Cilium = 20.","stemAr":"الـ flagella فيها ...... microtubule","whyWrong":["9 عدد المجموعات.","18 من غير الـ central pair.",null,"27 للـ centriole."]},{"id":"HIST-13","topic":"histo","concept":"Inclusions, pigments & stains","source":"HIST","stem":"All of the below are exogenous pigments expect","options":["Carotene","Carbon","Lipofuscin","All of the above are exogenous pigments"],"answer":2,"explanation":"الـ lipofuscin endogenous pigment: waste products بتتجمع مع السن في الـ cardiac muscle والـ nerve cells. أما الـ carotene والـ carbon فـ exogenous.","memoryTrick":"Lipofuscin = من جوه (شيخوخة).","stemAr":"كل دول exogenous pigments ما عدا:","whyWrong":["الـ carotene exogenous (من الأكل زي الجزر).","الـ carbon & dust particles exogenous (في الـ dust cells بتاعة الرئة).",null,"الـ lipofuscin endogenous، فمش كلهم exogenous."]},{"id":"HIST-14","topic":"histo","concept":"Inclusions, pigments & stains","source":"HIST","stem":"Fat can be demonstrated by using","options":["Best's carmine","PAS","Sudan black stain","None of the above"],"answer":2,"explanation":"الـ fat بيتصبغ بالـ Sudan III (orange globules) أو الـ Sudan black (black globules). في الـ H&E بيدوب ويبان vacuoles (signet ring). أما الـ Best's carmine والـ PAS فللـ glycogen.","memoryTrick":"Sudan = Fat.","stemAr":"الدهون (fat) ممكن تتبيّن باستخدام:","whyWrong":["الـ Best's carmine للـ glycogen.","الـ PAS للـ glycogen.",null,"فيه إجابة صح."]},{"id":"HIST-15","topic":"histo","concept":"Chromosomes & genetic disorders","source":"HIST","stem":"Duplication of centrioles occurs at","options":["G1 phase","S phase","G2 phase","G0 phase"],"answer":1,"explanation":"الـ centrioles بتتضاعف في الـ S phase (مع الـ DNA).","memoryTrick":"S = كل حاجة تتضاعف.","stemAr":"تضاعف الـ centrioles بيحصل في:","whyWrong":["G1 قبل التضاعف.",null,"G2 بعده.","G0 خلية ساكنة."]},{"id":"HIST-16","topic":"histo","concept":"Cell cycle & division","source":"HIST","stem":"Mitosis is characterized by the following","options":["Exchange of genes","Absence of crossing over","Daughter cell contains n chromosome","Daughter cell is not identical to mother cell"],"answer":1,"explanation":"في الـ mitosis مفيش crossing over، والـ daughter cells متطابقة مع الأم وفيها 2n.","memoryTrick":"Mitosis = نسخة طبق الأصل.","stemAr":"الـ mitosis بيتميز بـ:","whyWrong":["تبادل الجينات = crossing over في الـ meiosis.",null,"الـ mitosis بيدي 2n.","الـ mitosis بيدي خلايا متطابقة."]},{"id":"HIST-17","topic":"histo","concept":"Chromosomes & genetic disorders","source":"HIST","stem":"Karyotyping of chromosomes are done in","options":["Prophase","Anaphase","Metaphase","Telophase"],"answer":2,"explanation":"الإجابة المعتمدة: الـ karyotyping بيتعمل في الـ metaphase. في الـ metaphase الـ chromosomes بتترص على الـ equatorial plane (metaphase plate).","memoryTrick":null,"stemAr":"الـ karyotyping للـ chromosomes بيتعمل في:","whyWrong":["⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.",null,"⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"HIST-18","topic":"histo","concept":"Cell cycle & division","source":"HIST","stem":"Colchicine chromatids from separating during mitosis at","options":["Prophase","Anaphas ","concept":"Enzyme classification","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"An enzyme catalyzing an oxidation-reduction reaction belongs to which class?","options":["Ligase","Hydrolase","Oxidoreductase","Isomerase"],"answer":2,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-012","topic":"biochem","concept":"Enzyme classification","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A kinase transfers a phosphate group from one molecule to another. It is a:","options":["Transferase","Lyase","Hydrolase","Isomerase"],"answer":0,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-013","topic":"biochem","concept":"Enzyme classification","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"An enzyme breaks a peptide bond through the addition of water. Its class is:","options":["Ligase","Hydrolase","Isomerase","Oxidoreductase"],"answer":1,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-014","topic":"biochem","concept":"Enzyme classification","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"An enzyme joins two substrates with energy derived from ATP. It is most likely a:","options":["Lyase","Ligase","Mutase","Oxidase"],"answer":1,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-015","topic":"biochem","concept":"Enzyme classification","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"An enzyme converts a compound into a different isomer without changing its molecular formula. Which class fits best?","options":["Isomerase","Hydrolase","Ligase","Oxidoreductase"],"answer":0,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-016","topic":"biochem","concept":"Catalytic mechanisms","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"The region of an enzyme that binds substrate and performs catalysis is the:","options":["Allosteric site","Active site","Protein scaffold","Signal peptide"],"answer":1,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-017","topic":"biochem","concept":"Catalytic mechanisms","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"Catalysis by proximity increases reaction rate mainly by:","options":["Decreasing enzyme concentration","Orienting substrates close together","Removing all solvent from the cell","Changing the reaction equilibrium"],"answer":1,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-018","topic":"biochem","concept":"Catalytic mechanisms","source":"FIGHTER","banks":["FIGHTER"],"stem":"Acid-base catalysis involves:","options":["Transfer of protons","Transfer of electrons only","Permanent destruction of the enzyme","Joining proteins using ATP"],"answer":0,"where":["Enzymes MCQ 1"],"decks":{"FIGHTER":["A-enz1"]}},{"id":"BG-019","topic":"biochem","concept":"Catalytic mechanisms","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"An enzyme briefly forms a covalent bond with its substrate and is restored afterward. This is:","options":["Strain catalysis","Covalent catalysis","Optical specificity","Competitive inhibition"],"answer":1,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-020","topic":"biochem","concept":"Catalytic mechanisms","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A hydrolase distorts a target bond, making cleavage easier. Which mechanism is illustrated?","options":["Strain catalysis","Allosteric activation","Substrate inhibition","Enzyme induction"],"answer":0,"explanation":"الـ strain catalysis: الإنزيم بيشد ويلوي (stretches / distorts) الـ bond المستهدفة فتضعف وتتكسر بسهولة، وده شائع في الـ hydrolases والـ lysozymes (الكتاب ص 60).\nالـ allosteric activation تنظيم من موقع تاني، والـ substrate inhibition والـ enzyme induction مالهمش علاقة بشد الـ bond.","memoryTrick":"Strain = شد الـ bond لحد ما تتقطع ← hydrolases و lysozyme.","decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-021","topic":"biochem","concept":"Enzyme kinetics","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"For a Michaelis-Menten enzyme, Km is the substrate concentration at which velocity equals:","options":["Vmax","One-half Vmax","Twice Vmax","Zero"],"answer":1,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-022","topic":"biochem","concept":"Enzyme kinetics","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A lower Km generally indicates:","options":["Lower substrate affinity","Higher substrate affinity","Higher enzyme concentration","Lower Vmax"],"answer":1,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-023","topic":"biochem","concept":"Enzyme kinetics","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"If enzyme concentration is halved while substrate remains sufficiently available, Vmax will:","options":["Double","Remain unchanged","Be halved","Fall to zero"],"answer":2,"explanation":"الـ rate بتتناسب طرديًا (directly proportional) مع تركيز الإنزيم طالما الـ substrate كفاية. لو الإنزيم اتقسم نصين، الـ V₀ والـ Vmax الاتنين بيبقوا النص (الكتاب ص 61).\nالـ Vmax بتعتمد على عدد الـ active sites الموجودة، فمش ممكن تفضل ثابتة ولا تزيد.","decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-024","topic":"biochem","concept":"Enzyme kinetics","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"At very high substrate concentration, a Michaelis-Menten reaction approaches Vmax because:","options":["All active sites become saturated","Enzyme concentration increases","The substrate becomes an inhibitor","Km becomes zero"],"answer":0,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-025","topic":"biochem","concept":"Enzyme kinetics","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"Two enzymes have equal Vmax values. Enzyme A reaches half-maximal velocity at 2 mM substrate; enzyme B at 10 mM. Which conclusion is best?","options":["B has greater apparent substrate affinity","A has greater apparent substrate affinity","A must have a higher Vmax","Both have the same Km"],"answer":1,"explanation":"الـ Km هو تركيز الـ substrate اللي بيوصل الـ velocity لـ ½ Vmax. إنزيم A وصل للنص عند 2 mM يعني Km أصغر، وإنزيم B محتاج 10 mM يعني Km أكبر.\nالـ Small Km = high affinity، والـ Large Km = low affinity (الكتاب ص 62). والسؤال قال إن الـ Vmax متساوية، فمفيش إنزيم Vmax بتاعه أعلى.","memoryTrick":"Km صغير = بيحب الـ substrate أكتر (affinity عالية).","decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-026","topic":"biochem","concept":"Factors affecting activity","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"The optimum temperature for most human enzymes in the source is approximately:","options":["0–10 C","15–20 C","35–40 C","65–80 C"],"answer":2,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-027","topic":"biochem","concept":"Factors affecting activity","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"Pepsin is most active at approximately which pH?","options":["2","7","9","12"],"answer":0,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-028","topic":"biochem","concept":"Factors affecting activity","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"An enzyme loses activity after exposure to extreme pH. The most likely explanation is:","options":["Permanent increase in substrate affinity","Denaturation or altered active-site ionization","Increased enzyme synthesis","Unchanged protein conformation"],"answer":1,"explanation":"الـ pH بيأثر على الـ protonation بتاع الـ NH₂ groups في الـ active site، والـ extremes of pH بتعمل denaturation للإنزيم (الكتاب ص 62). عشان كده النشاط بيقل.\nالـ pH المتطرف مش بيزوّد الـ affinity ولا بيزوّد تصنيع الإنزيم، وأكيد بيغيّر الـ conformation.","decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-029","topic":"biochem","concept":"Inhibition","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A competitive inhibitor typically produces which kinetic change?","options":["Decreased Km, unchanged Vmax","Increased Km, unchanged Vmax","Unchanged Km, increased Vmax","Decreased Km and Vmax"],"answer":1,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-030","topic":"biochem","concept":"Inhibition","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"Why can increased substrate concentration overcome competitive inhibition?","options":["The inhibitor is degraded","Substrate competes for the active site","The enzyme produces more cofactors","The inhibitor binds only the ES complex"],"answer":1,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-031","topic":"biochem","concept":"Inhibition","source":"FIGHTER","banks":["FIGHTER"],"stem":"Malonate inhibits succinate dehydrogenase. According to the notes, malonate is an example of a:","options":["Competitive inhibitor","Uncompetitive inhibitor","Allosteric activator","Coenzyme"],"answer":0,"where":["Enzymes MCQ 1"],"explanation":"الـ Malonate شبه الـ succinate في التركيب (structural similarity)، فبيتنافس معاه على الـ active site بتاع الـ succinate dehydrogenase. ده تعريف الـ competitive inhibitor بالظبط، وبيتلغي تأثيره لو زودنا الـ substrate (الكتاب ص 63).\nالـ uncompetitive بيرتبط بالـ ES complex بس، ومالوش شبه بالـ substrate.","decks":{"FIGHTER":["A-enz1"]}},{"id":"BG-032","topic":"biochem","concept":"Inhibition","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A drug reduces Vmax but leaves Km unchanged. Under the simplified model in the notes, this indicates:","options":["Competitive inhibition","Pure noncompetitive inhibition","Uncompetitive inhibition","Enzyme activation"],"answer":1,"explanation":"قاعدة الكتاب (ص 64): الـ non-competitive inhibitor بيقلل الـ Vmax والـ Km مش بيتغير، لأنه بيرتبط بمكان غير الـ active site فمش بيأثر على الـ affinity.\nالـ competitive عكسه: Km بيزيد والـ Vmax ثابتة.","memoryTrick":"Non-competitive = Vmax ↓ / Km ثابت.\nCompetitive = Km ↑ / Vmax ثابت.","decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-033","topic":"biochem","concept":"Inhibition","source":"FIGHTER","banks":["FIGHTER"],"stem":"An inhibitor binds only after the enzyme-substrate complex forms. It is classified as:","options":["Competitive","Uncompetitive","Irreversible active-site inhibitor","Homotropic activator"],"answer":1,"where":["Enzymes MCQ 1"],"explanation":"الـ uncompetitive inhibitor بيرتبط بس بالـ ES complex (بعد ما الـ substrate يرتبط بالإنزيم)، والـ Lineweaver-Burk plot بيدّي خط parallel للخط الأصلي (الكتاب ص 64).\nالـ competitive بيرتبط بالإنزيم الحر في الـ active site، والـ homotropic activator ده substrate بيشتغل كـ effector.","memoryTrick":"Uncompetitive = مستني الـ ES complex يتكوّن الأول.","decks":{"FIGHTER":["A-enz1"]}},{"id":"BG-034","topic":"biochem","concept":"Allosteric regulation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"An effector that is itself the enzyme substrate is called:","options":["Heterotropic","Homotropic","Irreversible","Noncompetitive"],"answer":1,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-035","topic":"biochem","concept":"Allosteric regulation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"Why do many cooperative allosteric enzymes show sigmoidal velocity curves?","options":["They are always inactive at high substrate","Binding at one subunit influences other subunits","They never bind substrate","They lack regulatory sites"],"answer":1,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-036","topic":"biochem","concept":"Allosteric regulation","source":"FIGHTER","banks":["FIGHTER"],"stem":"The final product of a pathway inhibits its first enzyme by binding to a regulatory site. This is an example of:","options":["Heterotropic negative feedback","Homotropic activation","Covalent catalysis","Substrate-level phosphorylation"],"answer":0,"where":["Enzymes MCQ 1"],"explanation":"لما الـ final product يرجع يثبط أول إنزيم في الـ pathway، ده اسمه feedback inhibition. ولأن الـ effector هنا مختلف عن الـ substrate، يبقى heterotropic، ولأنه بيثبط يبقى negative effector (الكتاب ص 66).\nالـ homotropic معناه إن الـ substrate نفسه هو الـ effector.","decks":{"FIGHTER":["A-enz1"]}},{"id":"BG-037","topic":"biochem","concept":"Clinical enzymes","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"Which CK isoenzyme is identified in the notes as the cardiac form?","options":["CK-BB","CK-MM","CK-MB","LDH-1"],"answer":2,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-038","topic":"biochem","concept":"Clinical enzymes","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A patient is assessed after suspected myocardial infarction. Which isoenzyme in the notes typically peaks at about 24 hours?","options":["CK-MB","LDH-5","CK-BB","LDH-1"],"answer":0,"explanation":"الـ CK-MB هو الـ cardiac isoenzyme، وبيوصل لأعلى مستوى (peak) بعد حوالي 24 ساعة من الـ myocardial infarction. عشان كده مفيد في التشخيص بدري.\nالـ LDH بيطلع متأخر عنه (peak بعد 2–4 أيام)، والـ CK-BB في المخ.","decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-039","topic":"biochem","concept":"Clinical enzymes","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"An increase in circulating amylase and lipase in a pancreatic disorder is an example of:","options":["Decreased functional plasma enzymes","Nonfunctional plasma enzymes entering circulation","Reduced substrate concentration","Allosteric enzyme inhibition"],"answer":1,"decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-040","topic":"biochem","concept":"Clinical enzymes","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"An enzyme marker rises 12–24 hours after MI, peaks over the next 2–4 days, and returns toward normal by days 8–14. Which marker best matches the notes?","options":["CK-MB","LDH","CK-BB","Alkaline phosphatase"],"answer":1,"explanation":"التوقيت ده بتاع الـ LDH: بيبدأ يزيد بعد 12–24 ساعة من الـ MI، يوصل للـ peak في 2–4 أيام، ويرجع طبيعي بعد 8–14 يوم. عشان كده بيفيد في المريض اللي جاي متأخر.\nالـ CK-MB أسرع بكتير: peak حوالي 24 ساعة ويرجع طبيعي في يومين تلاتة.","memoryTrick":"CK-MB = بدري وبيمشي بدري.\nLDH = متأخر وبيقعد أكتر (لحد أسبوعين).","decks":{"FIGHTER":["A-enz1"],"MEDZONE":["A-enz1"]}},{"id":"BG-041","topic":"biochem","concept":"Inhibition","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A reversible inhibitor resembles the substrate and binds to the active site. Which type is described?","options":["Uncompetitive","Competitive","Pure noncompetitive","Allosteric activation"],"answer":1,"decks":{"FIGHTER":["A-enz2"],"MEDZONE":["A-enz2"]}},{"id":"BG-042","topic":"biochem","concept":"Inhibition","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"Which kinetic pattern is characteristic of competitive inhibition?","options":["Km decreases; Vmax unchanged","Km unchanged; Vmax decreases","Km increases; Vmax unchanged","Both Km and Vmax decrease"],"answer":2,"decks":{"FIGHTER":["A-enz2"],"MEDZONE":["A-enz2"]}},{"id":"BG-043","topic":"biochem","concept":"Inhibition","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"Increasing substrate concentration is most likely to overcome which inhibition?","options":["Competitive","Uncompetitive","Irreversible enzyme poisoning","Pure noncompetitive"],"answer":0,"decks":{"FIGHTER":["A-enz2"],"MEDZONE":["A-enz2"]}},{"id":"BG-044","topic":"biochem","concept":"Inhibition","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"An inhibitor lowers Vmax but does not change Km. Which inhibition is most consistent with this observation?","options":["Competitive","Pure noncompetitive","Uncompetitive","Substrate activation"],"answer":1,"decks":{"FIGHTER":["A-enz2"],"MEDZONE":["A-enz2"]}},{"id":"BG-045","topic":"biochem","concept":"Inhibition","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"Where does a noncompetitive inhibitor bind, according to the chapter?","options":["Only to the substrate","At a site distinct from the active site","Only at the catalytic active site","Only to product molecules"],"answer":1,"decks":{"FIGHTER":["A-enz2"],"MEDZONE":["A-enz2"]}},{"id":"BG-046","topic":"biochem","concept":"Inhibition","source":"FIGHTER","banks":["FIGH
