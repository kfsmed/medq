terol","Lipid bilayer","Phospholipid","Integral protein"],"answer":0,"explanation":"الـ cholesterol بيدخل بين ذيول الـ phospholipids (بنسبة تقريبًا 1:1) وبينظّم الـ fluidity بتاعة الـ membrane.","memoryTrick":"Cholesterol = الحشو بين الذيول.","stemAr":"في التركيب الجزيئي للـ cell membrane، أنهي structure من دول بيملا الفراغ بين ذيول الـ fatty acids بنسبة واحد لواحد؟"},{"id":"F2023B-01","topic":"embryo","concept":"Female cycles & hormones","source":"F2023B","stem":"the secretory phase of the uterus is characterized by which of the following","options":["it is under the influence of progesterone","it starts from the 5th day till 14th day of the cycle","initiate the formation of a new layer of endometrium in the uterus","Thickness of endometrium in this stage is 0.5 mm"],"answer":0,"explanation":"الـ secretory phase بتحصل بعد الـ ovulation تحت تأثير الـ progesterone من الـ corpus luteum (من يوم 15 لـ 28).","memoryTrick":"Secretory = Progesterone (بعد التبويض).","stemAr":"الـ secretory phase بتاعة الـ uterus بتتميز بأنهي واحدة من دول؟"},{"id":"F2023B-02","topic":"embryo","concept":"Implantation & second week","source":"F2023B","stem":"what is the site of blastocyst implantation in placenta previa","options":["the tube","uterine cavity","ovary","rectouterine pouch"],"answer":1,"repeatOf":"EM2022-07","explanation":"في الـ placenta previa الـ implantation بيكون جوه الـ uterine cavity بس في الجزء السفلي قريب من الـ internal os. الـ ovary والـ tube والـ pouch دي ectopic.","memoryTrick":"Previa = جوه الرحم بس تحت.","stemAr":"مكان زرع الـ blastocyst في حالة الـ placenta previa فين؟"},{"id":"F2023B-03","topic":"embryo","concept":"Gametogenesis","source":"F2023B","stem":"Capacitation means which of the followings","options":["adaptation of sperms in female genital tract","Acrosome release proteolytic enzymes such as trypsin like substances.","It is induced by zona pellucida proteins","release of lysosomal enzymes from cortical granules"],"answer":0,"explanation":"الـ capacitation = تهيئة (adaptation) الـ sperm في الـ female genital tract بشيل الـ glycoprotein coat عشان يقدر يخصّب.","memoryTrick":"Capacitation = تأهيل في بيت الست.","stemAr":"الـ capacitation معناها أنهي واحدة من دول؟"},{"id":"F2023B-04","topic":"anat","concept":"Anatomical position, planes & terms","source":"F2023B","stem":"In anatomical position the palm of the hand faces","options":["Anteriorly","Posteriorly","Superiorly","Inferiorly"],"answer":0,"explanation":"في الـ anatomical position الـ palms بتبص لقدام (anteriorly).","memoryTrick":"الكف قدّام 🖐️.","stemAr":"في الـ anatomical position، الـ palm بتبص ناحية:"},{"id":"F2023B-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"F2023B","stem":"which of the followings is responsible for the growth of the length of the bone","options":["periosteum","growing plate","arterial supply","nerve supply"],"answer":1,"explanation":"الـ growing (epiphyseal) plate مسئول عن زيادة طول العظمة. الـ periosteum مسئول عن الـ thickness.","memoryTrick":"طول = Plate / تخن = Periosteum.","stemAr":"أنهي واحد من دول مسئول عن زيادة طول العظمة؟"},{"id":"F2023B-06","topic":"embryo","concept":"Female cycles & hormones","source":"F2023B","stem":"the estrogen is secreted from","options":["granulosa cell","corpus luteum","cells of anterior lobe of pituitary gland","endometrial cells"],"answer":0,"explanation":"الـ estrogen بيتفرز أساسًا من الـ granulosa cells (بمساعدة الـ theca interna) في الـ ovarian follicle.","memoryTrick":"Granulosa = Estrogen.","stemAr":"الـ estrogen بيتفرز من:"},{"id":"F2023B-07","topic":"embryo","concept":"Fertilization & cleavage","source":"F2023B","stem":"which of the followings is true about the fertilization","options":["it occurs usually in the infundibulum of the fallopian tube","chromosomal sex of the embryo is determined at fertilization.","the oocyte remains viable for 5 days","all the sperms can penetrate the zona pellucida"],"answer":1,"explanation":"الـ chromosomal sex بيتحدد لحظة الـ fertilization حسب الـ sperm (X أو Y). الـ fertilization في الـ ampulla، والـ oocyte يعيش 12–24 ساعة، وsperm واحد بس بيدخل.","memoryTrick":"الجنس يتحدد من الأب لحظة التلقيح.","stemAr":"أنهي واحدة من دول صح عن الـ fertilization؟"},{"id":"F2023B-08","topic":"anat","concept":"Movements","source":"F2023B","stem":"Medial rotation means","options":["Moving the limb externally around the long axis","Moving the limb internally around the long axis","Moving the limb upward around horizontal axis","Moving the limb downward around horizontal axis"],"answer":1,"explanation":"الـ medial rotation = لف الطرف لجوه حوالين الـ long axis.","memoryTrick":"Medial = لجوه.","stemAr":"الـ medial rotation معناها:"},{"id":"F2023B-09","topic":"anat","concept":"Anatomical position, planes & terms","source":"F2023B","stem":"Coronal plane divide the body into","options":["Upper and lower halves","Anterior and posterior halves","Right and left halves","Superior and inferior halves"],"answer":1,"explanation":"الـ coronal plane بيقسم الجسم لـ anterior و posterior.","memoryTrick":"Coronal = قدام/ورا.","stemAr":"الـ coronal plane بيقسم الجسم لـ:"},{"id":"F2023B-10","topic":"anat","concept":"Bone structure, blood supply & growth","source":"F2023B","stem":"Bone marrow is supplied by","options":["Periosteal artery","Epiphyseal artery","Nutrient artery"],"answer":2,"explanation":"الـ nutrient artery بتغذي الـ bone marrow.","memoryTrick":"Nutrient = Marrow.","stemAr":"الـ bone marrow بيتغذى من:"},{"id":"F2023B-11","topic":"anat","concept":"Skeleton & types of bones","source":"F2023B","stem":"Which of the following is axial skeleton","options":["Femur","Humerus","Skull","Hip"],"answer":2,"explanation":"الـ skull جزء من الـ axial skeleton. الـ femur والـ humerus والـ hip appendicular.","memoryTrick":"Skull = Axial.","stemAr":"أنهي واحد من دول من الـ axial skeleton؟"},{"id":"F2023B-12","topic":"anat","concept":"Anatomical position, planes & terms","source":"F2023B","stem":"Planter aspect of the foot means","options":["Sole","Palm","Dorsum"],"answer":0,"explanation":"الـ plantar aspect = الـ sole of the foot. الـ palm للإيد والـ dorsum الضهر.","memoryTrick":"Plantar = Planta = باطن القدم.","stemAr":"الـ plantar aspect بتاع القدم معناه:"},{"id":"F2023B-13","topic":"anat","concept":"Skeleton & types of bones","source":"F2023B","stem":"Carpal bones are","options":["Long bone","Short bones","Irregular bones","Pneumatic bone"],"answer":1,"explanation":"الـ carpal bones (والـ tarsal) short bones.","memoryTrick":"Carpal & Tarsal = Short (قصيرين).","stemAr":"الـ carpal bones هي:"},{"id":"F2023B-14","topic":"embryo","concept":"Gametogenesis","source":"F2023B","stem":"which of the followings is the character of oogenesis","options":["starts at puberty and extend till old age","it takes about 64 days","Primary oocyte complete its first meiotic division at puberty","Secondary oocyte completes its 2nd meiotic division at the time of ovulation"],"answer":2,"explanation":"الـ primary oocyte بيفضل واقف في prophase I من قبل الولادة وبيكمل الـ first meiotic division عند البلوغ (قبل الـ ovulation). الـ secondary oocyte بيكمل التانية بس لو حصل fertilization.","memoryTrick":"1st division = Puberty / 2nd = Fertilization.","stemAr":"أنهي واحدة من دول من صفات الـ oogenesis؟"},{"id":"F2023B-15","topic":"embryo","concept":"Fertilization & cleavage","source":"F2023B","stem":"compaction means which of the followings","options":["the blastomere forming a compact ball of cells held together by tight junctions","changes in the zona reaction to prevent further binding and penetration of the sperm","release of the acrosomal enzymes helps penetration of the sperm to the zona pellucida","the ability of the sperm to fertize the ovum"],"answer":0,"explanation":"الـ compaction (حوالي 8 cells) = الـ blastomeres بتلزق في بعض بـ tight junctions وتكوّن compact ball.","memoryTrick":"Compaction = ضغط الخلايا كورة واحدة.","stemAr":"الـ compaction معناها أنهي واحدة من دول؟"},{"id":"F2023B-16","topic":"embryo","concept":"Gametogenesis","source":"F2023B","stem":"morphological changes of spherical spermatids to form elongated sperm is called","options":["spermatogenesis","Spermiogenesis","acrosomal reaction"],"answer":1,"explanation":"الـ spermiogenesis هي تحوّل الـ spermatid المدوّر لـ sperm طويل (بدون انقسام).","memoryTrick":"Spermio = تغيير شكل بس.","stemAr":"التغيرات الشكلية اللي بتحوّل الـ spermatid الكروي لـ sperm طويل اسمها:"},{"id":"F2023B-17","topic":"embryo","concept":"Gametogenesis","source":"F2023B","stem":"the spermlysin lies in which part of the sperm","options":["Head","Neck","Middle piece","Tail"],"answer":0,"explanation":"الـ spermlysin (acrosomal enzymes) موجودة في الـ acrosome على الـ head.","memoryTrick":"Lysin في الراس.","stemAr":"الـ spermlysin موجود في أنهي جزء من الـ sperm؟"},{"id":"F2023B-18","topic":"anat","concept":"Bone structure, blood supply & growth","source":"F2023B","stem":"which of the following is the character of the spongy bone","options":["it forms the out part of any bone","it is consists of number of cylindrical units called Haversian system","It is formed of trabeculae, the lamellae are branching and anastmose with"],"answer":2,"explanation":"الـ spongy bone مكوّن من trabeculae، والـ lamellae بتتفرع وتتشابك (anastomose) وبينهم مسافات فيها marrow. الـ Haversian systems خاصة بالـ compact.","memoryTrick":"Spongy = Trabeculae متشابكة.","stemAr":"أنهي واحدة من دول من صفات الـ spongy bone؟"},{"id":"EM2023-01","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"The function of rough endoplasmic reticulum is to synthesize:","options":["Lipid.","Protein that will be secreted by the cell.","Cytoplasmic protein necessary for the cells' own existence.","Carbohydrates."],"answer":1,"explanation":"الـ rER بيصنع البروتين اللي هيتفرز برا الخلية (secretory) والـ membrane proteins. بروتين الـ cytosol بيتصنع على free ribosomes.","memoryTrick":"Rough = للتصدير / Free = للاستهلاك المحلي.","stemAr":"وظيفة الـ rough endoplasmic reticulum إنه يصنع:"},{"id":"EM2023-02","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"Smooth endoplasmic reticulum:","options":["Sometimes has ribosomes attached to its membrane","Is rarely found in skeletal muscle cells","Areas of localized basophilic indicate its presence","Is present in cells where drug detoxification is taking place"],"answer":3,"explanation":"الـ sER موجود بكثرة في الخلايا اللي بتعمل drug detoxification (زي الـ liver cells). مفيش عليه ribosomes، وموجود بكثرة في الـ skeletal muscle (sarcoplasmic reticulum).","memoryTrick":"Smooth = Detox.","stemAr":"الـ smooth endoplasmic reticulum:"},{"id":"EM2023-03","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"The Golgi apparatus is:","options":["The site of packaging of secretory products of the cell.","The site of protein synthesis.","Continuous with smooth endoplasmic reticulum.","Capable of providing energy."],"answer":0,"explanation":"الـ Golgi apparatus هو مكان الـ packaging والـ modification للـ secretory products.","memoryTrick":"Golgi = مكتب البريد 📦.","stemAr":"الـ Golgi apparatus هو:"},{"id":"EM2023-04","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"Multivesicular bodies are:","options":["Primary lysosomes.","Formed as a result of digestion of solid material.","Formed as a result of digestion of fluid material.","Autophagic vacuoles."],"answer":2,"explanation":"الـ multivesicular bodies بتتكون لما الـ primary lysosome يندمج مع pinocytic vesicles (هضم fluid material).","memoryTrick":"Multivesicular = سوائل (pinocytosis).","stemAr":"الـ multivesicular bodies هي:"},{"id":"EM2023-05","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2023","stem":"Microtubules have important role in:","options":["Carbohydrate metabolism.","Oxidative phosphorylation.","Water balance.","Formation of the mitotic spindle during mitosis."],"answer":3,"explanation":"الـ microtubules بتكوّن الـ mitotic spindle اللي بيشد الـ chromosomes وقت الـ mitosis.","memoryTrick":"Microtubules = Spindle.","stemAr":"الـ microtubules ليها دور مهم في:"},{"id":"EM2023-06","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"DNA could be found in:","options":["Ribosomes.","Golgi apparatus.","Mitochondria.","Lysosomes."],"answer":2,"explanation":"الـ mitochondria فيها DNA دائري خاص بيها (mtDNA).","memoryTrick":"Mitochondria = عندها DNA خاص.","stemAr":"الـ DNA ممكن يتلاقي في:"},{"id":"EM2023-07","topic":"histo","concept":"Nucleus & chromatin","source":"EM2023","stem":"Heterochromatin is:","options":["Present in the nuclei of metabolically active cells.","Special type of stain.","Present in the nuclei of metabolically inactive cells","Type of cell inclusions."],"answer":2,"explanation":"الـ heterochromatin = chromatin مكثّف وغير نشط، بيكثر في الخلايا قليلة النشاط.","memoryTrick":"Hetero = Hidden & Inactive.","stemAr":"الـ heterochromatin هو:"},{"id":"EM2023-08","topic":"histo","concept":"Nucleus & chromatin","source":"EM2023","stem":"The nucleolus is formed of:","options":["Heterochromatin and euchromatin.","Nucleolonema and pars amorpha.","Nucleolus associated and peripheral chromatin.","Condensed chromatin."],"answer":1,"explanation":"الـ nucleolus مكوّن من nucleolonema (الجزء الخيطي) و pars amorpha (الجزء الـ amorphous).","memoryTrick":"Nucleolus = Nema + Amorpha.","stemAr":"الـ nucleolus مكوّن من:"},{"id":"EM2023-09","topic":"histo","concept":"Nucleus & chromatin","source":"EM2023","stem":"The nuclear pore:","options":["Is at regular intervals.","Is bridged by a unit membrane.","Is a transient structure.","Allows for communication between the nucleus and the cytoplasm"],"answer":3,"explanation":"الـ nuclear pores بتسمح بالتواصل وتبادل المواد (زي mRNA والبروتينات) بين النواة والـ cytoplasm.","memoryTrick":"Pore = باب بين النواة والسيتوبلازم.","stemAr":"الـ nuclear pore:"},{"id":"EM2023-10","topic":"histo","concept":"Cell membrane & transport","source":"EM2023","stem":"Glycocalyx is:" ilization.","memoryTrick":"Day 6 = Implantation.","stemAr":"الـ implantation بيبدأ إمتى؟"},{"id":"EM2024-24","topic":"embryo","concept":"Implantation & second week","source":"EM2024","stem":"most common site for implantation in ectopic pregnancy is:","options":["internal Os of uterus","mesentery","ovary","uterine tube"],"answer":3,"explanation":"الـ uterine tube أشهر مكان للـ ectopic pregnancy.","memoryTrick":"Tube.","stemAr":"أشهر مكان للـ implantation في الـ ectopic pregnancy هو:"},{"id":"EM2024-25","topic":"embryo","concept":"Implantation & second week","source":"EM2024","stem":"first week of human development is characterized by formation of:","options":["inner cell mass","trophoblast","blastocyst","all of above"],"answer":3,"explanation":"الأسبوع الأول بيكوّن الـ blastocyst بكل أجزاؤه (ICM و trophoblast).","memoryTrick":"All of the above.","stemAr":"الأسبوع الأول من نمو الإنسان بيتميز بتكوين:"},{"id":"EM2024-26","topic":"embryo","concept":"Gametogenesis","source":"EM2024","stem":"The ovulated mammalian oocyte is arrested at:","options":["prophase of meiosis I","metaphase of meiosis I","prophase of meiosis II","metaphase of meiosis II"],"answer":3,"repeatOf":"EM2023-26","explanation":"الـ oocyte وقت الـ ovulation بيكون secondary oocyte واقف في metaphase of meiosis II لحد ما يحصل fertilization.","memoryTrick":"Ovulation = Metaphase II ✌️.","stemAr":"الـ oocyte بعد الـ ovulation في الثدييات بيكون واقف (arrested) عند:"},{"id":"EM2024-27","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2024","stem":"All but one of following statements about cleavage are true. Except","options":["cleavage occurs when the embryo travels through the Fallopian tube","During cleavage, the amount of DNA inside the embryo increases","Embryo is closed inside zona pellucida during cleavage","Cleavage continues after implantation"],"answer":3,"explanation":"الـ cleavage مش بيكمل بعد الـ implantation.","memoryTrick":"Cleavage قبل الـ implantation.","stemAr":"كل الجمل دي عن الـ cleavage صح ما عدا واحدة:"},{"id":"EM2024-28","topic":"embryo","concept":"Implantation & second week","source":"EM2024","stem":"Which embryonic structure gives rise to cells in our bodies?","options":["epiblast and hypoblast","Hypoblast","Epiblast","Extraembryonic mesoderm"],"answer":2,"repeatOf":"EM2023-28","explanation":"الـ epiblast هو اللي بيدي الـ 3 germ layers (ectoderm, mesoderm, endoderm) وبالتالي كل خلايا الجسم.","memoryTrick":"Epiblast = أبو الجسم كله.","stemAr":"أنهي embryonic structure بيدي خلايا جسمنا؟"},{"id":"ES2024-01","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2024","stem":"All of the following are characters of Golgi apparatus except:","options":["Shows -Ve image in deeply basophilic cytoplasm.","Stained with silver.","Supranuclear in nerve cells.","Has mature trans- face & immature cis- face."],"answer":2,"explanation":"الغلط C: الـ Golgi في الـ nerve cells بيكون perinuclear (حوالين النواة كلها) مش supranuclear. Supranuclear بيكون في الخلايا المفرزة زي الـ thyroid.","memoryTrick":"Neuron = Golgi حوالين النواة (circumnuclear).","stemAr":"كل دول من صفات الـ Golgi apparatus ما عدا:"},{"id":"ES2024-02","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2024","stem":"The basal body of a cilium has a microtubular arrangement which is identical to the pattern found in:","options":["microvilli","centrioles","spindle fibers","stereocilia."],"answer":1,"explanation":"الـ basal body زي الـ centriole بالظبط: 9 triplets microtubules (9×3) من غير central pair.","memoryTrick":"Basal body = Centriole (9×3).","stemAr":"الـ basal body بتاع الـ cilium ترتيب الـ microtubules فيه مطابق للترتيب الموجود في:"},{"id":"ES2024-03","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2024","stem":"The organelle most prominent in steroid secreting cells is:","options":["RER","SER","Lysosomes","Cilia"],"answer":1,"explanation":"الـ sER هو الأوضح في خلايا الـ steroids.","memoryTrick":"Steroid = Smooth.","stemAr":"الـ organelle الأوضح (most prominent) في الخلايا اللي بتفرز steroids هو:"},{"id":"ES2024-04","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2024","stem":"One of the following is a numerical aberration of sex chromosomes:","options":["Turner's syndrome","Down's syndrome","Translocation","Isochromosome"],"answer":0,"explanation":"Turner syndrome (45,X) numerical aberration في الـ sex chromosomes. Down numerical بس في autosome (21)، والـ translocation والـ isochromosome structural.","memoryTrick":"Turner = X واحد ناقص.","stemAr":"واحد من دول numerical aberration في الـ sex chromosomes:"},{"id":"ES2024-05","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2024","stem":"As regards ribosomes:","options":["Their subunits are formed in the nucleolus.","Cause cytoplasmic acidophilia.","Are formed of DNA associated with proteins.","Are formed of two subunits of equal size."],"answer":0,"explanation":"الـ ribosomal subunits بتتكون في الـ nucleolus. الـ ribosomes بتعمل basophilia (مش acidophilia)، ومكونة من rRNA (مش DNA)، والـ subunits مختلفين في الحجم (large & small).","memoryTrick":"Ribosome subunits ⬅ Nucleolus.","stemAr":"بخصوص الـ ribosomes:"},{"id":"ES2024-06","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2024","stem":"Duplication of DNA occurs in:","options":["G1 phase","G2 phase","S phase","Mitosis"],"answer":2,"explanation":"الـ DNA duplication في الـ S phase.","memoryTrick":"S = Synthesis.","stemAr":"تضاعف الـ DNA بيحصل في:"},{"id":"ES2024-07","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2024","stem":"One of the following is an endogenous pigment:","options":["Lead","Carotene","Tattoo","Hemoglobin"],"answer":3,"explanation":"الـ hemoglobin endogenous pigment.","memoryTrick":"Hemoglobin = من جوه.","stemAr":"واحد من دول endogenous pigment:"},{"id":"ES2024-08","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2024","stem":"Which of the following statements is incorrect?","options":["Heterochromatin, as seen in EM, is lighter staining DNA.","The nucleolus is the region within the nucleus where rRNA is formed.","The function of SER includes lipid synthesis.","RER and SER can be continuous"],"answer":0,"explanation":"الغلط A: الـ heterochromatin في الـ EM بيظهر dark (electron-dense) لأنه مكثّف، مش lighter. الـ euchromatin هو الفاتح.","memoryTrick":"Hetero = Dark / Eu = Light.","stemAr":"أنهي جملة من دول غلط؟"},{"id":"ES2024-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2024","stem":"Enzymes associated with drug detoxification are associated with:","options":["SER","RER","Golgi","Mitochondria"],"answer":0,"explanation":"إنزيمات الـ drug detoxification (زي cytochrome P450) موجودة على الـ sER.","memoryTrick":"Detox = Smooth.","stemAr":"الإنزيمات المرتبطة بالـ drug detoxification مرتبطة بـ:"},{"id":"ES2024-10","topic":"anat","concept":"Scalp & face","source":"ES2024","stem":"A 13 years old male patient came to the hospital with bleeding in the scalp region on examination the wound was without gapping, this wound may be in which of the following layers of scalp?","options":["first and second","third","fourth","Fifth"],"answer":0,"explanation":"الجرح اللي مش بيفتح (non-gaping) بيكون في الطبقة الأولى والتانية (skin و dense connective tissue). لو اتقطعت الـ epicranial aponeurosis (التالتة) بالعرض الجرح بيفتح (gaping) بسبب شد الـ occipitofrontalis.","memoryTrick":"Gaping = اتقطعت الـ Aponeurosis (A).","stemAr":"ولد عنده 13 سنة جه المستشفى بنزيف في منطقة الـ scalp، وبالكشف الجرح مكانش مفتوح (without gaping). الجرح ده ممكن يكون في أنهي طبقة من طبقات الـ scalp؟"},{"id":"ES2024-11","topic":"embryo","concept":"Gametogenesis","source":"ES2024","stem":"The secondary oocyte undergoes completion of the second meiotic division:","options":["Before ovulation","At fertilization","Prenatal","At puberty"],"answer":1,"explanation":"الـ secondary oocyte بيكمل الـ second meiotic division بس وقت الـ fertilization (لما الـ sperm يدخل).","memoryTrick":"Meiosis II = Fertilization.","stemAr":"الـ secondary oocyte بيكمّل الـ second meiotic division:"},{"id":"ES2024-12","topic":"embryo","concept":"Implantation & second week","source":"ES2024","stem":"The embryonic epiblast gives rise to the following:","options":["Ectoderm","Mesoderm","Endoderm","All of the above"],"answer":3,"explanation":"الـ epiblast بيدي الـ 3 germ layers كلهم أثناء الـ gastrulation.","memoryTrick":"Epiblast = 3 layers.","stemAr":"الـ embryonic epiblast بيدي:"},{"id":"ES2024-13","topic":"embryo","concept":"Fetal membranes & placenta","source":"ES2024","stem":"The wall of the chorionic sac is composed of:","options":["cytotrophoblast and syncytiotrophoblast","two layers of trophoblast lined by extraembryonic somatic mesoderm","trophoblast and exocoelomic membrane","extraembryonic splanchnic mesoderm and both layers of trophoblast"],"answer":1,"repeatOf":"EM2019A-11","explanation":"الـ chorion = طبقتين الـ trophoblast (cyto + syncytio) ومبطنين من جوه بالـ extraembryonic somatic mesoderm.","memoryTrick":"Chorion = Trophoblast + Somatic mesoderm (زي ما الـ amnion + somatic كمان).","stemAr":"جدار الـ chorionic sac مكوّن من:"},{"id":"ES2024-14","topic":"embryo","concept":"Female cycles & hormones","source":"ES2024","stem":"At the time of ovulation the endometrium is in the:","options":["Menstrual phase","Early proliferative phase","Late proliferative phase","Late secretory phase"],"answer":2,"explanation":"وقت الـ ovulation (يوم 14) الـ endometrium بيكون في آخر الـ proliferative phase.","memoryTrick":"Ovulation = نهاية الـ proliferative.","stemAr":"وقت الـ ovulation الـ endometrium بيكون في:"},{"id":"EM2025A-01","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025A","stem":"Which of the following best describes the anatomical position of the lower limbs and toes?","options":["Knees flexed, the toes turned inward","Legs abducted, feet rotated outward","Legs extended and parallel, feet flat with toes directed forward","Knees flexed, feet together with toes pointing sideways"],"answer":2,"explanation":"في الـ anatomical position الرجلين ممدودين ومتوازيين، والقدم flat والأصابع لقدام.","memoryTrick":"واقف مستقيم وكل حاجة لقدام.","stemAr":"أنهي واحدة من دول أحسن وصف لوضع الـ lower limbs والأصابع في الـ anatomical position؟"},{"id":"EM2025A-02","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025A","stem":"Which plane divides the body into anterior and posterior parts?","options":["Midsagittal plane","Parasagittal plane","Coronal plane.","Horizontal plane"],"answer":2,"explanation":"الـ coronal plane = anterior و posterior.","memoryTrick":"Coronal = قدام/ورا.","stemAr":"أنهي plane بيقسم الجسم لجزء anterior وجزء posterior؟"},{"id":"EM2025A-03","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025A","stem":"What is the meaning of superficial dissection of the dorsal aspect of the neck?","options":["Dissection of the skin and front of the neck","Dissection of the skin and back of the neck","Dissection of the muscles and vessels of the back of the neck","Dissection of the muscles and vessels of the front of the neck"],"answer":1,"explanation":"الـ superficial = قريب من السطح (skin)، والـ dorsal = الخلف. يعني dissection للـ skin في back of the neck.","memoryTrick":"Superficial = Skin / Dorsal = Back.","stemAr":"يعني إيه superficial dissection للـ dorsal aspect بتاع الرقبة؟"},{"id":"EM2025A-04","topic":"anat","concept":"Movements","source":"EM2025A","stem":"Moving the distal segment away from the proximal segment is called which of the following?","options":["Adduction","Abduction","Flexion","Extension"],"answer":1,"explanation":"حسب الملزمة الإجابة abduction (الحركة بعيد). ملاحظة: التعريف الأدق للـ abduction إنه بعيد عن الـ median plane.","memoryTrick":"Abduction = Away (بعيد).","stemAr":"تحريك الجزء البعيد (distal segment) بعيد عن الجزء القريب (proximal segment) اسمه إيه؟"},{"id":"EM2025A-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2025A","stem":"Which of the following is the character of the compact bone?","options":["Contains large spaces filled with bone marrow","Composed of loosely arranged trabeculae","Dense and organized into a number of cylindrical units","Found only in the epiphysis of long bones"],"answer":2,"explanation":"الـ compact bone كثيف ومنظم في cylindrical units اسمها Haversian systems (osteons).","memoryTrick":"Compact = Haversian (Osteons).","stemAr":"أنهي واحدة من دول صفة الـ compact bone؟"},{"id":"EM2025A-06","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2025A","stem":"Which of the following arteries can supply the bone marrow?","options":["Periosteal","Epiphyseal","Metaphyseal","Nutrient"],"answer":3,"explanation":"الـ nutrient artery بتغذي الـ bone marrow.","memoryTrick":"Nutrient = Marrow.","stemAr":"أنهي artery من دول ممكن تغذي الـ bone marrow؟"},{"id":"EM2025A-07","topic":"anat","concept":"Skeleton & types of bones","source":"EM2025A","stem":"Which of the following is considered a short bone?","options":["Carpal bone","Phalanges","Patella","Clavicle"],"answer":0,"explanation":"الـ carpal bones short bones. الـ phalanges long، والـ patella sesamoid، والـ clavicle long (modified).","memoryTrick":"Carpal = Short.","stemAr":"أنهي واحدة من دول تعتبر short bone؟"},{"id":"EM2025A-08","topic":"embryo","concept":"Female cycles & hormones","source":"EM2025A","stem":"If Sara's cycle is 38 days, on which day is she most likely to ovulate?","options":["Day 14","Day 24","Day 28","Day 35"],"answer":1,"explanation":"الـ ovulation بتحصل 14 يوم قبل الدورة الجاية (الـ luteal phase ثابتة 14 يوم)، فـ 38 − 14 = يوم 24.","memoryTrick":"Ovulation = طول الدورة − 14.","stemAr":"لو الدورة عند سارة 38 يوم، غالبًا هيحصلها ovulation في يوم كام؟"},{"id":"EM2025A-09","topic":"embryo","concept":"Female cycles & hormones","source":"EM2025A","stem":"Which hormone surges right before ovulation, triggering the release of an egg?","options":["Progesterone","Estrogen","Luteinizing hormone (LH)","Follicle-stimulating hormone (FSH)"],"answer":2,"explanation":"الـ LH surge هو اللي بيعمل الـ ovulation (بعده بحوالي 24–36 ساعة).","memoryTrick":"LH = Let Hatch (اطلق البويضة).","stemAr":"أنهي hormone بيعمل surge (ارتفاع مفاجئ) قبل الـ ovulation مباشرةً فيخلّي البويضة تنزل؟"},{"id":"EM2025A-10","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"If Sarah doesn't conceive, what event marks the end of the luteal phase?","options":["Ovulation","Menstruation","LH surge","Implantation"],"answer":1,"explanation":"لو مفيش حمل الـ corpus luteum بيضمر، الـ progesterone ينزل، فتحصل الـ menstruation ودي نهاية الـ luteal phase.","memoryTrick":"مفيش حمل = Menstruation.","stemAr":"لو سارة محملتش، إيه الحدث اللي بيعلن نهاية الـ luteal phase؟"},{"id":"EM2025A-11","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"Which hormone is released after implantation and is used to confirm pregnancy?","options":["LH (Luteinizing hormone)","FSH (Follicle-stimulating hormone)","HCG (Human chorionic Gonadotropin)","Estrogen"],"answer":2,"explanation":"الـ hCG بيتفرز من الـ syncytiotrophoblast بعد الـ implantation وهو اللي بيتقاس في pregnancy test.","memoryTrick":"Pregnancy = hCG.","stemAr":"أنهي hormone بيتفرز بعد الـ implantation وبيستخدم لتأكيد الحمل؟"},{"id":"EM2025A-12","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2025A","stem":"At what stage does the fertilized egg typically implant in the uterus?","options":["Zygote","Morula","Blastocyst","Embryo"],"answer":2,"explanation":"الـ implantation بتحصل في مرحلة الـ blastocyst.","memoryTrick":"Blastocyst = يزرع.","stemAr":"البويضة الملقّحة بتزرع في الرحم عادةً في أنهي مرحلة؟"},{"id":"EM2025A-13","topic":"embryo","concept":"Gametogenesis","source":"EM2025A","stem":"Which term describes complete absence of sperm in semen analysis?","options":["Azoospermia","Oligospermia","Teratozoospermia","Asthenozoospermia"],"answer":0,"explanation":"الـ azoospermia = غياب الـ sperm تمامًا. Oligo = عدد قليل، Terato = شكل غلط، Astheno = حركة ضعيفة.","memoryTrick":"A-zoo = مفيش حيوانات خالص.","stemAr":"أنهي مصطلح بيوصف الغياب التام للـ sperm في تحليل السائل المنوي؟"},{"id":"EM2025A-14","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"What major event typically occurs at the start of the second week of development?","options":["Gastrulation","Fertilization","Implantation of the blastocyst","Formation of the neural tube"],"answer":2,"explanation":"بداية الأسبوع التاني بيكمل فيها الـ implantation (الـ blastocyst بيندفن في الـ endometrium).","memoryTrick":"Week 2 = Implantation + Two layers.","stemAr":"إيه الحدث الكبير اللي بيحصل عادةً في بداية الأسبوع التاني من النمو؟"},{"id":"EM2025A-15","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"What cavity begins to develop during the end of the second week?","options":["Chorionic cavity","Amniotic cavity","Yolk sac.","Blastocoele"],"answer":0,"explanation":"الـ chorionic cavity (extraembryonic coelom) بتتكون آخر الأسبوع التاني من اندماج spaces في الـ extraembryonic mesoderm.","memoryTrick":"آخر Week 2 = Chorionic cavity.","stemAr":"أنهي cavity بتبدأ تتكون في آخر الأسبوع التاني؟"},{"id":"EM2025A-16","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"Which part of the blastocyst directly interacts with the endometrial lining during implantation?","options":["Inner cell mass (Embryoblast)","Syncytiotrophoblast","Amniotic cavity","Cytotrophoblast"],"answer":1,"explanation":"الـ syncytiotrophoblast هو اللي بيلمس ويغزو الـ endometrium وقت الـ implantation.","memoryTrick":"Syncytio = الهجوم 🗡️.","stemAr":"أنهي جزء من الـ blastocyst بيتعامل مباشرةً مع بطانة الـ endometrium أثناء الـ implantation؟"},{"id":"EM2025A-17","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"What hormone prepares the endometrium for implantation?","options":["Estrogen","Follicle-stimulating hormone (FSH)","Progesterone","Luteinizing hormone (LH)"],"answer":2,"explanation":"الـ progesterone (من الـ corpus luteum) بيجهّز الـ endometrium (secretory phase) للـ implantation.","memoryTrick":"Pro-gestation = يجهز للحمل.","stemAr":"أنهي hormone بيجهّز الـ endometrium للـ implantation؟"},{"id":"EM2025A-18","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"Which layer of the bilaminar disc contributes to the formation of the primitive yolk sac?","options":["Hypoblast","Epiblast","Cytotrophoblast.","Syncytiotrophoblast"],"answer":0,"explanation":"خلايا الـ hypoblast بتكوّن الـ exocoelomic membrane اللي بتعمل الـ primitive (primary) yolk sac.","memoryTrick":"Hypo = Yolk (تحت) / Epi = Amnion (فوق).","stemAr":"أنهي طبقة من الـ bilaminar disc بتشارك في تكوين الـ primitive yolk sac؟"},{"id":"EM2025A-19","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025A","stem":"Which cells form the inner layer of the chorion?","options":["Epiblast cells","Syncytiotrophoblast","Hypoblast cells","Primary mesoderm"],"answer":3,"explanation":"الطبقة الداخلية للـ chorion هي الـ extraembryonic (somatic) mesoderm = primary mesoderm.","memoryTrick":"Chorion = Trophoblast + Mesoderm من جوه.","stemAr":"أنهي خلايا بتكوّن الطبقة الداخلية للـ chorion؟"},{"id":"EM2025A-20","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025A","stem":"During which week of development does the chorionic cavity form?","options":["First week","Second week","Third week","Fourth week"],"answer":1,"explanation":"الـ chorionic cavity بتتكون في الأسبوع التاني.","memoryTrick":"Week 2.","stemAr":"الـ chorionic cavity بتتكون في أنهي أسبوع من النمو؟"},{"id":"EM2025A-21","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025A","stem":"Which structure is responsible for the establishment of uteroplacental circulation?","options":["Blastocyst","Amnion","Yolk sac","Syncytiotrophoblast"],"answer":3,"explanation":"الـ lacunae في الـ syncytiotrophoblast بتفتح على الـ maternal sinusoids فيبدأ الـ uteroplacental circulation (حوالي يوم 11–12).","memoryTrick":"Syncytio + Lacunae = دورة الأم والجنين.","stemAr":"أنهي structure مسئول عن إنشاء الـ uteroplacental circulation؟"},{"id":"EM2025A-22","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following is true as regard Ribosomes?","options":["Appears basophilic when stained with H & E.","Stains red when stained with silver.","It is found supranuclear in nerve cells.","Appears as unstained area in deeply basophilic cytoplasm."],"answer":0,"explanation":"الـ ribosomes غنية بالـ rRNA (acidic) فبتاخد الـ hematoxylin وتظهر basophilic في H&E. الـ silver stain و الـ negative image و الـ supranuclear صفات الـ Golgi.","memoryTrick":"Ribosome = RNA = أزرق (basophilic).","stemAr":"أنهي واحدة من دول صح بخصوص الـ ribosomes؟"},{"id":"EM2025A-23","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following is absent from matrix of mitochondria?","options":["Circular DNA & RNA.","Ca²⁺ acting as catalysts condensed within dense granules.","Oxidative enzymes of Krebs cycle.","Hydrolytic digestive enzymes."],"answer":3,"explanation":"الـ matrix of mitochondria فيها circular DNA و RNA و Krebs cycle enzymes و dense granules فيها Ca²⁺. الـ hydrolytic digestive enzymes مكانها الـ lysosomes.","memoryTrick":"Hydrolytic = Lysosome مش Mitochondria.","stemAr":"أنهي واحد من دول مش موجود في الـ matrix بتاع الـ mitochondria؟"},{"id":"EM2025A-24","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following is truly matching as regard each organelle?","options":["Inner mitochondrial membrane → Cristae.","Multivesicular bodies → Engulfed solid foreign bodies.","Protein synthesis → SER.","Euchromatin → Nucleolus associated."],"answer":0,"explanation":"الصح A: الـ cristae هي ثنيات الـ inner mitochondrial membrane. الـ multivesicular bodies للسوائل، والبروتين على الـ rER، والـ nucleolus-associated chromatin غالبًا heterochromatin.","memoryTrick":"Cristae = Inner membrane.","stemAr":"أنهي واحدة من دول التوصيل فيها صح لكل organelle؟"},{"id":"EM2025A-25","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following is mis-matching as regard each organelle?","options":["Attached ribosomes → Synthesis of cytosol proteins.","Primary lysosomes → Originate from trans-face of Golgi apparatus.","Initial protein modifications → RER.","Transfer vesicles → Transport proteins from RER to cis-face."],"answer":0,"explanation":"الغلط A: الـ attached ribosomes (على الـ rER) بتصنع بروتين للإفراز، أما بروتين الـ cytosol فبيتصنع على الـ free ribosomes.","memoryTrick":"Attached = Export / Free = Home use.","stemAr":"أنهي واحدة من دول التوصيل فيها غلط لكل organelle؟"},{"id":"EM2025A-26","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2025A","stem":"What is the special stain of Golgi apparatus?","options":["Silver","Best's Carmine","Sudan III","Iron HX"],"answer":0,"explanation":"الـ Golgi بيتصبغ بالـ silver (أو osmium) impregnation فيظهر brown/black network.","memoryTrick":"Golgi = Silver 🥈.","stemAr":"إيه الـ special stain بتاع الـ Golgi apparatus؟"},{"id":"EM2025A-27","topic":"histo","concept":"Nucleus & chromatin","source":"EM2025A","stem":"Which of the following best describes peripheral chromatin?","options":["Connected to inner border of nuclear envelope","Connected to nucleoli","Clumped and scattered in the nuclear sap","Fine granules and scattered in the nuclear sap"],"answer":0,"explanation":"الـ peripheral chromatin هو الـ heterochromatin اللي لازق في الـ inner surface of the nuclear envelope.","memoryTrick":"Peripheral = على الحافة (لازق في الغشا).","stemAr":"أنهي واحدة من دول أحسن وصف للـ peripheral chromatin؟"},{"id":"EM2025A-28","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following statements describes active cells?","options":["Dark nucleus","Heterochromatic nucleus","Euchromatic nucleus","Few mitochondria"],"answer":2,"explanation":"الخلية النشطة نواتها euchromatic (فاتحة، الـ DNA مفرود وبيتعمله transcription) ومليانة mitochondria.","memoryTrick":"Active = Euchromatic (Eu = Good working).","stemAr":"أنهي جملة من دول بتوصف الخلايا النشطة (active cells)؟"},{"id":"EM2025A-29","topic":"histo","concept":"Nucleus & chromatin","source":"EM2025A","stem":"What about heterochromatin?","options":["Makes the nucleus pale by LM.","Appears as coarse granules in the nucleus.","Contains active genes.","Represents extended parts of chromatin."],"answer":1,"explanation":"الـ heterochromatin بيظهر coarse dark granules، وهو condensed وغير نشط، وبيخلي النواة غامقة.","memoryTrick":"Hetero = Coarse & Dark.","stemAr":"إيه الصح عن الـ heterochromatin؟"},{"id":"EM2025A-30","topic":"histo","concept":"Cell membrane & transport","source":"EM2025A","stem":"Pinocytosis is the process by which the cell membrane can engulf which of the following?","options":["Fluid droplets.","Solid particles","Bacteria","Foreign bodies"],"answer":0,"explanation":"الـ pinocytosis = ابتلاع fluid droplets.","memoryTrick":"Pino = سوائل.","stemAr":"الـ pinocytosis هي العملية اللي الـ cell membrane بتبلع بيها أنهي واحد من دول؟"},{"id":"EM2025A-31","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2025A","stem":"Which one is regarded as an exogenous pigment?","options":["Haemoglobin","Melanin","Carotene","Lipofuscin"],"answer":2,"explanation":"الـ carotene exogenous pigment (من الأكل زي الجزر). الـ hemoglobin والـ melanin والـ lipofuscin endogenous.","memoryTrick":"Carotene = Carrot 🥕 (من بره).","stemAr":"أنهي واحد يعتبر exogenous pigment؟"},{"id":"ES2025A-01","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025A","stem":"Which organelle is responsible for cell digestion?","options":["rER","Golgi apparatus","sER","Lysosome"],"answer":3,"explanation":"الـ lysosome مسئول عن الـ intracellular digestion.","memoryTrick":"Lysosome = معدة الخلية.","stemAr":"أنهي organelle مسئول عن الهضم داخل الخلية؟"},{"id":"ES2025A-02","topic":"histo","concept":"Cell membrane & transport","source":"ES2025A","stem":"What is the term for the process by which the cells transport solids?","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":3,"explanation":"الـ phagocytosis = ابتلاع solids.","memoryTrick":"Phago = أكل.","stemAr":"إيه اسم العملية اللي الخلايا بتنقل بيها المواد الصلبة (solids)؟"},{"id":"ES2025A-03","topic":"histo","concept":"Cell membrane & transport","source":"ES2025A","stem":"Which of the following best describes the phospholipid molecules of cell membrane?","options":["The head is non-charged and hydrophobic","The head is directed inwards away from the aqueous solutions","The fatty acid tail is charged and hydrophilic","The head is directed towards the aqueous solutions"],"answer":3,"explanation":"الـ phospholipid: head (phosphate) charged و hydrophilic وبيبص ناحية الـ aqueous solutions (بره وجوه)، والـ tails hydrophobic في نص الغشا.","memoryTrick":"Head يحب المية / Tail يكرهها.","stemAr":"أنهي واحدة من دول أحسن وصف لجزيئات الـ phospholipid في الـ cell membrane؟"},{"id":"ES2025A-04","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025A","stem":"Regarding rER, which of the following describes it?","options":["Form proteins secreted by the cells","Form proteins used within the cytosol","Linked together by tRNA forming polysomes.","Bind to the outer surface of SER"],"answer":0,"explanation":"الـ rER بيصنع البروتينات اللي هتتفرز برا الخلية.","memoryTrick":"Rough = Secreted.","stemAr":"بخصوص الـ rER، أنهي واحدة من دول بتوصفه؟"},{"id":"ES2025A-05","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025A","stem":"Which feature of the followings describes centrioles?","options":["They are a membranous organelle","Can be demonstrated with silver stain","Formed of nine triplets of microtubules","Have the same number of microtubules as the shaft of cilia"],"answer":2,"explanation":"الـ centriole اسطوانة جدارها 9 triplets من الـ microtubules (27 microtubule)، وهو non-membranous. الـ cilia shaft فيه 9×2+2 = 20.","memoryTrick":"Centriole = 9×3.","stemAr":"أنهي صفة من دول بتوصف الـ centrioles؟"},{"id":"ES2025A-06","topic":"histo","concept":"Nucleus & chromatin","source":"ES2025A","stem":"What is the typical feature of condensed chromatin?","options":["Appears dark acidophilic by LM","Appears as fine granules by EM","Contains the inactive genes","Appears pale basophilic by LM"],"answer":2,"explanation":"الـ condensed chromatin (heterochromatin) فيه الـ inactive genes وبيظهر dark basophilic ومن coarse granules.","memoryTrick":"Condensed = Inactive.","stemAr":"إيه الصفة المميزة للـ condensed chromatin؟"},{"id":"ES2025A-07","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025A","stem":"The cilia can be characterized by which of the followings?","options":["The basal body is formed of nine microtubules","The rootlet contains twenty-seven microtubules","move secretions over the tissue surface in one directions","Can be found in the male genital system"],"answer":2,"explanation":"الـ cilia بتتحرك بشكل منتظم فتحرّك الإفرازات على السطح في اتجاه واحد (زي الـ respiratory tract). الـ basal body 27 microtubule مش 9.","memoryTrick":"Cilia = حركة في اتجاه واحد (زي المجداف).","stemAr":"الـ cilia ممكن توصف بأنهي واحدة من دول؟"},{"id":"ES2025A-08","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2025A","stem":"Which one of the following stains demonstrates lipid in the liver cells?","options":["Sudan III","PAS","Silver","trypan blue"],"answer":0,"explanation":"الـ Sudan III بيصبغ الـ lipids (برتقالي/أحمر). الـ PAS للـ glycogen.","memoryTrick":"Sudan = Fat / PAS = Glycogen.","stemAr":"أنهي stain من دول بيبيّن الـ lipid في خلايا الكبد؟"},{"id":"ES2025A-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025A","stem":"What is the origin of secretory vesicles of Golgi apparatus?","options":["Smooth endoplasmic reticulum","Rough endoplasmic reticulum","The trans face of Golgi apparatus","The cell membrane"],"answer":2,"explanation":"الـ secretory vesicles بتطلع من الـ trans face of Golgi.","memoryTrick":"Trans = Exit.","stemAr":"إيه أصل الـ secretory vesicles بتاعة الـ Golgi apparatus؟"},{"id":"ES2025A-10","topic":"anat","concept":"Scalp & face","source":"ES2025A","stem":"Why is the loose areolar tissue considered dangerous?","options":["It is highly vascularized","It contains sweat glands","It allows infection to spread to the brain via emissary veins","It is the thickest layer of the scalp"],"answer":2,"explanation":"الـ loose areolar tissue خطيرة لأن الـ emissary veins اللي بتعدي فيها (من غير valves) بتوصل الـ infection للـ intracranial venous sinuses والمخ.","memoryTrick":"Emissary veins = طريق العدوى للمخ.","stemAr":"ليه الـ loose areolar tissue بتعتبر خطيرة (dangerous)؟"},{"id":"ES2025A-11","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2025A","stem":"which of the following arteries supply the outer compact bone?","options":["Nutrient artery","Periosteal artery","Epiphyseal artery","metaphyseal artery"],"answer":1,"explanation":"الـ periosteal artery بتغذي الـ outer compact bone.","memoryTrick":"Periosteal = Outer.","stemAr":"أنهي artery من دول بتغذي الـ outer compact bone؟"},{"id":"ES2025A-12","topic":"embryo","concept":"Gametogenesis","source":"ES2025A","stem":"What is the primary mechanism that prevents polyspermy after the first sperm enters the egg?","options":["Cortical reaction","Decidual reaction","Acrosome reaction","Cleavage division"],"answer":0,"explanation":"بعد دخول أول sperm بتحصل الـ cortical reaction: الـ cortical granules بتطلع إنزيمات تغير الـ zona pellucida (zona reaction) فتمنع الـ polyspermy.","memoryTrick":"Cortical = Close the door 🚪.","stemAr":"إيه الآلية الأساسية اللي بتمنع الـ polyspermy بعد ما أول sperm يدخل البويضة؟"},{"id":"ES2025A-13","topic":"embryo","concept":"Implantation & second week","source":"ES2025A","stem":"Where originates the extraembryonic mesoderm?","options":["It is a result of the migration of cells from the neuroectoderm","In a site between trophoblast and embryoblast","In a site between hypoblast and epiblast","In a site between endoderm and ectoderm"],"answer":1,"repeatOf":"EM2023-20","explanation":"حسب الملزمة الـ extraembryonic mesoderm بيظهر في المسافة بين الـ trophoblast (cytotrophoblast) والـ embryoblast/exocoelomic membrane.","memoryTrick":"Extraembryonic = بين الـ trophoblast والـ embryo.","stemAr":"الـ extraembryonic mesoderm أصله منين؟"},{"id":"EM2025B-01","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025B","stem":"Which of the following best describes the anatomical position of the lower limbs and toes?","options":["Knees flexed, the toes turned inward.","Legs abducted, feet rotated outward.","Legs extended and parallel, feet flat with toes directed forward.","Knees flexed, feet together with toes pointing sideways."],"answer":2,"repeatOf":"EM2025A-01","explanation":"في الـ anatomical position الرجلين ممدودين ومتوازيين، والقدم flat والأصابع لقدام.","memoryTrick":"واقف مستقيم وكل حاجة لقدام.","stemAr":"أنهي واحدة من دول أحسن وصف لوضع الـ lower limbs والأصابع في الـ anatomical position؟"},{"id":"EM2025B-02","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025B","stem":"Which plane divides the body into anterior and posterior parts?","options":["midsagittal.","parasagittal.","coronal.","horizontal."],"answer":2,"explanation":"الـ coronal plane = anterior و posterior.","memoryTrick":"Coronal.","stemAr":"أنهي plane بيقسم الجسم لجزء anterior وجزء posterior؟"},{"id":"EM2025B-03","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025B","stem":"What is the meaning of superficial dissection of the dorsal aspect of the neck?","options":["dissection of the skin and front of the neck.","dissection of the skin and back of the neck.","dissection of the muscles and vessels and back of the neck.","dissection of the muscles and vessels and front of the neck."],"answer":1,"explanation":"Superficial = skin، و Dorsal = back of the neck.","memoryTrick":"Superficial = Skin.","stemAr":"يعني إيه superficial dissection للـ dorsal aspect بتاع الرقبة؟"},{"id":"EM2025B-04","topic":"anat","concept":"Movements","source":"EM2025B","stem":"Moving the distal segment away from the proximal segment is called which of the following?","options":["Adduction.","abduction.","flexion.","extension."],"answer":1,"repeatOf":"EM2025A-04","explanation":"حسب الملزمة الإجابة abduction (الحركة بعيد). ملاحظة: التعريف الأدق للـ abduction إنه بعيد عن الـ median plane.","memoryTrick":"Abduction = Away (بعيد).","stemAr":"تحريك الجزء البعيد (distal segment) بعيد عن الجزء القريب (proximal segment) اسمه إيه؟"},{"id":"EM2025B-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2025B","stem":"Which of the following is the character of the compact bone?","options":["Contains large spaces filled with bone marrow","Composed of loosely arranged trabeculae.","Dense and organized into number of cylindrical units","Found only in the epiphysis of long bones."],"answer":2,"explanation":"الـ compact bone كثيف ومنظم في Haversian systems.","memoryTrick":"Compact = Osteons.","stemAr":"أنهي واحدة من دول صفة الـ compact bone؟"},{"id":"EM2025B-06","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2025B","stem":"Which of the following arteries can supply the bone marrow?","options":["periosteal","epiphyseal","metaphyseal","nutrient"],"answer":3,"repeatOf":"EM2025A-06","explanation":"الـ nutrient artery بتغذي الـ bone marrow.","memoryTrick":"Nutrient = Marrow.","stemAr":"أنهي artery من دول ممكن تغذي الـ bone marrow؟"},{"id":"EM2025B-07","topic":"anat","concept":"Skeleton & types of bones","source":"EM2025B","stem":"Which of the following is considered short bone?","options":["Carpal bone","phalanges","patella","clavicle"],"answer":0,"explanation":"الـ carpal bones short bones.","memoryTrick":"Carpal = Short.","stemAr":"أنهي واحدة من دول تعتبر short bone؟"},{"id":"EM2025B-08","topic":"embryo","concept":"Female cycles & hormones","source":"EM2025B","stem":"If Sara's cycle is 38 days, on which day is she most likely to ovulate?","options":["Day 14","Day 24","Day 28","Day 35"],"answer":1,"repeatOf":"EM2025A-08","explanation":"الـ ovulation بتحصل 14 يوم قبل الدورة الجاية (الـ luteal phase ثابتة 14 يوم)، فـ 38 − 14 = يوم 24.","memoryTrick":"Ovulation = طول الدورة − 14.","stemAr":"لو الدورة عند سارة 38 يوم، غالبًا هيحصلها ovulation في يوم كام؟"},{"id":"EM2025B-09","topic":"embryo","concept":"Female cycles & hormones","source":"EM2025B","stem":"Which hormone surges right before ovulation, triggering the release of an egg?","options":["Progesterone","Estrogen","(LH)","(FSH)"],"answer":2,"explanation":"الـ LH surge بيعمل الـ ovulation.","memoryTrick":"LH surge ➜ Ovulation.","stemAr":"أنهي hormone بيعمل surge قبل الـ ovulation مباشرةً فيخلّي البويضة تنزل؟"},{"id":"EM2025B-10","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"If Sarah doesn't conceive, what event marks the end of the luteal phase?","options":["Ovulation","Menstruation","LH surge","Implantation"],"answer":1,"repeatOf":"EM2025A-10","explanation":"لو مفيش حمل الـ corpus luteum بيضمر، الـ progesterone ينزل، فتحصل الـ menstruation ودي نهاية الـ luteal phase.","memoryTrick":"مفيش حمل = Menstruation.","stemAr":"لو سارة محملتش، إيه الحدث اللي بيعلن نهاية الـ luteal phase؟"},{"id":"EM2025B-11","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"Which hormone is released after implantation and is used to confirm pregnancy?","options":["LH","FSH","HCG (Human chorionic Gonadotropin)","Estrogen"],"answer":2,"explanation":"الـ hCG هو هرمون اختبار الحمل.","memoryTrick":"hCG.","stemAr":"أنهي hormone بيتفرز بعد الـ implantation وبيستخدم لتأكيد الحمل؟"},{"id":"EM2025B-12","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2025B","stem":"At what stage does the fertilized egg typically implant in the uterus?","options":["Zygote","Morula","Blastocyst","Embryo"],"answer":2,"repeatOf":"EM2025A-12","explanation":"الـ implantation بتحصل في مرحلة الـ blastocyst.","memoryTrick":"Blastocyst = يزرع.","stemAr":"البويضة الملقّحة بتزرع في الرحم عادةً في أنهي مرحلة؟"},{"id":"EM2025B-13","topic":"embryo","concept":"Gametogenesis","source":"EM2025B","stem":"Which term describes complete absence of sperm in semen analysis?","options":["Azoospermia","Oligospermia","Teratozoospermia","Asthenozoospermia"],"answer":0,"repeatOf":"EM2025A-13","explanation":"الـ azoospermia = غياب الـ sperm تمامًا. Oligo = عدد قليل، Terato = شكل غلط، Astheno = حركة ضعيفة.","memoryTrick":"A-zoo = مفيش حيوانات خالص.","stemAr":"أنهي مصطلح بيوصف الغياب التام للـ sperm في تحليل السائل المنوي؟"},{"id":"EM2025B-14","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"What major event typically occurs at the start of the second week of development?","options":["Gastrulation","Fertilization","Implantation of the blastocyst","Formation of the neural tube"],"answer":2,"repeatOf":"EM2025A-14","explanation":"بداية الأسبوع التاني بيكمل فيها الـ implantation (الـ blastocyst بيندفن في الـ endometrium).","memoryTrick":"Week 2 = Implantation + Two layers.","stemAr":"إيه الحدث الكبير اللي بيحصل عادةً في بداية الأسبوع التاني من النمو؟"},{"id":"EM2025B-15","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"What cavity begins to develop during the end of the second week?","options":["Chorionic cavity","Amniotic cavity","Yolk sac","Blastocoele"],"answer":0,"repeatOf":"EM2025A-15","explanation":"الـ chorionic cavity (extraembryonic coelom) بتتكون آخر الأسبوع التاني من اندماج spaces في الـ extraembryonic mesoderm.","memoryTrick":"آخر Week 2 = Chorionic cavity.","stemAr":"أنهي cavity بتبدأ تتكون في آخر الأسبوع التاني؟"},{"id":"EM2025B-16","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"Which part of the blastocyst directly interacts with the endometrial lining during implantation?","options":["Inner cell mass (embryoblast)","Syncytiotrophoblast","Amniotic cavity","Cytotrophoblast"],"answer":1,"repeatOf":"EM2025A-16","explanation":"الـ syncytiotrophoblast هو اللي بيلمس ويغزو الـ endometrium وقت الـ implantation.","memoryTrick":"Syncytio = الهجوم 🗡️.","stemAr":"أنهي جزء من الـ blastocyst بيتعامل مباشرةً مع بطانة الـ endometrium أثناء الـ implantation؟"},{"id":"EM2025B-17","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"What hormone prepares the endometrium for implantation?","options":["Estrogen","(FSH)","Progesterone","(LH)"],"answer":2,"explanation":"الـ progesterone بيجهّز الـ endometrium للـ implantation.","memoryTrick":"Progesterone = Pro-pregnancy.","stemAr":"أنهي hormone بيجهّز الـ endometrium للـ implantation؟"},{"id":"EM2025B-18","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"Which layer of the bilaminar disc contributes to the formation of the primitive yolk sac?","options":["Hypoblast.","Epiblast.","Cytotrophoblast.","Syncytiotrophoblast."],"answer":0,"repeatOf":"EM2025A-18","explanation":"خلايا الـ hypoblast بتكوّن الـ exocoelomic membrane اللي بتعمل الـ primitive (primary) yolk sac.","memoryTrick":"Hypo = Yolk (تحت) / Epi = Amnion (فوق).","stemAr":"أنهي طبقة من الـ bilaminar disc بتشارك في تكوين الـ primitive yolk sac؟"},{"id":"EM2025B-19","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025B","stem":"Which cells form the inner layer of the chorion?","options":["Epiblast cells","Syncytiotrophoblast","Hypoblast cells","Primary mesoderm"],"answer":3,"repeatOf":"EM2025A-19","explanation":"الطبقة الداخلية للـ chorion هي الـ extraembryonic (somatic) mesoderm = primary mesoderm.","memoryTrick":"Chorion = Trophoblast + Mesoderm من جوه.","stemAr":"أنهي خلايا بتكوّن الطبقة الداخلية للـ chorion؟"},{"id":"EM2025B-20","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025B","stem":"During which week of development does the chorionic cavity form?","options":["First week","Second week","Third week","Fourth week"],"answer":1,"repeatOf":"EM2025A-20","explanation":"الـ chorionic cavity بتتكون في الأسبوع التاني.","memoryTrick":"Week 2.","stemAr":"الـ chorionic cavity بتتكون في أنهي أسبوع من النمو؟"},{"id":"EM2025B-21","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025B","stem":"Which structure is responsible for the establishment of uteroplacental circulation?","options":["Blastocyst.","Amnion.","Yolk sac.","Syncytiotrophoblast."],"answer":3,"repeatOf":"EM2025A-21","explanation":"الـ lacunae في الـ syncytiotrophoblast بتفتح على الـ maternal sinusoids فيبدأ الـ uteroplacental circulation (حوالي يوم 11–12).","memoryTrick":"Syncytio + Lacunae = دورة الأم والجنين.","stemAr":"أنهي structure مسئول عن إنشاء الـ uteroplacental circulation؟"},{"id":"EM2025B-22","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following is true as regard Ribosomes?","options":["Appears basophilic when stained with H & E","Stains red when stained with silver","It is found supranuclear in nerve cell","Appears as unstained area in deeply basophilic cytoplasm"],"answer":0,"explanation":"الـ ribosomes basophilic في H&E.","memoryTrick":"RNA = Basophilic.","stemAr":"أنهي واحدة من دول صح بخصوص الـ ribosomes؟"},{"id":"EM2025B-23","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following is absent from matrix of mitochondria?","options":["Circular DNA & RNA","Ca^{+2} acting as catalysts condensed within dense granules","Oxidative enzymes of Kreb's cycle","Hydrolytic digestive enzymes"],"answer":3,"explanation":"الـ hydrolytic enzymes في الـ lysosomes مش في الـ mitochondrial matrix.","memoryTrick":"Hydrolytic = Lysosome.","stemAr":"أنهي واحد من دول مش موجود في الـ matrix بتاع الـ mitochondria؟"},{"id":"EM2025B-24","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following is truly- matching as regard each organelle?","options":["Cristae: inner mitochondrial membrane","Multivesicular bodies: Engulfed solid foreign bodies","SER: protein synthesis","Euchromatin: Nucleolus associated"],"answer":0,"explanation":"الـ cristae = folds of the inner mitochondrial membrane.","memoryTrick":"Cristae = Inner.","stemAr":"أنهي واحدة من دول التوصيل فيها صح لكل organelle؟"},{"id":"EM2025B-25","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following is mis matching as regard each organelle?","options":["Attached ribosomes: Synthesis of cytosol proteins","Primary lysosomes: Originate from trans- face of Golgi apparatus","RER: Initial protein modifications","Transfer vesicles: Transport proteins from RER to cis-face"],"answer":0,"explanation":"الغلط A: الـ attached ribosomes بتصنع بروتين للإفراز مش للـ cytosol.","memoryTrick":"Attached = Export.","stemAr":"أنهي واحدة من دول التوصيل فيها غلط لكل organelle؟"},{"id":"EM2025B-26","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2025B","stem":"What is the special stain of Golgi apparatus?","options":["Silver","Best's Carmine","Sudan III","Iron HX"],"answer":0,"repeatOf":"EM2025A-26","explanation":"الـ Golgi بيتصبغ بالـ silver (أو osmium) impregnation فيظهر brown/black network.","memoryTrick":"Golgi = Silver 🥈.","stemAr":"إيه الـ special stain بتاع الـ Golgi apparatus؟"},{"id":"EM2025B-27","topic":"histo","concept":"Nucleus & chromatin","source":"EM2025B","stem":"Which of the following best describes peripheral chromatin?","options":["Connected to inner border of nuclear envelope","Connected to nucleoli","Clumped and scattered in the nuclear sap","Fine granules and scattered in the nuclear sap"],"answer":0,"repeatOf":"EM2025A-27","explanation":"الـ peripheral chromatin هو الـ heterochromatin اللي لازق في الـ inner surface of the nuclear envelope.","memoryTrick":"Peripheral = على الحافة (لازق في الغشا).","stemAr":"أنهي واحدة من دول أحسن وصف للـ peripheral chromatin؟"},{"id":"EM2025B-28","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following statements describe active cells?","options":["Dark nucleus","Heterochromatic nucleus","Euchromatic nucleus","Few Mitochondria."],"answer":2,"explanation":"الخلية النشطة نواتها euchromatic.","memoryTrick":"Active = Euchromatic.","stemAr":"أنهي جملة من دول بتوصف الخلايا النشطة (active cells)؟"},{"id":"EM2025B-29","topic":"histo","concept":"Nucleus & chromatin","source":"EM2025B","stem":"What about heterochromatin?","options":["Makes the nucleus pale by LM","Appears as coarse granules in the nucleus","Contains active genes","Represents extended parts of chromatin"],"answer":1,"repeatOf":"EM2025A-29","explanation":"الـ heterochromatin بيظهر coarse dark granules، وهو condensed وغير نشط، وبيخلي النواة غامقة.","memoryTrick":"Hetero = Coarse & Dark.","stemAr":"إيه الصح عن الـ heterochromatin؟"},{"id":"EM2025B-30","topic":"histo","concept":"Cell membrane & transport","source":"EM2025B","stem":"Pinocytosis is the process by which cell membrane can engulf which of the following?","options":["Fluid droplets","solid particles","Bacteria","Foreign bodies"],"answer":0,"explanation":"الـ pinocytosis = fluid droplets.","memoryTrick":"Pino = سوائل.","stemAr":"الـ pinocytosis هي العملية اللي الـ cell membrane بتبلع بيها أنهي واحد من دول؟"},{"id":"EM2025B-31","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2025B","stem":"Which one is regarded as exogenous pigment?","options":["Haemoglobin","Melanin","Carotene","Lipofuscin"],"answer":2,"explanation":"الـ carotene exogenous pigment.","memoryTrick":"Carotene = Carrot 🥕.","stemAr":"أنهي واحد يعتبر exogenous pigment؟"},{"id":"ES2025B-01","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025B","stem":"Which organelle is responsible for cell digestion?","options":["RER","Golgi apparatus","SER","Lysosome"],"answer":3,"repeatOf":"ES2025A-01","explanation":"الـ lysosome مسئول عن الـ intracellular digestion.","memoryTrick":"Lysosome = معدة الخلية.","stemAr":"أنهي organelle مسئول عن الهضم داخل الخلية؟"},{"id":"ES2025B-02","topic":"histo","concept":"Cell membrane & transport","source":"ES2025B","stem":"What is the term for the process by which the cells transport solids?","options":["Endocytosis.","Exocytosis","Pinocytosis","Phagocytosis"],"answer":3,"repeatOf":"ES2025A-02","explanation":"الـ phagocytosis = ابتلاع solids.","memoryTrick":"Phago = أكل.","stemAr":"إيه اسم العملية اللي الخلايا بتنقل بيها المواد الصلبة (solids)؟"},{"id":"ES2025B-03","topic":"histo","concept":"Cell membrane & transport","source":"ES2025B","stem":"Which of the following best describes the phospholipid molecules of cell membrane?","options":["The head is non-charged and hydrophobic","The head is directed inwards away from the aqueous solutions","The fatty acid tail is charged and hydrophilic","The head is directed towards the aqueous solutions"],"answer":3,"repeatOf":"ES2025A-03","explanation":"الـ phospholipid: head (phosphate) charged و hydrophilic وبيبص ناحية الـ aqueous solutions (بره وجوه)، والـ tails hydrophobic في نص الغشا.","memoryTrick":"Head يحب المية / Tail يكرهها.","stemAr":"أنهي واحدة من دول أحسن وصف لجزيئات الـ phospholipid في الـ cell membrane؟"},{"id":"ES2025B-04","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025B","stem":"Regarding rER, which of the following describes it?","options":["Form proteins secreted by the cells","Form proteins used within the cytosol","Linked together by tRNA forming polysomes.","Bind to the outer surface of SER"],"answer":0,"repeatOf":"ES2025A-04","explanation":"الـ rER بيصنع البروتينات اللي هتتفرز برا الخلية.","memoryTrick":"Rough = Secreted.","stemAr":"بخصوص الـ rER، أنهي واحدة من دول بتوصفه؟"},{"id":"ES2025B-05","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025B","stem":"Which feature of the followings describes centrioles?","options":["They are a membranous organelle.","Can be demonstrated with silver stain.","Formed of nine triplets of microtubules","Have the same number of microtubules as the shaft of cilia"],"answer":2,"repeatOf":"ES2025A-05","explanation":"الـ centriole اسطوانة جدارها 9 triplets من الـ microtubules (27 microtubule)، وهو non-membranous. الـ cilia shaft فيه 9×2+2 = 20.","memoryTrick":"Centriole = 9×3.","stemAr":"أنهي صفة من دول بتوصف الـ centrioles؟"},{"id":"ES2025B-06","topic":"histo","concept":"Nucleus & chromatin","source":"ES2025B","stem":"What is the typical feature of condensed chromatin?","options":["Appears dark acidophilic by LM","Appears as fine granules by EM","Contains the inactive genes","Appears pale basophilic by LM"],"answer":2,"repeatOf":"ES2025A-06","explanation":"الـ condensed chromatin (heterochromatin) فيه الـ inactive genes وبيظهر dark basophilic ومن coarse granules.","memoryTrick":"Condensed = Inactive.","stemAr":"إيه الصفة المميزة للـ condensed chromatin؟"},{"id":"ES2025B-07","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025B","stem":"The cilia can be characterized by which of the followings?","options":["The basal body is formed of nine microtubules","The rootlet contains twenty-seven microtubules","move secretions over the tissue surface in one direction","Can be found in the male genital system"],"answer":2,"explanation":"الـ cilia بتحرك الإفرازات في اتجاه واحد.","memoryTrick":"اتجاه واحد.","stemAr":"الـ cilia ممكن توصف بأنهي واحدة من دول؟"},{"id":"ES2025B-08","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2025B","stem":"Which one of the following stains demonstrates lipid in the liver cells?","options":["Sudan III","PAS","Silver","trypan blue"],"answer":0,"repeatOf":"ES2025A-08","explanation":"الـ Sudan III بيصبغ الـ lipids (برتقالي/أحمر). الـ PAS للـ glycogen.","memoryTrick":"Sudan = Fat / PAS = Glycogen.","stemAr":"أنهي stain من دول بيبيّن الـ lipid في خلايا الكبد؟"},{"id":"ES2025B-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025B","stem":"What is the origin of secretory vesicles of Golgi apparatus?","options":["SER","RER","trans face of Golgi apparatus.","cell membrane"],"answer":2,"explanation":"الـ secretory vesicles من الـ trans face.","memoryTrick":"Trans = Exit.","stemAr":"إيه أصل الـ secretory vesicles بتاعة الـ Golgi apparatus؟"},{"id":"ES2025B-10","topic":"anat","concept":"Scalp & face","source":"ES2025B","stem":"Why is the loose areolar tissue considered dangerous?","options":["It is highly vascularized","It contains sweat glands","It allows infection to spread to the brain via emissary veins","It is the thickest layer of the scalp"],"answer":2,"repeatOf":"ES2025A-10","explanation":"الـ loose areolar tissue خطيرة لأن الـ emissary veins اللي بتعدي فيها (من غير valves) بتوصل الـ infection للـ intracranial venous sinuses والمخ.","memoryTrick":"Emissary veins = طريق العدوى للمخ.","stemAr":"ليه الـ loose areolar tissue بتعتبر خطيرة (dangerous)؟"},{"id":"ES2025B-11","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2025B","stem":"Which of the following arteries supply the outer compact bone?","options":["Nutrient artery","Periosteal artery","Epiphyseal artery","Metaphyseal artery"],"answer":1,"repeatOf":"ES2025A-11","explanation":"الـ periosteal artery بتغذي الـ outer compact bone.","memoryTrick":"Periosteal = Outer.","stemAr":"أنهي artery من دول بتغذي الـ outer compact bone؟"},{"id":"ES2025B-12","topic":"embryo","concept":"Gametogenesis","source":"ES2025B","stem":"What is the primary mechanism that prevents polyspermy after the first sperm enters the egg?","options":["Cortical reaction","Decidual reaction","Acrosome reaction","Cleavage division"],"answer":0,"repeatOf":"ES2025A-12","explanation":"بعد دخول أول sperm بتحصل الـ cortical reaction: الـ cortical granules بتطلع إنزيمات تغير الـ zona pellucida (zona reaction) فتمنع الـ polyspermy.","memoryTrick":"Cortical = Close the door 🚪.","stemAr":"إيه الآلية الأساسية اللي بتمنع الـ polyspermy بعد ما أول sperm يدخل البويضة؟"},{"id":"ES2025B-13","topic":"embryo","concept":"Implantation & second week","source":"ES2025B","stem":"Where originates the extraembryonic mesoderm?","options":["It is a result of the migration of cells from the neuroectoderm","In a site between trophoblast and embryoblast","In a site between hypoblast and epiblast","In a site between endoderm and ectoderm"],"answer":1,"repeatOf":"EM2023-20","explanation":"حسب الملزمة الـ extraembryonic mesoderm بيظهر في المسافة بين الـ trophoblast (cytotrophoblast) والـ embryoblast/exocoelomic membrane.","memoryTrick":"Extraembryonic = بين الـ trophoblast والـ embryo.","stemAr":"الـ extraembryonic mesoderm أصله منين؟"},{"id":"ES2025-01","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025","stem":"Which organelle is responsible for maintenance of cell health?","options":["Rough endoplasmic reticulum","Golgi apparatus","Smooth endoplasmic reticulum","Lysosome"],"answer":3,"explanation":"الـ lysosome بيحافظ على صحة الخلية بإنه يهضم الـ worn-out organelles (autophagy) والمواد الغريبة.","memoryTrick":"Lysosome = عامل النظافة 🧹.","stemAr":"أنهي organelle مسئول عن الحفاظ على صحة الخلية؟"},{"id":"ES2025-02","topic":"histo","concept":"Cell membrane & transport","source":"ES2025","stem":"What is the term for the process by which the cells transport fluids?","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":2,"explanation":"الـ pinocytosis = نقل fluids.","memoryTrick":"Pino = شرب.","stemAr":"إيه اسم العملية اللي الخلايا بتنقل بيها السوائل؟"},{"id":"ES2025-03","topic":"histo","concept":"Cell membrane & transport","source":"ES2025","stem":"Which of the following best describes the phospholipid molecules of cell membrane?","options":["The head is non-charged and hydrophobic","The head is directed inwards away from the aqueous solutions","The fatty acid tail is charged and hydrophilic","The head is directed towards the aqueous solutions"],"answer":3,"repeatOf":"ES2025A-03","explanation":"الـ phospholipid: head (phosphate) charged و hydrophilic وبيبص ناحية الـ aqueous solutions (بره وجوه)، والـ tails hydrophobic في نص الغشا.","memoryTrick":"Head يحب المية / Tail يكرهها.","stemAr":"أنهي واحدة من دول أحسن وصف لجزيئات الـ phospholipid في الـ cell membrane؟"},{"id":"ES2025-04","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025","stem":"Regarding free ribosomes, which of the following describes it?","options":["Form proteins secreted by the cells","Form proteins used within the cytosol","Linked together by tRNA forming polysomes","Bind to the outer surface of rER"],"answer":1,"explanation":"الـ free ribosomes بتصنع البروتينات اللي هتتستخدم جوه الـ cytosol نفسه.","memoryTrick":"Free = للاستخدام المحلي.","stemAr":"بخصوص الـ free ribosomes، أنهي واحدة من دول بتوصفها؟"},{"id":"ES2025-05","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025","stem":"Which feature of the followings describes centrioles?","options":["They are a membranous organelle","Can be demonstrated with iron hematoxylin stain","Formed of eight bundles of microtubules","Have the same number of microtubules as the shaft of cilia"],"answer":1,"explanation":"الـ centrioles بتظهر بالـ iron hematoxylin stain. هي non-membranous ومكونة من 9 triplets (مش 8)، ومختلفة عن الـ cilia shaft.","memoryTrick":"Centriole = Iron HX.","stemAr":"أنهي صفة من دول بتوصف الـ centrioles؟"},{"id":"ES2025-06","topic":"histo","concept":"Nucleus & chromatin","source":"ES2025","stem":"What is the typical feature of extended chromatin?","options":["Appears pale basophilic by LM","Appears as coarse granules by EM","Contains the inactive genes","Appears dark basophilic by LM"],"answer":0,"explanation":"الـ extended chromatin (euchromatin) بيظهر pale basophilic في الـ LM وفيه الـ active genes.","memoryTrick":"Extended = Pale & Active.","stemAr":"إيه الصفة المميزة للـ extended chromatin؟"},{"id":"ES2025-07","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025","stem":"The cilia can be characterized by which of the followings?","options":["The basal body is formed of nine microtubules","The rootlet contains twenty-seven microtubules","move secretions over the tissue surface in two directions","Can be found in the female genital system"],"answer":3,"explanation":"الـ cilia موجودة في الـ female genital system (الـ uterine tube) وبتحرك الـ ovum. الـ basal body 27 microtubule، والحركة في اتجاه واحد.","memoryTrick":"Cilia في الـ tube بتسوق البويضة.","stemAr":"الـ cilia ممكن توصف بأنهي واحدة من دول؟"},{"id":"ES2025-08","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2025","stem":"Which one of the following stains demonstrates glycogen in the liver cells?","options":["Sudan III","PAS","Silver","Sudan black"],"answer":1,"explanation":"الـ PAS بيصبغ الـ glycogen (magenta).","memoryTrick":"PAS = Polysaccharide (Glycogen).","stemAr":"أنهي stain من دول بيبيّن الـ glycogen في خلايا الكبد؟"},{"id":"ES2025-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025","stem":"What is the origin of transfer vesicles of Golgi apparatus?","options":["Smooth endoplasmic reticulum","Rough endoplasmic reticulum","The trans face of Golgi apparatus","The cell membrane"],"answer":1,"explanation":"الـ transfer vesicles بتنقل البروتين من الـ rER للـ cis face of Golgi، فأصلها الـ rER.","memoryTrick":"Transfer = من rER للـ Golgi.","stemAr":"إيه أصل الـ transfer vesicles بتاعة الـ Golgi apparatus؟"},{"id":"ES2025-10","topic":"anat","concept":"Scalp & face","source":"ES2025","stem":"A 40 years old male patient came to the hospital with bleeding in the scalp region on examination the wound showing a large gap, what is the cause of this gap?","options":["cutting of the epicranial aponeurosis","cutting of the second layer of the scalp","cutting of the pericranium","the wound is superficial"],"answer":0,"explanation":"الجرح بيفتح (gaping) لما الـ epicranial aponeurosis تتقطع بالعرض، لأن الـ frontal والـ occipital bellies بيشدوا الحافتين في اتجاهين عكس بعض.","memoryTrick":"Gap = Aponeurosis اتقطعت.","stemAr":"راجل عنده 40 سنة جه المستشفى بنزيف في منطقة الـ scalp، وبالكشف الجرح كان مفتوح جامد (large gap). إيه سبب الفتحة دي؟"},{"id":"ES2025-11","topic":"embryo","concept":"Gametogenesis","source":"ES2025","stem":"What is the primary mechanism that prevents polyspermy after the first sperm enters the egg?","options":["Cortical reaction","Decidual reaction","Acrosome reaction","Cleavage division"],"answer":0,"repeatOf":"ES2025A-12","explanation":"بعد دخول أول sperm بتحصل الـ cortical reaction: الـ cortical granules بتطلع إنزيمات تغير الـ zona pellucida (zona reaction) فتمنع الـ polyspermy.","memoryTrick":"Cortical = Close the door 🚪.","stemAr":"إيه الآلية الأساسية اللي بتمنع الـ polyspermy بعد ما أول sperm يدخل البويضة؟"},{"id":"ES2025-12","topic":"embryo","concept":"Implantation & second week","source":"ES2025","stem":"Where originates the extraembryonic mesoderm?","options":["It is a result of the migration of cells from the neuroectoderm","In a site between trophoblast and embryoblast","In a site between hypoblast and epiblast","In a site between endoderm and ectoderm"],"answer":1,"repeatOf":"EM2023-20","explanation":"حسب الملزمة الـ extraembryonic mesoderm بيظهر في المسافة بين الـ trophoblast (cytotrophoblast) والـ embryoblast/exocoelomic membrane.","memoryTrick":"Extraembryonic = بين الـ trophoblast والـ embryo.","stemAr":"الـ extraembryonic mesoderm أصله منين؟"},{"id":"ES2026G1-01","topic":"anat","concept":"Movements","source":"ES2026G1","stem":"Movement of the shoulder superiorly is termed which of the following?","options":["Protraction","Elevation","Depression","Retraction"],"answer":1,"explanation":"حركة الكتف لفوق اسمها elevation، ولتحت depression.","memoryTrick":"Elevation = لفوق ⬆️.","stemAr":"حركة الكتف لفوق اسمها إيه؟"},{"id":"ES2026G1-02","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2026G1","stem":"During the X-ray examination of a child, the bones appeared incomplete. The physician explained that the bones are still in the process of growing. Which of the following structures is responsible for increase the length of the bone?","options":["Periosteum","Endosteum","Epiphyseal plate (growth plate)","Articular cartilage"],"answer":2,"explanation":"الـ epiphyseal (growth) plate مسئول عن زيادة طول العظمة.","memoryTrick":"Length = Growth plate.","stemAr":"في أشعة X لطفل، العظام ظهرت مش مكتملة، والدكتور شرح إن العظام لسه بتنمو. أنهي structure من دول مسئول عن زيادة طول العظمة؟"},{"id":"ES2026G1-03","topic":"anat","concept":"Scalp & face","source":"ES2026G1","stem":"An 8-year-old child presents with fever and swelling of the scalp after a minor injury. The physician cautions that the infection may spread to the brain. Through which layer of the scalp can the infection reach the intracranial structures?","options":["Skin of the scalp","Connective tissue layer (dense subcutaneous tissue)","Loose areolar tissue layer","Pericranium"],"answer":2,"explanation":"العدوى بتوصل للمخ من خلال الـ loose areolar tissue عن طريق الـ emissary veins.","memoryTrick":"L = Lethal.","stemAr":"طفل عنده 8 سنين جه بسخونية وورم في الـ scalp بعد إصابة بسيطة، والدكتور حذّر إن العدوى ممكن توصل للمخ. العدوى ممكن توصل للـ intracranial structures عن طريق أنهي طبقة من الـ scalp؟"},{"id":"ES2026G1-04","topic":"embryo","concept":"Implantation & second week","source":"ES2026G1","stem":"An embryo shows failure of formation of the amniotic cavity. Which layer of the bilaminar disc is primarily affected?","options":["Hypoblast","Epiblast","Cytotrophoblast","Syncytiotrophoblast"],"answer":1,"explanation":"الـ amniotic cavity بتتكون فوق الـ epiblast، وخلايا الـ epiblast هي اللي بتعمل الـ amnioblasts.","memoryTrick":"Amnion فوق الـ Epiblast.","stemAr":"embryo فيه فشل في تكوين الـ amniotic cavity. أنهي طبقة من الـ bilaminar disc متأثرة أساسًا؟"},{"id":"ES2026G1-05","topic":"embryo","concept":"Implantation & second week","source":"ES2026G1","stem":"Failure of formation of extraembryonic mesoderm would prevent development of which of the following?","options":["Amniotic cavity","Chorionic cavity","Bilaminar germ disc","Trophoblastic shell"],"answer":1,"explanation":"الـ chorionic cavity (extraembryonic coelom) بتتكون من اندماج spaces جوه الـ extraembryonic mesoderm، فلو المسودرم ده مش موجود الـ cavity مش هتتكون.","memoryTrick":"Chorionic cavity = فجوات في الـ extraembryonic mesoderm.","stemAr":"فشل تكوين الـ extraembryonic mesoderm هيمنع تكوين أنهي واحد من دول؟"},{"id":"ES2026G1-06","topic":"embryo","concept":"Implantation & second week","source":"ES2026G1","stem":"A placenta later shows placenta previa. The abnormality most likely originated from implantation of the blastocyst in which of the following?","options":["Fundus of uterus","Posterior uterine wall","Lower uterine segment","Myometrium"],"answer":2,"explanation":"الـ placenta previa سببها implantation في الـ lower uterine segment.","memoryTrick":"Previa = تحت.","stemAr":"مشيمة ظهر فيها بعد كده placenta previa. العيب ده غالبًا جاي من إن الـ blastocyst زرع فين؟"},{"id":"ES2026G1-07","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026G1","stem":"A 15-year-old girl presents with primary amenorrhea, short stature, and webbed neck. What is her karyotype?","options":["46,XX","46,XY","45,X","47,XXX"],"answer":2,"explanation":"Turner syndrome (45,X): amenorrhea وقصر قامة و webbed neck.","memoryTrick":"Turner = X لوحده (45,X).","stemAr":"بنت عندها 15 سنة جاية بـ primary amenorrhea (الدورة مجتش خالص) وقِصَر قامة و webbed neck. إيه الـ karyotype بتاعها؟"},{"id":"ES2026G1-08","topic":"histo","concept":"Cell cycle & division","source":"ES2026G1","stem":"Regarding the prophase of the first meiotic divisi
