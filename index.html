mes مفيهاش DNA."]},{"id":"EM2024-07","topic":"histo","concept":"Nucleus & chromatin","source":"EM2024","stem":"Heterochromatin is:","options":["Present in the nuclei of metabolic metabolically active cells.","Special type of stain","Present in the nuclei of metabolically inactive cells","Type of cell inclusions."],"answer":2,"explanation":"الـ heterochromatin هو الـ chromatin المكثّف (condensed, inactive)، بيمثل chromosomes ملفوفة فيها inactive genes، زي في الـ small lymphocytes. أما الـ euchromatin (extended, active) ففيه الـ active genes في الخلايا اللي بتصنع بروتين.","memoryTrick":"Hetero = Inactive.","stemAr":"الـ heterochromatin هو:","whyWrong":["الخلايا النشطة اللي بتصنع بروتين فيها euchromatin (vesicular nucleus).","مش صبغة.",null,"الـ chromatin جزء من النواة وبيحمل الـ genetic material، مش من الـ cytoplasmic inclusions."]},{"id":"EM2024-08","topic":"histo","concept":"Nucleus & chromatin","source":"EM2024","stem":"The nucleolus is formed of:","options":["Heterochromatin and euchromatin","Nucleolonema and pars amorpha","Nucleolus associated and peripheral chromatin.","Condensed chromatin"],"answer":1,"repeatOf":"EM2023-08","explanation":"الـ nucleolus كتلة basophilic من غير غشا. فيه مناطق غامقة: pars amorpha (الـ nucleolar organizer) و pars fibrosa و pars granulosa. الـ pars fibrosa مع الـ pars granulosa بيتسموا nucleolonema. والمناطق الفاتحة اسمها nucleolar sap.","memoryTrick":"Nucleolus = Pars amorpha + Nucleolonema (fibrosa + granulosa).","stemAr":"الـ nucleolus مكوّن من:","whyWrong":["الـ heterochromatin والـ euchromatin نوعين الـ chromatin في النواة، مش مكونات الـ nucleolus.",null,"الـ nucleolus-associated chromatin والـ peripheral chromatin من أماكن الـ heterochromatin. الأول بيحيط بالـ nucleolus بس مش من مكوناته.","الـ condensed chromatin هو الـ heterochromatin."]},{"id":"EM2024-09","topic":"histo","concept":"Nucleus & chromatin","source":"EM2024","stem":"The nuclear pore..........","options":["Is at regular intervals.","Is bridged by a unit membrane","Is a transient structure","Allows for communication between the nucleus and the cytoplasm"],"answer":3,"repeatOf":"EM2023-09","explanation":"الـ nuclear pore complexes فتحات دايرية على مسافات في المكان اللي الغشائين بيلتحموا فيه. وظيفتها نقل البروتينات للنواة وخروج الـ RNA والـ ribosomal subunits للـ cytoplasm، يعني التواصل بين النواة والـ cytoplasm.","memoryTrick":"Pore = باب بين النواة والسيتوبلازم.","stemAr":"الـ nuclear pore:","whyWrong":["الـ pores فعلًا موجودة على مسافات (at intervals) في الـ nuclear envelope، لكن الإجابة المعتمدة هي وظيفتها: التواصل بين النواة والـ cytoplasm.","الـ pore فتحة في المكان اللي الـ inner والـ outer membranes بيلتحموا فيه، مش مقفولة بـ unit membrane.","الـ pore complexes جزء من تركيب الـ nuclear envelope، مش مذكور إنها مؤقتة.",null],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2024-10","topic":"histo","concept":"Cell membrane & transport","source":"EM2024","stem":"Glycocalyx is:","options":["The protein component of the cell membrane","The hydrophilic end of lipid","The carbohydrate component of the cell membrane","The hydrophobic end of lipid"],"answer":2,"repeatOf":"EM2023-10","explanation":"الـ cell coat (glycocalyx) هو الـ carbohydrate component للـ cell membrane: glycoproteins و glycolipids على السطح الخارجي، وفيه receptors للأدوية والهرمونات والبكتيريا والفيروسات.","memoryTrick":"Glyco = Carbohydrate.","stemAr":"الـ glycocalyx هو:","whyWrong":["الـ protein component (peripheral و integral) حوالي 50% من الغشا، وده غير الـ glycocalyx.","الـ hydrophilic polar head بتاع الـ phospholipid: charged ومتجه ناحية الـ aqueous solutions.",null,"الـ hydrophobic tail بتاع الـ phospholipid: non-charged ومتجه لجوه بعيد عن الـ aqueous solutions."]},{"id":"EM2024-11","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2024","stem":"Which of the following statements is incorrect?","options":["Microtubules are involved in ciliary movement and intracellular transport.","cis (forming) face of Golgi apparatus is where secretory granules are formed.","microtubules of the centrioles and in the basal body of cilia have a 9\\times3 arrangement.","Ribosomes, made of rRNA and protein, are site of protein synthesis."],"answer":1,"explanation":"الجملة الغلط B: الـ cis face (Entry = Convex = Forming = Immature) بتستقبل الـ transfer vesicles من الـ rER. أما الـ secretory vesicles فبتطلع من الـ trans face (Exit = Concave = Secretory = Mature).","memoryTrick":"Cis = داخل (من الـ rER) / Trans = خارج (إفراز).","stemAr":"أنهي جملة من دول غلط؟","whyWrong":["جملة صح: من وظايف الـ microtubules النقل جوه الخلية، والـ cilia الـ core بتاعها microtubules. والسؤال عن الغلط.",null,"جملة صح: جدار الـ centriole 9 bundles كل واحدة 3 MTs (triplets)، والـ basal body هو centriole بنفس الترتيب.","جملة صح: الـ ribosomes مكوّنة من rRNA وبروتين ووظيفتها الـ protein synthesis."]},{"id":"EM2024-12","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2024","stem":"Which of the following is one of characteristics of anatomical position?","options":["arms are abducted","palm face anterior","lower limbs are abducted","toes directed to left."],"answer":1,"explanation":"من صفات الـ anatomical position إن الـ palms تبص لقدام.","memoryTrick":"Palms Anterior.","stemAr":"أنهي واحدة من دول من صفات الـ anatomical position؟","whyWrong":["الـ arms adducted مش abducted.",null,"الـ lower limbs adducted.","الـ toes لقدام."]},{"id":"EM2024-13","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2024","stem":"Which of the following anatomical planes divided the body into anterior and posterior parts?","options":["Horizontal plane","Midsagittal plane","Coronal plane.","Parusagittal plane"],"answer":2,"explanation":"الـ coronal plane = anterior و posterior.","memoryTrick":"Coronal = قدام/ورا.","stemAr":"أنهي anatomical plane من دول بيقسم الجسم لجزء anterior وجزء posterior؟","whyWrong":["الـ horizontal فوق وتحت.","الـ midsagittal يمين وشمال.",null,"الـ parasagittal يمين وشمال مش متساويين."]},{"id":"EM2024-14","topic":"anat","concept":"Movements","source":"EM2024","stem":"Which of the following movement of the limb upward?","options":["Flexion","Elevation","Extension","Depression"],"answer":1,"repeatOf":"EM2023-14","explanation":"الـ elevation = تحريك الجزء لفوق (superiorly) زي رفع الكتف، والـ depression = تحريكه لتحت زي خفض الكتف.","memoryTrick":"Elevation = Elevator لفوق ⬆️.","stemAr":"أنهي حركة من دول بتحرك الطرف لفوق؟","whyWrong":["الـ flexion = bending ناحية الـ ventral surface (ثني المفصل).",null,"الـ extension = عكس الـ flexion، فرد المفصل.","الـ depression تحريك لتحت، عكس المطلوب."]},{"id":"EM2024-15","topic":"anat","concept":"Cartilage","source":"EM2024","stem":"Which of the following cartilage disappears in the adult?","options":["Growing plate","Articular cartilage","Costal cartilage","Cartilage of the auricle"],"answer":0,"repeatOf":"EM2023-15","explanation":"الغضروف بيفضل في أماكن معينة: الـ articular surfaces، الـ costal cartilage، الـ air passages (nasal و laryngeal و tracheal و bronchial)، والـ external ear والـ Eustachian tube. أما الـ growing plate فبتتعظم وتلتحم بالـ diaphysis.","memoryTrick":"Growth plate = بيقفل بعد البلوغ.","stemAr":"أنهي cartilage من دول بيختفي في البالغين؟","whyWrong":[null,"الـ articular cartilage بيفضل على أسطح المفاصل.","الـ costal cartilage بيفضل يوصّل الضلوع بالـ sternum.","غضروف الـ external ear بيفضل."]},{"id":"EM2024-16","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2024","stem":"There are two forms of bone, which of the following is the character of spongy bone?","options":["It consists of number of cylindrical units called haversian system","It is formed of trabeculae","It forms the surface layer of all bones","It provides strength for weight bearing"],"answer":1,"repeatOf":"EM2023-16","explanation":"الـ spongy (cancellous) bone مكوّن من trabeculae متشابكة بينها spaces فيها marrow. الـ Haversian systems والـ surface layer والـ weight bearing صفات الـ compact bone.","memoryTrick":"Spongy = إسفنجة = Trabeculae.","stemAr":"فيه نوعين من العظم، أنهي واحدة من دول صفة الـ spongy bone؟","whyWrong":["الـ Haversian systems صفة الـ compact.",null,"الطبقة الخارجية compact.","تحمّل الوزن والقوة صفة الـ compact."]},{"id":"EM2024-17","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2024","stem":"Which of the following arteries supplies bone marrow?","options":["Periosteal artery","articular artery","Epiphyseal artery","Nutrient artery"],"answer":3,"explanation":"الـ nutrient artery بتدخل العظمة من الـ nutrient canal وبتتقسم لـ proximal و distal branches في الـ medullary cavity، وبتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.","memoryTrick":"Nutrient = Marrow.","stemAr":"أنهي artery من دول بتغذي الـ bone marrow؟","whyWrong":["الـ periosteal arteries المصدر الأساسي لكل العظام، وبتغذي الـ outer compact bone.","الـ articular arteries بتغذي المفاصل وأطراف العظمة (epiphyseal و metaphyseal branches).","الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).",null]},{"id":"EM2024-18","topic":"embryo","concept":"Implantation & second week","source":"EM2024","stem":"Which structure does not take place in the late blastocyst?","options":["zone pellucida.","Trophoblast.","Embryoblast","Blastocele"],"answer":0,"explanation":"قبل الـ implantation الـ blastocyst لازم يتخلص من الـ zona pellucida (hatching). الإجابة المعتمدة إن الـ late blastocyst هو اللي حصله hatching، ففيه trophoblast و inner cell mass (embryoblast) و blastocele من غير zona.","memoryTrick":"Late = بدون zona.","stemAr":"أنهي structure مبيتكونش في الـ late blastocyst؟","whyWrong":[null,"الـ trophoblast (الـ outer layer) موجود في الـ blastocyst.","الـ embryoblast (inner cell mass) موجود.","الـ blastocele هو الـ cavity بتاعة الـ blastocyst نفسه."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2024-19","topic":"embryo","concept":"Implantation & second week","source":"EM2024","stem":"Which statement is true about the trophoblast?","options":["It differentiates into outer cytotrophoblast & inner syncytiotrophoblast","It differentiates into inner cytotrophoblast & outer syncytiotrophoblast","Structure called \"trophoblast\" does not exist during development of human","It does not differentiate further"],"answer":1,"explanation":"الـ trophoblast ➜ inner cytotrophoblast + outer syncytiotrophoblast.","memoryTrick":"Syncytio بره.","stemAr":"أنهي جملة صح عن الـ trophoblast؟","whyWrong":["مقلوبة.",null,"الـ trophoblast موجود.","بيتمايز."]},{"id":"EM2024-20","topic":"embryo","concept":"Implantation & second week","source":"EM2024","stem":"Where originates the extraembryonic mesoderm?","options":["It is a result of the migration of cells from neuroectoderm","In a site between trophoblast and embryoblast","In a site between hypoblast and epiblast","In a site between endoderm and ectoderm."],"answer":1,"explanation":"الـ extraembryonic mesoderm: خلايا بتظهر بين الـ inner surface بتاع الـ cytotrophoblast والـ outer surface بتاع الـ yolk sac، وبتكوّن طبقة loose connective tissue.","memoryTrick":"بين الـ tropho والـ embryo.","stemAr":"الـ extraembryonic mesoderm أصله منين؟","whyWrong":["الـ extraembryonic mesoderm بيظهر بين الـ cytotrophoblast والـ yolk sac، مش من الـ neuroectoderm.",null,"الـ hypoblast والـ epiblast هما الـ bilaminar germ disc نفسه، ومفيش بينهم المكان ده.","الـ extraembryonic mesoderm بيظهر بين الـ cytotrophoblast والـ yolk sac في الأسبوع التاني."]},{"id":"EM2024-21","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2024","stem":"Where the fertilization occurs usually?","options":["In infundibular part of Fallopian tube","In ampullary part of Fallopian tube","Horn of the uterus","Cavity of the uterus"],"answer":1,"explanation":"الـ fertilization بتحصل في الـ ampulla (الـ lateral third) of the uterine tube.","memoryTrick":"Ampulla.","stemAr":"الـ fertilization بيحصل عادةً فين؟","whyWrong":["الـ infundibulum مش مكان الـ fertilization.",null,"الـ cornua مش مكان الـ fertilization.","الـ uterine cavity مكان الـ implantation، مش الـ fertilization."]},{"id":"EM2024-22","topic":"embryo","concept":"Gametogenesis","source":"EM2024","stem":"What is a capacitation?","options":["Capacitation is a process which the glycoprotein layer over acrosome is dissolved","Capacitation is a process in which sperm penetrates zona pellucida.","Capacitation is a process in which tail of sperm is inactivated","Capacitation is a process in which tail of sperm is activated"],"answer":0,"explanation":"الـ capacitation = adaptation للـ sperms في الـ female genital tract (حوالي 7 ساعات). بيحصل تغيير في الـ cell membrane بتاع الـ sperm وبتتشال طبقة glycoprotein (cleaning of the sperm).\nالنتيجة: منطقة الـ acrosomal cap بتتغير فيبقى الـ acrosome reaction ممكن، والـ sperm بيبقى hyperactive. ومن غير capacitation مفيش fertilization.","memoryTrick":"نشيل الغطا.","stemAr":"يعني إيه capacitation؟","whyWrong":[null,"اختراق الـ zona بيحصل بعد الـ capacitation والـ acrosomal reaction.","بالعكس، الـ capacitation بيخلي الـ sperm hyperactive.","الـ capacitation بيخلي الـ sperm hyperactive فعلًا، لكن تعريفها الأساسي هو شيل طبقة الـ glycoprotein."]},{"id":"EM2024-23","topic":"embryo","concept":"Implantation & second week","source":"EM2024","stem":"When starts the implantation?","options":["Immediately after fertilization","3rd day after fertilization.","6th day after fertilization","9th day after fertilization"],"answer":2,"repeatOf":"EM2023-23","explanation":"الـ implantation بتبدأ حوالي اليوم السادس بعد الـ fertilization.","memoryTrick":"Day 6 = Implantation.","stemAr":"الـ implantation بيبدأ إمتى؟","whyWrong":["بعد الـ fertilization على طول لسه في مرحلة الـ zygote جوه الـ tube.","يوم 3 الـ morula لسه في الـ tube.",null,"يوم 9 الـ implantation بيكون شغال بالفعل وقرب يكمل."]},{"id":"EM2024-24","topic":"embryo","concept":"Implantation & second week","source":"EM2024","stem":"most common site for implantation in ectopic pregnancy is:","options":["internal Os of uterus","mesentery","ovary","uterine tube"],"answer":3,"explanation":"بعد الـ implantation الطبيعي بيكون في الـ posterior wall of the uterus near the fundus. الـ abnormal implantation بره الرحم: 95% في الـ fallopian tube، أو في الـ ovary، أو في الـ peritoneal wall. وجوه الرحم: placenta previa.","memoryTrick":"Ectopic = Tube (95%).","stemAr":"أشهر مكان للـ implantation في الـ ectopic pregnancy هو:","whyWrong":["الـ implantation عند الـ internal os جوه الرحم = placenta previa.","الـ peritoneal implantation بره الرحم، لكنه مش الأشهر.","الـ ovary من أماكن الـ implantation بره الرحم، لكنه مش الأشهر.",null]},{"id":"EM2024-25","topic":"embryo","concept":"Implantation & second week","source":"EM2024","stem":"first week of human development is characterized by formation of:","options":["inner cell mass","trophoblast","blastocyst","all of above"],"answer":3,"explanation":"الأسبوع الأول بيكوّن الـ blastocyst بكل أجزاؤه (ICM و trophoblast).","memoryTrick":"All of the above.","stemAr":"الأسبوع الأول من نمو الإنسان بيتميز بتكوين:","whyWrong":["ناقص.","ناقص.","ناقص. كلهم بيتكونوا.",null]},{"id":"EM2024-26","topic":"embryo","concept":"Gametogenesis","source":"EM2024","stem":"The ovulated mammalian oocyte is arrested at:","options":["prophase of meiosis I","metaphase of meiosis I","prophase of meiosis II","metaphase of meiosis II"],"answer":3,"repeatOf":"EM2023-26","explanation":"عند الـ ovulation الـ secondary oocyte بيدخل الـ meiosis II ويقف في الـ metaphase II، ولو حصل fertilization بيكمّلها في الـ uterine tube ويطلع mature ovum + second polar body.","memoryTrick":"Ovulation = Metaphase II ✌️.","stemAr":"الـ oocyte بعد الـ ovulation في الثدييات بيكون واقف (arrested) عند:","whyWrong":["الـ primary oocyte بيقف في الـ prophase I من قبل الولادة، والـ block ده بيتشال عند الـ puberty، فوقت الـ ovulation بيكون كمّل الـ meiosis I.","وقت الـ ovulation الـ oocyte كمّل الـ meiosis I بالفعل وبقى secondary oocyte.","الـ secondary oocyte بيقف في الـ metaphase II مش الـ prophase II.",null]},{"id":"EM2024-27","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2024","stem":"All but one of following statements about cleavage are true. Except","options":["cleavage occurs when the embryo travels through the Fallopian tube","During cleavage, the amount of DNA inside the embryo increases","Embryo is closed inside zona pellucida during cleavage","Cleavage continues after implantation"],"answer":3,"explanation":"الغلط D: الـ cleavage = انقسامات mitotic سريعة بتحصل في الـ fallopian tube والـ embryo جوه الـ zona pellucida. بعدها الـ morula بتوصل الرحم حوالي يوم 4، وبعدين الـ blastocyst هو اللي بيعمل implantation حوالي يوم 6. يعني الـ cleavage بيخلص قبل الـ implantation.","memoryTrick":"Cleavage في الـ tube ➜ Morula ➜ Blastocyst ➜ Implantation.","stemAr":"كل الجمل دي عن الـ cleavage صح ما عدا واحدة:","whyWrong":["جملة صح: الـ cleavage بيحصل في الـ fallopian tube والـ zygote رايح ناحية الرحم. والسؤال عن الغلط.","جملة صح: كل خلية بتفضل 2N، وعدد الخلايا (blastomeres) بيزيد مع كل انقسام، فإجمالي الـ DNA في الـ embryo بيزيد. اللي مش بيزيد هو الحجم (not accompanied by growth).","جملة صح: الـ blastomeres بتفضل جوه الـ zona pellucida، وحتى الـ morula لسه محاطة بيها.",null]},{"id":"EM2024-28","topic":"embryo","concept":"Implantation & second week","source":"EM2024","stem":"Which embryonic structure gives rise to cells in our bodies?","options":["epiblast and hypoblast","Hypoblast","Epiblast","Extraembryonic mesoderm"],"answer":2,"repeatOf":"EM2023-28","explanation":"الإجابة المعتمدة: الـ epiblast هو اللي بيدي الـ germ layers (ectoderm و mesoderm و endoderm). في الأسبوع التاني الـ bilaminar germ disc فيه epiblast (high columnar ناحية الـ amniotic cavity) و hypoblast (small cuboidal ناحية الـ blastocyst cavity).","memoryTrick":"Epiblast = أبو الجسم كله.","stemAr":"أنهي embryonic structure بيدي خلايا جسمنا؟","whyWrong":["الـ hypoblast بيدي structures extraembryonic (زي الـ yolk sac)، مش خلايا الجسم.","نفس الكلام.",null,"الـ extraembryonic mesoderm برا الجنين."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"ES2024-01","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2024","stem":"All of the following are characters of Golgi apparatus except:","options":["Shows -Ve image in deeply basophilic cytoplasm.","Stained with silver.","Supranuclear in nerve cells.","Has mature trans- face & immature cis- face."],"answer":2,"explanation":"الغلط C: لما الـ Golgi يتصبغ بالـ silver بيظهر بشكلين:\n• Apical (supranuclear): بين النواة والقطب في الخلايا المفرزة زي الـ epididymis.\n• Perinuclear: بيحيط بالنواة كلها زي في الـ nerve cells.\nيعني في الـ nerve cells بيكون perinuclear مش supranuclear.","memoryTrick":"Nerve = Perinuclear / Epididymis = Apical (supranuclear).","stemAr":"كل دول من صفات الـ Golgi apparatus ما عدا:","whyWrong":["جملة صح: في الـ cytoplasm الـ deeply basophilic (زي الـ plasma cell) الـ Golgi بيبان negative image. والسؤال عن الغلط.","جملة صح: بالـ silver (Ag) بيبان network من brown granules & fibrils.",null,"جملة صح: الـ trans face = mature، والـ cis face = immature."]},{"id":"ES2024-02","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2024","stem":"The basal body of a cilium has a microtubular arrangement which is identical to the pattern found in:","options":["microvilli","centrioles","spindle fibers","stereocilia."],"answer":1,"explanation":"الـ basal body هو centriole واحد مكوّن من 27 MT في 9 triplets، يعني نفس ترتيب جدار الـ centriole (9 × 3 = 27).","memoryTrick":"Basal body = Centriole (9×3).","stemAr":"الـ basal body بتاع الـ cilium ترتيب الـ microtubules فيه مطابق للترتيب الموجود في:","whyWrong":["الـ microvilli الـ core بتاعها actin filaments، مش microtubules.",null,"الـ spindle مكوّن من microtubules (cytoplasmic و chromosomal و astral)، مش مترتب 9 triplets.","الـ stereocilia هي microvilli طويلة، مش بترتيب الـ centriole."]},{"id":"ES2024-03","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2024","stem":"The organelle most prominent in steroid secreting cells is:","options":["RER","SER","Lysosomes","Cilia"],"answer":1,"explanation":"الـ sER بيكون well-developed في الخلايا اللي بتصنع fat و steroid hormones (زي الـ adrenal cortex والـ endocrine cells).","memoryTrick":"Steroid = Smooth.","stemAr":"الـ organelle الأوضح (most prominent) في الخلايا اللي بتفرز steroids هو:","whyWrong":["الـ rER لتصنيع البروتينات اللي بتتفرز.",null,"الـ lysosomes للـ intracytoplasmic digestion.","الـ cilia بتحرك الإفرازات على السطح في اتجاه واحد، ملهاش علاقة بتصنيع الـ steroids."]},{"id":"ES2024-04","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2024","stem":"One of the following is a numerical aberration of sex chromosomes:","options":["Turner's syndrome","Down's syndrome","Translocation","Isochromosome"],"answer":0,"explanation":"الـ Turner syndrome (45,X0) = monosomy of sex chromosome: أنثى عندها X واحد بس. ده numerical aberration في الـ sex chromosomes.","memoryTrick":"Turner = X واحد ناقص.","stemAr":"واحد من دول numerical aberration في الـ sex chromosomes:","whyWrong":[null,"الـ Down syndrome numerical aberration بس في autosome (trisomy 21)، مش sex chromosomes.","الـ translocation من الـ structural aberrations.","الـ isochromosome من الـ structural aberrations."]},{"id":"ES2024-05","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2024","stem":"As regards ribosomes:","options":["Their subunits are formed in the nucleolus.","Cause cytoplasmic acidophilia.","Are formed of DNA associated with proteins.","Are formed of two subunits of equal size."],"answer":0,"explanation":"الـ rRNA بيتصنع في الـ nucleolus، ومن وظايف الـ nucleolus تكوين الـ ribosomal subunits اللي بتعدّي من الـ nuclear pores للـ cytoplasm.","memoryTrick":"Ribosome subunits ⬅ Nucleolus.","stemAr":"بخصوص الـ ribosomes:","whyWrong":[null,"الـ ribosomes بتسبب cytoplasmic basophilia بسبب الـ RNA، مش acidophilia.","الـ ribosomes مكوّنة من rRNA وبروتينات، مش DNA.","الـ ribosome مكوّن من subunit صغيرة و subunit كبيرة (small & large)."]},{"id":"ES2024-06","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2024","stem":"Duplication of DNA occurs in:","options":["G1 phase","G2 phase","S phase","Mitosis"],"answer":2,"explanation":"الـ DNA duplication بتحصل في الـ S phase (حوالي 8 ساعات)، والنتيجة 46 d-chromosomes. وكمان الـ centrioles بتتضاعف فيها.","memoryTrick":"S = Synthesis.","stemAr":"تضاعف الـ DNA بيحصل في:","whyWrong":["في الـ G1 الخلية بتكبر وبتصنع RNA وبروتينات لازمة للـ DNA duplication، لكن لسه ما ضاعفتش.","الـ G2 بعد الـ S: فيها تصنيع RNA وبروتينات للانقسام وتصنيع الـ tubulin ومراجعة الـ DNA وتصحيح أخطائه.",null,"في الـ mitosis الـ chromatids بتتوزع على الخليتين، مش بيحصل duplication."]},{"id":"ES2024-07","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2024","stem":"One of the following is an endogenous pigment:","options":["Lead","Carotene","Tattoo","Hemoglobin"],"answer":3,"explanation":"الـ pigments نوعين:\n• Endogenous (من جوه الجسم): hemoglobin (في الـ RBCs)، melanin، lipofuscin.\n• Exogenous (من بره): carbon & dust particles، carotene، tattoo marks.","memoryTrick":"Endo = جوه (Hb, Melanin, Lipofuscin) / Exo = بره (Carbon, Carotene, Tattoo).","stemAr":"واحد من دول endogenous pigment:","whyWrong":["الـ lead مادة بتدخل الجسم من بره، مش بيصنعها الجسم، فمش endogenous.","الـ carotene من الـ exogenous pigments (من الأكل زي الجزر).","الـ tattoo marks من الـ exogenous pigments: صبغات بتتحقن تحت الجلد وتاخدها الـ phagocytic cells.",null]},{"id":"ES2024-08","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2024","stem":"Which of the following statements is incorrect?","options":["Heterochromatin, as seen in EM, is lighter staining DNA.","The nucleolus is the region within the nucleus where rRNA is formed.","The function of SER includes lipid synthesis.","RER and SER can be continuous"],"answer":0,"explanation":"الغلط A: الـ heterochromatin هو الـ condensed (inactive) chromatin، في الـ LM بيدي condensed nucleus وفي الـ EM بيظهر coarse granules. اللي بيدي نواة فاتحة (pale, vesicular) هو الـ euchromatin، وفي الـ EM بيظهر fine granules.","memoryTrick":"Hetero = Condensed & Coarse / Eu = Pale & Fine.","stemAr":"أنهي جملة من دول غلط؟","whyWrong":[null,"جملة صح: الـ nucleolus بيكوّن الـ rRNA والـ ribosomal subunits. والسؤال عن الغلط.","جملة صح: الـ sER بيصنع الـ phospholipids والـ steroid hormones.","جملة صح: الـ sER continuous مع الـ rER."]},{"id":"ES2024-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2024","stem":"Enzymes associated with drug detoxification are associated with:","options":["SER","RER","Golgi","Mitochondria"],"answer":0,"explanation":"من وظايف الـ sER الـ detoxification للأدوية والهرمونات والكحول في الـ liver cells.","memoryTrick":"Detox = Smooth.","stemAr":"الإنزيمات المرتبطة بالـ drug detoxification مرتبطة بـ:","whyWrong":[null,"الـ rER لتصنيع البروتينات اللي بتتفرز.","الـ Golgi للـ packing وتعديل البروتينات.","الـ mitochondria للـ cell respiration وإنتاج الـ ATP."]},{"id":"ES2024-10","topic":"anat","concept":"Scalp & face","source":"ES2024","stem":"A 13 years old male patient came to the hospital with bleeding in the scalp region on examination the wound was without gapping, this wound may be in which of the following layers of scalp?","options":["first and second","third","fourth","Fifth"],"answer":0,"explanation":"الطبقة التانية (connective tissue) فيها fibrous tissue بتربط الطبقة الأولى بالتالتة، فالـ 3 طبقات بيتحركوا كطبقة واحدة. ده بيمنع الأوعية إنها تنكمش بعد الجرح فيبقى النزيف profuse من غير gaping. أما لو الـ aponeurosis اتقطعت فالجرح بيفتح (gaping).","memoryTrick":"Gaping = اتقطعت الـ Aponeurosis (A).","stemAr":"ولد عنده 13 سنة جه المستشفى بنزيف في منطقة الـ scalp، وبالكشف الجرح مكانش مفتوح (without gaping). الجرح ده ممكن يكون في أنهي طبقة من طبقات الـ scalp؟","whyWrong":[null,"لو الطبقة التالتة (aponeurosis) اتقطعت الجرح بيفتح (gaping).","الطبقة الرابعة (loose areolar tissue) هي الـ dangerous layer، والنزيف فيها بيعمل swelling في الـ scalp كله.","الطبقة الخامسة هي الـ pericranium، والجرح من غير gaping بيكون في الطبقات الأولى والتانية."]},{"id":"ES2024-11","topic":"embryo","concept":"Gametogenesis","source":"ES2024","stem":"The secondary oocyte undergoes completion of the second meiotic division:","options":["Before ovulation","At fertilization","Prenatal","At puberty"],"answer":1,"explanation":"الـ secondary oocyte بيكمل الـ second meiotic division بس وقت الـ fertilization (لما الـ sperm يدخل).","memoryTrick":"Meiosis II = Fertilization.","stemAr":"الـ secondary oocyte بيكمّل الـ second meiotic division:","whyWrong":["قبل الـ ovulation بيكمّل الـ meiosis I، مش II.",null,"قبل الولادة الـ oocyte بيقف في prophase I.","عند البلوغ بيكمّل الـ meiosis I للـ follicle اللي بينضج."]},{"id":"ES2024-12","topic":"embryo","concept":"Implantation & second week","source":"ES2024","stem":"The embryonic epiblast gives rise to the following:","options":["Ectoderm","Mesoderm","Endoderm","All of the above"],"answer":3,"explanation":"الإجابة المعتمدة: الـ epiblast هو اللي بيدي الـ germ layers (ectoderm و mesoderm و endoderm). في الأسبوع التاني الـ bilaminar germ disc فيه epiblast (high columnar ناحية الـ amniotic cavity) و hypoblast (small cuboidal ناحية الـ blastocyst cavity).","memoryTrick":"Epiblast = 3 layers.","stemAr":"الـ embryonic epiblast بيدي:","whyWrong":["صح بس ناقص.","صح بس ناقص.","صح بس ناقص. الـ epiblast بيدي التلات طبقات بالـ gastrulation.",null],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"ES2024-13","topic":"embryo","concept":"Fetal membranes & placenta","source":"ES2024","stem":"The wall of the chorionic sac is composed of:","options":["cytotrophoblast and syncytiotrophoblast","two layers of trophoblast lined by extraembryonic somatic mesoderm","trophoblast and exocoelomic membrane","extraembryonic splanchnic mesoderm and both layers of trophoblast"],"answer":1,"repeatOf":"EM2019A-11","explanation":"الـ chorion هو أبعد fetal membrane حوالين الـ embryo، ومكوّن من:\n1. Extraembryonic somatic mesoderm.\n2. Cytotrophoblast.\n3. Syncytiotrophoblast.","memoryTrick":"Chorion = Trophoblast (cyto + syncytio) + Somatic mesoderm.","stemAr":"جدار الـ chorionic sac مكوّن من:","whyWrong":["ناقص الطبقة التالتة: الـ extraembryonic somatic mesoderm.",null,"الـ exocoelomic membrane بتحيط بالـ blastocyst cavity وتحولها لـ primitive yolk sac، مش جزء من الـ chorion.","الـ chorion مبطن بالـ somatic مش الـ splanchnic mesoderm."]},{"id":"ES2024-14","topic":"embryo","concept":"Female cycles & hormones","source":"ES2024","stem":"At the time of ovulation the endometrium is in the:","options":["Menstrual phase","Early proliferative phase","Late proliferative phase","Late secretory phase"],"answer":2,"explanation":"وقت الـ ovulation (يوم 14) الـ endometrium بيكون في آخر الـ proliferative phase.","memoryTrick":"Ovulation = نهاية الـ proliferative.","stemAr":"وقت الـ ovulation الـ endometrium بيكون في:","whyWrong":["الـ menstrual في أول الدورة (يوم 1–5).","الـ early proliferative بدري عن الـ ovulation.",null,"الـ late secretory في آخر الدورة."]},{"id":"EM2025A-01","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025A","stem":"Which of the following best describes the anatomical position of the lower limbs and toes?","options":["Knees flexed, the toes turned inward","Legs abducted, feet rotated outward","Legs extended and parallel, feet flat with toes directed forward","Knees flexed, feet together with toes pointing sideways"],"answer":2,"explanation":"في الـ anatomical position الرجلين ممدودين ومتوازيين، والقدم flat والأصابع لقدام.","memoryTrick":"واقف مستقيم وكل حاجة لقدام.","stemAr":"أنهي واحدة من دول أحسن وصف لوضع الـ lower limbs والأصابع في الـ anatomical position؟","whyWrong":["الركب مش مثنية في الـ anatomical position.","الرجلين مش abducted.",null,"الركب مش مثنية والصوابع لقدام."]},{"id":"EM2025A-02","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025A","stem":"Which plane divides the body into anterior and posterior parts?","options":["Midsagittal plane","Parasagittal plane","Coronal plane.","Horizontal plane"],"answer":2,"explanation":"الـ coronal plane = anterior و posterior.","memoryTrick":"Coronal = قدام/ورا.","stemAr":"أنهي plane بيقسم الجسم لجزء anterior وجزء posterior؟","whyWrong":["الـ midsagittal يمين وشمال.","الـ parasagittal يمين وشمال مش متساويين.",null,"الـ horizontal فوق وتحت."]},{"id":"EM2025A-03","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025A","stem":"What is the meaning of superficial dissection of the dorsal aspect of the neck?","options":["Dissection of the skin and front of the neck","Dissection of the skin and back of the neck","Dissection of the muscles and vessels of the back of the neck","Dissection of the muscles and vessels of the front of the neck"],"answer":1,"explanation":"الـ superficial = قريب من السطح (skin)، والـ dorsal = الخلف. يعني dissection للـ skin في back of the neck.","memoryTrick":"Superficial = Skin / Dorsal = Back.","stemAr":"يعني إيه superficial dissection للـ dorsal aspect بتاع الرقبة؟","whyWrong":["الـ front = ventral مش dorsal.",null,"الـ muscles والـ vessels أعمق، فده مش superficial.","الـ front والعمق الاتنين غلط."]},{"id":"EM2025A-04","topic":"anat","concept":"Movements","source":"EM2025A","stem":"Moving the distal segment away from the proximal segment is called which of the following?","options":["Adduction","Abduction","Flexion","Extension"],"answer":3,"explanation":"الـ flexion = bending: الـ anterior surface بتاع الـ distal segment بيقرب من الـ proximal segment. الـ extension عكسها: فرد المفصل (straightening)، فالـ distal segment بيبعد عن الـ proximal.","memoryTrick":"Extension = فرد ➜ البعيد يبعد / Flexion = ثني ➜ يقرب.","stemAr":"تحريك الجزء البعيد (distal segment) بعيد عن الجزء القريب (proximal segment) اسمه إيه؟","whyWrong":["الـ adduction حركة ناحية الـ midline.","الـ abduction بعيد عن الـ midline، مش بين جزئين من الطرف. وده اللبس الشائع.","الـ flexion بيقرّب الجزئين من بعض.",null]},{"id":"EM2025A-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2025A","stem":"Which of the following is the character of the compact bone?","options":["Contains large spaces filled with bone marrow","Composed of loosely arranged trabeculae","Dense and organized into a number of cylindrical units","Found only in the epiphysis of long bones"],"answer":2,"explanation":"الـ compact (hard) bone: كثيف، بيكوّن الطبقة السطحية لكل العظام والـ tubular shafts بتاعة الـ long bones، ومكوّن من cylindrical units اسمها Haversian systems، وبيدي قوة لتحمل الوزن.","memoryTrick":"Compact = Haversian (Osteons).","stemAr":"أنهي واحدة من دول صفة الـ compact bone؟","whyWrong":["المسافات المليانة bone marrow صفة الـ spongy bone.","الـ trabeculae صفة الـ spongy bone.",null,"الـ compact bone بيكوّن الطبقة السطحية لكل العظام، والـ epiphysis (أطراف الـ long bones) أغلبها spongy."]},{"id":"EM2025A-06","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2025A","stem":"Which of the following arteries can supply the bone marrow?","options":["Periosteal","Epiphyseal","Metaphyseal","Nutrient"],"answer":3,"explanation":"الـ nutrient artery بتدخل العظمة من الـ nutrient canal وبتتقسم لـ proximal و distal branches في الـ medullary cavity، وبتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.","memoryTrick":"Nutrient = Marrow.","stemAr":"أنهي artery من دول ممكن تغذي الـ bone marrow؟","whyWrong":["الـ periosteal arteries المصدر الأساسي لكل العظام، وبتغذي الـ outer compact bone.","الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis).",null]},{"id":"EM2025A-07","topic":"anat","concept":"Skeleton & types of bones","source":"EM2025A","stem":"Which of the following is considered a short bone?","options":["Carpal bone","Phalanges","Patella","Clavicle"],"answer":0,"explanation":"الـ short bones: cuboidal، ليها cortex رفيع من compact bone وجواها cancellous bone، وبتتعرض للضغط، زي الـ carpal والـ tarsal bones.","memoryTrick":"Carpal = Short.","stemAr":"أنهي واحدة من دول تعتبر short bone؟","whyWrong":[null,"الـ phalanges من الـ long bones.","الـ patella sesamoid bone (في وتر عضلة).","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."]},{"id":"EM2025A-08","topic":"embryo","concept":"Female cycles & hormones","source":"EM2025A","stem":"If Sara's cycle is 38 days, on which day is she most likely to ovulate?","options":["Day 14","Day 24","Day 28","Day 35"],"answer":1,"explanation":"الإجابة المعتمدة: يوم 24. الـ menstrual cycle بتستمر من 24 لـ 38 يوم، وفي الدورة الـ 28 يوم الـ ovulation بيحصل يوم 14 والـ luteal phase من 14 لـ 28.","memoryTrick":null,"stemAr":"لو الدورة عند سارة 38 يوم، غالبًا هيحصلها ovulation في يوم كام؟","whyWrong":["يوم 14 ده الـ ovulation في الدورة الـ 28 يوم.",null,"⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2025A-09","topic":"embryo","concept":"Female cycles & hormones","source":"EM2025A","stem":"Which hormone surges right before ovulation, triggering the release of an egg?","options":["Progesterone","Estrogen","Luteinizing hormone (LH)","Follicle-stimulating hormone (FSH)"],"answer":2,"explanation":"الـ ovulation بيحصل بسبب زيادة الضغط جوه الـ Graafian follicle نتيجة زيادة إفراز الـ LH من الـ pituitary gland (LH surge).","memoryTrick":"LH surge ➜ Ovulation 🥚","stemAr":"أنهي hormone بيعمل surge (ارتفاع مفاجئ) قبل الـ ovulation مباشرةً فيخلّي البويضة تنزل؟","whyWrong":["الـ progesterone بيفرزه الـ corpus luteum بعد الـ ovulation.","الـ estrogen بيفرزه الـ Graafian follicle في الـ proliferative phase، لكن اللي بيعمل الـ ovulation هو الـ LH surge.",null,"الـ FSH بيخلّي الـ primordial follicles تبدأ تنمو، لكن اللي بيعمل الـ ovulation هو الـ LH surge."]},{"id":"EM2025A-10","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"If Sarah doesn't conceive, what event marks the end of the luteal phase?","options":["Ovulation","Menstruation","LH surge","Implantation"],"answer":1,"explanation":"لو مفيش حمل الـ corpus luteum بيضمر، الـ progesterone ينزل، فتحصل الـ menstruation ودي نهاية الـ luteal phase.","memoryTrick":"مفيش حمل = Menstruation.","stemAr":"لو سارة محملتش، إيه الحدث اللي بيعلن نهاية الـ luteal phase؟","whyWrong":["الـ ovulation بداية الـ luteal phase مش نهايتها.",null,"الـ LH surge قبل الـ ovulation.","الـ implantation يعني حمل، والسؤال إنها ما حملتش."]},{"id":"EM2025A-11","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"Which hormone is released after implantation and is used to confirm pregnancy?","options":["LH (Luteinizing hormone)","FSH (Follicle-stimulating hormone)","HCG (Human chorionic Gonadotropin)","Estrogen"],"answer":2,"explanation":"الـ hCG بيفرزه الـ syncytiotrophoblast، وبيحافظ على الـ corpus luteum عشان يكمّل يفرز progesterone و estrogen. وبيتكشف حوالي آخر الأسبوع التاني فبيأكد الـ implantation (الحمل).","memoryTrick":"Pregnancy = hCG.","stemAr":"أنهي hormone بيتفرز بعد الـ implantation وبيستخدم لتأكيد الحمل؟","whyWrong":["الـ LH بيتفرز من الـ pituitary في كل دورة وبيعمل الـ ovulation.","الـ FSH بيتفرز من الـ pituitary في كل دورة وبيخلي الـ follicles تنمو.",null,"الـ estrogen بيتفرز في كل دورة من الـ Graafian follicle، فمش بيأكد الحمل."]},{"id":"EM2025A-12","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2025A","stem":"At what stage does the fertilized egg typically implant in the uterus?","options":["Zygote","Morula","Blastocyst","Embryo"],"answer":2,"explanation":"الـ implantation بتحصل في مرحلة الـ blastocyst.","memoryTrick":"Blastocyst = يزرع.","stemAr":"البويضة الملقّحة بتزرع في الرحم عادةً في أنهي مرحلة؟","whyWrong":["الـ zygote لسه في الـ tube بعد الـ fertilization على طول.","الـ morula بتوصل الرحم بس لسه محاطة بالـ zona ومبتزرعش.",null,"الـ implantation بيبدأ في مرحلة الـ blastocyst (حوالي اليوم 6)."]},{"id":"EM2025A-13","topic":"embryo","concept":"Gametogenesis","source":"EM2025A","stem":"Which term describes complete absence of sperm in semen analysis?","options":["Azoospermia","Oligospermia","Teratozoospermia","Asthenozoospermia"],"answer":0,"explanation":"اضطرابات عدد الـ sperms:\n• Azoospermia: absence of the sperms (مفيش sperms خالص).\n• Oligospermia: أقل من 20 million/ml.","memoryTrick":"A-zoo = مفيش حيوانات خالص.","stemAr":"أنهي مصطلح بيوصف الغياب التام للـ sperm في تحليل السائل المنوي؟","whyWrong":[null,"الـ oligospermia = عدد قليل (أقل من 20 million/ml) مش غياب تام.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."]},{"id":"EM2025A-14","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"What major event typically occurs at the start of the second week of development?","options":["Gastrulation","Fertilization","Implantation of the blastocyst","Formation of the neural tube"],"answer":2,"explanation":"في الأسبوع التاني بيكمل الـ implantation (بيبدأ حوالي اليوم 6 وبيخلص يوم 11-12)، وبيحصل تمايز الـ bilaminar germ disc والـ trophoblast وتكوين الـ cavities.","memoryTrick":"Week 2 = Implantation + Two layers.","stemAr":"إيه الحدث الكبير اللي بيحصل عادةً في بداية الأسبوع التاني من النمو؟","whyWrong":["الـ gastrulation مش من أحداث الأسبوع التاني.","الـ fertilization من أحداث الأسبوع الأول.",null,"الـ neural tube مش من أحداث الأسبوع التاني."]},{"id":"EM2025A-15","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"What cavity begins to develop during the end of the second week?","options":["Chorionic cavity","Amniotic cavity","Yolk sac.","Blastocoele"],"answer":0,"explanation":"خلايا الـ extraembryonic mesoderm بيظهر بينها cavities متعددة، وبتلتحم وتكوّن cavity واحدة اسمها chorionic cavity.","memoryTrick":"آخر Week 2 = Chorionic cavity.","stemAr":"أنهي cavity بتبدأ تتكون في آخر الأسبوع التاني؟","whyWrong":[null,"الـ amniotic cavity بتظهر جوه الـ epiblast قبل ظهور الـ extraembryonic mesoderm.","الـ primitive yolk sac بيتكون بدري (لما الـ exocoelomic membrane تحيط بالـ blastocyst cavity).","الـ blastocele بيتكون في الأسبوع الأول (blastocyst formation)."]},{"id":"EM2025A-16","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"Which part of the blastocyst directly interacts with the endometrial lining during implantation?","options":["Inner cell mass (Embryoblast)","Syncytiotrophoblast","Amniotic cavity","Cytotrophoblast"],"answer":1,"explanation":"الـ syncytiotrophoblast (الطبقة الخارجية multinucleated) هو اللي بيآكل (erodes) الـ endometrium تدريجيًا لحد ما الـ blastocyst يندفن جواه.","memoryTrick":"Syncytio = الهجوم 🗡️.","stemAr":"أنهي جزء من الـ blastocyst بيتعامل مباشرةً مع بطانة الـ endometrium أثناء الـ implantation؟","whyWrong":["الـ inner cell mass جوه ومش بيلمس الـ endometrium.",null,"الـ amniotic cavity جوه الجنين.","الـ cytotrophoblast الطبقة الداخلية، وبره منه الـ syncytio هو اللي بيلمس ويغزو."]},{"id":"EM2025A-17","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"What hormone prepares the endometrium for implantation?","options":["Estrogen","Follicle-stimulating hormone (FSH)","Progesterone","Luteinizing hormone (LH)"],"answer":2,"explanation":"بعد الـ ovulation الـ Graafian follicle بيتحول لـ corpus luteum اللي بيفرز progesterone، وده اللي بيعمل الـ secretory phase في الـ endometrium (الغدد convoluted ومليانة إفراز والـ spiral arteries بتتسع)، وفي الـ phase دي بيبدأ الـ implantation.","memoryTrick":"Pro-gestation = يجهز للحمل.","stemAr":"أنهي hormone بيجهّز الـ endometrium للـ implantation؟","whyWrong":["الـ estrogen بيعمل الـ proliferative phase (الـ endometrium بيبدأ ينمو)، لكن اللي بيجهّزه للـ implantation هو الـ progesterone.","الـ FSH بيخلي الـ follicles تنمو في المبيض.",null,"الـ LH surge بيعمل الـ ovulation."]},{"id":"EM2025A-18","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"Which layer of the bilaminar disc contributes to the formation of the primitive yolk sac?","options":["Hypoblast","Epiblast","Cytotrophoblast.","Syncytiotrophoblast"],"answer":0,"explanation":"خلايا الـ hypoblast بتكوّن الـ exocoelomic membrane اللي بتعمل الـ primitive (primary) yolk sac.","memoryTrick":"Hypo = Yolk (تحت) / Epi = Amnion (فوق).","stemAr":"أنهي طبقة من الـ bilaminar disc بتشارك في تكوين الـ primitive yolk sac؟","whyWrong":[null,"الـ epiblast بيكوّن الـ amnion.","الـ cytotrophoblast مش جزء من الـ disc.","الـ syncytiotrophoblast مش جزء من الـ disc."]},{"id":"EM2025A-19","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025A","stem":"Which cells form the inner layer of the chorion?","options":["Epiblast cells","Syncytiotrophoblast","Hypoblast cells","Primary mesoderm"],"answer":3,"explanation":"الطبقة الداخلية للـ chorion هي الـ extraembryonic (somatic) mesoderm = primary mesoderm.","memoryTrick":"Chorion = Trophoblast + Mesoderm من جوه.","stemAr":"أنهي خلايا بتكوّن الطبقة الداخلية للـ chorion؟","whyWrong":["الـ epiblast بيكوّن الـ amnion والجنين.","الـ syncytio الطبقة الخارجية للـ chorion.","الـ hypoblast بيكوّن الـ yolk sac.",null]},{"id":"EM2025A-20","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025A","stem":"During which week of development does the chorionic cavity form?","options":["First week","Second week","Third week","Fourth week"],"answer":1,"explanation":"الـ chorionic cavity بتتكون في الأسبوع التاني.","memoryTrick":"Week 2.","stemAr":"الـ chorionic cavity بتتكون في أنهي أسبوع من النمو؟","whyWrong":["الأسبوع الأول فيه الـ blastocyst بس.",null,"الأسبوع التالت فيه الـ gastrulation، والـ chorionic cavity كانت موجودة قبلها.","متأخر."]},{"id":"EM2025A-21","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025A","stem":"Which structure is responsible for the establishment of uteroplacental circulation?","options":["Blastocyst","Amnion","Yolk sac","Syncytiotrophoblast"],"answer":3,"explanation":"الـ syncytiotrophoblast بيظهر فيه lacunar spaces، وخلاياه بتآكل الـ endothelial lining بتاع الـ maternal capillaries (sinusoids)، فالـ lacunae بتبقى continuous مع الـ sinusoids ودم الأم بيدخل = uteroplacental circulation.","memoryTrick":"Syncytio + Lacunae = دورة الأم والجنين.","stemAr":"أنهي structure مسئول عن إنشاء الـ uteroplacental circulation؟","whyWrong":["الـ blastocyst مرحلة كاملة، والجزء المسئول تحديدًا هو الـ syncytiotrophoblast.","الـ amnion بيبطّن الـ amniotic cavity، ملوش دور في الـ uteroplacental circulation.","الـ yolk sac ملوش دور في الـ uteroplacental circulation.",null]},{"id":"EM2025A-22","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following is true as regard Ribosomes?","options":["Appears basophilic when stained with H & E.","Stains red when stained with silver.","It is found supranuclear in nerve cells.","Appears as unstained area in deeply basophilic cytoplasm."],"answer":0,"explanation":"الـ ribosomes بتسبب cytoplasmic basophilia في الـ H&E بسبب الـ RNA اللي فيها. أما الصبغ بالـ silver والـ supranuclear والـ unstained area فدي صفات الـ Golgi.","memoryTrick":"Ribosome = RNA = أزرق (basophilic).","stemAr":"أنهي واحدة من دول صح بخصوص الـ ribosomes؟","whyWrong":[null,"الـ silver بيصبغ الـ Golgi كـ network من brown granules & fibrils، مش صفة للـ ribosomes.","الـ supranuclear (apical) ده شكل الـ Golgi بالـ silver في الخلايا المفرزة، وفي الـ nerve cells الـ Golgi بيكون perinuclear.","المنطقة الـ unstained في الـ cytoplasm الـ deeply basophilic هي الـ Negative Golgi image."]},{"id":"EM2025A-23","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following is absent from matrix of mitochondria?","options":["Circular DNA & RNA.","Ca²⁺ acting as catalysts condensed within dense granules.","Oxidative enzymes of Krebs cycle.","Hydrolytic digestive enzymes."],"answer":3,"explanation":"الـ mitochondrial matrix فيها: oxidative enzymes بتاعة الـ citric acid (Krebs) cycle، circular DNA، و mRNA و tRNA و rRNA، و electron-dense granules غنية بالـ Ca²⁺ بتشتغل catalysts. أما الـ hydrolytic enzymes فمكانها الـ lysosomes.","memoryTrick":"Hydrolytic = Lysosome مش Mitochondria.","stemAr":"أنهي واحد من دول مش موجود في الـ matrix بتاع الـ mitochondria؟","whyWrong":["الـ matrix فيها circular DNA و RNA فعلًا. والسؤال عن اللي مش موجود.","الـ matrix فيها electron-dense granules غنية بالـ Ca²⁺ بتشتغل catalysts.","الـ matrix فيها الـ oxidative enzymes بتاعة الـ Krebs cycle.",null]},{"id":"EM2025A-24","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following is truly matching as regard each organelle?","options":["Inner mitochondrial membrane → Cristae.","Multivesicular bodies → Engulfed solid foreign bodies.","Protein synthesis → SER.","Euchromatin → Nucleolus associated."],"answer":0,"explanation":"الصح A: الـ inner mitochondrial membrane بيعمل طيات اسمها cristae.\nالباقي غلط: الـ multivesicular bodies لهضم السوائل، وتصنيع البروتين على الـ rER، والـ nucleolus-associated chromatin من أماكن الـ heterochromatin.","memoryTrick":"Cristae = Inner membrane.","stemAr":"أنهي واحدة من دول التوصيل فيها صح لكل organelle؟","whyWrong":[null,"الـ multivesicular body = primary lysosome + pinocytic vesicle (fluid). الأجسام الصلبة بتكوّن heterolysosome.","تصنيع البروتين بيحصل بالـ ribosomes (الـ attached على الـ rER أو الـ free)، والـ sER مفيهوش ribosomes.","الـ nucleolus-associated chromatin من أماكن الـ heterochromatin، مش euchromatin."]},{"id":"EM2025A-25","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following is mis-matching as regard each organelle?","options":["Attached ribosomes → Synthesis of cytosol proteins.","Primary lysosomes → Originate from trans-face of Golgi apparatus.","Initial protein modifications → RER.","Transfer vesicles → Transport proteins from RER to cis-face."],"answer":0,"explanation":"الغلط A: الـ attached ribosomes (على الـ rER) بتصنع البروتينات اللي بتتفرز (إنزيمات وهرمونات). أما بروتينات الـ cytosol فبتتصنع على الـ free ribosomes.","memoryTrick":"Attached = Export / Free = Home use.","stemAr":"أنهي واحدة من دول التوصيل فيها غلط لكل organelle؟","whyWrong":[null,"مطابقة صح: الـ lysosomes بتطلع من الـ trans face بتاع الـ Golgi. والسؤال عن الغلط.","مطابقة صح: من وظايف الـ rER الـ initial glycosylation لبعض البروتينات.","مطابقة صح: الـ transfer vesicles بتنقل البروتين من الـ rER للـ cis face."]},{"id":"EM2025A-26","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2025A","stem":"What is the special stain of Golgi apparatus?","options":["Silver","Best's Carmine","Sudan III","Iron HX"],"answer":0,"explanation":"الـ Golgi مبيظهرش في الـ H&E، والصبغة الخاصة بيه الـ silver (Ag): بيظهر network من brown granules & fibrils.","memoryTrick":"Golgi = Silver 🥈 / Glycogen = Best's carmine / Fat = Sudan / Centrioles = Iron HX.","stemAr":"إيه الـ special stain بتاع الـ Golgi apparatus؟","whyWrong":[null,"الـ Best's carmine بيصبغ الـ glycogen (red granules).","الـ Sudan III بيصبغ الـ fat (orange globules).","الـ iron hematoxylin بيظهّر الـ centrioles (two dark bodies جنب النواة) والـ mitochondria."]},{"id":"EM2025A-27","topic":"histo","concept":"Nucleus & chromatin","source":"EM2025A","stem":"Which of the following best describes peripheral chromatin?","options":["Connected to inner border of nuclear envelope","Connected to nucleoli","Clumped and scattered in the nuclear sap","Fine granules and scattered in the nuclear sap"],"answer":0,"explanation":"الـ peripheral chromatin هو الـ heterochromatin اللي لازق في الـ inner surface of the nuclear envelope.","memoryTrick":"Peripheral = على الحافة (لازق في الغشا).","stemAr":"أنهي واحدة من دول أحسن وصف للـ peripheral chromatin؟","whyWrong":[null,"اللي حوالين الـ nucleolus اسمه nucleolus-associated chromatin.","ده الـ chromatin islands (scattered).","الـ fine granules ده شكل الـ euchromatin في الـ EM."]},{"id":"EM2025A-28","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following statements describes active cells?","options":["Dark nucleus","Heterochromatic nucleus","Euchromatic nucleus","Few mitochondria"],"answer":2,"explanation":"الخلية النشطة اللي بتصنع بروتين نواتها euchromatic: الـ euchromatin (extended, active) بيدي pale nucleus (vesicular) وفيه الـ active genes. وكمان الـ mitochondria بتكون أكتر في الخلايا عالية النشاط.","memoryTrick":"Active = Euchromatic (Eu = Good working).","stemAr":"أنهي جملة من دول بتوصف الخلايا النشطة (active cells)؟","whyWrong":["النواة الـ condensed (الغامقة) بتدل على heterochromatin = inactive genes.","الـ heterochromatin = inactive genes، زي الـ small lymphocytes.",null,"الـ mitochondria بتكون أكتر عددًا في الخلايا عالية النشاط."]},{"id":"EM2025A-29","topic":"histo","concept":"Nucleus & chromatin","source":"EM2025A","stem":"What about heterochromatin?","options":["Makes the nucleus pale by LM.","Appears as coarse granules in the nucleus.","Contains active genes.","Represents extended parts of chromatin."],"answer":1,"explanation":"الـ heterochromatin هو الـ condensed (inactive) chromatin: في الـ LM بيدي condensed nucleus، وفي الـ EM بيظهر coarse granules، وفيه الـ inactive genes.","memoryTrick":"Hetero = Coarse & Condensed & Inactive.","stemAr":"إيه الصح عن الـ heterochromatin؟","whyWrong":["اللي بيخلي النواة pale (vesicular) هو الـ euchromatin.",null,"الـ active genes في الـ euchromatin.","الـ extended (uncoiled) chromatin هو الـ euchromatin."]},{"id":"EM2025A-30","topic":"histo","concept":"Cell membrane & transport","source":"EM2025A","stem":"Pinocytosis is the process by which the cell membrane can engulf which of the following?","options":["Fluid droplets.","Solid particles","Bacteria","Foreign bodies"],"answer":0,"explanation":"الـ pinocytosis (cell drinking): زي الـ phagocytosis بس بـ invaginations أصغر في الغشا بتبلع extracellular fluid وتكوّن pinocytic vesicles.","memoryTrick":"Pino = سوائل.","stemAr":"الـ pinocytosis هي العملية اللي الـ cell membrane بتبلع بيها أنهي واحد من دول؟","whyWrong":[null,"بلع الـ solid particles = phagocytosis.","بلع البكتيريا = phagocytosis (زي الـ macrophages والـ neutrophils).","بلع المواد الصلبة الكبيرة = phagocytosis."]},{"id":"EM2025A-31","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2025A","stem":"Which one is regarded as an exogenous pigment?","options":["Haemoglobin","Melanin","Carotene","Lipofuscin"],"answer":2,"explanation":"الـ pigments نوعين:\n• Endogenous (من جوه الجسم): hemoglobin (في الـ RBCs)، melanin، lipofuscin.\n• Exogenous (من بره): carbon & dust particles، carotene، tattoo marks.","memoryTrick":"Carotene = Carrot 🥕 (من بره).","stemAr":"أنهي واحد يعتبر exogenous pigment؟","whyWrong":["الـ hemoglobin endogenous: في الـ RBCs وبيشيل الـ O2 والـ CO2.","الـ melanin endogenous: في الجلد والشعر والعين، بيدي اللون ويحمي من الـ UV.",null,"الـ lipofuscin endogenous: waste products بتتجمع مع السن في الـ cardiac muscle والـ nerve cells."]},{"id":"ES2025A-01","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025A","stem":"Which organelle is responsible for cell digestion?","options":["rER","Golgi apparatus","sER","Lysosome"],"answer":3,"explanation":"الـ lysosomes membranous vesicles فيها hydrolytic enzymes، ووظيفتها الـ intracytoplasmic digestion.","memoryTrick":"Lysosome = معدة الخلية.","stemAr":"أنهي organelle مسئول عن الهضم داخل الخلية؟","whyWrong":["الـ rER لتصنيع البروتين.","الـ Golgi للـ packing وتعديل البروتينات.","الـ sER للـ lipids والـ steroids والـ detoxification.",null]},{"id":"ES2025A-02","topic":"histo","concept":"Cell membrane & transport","source":"ES2025A","stem":"What is the term for the process by which the cells transport solids?","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":3,"explanation":"الـ phagocytosis (cell eating) نوع من الـ endocytosis لبلع مواد صلبة كبيرة: الـ macrophages والـ neutrophils بيبلعوا البكتيريا والـ protozoa والخلايا التالفة جوه phagosome. أما الـ pinocytosis (cell drinking) فبتبلع extracellular fluid.","memoryTrick":"Phago = أكل.","stemAr":"إيه اسم العملية اللي الخلايا بتنقل بيها المواد الصلبة (solids)؟","whyWrong":["الـ endocytosis مصطلح عام بيشمل الـ phagocytosis والـ pinocytosis والـ receptor-mediated endocytosis.","الـ exocytosis إخراج محتوى vesicle لبره الخلية.","الـ pinocytosis للسوائل (cell drinking).",null]},{"id":"ES2025A-03","topic":"histo","concept":"Cell membrane & transport","source":"ES2025A","stem":"Which of the following best describes the phospholipid molecules of cell membrane?","options":["The head is non-charged and hydrophobic","The head is directed inwards away from the aqueous solutions","The fatty acid tail is charged and hydrophilic","The head is directed towards the aqueous solutions"],"answer":3,"explanation":"كل phospholipid ليه:\n• Hydrophilic polar head: charged و hydrophilic ومتجه ناحية الـ aqueous solutions، فالرؤوس بتبقى على السطح الخارجي والداخلي.\n• Hydrophobic tail (fatty acids): non-charged و hydrophobic ومتجه لجوه بعيد عن الـ aqueous solutions.","memoryTrick":"Head يحب المية / Tail يكرهها.","stemAr":"أنهي واحدة من دول أحسن وصف لجزيئات الـ phospholipid في الـ cell membrane؟","whyWrong":["الـ head بالعكس: charged و hydrophilic.","الـ head متجه ناحية الـ aqueous solutions مش بعيد عنها. اللي متجه لجوه هو الـ tail.","الـ tail بالعكس: non-charged و hydrophobic.",null]},{"id":"ES2025A-04","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025A","stem":"Regarding rER, which of the following describes it?","options":["Form proteins secreted by the cells","Form proteins used within the cytosol","Linked together by tRNA forming polysomes.","Bind to the outer surface of SER"],"answer":0,"explanation":"الـ attached ribosomes على الـ rER (مربوطة بالـ large subunit في الـ ribophorins) بتصنع البروتينات اللي الخلية بتفرزها زي الإنزيمات والهرمونات.","memoryTrick":"Rough = Secreted.","stemAr":"بخصوص الـ rER، أنهي واحدة من دول بتوصفه؟","whyWrong":[null,"البروتينات اللي بتستعملها الخلية جوه الـ cytosol بتتصنع على الـ free ribosomes.","الـ ribosomes بيربطها الـ mRNA وتعمل rosettes أو spiral chains (polyribosomes)، مش الـ tRNA.","الـ ribosomes بتلزق في الـ outer surface بتاع الـ rER. الـ sER مفيهوش ribosomes."]},{"id":"ES2025A-05","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025A","stem":"Which feature of the followings describes centrioles?","options":["They are a membranous organelle","Can be demonstrated with silver stain","Formed of nine triplets of microtubules","Have the same number of microtubules as the shaft of cilia"],"answer":2,"explanation":"الـ centriole تركيب اسطواني من microtubules منظمة (non-membranous). جداره 9 bundles كل واحدة 3 MTs (triplets) = 27 MT. في الـ LM بيظهر بالـ iron hematoxylin كـ two dark bodies جنب النواة.","memoryTrick":"Centriole = 9×3.","stemAr":"أنهي صفة من دول بتوصف الـ centrioles؟","whyWrong":["الـ centrioles non-membranous (من الـ cytoskeleton).","الـ centrioles بتتبيّن بالـ iron hematoxylin. الـ silver للـ Golgi.",null,"الـ centriole فيه 27 MT (9×3)، لكن الـ shaft بتاع الـ cilium فيه 20 MT (9 doublets + 2 singlets)."]},{"id":"ES2025A-06","topic":"histo","concept":"Nucleus & chromatin","source":"ES2025A","stem":"What is the typical feature of condensed chromatin?","options":["Appears dark acidophilic by LM","Appears as fine granules by EM","Contains the inactive genes","Appears pale basophilic by LM"],"answer":2,"explanation":"الـ condensed chromatin (heterochromatin) بيمثل coiled chromosomes فيها الـ inactive genes. في الـ LM بيدي condensed nucleus (basophilic)، وفي الـ EM بيظهر coarse granules.","memoryTrick":"Condensed = Inactive.","stemAr":"إيه الصفة المميزة للـ condensed chromatin؟","whyWrong":["الـ chromatin basophilic (بسبب الـ DNA)، مش acidophilic.","الـ fine granules في الـ EM صفة الـ euchromatin.",null,"الـ pale basophilic (vesicular nucleus) صفة الـ euchromatin."]},{"id":"ES2025A-07","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025A","stem":"The cilia can be characterized by which of the followings?","options":["The basal body is formed of nine microtubules","The rootlet contains twenty-seven microtubules","move secretions over the tissue surface in one directions","Can be found in the male genital system"],"answer":2,"explanation":"الـ cilia وظيفتها تحريك الإفرازات أو الجزيئات على سطح النسيج في اتجاه واحد، زي في الـ respiratory والـ female genital system.\nتركيبها: basal body = 27 MT (9 triplets)، shaft (axoneme) = 9 doublets + 2 singlets = 20 MT، rootlets = 9 MT (من نمو الـ MT C في كل triplet).","memoryTrick":"Cilia = اتجاه واحد ➡️ / 27 basal - 20 shaft - 9 rootlets.","stemAr":"الـ cilia ممكن توصف بأنهي واحدة من دول؟","whyWrong":["الـ basal body هو centriole واحد من 27 MT (9 triplets)، مش 9.","الـ rootlets بتتكون من نمو الـ MT C في كل triplet، يعني 9 MT مش 27.",null,"الـ cilia متوصفة في الـ respiratory والـ female genital system. أما الـ male genital system فمذكور فيه الـ flagella (ذيل الـ sperm) والـ stereocilia، مش cilia."]},{"id":"ES2025A-08","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2025A","stem":"Which one of the following stains demonstrates lipid in the liver cells?","options":["Sudan III","PAS","Silver","trypan blue"],"answer":0,"explanation":"الـ fat بيتخزن في الـ fat cells كـ large globules وفي الـ liver cells كـ small droplets. في الـ H&E بيدوب أثناء التحضير فيبان vacuoles. الصبغة الخاصة: Sudan III (orange globules) أو Sudan black (black globules).","memoryTrick":"Sudan = Fat / PAS & Best's carmine = Glycogen / Silver = Golgi.","stemAr":"أنهي stain من دول بيبيّن الـ lipid في خلايا الكبد؟","whyWrong":[null,"الـ PAS magenta بيصبغ الـ glycogen (red granules).","الـ silver بيصبغ الـ Golgi (brown network).","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."]},{"id":"ES2025A-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025A","stem":"What is the origin of secretory vesicles of Golgi apparatus?","options":["Smooth endoplasmic reticulum","Rough endoplasmic reticulum","The trans face of Golgi apparatus","The cell membrane"],"answer":2,"explanation":"الـ trans face (Exit = Concave = Secretory = Mature) بتاع الـ Golgi هو اللي بيطلع منه: الـ secretory vesicles (للـ exocytosis)، والـ lysosomes، والـ membrane renewal vesicles.","memoryTrick":"Trans = Exit 🚪","stemAr":"إيه أصل الـ secretory vesicles بتاعة الـ Golgi apparatus؟","whyWrong":["الـ sER مش أصل الـ secretory vesicles.","الـ rER بيطلع منه الـ transfer vesicles اللي رايحة للـ cis face بتاع الـ Golgi، مش الـ secretory vesicles.",null,"الـ secretory vesicle بتندمج مع الـ cell membrane وقت الـ exocytosis، يعني الغشا مكان خروجها مش أصلها."]},{"id":"ES2025A-10","topic":"anat","concept":"Scalp & face","source":"ES2025A","stem":"Why is the loose areolar tissue considered dangerous?","options":["It is highly vascularized","It contains sweat glands","It allows infection to spread to the brain via emissary veins","It is the thickest layer of the scalp"],"answer":2,"explanation":"الطبقة الرابعة في الـ scalp هي الـ loose areolar tissue (بتملا الـ subaponeurotic space)، واسمها dangerous layer لأن الـ emissary veins بتفتح فيها وبتنقل أي infection لجوه المخ (الـ venous sinuses). والنزيف فيها بيعمل swelling في الـ scalp كله و black eye.","memoryTrick":"Emissary veins = طريق العدوى للمخ.","stemAr":"ليه الـ loose areolar tissue بتعتبر خطيرة (dangerous)؟","whyWrong":["الطبقة اللي فيها أوعية وأعصاب الـ scalp هي الـ connective tissue، مش ده سبب خطورة الـ loose areolar tissue.","الـ sweat glands في الجلد.",null,"مش سبب الخطورة. السبب الـ emissary veins."]},{"id":"ES2025A-11","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2025A","stem":"which of the following arteries supply the outer compact bone?","options":["Nutrient artery","Periosteal artery","Epiphyseal artery","metaphyseal artery"],"answer":1,"explanation":"الـ periosteal arteries هي المصدر الأساسي للدم في كل أنواع العظام، وبتجي من الأوعية القريبة، وبتغذي الـ outer compact bone. والعظمة اللي يتشال منها الـ periosteum بتموت.","memoryTrick":"Periosteal = Outer.","stemAr":"أنهي artery من دول بتغذي الـ outer compact bone؟","whyWrong":["الـ nutrient artery بتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.",null,"الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis)."]},{"id":"ES2025A-12","topic":"embryo","concept":"Gametogenesis","source":"ES2025A","stem":"What is the primary mechanism that prevents polyspermy after the first sperm enters the egg?","options":["Cortical reaction","Decidual reaction","Acrosome reaction","Cleavage division"],"answer":0,"explanation":"بعد دخول الـ sperm الـ ovum بيستجيب بـ cortical and zonal reaction (الـ cortical granules بتطلع محتواها فيتكون fertilization envelope)، وده اللي بيمنع دخول sperm تاني (polyspermy).","memoryTrick":"Cortical = Close the door 🚪.","stemAr":"إيه الآلية الأساسية اللي بتمنع الـ polyspermy بعد ما أول sperm يدخل البويضة؟","whyWrong":[null,"الـ decidual reaction بتحصل في الـ endometrium (زيادة الـ glycogen والـ lipids) مع الـ implantation.","الـ acrosomal reaction بتحصل في الـ sperm عشان يخترق الـ zona.","الـ cleavage انقسامات mitotic بعد الـ fertilization."]},{"id":"ES2025A-13","topic":"embryo","concept":"Implantation & second week","source":"ES2025A","stem":"Where originates the extraembryonic mesoderm?","options":["It is a result of the migration of cells from the neuroectoderm","In a site between trophoblast and embryoblast","In a site between hypoblast and epiblast","In a site between endoderm and ectoderm"],"answer":1,"repeatOf":"EM2023-20","explanation":"الـ extraembryonic mesoderm: خلايا بتظهر بين الـ inner surface بتاع الـ cytotrophoblast والـ outer surface بتاع الـ yolk sac، وبتكوّن طبقة loose connective tissue.","memoryTrick":"Extraembryonic = بين الـ trophoblast والـ embryo.","stemAr":"الـ extraembryonic mesoderm أصله منين؟","whyWrong":["الـ extraembryonic mesoderm بيظهر بين الـ cytotrophoblast والـ yolk sac، مش من الـ neuroectoderm.",null,"الـ hypoblast والـ epiblast هما الـ bilaminar germ disc نفسه، ومفيش بينهم المكان ده.","الـ extraembryonic mesoderm بيظهر بين الـ cytotrophoblast والـ yolk sac في الأسبوع التاني."]},{"id":"EM2025B-01","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025B","stem":"Which of the following best describes the anatomical position of the lower limbs and toes?","options":["Knees flexed, the toes turned inward.","Legs abducted, feet rotated outward.","Legs extended and parallel, feet flat with toes directed forward.","Knees flexed, feet together with toes pointing sideways."],"answer":2,"repeatOf":"EM2025A-01","explanation":"في الـ anatomical position الرجلين ممدودين ومتوازيين، والقدم flat والأصابع لقدام.","memoryTrick":"واقف مستقيم وكل حاجة لقدام.","stemAr":"أنهي واحدة من دول أحسن وصف لوضع الـ lower limbs والأصابع في الـ anatomical position؟","whyWrong":["الركب مش مثنية في الـ anatomical position.","الرجلين مش abducted.",null,"الركب مش مثنية والصوابع لقدام."]},{"id":"EM2025B-02","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025B","stem":"Which plane divides the body into anterior and posterior parts?","options":["midsagittal.","parasagittal.","coronal.","horizontal."],"answer":2,"explanation":"الـ coronal plane = anterior و posterior.","memoryTrick":"Coronal.","stemAr":"أنهي plane بيقسم الجسم لجزء anterior وجزء posterior؟","whyWrong":["الـ midsagittal يمين وشمال.","الـ parasagittal يمين وشمال مش متساويين.",null,"الـ horizontal فوق وتحت."]},{"id":"EM2025B-03","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025B","stem":"What is the meaning of superficial dissection of the dorsal aspect of the neck?","options":["dissection of the skin and front of the neck.","dissection of the skin and back of the neck.","dissection of the muscles and vessels and back of the neck.","dissection of the muscles and vessels and front of the neck."],"answer":1,"explanation":"Superficial = skin، و Dorsal = back of the neck.","memoryTrick":"Superficial = Skin.","stemAr":"يعني إيه superficial dissection للـ dorsal aspect بتاع الرقبة؟","whyWrong":["الـ front = ventral.",null,"الـ muscles أعمق.","الاتنين غلط."]},{"id":"EM2025B-04","topic":"anat","concept":"Movements","source":"EM2025B","stem":"Moving the distal segment away from the proximal segment is called which of the following?","options":["Adduction.","abduction.","flexion.","extension."],"answer":3,"repeatOf":"EM2025A-04","explanation":"الـ flexion = bending: الـ anterior surface بتاع الـ distal segment بيقرب من الـ proximal segment. الـ extension عكسها: فرد المفصل (straightening)، فالـ distal segment بيبعد عن الـ proximal.","memoryTrick":"Extension = فرد ➜ البعيد يبعد / Flexion = ثني ➜ يقرب.","stemAr":"تحريك الجزء البعيد (distal segment) بعيد عن الجزء القريب (proximal segment) اسمه إيه؟","whyWrong":["الـ adduction حركة ناحية الـ midline.","الـ abduction بعيد عن الـ midline، مش بين جزئين من الطرف. وده اللبس الشائع.","الـ flexion بيقرّب الجزئين من بعض.",null]},{"id":"EM2025B-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2025B","stem":"Which of the following is the character of the compact bone?","options":["Contains large spaces filled with bone marrow","Composed of loosely arranged trabeculae.","Dense and organized into number of cylindrical units","Found only in the epiphysis of long bones."],"answer":2,"explanation":"الـ compact (hard) bone: كثيف، بيكوّن الطبقة السطحية لكل العظام والـ tubular shafts بتاعة الـ long bones، ومكوّن من cylindrical units اسمها Haversian systems، وبيدي قوة لتحمل الوزن.","memoryTrick":"Compact = Osteons.","stemAr":"أنهي واحدة من دول صفة الـ compact bone؟","whyWrong":["المسافات المليانة bone marrow صفة الـ spongy bone.","الـ trabeculae صفة الـ spongy bone.",null,"الـ compact bone بيكوّن الطبقة السطحية لكل العظام، والـ epiphysis (أطراف الـ long bones) أغلبها spongy."]},{"id":"EM2025B-06","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2025B","stem":"Which of the following arteries can supply the bone marrow?","options":["periosteal","epiphyseal","metaphyseal","nutrient"],"answer":3,"repeatOf":"EM2025A-06","explanation":"الـ nutrient artery بتدخل العظمة من الـ nutrient canal وبتتقسم لـ proximal و distal branches في الـ medullary cavity، وبتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.","memoryTrick":"Nutrient = Marrow.","stemAr":"أنهي artery من دول ممكن تغذي الـ bone marrow؟","whyWrong":["الـ periosteal arteries المصدر الأساسي لكل العظام، وبتغذي الـ outer compact bone.","الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis).",null]},{"id":"EM2025B-07","topic":"anat","concept":"Skeleton & types of bones","source":"EM2025B","stem":"Which of the following is considered short bone?","options":["Carpal bone","phalanges","patella","clavicle"],"answer":0,"explanation":"الـ short bones: cuboidal، ليها cortex رفيع من compact bone وجواها cancellous bone، وبتتعرض للضغط، زي الـ carpal والـ tarsal bones.","memoryTrick":"Carpal = Short.","stemAr":"أنهي واحدة من دول تعتبر short bone؟","whyWrong":[null,"الـ phalanges من الـ long bones.","الـ patella sesamoid bone (في وتر عضلة).","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."]},{"id":"EM2025B-08","topic":"embryo","concept":"Female cycles & hormones","source":"EM2025B","stem":"If Sara's cycle is 38 days, on which day is she most likely to ovulate?","options":["Day 14","Day 24","Day 28","Day 35"],"answer":1,"repeatOf":"EM2025A-08","explanation":"الإجابة المعتمدة: يوم 24. الـ menstrual cycle بتستمر من 24 لـ 38 يوم، وفي الدورة الـ 28 يوم الـ ovulation بيحصل يوم 14 والـ luteal phase من 14 لـ 28.","memoryTrick":"Ovulation = طول الدورة − 14.","stemAr":"لو الدورة عند سارة 38 يوم، غالبًا هيحصلها ovulation في يوم كام؟","whyWrong":["يوم 14 ده الـ ovulation في الدورة الـ 28 يوم.",null,"⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2025B-09","topic":"embryo","concept":"Female cycles & hormones","source":"EM2025B","stem":"Which hormone surges right before ovulation, triggering the release of an egg?","options":["Progesterone","Estrogen","(LH)","(FSH)"],"answer":2,"explanation":"الـ ovulation بيحصل بسبب زيادة الضغط جوه الـ Graafian follicle نتيجة زيادة إفراز الـ LH من الـ pituitary gland (LH surge).","memoryTrick":"LH surge ➜ Ovulation 🥚","stemAr":"أنهي hormone بيعمل surge قبل الـ ovulation مباشرةً فيخلّي البويضة تنزل؟","whyWrong":["الـ progesterone بيفرزه الـ corpus luteum بعد الـ ovulation.","الـ estrogen بيفرزه الـ Graafian follicle في الـ proliferative phase، لكن اللي بيعمل الـ ovulation هو الـ LH surge.",null,"الـ FSH بيخلّي الـ primordial follicles تبدأ تنمو، لكن اللي بيعمل الـ ovulation هو الـ LH surge."]},{"id":"EM2025B-10","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"If Sarah doesn't conceive, what event marks the end of the luteal phase?","options":["Ovulation","Menstruation","LH surge","Implantation"],"answer":1,"repeatOf":"EM2025A-10","explanation":"لو مفيش حمل الـ corpus luteum بيضمر، الـ progesterone ينزل، فتحصل الـ menstruation ودي نهاية الـ luteal phase.","memoryTrick":"مفيش حمل = Menstruation.","stemAr":"لو سارة محملتش، إيه الحدث اللي بيعلن نهاية الـ luteal phase؟","whyWrong":["الـ ovulation بداية الـ luteal phase مش نهايتها.",null,"الـ LH surge قبل الـ ovulation.","الـ implantation يعني حمل، والسؤال إنها ما حملتش."]},{"id":"EM2025B-11","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"Which hormone is released after implantation and is used to confirm pregnancy?","options":["LH","FSH","HCG (Human chorionic Gonadotropin)","Estrogen"],"answer":2,"explanation":"الـ hCG بيفرزه الـ syncytiotrophoblast، وبيحافظ على الـ corpus luteum عشان يكمّل يفرز progesterone و estrogen. وبيتكشف حوالي آخر الأسبوع التاني فبيأكد الـ implantation (الحمل).","memoryTrick":"hCG.","stemAr":"أنهي hormone بيتفرز بعد الـ implantation وبيستخدم لتأكيد الحمل؟","whyWrong":["الـ LH بيتفرز من الـ pituitary في كل دورة وبيعمل الـ ovulation.","الـ FSH بيتفرز من الـ pituitary في كل دورة وبيخلي الـ follicles تنمو.",null,"الـ estrogen بيتفرز في كل دورة من الـ Graafian follicle، فمش بيأكد الحمل."]},{"id":"EM2025B-12","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2025B","stem":"At what stage does the fertilized egg typically implant in the uterus?","options":["Zygote","Morula","Blastocyst","Embryo"],"answer":2,"repeatOf":"EM2025A-12","explanation":"الـ implantation بتحصل في مرحلة الـ blastocyst.","memoryTrick":"Blastocyst = يزرع.","stemAr":"البويضة الملقّحة بتزرع في الرحم عادةً في أنهي مرحلة؟","whyWrong":["الـ zygote لسه في الـ tube بعد الـ fertilization على طول.","الـ morula بتوصل الرحم بس لسه محاطة بالـ zona ومبتزرعش.",null,"الـ implantation بيبدأ في مرحلة الـ blastocyst (حوالي اليوم 6)."]},{"id":"EM2025B-13","topic":"embryo","concept":"Gametogenesis","source":"EM2025B","stem":"Which term describes complete absence of sperm in semen analysis?","options":["Azoospermia","Oligospermia","Teratozoospermia","Asthenozoospermia"],"answer":0,"repeatOf":"EM2025A-13","explanation":"اضطرابات عدد الـ sperms:\n• Azoospermia: absence of the sperms (مفيش sperms خالص).\n• Oligospermia: أقل من 20 million/ml.","memoryTrick":"A-zoo = مفيش حيوانات خالص.","stemAr":"أنهي مصطلح بيوصف الغياب التام للـ sperm في تحليل السائل المنوي؟","whyWrong":[null,"الـ oligospermia = عدد قليل (أقل من 20 million/ml) مش غياب تام.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."]},{"id":"EM2025B-14","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"What major event typically occurs at the start of the second week of development?","options":["Gastrulation","Fertilization","Implantation of the blastocyst","Formation of the neural tube"],"answer":2,"repeatOf":"EM2025A-14","explanation":"في الأسبوع التاني بيكمل الـ implantation (بيبدأ حوالي اليوم 6 وبيخلص يوم 11-12)، وبيحصل تمايز الـ bilaminar germ disc والـ trophoblast وتكوين الـ cavities.","memoryTrick":"Week 2 = Implantation + Two layers.","stemAr":"إيه الحدث الكبير اللي بيحصل عادةً في بداية الأسبوع التاني من النمو؟","whyWrong":["الـ gastrulation مش من أحداث الأسبوع التاني.","الـ fertilization من أحداث الأسبوع الأول.",null,"الـ neural tube مش من أحداث الأسبوع التاني."]},{"id":"EM2025B-15","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"What cavity begins to develop during the end of the second week?","options":["Chorionic cavity","Amniotic cavity","Yolk sac","Blastocoele"],"answer":0,"repeatOf":"EM2025A-15","explanation":"خلايا الـ extraembryonic mesoderm بيظهر بينها cavities متعددة، وبتلتحم وتكوّن cavity واحدة اسمها chorionic cavity.","memoryTrick":"آخر Week 2 = Chorionic cavity.","stemAr":"أنهي cavity بتبدأ تتكون في آخر الأسبوع التاني؟","whyWrong":[null,"الـ amniotic cavity بتظهر جوه الـ epiblast قبل ظهور الـ extraembryonic mesoderm.","الـ primitive yolk sac بيتكون بدري (لما الـ exocoelomic membrane تحيط بالـ blastocyst cavity).","الـ blastocele بيتكون في الأسبوع الأول (blastocyst formation)."]},{"id":"EM2025B-16","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"Which part of the blastocyst directly interacts with the endometrial lining during implantation?","options":["Inner cell mass (embryoblast)","Syncytiotrophoblast","Amniotic cavity","Cytotrophoblast"],"answer":1,"repeatOf":"EM2025A-16","explanation":"الـ syncytiotrophoblast (الطبقة الخارجية multinucleated) هو اللي بيآكل (erodes) الـ endometrium تدريجيًا لحد ما الـ blastocyst يندفن جواه.","memoryTrick":"Syncytio = الهجوم 🗡️.","stemAr":"أنهي جزء من الـ blastocyst بيتعامل مباشرةً مع بطانة الـ endometrium أثناء الـ implantation؟","whyWrong":["الـ inner cell mass جوه ومش بيلمس الـ endometrium.",null,"الـ amniotic cavity جوه الجنين.","الـ cytotrophoblast الطبقة الداخلية، وبره منه الـ syncytio هو اللي بيلمس ويغزو."]},{"id":"EM2025B-17","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"What hormone prepares the endometrium for implantation?","options":["Estrogen","(FSH)","Progesterone","(LH)"],"answer":2,"explanation":"بعد الـ ovulation الـ Graafian follicle بيتحول لـ corpus luteum اللي بيفرز progesterone، وده اللي بيعمل الـ secretory phase في الـ endometrium (الغدد convoluted ومليانة إفراز والـ spiral arteries بتتسع)، وفي الـ phase دي بيبدأ الـ implantation.","memoryTrick":"Progesterone = Pro-pregnancy.","stemAr":"أنهي hormone بيجهّز الـ endometrium للـ implantation؟","whyWrong":["الـ estrogen بيعمل الـ proliferative phase (الـ endometrium بيبدأ ينمو)، لكن اللي بيجهّزه للـ implantation هو الـ progesterone.","الـ FSH بيخلي الـ follicles تنمو في المبيض.",null,"الـ LH surge بيعمل الـ ovulation."]},{"id":"EM2025B-18","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"Which layer of the bilaminar disc contributes to the formation of the primitive yolk sac?","options":["Hypoblast.","Epiblast.","Cytotrophoblast.","Syncytiotrophoblast."],"answer":0,"repeatOf":"EM2025A-18","explanation":"خلايا الـ hypoblast بتكوّن الـ exocoelomic membrane اللي بتعمل الـ primitive (primary) yolk sac.","memoryTrick":"Hypo = Yolk (تحت) / Epi = Amnion (فوق).","stemAr":"أنهي طبقة من الـ bilaminar disc بتشارك في تكوين الـ primitive yolk sac؟","whyWrong":[null,"الـ epiblast بيكوّن الـ amnion.","الـ cytotrophoblast مش جزء من الـ disc.","الـ syncytiotrophoblast مش جزء من الـ disc."]},{"id":"EM2025B-19","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025B","stem":"Which cells form the inner layer of the chorion?","options":["Epiblast cells","Syncytiotrophoblast","Hypoblast cells","Primary mesoderm"],"answer":3,"repeatOf":"EM2025A-19","explanation":"الطبقة الداخلية للـ chorion هي الـ extraembryonic (somatic) mesoderm = primary mesoderm.","memoryTrick":"Chorion = Trophoblast + Mesoderm من جوه.","stemAr":"أنهي خلايا بتكوّن الطبقة الداخلية للـ chorion؟","whyWrong":["الـ epiblast بيكوّن الـ amnion والجنين.","الـ syncytio الطبقة الخارجية للـ chorion.","الـ hypoblast بيكوّن الـ yolk sac.",null]},{"id":"EM2025B-20","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025B","stem":"During which week of development does the chorionic cavity form?","options":["First week","Second week","Third week","Fourth week"],"answer":1,"repeatOf":"EM2025A-20","explanation":"الـ chorionic cavity بتتكون في الأسبوع التاني.","memoryTrick":"Week 2.","stemAr":"الـ chorionic cavity بتتكون في أنهي أسبوع من النمو؟","whyWrong":["الأسبوع الأول فيه الـ blastocyst بس.",null,"الأسبوع التالت فيه الـ gastrulation، والـ chorionic cavity كانت موجودة قبلها.","متأخر."]},{"id":"EM2025B-21","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025B","stem":"Which structure is responsible for the establishment of uteroplacental circulation?","options":["Blastocyst.","Amnion.","Yolk sac.","Syncytiotrophoblast."],"answer":3,"repeatOf":"EM2025A-21","explanation":"الـ syncytiotrophoblast بيظهر فيه lacunar spaces، وخلاياه بتآكل الـ endothelial lining بتاع الـ maternal capillaries (sinusoids)، فالـ lacunae بتبقى continuous مع الـ sinusoids ودم الأم بيدخل = uteroplacental circulation.","memoryTrick":"Syncytio + Lacunae = دورة الأم والجنين.","stemAr":"أنهي structure مسئول عن إنشاء الـ uteroplacental circulation؟","whyWrong":["الـ blastocyst مرحلة كاملة، والجزء المسئول تحديدًا هو الـ syncytiotrophoblast.","الـ amnion بيبطّن الـ amniotic cavity، ملوش دور في الـ uteroplacental circulation.","الـ yolk sac ملوش دور في الـ uteroplacental circulation.",null]},{"id":"EM2025B-22","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following is true as regard Ribosomes?","options":["Appears basophilic when stained with H & E","S
