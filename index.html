"],"answer":2,"explanation":"الـ compact (hard) bone بيكون أسمك في نص الـ shaft (diaphysis) عشان يتحمل الـ bending stress، والأطراف أغلبها spongy.","memoryTrick":"النص = Compact / الأطراف = Spongy.","stemAr":"كمية الـ hard bone (compact) بتزيد في أنهي مكان من دول؟","whyWrong":["الـ lower end فيها spongy bone أكتر.","الـ medullary cavity فيها marrow مش عظم.",null,"الـ upper end فيها spongy bone أكتر."]},{"id":"EM2022-03","topic":"anat","concept":"Scalp & face","source":"EM2022","stem":"Which of the followings is the dangerous area of the scalp?","options":["Connective tissue layer","Periosteum","Skin layer","Subaponeurotic space"],"answer":3,"explanation":"الـ subaponeurotic space (loose areolar tissue) هي الـ dangerous area بسبب الـ emissary veins.","memoryTrick":"تحت الـ aponeurosis = الخطر.","stemAr":"أنهي واحدة من دول هي الـ dangerous area في الـ scalp؟","whyWrong":["الـ connective tissue فيها أوعية، بس مش الخطر.","الـ periosteum (pericranium) الالتهاب تحته بيتحصر.","الـ skin سطحية.",null]},{"id":"EM2022-04","topic":"embryo","concept":"Gametogenesis","source":"EM2022","stem":"Where does capacitation of the sperm take place?","options":["Epididymis","female genital tract","prostatic gland.","testis"],"answer":1,"explanation":"الـ capacitation بتحصل في الـ female genital tract (غالبًا الـ uterine tube) وبتاخد حوالي 7 ساعات.","memoryTrick":"Capacitation = عند الست.","stemAr":"الـ capacitation بتاعة الـ sperm بتحصل فين؟","whyWrong":["الـ epididymis بتحصل فيها الـ maturation (اكتساب الحركة)، مش الـ capacitation. وده مصدر اللبس الشائع.",null,"الـ prostate بيفرز سائل، ومش مكان الـ capacitation.","الـ testis مكان الـ spermatogenesis."]},{"id":"EM2022-05","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"Secondary yolk sac can be seen in which of the following stages?","options":["after folding","blastocyst stage","chorionic vesicle stage","morula stage"],"answer":2,"explanation":"الـ secondary (definitive) yolk sac بيظهر حوالي اليوم 13 في مرحلة الـ chorionic vesicle (آخر الأسبوع التاني).","memoryTrick":"Secondary yolk sac = Week 2 end (Chorionic vesicle).","stemAr":"الـ secondary yolk sac ممكن يتشاف في أنهي مرحلة من دول؟","whyWrong":["بعد الـ folding الـ yolk sac بيتحول جزء منه للـ gut ويصغر. الـ secondary yolk sac بيتكون قبل كده بكتير.","في الـ blastocyst لسه مفيش yolk sac.",null,"الـ morula مرحلة قبل أي cavity."]},{"id":"EM2022-06","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"At what stage of embryonic development does an embryo normally begin to implant in the endometrium?","options":["Blastocyst","Four-cell stage","Morula","Trilaminar embryo"],"answer":0,"explanation":"الـ embryo بيبدأ يعمل implantation وهو في مرحلة الـ blastocyst (اليوم 6–7).","memoryTrick":"اللي بيزرع نفسه = Blastocyst.","stemAr":"في أنهي مرحلة من مراحل النمو الـ embryo بيبدأ طبيعيًا يزرع (implant) في الـ endometrium؟","whyWrong":[null,"الـ four-cell stage لسه في الـ tube.","الـ morula لسه بتوصل للرحم ومحاطة بالـ zona.","الـ trilaminar disc في الأسبوع التالت بعد الـ implantation."]},{"id":"EM2022-07","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"What is the site of blastocyst implantation in placenta previa?","options":["Ovary","rectouterine pouch","the tube","uterine cavity"],"answer":3,"explanation":"في الـ placenta previa الـ implantation بيكون جوه الـ uterine cavity بس في الجزء السفلي قريب من الـ internal os. الـ ovary والـ tube والـ pouch دي ectopic.","memoryTrick":"Previa = جوه الرحم بس تحت.","stemAr":"مكان زرع الـ blastocyst في حالة الـ placenta previa فين؟","whyWrong":["الـ ovary = ovarian ectopic.","الـ rectouterine pouch = abdominal ectopic.","الـ tube = tubal ectopic. الـ previa جوه الرحم بس تحت.",null]},{"id":"EM2022-08","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"The blastocyst is called late blastocyst after which of the following:","options":["Implantation","Fertilization","Hatching","Cleavage"],"answer":2,"explanation":"الـ blastocyst بيتسمى late بعد الـ hatching (خروجه من الـ zona pellucida) وقبل الـ implantation على طول.","memoryTrick":"Hatching = Late blastocyst 🐣.","stemAr":"الـ blastocyst بيتسمى late blastocyst بعد أنهي واحدة من دول؟","whyWrong":["الـ implantation بيحصل بعد الـ hatching.","الـ fertilization بداية كل حاجة.",null,"الـ cleavage بيكوّن الـ morula."]},{"id":"EM2022-09","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2022","stem":"The cells by which the embryo nourished are which of the following:","options":["Cytotrophoblast","Decidual","Amnioblast","Blastomeres"],"answer":1,"explanation":"الـ decidual cells هي خلايا الـ endometrium بعد ما تتغير بسبب الـ implantation (decidual reaction). بتبقى كبيرة ومليانة glycogen و lipids، والـ syncytiotrophoblast بيآكلها، فبتكون أول مصدر لتغذية الـ embryo في الأسابيع الأولى قبل ما الـ placenta تشتغل.","memoryTrick":"Decidua = مطبخ الجنين الأول 🍱 (Glycogen + Lipids).","stemAr":"الخلايا اللي الـ embryo بيتغذى عن طريقها هي أنهي واحدة من دول؟","whyWrong":["الـ cytotrophoblast طبقة من الـ trophoblast بتشارك في تكوين الـ villi، بس الغذا الأولي جاي من الـ decidual cells المليانة glycogen و lipids. واللبس جاي من إن الـ trophoblast هو اللي بيوصّل الغذا.",null,"الـ amnioblasts بيكوّنوا الـ amnion، ملهمش علاقة بالتغذية.","الـ blastomeres هي خلايا الجنين نفسه في الـ cleavage."]},{"id":"EM2022-10","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"After the blastocytic cavity is surrounded by exocoelemic membrane it is called:","options":["Amniotic cavity","Chorionic cavity","Primary yolk sac","Extraembryonic mesoderm"],"answer":2,"explanation":"لما الـ hypoblast cells تكوّن الـ exocoelomic (Heuser's) membrane وتبطن الـ blastocystic cavity، الـ cavity دي تتسمى primary yolk sac.","memoryTrick":"Heuser's membrane حوالين الـ cavity = Primary yolk sac.","stemAr":"بعد ما الـ blastocystic cavity تتحاط بالـ exocoelomic membrane بيبقى اسمها:","whyWrong":["الـ amniotic cavity بتتكون جوه الـ epiblast.","الـ chorionic cavity بتتكون جوه الـ extraembryonic mesoderm.",null,"الـ extraembryonic mesoderm طبقة خلايا مش cavity."]},{"id":"EM2022-11","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2022","stem":"Where does fertilization of the egg occur?","options":["Ovary","Internal Os of the Uterus","Fimbriae","Ampulla"],"answer":3,"explanation":"الـ fertilization بتحصل في الـ ampulla of the uterine tube (أوسع جزء).","memoryTrick":"Ampulla = مكان اللقاء 💍.","stemAr":"الـ fertilization بتاع البويضة بيحصل فين؟","whyWrong":["الـ ovary فيها الـ ovulation، مش الـ fertilization.","الـ internal os فتحة الرحم، مش مكان الـ fertilization.","الـ fimbriae بتلقط البويضة، بس الـ fertilization بيحصل في الـ ampulla.",null]},{"id":"EM2022-12","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"What implants into the nutrient-rich endometrium (i.e. decidua) about 8-9 days after ovulation?","options":["Blastocyst","Morula","Epiblast","Hypoblast"],"answer":0,"explanation":"الـ blastocyst هو اللي بيعمل implantation في الـ endometrium.","memoryTrick":"Blastocyst = اللي بيزرع.","stemAr":"إيه اللي بيزرع (implants) في الـ endometrium الغني بالغذا (الـ decidua) بعد الـ ovulation بحوالي 8–9 أيام؟","whyWrong":[null,"الـ morula بتوصل الرحم يوم 4 تقريبًا ومبتزرعش.","الـ epiblast طبقة جوه الـ embryo بتظهر بعد بداية الـ implantation.","الـ hypoblast نفس الكلام."]},{"id":"EM2022-13","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"Which two embryological structures together form the bilaminar disk?","options":["Cytotrophoblast and Hypoblast","Hypoblast and Epiblast","Epiblast and Cytotrophoblast","Syncytiotrophoblast and Inner cell mass"],"answer":1,"explanation":"الـ bilaminar disc = epiblast (فوق) + hypoblast (تحت).","memoryTrick":"Bi = اتنين: Epi + Hypo.","stemAr":"أنهي اتنين embryological structures مع بعض بيكوّنوا الـ bilaminar disc؟","whyWrong":["الـ cytotrophoblast جزء من الـ trophoblast مش من الـ disc.",null,"نفس الكلام.","الـ syncytiotrophoblast خارج الـ embryo. والـ inner cell mass هو أصل الـ disc نفسه."]},{"id":"EM2022-14","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2022","stem":"In H&E - stained sections of plasma cell, How can Golgi apparatus appears?","options":["Perinuclear.","Apical.","Unstained.","Basal."],"answer":2,"repeatOf":"EM2019A-13","explanation":"في الـ plasma cell الـ Golgi بيظهر في H&E كـ negative image (منطقة فاتحة unstained) جنب النواة، لأنه مبيتصبغش.","memoryTrick":"Golgi في H&E = Negative image (بقعة فاضية).","stemAr":"في قطاعات الـ plasma cell المصبوغة بـ H&E، الـ Golgi apparatus بيظهر إزاي؟","whyWrong":["الـ perinuclear بيوصف مكانه صح، لكن السؤال عن شكله في الـ H&E، وهو بيظهر negative image (unstained). عشان كده الإجابة D.","مكان الـ Golgi في الـ plasma cell جنب النواة، بس في الـ H&E مش بيتصبغ. اللبس جاي من خلط المكان بالشكل.",null,"الـ Golgi مش basal. ودي إجابة غلط في المكان وفي الشكل."]},{"id":"EM2022-15","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2022","stem":"Which Two organelles share in the formation of lysosomes?","options":["rER & SER.","sER & Golgi.","Golgi & cell membrane.","rER & Golgi."],"answer":3,"repeatOf":"EM2019A-14","explanation":"الـ lysosomal enzymes بتتصنع على الـ rER وبعدين تتغلف وتتعبى في الـ Golgi (trans face) فتطلع primary lysosomes.","memoryTrick":"rER يصنع ➜ Golgi يغلّف = Lysosome.","stemAr":"أنهي اتنين organelles بيشاركوا في تكوين الـ lysosomes؟","whyWrong":["الـ sER مش بيصنع البروتينات (الإنزيمات)، اللي بيصنعها الـ rER.","الـ sER مش مسئول عن الإنزيمات. الصح rER (يصنع) و Golgi (يغلّف).","الـ cell membrane مش بيصنع إنزيمات الـ lysosome.",null]},{"id":"EM2022-16","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2022","stem":"What structure contributes to the cells cytoskeleton?","options":["Ribosomes","Peroxisome","Microfilaments","Centrioles"],"answer":2,"repeatOf":"EM2019A-15","explanation":"الـ cytoskeleton مكوّن من microfilaments و intermediate filaments و microtubules. الـ ribosomes والـ peroxisomes مش جزء منه.","memoryTrick":"Cytoskeleton = Filaments + Tubules.","stemAr":"أنهي structure بيشارك في الـ cytoskeleton بتاع الخلية؟","whyWrong":["الـ ribosomes لتصنيع البروتين، مش هيكل للخلية.","الـ peroxisome organelle غشائي للـ oxidation، ملوش علاقة بالـ cytoskeleton.",null,"الـ centrioles بتتكون من microtubules بس بتعتبر organelle منفصلة، مش جزء من الـ cytoskeleton في الإجابة دي."]},{"id":"EM2022-17","topic":"histo","concept":"Cell membrane & transport","source":"EM2022","stem":"What is the polysaccharide coating that is sometimes found on the cell membrane?","options":["Plasmalemma","Glycocalyx","Protoplasm","Cristae"],"answer":1,"repeatOf":"ES2019-06","explanation":"الـ glycocalyx (cell coat) هو الطبقة الـ carbohydrate (glycoproteins & glycolipids) على السطح الخارجي للـ cell membrane.","memoryTrick":"Glyco = سكر ➜ Glycocalyx = غلاف سكري.","stemAr":"إيه هو الغطا الـ polysaccharide اللي بيكون أحيانًا على الـ cell membrane؟","whyWrong":["الـ plasmalemma هو اسم الـ cell membrane نفسه، مش الطبقة اللي عليه.",null,"الـ protoplasm مكونات الخلية الحية كلها.","الـ cristae طيات الـ inner mitochondrial membrane."]},{"id":"EM2022-18","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2022","stem":"What does the cause of Down syndrome:","options":["due to duplication of chromosome 22.","due to X chromosome monosomy.","due to multiple X syndrome.","caused by chromosome 21 trisomy."],"answer":3,"explanation":"Down syndrome سببه trisomy 21.","memoryTrick":"Down = 21.","stemAr":"إيه سبب الـ Down syndrome؟","whyWrong":["الـ chromosome 22 مرتبط بالـ Philadelphia.","الـ X monosomy = Turner.","الـ multiple X زي XXX.",null]},{"id":"EM2022-19","topic":"histo","concept":"Cell membrane & transport","source":"EM2022","stem":"What is the term for the process used by cells for the transport solids?","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":3,"explanation":"الـ phagocytosis = ابتلاع جزيئات صلبة (cell eating). الـ pinocytosis للسوائل.","memoryTrick":"Phago = أكل (solids).","stemAr":"إيه اسم العملية اللي الخلايا بتستخدمها عشان تنقل المواد الصلبة (solids)؟","whyWrong":["الـ endocytosis مصطلح عام.","الـ exocytosis إخراج.","الـ pinocytosis للسوائل.",null]},{"id":"EM2022-20","topic":"histo","concept":"Cell membrane & transport","source":"EM2022","stem":"Cell coat function all except:","options":["Cell adhesions.","Cell allergy.","Cell recognition.","Cell transport"],"answer":3,"repeatOf":"ES2020-05","explanation":"حسب الإجابة في الملزمة الـ cell coat (glycocalyx) وظايفه: cell recognition و cell adhesion و immune/allergic reactions، أما الـ transport فده شغل الـ membrane proteins نفسها.","memoryTrick":"Glycocalyx = ID card + glue (recognition & adhesion).","stemAr":"وظايف الـ cell coat كلها ما عدا:","whyWrong":["الـ cell adhesion من وظايف الـ cell coat فعلًا، والسؤال عن اللي مش من وظايفه.","حسب الملزمة، الـ cell coat ليه دور في الـ immune/allergic reactions (الـ antigens على السطح). الإجابة المطلوبة D.","الـ cell recognition وظيفة أساسية للـ cell coat.",null]},{"id":"EM2022-21","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2022","stem":"The cytoplasmic side of the coated vesicle is surrounded by:","options":["Clathrin.","Tubulin.","Actin.","Spectrin."],"answer":0,"repeatOf":"ES2020-07","explanation":"الـ coated vesicles متغطية من ناحية الـ cytoplasm ببروتين clathrin.","memoryTrick":"Coated = Clathrin (C مع C).","stemAr":"الناحية اللي جوه الـ cytoplasm من الـ coated vesicle محاطة بـ:","whyWrong":[null,"الـ tubulin بروتين الـ microtubules.","الـ actin بروتين الـ microfilaments.","الـ spectrin بيدعم غشا الـ RBC."]},{"id":"EM2022-22","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2022","stem":"Which organelle is involved in lipid metabolism?","options":["rER","Golgi apparatus","sER","Lysosome"],"answer":2,"repeatOf":"ES2021-07","explanation":"الـ sER مسئول عن lipid metabolism و steroid synthesis و detoxification.","memoryTrick":"Smooth = Steroids & Lipids & Detox.","stemAr":"أنهي organelle له دور في الـ lipid metabolism؟","whyWrong":["الـ RER للبروتين.","الـ Golgi للتغليف.",null,"الـ lysosome للهضم."]},{"id":"EM2022-23","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2022","stem":"What are the folds on the inner mitochondrial membrane called?","options":["Plasmalemma","Glycocalyx","Protoplasm","Cristae"],"answer":3,"explanation":"الـ cristae هي الثنيات في الـ inner mitochondrial membrane، وبتزوّد المساحة للـ oxidative phosphorylation.","memoryTrick":"Cristae = Crests (طيات) جوه الـ mitochondria.","stemAr":"الطيّات (folds) اللي في الـ inner mitochondrial membrane اسمها إيه؟","whyWrong":["الـ plasmalemma هو الـ cell membrane.","الـ glycocalyx الطبقة السكرية على سطح الخلية.","الـ protoplasm محتوى الخلية.",null]},{"id":"ES2022-01","topic":"anat","concept":"Scalp & face","source":"ES2022","stem":"The occipital belly of occipitofrontalis is supplied by which of the following?","options":["Buccal branch of facial nerve.","posterior auricular nerve.","mandibular branch of facial nerve.","temporal branch of facial nerve"],"answer":1,"explanation":"الـ occipital belly بيتغذى من الـ posterior auricular nerve.","memoryTrick":"Occipital = Posterior auricular.","stemAr":"الـ occipital belly بتاع الـ occipitofrontalis بيتغذى عصبيًا من أنهي واحد من دول؟","whyWrong":["الـ buccal branch لعضلات الخد.",null,"الـ mandibular لعضلات الشفة السفلى.","الـ temporal branch للـ frontal belly مش الـ occipital."]},{"id":"ES2022-02","topic":"anat","concept":"Scalp & face","source":"ES2022","stem":"The lateral part of the scalp is drained into which of the following?","options":["Parotid lymph nodes.","Mastoid lymph nodes.","Occipital lymph nodes.","Submandibular lymph nodes"],"answer":0,"explanation":"الجزء الجانبي (temporal) من الـ scalp قدام الودن بيصرف على الـ parotid (preauricular) lymph nodes.","memoryTrick":"قدام الودن = Parotid / ورا = Mastoid / الخلف = Occipital.","stemAr":"الجزء الجانبي (lateral) من الـ scalp بيصرّف في أنهي واحد من دول؟","whyWrong":[null,"الـ mastoid للجزء الخلفي ورا الودن.","الـ occipital للجزء الخلفي.","الـ submandibular للجزء الأمامي."]},{"id":"F2023A-01","topic":"histo","concept":"Inclusions, pigments & stains","source":"F2023A","stem":"When the protein secreting cells stained with Hematoxylin and Eosin, There is a clear unstained area near the nucleus. This pale area is called:","options":["Brown network or granules","Cisternae","Negative Golgi image","Cristae"],"answer":2,"explanation":"المنطقة الفاتحة جنب النواة في الخلايا المفرزة للبروتين (زي الـ plasma cell) هي الـ negative Golgi image.","memoryTrick":"بقعة فاضية = Golgi.","stemAr":"لما الخلايا اللي بتفرز بروتين تتصبغ بـ Hematoxylin and Eosin، بيبان منطقة فاتحة مش مصبوغة جنب النواة. المنطقة الفاتحة دي اسمها:","whyWrong":["الـ brown network ده شكل الـ Golgi بالـ silver stain، مش في الـ H&E.","الـ cisternae أكياس الـ Golgi في الـ EM، مش اسم المنطقة الفاتحة.",null,"الـ cristae في الـ mitochondria."]},{"id":"F2023A-02","topic":"histo","concept":"Chromosomes & genetic disorders","source":"F2023A","stem":"The nucleus of which of the following cells shows Barr body in females (drum stick appearance):","options":["Lymphocyte","Neutrophil","Monocyte","Basophil"],"answer":1,"explanation":"الـ Barr body في الإناث بيظهر في الـ neutrophils كـ drumstick appendage على النواة.","memoryTrick":"Drumstick = Neutrophil 🥁.","stemAr":"نواة أنهي خلية من دول بيظهر فيها الـ Barr body في الإناث (شكل الـ drum stick)؟","whyWrong":["الـ lymphocyte نواته كبيرة مستديرة ومش بيبان فيها الـ drumstick.",null,"الـ monocyte نواته kidney-shaped.","الـ basophil نواته مستخبية تحت الـ granules. الـ drumstick بيظهر في نواة الـ neutrophil المفصصة."]},{"id":"F2023A-03","topic":"histo","concept":"Cell cycle & division","source":"F2023A","stem":"During the cell cycle, in which stage DNA replication takes place?","options":["Prophase","Metaphase","Anaphase","Interphase"],"answer":3,"explanation":"الـ DNA replication بتحصل في الـ interphase (تحديدًا الـ S phase) قبل الـ mitosis.","memoryTrick":"Replication = Interphase (S).","stemAr":"أثناء الـ cell cycle، الـ DNA replication بيحصل في أنهي مرحلة؟","whyWrong":["في الـ prophase الـ DNA بيتكثف، مش بيتضاعف.","في الـ metaphase الـ chromosomes بتترص في النص.","في الـ anaphase الـ chromatids بتنفصل.",null]},{"id":"F2023A-04","topic":"histo","concept":"Chromosomes & genetic disorders","source":"F2023A","stem":"In which of the following types, the chromosomes have short and long arms of unequal length with the centromere presents more towards one end?","options":["Acrocentric","Telocentric","Submetacentric","Metacentric"],"answer":2,"explanation":"الـ submetacentric: الـ centromere بعيد شوية عن النص ناحية طرف فبيبقى فيه short arm (p) و long arm (q) مش متساويين.","memoryTrick":"Sub = تحت النص بشوية.","stemAr":"في أنهي نوع من دول الـ chromosomes بيبقى ليها short arm و long arm مش متساويين والـ centromere أقرب لطرف واحد؟","whyWrong":["الـ acrocentric الـ centromere قريب جدًا من الطرف والـ short arm صغير جدًا. السؤال بيوصف حالة وسط.","الـ telocentric الـ centromere في الطرف خالص (مش موجود في الإنسان).",null,"الـ metacentric الذراعين متساويين."]},{"id":"F2023A-05","topic":"histo","concept":"Cytoplasmic organelles","source":"F2023A","stem":"Protein synthesizing cells are rich in which of the following structure?","options":["SER","Lipid droplets","Mucus granules","rER"],"answer":3,"explanation":"الخلايا اللي بتصنع بروتين غنية بالـ rER.","memoryTrick":"Protein = Rough.","stemAr":"الخلايا اللي بتصنع بروتين بتكون غنية بأنهي structure من دول؟","whyWrong":["الـ SER مش للبروتين.","الـ lipid droplets inclusions.","الـ mucus granules منتج، مش الـ organelle اللي بيصنع البروتين.",null]},{"id":"F2023A-06","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"F2023A","stem":"Actin filaments are responsible for formation of which of the following?","options":["Centriole","Contractile ring","Mitotic spindle","Cilia"],"answer":1,"explanation":"الـ actin filaments بتعمل الـ contractile ring اللي بيقسم الـ cytoplasm في الـ cytokinesis. الـ spindle والـ centrioles والـ cilia من microtubules.","memoryTrick":"Actin = الحزام اللي بيخنق الخلية (ring).","stemAr":"الـ actin filaments مسئولة عن تكوين أنهي واحد من دول؟","whyWrong":["الـ centriole من الـ microtubules.",null,"الـ mitotic spindle من الـ microtubules.","الـ cilia من الـ microtubules. الـ actin بيكوّن الـ contractile ring في الـ cytokinesis."]},{"id":"F2023A-07","topic":"histo","concept":"Cytoplasmic organelles","source":"F2023A","stem":"Which of the following is concerned with formation of ribosomes?","options":["Golgi","Centriole","RER","Nucleolus"],"answer":3,"explanation":"الـ nucleolus مسئول عن تكوين الـ ribosomes.","memoryTrick":"Nucleolus = Ribosomes.","stemAr":"أنهي واحد من دول مسئول عن تكوين الـ ribosomes؟","whyWrong":["الـ Golgi للتغليف.","الـ centriole للـ spindle.","الـ RER عليه ribosomes، بس مش هو اللي بيكوّنها. اللبس جاي من وجودها عليه.",null]},{"id":"F2023A-08","topic":"histo","concept":"Cell membrane & transport","source":"F2023A","stem":"In the molecular structure of the cell membrane, which of the following structures fill the gap between the fatty acid tails in a ratio one by one?","options":["Cholesterol","Lipid bilayer","Phospholipid","Integral protein"],"answer":0,"explanation":"الـ cholesterol بيدخل بين ذيول الـ phospholipids (بنسبة تقريبًا 1:1) وبينظّم الـ fluidity بتاعة الـ membrane.","memoryTrick":"Cholesterol = الحشو بين الذيول.","stemAr":"في التركيب الجزيئي للـ cell membrane، أنهي structure من دول بيملا الفراغ بين ذيول الـ fatty acids بنسبة واحد لواحد؟","whyWrong":[null,"الـ lipid bilayer هو الغشا كله مش اللي بيملا الفراغ.","الـ phospholipid هو اللي عامل الفراغ أصلًا.","الـ integral protein بيعدّي في الغشا ومش بنسبة 1:1."]},{"id":"F2023B-01","topic":"embryo","concept":"Female cycles & hormones","source":"F2023B","stem":"the secretory phase of the uterus is characterized by which of the following","options":["it is under the influence of progesterone","it starts from the 5th day till 14th day of the cycle","initiate the formation of a new layer of endometrium in the uterus","Thickness of endometrium in this stage is 0.5 mm"],"answer":0,"explanation":"الـ secretory phase بتحصل بعد الـ ovulation تحت تأثير الـ progesterone من الـ corpus luteum (من يوم 15 لـ 28).","memoryTrick":"Secretory = Progesterone (بعد التبويض).","stemAr":"الـ secretory phase بتاعة الـ uterus بتتميز بأنهي واحدة من دول؟","whyWrong":[null,"يوم 5–14 ده الـ proliferative phase.","تكوين طبقة endometrium جديدة في الـ proliferative.","0.5 mm ده سُمك الـ endometrium في الـ menstrual phase."]},{"id":"F2023B-02","topic":"embryo","concept":"Implantation & second week","source":"F2023B","stem":"what is the site of blastocyst implantation in placenta previa","options":["the tube","uterine cavity","ovary","rectouterine pouch"],"answer":1,"repeatOf":"EM2022-07","explanation":"في الـ placenta previa الـ implantation بيكون جوه الـ uterine cavity بس في الجزء السفلي قريب من الـ internal os. الـ ovary والـ tube والـ pouch دي ectopic.","memoryTrick":"Previa = جوه الرحم بس تحت.","stemAr":"مكان زرع الـ blastocyst في حالة الـ placenta previa فين؟","whyWrong":["الـ tube = tubal ectopic. الـ previa جوه الرحم بس تحت.",null,"الـ ovary = ovarian ectopic.","الـ rectouterine pouch = abdominal ectopic."]},{"id":"F2023B-03","topic":"embryo","concept":"Gametogenesis","source":"F2023B","stem":"Capacitation means which of the followings","options":["adaptation of sperms in female genital tract","Acrosome release proteolytic enzymes such as trypsin like substances.","It is induced by zona pellucida proteins","release of lysosomal enzymes from cortical granules"],"answer":0,"explanation":"الـ capacitation = تهيئة (adaptation) الـ sperm في الـ female genital tract بشيل الـ glycoprotein coat عشان يقدر يخصّب.","memoryTrick":"Capacitation = تأهيل في بيت الست.","stemAr":"الـ capacitation معناها أنهي واحدة من دول؟","whyWrong":[null,"ده الـ acrosome reacti dometrium بيستجيب للـ estrogen، مش بيفرزه."]},{"id":"F2023B-07","topic":"embryo","concept":"Fertilization & cleavage","source":"F2023B","stem":"which of the followings is true about the fertilization","options":["it occurs usually in the infundibulum of the fallopian tube","chromosomal sex of the embryo is determined at fertilization.","the oocyte remains viable for 5 days","all the sperms can penetrate the zona pellucida"],"answer":1,"explanation":"الـ chromosomal sex بيتحدد لحظة الـ fertilization حسب الـ sperm (X أو Y). الـ fertilization في الـ ampulla، والـ oocyte يعيش 12–24 ساعة، وsperm واحد بس بيدخل.","memoryTrick":"الجنس يتحدد من الأب لحظة التلقيح.","stemAr":"أنهي واحدة من دول صح عن الـ fertilization؟","whyWrong":["المكان المعتاد الـ ampulla، مش الـ infundibulum.",null,"البويضة بتعيش حوالي 12–24 ساعة، مش 5 أيام. الـ sperm هو اللي ممكن يعيش أيام.","sperm واحد بس اللي بيخترق، والباقي بتمنعه الـ zona reaction."]},{"id":"F2023B-08","topic":"anat","concept":"Movements","source":"F2023B","stem":"Medial rotation means","options":["Moving the limb externally around the long axis","Moving the limb internally around the long axis","Moving the limb upward around horizontal axis","Moving the limb downward around horizontal axis"],"answer":1,"explanation":"الـ medial rotation = لف الطرف لجوه حوالين الـ long axis.","memoryTrick":"Medial = لجوه.","stemAr":"الـ medial rotation معناها:","whyWrong":["ده الـ lateral (external) rotation.",null,"حركة لفوق حوالين horizontal axis تبقى flexion أو elevation، مش rotation.","نفس الكلام."]},{"id":"F2023B-09","topic":"anat","concept":"Anatomical position, planes & terms","source":"F2023B","stem":"Coronal plane divide the body into","options":["Upper and lower halves","Anterior and posterior halves","Right and left halves","Superior and inferior halves"],"answer":1,"explanation":"الـ coronal plane بيقسم الجسم لـ anterior و posterior.","memoryTrick":"Coronal = قدام/ورا.","stemAr":"الـ coronal plane بيقسم الجسم لـ:","whyWrong":["upper و lowe emoryTrick":"Rough = للتصدير / Free = للاستهلاك المحلي.","stemAr":"وظيفة الـ rough endoplasmic reticulum إنه يصنع:","whyWrong":["الـ lipid من الـ sER.",null,"الـ cytoplasmic proteins بتتصنع على الـ free ribosomes.","الـ carbohydrates بتتضاف في الـ Golgi."]},{"id":"EM2023-02","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"Smooth endoplasmic reticulum:","options":["Sometimes has ribosomes attached to its membrane","Is rarely found in skeletal muscle cells","Areas of localized basophilic indicate its presence","Is present in cells where drug detoxification is taking place"],"answer":3,"explanation":"الـ sER موجود بكثرة في الخلايا اللي بتعمل drug detoxification (زي الـ liver cells). مفيش عليه ribosomes، وموجود بكثرة في الـ skeletal muscle (sarcoplasmic reticulum).","memoryTrick":"Smooth = Detox.","stemAr":"الـ smooth endoplasmic reticulum:","whyWrong":["الـ sER معندوش ribosomes، ولو عليه يبقى rER.","بالعكس، الـ sER كتير في الـ skeletal muscle (اسمه sarcoplasmic reticulum).","الـ basophilia سببها الـ rER (الـ ribosomes).",null]},{"id":"EM2023-03","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"The Golgi apparatus is:","options":["The site of packaging of secretory products of the cell.","The site of protein synthesis.","Continuous with smooth endoplasmic reticulum.","Capable of providing energy."],"answer":0,"explanation":"الـ Golgi apparatus هو مكان الـ packaging والـ modification للـ secretory products.","memoryTrick":"Golgi = مكتب البريد 📦.","stemAr":"الـ Golgi apparatus هو:","whyWrong":[null,"البروتين بيتصنع في الـ rER.","الـ Golgi مش متصل بالـ sER. بيوصله البروتين بـ transfer vesicles.","الطاقة من الـ mitochondria."]},{"id":"EM2023-04","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"Multivesicular bodies are:","options":["Primary lysosomes.","Formed as a result of digestion of solid material.","Formed as a result of digestion of fluid material.","Autophagic vacuoles."],"answer":2,"explanation":"الـ multivesicular bodies بتتكون لما الـ primary lysosome يندمج مع pinocytic vesicles (هضم fluid material).","memoryTrick":"Multivesicular = سوائل (pinocytosis).","stemAr":"الـ multivesicular bodies هي:","whyWrong":["الـ primary lysosome لسه ما اندمجش مع حاجة.","هضم المواد الصلبة بيكوّن الـ phagolysosome.",null,"الـ autophagic vacuole لهضم organelles الخلية نفسها."]},{"id":"EM2023-05","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2023","stem":"Microtubules have important role in:","options":["Carbohydrate metabolism.","Oxidative phosphorylation.","Water balance.","Formation of the mitotic spindle during mitosis."],"answer":3,"explanation":"الـ microtubules بتكوّن الـ mitotic spindle اللي بيشد الـ chromosomes وقت الـ mitosis.","memoryTrick":"Microtubules = Spindle.","stemAr":"الـ microtubules ليها دور مهم في:","whyWrong":["الـ carbohydrate metabolism في الـ cytoplasm والـ mitochondria.","الـ oxidative phosphorylation في الـ mitochondria.","الـ water balance ملوش علاقة بالـ microtubules.",null]},{"id":"EM2023-06","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"DNA could be found in:","options":["Ribosomes.","Golgi apparatus.","Mitochondria.","Lysosomes."],"answer":2,"explanation":"الـ mitochondria فيها DNA دائري خاص بيها (mtDNA).","memoryTrick":"Mitochondria = عندها DNA خاص.","stemAr":"الـ DNA ممكن يتلاقي في:","whyWrong":["الـ ribosomes فيها rRNA مش DNA.","الـ Golgi مفيهوش DNA.",null,"الـ lysosomes مفيهاش DNA."]},{"id":"EM2023-07","topic":"histo","concept":"Nucleus & chromatin","source":"EM2023","stem":"Heterochromatin is:","options":["Present in the nuclei of metabolically active cells.","Special type of stain.","Present in the nuclei of metabolically inactive cells","Type of cell inclusions."],"answer":2,"explanation":"الـ heterochromatin = chromatin مكثّف وغير نشط، بيكثر في الخلايا قليلة النشاط.","memoryTrick":"Hetero = Hidden & Inactive.","stemAr":"الـ heterochromatin هو:","whyWrong":["الخلايا النشطة فيها euchromatin.","ده نوع chromatin مش صبغة.",null,"الـ chromatin مش inclusion."]},{"id":"EM2023-08","topic":"histo","concept":"Nucleus & chromatin","source":"EM2023","stem":"The nucleolus is formed of:","options":["Heterochromatin and euchromatin.","Nucleolonema and pars amorpha.","Nucleolus associated and peripheral chromatin.","Condensed chromatin."],"answer":1,"explanation":"الـ nucleolus مكوّن من nucleolonema (الجزء الخيطي) و pars amorpha (الجزء الـ amorphous).","memoryTrick":"Nucleolus = Nema + Amorpha.","stemAr":"الـ nucleolus مكوّن من:","whyWrong":["ده وصف الـ chromatin في النواة.",null,"الـ nucleolus-associated chromatin بيحيط بالـ nucleolus، بس مش هو مكوناته.","الـ condensed chromatin هو الـ heterochromatin."]},{"id":"EM2023-09","topic":"histo","concept":"Nucleus & chromatin","source":"EM2023","stem":"The nuclear pore:","options":["Is at regular intervals.","Is bridged by a unit membrane.","Is a transient structure.","Allows for communication between the nucleus and the cytoplasm"],"answer":3,"explanation":"الـ nuclear pores بتسمح بالتواصل وتبادل المواد (زي mRNA والبروتينات) بين النواة والـ cytoplasm.","memoryTrick":"Pore = باب بين النواة والسيتوبلازم.","stemAr":"الـ nuclear pore:","whyWrong":["الـ pores مش موزعة بانتظام.","الـ pore مقفول بـ diaphragm (pore complex) مش unit membrane.","الـ pore تركيب ثابت.",null]},{"id":"EM2023-10","topic":"histo","concept":"Cell membrane & transport","source":"EM2023","stem":"Glycocalyx is:","options":["The protein component of the cell membrane.","The hydrophilic end of lipid.","The carbohydrate component of the cell membrane.","The hydrophobic end of lipid."],"answer":2,"explanation":"الـ glycocalyx هو الـ carbohydrate component للـ cell membrane.","memoryTrick":"Glyco = Carbohydrate.","stemAr":"الـ glycocalyx هو:","whyWrong":["البروتين جزء من الغشا نفسه.","الـ hydrophilic end ده راس الـ phospholipid.",null,"الـ hydrophobic end ده ديل الـ phospholipid."]},{"id":"EM2023-11","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2023","stem":"Which of the following statements is incorrect?","options":["Microtubules are involved in ciliary movement and intracellular transport.","The cis (forming) face of Golgi apparatus is where secretory granules are formed.","The microtubules of the centrioles and in the basal body of cilia have a 9x3 arrangement.","Ribosomes, made of rrna and protein, are the site of protein synthesis."],"answer":1,"explanation":"الجملة الغلط B: الـ secretory granules بتطلع من الـ trans (maturing) face مش الـ cis face. الـ cis هي اللي بتستقبل من الـ rER.","memoryTrick":"Cis = داخل (من rER) / Trans = خارج (إفراز).","stemAr":"أنهي جملة من دول غلط؟","whyWrong":["دي جملة صح: الـ microtubules بتحرك الـ cilia وبتنقل جوه الخلية. والسؤال عن الغلط.",null,"صح: الـ centrioles والـ basal body ترتيبهم 9×3.","صح: الـ ribosomes مكونة من rRNA وبروتين. الغلط B، لأن الـ secretory granules بتتكون عند الـ trans (maturing) face مش الـ cis."]},{"id":"EM2023-12","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2023","stem":"Which of the following is one of the characteristics of anatomical position?","options":["The arms are abducted","The palm face anterior","The lower limbs are abducted","The toes directed to the left."],"answer":1,"explanation":"في الـ anatomical position: واقف، الرجلين مقفولين، الإيدين جنبه، والـ palms لقدام.","memoryTrick":"Palms Forward.","stemAr":"أنهي واحدة من دول من صفات الـ anatomical position؟","whyWrong":["الـ arms في الـ anatomical position جنب الجسم (adducted).",null,"الـ lower limbs مقفولة (adducted).","الـ toes لقدام مش للشمال."]},{"id":"EM2023-13","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2023","stem":"Which of the following anatomical planes divided the body into anterior and posterior parts?","options":["Horizontal plane.","Coronal plane","Midsagittal plane","Parasagittal plane"],"answer":1,"explanation":"الـ coronal plane بيقسم الجسم لـ anterior و posterior.","memoryTrick":"Coronal = قدام/ورا.","stemAr":"أنهي anatomical plane من دول بيقسم الجسم لجزء anterior وجزء posterior؟","whyWrong":["الـ horizontal فوق وتحت.",null,"الـ midsagittal يمين وشمال متساويين.","الـ parasagittal يمين وشمال مش متساويين."]},{"id":"EM2023-14","topic":"anat","concept":"Movements","source":"EM2023","stem":"Which of the following movement of the limb upward?","options":["Flexion","Elevation","Extension","Depression"],"answer":1,"explanation":"حسب الملزمة: الـ elevation = تحريك الجزء لفوق (زي رفع الكتف). الـ depression لتحت.","memoryTrick":"Elevation = Elevator لفوق ⬆️.","stemAr":"أنهي حركة من دول بتحرك الطرف لفوق؟","whyWrong":["الـ flexion ثني المفصل، مش رفع لفوق.",null,"الـ extension فرد المفصل.","الـ depression تحريك لتحت، عكس المطلوب."]},{"id":"EM2023-15","topic":"anat","concept":"Cartilage","source":"EM2023","stem":"Which of the following cartilage disappears in the adult?","options":["Growing plate","Articular cartilage","Costal cartilage","Cartilage of the auricle"],"answer":0,"explanation":"الـ growing (epiphyseal) plate بتختفي في الكبار لما الـ epiphysis تلتحم بالـ shaft. باقي الغضاريف بتفضل.","memoryTrick":"Growth plate = بيقفل بعد البلوغ.","stemAr":"أنهي cartilage من دول بيختفي في البالغين؟","whyWrong":[null,"الـ articular cartilage بيفضل طول العمر على أسطح المفاصل.","الـ costal cartilage بيفضل يوصّل الضلوع بالـ sternum.","غضروف الودن بيفضل (elastic cartilage)."]},{"id":"EM2023-16","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2023","stem":"There are two forms of bone, which of the following is the character of spongy bone?","options":["It consists of number of cylindrical units called haversian system","It is formed of trabeculae","It forms the surface layer of all bones","It provides strength for weight bearing"],"answer":1,"explanation":"الـ spongy (cancellous) bone مكوّن من trabeculae متشابكة بينها spaces فيها marrow. الـ Haversian systems والـ surface layer والـ weight bearing صفات الـ compact bone.","memoryTrick":"Spongy = إسفنجة = Trabeculae.","stemAr":"فيه نوعين من العظم، أنهي واحدة من دول صفة الـ spongy bone؟","whyWrong":["الـ Haversian systems صفة الـ compact.",null,"الطبقة الخارجية compact.","تحمّل الوزن والقوة صفة الـ compact."]},{"id":"EM2023-17","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2023","stem":"Which of the following arteries supplies the bone marrow?","options":["Periosteal artery","The articular artery","Epiphyseal artery","Nutrient artery"],"answer":3,"explanation":"الـ nutrient artery بتغذي الـ bone marrow.","memoryTrick":"Nutrient = Marrow.","stemAr":"أنهي artery من دول بتغذي الـ bone marrow؟","whyWrong":["الـ periosteal للـ outer compact bone.","الـ articular arteries للمفاصل وأطراف العظمة.","الـ epiphyseal للـ epiphysis.",null]},{"id":"EM2023-18","topic":"embryo","concept":"Implantation & second week","source":"EM2023","stem":"Which structure does not take place in the late blastocyst?","options":["Zona pellucida","Trophoblast","Embryoblast","Blastocele"],"answer":0,"explanation":"في الـ late blastocyst (بعد الـ hatching) الـ zona pellucida بتختفي، وبيفضل الـ trophoblast والـ embryoblast والـ blastocele.","memoryTrick":"Late = خرج من الـ zona (Hatched).","stemAr":"أنهي structure مبيتكونش في الـ late blastocyst؟","whyWrong":[null,"الـ trophoblast موجود في الـ blastocyst.","الـ embryoblast (inner cell mass) موجود.","الـ blastocele هو تجويف الـ blastocyst نفسه. الـ late blastocyst عمل hatching فالـ zona اختفت."]},{"id":"EM2023-19","topic":"embryo","concept":"Implantation & second week","source":"EM2023","stem":"Which statement is true about the trophoblast?","options":["It differentiates into outer cytotrophoblast and inner syncytiotrophoblast","It differentiates into inner cytotrophoblast and outer syncytiotrophoblast","Structure called \"trophoblast\" does not exist during the development of human","It does not differentiate further"],"answer":1,"explanation":"الـ trophoblast بيتمايز لـ inner cytotrophoblast (خلايا واضحة الحدود) و outer syncytiotrophoblast (كتلة من غير حدود بتغزو الـ endometrium).","memoryTrick":"Syncytio بره (بيهجم) / Cyto جوه.","stemAr":"أنهي جملة صح عن الـ trophoblast؟","whyWrong":["مقلوبة: الـ cytotrophoblast جوه والـ syncytio برا.",null,"الـ trophoblast موجود فعلًا.","بيتمايز لطبقتين في الأسبوع التاني."]},{"id":"EM2023-20","topic":"embryo","concept":"Implantation & second week","source":"EM2023","stem":"Where originates the extraembryonic mesoderm?","options":["It is a result of the migration of cells from the neuroectoderm","In a site between trophoblast and embryoblast","In a site between hypoblast and epiblast","In a site between endoderm and ectoderm"],"answer":1,"explanation":"حسب الملزمة الـ extraembryonic mesoderm بيظهر في المسافة بين الـ trophoblast (cytotrophoblast) والـ embryoblast/exocoelomic membrane.","memoryTrick":"Extraembryonic = بين الـ trophoblast والـ embryo.","stemAr":"الـ extraembryonic mesoderm أصله منين؟","whyWrong":["الـ neuroectoderm بيتكون بعد كده بكتير (الأسبوع التالت).",null,"بين الـ hypoblast والـ epiblast مفيش مكان. ده الـ disc نفسه.","الـ endoderm والـ ectoderm بيتكونوا في الأسبوع التالت، بعد الـ extraembryonic mesoderm."]},{"id":"EM2023-21","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2023","stem":"Where the fertilization occurs usually?","options":["In the infundibular part of the Fallopian tube","In the ampullary part of the Fallopian tube","Horn of the uterus (cornua uteri)","Cavity of the uterus"],"answer":1,"explanation":"الـ fertilization بتحصل في الـ ampullary part of the Fallopian tube.","memoryTrick":"Ampulla.","stemAr":"الـ fertilization بيحصل عادةً فين؟","whyWrong":["الـ infundibulum بيلقط البويضة بس الـ fertilization في الـ ampulla.",null,"الـ cornua مش مكان الـ fertilization.","الـ uterine cavity مكان الـ implantation."]},{"id":"EM2023-22","topic":"embryo","concept":"Gametogenesis","source":"EM2023","stem":"What is a capacitation?","options":["Capacitation is a process in which the glycoprotein layer over the acrosome is dissolved","Capacitation is a process in which sperm penetrates zona pellucida","Capacitation is a process in which the tail of the sperm is inactivated","Capacitation is a process in which the tail of the sperm is activated"],"answer":0,"explanation":"الـ capacitation = إزالة الـ glycoprotein coat والـ seminal plasma proteins اللي فوق الـ acrosome عشان يبقى جاهز للـ acrosome reaction.","memoryTrick":"Capacitation = نشيل الغطا من فوق الـ acrosome.","stemAr":"يعني إيه capacitation؟","whyWrong":[null,"اختراق الـ zona بيحصل بعد الـ capacitation والـ acrosome reaction.","الـ tail مش بيتوقف، بالعكس الحركة بتزيد.","الـ hyperactivation بتحصل مع الـ capacitation، بس التعريف الأساسي حسب المنهج هو إزالة الـ glycoprotein coat من على الـ acrosome."]},{"id":"EM2023-23","topic":"embryo","concept":"Implantation & second week","source":"EM2023","stem":"When starts the implantation?","options":["Immediately after fertilization","3rd day after fertilization","6th day after fertilization","9th day after fertilization"],"answer":2,"explanation":"الـ implantation بتبدأ حوالي اليوم السادس بعد الـ fertilization.","memoryTrick":"Day 6 = Implantation.","stemAr":"الـ implantation بيبدأ إمتى؟","whyWrong":["بعد الـ fertilization على طول لسه في مرحلة الـ zygote جوه الـ tube.","يوم 3 الـ morula لسه في الـ tube.",null,"يوم 9 الـ implantation بيكون شغال بالفعل وقرب يكمل."]},{"id":"EM2023-24","topic":"embryo","concept":"Implantation & second week","source":"EM2023","stem":"The most common site for implantation in ectopic pregnancy is:","options":["internal os of the uterus","mesentery","ovary","uterine tube"],"answer":3,"explanation":"أشهر مكان للـ ectopic pregnancy هو الـ uterine tube (غالبًا الـ ampulla).","memoryTrick":"Ectopic = Tube غالبًا.","stemAr":"أشهر مكان للـ implantation في الـ ectopic pregnancy هو:","whyWrong":["الـ internal os = placenta previa مش ectopic.","الـ mesentery = abdominal ectopic، ونادر.","الـ ovary = ovarian ectopic، ونادر.",null]},{"id":"EM2023-25","topic":"embryo","concept":"Implantation & second week","source":"EM2023","stem":"The first week of human development is characterized by formation of the:","options":["inner cell mass","trophoblast","blastocyst","all of the above"],"answer":3,"explanation":"في الأسبوع الأول بيحصل cleavage وتكوين الـ blastocyst اللي فيه inner cell mass و trophoblast، فكلهم صح.","memoryTrick":"Week 1 = Blastocyst بكل أجزاؤه.","stemAr":"الأسبوع الأول من نمو الإنسان بيتميز بتكوين:","whyWrong":["صح بس ناقص، كلهم بيتكونوا.","صح بس ناقص.","صح بس ناقص.",null]},{"id":"EM2023-26","topic":"embryo","concept":"Gametogenesis","source":"EM2023","stem":"The ovulated mammalian oocyte is arrested at:","options":["prophase of meiosis I","metaphase of meiosis I","prophase of meiosis II","metaphase of meiosis II"],"answer":3,"explanation":"الـ oocyte وقت الـ ovulation بيكون secondary oocyte واقف في metaphase of meiosis II لحد ما يحصل fertilization.","memoryTrick":"Ovulation = Metaphase II ✌️.","stemAr":"الـ oocyte بعد الـ ovulation في الثدييات بيكون واقف (arrested) عند:","whyWrong":["الـ primary oocyte واقف في prophase I من قبل الولادة لحد البلوغ. بس وقت الـ ovulation بيكون كمّل meiosis I.","metaphase I بتعدي بسرعة قبل الـ ovulation.","مش prophase II.",null]},{"id":"EM2023-27","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2023","stem":"All but one of the following statements about cleavage are true. EXCEPT?","options":["Cleavage occurs when the embryo travels through the Fallopian tube","During cleavage, the amount of DNA inside the embryo increases","Embryo is closed inside zona pellucida during cleavage","Cleavage continues after implantation"],"answer":3,"explanation":"الغلط D: الـ cleavage بيخلص قبل الـ implantation (بيحصل والـ embryo لسه في الـ tube جوه الـ zona pellucida، والـ DNA بيزيد مع كل انقسام).","memoryTrick":"Cleavage بيخلص قبل ما يزرع.","stemAr":"كل الجمل دي عن الـ cleavage صح ما عدا واحدة. أنهي؟","whyWrong":["صح: الـ cleavage بيحصل في الـ tube.","صح: الـ D
