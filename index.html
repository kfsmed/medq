 skeleton includes one of the following:","options":["The skull","The clavicle","The hip bone .","The phalanges."],"answer":0,"explanation":"الـ skull جزء من الـ axial skeleton.","memoryTrick":"Skull = Axial.","stemAr":"الـ axial skeleton بيشمل واحدة من دول:","whyWrong":[null,"الـ clavicle appendicular.","الـ hip bone appendicular.","الـ phalanges appendicular."]},{"id":"RASHAD-03","topic":"anat","concept":"Skeleton & types of bones","source":"RASHAD","stem":"patella is :","options":["sesamoid bone","short bone","pneumatic bone","irregular bone"],"answer":0,"explanation":"الـ patella sesamoid bone.","memoryTrick":"Patella = Sesamoid.","stemAr":"الـ patella هي:","whyWrong":[null,"مش short.","مفيهاش هوا.","مش irregular."]},{"id":"RASHAD-04","topic":"anat","concept":"Bone structure, blood supply & growth","source":"RASHAD","stem":"Regarding the yellow bone marrow , one statement is true :","options":["It is present in the shaft of long bones in the adult","It is present in the vertebra, skull and ribs in the adult","It is concerned with the formation of blood cells","The sternum is suitable for bone marrow aspiration"],"answer":0,"explanation":"الـ yellow marrow (fatty) موجود في الـ shafts of long bones في الكبار، ومش بيعمل blood cells. الـ red marrow في الـ vertebrae و skull و ribs و sternum.","memoryTrick":"Yellow = Shaft = Fat.","stemAr":"بخصوص الـ yellow bone marrow، جملة واحدة صح:","whyWrong":[null,"الـ vertebra والـ skull والـ ribs فيهم red marrow.","الـ yellow marrow دهني ومش بيكوّن دم. اللي بيكوّن هو الـ red.","الجملة دي صح لوحدها بس عن الـ red marrow، مش عن الـ yellow."]},{"id":"RASHAD-05","topic":"anat","concept":"Cartilage","source":"RASHAD","stem":"Regarding the characters of the cartilage one is incorrect:","options":["it is firm in consistency","it is vascularized","it retained throughout the life in the ear","it form the temporary skeleton of the fetus"],"answer":1,"explanation":"الغلط B: الـ cartilage avascular.","memoryTrick":"Cartilage = No blood.","s  = F-E-S-M (مش Occipital).","stemAr":"كل دول pneumatic bones (فيها هوا) ما عدا:","whyWrong":["الـ ethmoid فيه sinuses.",null,"الـ sphenoid فيه sinus.","الـ maxilla فيها sinus.","الـ frontal فيه sinus."]},{"id":"RASHAD-40","topic":"anat","concept":"Movements","source":"RASHAD","stem":"Regarding terms of movements one is wrong:","options":["Flexion is forward movement except at knee joint","Adduction is movement away from the midline","Pivot joint is a uniaxial","Shoulder joint is polyaxial"],"answer":1,"explanation":"الغلط B: الـ adduction حركة ناحية الـ midline مش بعيد عنها.","memoryTrick":"Add = نضيف للنص.","stemAr":"بخصوص مصطلحات الحركة، واحدة غلط:","whyWrong":["صح حسب المنهج.",null,"صح: الـ pivot uniaxial.","صح: الـ shoulder polyaxial."]},{"id":"RASHAD-41","topic":"anat","concept":"Anatomical position, planes & terms","source":"RASHAD","stem":"Anatomical position means all the following except:","options":["Body is erect","Arms are adducted","Palms of the hands are facing backwards","Legs are close to each other","Face is directed forwards"],"answer":2,"explanation":"الغلط C: في الـ anatomical position الـ palms بتبص لقدام مش لورا.","memoryTrick":"Palms Forward.","stemAr":"الـ anatomical position معناه كل دول ما عدا:","whyWrong":["صح.","صح.",null,"صح.","صح."]},{"id":"SCALP-01","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"Regarding Scalp, all are true Except:","options":["Its wounds bleed profusely.","Its wounds gape if the aponeurosis is cut.","It has no sebaceous glands.","Its veins communicate with the intracranial venous sinuses.","It contains a muscle of facial expression."],"answer":2,"explanation":"الغلط C: الـ scalp غني جدًا بالـ sebaceous glands (عشان كده الـ sebaceous cysts شائعة فيه).","memoryTrick":"Scalp = مليان sebaceous glands.","stemAr":"بخصوص الـ scalp، كل دول صح ما عدا:","whyWrong":["صح: بتنزف جامد.","صح: بتفتح لو الـ aponeurosis اتقطع.",null,"صح: الأوردة بتتصل بالـ sinuses (emissary veins).","صح: فيه الـ occipitofrontalis (muscle of facial expression)."]},{"id":"SCALP-02","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"choose one correct statement regarding the scalp:","options":["Its wounds gape if superficial to aponeurosis.","Its blood vessels and nerves lie in the loose areolar connective tissue layer.","Its wounds do not bleed easily.","Bleeding beneath the periosteum usually extends under its whole extent.","Its infections can spread through emissary veins to cranial cavity."],"answer":4,"explanation":"الصح E: العدوى بتنتشر للـ cranial cavity عن طريق الـ emissary veins. الأوعية في الـ connective tissue layer مش الـ loose، والجروح بتنزف كتير.","memoryTrick":"Emissary veins = طريق العدوى.","stemAr":"اختاري جملة واحدة صح عن الـ scalp:","whyWrong":["بالعكس: لو الجرح فوق الـ aponeurosis مش بيفتح.","الأوعية في الـ connective tissue layer.","بالعكس: بتنزف بسهولة.","تحت الـ periosteum النزيف بيتحصر بالـ sutures.",null]},{"id":"SCALP-03","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"Regarding the scalp the following statements are true Except: -","options":["Infection from scalp wounds can spread to superior sagittal sinus.","Its blood vessels run in the loose subaponeurotic space.","Its skin, superficial fascia and aponeurosis move as one layer.","Frontal bellies of occipito-frontalis can corrugate skin of forehead.","Occipital bellies are supplied by facial nerve."],"answer":1,"explanation":"الغلط B: الأوعية الدموية في الـ dense connective tissue layer (الطبقة التانية) مش في الـ loose subaponeurotic space.","memoryTrick":"الأوعية في الـ C (Connective tissue).","stemAr":"بخصوص الـ scalp، كل الجمل دي صح ما عدا:","whyWrong":["صح.",null,"صح.","صح.","صح."]},{"id":"SCALP-04","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"The plane of movement of the scalp is between:","options":["Skin and epicranial aponeurosis.","Epicranial aponeurosis (galea aponeurotica) and pericranium.","Skin and subcutaneous","Pericranium and skull.","None or the above."],"answer":1,"explanation":"الـ scalp (أول 3 طبقات) بيتحرك كوحدة واحدة فوق الـ loose areolar tissue، يعني بين الـ aponeurosis والـ pericranium.","memoryTrick":"الحركة على الـ L (Loose).","stemAr":"مستوى حركة الـ scalp بيكون بين:","whyWrong":["الجلد والـ aponeurosis بيتحركوا مع بعض كوحدة.",null,"الجلد والـ subcutaneous لازقين.","الـ pericranium لازق في العظم.","فيه إجابة صح."]},{"id":"SCALP-05","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"Bleeding beneath the pericranium of the scalp:","options":["Spreads underneath all of the scalp.","Makes a swelling that takes the shape of the underlying bone.","Reaches to the upper eyelids.","Reaches to the back of neck.","Reaches the extradural space."],"answer":1,"explanation":"النزيف تحت الـ pericranium (cephalhematoma) بيفضل محصور في حدود العظمة لأن الـ pericranium لازق في الـ sutures، فالورم بياخد شكل العظمة.","memoryTrick":"تحت الـ pericranium = شكل العظمة.","stemAr":"النزيف تحت الـ pericranium بتاع الـ scalp:","whyWrong":["مش بينتشر، بيتحصر بالـ sutures.",null,"اللي بيوصل للجفون هو النزيف في الـ loose areolar layer (black eye).","نفس الكلام.","الـ extradural جوه الجمجمة."]},{"id":"SCALP-06","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"which of the following layers of tile scalp does infection tend to spread:","options":["Skin.","Connective tissue layer.","Aponeurotic layer","Loose areolar tissue layer.","Periosteal layer."],"answer":3,"explanation":"العدوى بتنتشر بسهولة في الـ loose areolar tissue layer.","memoryTrick":"Loose = ينتشر بسهولة.","stemAr":"العدوى بتميل تنتشر في أنهي طبقة من طبقات الـ scalp؟","whyWrong":["سطحي.","العدوى فيه بتفضل محصورة بالألياف.","طبقة وترية.",null,"بيحصر."]},{"id":"SCALP-07","topic":"anat","concept":"Scalp & face","source":"SCALP","stem":"The large blood vessels of the scalp found in the:","options":["Skin.","Subcutaneous tissue.","Epicranial aponeurosis.","Subaponeurotic tissue.","Pericranium."],"answer":1,"explanation":"الأوعية الكبيرة للـ scalp مو // ---------- sessions ----------
function newSession(mode, qids, opts) {
  const s = {
    id: uid(), mode, qids, idx: 0, answers: {}, checked: {}, conf: {}, hints: {}, timeMs: {}, optOrder: {},
    feedback: mode === "exam" ? false : (mode === "revise" ? true : !!opts.feedback),
    startedAt: now(), topics: opts.topics || [], submitted: false
  };
  qids.forEach(id => { const r = range(Bank.byId[id].options.length); s.optOrder[id] = opts.shuffleOptions ? shuffle(r) : r; });
  if (mode === "exam") { s.durationMs = opts.minutes * 60000; s.endsAt = s.startedAt + s.durationMs; }
  return s;
}
const slotOf = mode => mode === "exam" ? "active.exam" : "active.train";
const saveSession = s => { if (s && !s.submitted) Store.set(slotOf(s.mode), s); };
const getActive = slot => { const s = Store.get(slot, null); if (!s || s.submitted) return null; if (!s.qids.every(id => Bank.byId[id])) return null; return s; };
const modeName = m => t(m === "exam" ? "mode.exam" : m === "revise" ? "mode.revise" : "mode.train");

let S = null, qEnter = 0, timerInt = null, inkQ = null, inkPad = null, drawing = false, navOpen = false, warned = {};

function trackTime() {
  if (!S || !qEnter) return;
  const id = S.qids[S.idx]; const dt = Math.min(now() - qEnter, 30 * 60000);
  if (document.visibilityState === "visible" || S.mode === "exam") S.timeMs[id] = (S.timeMs[id] || 0) + dt;
  qEnter = now();
}
document.addEventListener("visibilitychange", () => {
  if (!S) return;
  if (document.visibilityState === "hidden") { trackTime(); saveSession(S); }
  else { qEnter = now(); if (S.mode === "exam") tickTimer(); }
});
window.addEventListener("pagehide", () => { if (S) { trackTime(); saveSession(S); } });

function startSession(mode, qids, opts) {
  if (!qids.length) { toast(t("s.noMatch")); return; }
  S = newSession(mode, qids, opts || {}); warned = {};
  saveSession(S); go("session");
}
function resumeSession(slot) { const s = getActive(slot); if (!s) { toast(t("s.nothingResume")); return; } S = s; warned = {}; go("session"); }
function isRevealed(id) { return S.mode !== "exam" && (S.checked[id] || (S.feedback && S.answers[id] != null)); }

function choose(orig) {
  const id = S.qids[S.idx];
  if (S.mode !== "exam" && isRevealed(id)) return;
  S.answers[id] = orig;
  if (S.feedback && S.mode !== "exam") { const q = Bank.byId[id]; S.checked[id] = true; User.record(id, orig === q.answer, S.conf[id], S.mode); announce(orig === q.answer ? t("s.announceOk") : t("s.announceNo", {a: q.options[q.answer]})); }
  saveSession(S); renderQuestion(true);
}
function checkAnswer() {
  const id = S.qids[S.idx]; if (S.answers[id] == null || S.checked[id]) return;
  S.checked[id] = true; User.record(id, S.answers[id] === Bank.byId[id].answer, S.conf[id], S.mode);
  saveSession(S); renderQuestion(true);
}
function clearAnswer() { const id = S.qids[S.idx]; if (S.mode === "exam" || !isRevealed(id)) { delete S.answers[id]; saveSession(S); renderQuestion(true); } }
function goto(i) {
  if (!S || i < 0 || i >= S.qids.length) return;
  trackTime(); setDrawing(false); S.idx = i; saveSession(S); closeNav(); renderQuestion(); scrollTopSafe();
}
function scrollTopSafe() { try { window.scrollTo({top: 0, behavior: "auto"}); } catch(e) { window.scrollTo(0, 0); } }

async function finishSession(auto) {
  if (!S) return;
  trackTime();
  if (!auto) {
    const total = S.qids.length, answered = S.qids.filter(id => S.answers[id] != null).length, flagged = S.qids.filter(id => User.isFlag(id)).length;
    const verb = S.mode === "exam" ? t("fin.submitExam") : t("fin.finishSession");
    const body = `<p>${t("fin.answered", {a: answered, n: total})}</p>` +
      (total - answered ? `<p class="notice warn">${t(S.mode === "exam" ? "fin.unansExam" : "fin.unansTrain", {n: total - answered})}</p>` : "") +
      (flagged ? `<p class="muted small">${t("fin.flagged", {n: flagged})}</p>` : "") +
      (S.mode === "exam" ? `<p class="muted small">${t("fin.noChange")}</p>` : "");
    if (!(await confirmDialog(verb + (isRTL() ? "؟" : "?"), body, verb))) return;
  }
  clearInterval(timerInt); timerInt = null;
  const items = S.qids.map(id => {
    const q = Bank.byId[id], ch = S.answers[id]; const correct = ch === q.answer;
    return {id, chosen: ch == null ? null : ch, correct, conf: S.conf[id] || null, timeMs: S.timeMs[id] || 0, hints: S.hints[id] || 0};
  });
  S.qids.forEach(id => { if (S.mode === "exam" || !S.checked[id]) { if (S.answers[id] != null || S.mode === "exam") User.record(id, S.answers[id] === Bank.byId[id].answer, S.conf[id], S.mode); } });
  const finishedAt = now();
  const elapsed = S.mode === "exam" ? Math.min(finishedAt, S.endsAt) - S.startedAt : items.reduce((a, b) => a + b.timeMs, 0);
  const attempt = {id: S.id, mode: S.mode, startedAt: S.startedAt, finishedAt, elapsedMs: elapsed, limitMs: S.durationMs || null, auto: auto || false, items};
  User.addHistory(attempt);
  S.submitted = true; Store.del(slotOf(S.mode));
  S = null; setDrawing(false);
  viewAttemptId = attempt.id; go("results");
  if (auto === "time") openDialog({title: t("time.upT"), body: `<p>${t("time.upB")}</p>`, actions: [{label: t("time.seeResults"), cls: "btn-pri"}]});
}

function tickTimer() {
  if (!S || S.mode !== "exam") return;
  const left = S.endsAt - now(); const el = $("#timer");
  if (el) { el.querySelector("b").textContent = fmtTime(left); el.classList.toggle("low", left <= 5*60000 && left > 60000); el.classList.toggle("crit", left <= 60000); }
  if (left <= 5*60000 && !warned.five && S.durationMs > 5*60000) { warned.five = true; announce(t("time.five")); toast(t("time.five")); }
  if (left <= 60000 && !warned.one) { warned.one = true; announce(t("time.one")); toast(t("time.one")); }
  if (left <= 0) { dlgStack.slice().forEach(d => d.close("dismiss")); finishSession("time"); }
}

function sourceFilter(root) {
  const src = $("#src", root) ? $("#src", root).value : "", nr = $("#norep", root);
  return q => (!src || q.source === src) && (src || !nr || !nr.checked || !q.repeatOf);

function revisionQueue(limit) {
  const p = User.progress(), flags = User.flags;
  const scored = Bank.questions.map(q => { const r = p[q.id]; let s = 0;
    if (r && r.last) { if (!r.last.ok) s += 4; if (r.last.conf === "guess") s += 2; else if (r.last.conf === "unsure") s += 1; if (r.n >= 2 && r.c / r.n < 0.5) s += 1; }
    if (flags.has(q.id)) s += 1; return {id: q.id, s}; }).filter(x => x.s > 0);
  scored.sort((a, b) => b.s - a.s || Math.random() - .5);
  return scored.slice(0, limit || 20).map(x => x.id);
}

function computeStats(a) {
  const it = a.items, total = it.length, correct = it.filter(x => x.correct).length, unans = it.filter(x => x.chosen == null).length;
  const byTopic = {}, byConcept = {};
  it.forEach(x => { const q = Bank.byId[x.id]; if (!q) return; if (a.mode !== "exam" && x.chosen == null) return;
    (byTopic[q.topic] = byTopic[q.topic] || {n: 0, c: 0}).n++; if (x.correct) byTopic[q.topic].c++;
    (byConcept[q.concept] = byConcept[q.concept] || {n: 0, c: 0, topic: q.topic}).n++; if (x.correct) byConcept[q.concept].c++; });
  return {total, correct, wrong: total - correct - unans, unans, byTopic, byConcept};
}
function weakConceptsOverall() {
  const p = User.progress(), m = {};
  Object.keys(p).forEach(id => { const q = Bank.byId[id]; if (!q) return; const r = m[q.concept] = m[q.concept] || {n: 0, c: 0}; r.n += p[id].n; r.c += p[id].c; });
  return Object.keys(m).filter(k => m[k].n >= 2 && m[k].c / m[k].n < 0.7).map(k => ({k, ...m[k]})).sort((a, b) => a.c/a.n - b.c/b.n);
}
function resultsText(a, st) {
  const lines = [t("rt.title", {mode: modeName(a.mode), date: fmtDate(a.finishedAt)}),
    a.mode === "exam" ? t("rt.scoreExam", {c: st.correct, n: st.total, p: pct(st.correct, st.total), w: st.wrong, u: st.unans}) : t("rt.scoreTrain", {c: st.correct, n: st.total - st.unans, p: pct(st.correct, st.total - st.unans), u: st.unans}),
    t("rt.time", {t: fmtDur(a.elapsedMs)}) + (a.limitMs ? t("rt.of", {t: fmtDur(a.limitMs)}) : ""), "", t("rt.byTopic")];
  Object.keys(st.byTopic).forEach(k => lines.push(`  ${Bank.topicName[k] || k}: ${st.byTopic[k].c}/${st.byTopic[k].n} (${pct(st.byTopic[k].c, st.byTopic[k].n)}%)`));
  lines.push("", t("rt.questions"));
  a.items.forEach((x, i) => { const q = Bank.byId[x.id]; if (!q) return; lines.push(`${i+1}. [${x.correct ? "✓" : x.chosen == null ? "–" : "✗"}] ${q.id} — ${t("rt.answer")}: ${q.options[q.answer]}${x.chosen != null && !x.correct ? " (" + t("rt.you") + ": " + q.options[x.chosen] + ")" : ""}`); });
  return lines.join("\n");
}

function backupData() { const d = Store.dump(); delete d.ink; delete d.customBank; delete d["__t"]; return d; }

}

}

}

}
// ---- short code (hand-copyable) ----
const B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function b32enc(u8) { let bits = 0, val = 0, out = ""; for (let i = 0; i < u8.length; i++) { val = (val << 8) | u8[i]; bits += 8; while (bits >= 5) { out += B32[(val >> (bits - 5)) & 31]; bits -= 5; } val &= (1 << bits) - 1; } if (bits > 0) out += B32[(val << (5 - bits)) & 31]; return out; }

function crc8(u8) { let c = 0; for (let i = 0; i < u8.length; i++) { c ^= u8[i]; for (let k = 0; k < 8; k++) c = (c & 0x80) ? ((c << 1) ^ 0x07) & 255 : (c << 1) & 255; } return c; }
function bankHash() { let h = 7; Bank.questions.forEach(q => { for (let i = 0; i < q.id.length; i++) h = (h * 31 + q.id.charCodeAt(i)) >>> 0; }); return h & 255; }
function pushVar(arr, n) { while (n >= 128) { arr.push((n & 127) | 128); n = Math.floor(n / 128); } arr.push(n); }
function readVar(u8, pos) { let n = 0, m = 1, b; do { if (pos.i >= u8.length) throw new Error("eof"); b = u8[pos.i++]; n += (b & 127) * m; m *= 128; } while (b & 128); return n; }

async function makeShortCode() {
  const qs = Bank.questions, idx = {}; qs.forEach((q, i) => idx[q.id] = i);
  const p = User.progress(), N = qs.length, st = new Uint8Array(Math.ceil(N / 4));
  qs.forEach((q, i) => { const r = p[q.id]; if (!r || !r.last) return; const v = !r.last.ok ? 3 : (r.last.conf === "unsure" || r.last.conf === "guess") ? 2 : 1; st[i >> 2] |= v << ((i & 3) * 2); });
  const body = [LANG === "ar" ? 1 : 0].concat(Array.from(st), sparse(Store.get("flags", []), idx), sparse(Store.get("favs", []), idx));
  let mode = 0, payload = new Uint8Array(body);
  if (typeof CompressionStream === "function") { try { const z = await pipeBytes(payload, new CompressionStream("deflate-raw")); if (z.length < payload.length) { mode = 1; payload = z; } } catch(e) {} }
  const content = new Uint8Array(3 + payload.length); content[0] = 2; content[1] = bankHash(); content[2] = mode; content.set(payload, 3);
  const all = new Uint8Array(content.length + 1); all.set(content); all[content.length] = crc8(content);
  return b32enc(all);
}
function prettyCode(c) { return (c.match(/.{1,4}/g) || []).join("-"); }
function normCode(s) { return String(s || "").toUpperCase().replace(/[\s\-_.–—]/g, "").replace(/O/g, "0").replace(/[IL]/g, "1").replace(/U/g, "V"); }
async function readShortCode(input) {
  const raw = String(input || "").trim();
  if (/^MQ1[zj]\./.test(raw.replace(/\s+/g, ""))) return {legacy: await readBackupCode(raw)};
  let c = normCode(raw); if (c.indexOf("MQ") === 0 && (c.length - 2) % 8 !== 1) c = c.slice(2);
  let all; try { all = b32dec(c); } catch(e) { throw new Error("typo"); }
  if (all.length < 5) throw new Error("typo");
  const content = all.subarray(0, all.length - 1);
  if (crc8(content) !== all[all.length - 1] || content[0] !== 2) throw new Error("typo");
  if (content[1] !== bankHash()) throw new Error("old");
  let body = content.subarray(3);
  if (content[2] === 1) body = await pipeBytes(body, new DecompressionStream("deflate-raw"));
  const N = Bank.questions.length, nst = Math.ceil(N / 4);
  if (body.length < 1 + nst) throw new Error("typo");
  const lang = body[0] === 1 ? "ar" : "en", states = [];
  for (let i = 0; i < N; i++) states.push((body[1 + (i >> 2)] >> ((i & 3) * 2)) & 3);
  const pos = {i: 1 + nst}; const flags = unsparse(body, pos), favs = unsparse(body, pos);

}
async function applyShortCode(d) {
  const qs = Bank.questions, n = d.states.filter(v => v).length;
  if (!(await confirmDialog(t("h.restT"), `<p>${t("sc.restConf", {n})}</p>`, t("sc.restOk")))) return false;
  const prog = {}, at = now();
  d.states.forEach((v, i) => { if (!v) return; const ok = v !== 3; prog[qs[i].id] = {n: 1, c: ok ? 1 : 0, last: {ok, conf: v === 2 ? "unsure" : null, at, mode: "restore"}}; });

}

        <button class="icon-btn" data-flag="${esc(q.id)}" aria-pressed="${flags.has(q.id)}" aria-label="${esc(t("b.flagQ", {id: q.id}))}">${ICON.flag}</button>
        <button class="icon-btn" data-fav="${esc(q.id)}" aria-pressed="${favs.has(q.id)}" aria-label="${esc(t("b.favQ", {id: q.id}))}">${favs.has(q.id) ? ICON.starOn : ICON.star}</button></div>
        <div dir="ltr" lang="en" class="ltr"><p style="margin:0">${hl(q.stem)}</p>
        <ul class="opts-list">${q.options.map((o, i) => `<li class="${show && i === q.answer ? "correct" : ""}">${LETTERS[i]}. ${hl(o)}${show && i === q.answer ? " ✓" : ""}</li>`).join("")}</ul></div>
        ${notes[q.id] ? `<p class="small" style="margin-top:8px"><strong>${t("b.yourNote")}</strong> <span dir="auto">${hl(notes[q.id])}</span></p>` : ""}
        ${show && q.explanation ? `<p class="small muted cx" dir="${cdir(q.explanation)}" style="margin-top:6px">${hl(q.explanation)}</p>` : ""}${show && q.memoryTrick ? `<p class="small cx" dir="${cdir(q.memoryTrick)}" style="margin-top:4px;color:var(--plum-2)">💡 ${hl(q.memoryTrick)}</p>` : ""}${show && q.note ? `<p class="small cx" dir="${cdir(q.note)}" style="margin-top:6px;color:var(--warn)">${esc(q.note)}</p>` : ""}</div>`; }).join("") + (list.length > shown.length ? `<p class="muted small" style="padding-top:12px">${t("r.andMore", {n: list.length - shown.length})}</p>` : "") : `<p class="muted">${t("b.noMatch")}</p>`;
    $$("[data-flag]").forEach(b => b.onclick = () => { User.toggleSet("flags", b.dataset.flag); draw(); });
    $$("[data-fav]").forEach(b => b.onclick = () => { User.toggleSet("favs", b.dataset.fav); draw(); });
    $("#practise").onclick = () => startSession("train", list.map(q => q.id), {feedback: User.prefs().feedback});
  };
  let tm = null; $("#q").addEventListener("input", e => { clearTimeout(tm); tm = setTimeout(() => { term = e.target.value.trim(); draw(); }, 150); });
  $("#tp").onchange = draw; $("#showans").onchange = draw; if ($("#srcb")) $("#srcb").onchange = draw;
  $$("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; $$("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); });
  draw();
  $("#bankfile").onchange = e => { const f = e.target.files && e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { let data; try { data = JSON.parse(rd.result); } catch(err) { openDialog({title: t("b.badJsonT"), body: `<p>${t("b.badJsonB")}</p>`, actions: [{label: t("common.ok"), cls: "btn-pri"}]}); return; }
      const errs = validateBank(data);
      if (errs.length) { openDialog({title: t("b.problemsT"), body: `<ul dir="auto">${errs.slice(0,12).map(x => `<li>${esc(x)}</li>`).join("")}</ul>${errs.length>12?`<p>${t("r.andMore", {n: errs.length-12})}</p>`:""}`, actions: [{label: t("common.ok"), cls: "btn-pri"}]}); return; }
      if (!Store.set("customBank", data)) { toast(t("b.tooLarge")); }
      useBank(data, "custom"); toast(t("b.loaded", {n: data.questions.length})); render(); };
    rd.onerror = () => toast(t("b.readErr")); rd.readAsText(f); };
  const rb = $("#resetbank"); if (rb) rb.onclick = async () => { Store.del("customBank"); await loadBank(); toast(t("b.restored")); render(); };
  $("#copyfmt").onclick = async () => { const data = {title: Bank.title, credit: Bank.credit || undefined, topics: Bank.topics, sources: Bank.sources, questions: Bank.questions}; toast(await copyText(JSON.stringify(data, null, 2)) ? t("b.copied") : t("r.copyNo")); };
}

// ---------- keyboard ----------
function shortcutsHelp() {
  const rows = [["1 – 5 / A – E","k.choose"],[t("k.arrows"),"k.nav"],["Enter","k.enter"],["F","k.flag"],["S","k.fav"],["H","k.hint"],["K","k.conf"],["N","k.notes"],["W","k.draw"],["P","k.pad"],["G","k.grid"],["?","k.help"]];
  openDialog({title: t("k.title"), body: `<table class="kbdtbl">${rows.map(r => `<tr><td><kbd dir="ltr">${esc(r[0])}</kbd></td><td>${t(r[1])}</td></tr>`).join("")}</table>`, actions: [{label: t("common.close"), cls: "btn-pri"}]});
}
document.addEventListener("keydown", e => {
  if (dlgStack.length) { if (e.key === "Escape") { e.preventDefault(); dlgStack[dlgStack.length-1].close("dismiss"); } return; }
  if ($(".langscreen")) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tg = e.target;
  const typing = tg && (tg.tagName === "TEXTAREA" || tg.tagName === "SELECT" || tg.isContentEditable || (tg.tagName === "INPUT" && !/^(checkbox|radio|button|submit|range|file)$/i.test(tg.type)));
  if (typing) { if (e.key === "Escape") tg.blur(); return; }
  if (!S || !$("#qpane")) { if (e.key === "?") { e.preventDefault(); shortcutsHelp(); } return; }
  const k = e.key, kl = k.toLowerCase(), id = S.qids[S.idx];
  const keyIdx = {"1":0,"2":1,"3":2,"4":3,"5":4,"6":5,"a":0,"b":1,"c":2,"d":3,"e":4}[kl];
  if (keyIdx != null) { e.preventDefault(); const b = $$(".opt")[keyIdx]; if (b && !b.disabled && !drawing) b.click(); return; }
  // arrows follow the reading direction: in Arabic (RTL) the left arrow moves forward
  const fwd = isRTL() ? "ArrowLeft" : "ArrowRight", back = isRTL() ? "ArrowRight" : "ArrowLeft";
  if (k === fwd) { e.preventDefault(); goto(S.idx + 1); }
  else if (k === back) { e.preventDefault(); goto(S.idx - 1); }
  else if (k === "Enter") { if (tg && tg.tagName === "BUTTON") return; e.preventDefault(); const cb = $("#checkbtn"); if (cb && !cb.disabled) cb.click(); else if (S.idx < S.qids.length - 1) goto(S.idx + 1); else finishSession(false); }
  else if (kl === "f") { e.preventDefault(); $("#flagbtn").click(); }
  else if (kl === "s") { e.preventDefault(); $("#favbtn").click(); }
  else if (kl === "h") { const hb = $("#hintbtn"); if (hb) { e.preventDefault(); hb.click(); } }
  else if (kl === "n") { e.preventDefault(); $("#notebtn").click(); }
  else if (kl === "w") { e.preventDefault(); setDrawing(!drawing); }
  else if (kl === "p") { e.preventDefault(); openScratchpad(id); }
  else if (kl === "g") { e.preventDefault(); navOpen ? closeNav() : openNav(); }
  else if (kl === "k") { e.preventDefault(); const seq = [undefined, "sure", "unsure", "guess"]; const nx = seq[(seq.indexOf(S.conf[id]) + 1) % seq.length]; const b = nx ? $(`[data-conf="${nx}"]`) : $(`[data-conf="${S.conf[id]}"]`); if (b) b.click(); }
  else if (k === "Escape") { if (drawing) setDrawing(false); else if (navOpen) closeNav(); }
  else if (k === "?") { e.preventDefault(); shortcutsHelp(); }
});

window.addEventListener("storage", e => {
  if (!e.key || e.key.indexOf("medq.v1.") !== 0) return;
  if (S && e.key === "medq.v1." + slotOf(S.mode)) { const fresh = getActive(slotOf(S.mode)); if (!fresh || fresh.id !== S.id) { S = null; toast(t("s.otherTab")); go("home"); } }
});

// ---------- boot ----------
(async function boot() {
 try {
  const saved = storedLang();
  LANG = saved === "ar" ? "ar" : "en";
  applyLang();
  $("#langbtn").onclick = toggleLang;
  await loadBank();
  window.__medqBooted = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist().catch(() => {}); }).catch(() => {}); } catch(e) {}
  if (!saved) { const chosen = await langScreen(); setLang(chosen, false); }
  const ex = Store.get("active.exam", null);
  if (ex && !ex.submitted && ex.endsAt && now() >= ex.endsAt && ex.qids.every(id => Bank.byId[id])) { S = ex; await finishSession("time"); return; }
  render();
 } catch (e) { if (window.__medqFail) window.__medqFail((e && (e.message || e)) || "Startup error"); else throw e; }
})();

</script>
