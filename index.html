raploid polyploidy (مضاعفات كاملة).","memoryTrick":"Aneuploidy = واحد زيادة/ناقص.","stemAr":"أنهي واحد من دول يعتبر aneuploidy؟","whyWrong":["الـ triploid زيادة set كامل = euploidy (polyploidy).",null,"الـ tetraploid زيادة sets كاملة.","الـ polyploidy مضاعفات كاملة مش chromosome واحد."]},{"id":"ES2026G1-11","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026G1","stem":"In which of the following chromosomal aberrations two copies of the same gene can be found on the same chromosome?","options":["Isochromosome","Ring chromosome","Addition","Translocation"],"answer":0,"explanation":"الـ isochromosome بيتكون لما الـ centromere ينقسم بالعرض، فالـ chromosome يبقى ذراعين متطابقين (نسختين من نفس الجينات).","memoryTrick":"Iso = Same (ذراعين متشابهين).","stemAr":"في أنهي chromosomal aberration من دول ممكن نلاقي نسختين من نفس الـ gene على نفس الـ chromosome؟","whyWrong":[null,"الـ ring chromosome بيفقد أطرافه، فبيبقى فيه نقص مش تكرار.","الـ addition مصطلح مش دقيق هنا. الإجابة المعروفة للتكرار على نفس الـ chromosome هي الـ isochromosome (ذراعين متطابقين).","الـ translocation نقل جزء لـ chromosome تاني."]},{"id":"ES2026G1-12","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2026G1","stem":"Regarding the centrioles, which of the following describes it?","options":["Appear as two dark bodies with H&E","Share in the formation of cilia","Present as two pairs in non-dividing cells","Formed by dynamic microtubules"],"answer":1,"explanation":"الـ centrioles بتشارك في تكوين الـ cilia (basal bodies). مش بتظهر في H&E، وفي الخلية الساكنة فيه pair واحد بس، ومكونة من stable microtubules.","memoryTrick":"Centriole ➜ Cilia.","stemAr":"بخصوص الـ centrioles، أنهي واحدة من دول بتوصفها؟","whyWrong":["الـ centrioles مش بتبان بالـ H&E. بتتبيّن بالـ iron hematoxylin.",null,"في الخلية الساكنة فيه pair واحد بس.","الـ centrioles من stable microtubules مش dynamic."]},{"id":"ES2026G1-13","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2026G1","stem":"What is the typical description of glycogen granules?","options":["Alpha glycogen forms rosette aggregation in the liver","Appears red with H&E stain","Can be stained with osmic acid","Beta glycogen forms rosette aggregation in the liver"],"answer":0,"explanation":"الـ alpha glycogen بيعمل rosettes في الـ liver، والـ beta particles منفردة (زي في العضلات). الـ glycogen مبيتصبغش بالـ H&E.","memoryTrick":"Alpha = Aggregated rosettes في الكبد.","stemAr":"إيه الوصف المعتاد للـ glycogen granules؟","whyWrong":[null,"الـ glycogen مش بيتصبغ أحمر بالـ H&E (بيظهر فراغات). بيبان أحمر/magenta بالـ PAS.","الـ osmic acid للـ lipids.","الـ beta glycogen بيكون مفرد، والـ alpha هو اللي بيعمل rosettes."]},{"id":"ES2026G1-14","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2026G1","stem":"Which of the following stains can demonstrate the plasma membrane?","options":["PAS","Osmic acid","Sudan II","Orcein"],"answer":0,"explanation":"الـ PAS بيصبغ الـ carbohydrates، وبالتالي بيبيّن الـ cell coat (glycocalyx) اللي على سطح الـ plasma membrane، فالـ membrane بتظهر كخط أحمر (magenta) على حدود الخلية.","memoryTrick":"PAS = Pink surface (Glycocalyx).","stemAr":"أنهي stain من دول يقدر يبيّن الـ plasma membrane؟","whyWrong":[null,"الـ osmic acid بيصبغ الـ lipids فبيبيّن الغشا في الـ EM، بس الإجابة المطلوبة PAS اللي بيبيّن الـ cell coat على سطح الغشا. وده مصدر اللبس.","الـ Sudan للـ fat droplets جوه الخلية.","الـ orcein للـ elastic fibers."]},{"id":"ES2026G1-15","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2026G1","stem":"Diffuse cytoplasmic basophilia caused by ribosome can be found in which cells?","options":["Embryonic cells","Pancreatic cells","Nerve cells","Glial cells"],"answer":0,"explanation":"الـ diffuse basophilia من free ribosomes بتكون في الخلايا اللي بتنقسم بسرعة زي الـ embryonic cells. الـ pancreatic والـ nerve cells فيهم localized basophilia.","memoryTrick":"Diffuse = Embryonic (بيكبر).","stemAr":"الـ diffuse cytoplasmic basophilia اللي سببها الـ ribosomes بنلاقيها في أنهي خلايا؟","whyWrong":[null,"الـ pancreatic cells بيكون فيها localized basophilia (basal) بسبب الـ rER.","الـ nerve cells فيها Nissl bodies (localized).","الـ glial cells مش مميزة بكده. الـ diffuse basophilia من الـ free ribosomes في الخلايا الجنينية والسريعة النمو."]},{"id":"ES2026G1-16","topic":"histo","concept":"Nucleus & chromatin","source":"ES2026G1","stem":"Regarding nuclear chromatin, what is the typical character?","options":["Extended type appears dark basophilic with LM","Condensed type appears pale basophilic with LM","Extended type contains the active genes","Euchromatin appears as coarse granules with EM"],"answer":2,"explanation":"الـ extended chromatin (euchromatin) فيه الـ active genes وبيظهر pale.","memoryTrick":"Extended = Active.","stemAr":"بخصوص الـ nuclear chromatin، إيه الصفة المعتادة؟","whyWrong":["الـ extended (eu) بيظهر فاتح مش غامق.","الـ condensed بيظهر غامق مش فاتح.",null,"الـ euchromatin fine granules، والـ coarse صفة الـ hetero."]},{"id":"EM2026G1-01","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026G1","stem":"During dissection, the brain was sectioned into anterior and posterior parts. Which anatomical plane is used for the examination?","options":["coronal plane","parasagittal plane","midsagittal plane","horizontal plane"],"answer":0,"explanation":"تقسيم المخ لـ anterior و posterior = coronal plane.","memoryTrick":"Coronal.","stemAr":"أثناء الـ dissection، المخ اتقطع لجزء anterior وجزء posterior. أنهي anatomical plane اتستخدم؟","whyWrong":[null,"الـ parasagittal يمين وشمال مش متساويين.","الـ midsagittal يمين وشمال متساويين.","الـ horizontal فوق وتحت."]},{"id":"EM2026G1-02","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2026G1","stem":"Which of the following arteries can supply the bone marrow?","options":["epiphyseal","periosteal","metaphyseal","nutrient"],"answer":3,"repeatOf":"EM2025A-06","explanation":"الـ nutrient artery بتغذي الـ bone marrow.","memoryTrick":"Nutrient = Marrow.","stemAr":"أنهي artery من دول ممكن تغذي الـ bone marrow؟","whyWrong":["الـ epiphyseal للأطراف.","الـ periosteal للـ outer compact.","الـ metaphyseal للـ metaphysis.",null]},{"id":"EM2026G1-03","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026G1","stem":"In which anatomical location are the deep plantar vessels found?","options":["in the palm of the hand away from the skin","in the sole of the foot near the skin","in the palm of the hand near the skin","in the sole of the foot away from the skin"],"answer":3,"explanation":"Deep = بعيد عن السطح، و Plantar = sole of the foot.","memoryTrick":"Plantar = Sole / Deep = بعيد عن الجلد.","stemAr":"الـ deep plantar vessels موجودة في أنهي مكان تشريحي؟","whyWrong":["plantar للقدم مش اليد.","deep يعني بعيد عن الجلد.","palm غلط، و near the skin = superficial.",null]},{"id":"EM2026G1-04","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2026G1","stem":"The amount of compact bone is increased in the middle of shaft of long bone. Why?","options":["To increase the length","As it looks like a sponge to sustain the pressure","As it makes bone narrow in the middle","As it provides strength for weight"],"answer":3,"explanation":"الـ compact bone بيزيد في نص الـ shaft عشان يدي قوة وصلابة لتحمل الوزن والـ bending stress.","memoryTrick":"النص = أقوى نقطة (Compact).","stemAr":"كمية الـ compact bone بتزيد في نص الـ shaft بتاع الـ long bone. ليه؟","whyWrong":["الطول بيزيد من الـ growth plate.","شكل الإسفنجة صفة الـ spongy bone.","مش بيخلي العظمة رفيعة. الهدف القوة.",null]},{"id":"EM2026G1-05","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026G1","stem":"To put the person in anatomical position, what is the correct position of the hand and the foot?","options":["The palm and the toes face anteriorly","The palm faces posterior and the toes face anterior","The palm faces anterior and the toes face posterior","The palm faces anterior and the toes face anterior"],"answer":3,"explanation":"في الـ anatomical position الـ palms والأصابع (toes) بيبصوا لقدام.","memoryTrick":"كله لقدام.","stemAr":"عشان نحط الشخص في الـ anatomical position، إيه الوضع الصح لليد والقدم؟","whyWrong":["صح بس ناقص التحديد. والإجابة D أدق في وصف اليد والقدم مع بعض.","الـ palm لقدام مش لورا.","الـ toes لقدام مش لورا.",null]},{"id":"EM2026G1-06","topic":"anat","concept":"Movements","source":"EM2026G1","stem":"Which term describes the movement of the distal end of the limb in a circle of 360 degree?","options":["circumduction","adduction","rotation","flexion"],"answer":0,"explanation":"الـ circumduction = الطرف البعيد بيرسم دايرة (مزيج flexion و abduction و extension و adduction).","memoryTrick":"Circum = دايرة ⭕.","stemAr":"أنهي مصطلح بيوصف حركة الطرف البعيد للـ limb في دايرة 360 درجة؟","whyWrong":[null,"الـ adduction ناحية الـ midline.","الـ rotation حوالين الـ long axis، مش دايرة بالطرف.","الـ flexion ثني."]},{"id":"EM2026G1-07","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G1","stem":"A researcher examines an embryo at day 9 post-fertilization and notes fluid accumulation between the epiblast and trophoblast. The cavity will develop into which structure?","options":["Chorionic cavity","Amniotic cavity","Yolk sac","Blastocyst cavity"],"answer":1,"explanation":"السائل اللي بيتجمع بين الـ epiblast والـ cytotrophoblast يوم 8–9 هو بداية الـ amniotic cavity.","memoryTrick":"فوق الـ epiblast = Amnion.","stemAr":"باحث فحص embryo في اليوم 9 بعد الـ fertilization ولاحظ تجمع سائل بين الـ epiblast والـ trophoblast. الـ cavity دي هتتحول لأنهي structure؟","whyWrong":["الـ chorionic cavity بتتكون جوه الـ extraembryonic mesoderm، مش بين الـ epiblast والـ trophoblast.",null,"الـ yolk sac ناحية الـ hypoblast.","الـ blastocyst cavity موجودة من الأسبوع الأول وبتتحول لـ yolk sac."]},{"id":"EM2026G1-08","topic":"embryo","concept":"Gametogenesis","source":"EM2026G1","stem":"A 25-year-old male presents with infertility. Semen analysis shows azoospermia. Testicular biopsy reveals the presence of Sertoli cells but absence of germ cells. Which stage of gametogenesis is most likely affected?","options":["Meiosis I in primary spermatocytes","Mitosis of spermatogonia","Spermiogenesis","Migration of primordial germ cells"],"answer":3,"explanation":"وجود Sertoli cells بس من غير أي germ cells (Sertoli-cell-only) معناه إن الـ primordial germ cells مهاجرتش للـ gonad أصلًا.","memoryTrick":"مفيش germ cells خالص = مشكلة في الهجرة.","stemAr":"راجل عنده 25 سنة جاي بعدم خصوبة. تحليل السائل المنوي بيبيّن azoospermia، والـ testicular biopsy بيبيّن وجود Sertoli cells وغياب الـ germ cells. أنهي مرحلة من الـ gametogenesis غالبًا متأثرة؟","whyWrong":["لو المشكلة في الـ meiosis I كان هيبقى فيه spermatogonia و primary spermatocytes.","لو المشكلة في الـ mitosis كان هيبقى فيه spermatogonia قليلة.","لو المشكلة في الـ spermiogenesis كان هيبقى فيه spermatids. الغياب التام للـ germ cells معناه إنها ما وصلتش.",null]},{"id":"EM2026G1-09","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G1","stem":"On day 5 post-fertilization, an embryo develops a fluid-filled cavity and differentiates into two cell types. Which gives rise to embryo proper?","options":["Syncytiotrophoblast","Cytotrophoblast","Trophoblast","Inner cell mass"],"answer":3,"explanation":"الـ inner cell mass (embryoblast) بيدي الـ embryo proper، والـ trophoblast بيدي الـ placenta.","memoryTrick":"Inner = الجنين / Outer = المشيمة.","stemAr":"في اليوم 5 بعد الـ fertilization، الـ embryo بيكوّن cavity مليانة سائل وبيتمايز لنوعين خلايا. أنهي واحد فيهم بيدي الـ embryo proper؟","whyWrong":["الـ syncytio بيتكون بعدين من الـ trophoblast.","الـ cyto نفس الكلام.","الـ trophoblast بيدي المشيمة مش الجنين.",null]},{"id":"EM2026G1-10","topic":"embryo","concept":"Implantation & second week","source":"EM2026G1","stem":"Implantation is complete by day 10-12 and the conceptus is fully embedded in the endometrium. Which layer of maternal trophoblast is directly responsible for eroding maternal capillaries to access blood?","options":["Syncytiotrophoblast","Cytotrophoblast","Epiblast","Extraembryonic mesoderm"],"answer":0,"explanation":"الـ syncytiotrophoblast هو اللي بيآكل (erodes) الـ maternal capillaries ويفتحها على الـ lacunae.","memoryTrick":"Syncytio = المهاجم.","stemAr":"الـ implantation بيكمل في اليوم 10–12 والـ conceptus بيبقى مدفون بالكامل في الـ endometrium. أنهي طبقة من الـ trophoblast مسئولة مباشرةً عن تآكل الـ maternal capillaries للوصول للدم؟","whyWrong":[null,"الـ cytotrophoblast الطبقة الداخلية، مش بيآكل.","الـ epiblast جزء من الـ disc.","الـ extraembryonic mesoderm بيبطن الـ chorion."]},{"id":"EM2026G1-11","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G1","stem":"After fertilization, the zygote begins dividing in a process known as cleavage. 16 cell stage is?","options":["Blastocyst","Zygote","Morula","Embryoblast"],"answer":2,"explanation":"الـ morula = كورة من حوالي 16 blastomere (اليوم 3–4).","memoryTrick":"Morula = توتة (16).","stemAr":"بعد الـ fertilization، الـ zygote بيبدأ ينقسم في عملية اسمها cleavage. مرحلة الـ 16 خلية اسمها إيه؟","whyWrong":["الـ blastocyst بعد ما يتكون الـ cavity.","الـ zygote خلية واحدة.",null,"الـ embryoblast جزء جوه الـ blastocyst."]},{"id":"EM2026G1-12","topic":"histo","concept":"Cell cycle & division","source":"EM2026G1","stem":"Regarding metaphase I in second meiotic division, which of the following occurs?","options":["Crossing over occurs at this stage","The d-chromosome splits at the centromere into two chromatids","The 23-bivalent d-chromosomes become aligned in the equatorial plane","The 23 d-chromosomes are aligned at the equatorial plate"],"answer":3,"explanation":"في metaphase II الـ 23 d-chromosomes (كل واحد اتنين chromatids) بيترصّوا على الـ equatorial plate. الـ bivalents والـ crossing over في meiosis I.","memoryTrick":"Meiosis II = 23 single rows (مش bivalents).","stemAr":"بخصوص الـ metaphase في الـ second meiotic division، أنهي واحدة من دول بتحصل؟","whyWrong":["الـ crossing over في الـ prophase I.","انقسام الـ centromere في الـ anaphase II.","الـ bivalents في الـ meiosis I مش II.",null]},{"id":"EM2026G1-13","topic":"embryo","concept":"Gametogenesis","source":"EM2026G1","stem":"A 30-year-old woman undergoes in vitro fertilization (IVF). Eggs are retrieved after hormonal stimulation and are found to be arrested in metaphase II. What triggers the completion of meiosis II in the oocyte?","options":["Sperm penetration","LH surge","Estrogen peak","FSH rise"],"answer":0,"explanation":"دخول الـ sperm (penetration) هو اللي بيكمّل الـ meiosis II في الـ oocyte.","memoryTrick":"Sperm يدخل ➜ Meiosis II تكمل.","stemAr":"ست عندها 30 سنة بتعمل حقن مجهري (IVF). البويضات اتسحبت بعد تنشيط هرموني ولقوها واقفة في metaphase II. إيه اللي بيخلّي الـ meiosis II تكمل في الـ oocyte؟","whyWrong":[null,"الـ LH surge بيكمّل الـ meiosis I ويعمل ovulation.","الـ estrogen peak بيحفّز الـ LH surge.","الـ FSH للنمو."]},{"id":"EM2026G1-14","topic":"embryo","concept":"Gametogenesis","source":"EM2026G1","stem":"During fertilization a sperm secretes enzymes to penetrate the oocyte's outer layer. Which structure prevents polyspermy?","options":["Zona pellucida","Cell membrane","Endometrium","Corona radiata"],"answer":0,"explanation":"الـ zona pellucida بعد الـ zona reaction بتتغير فتمنع دخول sperm تاني (polyspermy).","memoryTrick":"Zona = البوابة اللي بتقفل.","stemAr":"أثناء الـ fertilization الـ sperm بيفرز إنزيمات عشان يخترق الطبقة الخارجية للـ oocyte. أنهي structure بيمنع الـ polyspermy؟","whyWrong":[null,"الـ cell membrane بيندمج مع الـ sperm، بس اللي بيقفل الباب هو الـ zona reaction.","الـ endometrium ملوش علاقة بالـ fertilization.","الـ corona radiata بتتشال وقت الاختراق ومش بتمنع الـ polyspermy."]},{"id":"EM2026G1-15","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G1","stem":"In an embryo at day 12 post-fertilization lacunar spaces appear within syncytiotrophoblast filled with maternal blood. What is this process critical for?","options":["Neurulation process","Gastrulation process","Uteroplacental circulation","Cleavage process"],"answer":2,"explanation":"الـ lacunae المليانة maternal blood هي بداية الـ uteroplacental circulation.","memoryTrick":"Lacunae = دورة الأم.","stemAr":"في embryo عمره 12 يوم بعد الـ fertilization، ظهرت lacunar spaces جوه الـ syncytiotrophoblast مليانة دم الأم. العملية دي مهمة لإيه؟","whyWrong":["الـ neurulation في الأسبوع التالت والرابع.","الـ gastrulation في الأسبوع التالت.",null,"الـ cleavage في الأسبوع الأول."]},{"id":"EM2026G1-16","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2026G1","stem":"Which of the following describes Barr body?","options":["The Y chromosome in male","The X chromosome in males","The XX chromosomes in females","The inactive X chromosome in females"],"answer":3,"explanation":"الـ Barr body = الـ X chromosome الـ inactive (condensed) في الإناث.","memoryTrick":"Barr = X نايم 😴.","stemAr":"أنهي واحدة من دول بتوصف الـ Barr body؟","whyWrong":["الـ Y مش هو الـ Barr body.","الذكر عنده X واحد شغال، فمفيش Barr body.","واحد بس من الـ X هو اللي inactive.",null]},{"id":"EM2026G1-17","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026G1","stem":"Which organelle is responsible for maintenance of cell health?","options":["Lysosome","Golgi apparatus","Rough endoplasmic reticulum","Smooth endoplasmic reticulum"],"answer":0,"repeatOf":"ES2025-01","explanation":"الـ lysosome بيحافظ على صحة الخلية بإنه يهضم الـ worn-out organelles (autophagy) والمواد الغريبة.","memoryTrick":"Lysosome = عامل النظافة 🧹.","stemAr":"أنهي organelle مسئول عن الحفاظ على صحة الخلية؟","whyWrong":[null,"الـ Golgi للتغليف.","الـ rER للبروتين.","الـ sER للـ lipids. الـ lysosome بيشيل الـ organelles القديمة والفضلات (autophagy)."]},{"id":"EM2026G1-18","topic":"histo","concept":"Cell cycle & division","source":"EM2026G1","stem":"Which of the following cells are continuously turnover cells?","options":["Heart muscles","Blood cells","Nerve cells","Liver cells"],"answer":1,"explanation":"الـ blood cells (و الـ epidermis) continuously renewing (labile) cells. الـ liver stable، والـ nerve والـ heart muscle permanent.","memoryTrick":"Blood = بيتجدد طول الوقت.","stemAr":"أنهي خلايا من دول بتتجدد باستمرار (continuously turnover)؟","whyWrong":["الـ heart muscle permanent.",null,"الـ nerve permanent.","الـ liver stable، بيتجدد عند الإصابة بس."]},{"id":"EM2026G1-19","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026G1","stem":"Which of the following describes Multivesicular bodies?","options":["Primary lysosomes","Autophagic vacuoles","Formed as a result of digestion of solid material","Formed as a result of digestion of fluid material"],"answer":3,"explanation":"الـ multivesicular bodies نتيجة هضم fluid material (pinocytic vesicles).","memoryTrick":"Multivesicular = سوائل.","stemAr":"أنهي واحدة من دول بتوصف الـ multivesicular bodies؟","whyWrong":["الـ primary lysosome لسه ما اندمجش.","الـ autophagic vacuole بيهضم organelles الخلية.","الصلب بيكوّن phagolysosome.",null]},{"id":"EM2026G1-20","topic":"histo","concept":"Cell membrane & transport","source":"EM2026G1","stem":"What is concerned with Glycocalyx?","options":["The protein component of the cell membrane","The hydrophobic end of lipid","The hydrophilic end of lipid","The carbohydrate component of the cell membrane"],"answer":3,"explanation":"الـ glycocalyx = الـ carbohydrate component.","memoryTrick":"Glyco = سكر.","stemAr":"إيه اللي يخص الـ glycocalyx؟","whyWrong":["البروتين جزء من الغشا.","ديل الـ phospholipid.","راس الـ phospholipid.",null]},{"id":"EM2026G1-21","topic":"histo","concept":"Nucleus & chromatin","source":"EM2026G1","stem":"Which of points related to Heterochromatin?","options":["Special type of stain","Present in the nuclei of metabolically active cells","Type of cell inclusions","Present in the nuclei of metabolically inactive cells"],"answer":3,"explanation":"الـ heterochromatin في الخلايا الخاملة.","memoryTrick":"Hetero = Inactive.","stemAr":"أنهي نقطة من دول مرتبطة بالـ heterochromatin؟","whyWrong":["مش صبغة.","النشطة فيها euchromatin.","مش inclusion.",null]},{"id":"EM2026G1-22","topic":"histo","concept":"Cell cycle & division","source":"EM2026G1","stem":"Regarding the Gap 1 phase of interphase, which of the following describes it?","options":["Each cell contains 92 s chromosomes","The nucleus of the daughter cell contains 46s chromosomes","The more specialized the cell, the shorter the G1-phase","Each cell contains 46 d chromosome"],"answer":1,"explanation":"في الـ G1 الـ daughter cell فيها 46 single (s) chromosomes (قبل الـ DNA replication).","memoryTrick":"G1 = 46 s / G2 = 46 d.","stemAr":"بخصوص الـ Gap 1 phase في الـ interphase، أنهي واحدة من دول بتوصفها؟","whyWrong":["92 ده عدد الـ chromatids بعد الـ S phase.",null,"بالعكس: كل ما الخلية تتخصص الـ G1 بتطول (أو بتقف في G0).","46 d بعد الـ S phase (في الـ G2)."]},{"id":"EM2026G1-23","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2026G1","stem":"What is the typical feature of submetacentric chromosome?","options":["The centromere is terminal","The centromere is at the center of the chromosome","The centromere is midway between the center and upper end","The centromere is very close to upper end"],"answer":2,"explanation":"الـ submetacentric: الـ centromere في المسافة بين النص والطرف.","memoryTrick":"Sub = بعيد شوية عن النص.","stemAr":"إيه الصفة المميزة للـ submetacentric chromosome؟","whyWrong":["terminal = telocentric.","center = metacentric.",null,"قريب جدًا من الطرف = acrocentric."]},{"id":"EM2026G1-24","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026G1","stem":"What is true about smooth endoplasmic reticulum?","options":["Areas of localized basophilia indicate its presence","Is rarely found in skeletal muscle cells","Is present in cells where drug detoxification is taking place","Sometimes has ribosomes attached to its membrane"],"answer":2,"explanation":"الـ sER موجود في الخلايا اللي بتعمل drug detoxification.","memoryTrick":"Smooth = Detox.","stemAr":"إيه الصح عن الـ smooth endoplasmic reticulum؟","whyWrong":["الـ basophilia من الـ rER.","كتير في الـ skeletal muscle.",null,"لو عليه ribosomes يبقى rER."]},{"id":"EM2026G1-25","topic":"histo","concept":"Nucleus & chromatin","source":"EM2026G1","stem":"What about the nuclear pore?","options":["Allows for communication between the nuclei & cytoplasm","Is a transient structure","Is at regular intervals","Is bridged by a unit membrane"],"answer":0,"explanation":"الـ nuclear pore بيسمح بالتواصل بين النواة والـ cytoplasm.","memoryTrick":"Pore = باب.","stemAr":"إيه الصح عن الـ nuclear pore؟","whyWrong":[null,"مش مؤقت.","مش منتظم.","مقفول بـ diaphragm مش unit membrane."]},{"id":"EM2026G1-26","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026G1","stem":"What is the function of rough endoplasmic reticulum?","options":["Cytoplasmic protein necessary for the cell's own existence","Carbohydrate synthesis","Lipid synthesis","Protein that will be secreted by the cell"],"answer":3,"explanation":"الـ rER بيصنع البروتين اللي هيتفرز.","memoryTrick":"Rough = Secreted.","stemAr":"إيه وظيفة الـ rough endoplasmic reticulum؟","whyWrong":["بروتينات الخلية نفسها من الـ free ribosomes.","الـ carbohydrates في الـ Golgi.","الـ lipids في الـ sER.",null]},{"id":"EM2026G1-27","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2026G1","stem":"Isochromosome occurs mostly in which type of chromosomes?","options":["Acrocentric","Metacentric","Telocentric","Submetacentric"],"answer":0,"explanation":"حسب الملزمة الإجابة acrocentric (زي i(21q) لما الـ centromere ينقسم بالعرض في chromosome ذراعه القصير صغير جدًا).","memoryTrick":"Iso = ذراعين متطابقين.","stemAr":"الـ isochromosome بيحصل غالبًا في أنهي نوع من الـ chromosomes؟","whyWrong":[null,"الـ metacentric الذراعين متساويين أصلًا.","الـ telocentric مش موجود في الإنسان.","الـ submetacentric مش الأشهر حسب المنهج."]},{"id":"EM2026P-01","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026P","stem":"To put the person in anatomical position, what is the correct position of the arm?","options":["The palm faces anterior and the arm is adducted","The palm faces anterior and the arm is abducted","The palm faces posterior and the arm is adducted","The palm faces posterior and the arm is abducted"],"answer":0,"explanation":"في الـ anatomical position الـ arms جنب الجسم (adducted) والـ palms لقدام.","memoryTrick":"الإيد جنبك والكف لقدام.","stemAr":"عشان نحط الشخص في الـ anatomical position، إيه الوضع الصح للـ arm؟","whyWrong":[null,"الـ arm adducted مش abducted.","الـ palm لقدام.","الاتنين غلط."]},{"id":"EM2026P-02","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026P","stem":"During dissection, the brain was sectioned into equal right and left parts. Which plane is used for this division?","options":["Coronal plane","Horizontal plane","Midsagittal plane","Parasagittal plane"],"answer":2,"explanation":"التقسيم لنصين يمين وشمال متساويين = midsagittal (median) plane.","memoryTrick":"Mid = النص بالظبط.","stemAr":"أثناء الـ dissection، المخ اتقطع لجزئين يمين وشمال متساويين. أنهي plane اتستخدم للتقسيم ده؟","whyWrong":["الـ coronal قدام وورا.","الـ horizontal فوق وتحت.",null,"الـ parasagittal يمين وشمال مش متساويين."]},{"id":"EM2026P-03","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026P","stem":"In which anatomical location are the deep palmar vessels found?","options":["In the palm of the hand near the skin","In the sole of the foot near the skin","In the sole of the foot deep","In the palm of the hand away from the skin"],"answer":3,"explanation":"Deep = بعيد عن الجلد، و Palmar = palm of the hand.","memoryTrick":"Palmar = Palm / Deep = جوه.","stemAr":"الـ deep palmar vessels موجودة في أنهي مكان تشريحي؟","whyWrong":["near the skin = superficial.","sole غلط، و near the skin غلط.","sole للقدم مش اليد (palmar).",null]},{"id":"EM2026P-04","topic":"anat","concept":"Movements","source":"EM2026P","stem":"Which term describes the movement of the distal end of the limb in a circle?","options":["Adduction","Circumduction","Flexion","Rotation"],"answer":1,"explanation":"الـ circumduction = حركة الطرف البعيد في دايرة.","memoryTrick":"Circum = دايرة.","stemAr":"أنهي مصطلح بيوصف حركة الطرف البعيد للـ limb في دايرة؟","whyWrong":["الـ adduction ناحية الـ midline.",null,"الـ flexion ثني.","الـ rotation حوالين الـ axis."]},{"id":"EM2026P-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2026P","stem":"The amount of compact bone is increased in the middle of shaft of long bones because:","options":["As it contains bone marrow in its meshes","As it looks like a sponge to sustain the pressure","As it provides strength for weight bearing","To increase its length"],"answer":2,"explanation":"الـ compact bone في نص الـ shaft بيدي قوة لتحمل الوزن.","memoryTrick":"Compact = Strength.","stemAr":"كمية الـ compact bone بتزيد في نص الـ shaft بتاع الـ long bones عشان:","whyWrong":["الـ marrow في الـ meshes صفة الـ spongy.","شكل الإسفنجة صفة الـ spongy.",null,"الطول من الـ growth plate."]},{"id":"EM2026P-06","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2026P","stem":"Which of the following arteries can supply the outer compact bone?","options":["Epiphyseal","Metaphyseal","Nutrient","Periosteal"],"answer":3,"explanation":"الـ periosteal artery بتغذي الـ outer compact bone.","memoryTrick":"Periosteal = Outer.","stemAr":"أنهي artery من دول ممكن تغذي الـ outer compact bone؟","whyWrong":["الـ epiphyseal للأطراف.","الـ metaphyseal للـ metaphysis.","الـ nutrient للجزء الداخلي.",null]},{"id":"EM2026P-07","topic":"anat","concept":"Skin","source":"EM2026P","stem":"Which of the following squeezes the sebaceous gland to extrude its secretion?","options":["Deep fascia","Arrector pili muscle","Hair follicle","Hair root"],"answer":1,"explanation":"الـ arrector pili muscle لما ينقبض بيعصر الـ sebaceous gland فيطلع الـ sebum (وكمان بيوقف الشعر).","memoryTrick":"Arrector pili = بيوقف الشعر ويعصر الغدة.","stemAr":"أنهي واحد من دول بيعصر الـ sebaceous gland عشان يطلّع إفرازها؟","whyWrong":["الـ deep fascia تحت الجلد خالص ومش بتعصر الغدة.",null,"الـ hair follicle هو اللي الغدة بتصب فيه.","الـ hair root جوه الـ follicle."]},{"id":"EM2026P-08","topic":"anat","concept":"Skin","source":"EM2026P","stem":"Which of the following layers contains Langer's lines?","options":["Epidermis","Dermis","Superficial fascia","Deep fascia"],"answer":1,"explanation":"الـ Langer's lines (cleavage lines) موجودة في الـ dermis حسب اتجاه الـ collagen fibers، والجراحين بيعملوا الـ incision موازي ليها.","memoryTrick":"Langer = Dermis (Collagen direction).","stemAr":"أنهي طبقة من دول فيها الـ Langer's lines؟","whyWrong":["الـ epidermis مفيهاش collagen.",null,"الـ superficial fascia تحت الـ dermis.","الـ deep fascia أعمق."]},{"id":"EM2026P-09","topic":"embryo","concept":"Implantation & second week","source":"EM2026P","stem":"A patient shows abnormal development of the yolk sac during the second week. Which embryonic layer directly contributes to the formation of the primary yolk sac?","options":["Epiblast","Hypoblast","Cytotrophoblast","Extraembryonic mesoderm"],"answer":1,"explanation":"الـ hypoblast هو اللي بيكوّن الـ primary yolk sac (عن طريق الـ exocoelomic membrane).","memoryTrick":"Hypo ➜ Yolk.","stemAr":"مريض عنده نمو غير طبيعي للـ yolk sac في الأسبوع التاني. أنهي embryonic layer بتشارك مباشرةً في تكوين الـ primary yolk sac؟","whyWrong":["الـ epiblast بيكوّن الـ amnion.",null,"الـ cytotrophoblast من الـ trophoblast.","الـ extraembryonic mesoderm بيتكون بعد الـ primary yolk sac."]},{"id":"EM2026P-10","topic":"embryo","concept":"Implantation & second week","source":"EM2026P","stem":"Histological examination of an implanted blastocyst shows persistence of the exocoelomic (Heuser's) membrane with inadequate hypoblast proliferation. Which structure will be affected?","options":["Amniotic cavity","Yolk sac","Chorionic cavity","Connecting stalk"],"answer":1,"explanation":"قلة تكاثر الـ hypoblast هتأثر على تكوين الـ secondary yolk sac.","memoryTrick":"Hypoblast مشكلة = Yolk sac مشكلة.","stemAr":"الفحص الـ histological لـ blastocyst مزروع بيبيّن استمرار الـ exocoelomic (Heuser's) membrane مع تكاثر ضعيف للـ hypoblast. أنهي structure هيتأثر؟","whyWrong":["الـ amniotic من الـ epiblast.",null,"الـ chorionic من الـ extraembryonic mesoderm.","الـ connecting stalk من الـ extraembryonic mesoderm."]},{"id":"EM2026P-11","topic":"embryo","concept":"Implantation & second week","source":"EM2026P","stem":"Which event marks the transition from week 1 to week 2 of human development?","options":["Appearance of the primitive streak","Completion of implantation","Formation of trilaminar disc","Closure of neural tube"],"answer":1,"explanation":"الانتقال من الأسبوع الأول للتاني بيتميز باكتمال الـ implantation (الـ primitive streak والـ trilaminar disc في الأسبوع التالت).","memoryTrick":"Week 2 = Implantation complete.","stemAr":"أنهي حدث بيعلن الانتقال من الأسبوع الأول للأسبوع التاني في نمو الإنسان؟","whyWrong":["الـ primitive streak في الأسبوع التالت.",null,"الـ trilaminar في الأسبوع التالت.","الـ neural tube في الأسبوع الرابع."]},{"id":"EM2026P-12","topic":"embryo","concept":"Implantation & second week","source":"EM2026P","stem":"A teratogenic insult specifically damages the extraembryonic mesoderm during the second week. Which of the following structures is most likely to be malformed?","options":["Neural tube","Chorionic cavity","Epiblast","Primitive node"],"answer":1,"explanation":"الـ chorionic cavity بتتكون جوه الـ extraembryonic mesoderm، فتلفه هيأثر عليها.","memoryTrick":"Extraembryonic mesoderm ➜ Chorionic cavity.","stemAr":"مادة مشوِّهة (teratogenic insult) أذت الـ extraembryonic mesoderm تحديدًا في الأسبوع التاني. أنهي structure من دول غالبًا هيتكون بشكل غلط؟","whyWrong":["الـ neural tube من الـ ectoderm.",null,"الـ epiblast مش من الـ extraembryonic mesoderm.","الـ primitive node في الأسبوع التالت من الـ epiblast."]},{"id":"EM2026P-13","topic":"embryo","concept":"Female cycles & hormones","source":"EM2026P","stem":"A 28-year-old woman has regular 28-day cycles. On day 21, serum progesterone is markedly elevated. Which ovarian structure is primarily responsible for this hormone level?","options":["Primary follicle","Secondary follicle","Corpus luteum","Corpus albicans"],"answer":2,"explanation":"يوم 21 (منتصف الـ luteal phase) الـ progesterone بيكون في أعلى مستوى ومصدره الـ corpus luteum.","memoryTrick":"Day 21 = Corpus luteum peak.","stemAr":"ست عندها 28 سنة ودورتها منتظمة كل 28 يوم. في اليوم 21 الـ serum progesterone عالي جدًا. أنهي structure في المبيض مسئول أساسًا عن المستوى ده؟","whyWrong":["الـ primary follicle مش بيفرز progesterone.","الـ secondary follicle بيفرز estrogen.",null,"الـ corpus albicans ندبة خاملة."]},{"id":"EM2026P-14","topic":"embryo","concept":"Female cycles & hormones","source":"EM2026P","stem":"A woman undergoing infertility evaluation shows failure of the LH surge despite adequate estrogen levels. Which phase of the reproductive cycle is most directly affected?","options":["Menstrual phase","Follicular phase","Ovulation","Luteal phase"],"answer":2,"explanation":"الـ LH surge هو اللي بيعمل الـ ovulation، فغيابه بيمنع الـ ovulation.","memoryTrick":"No LH surge = No ovulation.","stemAr":"ست بتعمل تقييم لعدم الخصوبة، ظهر عندها فشل في الـ LH surge رغم إن الـ estrogen كفاية. أنهي مرحلة من الـ reproductive cycle متأثرة بشكل مباشر؟","whyWrong":["الـ menstrual مش معتمد على الـ LH surge.","الـ follicular بيكمل بالـ FSH والـ estrogen.",null,"الـ luteal بعد الـ ovulation، فهو متأثر بشكل غير مباشر."]},{"id":"EM2026P-15","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026P","stem":"A genetic defect prevents cortical granule release after fertilization. Which consequence is most likely?","options":["Failure of sperm capacitation","Polyspermy","Failure of the acrosome reaction","Inability of the zygote to implant"],"answer":1,"explanation":"الـ cortical granules هي اللي بتعمل الـ zona reaction، فلو مخرجتش يحصل polyspermy.","memoryTrick":"Cortical = Anti-polyspermy.","stemAr":"خلل جيني بيمنع خروج الـ cortical granules بعد الـ fertilization. إيه النتيجة الأكثر احتمالًا؟","whyWrong":["الـ capacitation في الـ sperm قبل كده.",null,"الـ acrosome reaction في الـ sperm.","الـ implantation مرحلة بعدين ومش ليها علاقة بالـ cortical granules مباشرةً."]},{"id":"EM2026P-16","topic":"embryo","concept":"Implantation & second week","source":"EM2026P","stem":"A mutation in the embryo prevents the differentiation and formation of the syncytiotrophoblast. Which of the following stages will be directly blocked?","options":["Fertilization","Cleavage","Implantation","Pronuclear formation"],"answer":2,"explanation":"الـ syncytiotrophoblast هو اللي بيغزو الـ endometrium، فغيابه يوقف الـ implantation.","memoryTrick":"No syncytio = No implantation.","stemAr":"طفرة في الـ embryo بتمنع تمايز وتكوين الـ syncytiotrophoblast. أنهي مرحلة من دول هتتوقف مباشرةً؟","whyWrong":["الـ fertilization قبل الـ syncytio.","الـ cleavage قبله.",null,"الـ pronuclei وقت الـ fertilization."]},{"id":"EM2026P-17","topic":"embryo","concept":"Gametogenesis","source":"EM2026P","stem":"Which of the following is a condition characterized by absent sperms?","options":["Teratozoospermia","Asthenozoospermia","Oligospermia","Azoospermia"],"answer":3,"explanation":"الـ azoospermia = غياب الـ sperm.","memoryTrick":"A-zoo = صفر.","stemAr":"أنهي حالة من دول بتتميز بغياب الـ sperms؟","whyWrong":["الـ teratozoospermia = شكل غلط.","الـ asthenozoospermia = حركة ضعيفة.","الـ oligospermia = عدد قليل.",null]},{"id":"EM2026P-18","topic":"embryo","concept":"Female cycles & hormones","source":"EM2026P","stem":"Endometrial biopsy taken on day 23 of the cycle (28 days cycle) shows straight glands. This finding suggests deficiency of which hormone?","options":["Estrogen","Progesterone","LH","FSH"],"answer":1,"explanation":"يوم 23 المفروض الغدد تكون tortuous و coiled (secretory phase تحت الـ progesterone). لو straight يبقى فيه نقص progesterone.","memoryTrick":"Straight glands = مفيش Progesterone.","stemAr":"endometrial biopsy اتاخدت يوم 23 من الدورة (دورة 28 يوم) وبيّنت straight glands (غدد مستقيمة). ده بيشير لنقص أنهي hormone؟","whyWrong":["الـ estrogen بيعمل proliferation، والغدد straight في الـ proliferative بشكل طبيعي.",null,"الـ LH مش بيأثر مباشرةً على شكل الغدد.","الـ FSH كمان."]},{"id":"EM2026P-19","topic":"embryo","concept":"Gametogenesis","source":"EM2026P","stem":"Which of the following processes involves morphological transformation of spermatids into mature sperm?","options":["Spermatogenesis","Spermiogenesis","Spermiation","Sperm capacitation"],"answer":1,"explanation":"الـ spermiogenesis = تحوّل الـ spermatid لـ sperm ناضج. الـ spermiation = انفصاله في الـ lumen.","memoryTrick":"Spermio = تغيير شكل.","stemAr":"أنهي عملية من دول فيها تحوّل شكلي للـ spermatids لـ sperm ناضج؟","whyWrong":["الـ spermatogenesis العملية كلها.",null,"الـ spermiation خروج الـ sperm للـ lumen.","الـ capacitation في الـ female tract."]},{"id":"EM2026P-20","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2026P","stem":"The bivalent chromosomes separate from one another at the chiasma in which stage of meiosis?","options":["Anaphase 2","Metaphase 1","Metaphase 2","Anaphase 1"],"answer":3,"explanation":"في anaphase I الـ homologous chromosomes (bivalents) بيتفصلوا عن بعض عند الـ chiasmata ويروحوا للأقطاب.","memoryTrick":"Anaphase I = الأزواج تتفصل.","stemAr":"الـ bivalent chromosomes بتنفصل عن بعض عند الـ chiasma في أنهي مرحلة من الـ meiosis؟","whyWrong":["anaphase 2 بينفصل فيها الـ chromatids.","metaphase 1 الـ bivalents بتترص.","metaphase 2 الـ chromosomes بتترص.",null]},{"id":"EM2026P-21","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2026P","stem":"Which of the following represents a structural chromosomal aberration?","options":["Trisomy","Monosomy","Turner's syndrome","Deletion"],"answer":3,"explanation":"الـ deletion structural aberration. الـ trisomy والـ monosomy والـ Turner numerical.","memoryTrick":"Structural = حتة اتكسرت/اتشالت.","stemAr":"أنهي واحد من دول بيمثل structural chromosomal aberration؟","whyWrong":["الـ trisomy numerical.","الـ monosomy numerical.","الـ Turner numerical (45,X).",null]},{"id":"EM2026P-22","topic":"histo","concept":"Cell cycle & division","source":"EM2026P","stem":"Apoptosis, which of the following describes it?","options":["It is a physiological condition","The cells add their organelles and nucleus","Occurs normally at the end of life span of the cell","May result from exposure to toxins and anemia"],"answer":0,"explanation":"الـ apoptosis = programmed cell death فسيولوجي (بيحصل طبيعي ومنظم). الـ necrosis هو اللي بيكون مرضي (toxins و ischemia).","memoryTrick":"Apoptosis = موت مبرمج طبيعي 🍂.","stemAr":"الـ apoptosis، أنهي واحدة من دول بتوصفه؟","whyWrong":[null,"الخلية بتنكمش وبتتكسر لـ apoptotic bodies، مش بتزود organelles.","الجملة دي قريبة من الصح علميًا (الـ apoptosis بيشيل الخلايا القديمة)، بس الملزمة اختارت A كالوصف الأساسي إنه physiological.","الـ toxins والـ anemia (ischemia) بيعملوا necrosis."]},{"id":"EM2026P-23","topic":"histo","concept":"Cell cycle & division","source":"EM2026P","stem":"Which of the following represents a potentially renewable cell?","options":["Nerve cell","Liver cell","Cardiac muscle cell","Blood cell"],"answer":1,"explanation":"الـ liver cells stable (potentially renewable): مبتنقسمش عادة بس تقدر تتجدد بعد الـ injury. الـ blood cells labile، والـ nerve والـ cardiac permanent.","memoryTrick":"Liver = نايم بس يصحى لو احتاجته.","stemAr":"أنهي واحدة من دول بتمثل خلية potentially renewable (ممكن تتجدد)؟","whyWrong":["الـ nerve cell permanent.",null,"الـ cardiac muscle permanent.","الـ blood cells labile (بتتجدد باستمرار)، مش potentially renewable. الفرق: الـ stable بتتجدد بس لما تحتاج."]},{"id":"EM2026P-24","topic":"histo","concept":"Cell cycle & division","source":"EM2026P","stem":"What is the nuclear description of the interphase in cell cycle?","options":["It lasts for a short period","The daughter cell contains 92 chromosomes in the G1 phase","The changes are visible with the microscope","The daughter cell contains 92 chromosomes in the G0 phase"],"answer":2,"explanation":"حسب الملزمة الإجابة C. ملاحظة: الـ interphase أطول مرحلة، والـ chromosomes مش بتظهر كـ chromosomes منفصلة فيها، بس التغيرات النشطة (النواة كبيرة وفاتحة) ممكن تتشاف.","memoryTrick":"Interphase = أطول مرحلة.","stemAr":"إيه وصف النواة في الـ interphase في الـ cell cycle؟","whyWrong":["الـ interphase أطول مرحلة مش أقصرها.","في الـ G1 الخلية فيها 46 مش 92.",null,"الـ G0 خلية ساكنة فيها 46."]},{"id":"EM2026P-25","topic":"histo","concept":"Cell cycle & division","source":"EM2026P","stem":"Which of the following occurs during the prophase of mitosis?","options":["Disappearance of nuclear membrane","The chromosomes are arranged in the equatorial plate","The chromosomes split longitudinally at the centromere","The nucleolus reappears"],"answer":0,"explanation":"في الـ prophase الـ nuclear membrane والـ nucleolus بيختفوا والـ chromosomes بتتكثف.","memoryTrick":"Prophase = النواة تختفي.","stemAr":"أنهي واحدة من دول بتحصل في الـ prophase بتاعة الـ mitosis؟","whyWrong":[null,"الترص على الـ equatorial plate في الـ metaphase.","انقسام الـ centromere في الـ anaphase.","رجوع الـ nucleolus في الـ telophase."]},{"id":"EM2026P-26","topic":"histo","concept":"Nucleus & chromatin","source":"EM2026P","stem":"What is the nuclear envelope?","options":["A single membrane","A double membrane with pores","Without pores","Continuous with the Golgi apparatus"],"answer":1,"explanation":"الـ nuclear envelope double membrane فيها pores.","memoryTrick":"Double + Pores.","stemAr":"إيه هو الـ nuclear envelope؟","whyWrong":["غشائين مش واحد.",null,"فيه pores.","متصل بالـ rER مش الـ Golgi."]},{"id":"EM2026P-27","topic":"histo","concept":"Cell membrane & transport","source":"EM2026P","stem":"The cell coat (glycocalyx) is formed of which of the following?","options":["Integral protein","Peripheral proteins","Glycosaminoglycans","Glycoproteins and glycolipids"],"answer":3,"explanation":"الـ glycocalyx مكون من الـ carbohydrate chains بتاعة glycoproteins و glycolipids.","memoryTrick":"Glyco-proteins + Glyco-lipids.","stemAr":"الـ cell coat (glycocalyx) مكوّن من أنهي واحد من دول؟","whyWrong":["الـ integral protein جزء من الغشا.","الـ peripheral proteins على سطح الغشا، بس الـ coat نفسه carbohydrate chains.","الـ GAGs مكون أساسي في الـ extracellular matrix، مش الـ cell coat حسب المنهج.",null]},{"id":"EM2026P-28","topic":"histo","concept":"Nucleus & chromatin","source":"EM2026P","stem":"Euchromatin is characterized by which of the following?","options":["Dark staining and coiled DNA","Light staining and uncoiled DNA","Being transcriptionally inactive","Located only at the nuclear periphery"],"answer":1,"explanation":"الـ euchromatin فاتح و الـ DNA فيه uncoiled ونشط transcription.","memoryTrick":"Eu = Light & Active.","stemAr":"الـ euchromatin بيتميز بأنهي واحدة من دول؟","whyWrong":["ده وصف الـ heterochromatin.",null,"الـ euchromatin active.","الـ periphery صفة الـ heterochromatin."]},{"id":"EM2026P-29","topic":"histo","concept":"Nucleus & chromatin","source":"EM2026P","stem":"The nucleolus is involved in which of the following?","options":["DNA replication","rRNA synthesis and ribosomal subunit assembly","Protein degradation","Lipid metabolism"],"answer":1,"explanation":"الـ nucleolus مسئول عن تصنيع الـ rRNA وتجميع الـ ribosomal subunits.","memoryTrick":"Nucleolus = Ribosome factory.","stemAr":"الـ nucleolus له دور في أنهي واحدة من دول؟","whyWrong":["الـ DNA replication في النواة كلها في الـ S phase.",null,"تكسير البروتين في الـ lysosomes والـ proteasomes.","الـ lipid metabolism في الـ sER."]},{"id":"EM2026P-30","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026P","stem":"Detoxification of drugs in liver cells is the function of which organelle?","options":["rER","SER","Golgi apparatus","Lysosome"],"answer":1,"explanation":"الـ sER في خلايا الكبد مسئول عن الـ drug detoxification.","memoryTrick":"Detox = Smooth.","stemAr":"الـ detoxification بتاع الأدوية في خلايا الكبد وظيفة أنهي organelle؟","whyWrong":["الـ rER للبروتين.",null,"الـ Golgi للتغليف.","الـ lysosome للهضم."]},{"id":"EM2026P-31","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2026P","stem":"Which of the following represents a special stain for mitochondria?","options":["PAS stain","Janus green","Sudan black","Hematoxylin"],"answer":1,"explanation":"الـ Janus green B supravital stain خاص بالـ mitochondria.","memoryTrick":"Janus Green = Mitochondria 💚.","stemAr":"أنهي واحد من دول special stain للـ mitochondria؟","whyWrong":["الـ PAS للـ glycogen والـ carbohydrates.",null,"الـ Sudan black للـ fat.","الـ hematoxylin صبغة عامة للنواة."]},{"id":"EM2026P-32","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2026P","stem":"Type of intermediate filaments found in the epithelium:","options":["Cytokeratin","Vimentin","Neuro filaments","Desmin"],"answer":0,"explanation":"الـ cytokeratin هو الـ intermediate filament بتاع الـ epithelium. Vimentin للـ mesenchymal، Desmin للعضلات، Neurofilaments للأعصاب.","memoryTrick":"Keratin = Epithelium.","stemAr":"نوع الـ intermediate filaments الموجود في الـ epithelium:","whyWrong":[null,"الـ vimentin في الـ mesenchymal cells (زي الـ fibroblasts).","الـ neurofilaments في الأعصاب.","الـ desmin في العضلات."]},{"id":"EM2026P-33","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2026P","stem":"Which of the following statements is incorrect?","options":["Microtubules are involved in ciliary movement and intracellular transport.","The cis (forming) face of Golgi apparatus is where secretory granules are formed.","The microtubules of the centrioles and in the basal body of cilia have a 9x3 arrangement.","Ribosomes, made of rRNA and protein, are the site of protein synthesis."],"answer":1,"repeatOf":"EM2023-11","explanation":"الجملة الغلط B: الـ secretory granules بتطلع من الـ trans (maturing) face مش الـ cis face. الـ cis هي اللي بتستقبل من الـ rER.","memoryTrick":"Cis = داخل (من rER) / Trans = خارج (إفراز).","stemAr":"أنهي جملة من دول غلط؟","whyWrong":["دي جملة صح: الـ microtubules بتحرك الـ cilia وبتنقل جوه الخلية. والسؤال عن الغلط.",null,"صح: الـ centrioles والـ basal body ترتيبهم 9×3.","صح: الـ ribosomes مكونة من rRNA وبروتين. الغلط B، لأن الـ secretory granules بتتكون عند الـ trans (maturing) face مش الـ cis."]},{"id":"ES2026P-01","topic":"anat","concept":"Scalp & face","source":"ES2026P","stem":"The occipital belly of occipitofrontalis is supplied by which of the following?","options":["Greater occipital nerve","Posterior auricular branch of facial nerve","Supratrochlear nerve","Temporal branch of facial nerve"],"answer":1,"explanation":"الـ occipital belly ➜ posterior auricular branch of facial.","memoryTrick":"Occipital = Posterior auricular.","stemAr":"الـ occipital belly بتاع الـ occipitofrontalis بيتغذى عصبيًا من أنهي واحد من دول؟","whyWrong":["الـ greater occipital sensory.",null,"الـ supratrochlear sensory.","الـ temporal branch للـ frontal belly."]},{"id":"ES2026P-02","topic":"anat","concept":"Scalp & face","source":"ES2026P","stem":"Which of the following is the dangerous area of the scalp?","options":["Subaponeurotic space","Connective tissue layer","Aponeurotic layer","Periosteal layer"],"answer":0,"explanation":"الـ subaponeurotic space هي الـ dangerous area.","memoryTrick":"تحت الـ aponeurosis = خطر.","stemAr":"أنهي واحدة من دول هي الـ dangerous area في الـ scalp؟","whyWrong":[null,"الـ connective tissue فيها الأوعية.","الـ aponeurosis نفسها طبقة وترية، والخطر تحتها.","تحت الـ periosteum العدوى بتتحصر."]},{"id":"ES2026P-03","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2026P","stem":"Which of the following bones are ossified by membranous ossification?","options":["Vault of the skull","Humerus","Femur","Radius"],"answer":0,"explanation":"الـ vault of the skull بيتعظم بـ membranous ossification.","memoryTrick":"Vault = Membrane.","stemAr":"أنهي عظام من دول بتتعظم بالـ membranous ossification؟","whyWrong":[null,"الـ humerus endochondral.","الـ femur endochondral.","الـ radius endochondral."]},{"id":"ES2026P-04","topic":"anat","concept":"Movements","source":"ES2026P","stem":"In which movement does the palm face posterior?","options":["Flexion","Supination","Pronation","Protraction"],"answer":2,"explanation":"في الـ pronation الـ palm بتبص لورا.","memoryTrick":"Pronation = Posterior.","stemAr":"في أنهي حركة الـ palm بتبص لورا (posterior)؟","whyWrong":["الـ flexion مش بيحدد اتجاه الـ palm.","الـ supination بترجّع الـ palm لقدام.",null,"الـ protraction حركة لقدام (للكتف أو الفك)."]},{"id":"ES2026P-05","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026P","stem":"As regarding to Sex chromosome abnormalities, monosomy means:","options":["Klinefelter's syndrome","Super female syndrome","Turner's syndrome","Down's syndrome"],"answer":2,"explanation":"الـ monosomy في الـ sex chromosomes = Turner (45,X). Klinefelter و super female (XXX) زيادة، و Down autosomal.","memoryTrick":"Mono = واحد ➜ Turner.","stemAr":"بخصوص عيوب الـ sex chromosomes، الـ monosomy معناها:","whyWrong":["الـ Klinefelter زيادة (47,XXY).","الـ super female زيادة (47,XXX).",null,"الـ Down autosomal trisomy."]},{"id":"ES2026P-06","topic":"histo","concept":"Cell cycle & division","source":"ES2026P","stem":"In a patient with a genetic defect in tubulin, which of the following cellular structures would be most directly affected?","options":["Formation of the nuclear envelope","Assembly of the mitotic spindle","Organization of microfilaments","Synthesis of ribosomal RNA"],"answer":1,"explanation":"الـ tubulin هو بروتين الـ microtubules، فعيبه هيأثر على الـ mitotic spindle.","memoryTrick":"Tubulin ➜ Microtubules ➜ Spindle.","stemAr":"مريض عنده خلل جيني في الـ tubulin، أنهي structure في الخلية من دول هيتأثر بشكل مباشر؟","whyWrong":["الـ nuclear envelope أغشية مش tubulin.",null,"الـ microfilaments من الـ actin.","الـ rRNA من الـ nucleolus."]},{"id":"ES2026P-07","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2026P","stem":"Lipofuscin pigment accumulation in neurons is a sign of:","options":["Active phagocytosis","Aging","Melanin overproduction","Glycogen storage"],"answer":1,"explanation":"الـ lipofuscin (wear and tear pigment) بيتراكم مع السن في الخلايا المعمرة زي الـ neurons والـ cardiac muscle.","memoryTrick":"Lipofuscin = صبغة الشيخوخة 👴.","stemAr":"تراكم صبغة الـ lipofuscin في الـ neurons علامة على:","whyWrong":["الـ phagocytosis النشطة بتزود الـ lysosomes، بس الـ lipofuscin علامة التراكم مع الوقت.",null,"الـ melanin صبغة تانية خالص.","الـ glycogen مش صبغة."]},{"id":"ES2026P-08","topic":"histo","concept":"Nucleus & chromatin","source":"ES2026P","stem":"The perinuclear space is continuous with which of the following?","options":["Golgi cisternae","Rough endoplasmic reticulum","Mitochondrial intermembrane space","Lysosomal lumen"],"answer":1,"explanation":"الـ outer nuclear membrane متصلة بالـ rER، فالـ perinuclear space متصلة بتجويف الـ rER.","memoryTrick":"Nuclear envelope = امتداد الـ rER.","stemAr":"الـ perinuclear space متصلة بأنهي واحد من دول؟","whyWrong":["الـ Golgi مش متصل بالـ nuclear envelope.",null,"الـ mitochondria ليها أغشيتها المستقلة.","الـ lysosome مقفول."]},{"id":"ES2026P-09","topic":"histo","concept":"Nucleus & chromatin","source":"ES2026P","stem":"Which of the following is true regarding heterochromatin?","options":["It is transcriptionally active","It is predominant in protein-synthesizing cells","It is concentrated at the nuclear periphery","It stains lightly with basic dyes"],"answer":2,"explanation":"الـ heterochromatin متجمع على الأطراف (peripheral) لازق في الـ nuclear envelope، وغامق وغير نشط.","memoryTrick":"Hetero = على الأطراف وغامق.","stemAr":"أنهي واحدة من دول صح بخصوص الـ heterochromatin؟","whyWrong":["الـ heterochromatin inactive.","الخلايا اللي بتصنع بروتين فيها euchromatin.",null,"الـ heterochromatin بيتصبغ غامق."]},{"id":"ES2026P-10","topic":"histo","concept":"Cell cycle & division","source":"ES2026P","stem":"The cleavage furrow develops at which of the following stages of mitosis?","options":["Anaphase","Telophase","Prophase","Metaphase"],"answer":1,"explanation":"الـ cleavage furrow بيبدأ آخر الـ anaphase ويكمل في الـ telophase (cytokinesis).","memoryTrick":"Telophase = الخلية تتقسم لاتنين.","stemAr":"الـ cleavage furrow بيتكون في أنهي مرحلة من مراحل الـ mitosis؟","whyWrong":["الـ furrow بيبدأ آخر الـ anaphase، بس بيتكون ويكمل في الـ telophase. وده سبب اللبس.",null,"الـ prophase بدري.","الـ metaphase الترص في النص."]},{"id":"ES2026P-11","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026P","stem":"What is the position of centromere in submetacentric chromosomes?","options":["At the center of the chromosome","Midway between the centre and upper end","Very close to upper end","Terminal"],"answer":1,"explanation":"في الـ submetacentric الـ centromere في المسافة بين النص والطرف، فبيبقى فيه short arm و long arm.","memoryTrick":"Sub = نص ونص بعيد شوية.","stemAr":"مكان الـ centromere في الـ submetacentric chromosomes فين؟","whyWrong":["center = metacentric.",null,"قريب جدًا من الطرف = acrocentric.","terminal = telocentric."]},{"id":"ES2026P-12","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026P","stem":"In which of the following chromosomal aberrations, the chromosome divides transversely at the centromeres instead of longitudinally during anaphase of mitosis?","options":["Inversion","Isochromosomes","Ring Chromosome","Reciprocal translocation"],"answer":1,"explanation":"الـ isochromosome بيحصل لما الـ centromere ينقسم بالعرض (transversely) بدل الطول، فيطلع chromosome بذراعين متطابقين.","memoryTrick":"Iso = انقسام بالعرض.","stemAr":"في أنهي chromosomal aberration من دول، الـ chromosome بينقسم بالعرض (transversely) عند الـ centromere بدل ما ينقسم بالطول أثناء الـ anaphase بتاعة الـ mitosis؟","whyWrong":["الـ inversion كسرين ولف الحتة 180°.",null,"الـ ring الطرفين بيتشالوا ويلتحموا.","الـ translocation تبادل بين chromosomes."]},{"id":"ES2026P-13","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2026P","stem":"The membrane of cytoplasmic vesicles can be added to the cell membrane in which of the following processes?","options":["Phagocytosis","Endocytosis","Pinocytosis","Exocytosis"],"answer":3,"explanation":"في الـ exocytosis الـ vesicle بتندمج مع الـ cell membrane فغشاها بيتضاف للـ cell membrane. في الـ endocytosis العكس (الغشا بيتسحب لجوه).","memoryTrick":"Exo = الحويصلة تلزق في الغشا وتزوده.","stemAr":"غشا الـ cytoplasmic vesicles ممكن يتضاف للـ cell membrane في أنهي عملية من دول؟","whyWrong":["الـ phagocytosis بتسحب جزء من الغشا لجوه، فالغشا بيقل.","الـ endocytosis نفس الكلام.","الـ pinocytosis نفس الكلام.",null]},{"id":"ES2026P-14","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2026P","stem":"Which of the following describes the histological structure of Golgi apparatus?","options":["Produces cytoplasmic basophilia with H&E","Appears as a network of brown granules with silver stain","Appears as a basophilic area around the nucleus in plasma cell","The Cis face represents the mature surface"],"answer":1,"explanation":"الـ Golgi بالـ silver stain بيظهر شبكة brown/black. في H&E بيظهر negative image (مش basophilic)، والـ trans face هي الـ mature.","memoryTrick":"Golgi + Silver = Brown network.","stemAr":"أنهي واحدة من دول بتوصف التركيب الـ histological للـ Golgi apparatus؟","whyWrong":["الـ Golgi بيدي negative image مش basophilia.",null,"في الـ plasma cell بيبان فاتح مش basophilic.","الـ cis هو الـ immature، والـ mature هو الـ trans."]},{"id":"ES2026G2-01","topic":"anat","concept":"Movements","source":"ES2026G2","stem":"Movement of the shoulder inferior is termed which of the following?","options":["Protraction","Elevation","Depression","Retraction"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"تحريك الكتف لتحت اسمه depression.","memoryTrick":"Depression = لتحت ⬇️.","stemAr":"حركة الكتف لتحت اسمها إيه؟","whyWrong":["الـ protraction لقدام.","الـ elevation لفوق.",null,"الـ retraction لورا."]},{"id":"ES2026G2-02","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2026G2","stem":"During the X-ray examination of a child, the bones appeared incomplete. The physician explained that the bones are still in the process of growing. Which of the following structures is responsible for increase the thickness of the bone?","options":["Periosteum","Endosteum","Epiphyseal plate (growth plate)","Articular cartilage"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ periosteum مسئول عن زيادة تخن (thickness) العظمة بالـ appositional growth.","memoryTrick":"Thickness = Periosteum / Length = Plate.","stemAr":"في أشعة X لطفل، العظام ظهرت مش مكتملة، والدكتور شرح إن العظام لسه بتنمو. أنهي structure من دول مسئول عن زيادة تخن (thickness) العظمة؟","whyWrong":[null,"الـ endosteum بيبطن الـ cavity، ودوره في التخن أقل من الـ periosteum.","الـ growth plate للطول.","الـ articular cartilage للمفصل."]},{"id":"ES2026G2-03","topic":"anat","concept":"Scalp & face","source":"ES2026G2","stem":"In surgical procedures or trauma, which layer of the scalp is referred to as the danger area?","options":["Skin of the scalp","Connective tissue layer (dense subcutaneous tissue)","Loose areolar tissue layer","Pericranium"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ loose areolar tissue layer هي الـ danger area.","memoryTrick":"L = Lethal.","stemAr":"في العمليات الجراحية أو الإصابات، أنهي طبقة من الـ scalp بيتقال عليها الـ danger area؟","whyWrong":["سطحي.","فيه أوعية بس مش الخطر.",null,"بيحصر العدوى."]},{"id":"ES2026G2-04","topic":"embryo","concept":"Implantation & second week","source":"ES2026G2","stem":"An embryo shows failure of formation of primary yolk sac cavity. Which layer of the bilaminar disc is primarily affected?","options":["Hypoblast","Epiblast","Cytotrophoblast","Syncytiotrophoblast"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ primary yolk sac بيتكون من الـ hypoblast.","memoryTrick":"Hypo ➜ Yolk.","stemAr":"embryo فيه فشل في تكوين الـ primary yolk sac cavity. أنهي طبقة من الـ bilaminar disc متأثرة أساسًا؟","whyWrong":[null,"الـ epiblast للـ amnion.","مش من الـ disc.","مش من الـ disc."]},{"id":"ES2026G2-05","topic":"embryo","concept":"Implantation & second week","source":"ES2026G2","stem":"A placenta later shows placenta previa. The abnormality most likely originated from implantation of the blastocyst in which of the followings?","options":["Fundus of uterus","Posterior uterine wall","Lower uterine segment","Myometrium"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ placenta previa = implantation في الـ lower uterine segment.","memoryTrick":"Previa = تحت.","stemAr":"مشيمة ظهر فيها بعد كده placenta previa. العيب ده غالبًا جاي من إن الـ blastocyst زرع فين؟","whyWrong":["الـ fundus طبيعي.","الـ posterior wall طبيعي.",null,"الـ myometrium = increta مش previa."]},{"id":"ES2026G2-06","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026G2","stem":"A 15-year-old girl presents with Down syndrome. What is Her karyotype?","options":["46,XX","46,XY","45,X","47,XX"],"answer":3,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"Down syndrome في بنت = 47,XX,+21 (47 chromosome).","memoryTrick":"Down = 47.","stemAr":"بنت عندها 15 سنة عندها Down syndrome. إيه الـ karyotype بتاعها؟","whyWrong":["46,XX طبيعية.","46,XY ولد طبيعي.","45,X = Turner.",null]},{"id":"ES2026G2-07","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026G2","stem":"Which of the following is considered as aneuploidy?","options":["Triploid","Trisomy","Tetraploid","Polyploidy"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"ES2026G1-10","explanation":"الـ aneuploidy = زيادة أو نقص chromosome واحد أو أكتر (زي trisomy أو monosomy). الـ triploid والـ tetraploid polyploidy (مضاعفات كاملة).","memoryTrick":"Aneuploidy = واحد زيادة/ناقص.","stemAr":"أنهي واحد من دول يعتبر aneuploidy؟","whyWrong":["الـ triploid زيادة set كامل = euploidy (polyploidy).",null,"الـ tetraploid زيادة sets كاملة.","الـ polyploidy مضاعفات كاملة مش chromosome واحد."]},{"id":"ES2026G2-08","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2026G2","stem":"Which of the following describes the centrioles?","options":["Appear as two dark bodies with H&E","Share in the formation of cilia","Present as two pairs in non-dividing cells","Formed by dynamic microtubules"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ centrioles بتشارك في تكوين الـ cilia. مش بتظهر بالـ H&E، وفيه pair واحد بس في الخلية الساكنة، ومكونة من stable microtubules.","memoryTrick":"Centriole ➜ Cilia.","stemAr":"أنهي واحدة من دول بتوصف الـ centrioles؟","whyWrong":["مش بتبان بالـ H&E.",null,"pair واحد في الخلية الساكنة.","stable مش dynamic."]},{"id":"ES2026G2-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2026G2","stem":"Which of the following matching with rER ?","options":["Form proteins secreted by the cells","Form proteins used within the cytosol","Linked together by tRNA forming polysomes","Bind to the outer surface of sER"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ rER بيصنع البروتين اللي هيتفرز. الـ polysomes بيربطها الـ mRNA مش الـ tRNA.","memoryTrick":"Rough = Secreted.","stemAr":"أنهي واحدة من دول بتتوافق مع الـ rER؟","whyWrong":[null,"بروتين الـ cytosol من الـ free ribosomes.","الـ mRNA هو اللي بيربط الـ polysomes.","الـ ribosomes مش بتلزق في الـ sER."]},{"id":"ES2026G2-10","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2026G2","stem":"Which one of the following stains demonstrates lipid in the liver cells?","options":["Sudan III","PAS","Silver","trypan blue"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"ES2025A-08","explanation":"الـ Sudan III بيصبغ الـ lipids (برتقالي/أحمر). الـ PAS للـ glycogen.","memoryTrick":"Sudan = Fat / PAS = Glycogen.","stemAr":"أنهي stain من دول بيبيّن الـ lipid في خلايا الكبد؟","whyWrong":[null,"الـ PAS للـ glycogen.","الـ silver للـ Golgi.","الـ trypan blue vital stain للـ macrophages."]},{"id":"ES2026G2-11","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2026G2","stem":"Diffuse cytoplasmic basophilia caused by ribosome can be found in which cells?","options":["Embryonic cells","Pancreatic cells","Nerve cells","Glial cells"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"ES2026G1-15","explanation":"الـ diffuse basophilia من free ribosomes بتكون في الخلايا اللي بتنقسم بسرعة زي الـ embryonic cells. الـ pancreatic والـ nerve cells فيهم localized basophilia.","memoryTrick":"Diffuse = Embryonic (بيكبر).","stemAr":"الـ diffuse cytoplasmic basophilia اللي سببها الـ ribosomes بنلاقيها في أنهي خلايا؟","whyWrong":[null,"الـ pancreatic cells بيكون فيها localized basophilia (basal) بسبب الـ rER.","الـ nerve cells فيها Nissl bodies (localized).","الـ glial cells مش مميزة بكده. الـ diffuse basophilia من الـ free ribosomes في الخلايا الجنينية والسريعة النمو."]},{"id":"ES2026G2-12","topic":"histo","concept":"Cell membrane & transport","source":"ES2026G2","stem":"What is the term for the process by which the cells transport solids?","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":3,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"ES2025A-02","explanation":"الـ phagocytosis = ابتلاع solids.","memoryTrick":"Phago = أكل.","stemAr":"إيه اسم العملية اللي الخلايا بتنقل بيها المواد الصلبة (solids)؟","whyWrong":["الـ endocytosis عام.","الـ exocytosis إخراج.","الـ pinocytosis للسوائل.",null]},{"id":"ES2026G2-13","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2026G2","stem":"What is the origin of secretory vesicles of Golgi apparatus?","options":["Smooth endoplasmic reticulum","Rough endoplasmic reticulum","The trans face of Golgi apparatus","The cell membrane"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"ES2025A-09","explanation":"الـ secretory vesicles بتطلع من الـ trans face of Golgi.","memoryTrick":"Trans = Exit.","stemAr":"إيه أصل الـ secretory vesicles بتاعة الـ Golgi apparatus؟","whyWrong":["الـ sER مش أصل الـ secretory vesicles.","الـ RER أصل الـ transfer vesicles (اللي رايحة للـ Golgi)، مش الـ secretory. وده لبس شائع.",null,"الـ cell membrane مكان خروجها مش أصلها."]},{"id":"EM2026G2-01","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026G2","stem":"A 40-year-old man is examined after a road traffic accident. The physician asks him to stand in the standard anatomical position. Which of the following correctly describes the orientation of the body?","options":["Head faces posterior","Eyes look forward and palms face anterior","Arms are crossed over the chest","Toes point laterally"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"في الـ anatomical position العينين لقدام والـ palms لقدام.","memoryTrick":"كله لقدام.","stemAr":"راجل عنده 40 سنة بيتكشف عليه بعد حادثة عربية، والدكتور طلب منه يقف في الـ standard anatomical position. أنهي واحدة من دول بتوصف اتجاه الجسم صح؟","whyWrong":["الراس لقدام.",null,"الإيدين جنب الجسم مش متربعين.","الصوابع لقدام."]},{"id":"EM2026G2-02","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026G2","stem":"During dissection, the brain was sectioned into un equal right and left parts. Which anatomical plane is used for this division?\"","options":["midsagittal plane","parasagittal plane","coronal plane","horizontal plane"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"التقسيم لجزئين يمين وشمال مش متساويين = parasagittal plane.","memoryTrick":"Para = جنب النص (مش متساوي).","stemAr":"أثناء الـ dissection، المخ اتقطع لجزئين يمين وشمال مش متساويين. أنهي anatomical plane اتستخدم للتقسيم ده؟","whyWrong":["الـ midsagittal متساويين.",null,"الـ coronal قدام وورا.","الـ horizontal فوق وتحت."]},{"id":"EM2026G2-03","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026G2","stem":"In which anatomical location are the superficial palmar vessels found?","options":["In the palm of the hand near the skin","In the sole of the foot away from the skin","In the sole of the foot near the skin","In the palm of the hand away from the skin"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"Superficial palmar = في الـ palm قريب من الجلد.","memoryTrick":"Superficial = قريب من الجلد.","stemAr":"الـ superficial palmar vessels موجودة في أنهي مكان تشريحي؟","whyWrong":[null,"sole والعمق الاتنين غلط.","sole للقدم.","away from skin = deep."]},{"id":"EM2026G2-04","topic":"anat","concept":"Movements","source":"EM2026G2","stem":"A physiotherapist asks a patient to move the distal end of the arm so that it traces a complete circular path, combining flexion, extension, abduction, and adduction. Which term best describes this movement?","options":["Adduction","Circumduction","Flexion","Rotation"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الحركة الدايرية اللي بتجمع flexion و abduction و extension و adduction = circumduction.","memoryTrick":"Circum = دايرة.","stemAr":"أخصائي علاج طبيعي طلب من مريض يحرك الطرف البعيد للـ arm بحيث يرسم دايرة كاملة، تجمع flexion و extension و abduction و adduction. أنهي مصطلح أحسن وصف للحركة دي؟","whyWrong":["ناحية الـ midline بس.",null,"ثني بس.","حوالين الـ axis، مش دايرة."]},{"id":"EM2026G2-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2026G2","stem":"A 55-year-old man undergoes imaging of his femur. The radiologist notes abundant spongy bone at the epiphysis. What is the main characterof spongy bone?","options":["To increase its length","As it looks like a sponge to sustain the pressure","it cover the out surface of the bone","As it provides strength for weight bearing"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ spongy bone شبه الإسفنجة وبيتحمل الـ pressure وبيوزّعها، وده سبب وجوده في الـ epiphysis.","memoryTrick":"Spongy = يمتص الضغط.","stemAr":"راجل عنده 55 سنة عمل أشعة على الـ femur، والـ radiologist لاحظ spongy bone كتير في الـ epiphysis. إيه الصفة الأساسية للـ spongy bone؟","whyWrong":["الطول من الـ growth plate.",null,"الطبقة الخارجية compact.","تحمّل الوزن صفة الـ compact."]},{"id":"EM2026G2-06","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2026G2","stem":"Which of the following arteries can supply the outer compact bone?","options":["periosteal","epiphyseal","metaphyseal","nutrient"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"EM2026P-06","explanation":"الـ periosteal artery بتغذي الـ outer compact bone.","memoryTrick":"Periosteal = Outer.","stemAr":"أنهي artery من دول ممكن تغذي الـ outer compact bone؟","whyWrong":[null,"الـ epiphyseal للأطراف.","الـ metaphyseal للـ metaphysis.","الـ nutrient للجزء الداخلي."]},{"id":"EM2026G2-07","topic":"embryo","concept":"Gametogenesis","source":"EM2026G2","stem":"A 25-year-old male presents with infertility. Semen analysis shows many abnormal sperms while testicular biobsy shows normal spermatids. Which stage of gametogenesis is most likely affected?","options":["Mitosis of spermatogonia","Meiosis I in primary spermatocytes","Spermiogenesis","Migration of primordial germ cells"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ spermatids سليمة بس الـ sperms شكلها غلط، يعني المشكلة في تحوّل الـ spermatid لـ sperm = spermiogenesis.","memoryTrick":"Spermatid سليم + Sperm مشوّه = Spermiogenesis.","stemAr":"راجل عنده 25 سنة جاي بعدم خصوبة. تحليل السائل المنوي بيبيّن sperms كتير شكلها غير طبيعي، والـ testicular biopsy بيبيّن spermatids طبيعية. أنهي مرحلة من الـ gametogenesis غالبًا متأثرة؟","whyWrong":["لو المشكلة في الـ spermatogonia مكانش هيبقى فيه spermatids طبيعية.","نفس الكلام للـ meiosis I.",null,"لو مشكلة في الهجرة مكانش هيبقى فيه germ cells خالص."]},{"id":"EM2026G2-08","topic":"embryo","concept":"Gametogenesis","source":"EM2026G2","stem":"A 30-year-old woman undergoes in vitro fertilization (IVF). Eggs are retrieved after hormonal stimulation and are found to be arrested in metaphase of meiosis II. What triggers the completion of meiosis II in the oocyte?","options":["LH surge","FSH rise","Sperm penetration","Estrogen peak"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"دخول الـ sperm هو اللي بيكمّل الـ meiosis II.","memoryTrick":"Sperm penetration.","stemAr":"ست عندها 30 سنة بتعمل حقن مجهري (IVF). البويضات اتسحبت بعد تنشيط هرموني ولقوها واقفة في metaphase of meiosis II. إيه اللي بيخلّي الـ meiosis II تكمل في الـ oocyte؟","whyWrong":["الـ LH بيكمّل الـ meiosis I.","الـ FSH للنمو.",null,"الـ estrogen بيحفّز الـ LH."]},{"id":"EM2026G2-09","topic":"embryo","concept":"Gametogenesis","source":"EM2026G2","stem":"A researcher observes that in a healthy adult male, germ cells are continuously produced from puberty onward. Which cell type serves as the stem cell reservoir for lifelong spermatogenesis?","options":["Primary spermatocyte","Spermatid","Spermatogonium","Leydig cell"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ spermatogonia هي الـ stem cells اللي بتفضل تنقسم mitotically طول العمر بعد البلوغ.","memoryTrick":"Spermatogonium = المخزن 🏦.","stemAr":"باحث لاحظ إن في الراجل البالغ السليم الـ germ cells بتتنتج باستمرار من البلوغ وطالع. أنهي نوع خلايا هو مخزن الـ stem cells للـ spermatogenesis طول العمر؟","whyWrong":["الـ primary spermatocyte بيدخل meiosis وبيخلص.","الـ spermatid مرحلة نهائية.",null,"الـ Leydig بتفرز testosterone مش germ cells."]},{"id":"EM2026G2-10","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G2","stem":"After fertilization, the zygote begins dividing as it travels through the fallopian tube. On week post-fertilization, it typically consists of inner cell mass with blastocele What is this stage called?","options":["Morula","Blastocyst","Zygote","Embryoblast"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"المرحلة اللي فيها inner cell mass و blastocele (حوالي نهاية الأسبوع الأول) = blastocyst.","memoryTrick":"فيه cavity = Blastocyst.","stemAr":"بعد الـ fertilization، الـ zygote بيبدأ ينقسم وهو ماشي في الـ fallopian tube. بعد أسبوع من الـ fertilization بيكون عادةً فيه inner cell mass و blastocele. المرحلة دي اسمها إيه؟","whyWrong":["الـ morula كورة صماء من غير cavity.",null,"الـ zygote خلية واحدة.","الـ embryoblast جزء من الـ blastocyst مش المرحلة كلها."]},{"id":"EM2026G2-11","topic":"embryo","concept":"Gametogenesis","source":"EM2026G2","stem":"During fertilization, a sperm releases enzymes to penetrate the oocyte's outer layers. Which structure prevents polyspermy by hardening after the first sperm entry?","options":["Corona radiata","Zona pellucida","cell membrane","Perivitelline space"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ zona pellucida بتتغير (zona reaction) بعد دخول أول sperm فتمنع الـ polyspermy.","memoryTrick":"Zona = الباب يتقفل.","stemAr":"أثناء الـ fertilization، الـ sperm بيطلّع إنزيمات عشان يخترق الطبقات الخارجية للـ oocyte. أنهي structure بيمنع الـ polyspermy عن طريق إنه بيتصلّب بعد دخول أول sperm؟","whyWrong":["الـ corona بتتشال.",null,"الـ cell membrane بيندمج، والباب بيتقفل بالـ zona.","الـ perivitelline space مسافة، بيتفرز فيها محتوى الـ cortical granules بس هي نفسها مش بتتصلب."]},{"id":"EM2026G2-12","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G2","stem":"On day 5 post-fertilization, an embryo develops a fluid-filled cavity and differentiates into two cell lineages. Which lineage gives rise to the placenta?","options":["Trophoblast","Syncytiotrophoblast","Cytotrophoblast","Inner cell mass"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ trophoblast هو الـ lineage اللي بيدي الـ placenta (والـ inner cell mass بيدي الجنين).","memoryTrick":"Tropho = Placenta.","stemAr":"في اليوم 5 بعد الـ fertilization، الـ embryo بيكوّن cavity مليانة سائل وبيتمايز لنوعين (lineages) من الخلايا. أنهي واحد فيهم بيدي الـ placenta؟","whyWrong":[null,"الـ syncytio جزء من الـ trophoblast بيتكون بعدين. السؤال عن الـ lineage يوم 5.","الـ cyto نفس الكلام.","الـ inner cell mass للجنين."]},{"id":"EM2026G2-13","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2026G2","stem":"A 28-year-old woman undergoes a transvaginal ultrasound 10 days after her last menstrual period (LMP). The clinician identifies a small gestational sac within the endometrium but no embryo. Which structure is primarily responsible for producing the hormone detected in her positive pregnancy test?","options":["Syncytiotrophoblast","Cytotrophoblast","Epiblast","Hypoblast"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ hCG بيتفرز من الـ syncytiotrophoblast.","memoryTrick":"hCG ⬅ Syncytio.","stemAr":"ست عندها 28 سنة عملت transvaginal ultrasound بعد 10 أيام من آخر دورة (LMP). الدكتور لقى gestational sac صغير جوه الـ endometrium من غير embryo. أنهي structure مسئول أساسًا عن إفراز الـ hormone اللي ظهر في اختبار الحمل الإيجابي؟","whyWrong":[null,"الـ cyto مش بيفرز hCG بشكل أساسي.","الـ epiblast للجنين.","الـ hypoblast للـ yolk sac."]},{"id":"EM2026G2-14","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G2","stem":"A researcher examines an embryo at day 9 post-fertilization and notes a new space between hypoblast and exocoelomic membrane. This cavity will develop into which structure?","options":["Yolk sac","Amniotic cavity","Chorionic cavity","Blastocyst cavity"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"المساحة اللي بيحددها الـ hypoblast والـ exocoelomic membrane هي الـ primary yolk sac (exocoelomic cavity)، وبتتحول للـ yolk sac.","memoryTrick":"Hypoblast + Heuser's = Yolk sac.","stemAr":"باحث فحص embryo في اليوم 9 بعد الـ fertilization ولاحظ مساحة جديدة بين الـ hypoblast والـ exocoelomic membrane. الـ cavity دي هتتحول لأنهي structure؟","whyWrong":[null,"الـ amniotic جوه الـ epiblast.","الـ chorionic في الـ extraembryonic mesoderm.","الـ blastocyst cavity هي اللي بتتحول بالـ exocoelomic membrane، وبيبقى اسمها yolk sac."]},{"id":"EM2026G2-15","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G2","stem":"In an embryo at day 12 post-fertilization, lacunae (spaces) appear within the syncytiotrophoblast and fill with maternal blood. What is this process critical for?","options":["Gastrulation process","Neurulation process","Uteroplacental circulation","Cleavage process"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ lacunae المليانة دم الأم ضرورية للـ uteroplacental circulation.","memoryTrick":"Lacunae = دورة الأم.","stemAr":"في embryo عمره 12 يوم بعد الـ fertilization، ظهرت lacunae (مسافات) جوه الـ syncytiotrophoblast واتملت بدم الأم. العملية دي مهمة لإيه؟","whyWrong":["الـ gastrulation في الأسبوع التالت.","الـ neurulation في الأسبوع التالت والرابع.",null,"الـ cleavage في الأسبوع الأول."]},{"id":"EM2026G2-16","topic":"embryo","concept":"Implantation & second week","source":"EM2026G2","stem":"Implantation is complete by
