-knu"]}},{"id":"BG-313","topic":"genetics","concept":"Replication initiation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"Topoisomerases are needed at an advancing replication fork to relieve:","options":["Lack of phosphate","Supercoiling or topological stress","Absence of thymine","Histone translation"],"answer":1,"decks":{"FIGHTER":["A-gen1"],"MEDZONE":["A-gen1"]}},{"id":"BG-314","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"DNA polymerase III extends a growing DNA chain in which direction?","options":["3'->5'","5'->3'","Both simultaneously on one strand","Without a defined direction"],"answer":1,"decks":{"FIGHTER":["A-gen1"],"MEDZONE":["A-gen1"]}},{"id":"BG-315","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"The lagging strand differs from the leading strand because it is:","options":["Synthesized as Okazaki fragments","Synthesized without any primer","Extended only 3'->5'","Never proofread"],"answer":0,"decks":{"FIGHTER":["A-gen1"],"MEDZONE":["A-gen1"]}},{"id":"BG-316","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"In the prokaryotic pathway described, removal and DNA replacement of RNA primers in Okazaki fragments is primarily carried out by:","options":["DNA polymerase I","DNA polymerase III only","DnaB helicase","Histone H1"],"answer":0,"decks":{"FIGHTER":["A-gen1"],"MEDZONE":["A-gen1","K-knu"]}},{"id":"BG-317","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A biochemist is studying the linkage between a nitrogenous base and a pentose sugar in a DNA molecule. Which of the following best describes this bond?","options":["A 3'->5' phosphodiester bond","A hydrogen bond","An N-glycosidic bond","A peptide bond"],"answer":2,"explanation":"الرابطة بين الـ base والـ pentose sugar هي N-glycosidic bond: الـ N-9 في الـ purines أو الـ N-1 في الـ pyrimidines بيرتبط بالـ C-1' بتاع السكر (الكتاب ص 70 و73).\n• Phosphodiester: بين النيوكليوتيدات وبعضها.\n• Hydrogen bonds: بين الـ bases في الـ strands المقابلة.\n• Peptide bond: في البروتين.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-318","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A structural biologist is comparing different forms of DNA. They note that one form is a left-handed helix with a narrow diameter of 18.4 Å and 12 bases per turn. Which form of DNA is being described?","options":["A-form","B-form","Z-form","Cruciform"],"answer":2,"explanation":"حسب جدول الكتاب (ص 79):\n• الـ Z form: left-handed، أضيق قطر 18.4 Å، و12 bases per turn.\n• الـ A form: 25.5 Å و11 bases (right-handed).\n• الـ B form: 23.7 Å و10 bases (right-handed).\nالـ cruciform شكل بيتكون من الـ palindromes، مش DNA form.","memoryTrick":"Z = Zigzag = الوحيد left-handed و12 bases.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-319","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"Which of the following correctly pairs a histone protein with its function in chromatin structure?","options":["H1: Forms the core of the nucleosome","H2A: Binds to linker DNA","H4: Has no role in DNA packaging","H1: Binds to the linker DNA chain"],"answer":3,"explanation":"الـ Histone H1 بيرتبط بالـ linker DNA اللي بين الـ nucleosome beads. الـ core نفسه (octamer) بيتكون من 2 من كل واحد: H2A و H2B و H3 و H4 (الكتاب ص 84).\nالـ H1 مش جزء من الـ core، والـ H2A في الـ core مش في الـ linker، والـ H4 ليه دور أساسي في الـ packaging.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-320","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"During the elongation phase of bacterial DNA replication, the leading strand is synthesized continuously. Which of the following enzymes is primarily responsible for this continuous synthesis?","options":["DNA polymerase I","DNA polymerase III","DNA primase","DNA ligase"],"answer":1,"explanation":"الـ DNA polymerase III هو الإنزيم الـ highly processive اللي بيعمل 5'→3' synthesis للـ leading strand وللـ Okazaki fragments (الكتاب ص 92 و94).\n• Pol I: بيشيل الـ primers ويحط DNA مكانها.\n• Primase: بيعمل الـ RNA primer.\n• Ligase: بتقفل الـ nicks.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-321","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A newly discovered antibiotic specifically targets and inhibits the activity of DNA topoisomerase. What would be the most immediate consequence for a bacterial cell exposed to this drug?","options":["Failure to synthesize RNA primers.","Inability to join Okazaki fragments.","Inability to recognize the origin of replication.","Inability to relieve supercoiling stress."],"answer":3,"explanation":"الـ unwinding بتاع الـ DNA بيعمل topological stress (supercoils) قدام الـ replication fork، والـ topoisomerases هي اللي بتفكه (الكتاب ص 91). فلو اتثبطت، الـ supercoiling stress مش هيتفك.\nالـ primers بيعملها الـ primase، والـ Okazaki fragments بتلزقها الـ ligase، والـ origin بيتعرف عليه الـ DnaA.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-322","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"The initiation of DNA replication in E. coli requires the binding of DnaA to the origin of replication (oriC). What is the immediate consequence of this binding?","options":["It directly synthesizes the RNA primer.","It recruits DNA ligase to seal the DNA strands.","It leads to the unwinding of the AT-rich region (DUE).","It causes the dissociation of DNA polymerase III."],"answer":2,"explanation":"الـ DnaA-ATP بيرتبط بالـ 9-bp repeats في الـ oriC، وده بيعمل unwinding للـ 13-bp repeats الغنية بالـ AT في الـ DUE. بعدها بيجيب الـ DnaB helicase (الكتاب ص 90).\nالـ DnaA مش بيعمل primers (ده الـ primase)، والـ DnaA نفسه هو اللي بيفك بعد تحميل الـ Pol III، مش العكس.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-323","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A researcher is studying a cancer cell line and finds that the cells can grow indefinitely in culture, unlike normal somatic cells which undergo senescence. This \"immortality\" is most likely due to the reactivation of which enzyme?","options":["DNA Polymerase III","Telomerase","DNA Ligase","AP Endonuclease"],"answer":1,"explanation":"خلايا الـ cancer غالبًا فيها telomerase activity عالية، فالـ telomeres مش بتقصر، وده بيساهم في الـ immortality (الكتاب ص 95). الخلايا العادية من غيره بتقصر الـ telomeres بتاعتها مع كل replication لحد ما توصل للـ senescence.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-324","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A drug inhibits the enzyme DNA polymerase I. Which of the following processes would be most directly and immediately affected?","options":["The synthesis of the leading strand.","The removal of RNA primers and their replacement with DNA.","The unwinding of the DNA double helix.","The proofreading of the newly synthesized DNA."],"answer":1,"explanation":"الـ DNA polymerase I ليه 5'→3' exonuclease activity بتشيل الـ RNA primers، و5'→3' polymerase activity بتحط DNA مكانها (الكتاب ص 93–94). فتثبيطه يأثر مباشرة على شيل الـ primers.\nالـ leading strand بيعمله الـ Pol III، والـ unwinding بيعمله الـ helicase. والـ proofreading موجود في الـ Pol III كمان، فمش هو اللي هيتأثر مباشرة.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-325","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A bacterium isolated from a patient with a urinary tract infection is studied in the laboratory. An inhibitor of DnaG prevents production of the short RNA segments needed to start DNA synthesis. Which enzyme has been inhibited?","options":["DNA topoisomerase","Helicase","Primase","DNA ligase"],"answer":2,"explanation":"الـ DnaG هو الـ primase، اللي بيعمل الـ RNA primers القصيرة (10–60 nucleotides) اللي الـ DNA synthesis بيبدأ منها. الـ Pol III مايقدرش يبدأ من غير primer (الكتاب ص 91–92).","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-326","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A bacterial isolate from a wound is found to have a defective protein that normally coats newly separated DNA strands. The exposed strands repeatedly reanneal during replication. Which protein is most likely defective?","options":["Single-stranded DNA-binding protein","Tus termination protein","DnaA initiation protein","Dam methylase"],"answer":0,"explanation":"الـ SSB (single-stranded DNA-binding proteins) بتلزق على الـ strands اللي اتفصلت عند الـ fork وبتثبتها عشان مايرجعوش يلزقوا في بعض (الكتاب ص 91).\n• Tus: في الـ termination.\n• DnaA: في الـ initiation.\n• Dam methylase: بتعمل methylation للـ GATC.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-327","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A teenager develops sunburn after prolonged outdoor activity. Ultraviolet exposure has produced covalent links between adjacent thymine residues in DNA from skin cells. Which lesion has formed?","options":["A pyrimidine dimer","A base-pair mismatch","An apurinic site","A double-strand break"],"answer":0,"explanation":"الـ UV بيعمل covalent links بين 2 thymines جنب بعض على نفس الـ strand، وده اسمه thymine dimer (نوع من الـ pyrimidine dimers). بيتصلح بالـ nucleotide excision repair.\nالـ mismatch غلطة في الـ pairing، والـ apurinic site يعني base ناقصة.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-328","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A patient's cells are being tested for their ability to remove uracil from DNA. The first enzyme in the relevant repair pathway cleaves the bond connecting the abnormal base to its sugar. Which enzyme performs this step?","options":["Replicative DNA helicase","AP endonuclease","DNA glycosylase","DNA ligase"],"answer":2,"explanation":"في الـ base excision repair أول إنزيم هو الـ DNA glycosylase. ده بيقطع الـ N-glycosidic bond بين الـ base الغلط (هنا uracil) والسكر، فيعمل AP site.\nبعده الـ AP endonuclease بيقطع الـ backbone، والـ polymerase بيملا الفراغ، والـ ligase بتقفل.","memoryTrick":"BER بالترتيب: Glycosylase ← AP endonuclease ← Polymerase ← Ligase.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-329","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A bacterium recovered from a patient is examined during DNA replication. One daughter strand is synthesized continuously, whereas the other is produced as short fragments. Which statement explains this difference?","options":["The lagging strand grows 3' to 5' on its template","Both strands grow 5' to 3' on antiparallel templates","The parental strands are parallel at the replication fork","Only the leading strand requires an RNA primer"],"answer":1,"explanation":"الـ DNA polymerase بيبني 5'→3' بس. ولأن الـ parental strands antiparallel، strand واحد (الـ leading) بيتبني continuous في اتجاه الـ fork. التاني (الـ lagging) لازم يتبني في الاتجاه العكسي كـ Okazaki fragments (الكتاب ص 92–93).\n• مفيش strand بيكبر 3'→5'.\n• الـ strands الأصلية antiparallel مش parallel.\n• الاتنين محتاجين primer.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-330","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"In the context of DNA repair, an \"AP site\" (apurinic/apyrimidinic site) is created by the loss of a purine or pyrimidine base. Which repair pathway is responsible for fixing this type of single-base alteration?","options":["Mismatch Repair","Nucleotide Excision Repair","Base Excision Repair","Non-homologous End Joining"],"answer":2,"explanation":"الـ AP site اتكوّن من فقد base واحدة، ودي single-base alteration بيصلحها الـ base excision repair: الـ AP endonuclease بيقطع، والـ polymerase بيملا، والـ ligase بتقفل.\n• NER: للـ bulky lesions زي الـ thymine dimers.\n• Mismatch repair: لأخطاء الـ replication.\n• NHEJ: للـ double-strand breaks.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-331","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"An experimental antibacterial drug leaves short DNA fragments adjacent to one another after their RNA primers have been removed and replaced by DNA. The fragments have correctly paired bases but persistent nicks in the sugar-phosphate backbone. Which activity is most directly inhibited?","options":["Separation of strands by helicase","Formation of phosphodiester bonds by DNA ligase","Removal of primers by DNA polymerase I","Synthesis of primers by primase"],"answer":1,"explanation":"الـ fragments اتملت صح والـ primers اتشالت، بس الـ nicks لسه في الـ backbone. يعني اللي ناقص هو تكوين الـ phosphodiester bond بين الـ fragments، وده شغل الـ DNA ligase (الكتاب ص 93).\nالـ helicase والـ Pol I والـ primase اشتغلوا خلاص، بدليل إن الـ primers اتشالت.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-332","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A DNA sample is heated to 95°C, causing its two strands to separate. Regarding the melting temperature (Tm), if the DNA sample has a very high content of Adenine and Thymine (AT), what will happen to the Tm compared to a sample with high Guanine and Cytosine (GC) content?","options":["The Tm will be higher.","The Tm will be lower.","The Tm will remain the same.","The Tm will be completely unpredictable."],"answer":1,"explanation":"الـ AT pairs فيها 2 hydrogen bonds، والـ GC فيها 3. فالـ DNA الغني بالـ AT أسهل في الفصل والـ Tm بتاعه أقل. والـ high GC content بيرفع الـ Tm (الكتاب ص 81).","memoryTrick":"GC = 3 روابط = أصعب في الفصل = Tm أعلى.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-333","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A bacterium isolated from a patient has an altered oriC sequence in which an AT-rich region is replaced by a GC-rich region. DnaA can still recognize its binding sites. Why may opening of the origin now require more energy?","options":["GC-rich DNA cannot serve as a template for DNA polymerase","GC base pairs have three hydrogen bonds","GC-rich regions eliminate the need for helicase loading","GC base pairs prevent the formation of phosphodiester bonds"],"answer":1,"explanation":"الـ origin بيتفتح عند الـ DUE الغنية بالـ AT لأن الـ A=T بينهم 2 hydrogen bonds بس، فبيتفصلوا بسهولة. لو اتبدلت بـ GC، فيه 3 hydrogen bonds، فالفصل محتاج energy أكتر (الكتاب ص 77 و89).\nالـ GC-rich DNA عادي ينفع template، وفيه phosphodiester bonds عادي.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-334","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"A cytosine in a patient's DNA is deaminated to uracil. The lesion is not repaired before replication, and adenine is incorporated opposite the uracil. After another replication cycle, which permanent base-pair change can result?","options":["C:G to T:A","A:T to T:A","A:T to G:C","C:G to G:C"],"answer":0,"explanation":"الـ C اتحول لـ U، والـ U بيتزاوج مع A في الـ replication الأولى، فالـ strand الجديد فيه A بدل G. في الـ replication التانية الـ A ده بيتزاوج مع T، فيطلع T:A مكان الـ C:G الأصلي. يعني الطفرة C:G ← T:A (transition).","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-335","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"Hereditary non-polyposis colon cancer (HNPCC) is a common inherited cancer syndrome. It is caused by a defect in which DNA repair mechanism?","options":["Mismatch Repair (MMR)","Base Excision Repair (BER)","Nucleotide Excision Repair (NER)","Homologous Recombination (HR)"],"answer":0,"explanation":"الـ HNPCC (Lynch syndrome) سببه defect وراثي في جينات الـ mismatch repair. الأخطاء اللي بتفلت من الـ proofreading بتتراكم وبتعمل colorectal cancer.\nالـ NER defect بيعمل xeroderma pigmentosum.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-336","topic":"genetics","concept":"Replication elongation","source":"FIGHTER","banks":["FIGHTER","MEDZONE"],"stem":"An E. coli isolate from a patient is used to study methyl-directed mismatch repair. Immediately after replication, a mismatched base is present in the unmethylated daughter strand opposite a base in the methylated parental strand. Which strand should the repair system preferentially excise?","options":["The original methylated strand","The newly synthesized unmethylated strand","Both strands across the same segment","Neither strand until the next replication cycle"],"answer":1,"explanation":"في الـ methyl-directed mismatch repair، الـ parental strand متعلم بـ methyl على الـ GATC (بالـ Dam methylase). الـ strand الجديد لسه unmethylated. فالـ repair system بيعرف إن الغلطة في الـ strand الجديد ويشيلها منه (الكتاب ص 91).","memoryTrick":"الـ methyl = علامة الـ strand الأصلي، فالتصليح يكون في الـ strand اللي من غير methyl.","decks":{"FIGHTER":["W-q3"],"MEDZONE":["W-q3"]}},{"id":"BG-337","topic":"genetics","concept":"Nitrogenous bases","source":"MEDZONE","banks":["MEDZONE"],"stem":"A 55-year-old male presents to the ER with acute pain and swelling in his right big toe. He is diagnosed with gout. The physician advises him to adhere to a low-purine diet to reduce uric acid production. Which of the following nitrogenous bases are classified as purines and are therefore restricted in his diet?","options":["Cytosine and Uracil","Adenine and Guanine","Thymine and Cytosine","Uracil and Thymine"],"answer":1,"where":["Dr Marwa Questions On Genetics (1)"],"decks":{"MEDZONE":["W-q1"]}},{"id":"BG-338","topic":"genetics","concept":"Primary DNA structure","source":"MEDZONE","banks":["MEDZONE"],"stem":"A 34-year-old patient is diagnosed with HIV and started on Zidovudine (AZT), a thymidine analog. For AZT to act as a chain terminator during viral DNA synthesis, it must be phosphorylated and incorporated into the growing chain. Why does this incorporation halt DNA synthesis?","options":["It lacks a 5'-phosphate group.","It lacks a 3'-hydroxyl group.","It contains a ribose sugar instead of deoxyribose.","It pairs with guanine instead of adenine."],"answer":1,"where":["Dr Marwa Questions On Genetics (1)"],"explanation":"الـ polymerase بيضيف كل nucleotide جديد على الـ free 3'-OH بتاع اللي قبله (الكتاب ص 75 و92). الـ AZT مكان الـ 3'-OH فيه azido group، فبعد ما يدخل في السلسلة مفيش 3'-OH يتربط فيه اللي بعده، فالسلسلة بتقف (chain terminator).","decks":{"MEDZONE":["W-q1"]}},{"id":"BG-339","topic":"genetics","concept":"DNA drugs","source":"MEDZONE","banks":["MEDZONE"],"stem":"A 62-year-old male is undergoing chemotherapy for a solid tumor. His oncologist prescribes Actinomycin D, a drug that intercalates into the DNA double helix. Based on the structural model of DNA, where does this drug primarily bind?","options":["The major groove","The minor groove","The sugar-phosphate backbone","The histone core"],"answer":1,"where":["Dr Marwa Questions On Genetics (1)"],"explanation":"الكتاب (ص 76) بيقول إن الـ Actinomycin D بيتفاعل جوه الـ minor groove، فبيثبط الـ DNA و RNA synthesis.\nالـ major و minor grooves أماكن ارتباط الـ regulatory proteins. الـ backbone والـ histone core مش هما مكان الدوا ده.","decks":{"MEDZONE":["W-q1"]}},{"id":"BG-340","topic":"genetics","concept":"DNA denaturation","source":"MEDZONE","banks":["MEDZONE"],"stem":"A 45-year-old male presents with fever and cough. A respiratory sample is sent for PCR testing. The target bacterial DNA sequence has a very high GC content (70%). How should the lab technician adjust the annealing temperature compared to a high AT-content template, and what is the structural reason?","options":["Decrease it, because GC pairs have 2 hydrogen bonds.","Increase it, because GC pairs have 3 hydrogen bonds.","Increase it, because GC pairs have 2 hydrogen bonds.","Decrease it, because GC pairs have 3 hydrogen bonds."],"answer":1,"where":["Dr Marwa Questions On Genetics (1)"],"explanation":"الـ GC pairs فيها 3 hydrogen bonds مقابل 2 في الـ AT، فالـ DNA الغني بالـ GC أثبت والـ Tm بتاعه أعلى (الكتاب ص 77 و81). عشان كده الـ annealing temperature في الـ PCR لازم تزيد مع الـ high GC.\nالاختيارات C و D غلط لأنهم بيقولوا عدد روابط غلط أو اتجاه غلط.","decks":{"MEDZONE":["W-q1"]}},{"id":"BG-341","topic":"genetics","concept":"Nucleotides","source":"MEDZONE","banks":["MEDZONE"],"stem":"The nitrogenous base in a nucleotide is attached to the pentose sugar at which position?","options":["The 1' carbon of the sugar.","The 2' carbon of the sugar.","The 3' carbon of the sugar.","The 5' carbon of the sugar."],"answer":0,"where":["Dr Marwa Questions On Genetics (1)"],"explanation":"الـ base بيرتبط بالـ C-1' بتاع السكر بـ N-glycosidic bond (N-9 للـ purines و N-1 للـ pyrimidines). أما الـ phosphate فبيرتبط عند الـ C-5' (الكتاب ص 72–73).\nالـ 3'-OH هو اللي بيعمل الـ phosphodiester bond مع النيوكليوتيد اللي بعده.","decks":{"MEDZONE":["W-q1"]}},{"id":"BG-342","topic":"genetics","concept":"DNA denaturation","source":"MEDZONE","banks":["MEDZONE"],"stem":"A research student heats a DNA sample to 95°C. What is the most likely immediate effect on the DNA structure?","options":["The phosphodiester bonds will break, fragmenting the DNA.","The N-glycosidic bonds will break, separating bases from sugars.","The hydrogen bonds between complementary bases will break.","The DNA will condense further into a more compact structure."],"answer":2,"where":["Dr Marwa Questions On Bio & Genetics (2)"],"explanation":"تسخين الـ DNA لـ 95°C بيعمل denaturation، يعني الـ hydrogen bonds بين الـ complementary bases بتتكسر والـ 2 strands بيتفصلوا (الكتاب ص 80).\nالـ phosphodiester bonds والـ N-glycosidic bonds covalent ومش بتتكسر بالتسخين ده.","decks":{"MEDZONE":["W-q2"]}},{"id":"BG-343","topic":"genetics","concept":"Palindromes & repeats","source":"MEDZONE","banks":["MEDZONE"],"stem":"A DNA sequence 5'-TTAGCACGTGCTAA-3' is best classified as which of the following?","options":["Mirror repeat","Palindrome/inverted repeat","Direct repeat","Tandem repeat"],"answer":1,"where":["Dr Marwa Questions On Bio & Genetics (2)"],"explanation":"الـ palindrome: الـ sequence على strand بيتقرا زي الـ strand المقابل (5'→3')، يعني inverted repeat ليه twofold symmetry. الـ sequence ده بالظبط هو المثال اللي في الكتاب (ص 81).\nطريقة الحل: الـ complement لـ TTAGCACGTGCTAA هو AATCGTGCACGATT، ولو قريته بالعكس هيطلع نفس الـ sequence الأصلي.","memoryTrick":"اقلب الـ complement، لو طلع نفس الـ sequence يبقى palindrome.","decks":{"MEDZONE":["W-q2"]}},{"id":"BG-344","topic":"genetics","concept":"Palindromes & repeats","source":"MEDZONE","banks":["MEDZONE"],"stem":"Which of the following will form a palindromic sequence?","options":["ATTGCAAT","AGTCCTGA","CATCCAAG","GAAC"],"answer":0,"where":["Dr Marwa Questions On Bio & Genetics (2)"],"explanation":"علشان تعرف لو الـ sequence palindrome: اكتب الـ complement واقلبه.\nATTGCAAT ← complement: TAACGTTA ← بالعكس: ATTGCAAT، نفسه، فهو palindrome.\nB و C لما تقلبهم مش بيطلعوا نفس الـ sequence، والـ GAAC قصير ومش متماثل.","decks":{"MEDZONE":["W-q2"]}},{"id":"BG-345","topic":"genetics","concept":"Palindromes & repeats","source":"MEDZONE","banks":["MEDZONE"],"stem":"Which of the following sequences would be least likely to form a hairpin or cruciform structure?","options":["5'-GAATTC-3'","5'-TTAGCACGTGCTAA-3'","5'-AGTCGA-3'","5'-GGATCC-3'"],"answer":2,"where":["Dr Marwa Questions On Bio & Genetics (2)"],"explanation":"الـ hairpin والـ cruciform بيتكونوا من palindromic (self-complementary) sequences.\n• GAATTC: palindrome (EcoRI).\n• GGATCC: palindrome (BamHI).\n• TTAGCACGTGCTAA: palindrome (مثال الكتاب).\n• AGTCGA: الـ complement المقلوب بتاعه TCGACT، مختلف عنه، فمش palindrome وده الأقل احتمالًا.","decks":{"MEDZONE":["W-q2"]}},{"id":"BG-346","topic":"genetics","concept":"Chromatin organization","source":"MEDZONE","banks":["MEDZONE"],"stem":"A tumor biopsy is analyzed for its chromatin structure. The pathologist notes that the DNA is highly condensed into a 30-nm fiber, limiting the access of transcription factors. Which level of chromatin structure does the 30-nm fiber represent?","options":["Naked DNA","The \"beads-on-a-string\" form","Packed nucleosomes","The extended form of the chromosome"],"answer":2,"where":["Dr Marwa Questions On Bio & Genetics (2)"],"explanation":"الـ 30-nm fiber عبارة عن nucleosomes ملفوفة على بعض (6 nucleosomes per turn) عشان تعمل solenoid، يعني packed nucleosomes (الكتاب ص 83).\nالـ beads-on-a-string هو الـ 11 nm، والـ naked DNA هو الـ 2 nm، والـ extended form هو الـ 300 nm.","decks":{"MEDZONE":["W-q2"]}},{"id":"BG-347","topic":"genetics","concept":"Palindromes & repeats","source":"MEDZONE","banks":["MEDZONE"],"stem":"A DNA sequence 5'-GAATTC-3' is recognized by EcoRI and can form a cruciform. What feature allows this?","options":["It is a mirror repeat with no self-complementarity","It is a palindromic inverted repeat, self-complementary.","It is a direct repeat that forms a triple helix","It is a left-handed Z-DNA sequence"],"answer":1,"where":["Dr Marwa Questions On Bio & Genetics (2)"],"explanation":"الـ GAATTC: الـ complement بتاعه CTTAAG، ولو اتقرا بالعكس (5'→3') بيطلع GAATTC تاني. يعني ده palindromic inverted repeat، self-complementary، وده اللي بيخليه يقدر يعمل hairpin أو cruciform (الكتاب ص 81).\nالـ mirror repeat مش self-complementary فمابيعملش cruciform.","decks":{"MEDZONE":["W-q2"]}},{"id":"BG-348","topic":"genetics","concept":"Histones","source":"MEDZONE","banks":["MEDZONE"],"stem":"During eukaryotic DNA packaging, which histone is NOT part of the nucleosome core particle?","options":["H2A","H2B","H1","H4"],"answer":2,"where":["Dr Marwa Questions On Bio & Genetics (2)"],"decks":{"MEDZONE":["W-q2"]}},{"id":"BG-349","topic":"genetics","concept":"Chromatin organization","source":"MEDZONE","banks":["MEDZONE"],"stem":"Which level of chromatin organization is described as a \"beads-on-a-string\" structure with a diameter of approximately 11 nm?","options":["Naked DNA double helix","Nucleosome array","30-nm chromatin fiber","Condensed section of chromosome"],"answer":1,"where":["Dr Marwa Questions On Bio & Genetics (2)"],"decks":{"MEDZONE":["W-q2"]}},{"id":"BG-350","topic":"genetics","concept":"Chromatin organization","source":"MEDZONE","banks":["MEDZONE"],"stem":"Which of the following is the correct order of DNA packaging from least to most condensed?","options":["Double helix - nucleosome - 30-nm fiber - extended chromatin - condensed chromosome","Nucleosome - double helix - 30-nm fiber - condensed chromosome","Double helix - 30-nm fiber - nucleosome - condensed chromosome","Nucleosome - 30-nm fiber - double helix - condensed chromosome"],"answer":0,"where":["Dr Marwa Questions On Bio & Genetics (2)"],"explanation":"الترتيب من الأقل للأكتر condensation (الكتاب ص 83):\nDNA double helix (2 nm) ← nucleosomes / beads-on-a-string (11 nm) ← 30-nm fiber ← extended chromosome / looped domains (300 nm) ← condensed chromosome (700 nm) ← mitotic chromosome (1400 nm).","decks":{"MEDZONE":["W-q2"]}},{"id":"BG-351","topic":"genetics","concept":"Palindromes & repeats","source":"MEDZONE","banks":["MEDZONE"],"stem":"Which of the following best describes a mirror repeat in DNA?","options":["It is self-complementary within each strand and forms hairpins","It has inverted repeats on the same strand","It is always a left-handed Z-DNA sequence","It causes DNA to denature at lower temperature"],"answer":1,"where":["Dr Marwa Questions On Bio & Genetics (2)"],"explanation":"الـ mirror repeat معناه إن الـ sequence متكرر بشكل معكوس على نفس الـ strand (inverted repeat on the same strand)، من غير complementarity. عشان كده مابيقدرش يعمل hairpin أو cruciform.\nالـ palindrome (inverted repeat) هو اللي self-complementary وبيعمل hairpin، فالاختيار A ده وصف الـ palindrome مش الـ mirror repeat.","decks":{"MEDZONE":["W-q2"]}},{"id":"BG-352","topic":"genetics","concept":"Histones","source":"MEDZONE","banks":["MEDZONE"],"stem":"A 58-year-old female is diagnosed with a malignancy characterized by overexpression of a specific oncogene. Molecular analysis reveals increased acetylation of the N-terminal tails of histones in the promoter region of this gene. What is the structural consequence of this modification?","options":["It increases the positive charge of histones, tightening DNA binding.","It causes the DNA to switch from B-form to Z-form.","It breaks the phosphodiester bonds, fragmenting the DNA.","It decreases the positive charge of histones, loosening DNA binding."],"answer":3,"where":["Dr Marwa Questions On Bio & Genetics (2)"],"explanation":"الـ histones غنية بالـ lysine والـ arginine، فشحنتها positive وبتمسك الـ DNA السالب بـ ionic bonds. الـ acetylation بيحط acetyl على الـ lysine فبيلغي شحنته الموجبة، فالـ histone بيمسك الـ DNA أضعف. الـ chromatin بيبقى loose والـ transcription بيزيد (الكتاب ص 84).","memoryTrick":"Acetylation = Activation (الـ DNA بيتفك والجين يشتغل).","decks":{"MEDZONE":["W-q2"]}},{"id":"BG-353","topic":"genetics","concept":"Cell cycle","source":"MEDZONE","banks":["MEDZONE"],"stem":"Which of the following is primarily assessed at the G2 checkpoint?","options":["Attachment of chromosomes to spindle fibers","Availability of growth factors before S phase","Completion of DNA replication and DNA integrity","Separation of sister chromatids"],"answer":2,"where":["Midterm KNU 2027 (1st Round)"],"decks":{"MEDZONE":["K-knu"]}},{"id":"BG-354","topic":"genetics","concept":"Cell cycle","source":"MEDZONE","banks":["MEDZONE"],"stem":"A cell lacks sufficient nutrients and growth factors. At which checkpoint is its progression most likely to be arrested?","options":["G1 checkpoint","G2 checkpoint","Metaphase checkpoint","Anaphase checkpoint"],"answer":0,"where":["Midterm KNU 2027 (1st Round)"],"decks":{"MEDZONE":["K-knu"]}}],"disclaimer":"الإجابات من ملزمة الأسئلة، وممكن يكون فيها أخطاء. لو شاكك في إجابة، راجع الدكتور."}</script>

// ---------- question bank ----------
const Bank = { topics: [], questions: [], byId: {}, topicName: {}, source: "", sources: [], sourceName: {}, hasRepeats: false };
function validateBank(data) {

  if (!Array.isArray(data.topics) || !data.topics.length) errors.push(t("v.topics"));
  if (!Array.isArray(data.questions) || !data.questions.length) errors.push(t("v.questions"));
  if (errors.length) return errors;
  const tids = new Set(data.topics.map(t => t && t.id));
  const seen = new Set();
  data.questions.forEach((q, i) => {
    const w = t("v.where", {i: i+1}) + (q && q.id ? " (" + q.id + ")" : "");
    if (!q || typeof q !== "object") { errors.push(t("v.notObj", {w})); return; }
    if (!q.id) errors.push(t("v.noId", {w}));
    else if (seen.has(q.id)) errors.push(t("v.dupId", {w})); else seen.add(q.id);
    if (!tids.has(q.topic)) errors.push(t("v.badTopic", {w, t: q.topic}));

    const no = Array.isArray(q.options) ? q.options.length : 0;
    if (no < 2 || no > 6) errors.push(t("v.opts", {w}));
    else if (!(Number.isInteger(q.answer) && q.answer >= 0 && q.answer < no)) errors.push(t("v.answer", {w}));

}

  Bank.topicName = {}; Bank.topics.forEach(t => Bank.topicName[t.id] = t.name);
  Bank.questions = data.questions.map(q => ({
    id: String(q.id), topic: String(q.topic), concept: q.concept || "General", stem: String(q.stem),
    options: q.options.map(String), answer: q.answer,
    hints: Array.isArray(q.hints) ? q.hints.filter(Boolean).map(String) : [],
    explanation: q.explanation || "", whyWrong: Array.isArray(q.whyWrong) ? q.whyWrong : [],
    keyConcept: q.keyConcept || "", memoryTrick: q.memoryTrick || "", stemAr: q.stemAr ? String(q.stemAr) : "", remember: q.remember || "",
    source: q.source ? String(q.source) : "", note: q.note || "", repeatOf: q.repeatOf || "",
    banks: Array.isArray(q.banks) && q.banks.length ? q.banks.map(String) : (q.source ? [String(q.source)] : []),
    where: Array.isArray(q.where) ? q.where.map(String) : [],
    decks: q.decks && typeof q.decks === "object" && !Array.isArray(q.decks) ? Object.fromEntries(Object.entries(q.decks).filter(([k, v]) => Array.isArray(v)).map(([k, v]) => [String(k), v.map(String)])) : {}
  }));
  Bank.sources = Array.isArray(data.sources) ? data.sources.map(x => ({id: String(x.id), name: String(x.name || x.id)})) : [];
  Bank.sourceName = {}; Bank.sources.forEach(x => Bank.sourceName[x.id] = x.name);
  Bank.questions.forEach(q => q.banks.forEach(b => { if (!Bank.sourceName[b]) { Bank.sources.push({id: b, name: b}); Bank.sourceName[b] = b; } }));
  Bank.hasRepeats = Bank.questions.some(q => q.repeatOf);
  Bank.byId = {}; Bank.questions.forEach(q => Bank.byId[q.id] = q);
  Bank.title = data.title || "Question bank";
  Bank.credit = typeof data.credit === "string" ? data.credit : "";
  Bank.disclaimer = typeof data.disclaimer === "string" ? data.disclaimer : "";
  Bank.reportUrl = typeof data.reportUrl === "string" && /^https:\/\/(docs\.google\.com|forms\.gle)\//.test(data.reportUrl) && data.reportUrl.indexOf("{id}") > 0 ? data.reportUrl : "";
  Bank.mindmaps = Array.isArray(data.mindmaps) ? data.mindmaps.filter(g => g && typeof g.subject === "string" && Array.isArray(g.items)).map(g => ({subject: g.subject, items: g.items.filter(it => it && /^[\w-]+$/.test(String(it.id)) && typeof it.src === "string" && /^[\w\/.-]+$/.test(it.src)).map(it => ({id: String(it.id), n: it.n, title: String(it.title || ""), src: it.src, thumb: typeof it.thumb === "string" && /^[\w\/.-]+$/.test(it.thumb) ? it.thumb : it.src, w: +it.w || 0, h: +it.h || 0}))})).filter(g => g.items.length) : [];
  Bank.source = source;
}
async function loadBank() {
  const custom = Store.get("customBank", null);
  if (custom && !validateBank(custom).length) { useBank(custom, "custom"); return; }
  try {
    if (location.protocol === "file:") throw new Error("file protocol");
    const ctl = typeof AbortController === "function" ? new AbortController() : null;
    const tmr = setTimeout(() => { if (ctl) ctl.abort(); }, 5000);
    const r = await fetch("questions.json", {cache: "no-cache", credentials: "omit", signal: ctl ? ctl.signal : undefined});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    clearTimeout(tmr);
    const errs = validateBank(data);
    if (errs.length) throw new Error(errs[0]);
    useBank(data, "file");
  } catch (e) {
    const data = JSON.parse($("#fallback-bank").textContent);
    useBank(data, "built-in");

// ---------- sessions ----------
function newSession(mode, qids, opts) {
  const s = {
    id: uid(), mode, qids, idx: 0, answers: {}, checked: {}, conf: {}, hints: {}, timeMs: {}, optOrder: {},
    feedback: mode === "exam" ? false : (mode === "revise" ? true : !!opts.feedback),
    startedAt: now(), topics: opts.topics || [], submitted: false
  };
  qids.forEach(id => { const r = range(Bank.byId[id].options.length); s.optOrder[id] = opts.shuffleOptions ? shuffle(r) : r; });
  if (mode === "exam") { s.durationMs = opts.minutes * 60000; s.endsAt = s.startedAt + s.durationMs; }
  return s;
}
const slotOf = mode => mode === "exam" ? "active.exam" : "active.train";
const saveSession = s => { if (s && !s.submitted) Store.set(slotOf(s.mode), s); };
const getActive = slot => { const s = Store.get(slot, null); if (!s || s.submitted) return null; if (!s.qids.every(id => Bank.byId[id])) return null; return s; };
const modeName = m => t(m === "exam" ? "mode.exam" : m === "revise" ? "mode.revise" : "mode.train");

let S = null, qEnter = 0, timerInt = null, inkQ = null, inkPad = null, drawing = false, navOpen = false, warned = {};

function trackTime() {
  if (!S || !qEnter) return;
  const id = S.qids[S.idx]; const dt = Math.min(now() - qEnter, 30 * 60000);
  if (document.visibilityState === "visible" || S.mode === "exam") S.timeMs[id] = (S.timeMs[id] || 0) + dt;
  qEnter = now();
}
document.addEventListener("visibilitychange", () => {
  if (!S) return;
  if (document.visibilityState === "hidden") { trackTime(); saveSession(S); }
  else { qEnter = now(); if (S.mode === "exam") tickTimer(); }
});
window.addEventListener("pagehide", () => { if (S) { trackTime(); saveSession(S); } });

function startSession(mode, qids, opts) {
  if (!qids.length) { toast(t("s.noMatch")); return; }
  S = newSession(mode, qids, opts || {}); warned = {};
  saveSession(S); go("session");
}
function resumeSession(slot) { const s = getActive(slot); if (!s) { toast(t("s.nothingResume")); return; } S = s; warned = {}; go("session"); }
function isRevealed(id) { return S.mode !== "exam" && (S.checked[id] || (S.feedback && S.answers[id] != null)); }

function choose(orig) {
  const id = S.qids[S.idx];
  if (S.mode !== "exam" && isRevealed(id)) return;
  S.answers[id] = orig;
  if (S.feedback && S.mode !== "exam") { const q = Bank.byId[id]; S.checked[id] = true; User.record(id, orig === q.answer, S.conf[id], S.mode); announce(orig === q.answer ? t("s.announceOk") : t("s.announceNo", {a: q.options[q.answer]})); }
  saveSession(S); renderQuestion(true);
}
function checkAnswer() {
  const id = S.qids[S.idx]; if (S.answers[id] == null || S.checked[id]) return;
  S.checked[id] = true; User.record(id, S.answers[id] === Bank.byId[id].answer, S.conf[id], S.mode);
  saveSession(S); renderQuestion(true);
}
function clearAnswer() { const id = S.qids[S.idx]; if (S.mode === "exam" || !isRevealed(id)) { delete S.answers[id]; saveSession(S); renderQuestion(true); } }
function goto(i) {
  if (!S || i < 0 || i >= S.qids.length) return;
  trackTime(); setDrawing(false); S.idx = i; saveSession(S); closeNav(); renderQuestion(); scrollTopSafe();
}
function scrollTopSafe() { try { window.scrollTo({top: 0, behavior: "auto"}); } catch(e) { window.scrollTo(0, 0); } }

async function finishSession(auto) {
  if (!S) return;
  trackTime();
  if (!auto) {
    const total = S.qids.length, answered = S.qids.filter(id => S.answers[id] != null).length, flagged = S.qids.filter(id => User.isFlag(id)).length;
    const verb = S.mode === "exam" ? t("fin.submitExam") : t("fin.finishSession");
    const body = `<p>${t("fin.answered", {a: answered, n: total})}</p>` +
      (total - answered ? `<p class="notice warn">${t(S.mode === "exam" ? "fin.unansExam" : "fin.unansTrain", {n: total - answered})}</p>` : "") +
      (flagged ? `<p class="muted small">${t("fin.flagged", {n: flagged})}</p>` : "") +
      (S.mode === "exam" ? `<p class="muted small">${t("fin.noChange")}</p>` : "");
    if (!(await confirmDialog(verb + (isRTL() ? "؟" : "?"), body, verb))) return;
  }
  clearInterval(timerInt); timerInt = null;
  const items = S.qids.map(id => {
    const q = Bank.byId[id], ch = S.answers[id]; const correct = ch === q.answer;
    return {id, chosen: ch == null ? null : ch, correct, conf: S.conf[id] || null, timeMs: S.timeMs[id] || 0, hints: S.hints[id] || 0};
  });
  S.qids.forEach(id => { if (S.mode === "exam" || !S.checked[id]) { if (S.answers[id] != null || S.mode === "exam") User.record(id, S.answers[id] === Bank.byId[id].answer, S.conf[id], S.mode); } });
  const finishedAt = now();
  const elapsed = S.mode === "exam" ? Math.min(finishedAt, S.endsAt) - S.startedAt : items.reduce((a, b) => a + b.timeMs, 0);
  const attempt = {id: S.id, mode: S.mode, startedAt: S.startedAt, finishedAt, elapsedMs: elapsed, limitMs: S.durationMs || null, auto: auto || false, items};
  User.addHistory(attempt);
  S.submitted = true; Store.del(slotOf(S.mode));
  S = null; setDrawing(false);
  viewAttemptId = attempt.id; go("results");
  if (auto === "time") openDialog({title: t("time.upT"), body: `<p>${t("time.upB")}</p>`, actions: [{label: t("time.seeResults"), cls: "btn-pri"}]});
}

function tickTimer() {
  if (!S || S.mode !== "exam") return;
  const left = S.endsAt - now(); const el = $("#timer");
  if (el) { el.querySelector("b").textContent = fmtTime(left); el.classList.toggle("low", left <= 5*60000 && left > 60000); el.classList.toggle("crit", left <= 60000); }
  if (left <= 5*60000 && !warned.five && S.durationMs > 5*60000) { warned.five = true; announce(t("time.five")); toast(t("time.five")); }
  if (left <= 60000 && !warned.one) { warned.one = true; announce(t("time.one")); toast(t("time.one")); }
  if (left <= 0) { dlgStack.slice().forEach(d => d.close("dismiss")); finishSession("time"); }
}

  if (q.where.length) return q.where.join(" · ") + " · source " + (Bank.sourceName[q.banks[0]] || q.banks[0]);

function revisionQueue(limit, tids) {
  const p = User.progress(), flags = User.flags;
  const scored = Bank.questions.filter(q => !tids || tids.indexOf(q.topic) >= 0).map(q => { const r = p[q.id]; let s = 0;
    if (r && r.last) { if (!r.last.ok) s += 4; if (r.last.conf === "guess") s += 2; else if (r.last.conf === "unsure") s += 1; if (r.n >= 2 && r.c / r.n < 0.5) s += 1; }
    if (flags.has(q.id)) s += 1; return {id: q.id, s}; }).filter(x => x.s > 0);
  scored.sort((a, b) => b.s - a.s || Math.random() - .5);
  return scored.slice(0, limit || 20).map(x => x.id);
}

function bindQuick(tids) {

  const val = k => +$("#qx" + k).textContent;
  const sync = () => { $$("[data-qx]", box).forEach(b => { const list = b.dataset.qx === "n" ? QX_N : QX_M, v = val(b.dataset.qx), d = +b.dataset.d;
    b.disabled = d < 0 ? v <= list[0] : (v >= list[list.length - 1] || (b.dataset.qx === "n" && v >= max)); }); $("#qxgo").disabled = !max; };
  $$("[data-qx]", box).forEach(b => b.onclick = () => { const k = b.dataset.qx, list = k === "n" ? QX_N : QX_M, v = val(k), d = +b.dataset.d;
    let i = list.findIndex(x => x >= v); if (i < 0) i = list.length - 1; if (list[i] !== v && d < 0) i++; i = Math.max(0, Math.min(list.length - 1, i + d));
    let nv = list[i]; if (k === "n" && nv > max) nv = max; $("#qx" + k).textContent = nv; User.setPref(k === "n" ? "quickN" : "quickM", nv); sync(); });
  $("#qxgo").onclick = async () => {
    const pool = quickPool(tids); if (!pool.length) return;

  sync();
}

        d.close("ok"); await applyShortCode(r); })(); return false; }}]});
}
function saveCard(answered) {
  const last = Store.get("lastBackup", 0), days = last ? Math.floor((Date.now() - last) / 864e5) : -1;
  const due = answered >= 10 && (!last || days >= 7);
  const sub = !answered && !last ? t("sc.none") : !last ? t("sc.never") : days >= 7 ? t("sc.due", {d: days}) : days === 0 ? t("sc.today") : t("sc.days", {d: days});
  return `<div class="card savecard${due ? " due" : ""}" id="savecard"><div class="savehead"><span class="saveic" aria-hidden="true">${ICON.save}</span><div><strong>${t("sc.T")}</strong><div class="muted small">${sub}</div></div></div>
    <div class="row saveacts"><button class="btn ${answered ? "btn-pri" : "btn-sec"} btn-sm" id="hsave" ${answered ? "" : "disabled"}>${t("sc.get")}</button><button class="btn ${answered ? "btn-sec" : "btn-pri"} btn-sm" id="hrest">${t("sc.rest")}</button></div></div>`;
}
function isIOSBrowserTab() {
  const ua = navigator.userAgent || ""; const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  return ios && !standalone;
}
function a2hsTip(answered) {

}

      a.href = url; a.download = "medqore-progress-" + new Date().toISOString().slice(0, 10) + ".json";

function bankTopicOptions() {
  const rt = routeTopics(), key = rt && rt.length ? rt.slice().sort().join(",") : "";
  const groups = moduleList().filter(m => m.available && m.topics.length > 1);
  const opt = (v, label) => `<option value="${esc(v)}" dir="ltr" ${v.split(",").sort().join(",") === key ? "selected" : ""}>${esc(label)}</option>`;
  return groups.map(m => opt(m.topics.join(","), m.name)).join("") + Bank.topics.map(tp => opt(tp.id, tp.name)).join("");
}
function viewBank(app) {
  app.innerHTML = `<div class="wrap stack">
    <div><p class="eyebrow">${L(Bank.title)}${Bank.source === "custom" ? t("b.fromFile") : ""}</p>${Bank.credit ? `<p class="credit" dir="ltr">${esc(Bank.credit)}</p>` : ""}${Bank.disclaimer ? `<p class="credit disc" dir="${cdir(Bank.disclaimer)}">${esc(Bank.disclaimer)}</p>` : ""}<h1>${t("b.h1")}</h1>${deckChipHTML("bank")}</div>
    <div class="card stack">
      <div class="grid g2">
        <div class="field"><label for="q">${t("b.search")}</label><input class="input" id="q" type="search" dir="auto" placeholder="${t("b.searchPh")}" autocomplete="off" enterkeyhint="search"></div>
        <div class="field"><label for="tp">${t("b.topic")}</label><select class="input" id="tp"><option value="">${t("b.allTopics")}</option>${bankTopicOptions()}</select></div>
        ${Bank.sources.length ? `<div class="field"><label for="srcb">${t("setup.source")}</label><select class="input" id="srcb"></select></div>` : ""}
      </div>
      <div class="tabs" role="group" aria-label="${t("b.filter")}">${[["all","b.fAll"],["fav","b.fFav"],["flag","b.fFlag"],["wrong","b.fWrong"],["notes","b.fNotes"]].map(([k,l],i) => `<button class="chip" data-f="${k}" aria-pressed="${i===0}">${t(l)}</button>`).join("")}</div>
      <div class="row"><label class="switch small"><input type="checkbox" id="showans"> <span>${t("b.showAns")}</span></label><span class="spacer"></span><span class="muted small" id="cnt"></span><button class="btn btn-pri btn-sm" id="practise">${t("b.practise")}</button></div>
    </div>
    <div class="card" id="list" aria-live="polite"></div>
    <details class="card"><summary>${t("b.adv")}</summary>
      <div class="stack" style="margin-top:12px">
        <p class="muted small">${t("b.advSub")}</p>
        <input type="file" id="bankfile" accept="application/json,.json" class="input">
        <div class="row">${Bank.source === "custom" ? `<button class="btn btn-ghost btn-sm" id="resetbank">${t("b.reset")}</button>` : ""}<button class="btn btn-ghost btn-sm" id="copyfmt">${t("b.copyJson")}</button></div>
      </div></details>
  </div>`;
  let filter = "all", term = "";
  const p = User.progress();
  const draw = () => {
    const flags = User.flags, favs = User.favs, notes = Store.get("notes", {}), tps = $("#tp").value ? $("#tp").value.split(",") : null, show = $("#showans").checked, sb = $("#srcb") ? $("#srcb").value : "";
    const words = term.toLowerCase().split(/\s+/).filter(Boolean);
    const dk = routeDeck();
    const list = Bank.questions.filter(q => (!tps || tps.indexOf(q.topic) >= 0) && inSrc(q, sb) && inDeck(q, dk, sb) &&
      (filter === "all" || (filter === "fav" && favs.has(q.id)) || (filter === "flag" && flags.has(q.id)) || (filter === "wrong" && p[q.id] && p[q.id].last && !p[q.id].last.ok) || (filter === "notes" && notes[q.id])) &&
      words.every(w => (q.id + " " + q.banks.map(b => Bank.sourceName[b] || b).join(" ") + " " + q.where.join(" ") + " " + q.concept + " " + q.stem + " " + q.options.join(" ") + " " + q.explanation + " " + q.memoryTrick + " " + (notes[q.id] || "")).toLowerCase().indexOf(w) >= 0));
    const hl = s => { let r = esc(s); words.forEach(w => { const re = new RegExp("(" + esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi"); r = r.replace(re, "<mark>$1</mark>"); }); return r; };
    $("#cnt").textContent = qn(list.length); $("#cnt").dataset.n = list.length; $("#practise").disabled = !list.length;
    const shown = list.slice(0, 200);
    $("#list").innerHTML = list.length ? shown.map(q => { const r = p[q.id];
      return `<div class="qrow"><div class="qmeta">${subjPill(q.topic)}<span class="qid"><bdi dir="ltr" class="ltr">${hl(q.id)} · ${esc(q.concept)}${q.source && !q.where.length && q.banks.length < 2 ? " · " + esc(Bank.sourceName[q.source] || q.source) : ""}</bdi></span>${q.repeatOf ? `<span class="pill" title="${esc(t("b.repeatOf", {id: q.repeatOf}))}">${t("b.repeat")}</span>` : ""}${r ? `<span class="pill ${r.last && r.last.ok ? "sage" : "bad"}">${t("b.correctN", {c: r.c, n: r.n})}</span>` : ""}<span class="spacer"></span>
        <button class="icon-btn" data-flag="${esc(q.id)}" aria-pressed="${flags.has(q.id)}" aria-label="${esc(t("b.flagQ", {id: q.id}))}">${ICON.flag}</button>
        <button class="icon-btn" data-fav="${esc(q.id)}" aria-pressed="${favs.has(q.id)}" aria-label="${esc(t("b.favQ", {id: q.id}))}">${favs.has(q.id) ? ICON.starOn : ICON.star}</button></div>
        <div dir="ltr" lang="en" class="ltr"><p class="bstem">${hl(q.stem)}</p>
        <ul class="opts-list">${q.options.map((o, i) => `<li class="${show && i === q.answer ? "correct" : ""}">${LETTERS[i]}. ${hl(o)}${show && i === q.answer ? " ✓" : ""}</li>`).join("")}</ul>
        ${q.banks.length > 1 ? (sb ? "" : `<p class="small muted bsrc" dir="auto">${t("b.inBoth")}</p>`) : (srcLineText(q) ? `<p class="small muted bsrc">${hl(srcLineText(q))}</p>` : "")}</div>
        ${notes[q.id] ? `<p class="small bk-note"><strong>${t("b.yourNote")}</strong> <span dir="auto">${hl(notes[q.id])}</span></p>` : ""}
        ${show && q.explanation ? `<p class="small muted cx" dir="${cdir(q.explanation)}" style="margin-top:6px">${hl(q.explanation)}</p>` : ""}${show && q.memoryTrick ? `<p class="small cx bk-trick" dir="${cdir(q.memoryTrick)}">${hl(q.memoryTrick)}</p>` : ""}${show && q.note ? `<p class="small cx bk-warn" dir="${cdir(q.note)}">${esc(q.note)}</p>` : ""}</div>`; }).join("") + (list.length > shown.length ? `<p class="muted small" style="padding-top:12px">${t("r.andMore", {n: list.length - shown.length})}</p>` : "") : `<p class="muted">${t("b.noMatch")}</p>`;
    $$("[data-flag]").forEach(b => b.onclick = () => { User.toggleSet("flags", b.dataset.flag); draw(); });
    $$("[data-fav]").forEach(b => b.onclick = () => { User.toggleSet("favs", b.dataset.fav); draw(); });
    $("#practise").onclick = () => startSession("train", list.map(q => q.id), {feedback: User.prefs().feedback});
  };
  let tm = null; $("#q").addEventListener("input", e => { clearTimeout(tm); tm = setTimeout(() => { term = e.target.value.trim(); draw(); }, 150); });

  fillSrc(); if ($("#srcb") && routeSrc()) $("#srcb").value = routeSrc();
  $("#tp").onchange = () => { fillSrc(); draw(); }; $("#showans").onchange = draw; if ($("#srcb")) $("#srcb").onchange = draw;
  $$("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; $$("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); });
  draw();
  $("#bankfile").onchange = e => { const f = e.target.files && e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { let data; try { data = JSON.parse(rd.result); } catch(err) { openDialog({title: t("b.badJsonT"), body: `<p>${t("b.badJsonB")}</p>`, actions: [{label: t("common.ok"), cls: "btn-pri"}]}); return; }
      const errs = validateBank(data);
      if (errs.length) { openDialog({title: t("b.problemsT"), body: `<ul dir="auto">${errs.slice(0,12).map(x => `<li>${esc(x)}</li>`).join("")}</ul>${errs.length>12?`<p>${t("r.andMore", {n: errs.length-12})}</p>`:""}`, actions: [{label: t("common.ok"), cls: "btn-pri"}]}); return; }
      if (!Store.set("customBank", data)) { toast(t("b.tooLarge")); }
      useBank(data, "custom"); toast(t("b.loaded", {n: data.questions.length})); render(); };
    rd.onerror = () => toast(t("b.readErr")); rd.readAsText(f); };
  const rb = $("#resetbank"); if (rb) rb.onclick = async () => { Store.del("customBank"); await loadBank(); toast(t("b.restored")); render(); };
  $("#copyfmt").onclick = async () => { const data = {title: Bank.title, credit: Bank.credit || undefined, disclaimer: Bank.disclaimer || undefined, reportUrl: Bank.reportUrl || undefined, topics: Bank.topics, sources: Bank.sources, questions: Bank.questions}; toast(await copyText(JSON.stringify(data, null, 2)) ? t("b.copied") : t("r.copyNo")); };
}

// ---------- keyboard ----------
function shortcutsHelp() {
  const rows = [["1 – 5 / A – E","k.choose"],[t("k.arrows"),"k.nav"],["Enter","k.enter"],["F","k.flag"],["S","k.fav"],["H","k.hint"],["K","k.conf"],["N","k.notes"],["W","k.draw"],["P","k.pad"],["G","k.grid"],["?","k.help"]];
  openDialog({title: t("k.title"), body: `<table class="kbdtbl">${rows.map(r => `<tr><td><kbd dir="ltr">${esc(r[0])}</kbd></td><td>${t(r[1])}</td></tr>`).join("")}</table>`, actions: [{label: t("common.close"), cls: "btn-pri"}]});
}
document.addEventListener("keydown", e => {
  if (dlgStack.length) { if (e.key === "Escape") { e.preventDefault(); dlgStack[dlgStack.length-1].close("dismiss"); } return; }
  if ($(".langscreen")) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tg = e.target;
  const typing = tg && (tg.tagName === "TEXTAREA" || tg.tagName === "SELECT" || tg.isContentEditable || (tg.tagName === "INPUT" && !/^(checkbox|radio|button|submit|range|file)$/i.test(tg.type)));
  if (typing) { if (e.key === "Escape") tg.blur(); return; }
  if (!S || !$("#qpane")) { if (e.key === "?") { e.preventDefault(); shortcutsHelp(); } return; }
  const k = e.key, kl = k.toLowerCase(), id = S.qids[S.idx];
  const keyIdx = {"1":0,"2":1,"3":2,"4":3,"5":4,"6":5,"a":0,"b":1,"c":2,"d":3,"e":4}[kl];
  if (keyIdx != null) { e.preventDefault(); const b = $$(".opt")[keyIdx]; if (b && !b.disabled && !drawing) b.click(); return; }
  // arrows follow the reading direction: in Arabic (RTL) the left arrow moves forward
  const fwd = isRTL() ? "ArrowLeft" : "ArrowRight", back = isRTL() ? "ArrowRight" : "ArrowLeft";
  if (k === fwd) { e.preventDefault(); goto(S.idx + 1); }
  else if (k === back) { e.preventDefault(); goto(S.idx - 1); }
  else if (k === "Enter") { if (tg && tg.tagName === "BUTTON") return; e.preventDefault(); const cb = $("#checkbtn"); if (cb && !cb.disabled) cb.click(); else if (S.idx < S.qids.length - 1) goto(S.idx + 1); else finishSession(false); }
  else if (kl === "f") { e.preventDefault(); $("#flagbtn").click(); }
  else if (kl === "s") { e.preventDefault(); $("#favbtn").click(); }
  else if (kl === "h") { const hb = $("#hintbtn"); if (hb) { e.preventDefault(); hb.click(); } }
  else if (kl === "n") { e.preventDefault(); $("#notebtn").click(); }
  else if (kl === "w") { e.preventDefault(); setDrawing(!drawing); }
  else if (kl === "p") { e.preventDefault(); openScratchpad(id); }
  else if (kl === "g") { e.preventDefault(); navOpen ? closeNav() : openNav(); }
  else if (kl === "k") { e.preventDefault(); const seq = [undefined, "sure", "unsure", "guess"]; const nx = seq[(seq.indexOf(S.conf[id]) + 1) % seq.length]; const b = nx ? $(`[data-conf="${nx}"]`) : $(`[data-conf="${S.conf[id]}"]`); if (b) b.click(); }
  else if (k === "Escape") { if (drawing) setDrawing(false); else if (navOpen) closeNav(); }
  else if (k === "?") { e.preventDefault(); shortcutsHelp(); }
});

window.addEventListener("storage", e => {
  if (!e.key || e.key.indexOf("medq.v1.") !== 0) return;
  if (S && e.key === "medq.v1." + slotOf(S.mode)) { const fresh = getActive(slotOf(S.mode)); if (!fresh || fresh.id !== S.id) { S = null; toast(t("s.otherTab")); go("home"); } }
});

// ---------- boot ----------
(async function boot() {
 try {
  const saved = storedLang();
  LANG = saved === "ar" ? "ar" : "en";
  applyLang();
  $("#langbtn").onclick = toggleLang;
  await loadBank();
  window.__medqBooted = true;
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p => { if (!p) navigator.storage.persist().catch(() => {}); }).catch(() => {}); } catch(e) {}
  if (!saved) { const chosen = await langScreen(); setLang(chosen, false); }
  const ex = Store.get("active.exam", null);
  if (ex && !ex.submitted && ex.endsAt && now() >= ex.endsAt && ex.qids.every(id => Bank.byId[id])) { S = ex; await finishSession("time"); return; }
  render();
 } catch (e) { if (window.__medqFail) window.__medqFail((e && (e.message || e)) || "Startup error"); else throw e; }
})();
