رةً؟","whyWrong":["الـ fertilization بيحصل قبل تكوين الـ syncytiotrophoblast بكتير.","الـ cleavage بيحصل قبل تكوين الـ syncytiotrophoblast.",null,"الـ pronuclei بيظهروا وقت الـ fertilization (اليوم الأول)."]},{"id":"EM2026P-17","topic":"embryo","concept":"Gametogenesis","source":"EM2026P","stem":"Which of the following is a condition characterized by absent sperms?","options":["Teratozoospermia","Asthenozoospermia","Oligospermia","Azoospermia"],"answer":3,"explanation":"اضطرابات عدد الـ sperms:\n• Azoospermia: absence of the sperms (مفيش sperms خالص).\n• Oligospermia: أقل من 20 million/ml.","memoryTrick":"A-zoo = صفر.","stemAr":"أنهي حالة من دول بتتميز بغياب الـ sperms؟","whyWrong":["⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","الـ oligospermia = عدد قليل (أقل من 20 million/ml) مش غياب تام.",null]},{"id":"EM2026P-18","topic":"embryo","concept":"Female cycles & hormones","source":"EM2026P","stem":"Endometrial biopsy taken on day 23 of the cycle (28 days cycle) shows straight glands. This finding suggests deficiency of which hormone?","options":["Estrogen","Progesterone","LH","FSH"],"answer":1,"explanation":"في الـ secretory phase (16-28) تحت تأثير الـ progesterone اللي بيفرزه الـ corpus luteum: الخلايا بتبقى columnar، والغدد convoluted ومليانة إفراز، والـ spiral arteries بتتسع وتتلوى. فلو الغدد straight يوم 23 يبقى فيه نقص progesterone.","memoryTrick":"Straight glands = مفيش Progesterone.","stemAr":"endometrial biopsy اتاخدت يوم 23 من الدورة (دورة 28 يوم) وبيّنت straight glands (غدد مستقيمة). ده بيشير لنقص أنهي hormone؟","whyWrong":["الـ estrogen بيعمل الـ proliferative phase، لكن الغدد الـ convoluted في الـ secretory phase بتاعة الـ progesterone.",null,"الـ LH بيعمل الـ ovulation، مش هو اللي بيأثر مباشرةً على شكل الغدد.","الـ FSH بيخلي الـ follicles تنمو في المبيض."]},{"id":"EM2026P-19","topic":"embryo","concept":"Gametogenesis","source":"EM2026P","stem":"Which of the following processes involves morphological transformation of spermatids into mature sperm?","options":["Spermatogenesis","Spermiogenesis","Spermiation","Sperm capacitation"],"answer":1,"explanation":"الـ spermiogenesis = تحوّل الـ spermatid الدايري لـ spermatozoon (mature sperm)، وليها 4 phases: Golgi phase، Cap-acrosome، Tail phase، Maturation phase.","memoryTrick":"Spermio = تغيير شكل.","stemAr":"أنهي عملية من دول فيها تحوّل شكلي للـ spermatids لـ sperm ناضج؟","whyWrong":["الـ spermatogenesis هي العملية كلها من الـ spermatogonia لحد الـ sperms، والـ spermiogenesis آخر مرحلة فيها.",null,"⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","الـ capacitation = adaptation للـ sperm في الـ female genital tract."]},{"id":"EM2026P-20","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2026P","stem":"The bivalent chromosomes separate from one another at the chiasma in which stage of meiosis?","options":["Anaphase 2","Metaphase 1","Metaphase 2","Anaphase 1"],"answer":3,"explanation":"في anaphase I الـ homologous chromosomes (bivalents) بيتفصلوا عن بعض عند الـ chiasmata ويروحوا للأقطاب.","memoryTrick":"Anaphase I = الأزواج تتفصل.","stemAr":"الـ bivalent chromosomes بتنفصل عن بعض عند الـ chiasma في أنهي مرحلة من الـ meiosis؟","whyWrong":["anaphase 2 بينفصل فيها الـ chromatids.","metaphase 1 الـ bivalents بتترص.","metaphase 2 الـ chromosomes بتترص.",null]},{"id":"EM2026P-21","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2026P","stem":"Which of the following represents a structural chromosomal aberration?","options":["Trisomy","Monosomy","Turner's syndrome","Deletion"],"answer":3,"explanation":"الـ deletion structural aberration. الـ trisomy والـ monosomy والـ Turner numerical.","memoryTrick":"Structural = حتة اتكسرت/اتشالت.","stemAr":"أنهي واحد من دول بيمثل structural chromosomal aberration؟","whyWrong":["الـ trisomy numerical.","الـ monosomy numerical.","الـ Turner numerical (45,X).",null]},{"id":"EM2026P-22","topic":"histo","concept":"Cell cycle & division","source":"EM2026P","stem":"Apoptosis, which of the following describes it?","options":["It is a physiological condition","The cells add their organelles and nucleus","Occurs normally at the end of life span of the cell","May result from exposure to toxins and anemia"],"answer":2,"explanation":"الـ apoptosis هو active programmed cell death بيحصل normally في آخر عمر الخلية (end-of-life span). الخلايا مبتنتفخش، بالعكس حجمها بيصغر، والنواة بيحصلها pyknosis ثم karyorrhexis ثم karyolysis، والـ cytoplasm بيتكسر لـ vesicles كبيرة تبلعها الـ macrophages.","memoryTrick":"Apoptosis = موت مبرمج في آخر عمر الخلية 🍂 / Necrosis = مرضي وبتنفجر 💥.","stemAr":"الـ apoptosis، أنهي واحدة من دول بتوصفه؟","whyWrong":["الـ necrosis هو اللي بيتوصف إنه pathological condition. أما الـ apoptosis فوصفه الأدق إنه programmed وبيحصل normally في آخر عمر الخلية، وده نص الاختيار C.","في الـ apoptosis الخلايا حجمها بيصغر (decrease in size)، والنواة بتتكسر وتختفي. مفيش إضافة organelles.",null,"الـ toxins والـ anoxia سبب للـ necrosis (pathological condition)، مش الـ apoptosis."],"note":"إجابة ملزمة الأسئلة كانت A) physiological condition، والإجابة اتصححت لـ C."},{"id":"EM2026P-23","topic":"histo","concept":"Cell cycle & division","source":"EM2026P","stem":"Which of the following represents a potentially renewable cell?","options":["Nerve cell","Liver cell","Cardiac muscle cell","Blood cell"],"answer":1,"explanation":"الخلايا من حيث التجدد 3 أنواع:\n• Potentially renewable: خلايا specialized بتروح G0 بره الـ cycle لكن تقدر ترجع تكمّل (transient exit) لو حصل نقص أو احتاجنا تعويض، زي الـ liver cells (لو اتشال جزء من الكبد بيرجع لحجمه الطبيعي).\n• Non-renewing: heart muscles و nerve cells.\n• Continuously turn over: blood cells و sperms.","memoryTrick":"Liver = نايم في G0 بس يصحى لو احتاجته 😴➡️🔄","stemAr":"أنهي واحدة من دول بتمثل خلية potentially renewable (ممكن تتجدد)؟","whyWrong":["الـ nerve cells من الـ non-renewing cells (permanent exit).",null,"الـ cardiac (heart) muscle من الـ non-renewing cells.","الـ blood cells من الـ continuously turn over cells: مش بتنقسم لكن بتتعوض من الـ stem cells."]},{"id":"EM2026P-24","topic":"histo","concept":"Cell cycle & division","source":"EM2026P","stem":"What is the nuclear description of the interphase in cell cycle?","options":["It lasts for a short period","The daughter cell contains 92 chromosomes in the G1 phase","The changes are visible with the microscope","The daughter cell contains 92 chromosomes in the G0 phase"],"answer":1,"explanation":"","memoryTrick":null,"stemAr":"إيه وصف النواة في الـ interphase في الـ cell cycle؟","whyWrong":null,"note":"⚠️ يفضل مراجعة الإجابة مع الدكتور."},{"id":"EM2026P-25","topic":"histo","concept":"Cell cycle & division","source":"EM2026P","stem":"Which of the following occurs during the prophase of mitosis?","options":["Disappearance of nuclear membrane","The chromosomes are arranged in the equatorial plate","The chromosomes split longitudinally at the centromere","The nucleolus reappears"],"answer":0,"explanation":"في الـ prophase الـ nuclear membrane والـ nucleolus بيختفوا والـ chromosomes بتتكثف.","memoryTrick":"Prophase = النواة تختفي.","stemAr":"أنهي واحدة من دول بتحصل في الـ prophase بتاعة الـ mitosis؟","whyWrong":[null,"الترص على الـ equatorial plate في الـ metaphase.","انقسام الـ centromere في الـ anaphase.","رجوع الـ nucleolus في الـ telophase."]},{"id":"EM2026P-26","topic":"histo","concept":"Nucleus & chromatin","source":"EM2026P","stem":"What is the nuclear envelope?","options":["A single membrane","A double membrane with pores","Without pores","Continuous with the Golgi apparatus"],"answer":1,"explanation":"الـ nuclear envelope double membrane فيها pores.","memoryTrick":"Double + Pores.","stemAr":"إيه هو الـ nuclear envelope؟","whyWrong":["غشائين مش واحد.",null,"فيه pores.","متصل بالـ rER مش الـ Golgi."]},{"id":"EM2026P-27","topic":"histo","concept":"Cell membrane & transport","source":"EM2026P","stem":"The cell coat (glycocalyx) is formed of which of the following?","options":["Integral protein","Peripheral proteins","Glycosaminoglycans","Glycoproteins and glycolipids"],"answer":3,"explanation":"الـ cell coat (glycocalyx) هو الـ carbohydrate component للغشا، ومكوّن من glycoproteins و glycolipids على السطح الخارجي.","memoryTrick":"Glyco-proteins + Glyco-lipids.","stemAr":"الـ cell coat (glycocalyx) مكوّن من أنهي واحد من دول؟","whyWrong":["الـ integral proteins جزء من الـ protein component للغشا، مش الـ cell coat.","الـ peripheral proteins جزء من الـ protein component، مش الـ cell coat.","الـ glycosaminoglycans مش من مكونات الـ cell coat المذكورة. المكونات: glycoproteins و glycolipids.",null]},{"id":"EM2026P-28","topic":"histo","concept":"Nucleus & chromatin","source":"EM2026P","stem":"Euchromatin is characterized by which of the following?","options":["Dark staining and coiled DNA","Light staining and uncoiled DNA","Being transcriptionally inactive","Located only at the nuclear periphery"],"answer":1,"explanation":"الـ euchromatin (extended, active): في الـ LM بيظهر pale basophilic (vesicular nucleus)، بيمثل chromosomes مفرودة (uncoiled) وفيه الـ active genes. في الـ EM بيظهر fine granules.","memoryTrick":"Eu = Light & Active.","stemAr":"الـ euchromatin بيتميز بأنهي واحدة من دول؟","whyWrong":["ده وصف الـ heterochromatin (condensed, coiled).",null,"الـ euchromatin فيه الـ active genes، مش inactive.","الـ peripheral chromatin (على الـ inner surface بتاع الـ nuclear membrane) من أماكن الـ heterochromatin."]},{"id":"EM2026P-29","topic":"histo","concept":"Nucleus & chromatin","source":"EM2026P","stem":"The nucleolus is involved in which of the following?","options":["DNA replication","rRNA synthesis and ribosomal subunit assembly","Protein degradation","Lipid metabolism"],"answer":1,"explanation":"الـ nucleolus وظيفته تكوين الـ rRNA والـ ribosomal subunits اللي بتعدّي من الـ nuclear pores للـ cytoplasm.","memoryTrick":"Nucleolus = Ribosome factory.","stemAr":"الـ nucleolus له دور في أنهي واحدة من دول؟","whyWrong":["الـ DNA duplication بتحصل في الـ S phase (في الـ chromatin)، مش وظيفة الـ nucleolus.",null,"الهضم جوه الخلية وظيفة الـ lysosomes.","الـ lipid synthesis وظيفة الـ sER."]},{"id":"EM2026P-30","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026P","stem":"Detoxification of drugs in liver cells is the function of which organelle?","options":["rER","SER","Golgi apparatus","Lysosome"],"answer":1,"explanation":"من وظايف الـ sER الـ detoxification للأدوية والهرمونات والكحول في الـ liver cells.","memoryTrick":"Detox = Smooth.","stemAr":"الـ detoxification بتاع الأدوية في خلايا الكبد وظيفة أنهي organelle؟","whyWrong":["الـ rER لتصنيع البروتينات اللي بتتفرز.",null,"الـ Golgi للـ packing وتعديل البروتينات.","الـ lysosome للـ intracytoplasmic digestion."]},{"id":"EM2026P-31","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2026P","stem":"Which of the following represents a special stain for mitochondria?","options":["PAS stain","Janus green","Sudan black","Hematoxylin"],"answer":1,"explanation":"الـ mitochondria في الـ H&E بتظهر eosinophilic. بالصبغات الخاصة بتظهر rods أو granules: dark blue بالـ iron hematoxylin، و green بالـ Janus green.","memoryTrick":"Janus Green = Mitochondria 💚","stemAr":"أنهي واحد من دول special stain للـ mitochondria؟","whyWrong":["الـ PAS بيصبغ الـ glycogen والـ plasma membrane.",null,"الـ Sudan black بيصبغ الـ fat (black globules).","الـ hematoxylin لوحده مش الصبغة الخاصة. الخاص: iron hematoxylin أو Janus green."]},{"id":"EM2026P-32","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2026P","stem":"Type of intermediate filaments found in the epithelium:","options":["Cytokeratin","Vimentin","Neuro filaments","Desmin"],"answer":0,"explanation":"الـ intermediate filaments (8-10 nm) للدعم، وأنواعها:\n• Cytokeratin: epithelial cells (وبتكوّن الشعر والضوافر).\n• Vimentin: connective tissue و vascular smooth muscle.\n• Desmin: muscle cells.\n• Neurofilaments: neurons.\n• Glial filaments: glial cells.\n• Lamins: nuclear envelope.","memoryTrick":"Keratin = Epithelium.","stemAr":"نوع الـ intermediate filaments الموجود في الـ epithelium:","whyWrong":[null,"الـ vimentin في الـ connective tissue والـ vascular smooth muscle.","الـ neurofilaments في الـ neurons.","الـ desmin في الـ muscle cells (بيربط الـ myofibrils)."]},{"id":"EM2026P-33","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2026P","stem":"Which of the following statements is incorrect?","options":["Microtubules are involved in ciliary movement and intracellular transport.","The cis (forming) face of Golgi apparatus is where secretory granules are formed.","The microtubules of the centrioles and in the basal body of cilia have a 9x3 arrangement.","Ribosomes, made of rRNA and protein, are the site of protein synthesis."],"answer":1,"repeatOf":"EM2023-11","explanation":"الجملة الغلط B: الـ cis face (Entry = Convex = Forming = Immature) بتستقبل الـ transfer vesicles من الـ rER. أما الـ secretory vesicles فبتطلع من الـ trans face (Exit = Concave = Secretory = Mature).","memoryTrick":"Cis = داخل (من الـ rER) / Trans = خارج (إفراز).","stemAr":"أنهي جملة من دول غلط؟","whyWrong":["جملة صح: من وظايف الـ microtubules النقل جوه الخلية، والـ cilia الـ core بتاعها microtubules. والسؤال عن الغلط.",null,"جملة صح: جدار الـ centriole 9 bundles كل واحدة 3 MTs (triplets)، والـ basal body هو centriole بنفس الترتيب.","جملة صح: الـ ribosomes مكوّنة من rRNA وبروتين ووظيفتها الـ protein synthesis."]},{"id":"ES2026P-01","topic":"anat","concept":"Scalp & face","source":"ES2026P","stem":"The occipital belly of occipitofrontalis is supplied by which of the following?","options":["Greater occipital nerve","Posterior auricular branch of facial nerve","Supratrochlear nerve","Temporal branch of facial nerve"],"answer":1,"explanation":"الـ occipitofrontalis:\n• الـ occipital belly بيتغذى من الـ posterior auricular branch of facial nerve.\n• الـ frontal belly بيتغذى من الـ temporal branch of facial nerve.","memoryTrick":"Occipital = Posterior auricular.","stemAr":"الـ occipital belly بتاع الـ occipitofrontalis بيتغذى عصبيًا من أنهي واحد من دول؟","whyWrong":["الـ greater occipital nerve sensory (من الـ cervical nerves).",null,"الـ supratrochlear nerve sensory (من الـ trigeminal).","الـ temporal branch بيغذي الـ frontal belly."]},{"id":"ES2026P-02","topic":"anat","concept":"Scalp & face","source":"ES2026P","stem":"Which of the following is the dangerous area of the scalp?","options":["Subaponeurotic space","Connective tissue layer","Aponeurotic layer","Periosteal layer"],"answer":0,"explanation":"الطبقة الرابعة في الـ scalp هي الـ loose areolar tissue (بتملا الـ subaponeurotic space)، واسمها dangerous layer لأن الـ emissary veins بتفتح فيها وبتنقل أي infection لجوه المخ (الـ venous sinuses). والنزيف فيها بيعمل swelling في الـ scalp كله و black eye.","memoryTrick":"تحت الـ aponeurosis = خطر.","stemAr":"أنهي واحدة من دول هي الـ dangerous area في الـ scalp؟","whyWrong":[null,"الـ connective tissue (dense subcutaneous) فيها أوعية وأعصاب الـ scalp، والنزيف منها بيبقى profuse لأن الألياف بتمنع الأوعية تنكمش، لكنها مش الـ dangerous layer.","الـ aponeurosis طبقة tendinous بتوصل الـ frontal بالـ occipital belly، والخطر في المسافة اللي تحتها.","الـ pericranium loosely attached للعظم لكن firmly adherent للـ sutures، ومش هي الـ dangerous layer."]},{"id":"ES2026P-03","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2026P","stem":"Which of the following bones are ossified by membranous ossification?","options":["Vault of the skull","Humerus","Femur","Radius"],"answer":0,"explanation":"الـ vault of the skull والـ face بيتكونوا بـ membranous ossification، أما عظام الـ upper و lower limbs (زي الـ humerus والـ femur والـ radius) فبـ cartilaginous ossification.","memoryTrick":"Vault = Membrane.","stemAr":"أنهي عظام من دول بتتعظم بالـ membranous ossification؟","whyWrong":[null,"الـ humerus من عظام الـ upper limb: cartilaginous ossification.","الـ femur من عظام الـ lower limb: cartilaginous ossification.","الـ radius من عظام الـ upper limb: cartilaginous ossification."]},{"id":"ES2026P-04","topic":"anat","concept":"Movements","source":"ES2026P","stem":"In which movement does the palm face posterior?","options":["Flexion","Supination","Pronation","Protraction"],"answer":2,"explanation":"في الـ pronation الـ palm بتبص لورا.","memoryTrick":"Pronation = Posterior.","stemAr":"في أنهي حركة الـ palm بتبص لورا (posterior)؟","whyWrong":["الـ flexion = bending ناحية الـ ventral surface، مش هي اللي بتخلي الـ palm تبص لورا.","الـ supination بترجّع الـ palm لقدام.",null,"الـ protraction = تحريك لقدام زي حركة الفك السفلي."]},{"id":"ES2026P-05","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026P","stem":"As regarding to Sex chromosome abnormalities, monosomy means:","options":["Klinefelter's syndrome","Super female syndrome","Turner's syndrome","Down's syndrome"],"answer":2,"explanation":"الـ Turner syndrome (45,X0) = monosomy of sex chromosome: أنثى عندها X واحد بس.","memoryTrick":"Mono = واحد ➜ Turner.","stemAr":"بخصوص عيوب الـ sex chromosomes، الـ monosomy معناها:","whyWrong":["الـ Klinefelter (47,XXY) = trisomy of sex chromosome.","الـ multiple X (47,XXX) = trisomy of sex chromosome.",null,"الـ Down = trisomy 21، في autosome مش sex chromosome."]},{"id":"ES2026P-06","topic":"histo","concept":"Cell cycle & division","source":"ES2026P","stem":"In a patient with a genetic defect in tubulin, which of the following cellular structures would be most directly affected?","options":["Formation of the nuclear envelope","Assembly of the mitotic spindle","Organization of microfilaments","Synthesis of ribosomal RNA"],"answer":1,"explanation":"الـ microtubules مكوّنة من alpha و beta tubulin، ومن وظايفها تكوين الـ mitotic spindle. وفي الـ G2 الخلية بتصنع tubulin مخصوص للـ microtubules بتاعة الـ mitosis.","memoryTrick":"Tubulin ➜ Microtubules ➜ Spindle.","stemAr":"مريض عنده خلل جيني في الـ tubulin، أنهي structure في الخلية من دول هيتأثر بشكل مباشر؟","whyWrong":["الـ nuclear envelope غشائين (unit membranes)، مش مكوّن من tubulin.",null,"الـ microfilaments مكوّنة من actin مش tubulin.","الـ rRNA بيتصنع في الـ nucleolus."]},{"id":"ES2026P-07","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2026P","stem":"Lipofuscin pigment accumulation in neurons is a sign of:","options":["Active phagocytosis","Aging","Melanin overproduction","Glycogen storage"],"answer":1,"explanation":"الـ lipofuscin endogenous pigment في الـ cardiac muscle والـ nerve cells: waste products بتتجمع مع السن. وهي كمان مصير الـ residual bodies اللي بتتراكم كـ age pigments في الخلايا طويلة العمر.","memoryTrick":"Lipofuscin = Age pigment 👴","stemAr":"تراكم صبغة الـ lipofuscin في الـ neurons علامة على:","whyWrong":["الـ lipofuscin بيتراكم مع السن في الخلايا طويلة العمر، مش علامة على phagocytosis نشطة.",null,"الـ melanin pigment مختلف: في الجلد والشعر والعين ويحمي من الـ UV.","الـ glycogen stored food (inclusion)، مش pigment."]},{"id":"ES2026P-08","topic":"histo","concept":"Nucleus & chromatin","source":"ES2026P","stem":"The perinuclear space is continuous with which of the following?","options":["Golgi cisternae","Rough endoplasmic reticulum","Mitochondrial intermembrane space","Lysosomal lumen"],"answer":1,"explanation":"الـ nuclear envelope غشائين بينهم perinuclear space. الـ outer nuclear membrane عليها polyribosomes وهي continuous مع الـ cisternae بتاعة الـ rER.","memoryTrick":"Nuclear envelope = امتداد الـ rER.","stemAr":"الـ perinuclear space متصلة بأنهي واحد من دول؟","whyWrong":["الـ outer nuclear membrane continuous مع الـ rER، مش الـ Golgi.",null,"الـ mitochondria ليها غشائين خاصين بيها بينهم intermembranous space، مش متصلة بالـ nuclear envelope.","الـ lysosome vesicle مقفولة بـ single unit membrane."]},{"id":"ES2026P-09","topic":"histo","concept":"Nucleus & chromatin","source":"ES2026P","stem":"Which of the following is true regarding heterochromatin?","options":["It is transcriptionally active","It is predominant in protein-synthesizing cells","It is concentrated at the nuclear periphery","It stains lightly with basic dyes"],"answer":2,"explanation":"من أماكن الـ heterochromatin: peripheral chromatin لازق في الـ inner surface بتاع الـ nuclear membrane، و chromatin islands في الـ nuclear sap، و nucleolus-associated chromatin. والـ heterochromatin condensed وفيه inactive genes.","memoryTrick":"Hetero = على الأطراف وغامق.","stemAr":"أنهي واحدة من دول صح بخصوص الـ heterochromatin؟","whyWrong":["الـ heterochromatin فيه inactive genes.","الخلايا اللي بتصنع بروتين فيها euchromatin (vesicular nucleus).",null,"اللي بيظهر pale (فاتح) هو الـ euchromatin."]},{"id":"ES2026P-10","topic":"histo","concept":"Cell cycle & division","source":"ES2026P","stem":"The cleavage furrow develops at which of the following stages of mitosis?","options":["Anaphase","Telophase","Prophase","Metaphase"],"answer":1,"explanation":"في الـ telophase بيحصل constriction عند الـ equatorial plane (cleavage furrow) ويكمل لحد ما الـ cytoplasm والـ organelles يتقسموا لاتنين. الـ constriction ده بيحصل بانقباض الـ actin microfilaments.","memoryTrick":"Telophase = الخلية تتقسم لاتنين ✂️","stemAr":"الـ cleavage furrow بيتكون في أنهي مرحلة من مراحل الـ mitosis؟","whyWrong":["في الـ anaphase كل d-chromosome بيتقسم عند الـ centromere والـ chromatids بتروح للقطبين.",null,"في الـ prophase الـ chromosomes بتبان والـ nucleoli والـ nuclear envelope بيختفوا.","في الـ metaphase الـ chromosomes بتترص على الـ equatorial plane."]},{"id":"ES2026P-11","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026P","stem":"What is the position of centromere in submetacentric chromosomes?","options":["At the center of the chromosome","Midway between the centre and upper end","Very close to upper end","Terminal"],"answer":1,"explanation":"في الـ submetacentric الـ centromere في المسافة بين النص والطرف، فبيبقى فيه short arm و long arm.","memoryTrick":"Sub = نص ونص بعيد شوية.","stemAr":"مكان الـ centromere في الـ submetacentric chromosomes فين؟","whyWrong":["center = metacentric.",null,"قريب جدًا من الطرف = acrocentric.","terminal = telocentric."]},{"id":"ES2026P-12","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026P","stem":"In which of the following chromosomal aberrations, the chromosome divides transversely at the centromeres instead of longitudinally during anaphase of mitosis?","options":["Inversion","Isochromosomes","Ring Chromosome","Reciprocal translocation"],"answer":1,"explanation":"الـ isochromosome: الـ chromosome بينقسم بالعرض (transversely) عند الـ centromere بدل ما ينقسم بالطول أثناء الـ anaphase of mitosis. النتيجة 2 chromatids مش متشابهين: واحد بذراعين طوال وواحد بذراعين قصار. وبيحصل غالبًا في الـ submetacentric chromosomes.","memoryTrick":"Iso = انقسام بالعرض.","stemAr":"في أنهي chromosomal aberration من دول، الـ chromosome بينقسم بالعرض (transversely) عند الـ centromere بدل ما ينقسم بالطول أثناء الـ anaphase بتاعة الـ mitosis؟","whyWrong":["الـ inversion: كسرين في الـ chromosome والحتة بتلتحم تاني مقلوبة (pericentric أو paracentric).",null,"الـ ring chromosome: كسرين وفقد الأطراف والتحام في شكل حلقة.","الـ reciprocal translocation: تبادل أجزاء بين اتنين chromosomes."]},{"id":"ES2026P-13","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2026P","stem":"The membrane of cytoplasmic vesicles can be added to the cell membrane in which of the following processes?","options":["Phagocytosis","Endocytosis","Pinocytosis","Exocytosis"],"answer":3,"explanation":"في الـ exocytosis الـ vesicle الغشائية بتندمج مع الـ cell membrane وتطلّع محتواها للـ extracellular space، وغشا الـ vesicle بيتضاف للـ plasma membrane.","memoryTrick":"Exo = الحويصلة تلزق في الغشا وتزوده.","stemAr":"غشا الـ cytoplasmic vesicles ممكن يتضاف للـ cell membrane في أنهي عملية من دول؟","whyWrong":["الـ phagocytosis نوع من الـ endocytosis: الخلية بتبلع مواد لجوه في phagosome، مش بتضيف غشا vesicle للـ cell membrane.","الـ endocytosis = bulk uptake لجوه الخلية، عكس الـ exocytosis.","الـ pinocytosis نوع من الـ endocytosis: بتكوّن pinocytic vesicles لجوه.",null]},{"id":"ES2026P-14","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2026P","stem":"Which of the following describes the histological structure of Golgi apparatus?","options":["Produces cytoplasmic basophilia with H&E","Appears as a network of brown granules with silver stain","Appears as a basophilic area around the nucleus in plasma cell","The Cis face represents the mature surface"],"answer":1,"explanation":"الـ Golgi مبيظهرش في الـ H&E. بالـ silver (Ag) بيظهر network من brown granules & fibrils. في الـ plasma cell بيبان negative image (منطقة فاتحة). والـ trans face هو الـ mature، والـ cis هو الـ immature.","memoryTrick":"Golgi + Silver = Brown network.","stemAr":"أنهي واحدة من دول بتوصف التركيب الـ histological للـ Golgi apparatus؟","whyWrong":["الـ Golgi مبيظهرش في الـ H&E، واللي بيسبب basophilia هو الـ ribosomes (RNA).",null,"في الـ plasma cell الـ Golgi بيبان منطقة فاتحة unstained (negative image)، مش basophilic.","الـ cis face = immature (forming)، والـ mature هو الـ trans face."]},{"id":"ES2026G2-01","topic":"anat","concept":"Movements","source":"ES2026G2","stem":"Movement of the shoulder inferior is termed which of the following?","options":["Protraction","Elevation","Depression","Retraction"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"تحريك الكتف لتحت اسمه depression.","memoryTrick":"Depression = لتحت ⬇️.","stemAr":"حركة الكتف لتحت اسمها إيه؟","whyWrong":["الـ protraction لقدام.","الـ elevation لفوق.",null,"الـ retraction لورا."]},{"id":"ES2026G2-02","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2026G2","stem":"During the X-ray examination of a child, the bones appeared incomplete. The physician explained that the bones are still in the process of growing. Which of the following structures is responsible for increase the thickness of the bone?","options":["Periosteum","Endosteum","Epiphyseal plate (growth plate)","Articular cartilage"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"العظمة بتتخن بترسيب عظم تحت الـ periosteum بالـ osteoblasts (subperiosteal deposition)، والـ osteoclasts بتعمل الـ marrow cavity.","memoryTrick":"Thickness = Periosteum / Length = Plate.","stemAr":"في أشعة X لطفل، العظام ظهرت مش مكتملة، والدكتور شرح إن العظام لسه بتنمو. أنهي structure من دول مسئول عن زيادة تخن (thickness) العظمة؟","whyWrong":[null,"الـ endosteum مش هو المسئول عن التخن. التخن من الترسيب تحت الـ periosteum.","الـ growing plate للطول.","الـ articular cartilage بيغطي أسطح المفاصل."]},{"id":"ES2026G2-03","topic":"anat","concept":"Scalp & face","source":"ES2026G2","stem":"In surgical procedures or trauma, which layer of the scalp is referred to as the danger area?","options":["Skin of the scalp","Connective tissue layer (dense subcutaneous tissue)","Loose areolar tissue layer","Pericranium"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الطبقة الرابعة في الـ scalp هي الـ loose areolar tissue (بتملا الـ subaponeurotic space)، واسمها dangerous layer لأن الـ emissary veins بتفتح فيها وبتنقل أي infection لجوه المخ (الـ venous sinuses). والنزيف فيها بيعمل swelling في الـ scalp كله و black eye.","memoryTrick":"L = Lethal.","stemAr":"في العمليات الجراحية أو الإصابات، أنهي طبقة من الـ scalp بيتقال عليها الـ danger area؟","whyWrong":["الـ skin الطبقة السطحية (فيها sebaceous glands و hair follicles)، مش الـ dangerous layer.","الـ connective tissue (dense subcutaneous) فيها أوعية وأعصاب الـ scalp، والنزيف منها بيبقى profuse لأن الألياف بتمنع الأوعية تنكمش، لكنها مش الـ dangerous layer.",null,"الـ pericranium loosely attached للعظم لكن firmly adherent للـ sutures، ومش هي الـ dangerous layer."]},{"id":"ES2026G2-04","topic":"embryo","concept":"Implantation & second week","source":"ES2026G2","stem":"An embryo shows failure of formation of primary yolk sac cavity. Which layer of the bilaminar disc is primarily affected?","options":["Hypoblast","Epiblast","Cytotrophoblast","Syncytiotrophoblast"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ primary yolk sac بيتكون من الـ hypoblast.","memoryTrick":"Hypo ➜ Yolk.","stemAr":"embryo فيه فشل في تكوين الـ primary yolk sac cavity. أنهي طبقة من الـ bilaminar disc متأثرة أساسًا؟","whyWrong":[null,"الـ epiblast للـ amnion.","مش من الـ disc.","مش من الـ disc."]},{"id":"ES2026G2-05","topic":"embryo","concept":"Implantation & second week","source":"ES2026G2","stem":"A placenta later shows placenta previa. The abnormality most likely originated from implantation of the blastocyst in which of the followings?","options":["Fundus of uterus","Posterior uterine wall","Lower uterine segment","Myometrium"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ normal implantation في الـ posterior wall of the uterus near the fundus. أما الـ placenta previa فهي implantation جوه الرحم قريب من الـ internal os (الجزء السفلي).","memoryTrick":"Previa = تحت.","stemAr":"مشيمة ظهر فيها بعد كده placenta previa. العيب ده غالبًا جاي من إن الـ blastocyst زرع فين؟","whyWrong":["الـ fundus قريب من المكان الطبيعي للـ implantation.","الـ posterior wall (near the fundus) هو المكان الطبيعي.",null,"الـ placenta previa معناها implantation قريب من الـ internal os، مش في الـ myometrium."]},{"id":"ES2026G2-06","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026G2","stem":"A 15-year-old girl presents with Down syndrome. What is Her karyotype?","options":["46,XX","46,XY","45,X","47,XX"],"answer":3,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ Down syndrome = trisomy 21 (2n+1)، يعني 47 chromosome. في البنت: 47,XX.","memoryTrick":"Down = 47.","stemAr":"بنت عندها 15 سنة عندها Down syndrome. إيه الـ karyotype بتاعها؟","whyWrong":["46,XX ده karyotype أنثى طبيعي.","46,XY ده karyotype ذكر طبيعي.","45,X0 ده الـ Turner syndrome.",null]},{"id":"ES2026G2-07","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026G2","stem":"Which of the following is considered as aneuploidy?","options":["Triploid","Trisomy","Tetraploid","Polyploidy"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"ES2026G1-10","explanation":"الـ numerical aberrations نوعين:\n• Euploidy: مضاعف كامل للعدد (triploid 3n = 69، tetraploid 4n = 92، polyploidy).\n• Aneuploidy: مش مضاعف كامل، زيادة أو نقص chromosome واحد: trisomy (2n+1) أو monosomy (2n-1).","memoryTrick":"Aneuploidy = chromosome واحد زيادة/ناقص / Euploidy = set كامل.","stemAr":"أنهي واحد من دول يعتبر aneuploidy؟","whyWrong":["الـ triploid (3n) نوع من الـ euploidy.",null,"الـ tetraploid (4n) نوع من الـ euploidy.","الـ polyploidy نوع من الـ euploidy."]},{"id":"ES2026G2-08","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2026G2","stem":"Which of the following describes the centrioles?","options":["Appear as two dark bodies with H&E","Share in the formation of cilia","Present as two pairs in non-dividing cells","Formed by dynamic microtubules"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"من وظايف الـ centrioles إنها بتشارك في تكوين الـ cilia والـ flagella (الـ centrioles بتتضاعف وتعمل الـ basal bodies). في الـ LM بتظهر بالـ iron hematoxylin، وفي الـ non-dividing cells بيبقى فيه pair واحد، وجدارها من stable microtubules.","memoryTrick":"Centriole ➜ Cilia.","stemAr":"أنهي واحدة من دول بتوصف الـ centrioles؟","whyWrong":["الـ centrioles بتبان two dark bodies بالـ iron hematoxylin، مش الـ H&E.",null,"في الـ non-dividing cells فيه 2 cylinders (pair واحد). بيتضاعفوا لـ two pairs في الـ S phase.","الـ centrioles من stable microtubules. الـ dynamic بيتجمع ويتفكك باستمرار."]},{"id":"ES2026G2-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2026G2","stem":"Which of the following matching with rER ?","options":["Form proteins secreted by the cells","Form proteins used within the cytosol","Linked together by tRNA forming polysomes","Bind to the outer surface of sER"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ attached ribosomes على الـ rER (مربوطة بالـ large subunit في الـ ribophorins) بتصنع البروتينات اللي الخلية بتفرزها زي الإنزيمات والهرمونات.","memoryTrick":"Rough = Secreted.","stemAr":"أنهي واحدة من دول بتتوافق مع الـ rER؟","whyWrong":[null,"البروتينات اللي بتستعملها الخلية جوه الـ cytosol بتتصنع على الـ free ribosomes.","الـ ribosomes بيربطها الـ mRNA وتعمل rosettes أو spiral chains (polyribosomes)، مش الـ tRNA.","الـ ribosomes بتلزق في الـ outer surface بتاع الـ rER. الـ sER مفيهوش ribosomes."]},{"id":"ES2026G2-10","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2026G2","stem":"Which one of the following stains demonstrates lipid in the liver cells?","options":["Sudan III","PAS","Silver","trypan blue"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"ES2025A-08","explanation":"الـ fat بيتخزن في الـ fat cells كـ large globules وفي الـ liver cells كـ small droplets. في الـ H&E بيدوب أثناء التحضير فيبان vacuoles. الصبغة الخاصة: Sudan III (orange globules) أو Sudan black (black globules).","memoryTrick":"Sudan = Fat / PAS & Best's carmine = Glycogen / Silver = Golgi.","stemAr":"أنهي stain من دول بيبيّن الـ lipid في خلايا الكبد؟","whyWrong":[null,"الـ PAS magenta بيصبغ الـ glycogen (red granules).","الـ silver بيصبغ الـ Golgi (brown network).","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."]},{"id":"ES2026G2-11","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2026G2","stem":"Diffuse cytoplasmic basophilia caused by ribosome can be found in which cells?","options":["Embryonic cells","Pancreatic cells","Nerve cells","Glial cells"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"ES2026G1-15","explanation":"الـ ribosomes بتسبب cytoplasmic basophilia بسبب الـ RNA، وليها 3 أشكال:\n• Diffuse: embryonic cells.\n• Localized: pancreatic cells (في الـ base).\n• Focal: nerve cells (Nissl granules).","memoryTrick":"Diffuse = Embryonic / Localized = Pancreas / Focal = Nerve.","stemAr":"الـ diffuse cytoplasmic basophilia اللي سببها الـ ribosomes بنلاقيها في أنهي خلايا؟","whyWrong":[null,"الـ pancreatic cells فيها localized basophilia (في الـ base).","الـ nerve cells فيها focal basophilia (Nissl granules).","الـ glial cells مش من الأمثلة المذكورة للـ diffuse basophilia."]},{"id":"ES2026G2-12","topic":"histo","concept":"Cell membrane & transport","source":"ES2026G2","stem":"What is the term for the process by which the cells transport solids?","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":3,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"ES2025A-02","explanation":"الـ phagocytosis (cell eating) نوع من الـ endocytosis لبلع مواد صلبة كبيرة: الـ macrophages والـ neutrophils بيبلعوا البكتيريا والـ protozoa والخلايا التالفة جوه phagosome. أما الـ pinocytosis (cell drinking) فبتبلع extracellular fluid.","memoryTrick":"Phago = أكل.","stemAr":"إيه اسم العملية اللي الخلايا بتنقل بيها المواد الصلبة (solids)؟","whyWrong":["الـ endocytosis مصطلح عام بيشمل الـ phagocytosis والـ pinocytosis والـ receptor-mediated endocytosis.","الـ exocytosis إخراج محتوى vesicle لبره الخلية.","الـ pinocytosis للسوائل (cell drinking).",null]},{"id":"ES2026G2-13","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2026G2","stem":"What is the origin of secretory vesicles of Golgi apparatus?","options":["Smooth endoplasmic reticulum","Rough endoplasmic reticulum","The trans face of Golgi apparatus","The cell membrane"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"ES2025A-09","explanation":"الـ trans face (Exit = Concave = Secretory = Mature) بتاع الـ Golgi هو اللي بيطلع منه: الـ secretory vesicles (للـ exocytosis)، والـ lysosomes، والـ membrane renewal vesicles.","memoryTrick":"Trans = Exit 🚪","stemAr":"إيه أصل الـ secretory vesicles بتاعة الـ Golgi apparatus؟","whyWrong":["الـ sER مش أصل الـ secretory vesicles.","الـ rER بيطلع منه الـ transfer vesicles اللي رايحة للـ cis face بتاع الـ Golgi، مش الـ secretory vesicles.",null,"الـ secretory vesicle بتندمج مع الـ cell membrane وقت الـ exocytosis، يعني الغشا مكان خروجها مش أصلها."]},{"id":"EM2026G2-01","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026G2","stem":"A 40-year-old man is examined after a road traffic accident. The physician asks him to stand in the standard anatomical position. Which of the following correctly describes the orientation of the body?","options":["Head faces posterior","Eyes look forward and palms face anterior","Arms are crossed over the chest","Toes point laterally"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"في الـ anatomical position العينين لقدام والـ palms لقدام.","memoryTrick":"كله لقدام.","stemAr":"راجل عنده 40 سنة بيتكشف عليه بعد حادثة عربية، والدكتور طلب منه يقف في الـ standard anatomical position. أنهي واحدة من دول بتوصف اتجاه الجسم صح؟","whyWrong":["الراس لقدام.",null,"الإيدين جنب الجسم مش متربعين.","الصوابع لقدام."]},{"id":"EM2026G2-02","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026G2","stem":"During dissection, the brain was sectioned into un equal right and left parts. Which anatomical plane is used for this division?\"","options":["midsagittal plane","parasagittal plane","coronal plane","horizontal plane"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"التقسيم لجزئين يمين وشمال مش متساويين = parasagittal plane.","memoryTrick":"Para = جنب النص (مش متساوي).","stemAr":"أثناء الـ dissection، المخ اتقطع لجزئين يمين وشمال مش متساويين. أنهي anatomical plane اتستخدم للتقسيم ده؟","whyWrong":["الـ midsagittal متساويين.",null,"الـ coronal قدام وورا.","الـ horizontal فوق وتحت."]},{"id":"EM2026G2-03","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026G2","stem":"In which anatomical location are the superficial palmar vessels found?","options":["In the palm of the hand near the skin","In the sole of the foot away from the skin","In the sole of the foot near the skin","In the palm of the hand away from the skin"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"Superficial palmar = في الـ palm قريب من الجلد.","memoryTrick":"Superficial = قريب من الجلد.","stemAr":"الـ superficial palmar vessels موجودة في أنهي مكان تشريحي؟","whyWrong":[null,"sole والعمق الاتنين غلط.","sole للقدم.","away from skin = deep."]},{"id":"EM2026G2-04","topic":"anat","concept":"Movements","source":"EM2026G2","stem":"A physiotherapist asks a patient to move the distal end of the arm so that it traces a complete circular path, combining flexion, extension, abduction, and adduction. Which term best describes this movement?","options":["Adduction","Circumduction","Flexion","Rotation"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الحركة الدايرية اللي بتجمع flexion و abduction و extension و adduction = circumduction.","memoryTrick":"Circum = دايرة.","stemAr":"أخصائي علاج طبيعي طلب من مريض يحرك الطرف البعيد للـ arm بحيث يرسم دايرة كاملة، تجمع flexion و extension و abduction و adduction. أنهي مصطلح أحسن وصف للحركة دي؟","whyWrong":["ناحية الـ midline بس.",null,"ثني بس.","حوالين الـ axis، مش دايرة."]},{"id":"EM2026G2-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2026G2","stem":"A 55-year-old man undergoes imaging of his femur. The radiologist notes abundant spongy bone at the epiphysis. What is the main characterof spongy bone?","options":["To increase its length","As it looks like a sponge to sustain the pressure","it cover the out surface of the bone","As it provides strength for weight bearing"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ spongy bone شبه الإسفنجة وبيتحمل الـ pressure وبيوزّعها، وده سبب وجوده في الـ epiphysis.","memoryTrick":"Spongy = يمتص الضغط.","stemAr":"راجل عنده 55 سنة عمل أشعة على الـ femur، والـ radiologist لاحظ spongy bone كتير في الـ epiphysis. إيه الصفة الأساسية للـ spongy bone؟","whyWrong":["الطول من الـ growth plate.",null,"الطبقة الخارجية compact.","تحمّل الوزن صفة الـ compact."]},{"id":"EM2026G2-06","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2026G2","stem":"Which of the following arteries can supply the outer compact bone?","options":["periosteal","epiphyseal","metaphyseal","nutrient"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"EM2026P-06","explanation":"الـ periosteal arteries هي المصدر الأساسي للدم في كل أنواع العظام، وبتجي من الأوعية القريبة، وبتغذي الـ outer compact bone. والعظمة اللي يتشال منها الـ periosteum بتموت.","memoryTrick":"Periosteal = Outer.","stemAr":"أنهي artery من دول ممكن تغذي الـ outer compact bone؟","whyWrong":[null,"الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis).","الـ nutrient artery بتغذي الجزء العميق من الـ compact bone والـ marrow والـ spongy bone."]},{"id":"EM2026G2-07","topic":"embryo","concept":"Gametogenesis","source":"EM2026G2","stem":"A 25-year-old male presents with infertility. Semen analysis shows many abnormal sperms while testicular biobsy shows normal spermatids. Which stage of gametogenesis is most likely affected?","options":["Mitosis of spermatogonia","Meiosis I in primary spermatocytes","Spermiogenesis","Migration of primordial germ cells"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ spermatids سليمة لكن الـ sperms شكلها مش طبيعي، يعني المشكلة في تحوّل الـ spermatid لـ sperm = spermiogenesis.","memoryTrick":"Spermatid سليم + Sperm مشوّه = Spermiogenesis.","stemAr":"راجل عنده 25 سنة جاي بعدم خصوبة. تحليل السائل المنوي بيبيّن sperms كتير شكلها غير طبيعي، والـ testicular biopsy بيبيّن spermatids طبيعية. أنهي مرحلة من الـ gametogenesis غالبًا متأثرة؟","whyWrong":["لو المشكلة في الـ mitosis بتاعة الـ spermatogonia مكانش هيبقى فيه spermatids طبيعية.","لو المشكلة في الـ meiosis I مكانش هيبقى فيه spermatids طبيعية.",null,"لو مفيش germ cells أصلًا مكانش هيبقى فيه spermatids."]},{"id":"EM2026G2-08","topic":"embryo","concept":"Gametogenesis","source":"EM2026G2","stem":"A 30-year-old woman undergoes in vitro fertilization (IVF). Eggs are retrieved after hormonal stimulation and are found to be arrested in metaphase of meiosis II. What triggers the completion of meiosis II in the oocyte?","options":["LH surge","FSH rise","Sperm penetration","Estrogen peak"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"عند الـ ovulation الـ secondary oocyte بيقف في الـ metaphase II، وبيكمّل الـ meiosis II بس لما يحصل fertilization (دخول الـ sperm) في الـ uterine tube.","memoryTrick":"Sperm penetration.","stemAr":"ست عندها 30 سنة بتعمل حقن مجهري (IVF). البويضات اتسحبت بعد تنشيط هرموني ولقوها واقفة في metaphase of meiosis II. إيه اللي بيخلّي الـ meiosis II تكمل في الـ oocyte؟","whyWrong":["الـ LH surge بيعمل الـ ovulation.","الـ FSH بيخلي الـ follicles تنمو.",null,"الـ estrogen بيفرزه الـ Graafian follicle في الـ proliferative phase، مش هو اللي بيكمّل الـ meiosis II."]},{"id":"EM2026G2-09","topic":"embryo","concept":"Gametogenesis","source":"EM2026G2","stem":"A researcher observes that in a healthy adult male, germ cells are continuously produced from puberty onward. Which cell type serves as the stem cell reservoir for lifelong spermatogenesis?","options":["Primary spermatocyte","Spermatid","Spermatogonium","Leydig cell"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"في الـ spermatogenesis (بتبدأ عند الـ puberty وتستمر طول العمر) كل spermatogonium بيتقسم mitosis لـ 2 daughter spermatogonia (diploid)، ومنها بيكبر الـ primary spermatocyte. يعني الـ spermatogonia هي اللي بتفضل تجدد الخلايا.","memoryTrick":"Spermatogonium = المخزن 🏦.","stemAr":"باحث لاحظ إن في الراجل البالغ السليم الـ germ cells بتتنتج باستمرار من البلوغ وطالع. أنهي نوع خلايا هو مخزن الـ stem cells للـ spermatogenesis طول العمر؟","whyWrong":["الـ primary spermatocyte بيدخل الـ 1st meiotic division ويطلع secondary spermatocytes.","الـ spermatid بيتحول لـ sperm (spermiogenesis)، مش بينقسم.",null,"الـ Leydig (interstitial) cells مش germ cells."]},{"id":"EM2026G2-10","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G2","stem":"After fertilization, the zygote begins dividing as it travels through the fallopian tube. On week post-fertilization, it typically consists of inner cell mass with blastocele What is this stage called?","options":["Morula","Blastocyst","Zygote","Embryoblast"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"المرحلة اللي فيها inner cell mass و blastocele (حوالي نهاية الأسبوع الأول) = blastocyst.","memoryTrick":"فيه cavity = Blastocyst.","stemAr":"بعد الـ fertilization، الـ zygote بيبدأ ينقسم وهو ماشي في الـ fallopian tube. بعد أسبوع من الـ fertilization بيكون عادةً فيه inner cell mass و blastocele. المرحلة دي اسمها إيه؟","whyWrong":["الـ morula كورة صماء من غير cavity.",null,"الـ zygote خلية واحدة.","الـ embryoblast جزء من الـ blastocyst مش المرحلة كلها."]},{"id":"EM2026G2-11","topic":"embryo","concept":"Gametogenesis","source":"EM2026G2","stem":"During fertilization, a sperm releases enzymes to penetrate the oocyte's outer layers. Which structure prevents polyspermy by hardening after the first sperm entry?","options":["Corona radiata","Zona pellucida","cell membrane","Perivitelline space"],"answer":1,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"بعد دخول أول sperm الـ ovum بيعمل cortical and zonal reaction: الـ zona pellucida بتتغير فتمنع دخول sperm تاني (polyspermy).","memoryTrick":"Zona = الباب يتقفل.","stemAr":"أثناء الـ fertilization، الـ sperm بيطلّع إنزيمات عشان يخترق الطبقات الخارجية للـ oocyte. أنهي structure بيمنع الـ polyspermy عن طريق إنه بيتصلّب بعد دخول أول sperm؟","whyWrong":["الـ corona radiata الـ sperm بيخترقها في phase 1، ومش هي اللي بتمنع الـ polyspermy.",null,"الـ cell membrane بتاع الـ oocyte بيندمج مع الـ sperm (phase 3)، لكن اللي بيمنع الـ polyspermy هو تغيير الـ zona.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."]},{"id":"EM2026G2-12","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G2","stem":"On day 5 post-fertilization, an embryo develops a fluid-filled cavity and differentiates into two cell lineages. Which lineage gives rise to the placenta?","options":["Trophoblast","Syncytiotrophoblast","Cytotrophoblast","Inner cell mass"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor. ⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور.","explanation":"يوم 5 الـ blastocyst مكوّن من trophoblast (outer layer) و inner cell mass (future embryo). الـ trophoblast بيتمايز لـ cytotrophoblast و syncytiotrophoblast وبيشارك في الـ chorion، فهو الـ lineage اللي بيدي المشيمة.","memoryTrick":"Tropho = Placenta.","stemAr":"في اليوم 5 بعد الـ fertilization، الـ embryo بيكوّن cavity مليانة سائل وبيتمايز لنوعين (lineages) من الخلايا. أنهي واحد فيهم بيدي الـ placenta؟","whyWrong":[null,"الـ syncytiotrophoblast بيتكون بعدين من الـ trophoblast، والسؤال عن الـ lineage يوم 5.","الـ cytotrophoblast بيتكون بعدين من الـ trophoblast.","الـ inner cell mass هو الـ future embryo."]},{"id":"EM2026G2-13","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2026G2","stem":"A 28-year-old woman undergoes a transvaginal ultrasound 10 days after her last menstrual period (LMP). The clinician identifies a small gestational sac within the endometrium but no embryo. Which structure is primarily responsible for producing the hormone detected in her positive pregnancy test?","options":["Syncytiotrophoblast","Cytotrophoblast","Epiblast","Hypoblast"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ hCG بيتفرز من الـ syncytiotrophoblast.","memoryTrick":"hCG ⬅ Syncytio.","stemAr":"ست عندها 28 سنة عملت transvaginal ultrasound بعد 10 أيام من آخر دورة (LMP). الدكتور لقى gestational sac صغير جوه الـ endometrium من غير embryo. أنهي structure مسئول أساسًا عن إفراز الـ hormone اللي ظهر في اختبار الحمل الإيجابي؟","whyWrong":[null,"الـ cytotrophoblast هو الطبقة الداخلية، والـ hCG بيفرزه الـ syncytiotrophoblast.","الـ epiblast طبقة من الـ bilaminar germ disc.","الـ hypoblast طبقة من الـ bilaminar germ disc، والـ exocoelomic membrane بتمتد منه."]},{"id":"EM2026G2-14","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G2","stem":"A researcher examines an embryo at day 9 post-fertilization and notes a new space between hypoblast and exocoelomic membrane. This cavity will develop into which structure?","options":["Yolk sac","Amniotic cavity","Chorionic cavity","Blastocyst cavity"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"المساحة اللي بيحددها الـ hypoblast والـ exocoelomic membrane هي الـ primary yolk sac (exocoelomic cavity)، وبتتحول للـ yolk sac.","memoryTrick":"Hypoblast + Heuser's = Yolk sac.","stemAr":"باحث فحص embryo في اليوم 9 بعد الـ fertilization ولاحظ مساحة جديدة بين الـ hypoblast والـ exocoelomic membrane. الـ cavity دي هتتحول لأنهي structure؟","whyWrong":[null,"الـ amniotic جوه الـ epiblast.","الـ chorionic في الـ extraembryonic mesoderm.","الـ blastocyst cavity هي اللي بتتحول بالـ exocoelomic membrane، وبيبقى اسمها yolk sac."]},{"id":"EM2026G2-15","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G2","stem":"In an embryo at day 12 post-fertilization, lacunae (spaces) appear within the syncytiotrophoblast and fill with maternal blood. What is this process critical for?","options":["Gastrulation process","Neurulation process","Uteroplacental circulation","Cleavage process"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ lacunae المليانة دم الأم ضرورية للـ uteroplacental circulation.","memoryTrick":"Lacunae = دورة الأم.","stemAr":"في embryo عمره 12 يوم بعد الـ fertilization، ظهرت lacunae (مسافات) جوه الـ syncytiotrophoblast واتملت بدم الأم. العملية دي مهمة لإيه؟","whyWrong":["الـ gastrulation مش من أحداث الأسبوع التاني.","الـ neurulation مش من أحداث الأسبوع التاني.",null,"الـ cleavage في الأسبوع الأول."]},{"id":"EM2026G2-16","topic":"embryo","concept":"Implantation & second week","source":"EM2026G2","stem":"Implantation is complete by day 10 12, and the conceptus is fully embedded in the endometrium. Which layer of trophoblast is directly responsible for eroding maternal capillaries to access blood?","options":["Cytotrophoblast","Extraembryonic mesoderm","Syncytiotrophoblast","Epiblast"],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ syncytiotrophoblast هو اللي بيآكل الـ maternal capillaries.","memoryTrick":"Syncytio = المهاجم.","stemAr":"الـ implantation بيكمل في اليوم 10–12 والـ conceptus بيبقى مدفون بالكامل في الـ endometrium. أنهي طبقة من الـ trophoblast مسئولة مباشرةً عن تآكل الـ maternal capillaries للوصول للدم؟","whyWrong":["الـ cyto جوه.","بيبطن الـ chorion.",null,"جزء من الـ disc."]},{"id":"EM2026G2-17","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2026G2","stem":"What is the typical feature of submetacentric chromosome?","options":["the centromere is midway between the center and upper end","the centromere is at the center of the chromosome","the centromere is very close to upper end","the centromere is terminal"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"EM2026G1-23","explanation":"الـ submetacentric: الـ centromere في المسافة بين النص والطرف.","memoryTrick":"Sub = بعيد شوية عن النص.","stemAr":"إيه الصفة المميزة للـ submetacentric chromosome؟","whyWrong":[null,"center = metacentric.","قريب جدًا من الطرف = acrocentric.","terminal = telocentric."]},{"id":"EM2026G2-18","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2026G2","stem":"Which of the following describes Barr body ?","options":["The inactive X chromosome in females.","The X chromosome in males.","The Y chromosome in males.","The XX chromosomes in females."],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ Barr body (sex chromatin) بيمثل الـ X chromosome الـ inactive (coiled condensed) في الإناث، والـ X التاني active. بيظهر في 60% من نوى الـ buccal cells وكـ drumstick في 3-5% من الـ neutrophils.","memoryTrick":"Barr = X نايم.","stemAr":"أنهي واحدة من دول بتوصف الـ Barr body؟","whyWrong":[null,"الذكر الطبيعي عنده X واحد بس وهو active، فمفيش Barr body (إلا لو عنده X زيادة زي الـ Klinefelter).","الـ Barr body بيمثل X مش Y.","واحد بس من الـ XX هو اللي inactive وبيكوّن الـ Barr body."]},{"id":"EM2026G2-19","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2026G2","stem":"What is the typical feature of submetacentric chromosome?","options":["the centromere is midway between the center and upper end","the centromere is at the center of the chromosome","the centromere is very close to upper end","the centromere is terminal"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"EM2026G1-23","explanation":"الـ submetacentric: الـ centromere في المسافة بين النص والطرف.","memoryTrick":"Sub = بعيد شوية عن النص.","stemAr":"إيه الصفة المميزة للـ submetacentric chromosome؟","whyWrong":[null,"center = metacentric.","قريب جدًا من الطرف = acrocentric.","terminal = telocentric."]},{"id":"EM2026G2-20","topic":"histo","concept":"Cell cycle & division","source":"EM2026G2","stem":"which of the following cells are Permanent cells?","options":["Nerve cells","Liver cells","Blood cells","Skeletal muscles"],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ non-renewing cells خلايا highly specialized بتسيب الـ cycle في G1 وتروح G0 للأبد (permanent exit)، ولو ماتت مبتتعوضش، زي الـ heart muscles والـ nerve cells.","memoryTrick":"Neuron = Permanent.","stemAr":"أنهي خلايا من دول permanent cells؟","whyWrong":[null,"الـ liver cells من الـ potentially renewable cells (transient exit).","الـ blood cells من الـ continuously turn over cells.","الـ skeletal muscle مش من الأمثلة المذكورة. الأمثلة: heart muscles و nerve cells."]},{"id":"EM2026G2-21","topic":"histo","concept":"Nucleus & chromatin","source":"EM2026G2","stem":"Which of points related to Euchromatin?","options":["present in the nuclei of metabolically active cells.","special type of stain.","present in the nuclei of metabolically inactive cells.","type of cell inclusions."],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ euchromatin (extended, active) فيه الـ active genes اللي بتوجّه تصنيع البروتين، فبيكون في نوى الخلايا النشطة (vesicular nucleus).","memoryTrick":"Eu = Active.","stemAr":"أنهي نقطة من دول مرتبطة بالـ euchromatin؟","whyWrong":[null,"الـ euchromatin نوع من الـ chromatin، مش صبغة.","الخلايا الخاملة فيها heterochromatin (inactive genes).","الـ chromatin جزء من النواة، مش من الـ cytoplasmic inclusions."]},{"id":"EM2026G2-22","topic":"histo","concept":"Cell membrane & transport","source":"EM2026G2","stem":"What is concerned with tail of phospholipid granules ?","options":["the protein component of the cell membrane.","the carbohydrate component of the cell membrane.","the hydrophilic end of lipid.","the hydrophobic end of lipid."],"answer":3,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"ذيل الـ phospholipid (fatty acids) = hydrophobic nonpolar tail: non-charged ومتجه لجوه بعيد عن الـ aqueous solutions.","memoryTrick":"Tail يكره المية.","stemAr":"إيه اللي يخص ذيل (tail) جزيئات الـ phospholipid؟","whyWrong":["الـ protein component (peripheral و integral) غير الـ phospholipids.","الـ carbohydrate component هو الـ cell coat (glycocalyx).","الـ hydrophilic end هو الـ head مش الـ tail.",null]},{"id":"EM2026G2-23","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026G2","stem":"What is the function of rough endoplasmic reticulum ?","options":["lipid.","carbohydrate.","protein that will be secreted by the cell.","cytoplasmic protein necessary for the cells own existence."],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ attached ribosomes (على الـ rER) بتصنع البروتينات اللي هتتفرز برا الخلية (زي الإنزيمات والهرمونات). أما الـ free ribosomes فبتصنع البروتينات اللي بتستعملها الخلية جوه الـ cytosol.","memoryTrick":"Rough = Secreted.","stemAr":"إيه وظيفة الـ rough endoplasmic reticulum؟","whyWrong":["الـ lipids (phospholipids والـ steroids) بيصنعها الـ sER.","الـ carbohydrates بتتضاف للبروتينات كتعديل (في الـ Golgi)، والـ rER مش بيصنع carbohydrates.",null,"البروتينات اللي بتستعملها الخلية جوه الـ cytosol بتتصنع على الـ free ribosomes."]},{"id":"EM2026G2-24","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026G2","stem":"What is about smooth endoplasmic reticulum?","options":["Sometimes has ribosomes attached to its membrane","Is rarely found in skeletal muscle cells","Areas of localized basophilic indicate its presence","Is present in cells where drug detoxification is taking place"],"answer":3,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"من وظايف الـ sER الـ detoxification للأدوية والهرمونات والكحول في الـ liver cells. الـ sER مفيهوش polyribosomes، وبيكون well-developed في الـ muscle cells (بيطلع Ca ions وقت الانقباض).","memoryTrick":"Detox.","stemAr":"إيه الصح عن الـ smooth endoplasmic reticulum؟","whyWrong":["الـ sER مفيهوش ribosomes خالص. اللي عليه ribosomes هو الـ rER.","بالعكس، الـ sER well-developed في الـ muscle cells.","الـ localized basophilia سببها الـ rER (الـ RNA في الـ ribosomes). الـ sER لما يكتر بيدي acidophilia.",null]},{"id":"EM2026G2-25","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026G2","stem":"What is the feature of Golgi apparatus ?","options":["the site of packaging of secretory products of the cell.","the site of protein synthesis.","continuous with smooth endoplasmic reticulum.","capable of providing energy."],"answer":0,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"الـ Golgi apparatus مسئول عن الـ packing والـ concentration والتخزين للبروتينات اللي جاية من الـ rER، وتعديلها كيميائيًا، وتكوين الـ secretory vesicles والـ lysosomes.","memoryTrick":"Golgi = مكتب البريد 📦 (يستلم من الـ rER ويغلّف ويبعت).","stemAr":"إيه صفة الـ Golgi apparatus؟","whyWrong":[null,"البروتين في الـ rER.","اللي متصل بالـ sER هو الـ rER. الـ Golgi بيوصله البروتين من الـ rER عن طريق transfer vesicles عند الـ cis face.","إنتاج الطاقة (ATP) شغل الـ mitochondria."]},{"id":"EM2026G2-26","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026G2","stem":"Which of the following describes Multivesicular bodies ?","options":["Primary lysosomes.","Formed as a result of digestion of solid material.","Formed as a result of digestion of fluid material.","Autophagic vacuoles."],"answer":2,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","repeatOf":"EM2026G1-19","explanation":"الـ multivesicular body نوع من الـ secondary lysosomes: بيتكون لما الـ primary lysosome يندمج مع pinocytic vesicle (fluid material).","memoryTrick":"Multivesicular = Pinocytic (سوائل) / Heterolysosome = Phagocytic (صلب) / Autolysosome = organelles قديمة.","stemAr":"أنهي واحدة من دول بتوصف الـ multivesicular bodies؟","whyWrong":["الـ primary lysosome لسه طالع من الـ Golgi وما دخلش في أي هضم.","هضم المواد الصلبة (primary lysosome + phagocytic vesicle) بيكوّن heterolysosome.",null,"الـ autolysosome بيتكون من primary lysosome + autophagic vesicle فيها organelles قديمة من الخلية نفسها."]},{"id":"EM2026G2-27","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2026G2","stem":"Which is the role of Microtubules ?","options":["Carbohydrate metabolism.","Oxidative phosphorylation.","Water balance.","Formation of the cell spindle during mitosis."],"answer":3,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor.","explanation":"من وظايف الـ microtubules: تحديد شكل الخلية، النقل جوه الخلية للـ macromolecules، تكوين الـ mitotic spindle وقت الانقسام، وتكوين الـ centrioles والـ cilia والـ flagella.","memoryTrick":"Spindle.","stemAr":"إيه دور الـ microtubules؟","whyWrong":["الـ carbohydrate metabolism مش من وظايف الـ microtubules.","الـ oxidative phosphorylation بتحصل في الـ mitochondria (الـ elementary particles = ATP synthetase).","الـ water balance مش من وظايف الـ microtubules.",null]},{"id":"EM2026G2-28","topic":"histo","concept":"Nucleus & chromatin","source":"EM2026G2","stem":"What about the nuclear pore?","options":["Is at regular intervals","Is bridged by a unit membrane","Is a transient structure","Allows for communication between the nucleus and the cytoplasm"],"answer":3,"note":"This exam has no answer key in the booklet. The answer shown was worked out separately; check it with your notes or doctor. ⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور.","explanation":"الـ nuclear pore complexes فتحات دايرية على مسافات في المكان اللي الغشائين بيلتحموا فيه. وظيفتها نقل البروتينات للنواة وخروج الـ RNA والـ ribosomal subunits للـ cytoplasm، يعني التواصل بين النواة والـ cytoplasm.","memoryTrick":"Pore = باب.","stemAr":"إيه الصح عن الـ nuclear pore؟","whyWrong":["الـ pores فعلًا موجودة على مسافات (at intervals) في الـ nuclear envelope، لكن الإجابة المعتمدة هي وظيفتها: التواصل بين النواة والـ cytoplasm.","الـ pore فتحة في المكان اللي الـ inner والـ outer membranes بيلتحموا فيه، مش مقفولة بـ unit membrane.","الـ pore complexes جزء من تركيب الـ nuclear envelope، مش مذكور إنها مؤقتة.",null]},{"id":"RASHA-01","topic":"anat","concept":"Anatomical position, planes & terms","source":"RASHA","stem":"The anatomical position of the human body include the following except :","options":["The person stands in erect position","The palm faces anterior","The arms are abducted","The lower limbs are close together"],"answer":2,"explanation":"في الـ anatomical position الـ arms جنب الجسم (adducted) مش abducted.","memoryTrick":"الإيدين جنبك.","stemAr":"الـ anatomical position للجسم بيشمل كل دول ما عدا:","whyWrong":["صح: الشخص واقف. والسؤال عن الاستثناء.","صح: الـ palm لقدام.",null,"صح: الرجلين جنب بعض."]},{"id":"RASHA-02","topic":"anat","concept":"Anatomical position, planes & terms","source":"RASHA","stem":"Planter surface means :","options":["The sole of the foot","The palm of the hand","The superior surface of the foot","The posterior surface of the hand"],"answer":0,"explanation":"الـ plantar surface = الـ sole of the foot.","memoryTrick":"Plantar = Sole.","stemAr":"الـ plantar surface معناها:","whyWrong":[null,"الـ palm لليد.","السطح العلوي للقدم اسمه dorsum.","ضهر اليد اسمه dorsum."]},{"id":"RASHA-03","topic":"anat","concept":"Skin","source":"RASHA","stem":"all of the following about epidermis is correct except:","options":["epidermis is a stratified epithelium","it is composed of connective tissue","on the palms and soles, it is extremely thick","it is thin on the anterior surface of the arm and forearm"],"answer":1,"explanation":"الغلط B: الـ epidermis هي الطبقة السطحية: several layers of cells (بتبقى أفلطح ناحية السطح)، بتتجدد من الـ basal layer، وسطحها keratin، و avascular. أما الـ dermis فهي الـ connective tissue.","memoryTrick":"Epi = Epithelium / Dermis = CT.","stemAr":"كل الكلام ده عن الـ epidermis صح ما عدا:","whyWrong":["جملة صح: الـ epidermis مكوّنة من طبقات خلايا كتير. والسؤال عن الغلط.",null,"⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."]},{"id":"RASHA-04","topic":"anat","concept":"Skeleton & types of bones","source":"RASHA","stem":"Carpal bones are:","options":["Small long bones","Irregular bones","Short bones","Sesamoid bones"],"answer":2,"explanation":"الـ carpal bones short bones.","memoryTrick":"Carpal = Short.","stemAr":"الـ carpal bones هي:","whyWrong":["مش long.","مش irregular.",null,"الـ sesamoid جوه الأوتار زي الـ patella."]},{"id":"RASHA-05","topic":"anat","concept":"Skeleton & types of bones","source":"RASHA","stem":"All the following bones are appendicular skeleton except:","options":["Scapula","Tibia","Radius","Hyoid bone"],"answer":3,"explanation":"الإجابة المعتمدة: الـ hyoid bone من الـ axial skeleton. الـ axial body parts: الـ head والـ neck والـ trunk، أما الـ upper و lower extremities فـ appendicular.","memoryTrick":"Hyoid = في الرقبة = Axial.","stemAr":"كل العظام دي من الـ appendicular skeleton ما عدا:","whyWrong":["⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","الـ tibia في الـ leg (lower extremity)، فهي appendicular.","الـ radius في الـ forearm (upper extremity)، فهو appendicular.",null],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"RASHA-06","topic":"anat","concept":"Lymphatic system","source":"RASHA","stem":"One of the following is lymphoid organ","options":["Liver","Pancrease","Spleen","Lung"],"answer":2,"explanation":"الـ spleen أكبر lymphoid organ، تحت الـ left cupola of diaphragm. وظايفه: تكسير الـ RBCs القديمة، reservoir للـ blood cells، وتكوين lymphocytes.","memoryTrick":"Spleen.","stemAr":"واحد من دول lymphoid organ:","whyWrong":["الـ liver مش من الـ lymphoid organs (الـ spleen، الـ tonsils، الـ adenoids، الـ thymus، الـ lymph nodes).","الـ pancreas مش من الـ lymphoid organs.",null,"الـ lung مش من الـ lymphoid organs."]},{"id":"RASHA-07","topic":"anat","concept":"Lymphatic system","source":"RASHA","stem":"The main lymphatic vessels in the body:","options":["Thoracic duct","Right lymphatic duct","Cystic duct","Both (a) and (b )"],"answer":3,"explanation":"الـ lymph ducts الرئيسية:\n1. Right lymph duct: بيصرّف الـ lymph من الجانب اليمين للراس والرقبة والـ thorax والدراع اليمين.\n2. Thoracic duct: بيستقبل الـ lymph من باقي الجسم.","memoryTrick":"Thoracic + Right lymphatic duct.","stemAr":"الـ lymphatic vessels الرئيسية في الجسم:","whyWrong":["صح بس ناقص: فيه كمان الـ right lymph duct.","صح بس ناقص: فيه كمان الـ thoracic duct.","الـ cystic duct مش من الـ lymph ducts.",null]},{"id":"RASHA-08","topic":"anat","concept":"Skeleton & types of bones","source":"RASHA","stem":"the axial skeleton is formed of the following bone except","options":["Vertebral column","Femur","Skull","Sternum"],"answer":1,"explanation":"الـ axial body parts: الـ head (skull) والـ neck والـ trunk (vertebral column و sternum). أما الـ femur فهو في الـ thigh (lower extremity)، فهو appendicular.","memoryTrick":"Femur = طرف = Appendicular.","stemAr":"الـ axial skeleton مكوّن من العظام دي ما عدا:","whyWrong":["الـ vertebral column axial.",null,"الـ skull axial.","الـ sternum axial."]},{"id":"RASHA-09","topic":"anat","concept":"Skeleton & types of bones","source":"RASHA","stem":"regarding the vertebral column. All of the followings are true except","options":["Thoracic vertebrae are 7 in number","It belongs to the axial skeleton","Sacral vertebrae are fuesed","Cervical vertebrae are 7 in number"],"answer":0,"explanation":"الإجابة المعتمدة: الجملة الغلط A (الـ thoracic vertebrae مش 7). الـ vertebrae من الـ irregular bones وجزء من الـ trunk (axial).","memoryTrick":null,"stemAr":"بخصوص الـ vertebral column، كل دول صح ما عدا:","whyWrong":[null,"جملة صح: الـ vertebral column جزء من الـ trunk (axial).","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"RASHA-10","topic":"anat","concept":"Skeleton & types of bones","source":"RASHA","stem":"the following is an example of pneumatic bone","options":["Humerus","skull","Tibia","sternum"],"answer":1,"explanation":"الـ pneumatic bones: عظام فيها air spaces زي الـ maxilla والـ frontal، وهي من عظام الـ skull (الـ sinuses: frontal و sphenoid و ethmoidal و maxillary).","memoryTrick":"Pneumatic = هوا = Skull sinuses.","stemAr":"أنهي واحدة من دول مثال لـ pneumatic bone:","whyWrong":["الـ humerus long bone ومفيهوش air spaces.",null,"الـ tibia long bone.","الـ sternum flat bone."]},{"id":"RASHA-11","topic":"anat","concept":"Skeleton & types of bones","source":"RASHA","stem":"concerning the bones, all the following are true except","options":["Long bones of the limb are developed be membranous ossification","A sesamoid bone is a small nodule inside the tendon","Growth which takes place in the epiphyseal plate is responisable for the increase in the length of the bone"],"answer":0,"explanation":"الغلط A: عظام الـ upper و lower limbs بتتكون بـ cartilaginous ossification، والـ membranous للـ vault of skull والـ face.","memoryTrick":"Long bones = Cartilage first.","stemAr":"بخصوص العظام، كل دول صح ما عدا:","whyWrong":[null,"جملة صح: الـ sesamoid bones عظام صغيرة مدفونة في أوتار بعض العضلات زي الـ patella لتقليل الاحتكاك.","جملة صح: العظمة بتطول بترسيب عظم على جانبين الـ growing plate."]},{"id":"DENT-01","topic":"anat","concept":"Bone structure, blood supply & growth","source":"DENT","stem":"The artery that supplies the bone marrow is:","options":["Periosteal artery.","Epiphyseal artery.","Metaphyseal artery.","Nutrient artery."],"answer":3,"explanation":"الـ nutrient artery بتدخل العظمة من الـ nutrient canal وبتتقسم لـ proximal و distal branches في الـ medullary cavity، وبتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.","memoryTrick":"Nutrient = Marrow.","stemAr":"الـ artery اللي بتغذي الـ bone marrow هي:","whyWrong":["الـ periosteal arteries المصدر الأساسي لكل العظام، وبتغذي الـ outer compact bone.","الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis).",null]},{"id":"DENT-02","topic":"anat","concept":"Skeleton & types of bones","source":"DENT","stem":"Pneumatic bones are present in the:","options":["Upper limb.","Skull.","Lower limb.","Thorax."],"answer":1,"explanation":"الـ pneumatic bones عظام فيها air spaces زي الـ maxilla والـ frontal، وهي من عظام الـ skull.","memoryTrick":"Skull = Sinuses.","stemAr":"الـ pneumatic bones موجودة في:","whyWrong":["الطرف العلوي مفيهوش sinuses.",null,"الطرف السفلي مفيهوش sinuses.","الـ thorax مفيهوش."]},{"id":"DENT-03","topic":"anat","concept":"Skeleton & types of bones","source":"DENT","stem":"Vertebrae are considered as:","options":["Long bones.","Flat bones.","Short bones.","Irregular bones."],"answer":3,"explanation":"الـ vertebrae irregular bones.","memoryTrick":"Vertebra = Irregular.","stemAr":"الـ vertebrae تعتبر:","whyWrong":["مش long.","مش flat.","مش short.",null]},{"id":"DENT-04","topic":"anat","concept":"Skeleton & types of bones","source":"DENT","stem":"The following are long bones, EXCEPT:","options":["Humerus.","Scapula.","Femur.","Tibia."],"answer":1,"explanation":"الـ scapula flat bone. الـ humerus والـ femur والـ tibia long.","memoryTrick":"Scapula = Flat.","stemAr":"كل دول long bones ما عدا:","whyWrong":["الـ humerus long، والسؤال عن الاستثناء.",null,"الـ femur long.","الـ tibia long."]},{"id":"DENT-05","topic":"anat","concept":"Skeleton & types of bones","source":"DENT","stem":"The following are long bones, EXCEPT:","options":["Metacarpal bones.","Phalanges.","Vertebrae.","Metatarsal bones."],"answer":2,"explanation":"الـ vertebrae irregular. الـ metacarpals والـ phalanges والـ metatarsals long bones (صغيرة).","memoryTrick":"Vertebra = Irregular.","stemAr":"كل دول long bones ما عدا:","whyWrong":["الـ metacarpals long صغيرة (miniature long).","الـ phalanges long صغيرة.",null,"الـ metatarsals long صغيرة."]},{"id":"DENT-06","topic":"anat","concept":"Skeleton & types of bones","source":"DENT","stem":"The axial skeleton includes all of the following, EXCEPT:","options":["The skull.","The clavicle.","The sternum.","The vertebra."],"answer":1,"explanation":"الإجابة المعتمدة: الـ clavicle مش من الـ axial skeleton. الـ axial body parts: الـ head (skull) والـ neck والـ trunk (vertebrae و sternum).","memoryTrick":null,"stemAr":"الـ axial skeleton بيشمل كل دول ما عدا:","whyWrong":["الـ skull في الـ head، فهو axial.",null,"الـ sternum في الـ trunk، فهو axial.","الـ vertebrae في الـ trunk، فهي axial."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"DENT-07","topic":"anat","concept":"Movements","source":"DENT","stem":"Movement of a limb away from the midline in the coronal plane is:","options":["Adduction.","Abduction.","Flexion.","Extension."],"answer":1,"explanation":"الـ abduction = moving away from the median plane، والـ adduction = moving towards the median plane.","memoryTrick":"Abduction = Away.","stemAr":"حركة الطرف (limb) بعيد عن الـ midline في الـ coronal plane هي:","whyWrong":["الـ adduction ناحية الـ median plane.",null,"الـ flexion = bending ناحية الـ ventral surface.","الـ extension = عكس الـ flexion (straightening of the joint)."]},{"id":"DENT-08","topic":"anat","concept":"Skeleton & types of bones","source":"DENT","stem":"Regarding the long bones, the following statements are correct, EXCEPT:","options":["They have long tubular shafts.","The diaphysis contains a central medullary cavity.","The articular surfaces are covered by hyaline cartilage.","The shafts contain red bone marrow at puberty."],"answer":3,"explanation":"الغلط D: في الكبار الـ medullary cavity بتاعة كل الـ long bones فيها yellow marrow بس، وفي الطفولة الـ yellow بيبدأ يحل محل الـ red في الـ long bones.","memoryTrick":"Shaft = Yellow.","stemAr":"بخصوص الـ long bones، كل الجمل دي صح ما عدا:","whyWrong":["جملة صح: الـ long bones ليها long tubular shaft.","جملة صح: الـ shaft (diaphysis) فيه central medullary cavity.","جملة صح: الـ articular surfaces مغطية بـ articular cartilage.",null]},{"id":"DENT-09","topic":"anat","concept":"Skeleton & types of bones","source":"DENT","stem":"Regarding the sesamoid bones, mark ONE CORRECT, answer:","options":["The carpal bones.","The patella.","The metacarpal bones.","The tarsal bones."],"answer":1,"explanation":"الـ sesamoid bones: عظام صغيرة مدفونة في أوتار بعض العضلات لتقليل الاحتكاك على الوتر، زي الـ patella.","memoryTrick":"Patella = Sesamoid.","stemAr":"بخصوص الـ sesamoid bones، اختاري إجابة واحدة صح:","whyWrong":["الـ carpal bones short bones.",null,"الـ metacarpals long bones.","الـ tarsal bones short bones."]},{"id":"DENT-10","topic":"anat","concept":"Skeleton & types of bones","source":"DENT","stem":"The bones of the forearm are:","options":["Tibia and fibula.","Ulna and radius.","Humerus and radius.","Clavicle and scapula."],"answer":1,"explanation":"الـ forearm فيه الـ radius والـ ulna. في الـ pronation والـ supination الطرف البعيد للـ radius بيلف حوالين الـ ulna.","memoryTrick":"Forearm = Radius + Ulna.","stemAr":"عظام الـ forearm هي:","whyWrong":["⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.",null,"الـ humerus عظمة الـ upper arm، مش الـ forearm.","الـ clavicle والـ scapula مش عظام الـ forearm."]},{"id":"DENT-11","topic":"anat","concept":"Skeleton & types of bones","source":"DENT","stem":"The axial skeleton includes all of the following, EXCEPT:","options":["The skull.","The sternum.","The clavicle.","The vertebra."],"answer":2,"repeatOf":"DENT-06","explanation":"الإجابة المعتمدة: الـ clavicle مش من الـ axial skeleton. الـ axial body parts: الـ head (skull) والـ neck والـ trunk (vertebrae و sternum).","memoryTrick":"Clavicle = Appendicular.","stemAr":"الـ axial skeleton بيشمل كل دول ما عدا:","whyWrong":["الـ skull في الـ head، فهو axial.","الـ sternum في الـ trunk، فهو axial.",null,"الـ vertebrae في الـ trunk، فهي axial."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"DENT-12","topic":"anat","concept":"Skeleton & types of bones","source":"DENT","stem":"The hip bone is considered as:","options":["Sesamoid bone.","Short bone.","Flat bone.","Irregular bone."],"answer":3,"explanation":"الـ irregular bones ليها أشكال مختلفة، زي الـ vertebrae والـ hip bone.","memoryTrick":"Hip = Irregular.","stemAr":"الـ hip bone يعتبر:","whyWrong":["مش sesamoid.","مش short.","الـ hip bone من أمثلة الـ irregular bones، مش الـ flat (الـ flat زي الـ vault of skull والـ ribs والـ sternum والـ scapula).",null]},{"id":"DENT-13","topic":"anat","concept":"Anatomical position, planes & terms","source":"DENT","stem":"The lateral bone of the leg is:","options":["Tibia.","Fibula.","Ulna.","Radius."],"answer":1,"explanation":"الإجابة المعتمدة: الـ fibula هي الـ lateral bone of the leg.","memoryTrick":null,"stemAr":"العظمة الـ lateral في الـ leg هي:","whyWrong":["⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.",null,"الـ ulna عظمة في الـ forearm.","الـ radius عظمة في الـ forearm."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"DENT-14","topic":"anat","concept":"Anatomical position, planes & terms","source":"DENT","stem":"The medial bone of the forearm is:","options":["Tibia.","Fibula.","Ulna.","Radius."],"answer":2,"explanation":"الإجابة المعتمدة: الـ ulna هي الـ medial bone of the forearm. والـ radius هو اللي بيلف حوالين الـ ulna في الـ pronation والـ supination.","memoryTrick":null,"stemAr":"العظمة الـ medial في الـ forearm هي:","whyWrong":["الـ tibia عظمة في الـ leg مش
