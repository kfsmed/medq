ysosomes membranous vesicles وظيفتها الـ intracytoplasmic digestion، وفيها hydrolytic enzymes (زي phospholipase و protease و acid phosphatase و nuclease و sulfatase).","memoryTrick":"Lysis = تكسير ➜ Lysosome = معدة الخلية.","stemAr":"أنهي organelle فيه digestive enzymes؟","whyWrong":["الـ rER بيصنع إنزيمات الـ lysosome، لكن مش هو اللي بيحتويها في الآخر.","الـ Golgi بيستقبل الإنزيمات من الـ rER ويطلّعها في lysosomes، لكن الـ lysosome هو اللي فيه الإنزيمات.","الـ sER لتصنيع الـ lipids والـ steroids والـ detoxification.",null]},{"id":"F2022-02","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"F2022","stem":"What structure is at the base of cilia?","options":["Ribosomes","Peroxisome","Microfilaments","Centrioles"],"answer":3,"explanation":"قاعدة الـ cilium فيها basal body، وده centriole واحد مكوّن من 27 MT في 9 triplets.","memoryTrick":"Basal body = Centriole تحت الـ cilium.","stemAr":"إيه الـ structure اللي موجود عند قاعدة الـ cilia؟","whyWrong":["الـ ribosomes لتصنيع البروتين ومش عند قاعدة الـ cilia.","الـ peroxisome organelle غشائي وظيفته الـ beta oxidation، ملوش علاقة بالـ cilia.","الـ microfilaments (actin) بتعمل الـ core بتاع الـ microvilli، مش قاعدة الـ cilia.",null]},{"id":"F2022-03","topic":"histo","concept":"Inclusions, pigments & stains","source":"F2022","stem":"In H&E stained sections of plasma cell, Golgi apparatus appears:","options":["Perinuclear.","Apical.","Unstained.","Basal."],"answer":2,"explanation":"الـ Golgi مبيظهرش في الـ H&E. في الخلايا اللي بتصنع بروتين زي الـ plasma cell (الـ cytoplasm بتاعها deeply basophilic) بيبان كمنطقة فاتحة unstained جنب النواة، ودي اسمها Negative Golgi image.","memoryTrick":"Golgi في H&E = Negative image (بقعة فاتحة) / بالـ Silver = Apical أو Perinuclear.","stemAr":"في قطاعات الـ plasma cell المصبوغة بـ H&E، الـ Golgi apparatus بيظهر:","whyWrong":["الـ perinuclear (بيحيط بالنواة كلها) ده شكل الـ Golgi بالـ silver stain في الـ nerve cells. في الـ H&E في الـ plasma cell بيبان unstained.","الـ apical (supranuclear) ده شكل الـ Golgi لما يتصبغ بالـ silver في الخلايا المفرزة زي الـ epididymis، مش شكله في الـ H&E.",null,"الـ Golgi مش بيوصف إنه basal. في الـ H&E بيظهر unstained (negative image)."]},{"id":"F2022-04","topic":"histo","concept":"Chromosomes & genetic disorders","source":"F2022","stem":"Down syndrome:","options":["due to duplication of chromosome 22.","due to X chromosome monosomy.","due to multiple X syndrome.","caused by chromosome 21 trisomy."],"answer":3,"repeatOf":"EM2019A-16","explanation":"الـ Down syndrome (mongolism) هو trisomy 21 (2n+1)، يعني نسخة زيادة من chromosome 21، وسببه غالبًا non-disjunction.","memoryTrick":"Down = Trisomy 21.","stemAr":"الـ Down syndrome:","whyWrong":["الـ chromosome 22 بيرتبط بالـ Philadelphia chromosome، وده reciprocal translocation بين 9 و 22 (في الـ CML)، مش duplication ومش Down.","الـ X monosomy (45,X0) هو الـ Turner syndrome.","الـ multiple X syndrome هو 47,XXX: أنثى عندها X زيادة. ده مش Down.",null]},{"id":"F2022-05","topic":"embryo","concept":"Fetal membranes & placenta","source":"F2022","stem":"The wall of the chorionic sac is composed of:","options":["cytotrophoblast and syncytiotrophoblast","two layers of trophoblast lined by extraembryonic somatic mesoderm","trophoblast and exocoelomic membrane","extraembryonic splanchnic mesoderm and both layers of trophoblast"],"answer":1,"repeatOf":"EM2019A-11","explanation":"الـ chorion هو أبعد fetal membrane حوالين الـ embryo، ومكوّن من:\n1. Extraembryonic somatic mesoderm.\n2. Cytotrophoblast.\n3. Syncytiotrophoblast.","memoryTrick":"Chorion = Trophoblast (cyto + syncytio) + Somatic mesoderm.","stemAr":"جدار الـ chorionic sac مكوّن من:","whyWrong":["ناقص الطبقة التالتة: الـ extraembryonic somatic mesoderm.",null,"الـ exocoelomic membrane بتحيط بالـ blastocyst cavity وتحولها لـ primitive yolk sac، مش جزء من الـ chorion.","الـ chorion مبطن بالـ somatic مش الـ splanchnic mesoderm."]},{"id":"F2022-06","topic":"embryo","concept":"Fertilization & cleavage","source":"F2022","stem":"What is the most correct sequence of early development following fertilization?","options":["zygote, blastomeres, morula, blastocyst","oocyte, zygote, morula, blastocyst","zygote, conceptus, blastocyst","polar bodies, zygote, conceptus, blastocyst"],"answer":0,"explanation":"بعد الـ fertilization:\nzygote ➜ cleavage (انقسامات mitotic سريعة والخلايا الناتجة اسمها blastomeres) ➜ morula (كورة solid من 16-32 خلية) ➜ blastocyst (trophoblast + inner cell mass + blastocele).","memoryTrick":"Z-B-M-B.","stemAr":"إيه أصح ترتيب لمراحل النمو الأولى بعد الـ fertilization؟","whyWrong":[null,"الـ oocyte قبل الـ fertilization، والسؤال عن اللي بعدها، وكمان ناقص الـ blastomeres.","الترتيب ناقص الـ blastomeres والـ morula.","الـ polar bodies نواتج انقسام الـ oocyte، مش مرحلة من مراحل النمو بعد الـ fertilization."]},{"id":"F2022-07","topic":"embryo","concept":"Fertilization & cleavage","source":"F2022","stem":"The early stages of cleavage are characterized by which of the following?","options":["formation of a hollow ball of cells","formation of the zona pellucida","increase in the size of the cells in the zygote","increase in the number of cells in the zygote"],"answer":3,"explanation":"الـ cleavage = سلسلة انقسامات mitotic سريعة بعد الـ fertilization، مش مصحوبة بـ growth، فعدد الخلايا (blastomeres) بيزيد وحجم كل خلية بيصغر مع كل انقسام.","memoryTrick":"Cleavage = العدد يزيد والحجم ثابت.","stemAr":"المراحل الأولى من الـ cleavage بتتميز بإيه من دول؟","whyWrong":["الـ hollow ball (فيه blastocele) ده الـ blastocyst، بيتكون بعد الـ morula.","الـ zona pellucida موجودة حوالين الـ ovum من الأول، والـ blastomeres بتفضل جواها.","بالعكس، حجم الخلايا بيصغر مع كل انقسام.",null]},{"id":"F2022-08","topic":"anat","concept":"Scalp & face","source":"F2022","stem":"The frontal belly of occipitofrontalis is supplied by which of the following?","options":["Cervical branch of facial nerve","posterior auricular nerve","mandibular branch of facial nerve","temporal branch of facial nerve"],"answer":3,"explanation":"الـ occipitofrontalis:\n• الـ occipital belly بيتغذى من الـ posterior auricular branch of facial nerve.\n• الـ frontal belly بيتغذى من الـ temporal branch of facial nerve.","memoryTrick":"Frontal = Temporal.","stemAr":"الـ frontal belly بتاع الـ occipitofrontalis بيتغذى عصبيًا من أنهي واحد من دول؟","whyWrong":["الـ occipitofrontalis motor supply من الـ temporal branch (frontal belly) والـ posterior auricular branch (occipital belly) بس.","الـ posterior auricular بيغذي الـ occipital belly مش الـ frontal.","الـ occipitofrontalis motor supply من الـ temporal branch (frontal belly) والـ posterior auricular branch (occipital belly) بس.",null]},{"id":"F2022-09","topic":"anat","concept":"Skeleton & types of bones","source":"F2022","stem":"Which of the following bones is a part of axial skeleton?","options":["Femur","humerus","Rib cage","Metacarpal bone"],"answer":2,"explanation":"الـ axial body parts: الـ head والـ neck والـ trunk (والـ rib cage جزء من الـ trunk). أما الـ upper و lower extremities (زي الـ humerus والـ femur والـ metacarpals) فـ appendicular.","memoryTrick":"Axial = المحور (الجمجمة والعمود والقفص).","stemAr":"أنهي عظمة من دول جزء من الـ axial skeleton؟","whyWrong":["الـ femur في الـ lower limb، فهو appendicular.","الـ humerus في الـ upper limb، فهو appendicular.",null,"الـ metacarpals في الإيد، فهي appendicular."]},{"id":"F2022-10","topic":"anat","concept":"Lymphatic system","source":"F2022","stem":"The vessel which carries fluid from the tissue to be filtered is called","options":["Artery","Vein","Lymph vessel","Blood capillary"],"answer":2,"explanation":"الـ lymphatic vessels بتجمع الـ tissue fluid عشان يتفلتر في الـ lymph nodes وبعدين يرجع للـ blood stream. فيها valves كتير فشكلها beaded.","memoryTrick":"Lymph = فلتر الصرف الصحي للأنسجة.","stemAr":"الوعاء اللي بيشيل السائل من الأنسجة عشان يتفلتر اسمه:","whyWrong":["الـ artery بتودي دم للأنسجة.","الـ vein بترجّع الدم، مش السائل اللي هيتفلتر في الـ lymph nodes.",null,"الـ blood capillary بتبادل مع الأنسجة، بس اللي بيشيل السائل الزيادة للـ nodes هو الـ lymph vessel."]},{"id":"EM2022-01","topic":"anat","concept":"Movements","source":"EM2022","stem":"Which of the followings means movement of a part of the body around its long axis?","options":["Circumduction","Eversion","Pronation","Rotation"],"answer":3,"explanation":"الـ rotation = حركة الجزء حوالين الـ long axis بتاعه (medial أو lateral).","memoryTrick":"Rotation = يلف حوالين نفسه.","stemAr":"أنهي واحدة من دول معناها حركة جزء من الجسم حوالين محوره الطولي (long axis)؟","whyWrong":["الـ circumduction حركة دايرية (flexion و abduction و extension و adduction ورا بعض) والطرف البعيد بيرسم دايرة.","الـ eversion حركة للقدم (الـ sole لبره).","الـ pronation حركة rotational خاصة بالـ forearm، والسؤال عن المصطلح العام.",null]},{"id":"EM2022-02","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2022","stem":"The amount of the hard bone increased at which of the followings?","options":["Lower end of the long bone","Medullary cavity","Middle of the shaft of the bone","Upper end of the long bone"],"answer":2,"explanation":"الـ compact (hard) bone بيدي قوة لتحمل الوزن، وفي الـ long bone كميته بتزيد في نص الـ shaft. أما أطراف الـ long bones فمكونة من spongy bone.","memoryTrick":"النص = Compact / الأطراف = Spongy.","stemAr":"كمية الـ hard bone (compact) بتزيد في أنهي مكان من دول؟","whyWrong":["أطراف الـ long bone مكونة من spongy bone.","الـ medullary cavity فيها yellow bone marrow.",null,"أطراف الـ long bone مكونة من spongy bone."]},{"id":"EM2022-03","topic":"anat","concept":"Scalp & face","source":"EM2022","stem":"Which of the followings is the dangerous area of the scalp?","options":["Connective tissue layer","Periosteum","Skin layer","Subaponeurotic space"],"answer":3,"explanation":"الطبقة الرابعة في الـ scalp هي الـ loose areolar tissue (بتملا الـ subaponeurotic space)، واسمها dangerous layer لأن الـ emissary veins بتفتح فيها وبتنقل أي infection لجوه المخ (الـ venous sinuses). والنزيف فيها بيعمل swelling في الـ scalp كله و black eye.","memoryTrick":"تحت الـ aponeurosis = الخطر.","stemAr":"أنهي واحدة من دول هي الـ dangerous area في الـ scalp؟","whyWrong":["الـ connective tissue (dense subcutaneous) فيها أوعية وأعصاب الـ scalp، والنزيف منها بيبقى profuse لأن الألياف بتمنع الأوعية تنكمش، لكنها مش الـ dangerous layer.","الـ pericranium loosely attached للعظم لكن firmly adherent للـ sutures، ومش هي الـ dangerous layer.","الـ skin الطبقة السطحية (فيها sebaceous glands و hair follicles)، مش الـ dangerous layer.",null]},{"id":"EM2022-04","topic":"embryo","concept":"Gametogenesis","source":"EM2022","stem":"Where does capacitation of the sperm take place?","options":["Epididymis","female genital tract","prostatic gland.","testis"],"answer":1,"explanation":"الـ capacitation = adaptation للـ sperms في الـ female genital tract (حوالي 7 ساعات). بيحصل تغيير في الـ cell membrane بتاع الـ sperm وبتتشال طبقة glycoprotein (cleaning of the sperm).\nالنتيجة: منطقة الـ acrosomal cap بتتغير فيبقى الـ acrosome reaction ممكن، والـ sperm بيبقى hyperactive. ومن غير capacitation مفيش fertilization.","memoryTrick":"Capacitation = عند الست.","stemAr":"الـ capacitation بتاعة الـ sperm بتحصل فين؟","whyWrong":["الـ epididymis مش مكان الـ capacitation. الـ capacitation بتحصل في الـ female genital tract.",null,"الـ prostate بيفرز acidic fluid (20% من الـ semen)، مش مكان الـ capacitation.","الـ testis (الـ seminiferous tubules) مكان الـ spermatogenesis."]},{"id":"EM2022-05","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"Secondary yolk sac can be seen in which of the following stages?","options":["after folding","blastocyst stage","chorionic vesicle stage","morula stage"],"answer":2,"explanation":"في اليوم 13 (مرحلة الـ chorionic vesicle) بيظهر الـ secondary yolk sac، ومعاه الـ 1ry chorionic villi والـ connecting stalk والـ chorionic cavity.","memoryTrick":"Secondary yolk sac = Week 2 end (Chorionic vesicle).","stemAr":"الـ secondary yolk sac ممكن يتشاف في أنهي مرحلة من دول؟","whyWrong":["⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","في الـ blastocyst الـ cavity اسمها blastocele، ولسه مفيش yolk sac.",null,"الـ morula كورة solid من الخلايا من غير أي cavity."]},{"id":"EM2022-06","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"At what stage of embryonic development does an embryo normally begin to implant in the endometrium?","options":["Blastocyst","Four-cell stage","Morula","Trilaminar embryo"],"answer":0,"explanation":"الـ embryo بيبدأ الـ implantation وهو blastocyst (حوالي اليوم 6 بعد الـ fertilization).","memoryTrick":"اللي بيزرع نفسه = Blastocyst.","stemAr":"في أنهي مرحلة من مراحل النمو الـ embryo بيبدأ طبيعيًا يزرع (implant) في الـ endometrium؟","whyWrong":[null,"الـ 4-cell stage لسه في الـ cleavage جوه الـ fallopian tube.","الـ morula بتوصل الرحم حوالي 72 ساعة بعد الـ fertilization ولسه متغطية بالـ zona pellucida، وبعدها بتتحول blastocyst.","في الأسبوع التاني الـ germ disc لسه bilaminar، يعني الـ implantation بيبدأ قبل كده بكتير."]},{"id":"EM2022-07","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"What is the site of blastocyst implantation in placenta previa?","options":["Ovary","rectouterine pouch","the tube","uterine cavity"],"answer":3,"explanation":"الـ placenta previa = implantation جوه الـ uterine cavity لكن قريب من الـ internal os. أما الـ ovary والـ tube والـ peritoneal wall فدي implantation بره الرحم.","memoryTrick":"Previa = جوه الرحم بس تحت.","stemAr":"مكان زرع الـ blastocyst في حالة الـ placenta previa فين؟","whyWrong":["الـ ovary من أماكن الـ implantation بره الرحم.","الـ rectouterine pouch (peritoneal) من أماكن الـ implantation بره الرحم.","الـ tube أشهر مكان للـ implantation بره الرحم (95%).",null]},{"id":"EM2022-08","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"The blastocyst is called late blastocyst after which of the following:","options":["Implantation","Fertilization","Hatching","Cleavage"],"answer":2,"explanation":"قبل الـ implantation الـ blastocyst لازم يتخلص من الـ zona pellucida (hatching). الإجابة المعتمدة إن الـ late blastocyst هو اللي حصله hatching، ففيه trophoblast و inner cell mass (embryoblast) و blastocele من غير zona.","memoryTrick":"Hatching = Late blastocyst 🐣.","stemAr":"الـ blastocyst بيتسمى late blastocyst بعد أنهي واحدة من دول؟","whyWrong":["الـ implantation بيحصل بعد الـ hatching.","الـ fertilization بداية كل حاجة.",null,"الـ cleavage بيكوّن الـ morula."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2022-09","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2022","stem":"The cells by which the embryo nourished are which of the following:","options":["Cytotrophoblast","Decidual","Amnioblast","Blastomeres"],"answer":1,"explanation":"الإجابة المعتمدة: الـ decidual cells. بعد الـ implantation بيحصل decidual reaction: خلايا الـ endometrium بيزيد فيها الـ glycogen والـ lipids مع تغيرات في الأوعية والغدد، والـ endometrium بيتسمى decidua. والـ syncytiotrophoblast بيآكل (erodes) الـ endometrium.","memoryTrick":null,"stemAr":"الخلايا اللي الـ embryo بيتغذى عن طريقها هي أنهي واحدة من دول؟","whyWrong":["الـ cytotrophoblast هو الطبقة الداخلية (mononucleated) من الـ trophoblast، مش الخلايا اللي بيتغذى عليها الـ embryo.",null,"الـ amnioblasts خلايا الـ epiblast اللي جنب الـ cytotrophoblast وبتبطّن الـ amniotic cavity.","الـ blastomeres هي خلايا الـ embryo نفسه الناتجة من الـ cleavage."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2022-10","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"After the blastocytic cavity is surrounded by exocoelemic membrane it is called:","options":["Amniotic cavity","Chorionic cavity","Primary yolk sac","Extraembryonic mesoderm"],"answer":2,"explanation":"لما الـ hypoblast cells تكوّن الـ exocoelomic (Heuser's) membrane وتبطن الـ blastocystic cavity، الـ cavity دي تتسمى primary yolk sac.","memoryTrick":"Heuser's membrane حوالين الـ cavity = Primary yolk sac.","stemAr":"بعد ما الـ blastocystic cavity تتحاط بالـ exocoelomic membrane بيبقى اسمها:","whyWrong":["الـ amniotic cavity بتتكون جوه الـ epiblast.","الـ chorionic cavity بتتكون جوه الـ extraembryonic mesoderm.",null,"الـ extraembryonic mesoderm طبقة خلايا مش cavity."]},{"id":"EM2022-11","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2022","stem":"Where does fertilization of the egg occur?","options":["Ovary","Internal Os of the Uterus","Fimbriae","Ampulla"],"answer":3,"explanation":"الـ fertilization بتحصل في الـ ampulla (الـ lateral third) of the uterine tube.","memoryTrick":"Ampulla = مكان اللقاء 💍.","stemAr":"الـ fertilization بتاع البويضة بيحصل فين؟","whyWrong":["الـ ovary مكان الـ ovulation، مش الـ fertilization.","الـ internal os قريب منه بيحصل الـ placenta previa، مش مكان الـ fertilization.","الـ fimbriae مش مكان الـ fertilization. المكان هو الـ ampulla.",null]},{"id":"EM2022-12","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"What implants into the nutrient-rich endometrium (i.e. decidua) about 8-9 days after ovulation?","options":["Blastocyst","Morula","Epiblast","Hypoblast"],"answer":0,"explanation":"الـ blastocyst هو اللي بيعمل implantation في الـ endometrium.","memoryTrick":"Blastocyst = اللي بيزرع.","stemAr":"إيه اللي بيزرع (implants) في الـ endometrium الغني بالغذا (الـ decidua) بعد الـ ovulation بحوالي 8–9 أيام؟","whyWrong":[null,"الـ morula بتوصل الرحم حوالي 72 ساعة (اليوم الرابع) ولسه متغطية بالـ zona، وبعدها بتتحول blastocyst.","الـ epiblast طبقة من الـ bilaminar germ disc في الأسبوع التاني.","الـ hypoblast طبقة من الـ bilaminar germ disc في الأسبوع التاني."]},{"id":"EM2022-13","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"Which two embryological structures together form the bilaminar disk?","options":["Cytotrophoblast and Hypoblast","Hypoblast and Epiblast","Epiblast and Cytotrophoblast","Syncytiotrophoblast and Inner cell mass"],"answer":1,"explanation":"الـ bilaminar disc = epiblast (فوق) + hypoblast (تحت).","memoryTrick":"Bi = اتنين: Epi + Hypo.","stemAr":"أنهي اتنين embryological structures مع بعض بيكوّنوا الـ bilaminar disc؟","whyWrong":["الـ cytotrophoblast جزء من الـ trophoblast مش من الـ disc.",null,"نفس الكلام.","الـ syncytiotrophoblast خارج الـ embryo. والـ inner cell mass هو أصل الـ disc نفسه."]},{"id":"EM2022-14","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2022","stem":"In H&E - stained sections of plasma cell, How can Golgi apparatus appears?","options":["Perinuclear.","Apical.","Unstained.","Basal."],"answer":2,"repeatOf":"EM2019A-13","explanation":"الـ Golgi مبيظهرش في الـ H&E. في الخلايا اللي بتصنع بروتين زي الـ plasma cell (الـ cytoplasm بتاعها deeply basophilic) بيبان كمنطقة فاتحة unstained جنب النواة، ودي اسمها Negative Golgi image.","memoryTrick":"Golgi في H&E = Negative image (بقعة فاتحة) / بالـ Silver = Apical أو Perinuclear.","stemAr":"في قطاعات الـ plasma cell المصبوغة بـ H&E، الـ Golgi apparatus بيظهر إزاي؟","whyWrong":["الـ perinuclear (بيحيط بالنواة كلها) ده شكل الـ Golgi بالـ silver stain في الـ nerve cells. في الـ H&E في الـ plasma cell بيبان unstained.","الـ apical (supranuclear) ده شكل الـ Golgi لما يتصبغ بالـ silver في الخلايا المفرزة زي الـ epididymis، مش شكله في الـ H&E.",null,"الـ Golgi مش بيوصف إنه basal. في الـ H&E بيظهر unstained (negative image)."]},{"id":"EM2022-15","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2022","stem":"Which Two organelles share in the formation of lysosomes?","options":["rER & SER.","sER & Golgi.","Golgi & cell membrane.","rER & Golgi."],"answer":3,"repeatOf":"EM2019A-14","explanation":"الـ lysosomal enzymes بتتصنع على الـ rER وبعدين تتغلف وتتعبى في الـ Golgi (trans face) فتطلع primary lysosomes.","memoryTrick":"rER يصنع ➜ Golgi يغلّف = Lysosome.","stemAr":"أنهي اتنين organelles بيشاركوا في تكوين الـ lysosomes؟","whyWrong":["الـ sER مش بيصنع البروتينات (الإنزيمات)، اللي بيصنعها الـ rER.","الـ sER مش مسئول عن الإنزيمات. الصح rER (يصنع) و Golgi (يغلّف).","الـ cell membrane مش بيصنع إنزيمات الـ lysosome.",null]},{"id":"EM2022-16","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2022","stem":"What structure contributes to the cells cytoskeleton?","options":["Ribosomes","Peroxisome","Microfilaments","Centrioles"],"answer":2,"repeatOf":"EM2019A-15","explanation":"الـ cytoskeleton شبكة معقدة من الـ microtubules والـ filaments (والـ microfilaments منها)، مع بروتينات بتربطهم ببعض وبالـ cell membrane وبتعمل framework للخلية.","memoryTrick":"Cytoskeleton = Microtubules + Filaments.","stemAr":"أنهي structure بيشارك في الـ cytoskeleton بتاع الخلية؟","whyWrong":["الـ ribosomes لتصنيع البروتين، مش جزء من الـ cytoskeleton.","الـ peroxisome من الـ membranous organelles وشغلها الـ oxidation، مش جزء من الـ cytoskeleton.",null,"الـ centrioles تراكيب بتتكون من stable microtubules، لكن الإجابة اللي هي نفسها جزء من الـ cytoskeleton هي الـ microfilaments."]},{"id":"EM2022-17","topic":"histo","concept":"Cell membrane & transport","source":"EM2022","stem":"What is the polysaccharide coating that is sometimes found on the cell membrane?","options":["Plasmalemma","Glycocalyx","Protoplasm","Cristae"],"answer":1,"repeatOf":"ES2019-06","explanation":"الـ glycocalyx (cell coat) هو الطبقة الـ carbohydrate (glycoproteins & glycolipids) على السطح الخارجي للـ cell membrane.","memoryTrick":"Glyco = سكر ➜ Glycocalyx = غلاف سكري.","stemAr":"إيه هو الغطا الـ polysaccharide اللي بيكون أحيانًا على الـ cell membrane؟","whyWrong":["الـ plasmalemma هو اسم الـ cell membrane نفسه، مش الطبقة اللي عليه.",null,"الـ protoplasm مش هو الطبقة الـ carbohydrate اللي على السطح الخارجي للغشا. الطبقة دي اسمها cell coat (glycocalyx).","الـ cristae طيات الـ inner mitochondrial membrane."]},{"id":"EM2022-18","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2022","stem":"What does the cause of Down syndrome:","options":["due to duplication of chromosome 22.","due to X chromosome monosomy.","due to multiple X syndrome.","caused by chromosome 21 trisomy."],"answer":3,"explanation":"الـ Down syndrome (mongolism) هو trisomy 21 (2n+1)، يعني نسخة زيادة من chromosome 21، وسببه غالبًا non-disjunction.","memoryTrick":"Down = Trisomy 21.","stemAr":"إيه سبب الـ Down syndrome؟","whyWrong":["الـ chromosome 22 بيرتبط بالـ Philadelphia chromosome، وده reciprocal translocation بين 9 و 22، مش duplication ومش Down.","الـ X monosomy (45,X0) هو الـ Turner syndrome.","الـ multiple X syndrome هو 47,XXX: أنثى عندها X زيادة.",null]},{"id":"EM2022-19","topic":"histo","concept":"Cell membrane & transport","source":"EM2022","stem":"What is the term for the process used by cells for the transport solids?","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":3,"explanation":"الـ phagocytosis (cell eating) نوع من الـ endocytosis لبلع مواد صلبة كبيرة: الـ macrophages والـ neutrophils بيبلعوا البكتيريا والـ protozoa والخلايا التالفة جوه phagosome. أما الـ pinocytosis (cell drinking) فبتبلع extracellular fluid.","memoryTrick":"Phago = أكل (solids).","stemAr":"إيه اسم العملية اللي الخلايا بتستخدمها عشان تنقل المواد الصلبة (solids)؟","whyWrong":["الـ endocytosis مصطلح عام بيشمل الـ phagocytosis والـ pinocytosis والـ receptor-mediated endocytosis.","الـ exocytosis إخراج محتوى vesicle لبره الخلية.","الـ pinocytosis للسوائل (cell drinking).",null]},{"id":"EM2022-20","topic":"histo","concept":"Cell membrane & transport","source":"EM2022","stem":"Cell coat function all except:","options":["Cell adhesions.","Cell allergy.","Cell recognition.","Cell transport"],"answer":3,"repeatOf":"ES2020-05","explanation":"وظايف الـ cell coat: cell immunity، cell adhesion، cell protection، cell recognition (cell identity).\nالـ transport (exchange of materials) من وظايف الـ plasma membrane نفسه (passive diffusion، facilitated diffusion، active transport، bulk transport)، مش الـ cell coat.","memoryTrick":"Cell coat = I A P R (Immunity, Adhesion, Protection, Recognition).","stemAr":"وظايف الـ cell coat كلها ما عدا:","whyWrong":["الـ cell adhesion من وظايف الـ cell coat، والسؤال عن اللي مش من وظايفه.","الـ allergy مش مذكورة بالاسم في وظايف الـ cell coat، لكنها رد فعل مناعي فأقرب للـ cell immunity. الإجابة المعتمدة هي D (transport).","الـ cell recognition (cell identity) من وظايفه.",null],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2022-21","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2022","stem":"The cytoplasmic side of the coated vesicle is surrounded by:","options":["Clathrin.","Tubulin.","Actin.","Spectrin."],"answer":0,"repeatOf":"ES2020-07","explanation":"الإجابة المعتمدة: الـ coated vesicle متغطية من ناحية الـ cytoplasm بالـ clathrin.","memoryTrick":"Coated = Clathrin (C مع C).","stemAr":"الناحية اللي جوه الـ cytoplasm من الـ coated vesicle محاطة بـ:","whyWrong":[null,"الـ tubulin (alpha & beta) هو البروتين اللي بيتكون منه الـ microtubules.","الـ actin هو البروتين اللي بيتكون منه الـ microfilaments.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2022-22","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2022","stem":"Which organelle is involved in lipid metabolism?","options":["rER","Golgi apparatus","sER","Lysosome"],"answer":2,"repeatOf":"ES2021-07","explanation":"الـ sER مسئول عن تصنيع الـ phospholipids (للـ cell membranes) والـ steroid hormones، وكمان الـ detoxification في الـ liver cells.","memoryTrick":"Smooth = Steroids & Lipids & Detox.","stemAr":"أنهي organelle له دور في الـ lipid metabolism؟","whyWrong":["الـ RER للبروتين.","الـ Golgi شغله packing وتعديل البروتينات وتكوين الـ secretory vesicles والـ lysosomes.",null,"الـ lysosome للهضم جوه الخلية (intracytoplasmic digestion)."]},{"id":"EM2022-23","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2022","stem":"What are the folds on the inner mitochondrial membrane called?","options":["Plasmalemma","Glycocalyx","Protoplasm","Cristae"],"answer":3,"explanation":"الـ inner mitochondrial membrane بيعمل طيات شبه الرفوف اسمها cristae، بتزوّد مساحة السطح، وعددها بيتناسب مع احتياج الخلية للطاقة.","memoryTrick":"Cristae = Crests (طيات) جوه الـ mitochondria.","stemAr":"الطيّات (folds) اللي في الـ inner mitochondrial membrane اسمها إيه؟","whyWrong":["الـ plasmalemma هو الـ cell membrane.","الـ glycocalyx الطبقة السكرية على سطح الخلية.","الـ protoplasm مش اسم طيات الـ mitochondria. الطيات دي اسمها cristae.",null]},{"id":"ES2022-01","topic":"anat","concept":"Scalp & face","source":"ES2022","stem":"The occipital belly of occipitofrontalis is supplied by which of the following?","options":["Buccal branch of facial nerve.","posterior auricular nerve.","mandibular branch of facial nerve.","temporal branch of facial nerve"],"answer":1,"explanation":"الـ occipitofrontalis:\n• الـ occipital belly بيتغذى من الـ posterior auricular branch of facial nerve.\n• الـ frontal belly بيتغذى من الـ temporal branch of facial nerve.","memoryTrick":"Occipital = Posterior auricular.","stemAr":"الـ occipital belly بتاع الـ occipitofrontalis بيتغذى عصبيًا من أنهي واحد من دول؟","whyWrong":["الـ occipitofrontalis motor supply من الـ temporal branch (frontal belly) والـ posterior auricular branch (occipital belly) بس.",null,"الـ occipitofrontalis motor supply من الـ temporal branch (frontal belly) والـ posterior auricular branch (occipital belly) بس.","الـ temporal branch بيغذي الـ frontal belly مش الـ occipital."]},{"id":"ES2022-02","topic":"anat","concept":"Scalp & face","source":"ES2022","stem":"The lateral part of the scalp is drained into which of the following?","options":["Parotid lymph nodes.","Mastoid lymph nodes.","Occipital lymph nodes.","Submandibular lymph nodes"],"answer":0,"explanation":"الجزء الـ lateral من الـ scalp والجبهة بيصرّف على الـ superficial parotid (preauricular) nodes.","memoryTrick":"قدام الودن = Parotid / ورا = Mastoid / الخلف = Occipital.","stemAr":"الجزء الجانبي (lateral) من الـ scalp بيصرّف في أنهي واحد من دول؟","whyWrong":[null,"الـ mastoid nodes للجزء الخلفي ورا الودن.","الجزء الخلفي ورا الودن بيصرّف على الـ mastoid nodes.","الـ submandibular nodes للجزء الأمامي من الـ scalp."]},{"id":"F2023A-01","topic":"histo","concept":"Inclusions, pigments & stains","source":"F2023A","stem":"When the protein secreting cells stained with Hematoxylin and Eosin, There is a clear unstained area near the nucleus. This pale area is called:","options":["Brown network or granules","Cisternae","Negative Golgi image","Cristae"],"answer":2,"explanation":"الـ Golgi مبيظهرش في الـ H&E. في الخلايا اللي بتصنع بروتين (زي الـ plasma cell) الـ cytoplasm بيكون deeply basophilic، والـ Golgi بيبان كمنطقة فاتحة unstained جنب النواة = Negative Golgi image.","memoryTrick":"بقعة فاضية = Golgi.","stemAr":"لما الخلايا اللي بتفرز بروتين تتصبغ بـ Hematoxylin and Eosin، بيبان منطقة فاتحة مش مصبوغة جنب النواة. المنطقة الفاتحة دي اسمها:","whyWrong":["الـ brown network ده شكل الـ Golgi بالـ silver stain، مش في الـ H&E.","الـ cisternae مصطلح للأكياس المسطحة اللي بتشوفها بالـ EM (زي الـ ER)، مش اسم المنطقة الفاتحة في الـ H&E.",null,"الـ cristae طيات الـ inner mitochondrial membrane."]},{"id":"F2023A-02","topic":"histo","concept":"Chromosomes & genetic disorders","source":"F2023A","stem":"The nucleus of which of the following cells shows Barr body in females (drum stick appearance):","options":["Lymphocyte","Neutrophil","Monocyte","Basophil"],"answer":1,"explanation":"الـ Barr body (sex chromatin) كتلة chromatin غامقة بتمثل الـ X chromosome الـ inactive. بتظهر جوه الـ nuclear envelope في 60% من نوى الـ buccal cells في الإناث، وفي 3-5% من الـ neutrophils في الإناث بتظهر كـ drumstick متشعلقة في النواة.","memoryTrick":"Drumstick = Neutrophil 🥁 / Buccal cells = 60%.","stemAr":"نواة أنهي خلية من دول بيظهر فيها الـ Barr body في الإناث (شكل الـ drum stick)؟","whyWrong":["الـ drumstick بيتوصف في الـ neutrophils بس، مش الـ lymphocytes.",null,"الـ drumstick بيتوصف في الـ neutrophils بس، مش الـ monocytes.","الـ drumstick بيتوصف في الـ neutrophils بس، مش الـ basophils."]},{"id":"F2023A-03","topic":"histo","concept":"Cell cycle & division","source":"F2023A","stem":"During the cell cycle, in which stage DNA replication takes place?","options":["Prophase","Metaphase","Anaphase","Interphase"],"answer":3,"explanation":"الـ DNA duplication بتحصل في الـ S phase، وهي جزء من الـ interphase (G1 ثم S ثم G2) قبل الـ mitosis. في الـ S phase الـ 46 chromosome بيبقوا 46 d (double).","memoryTrick":"Replication = Interphase (S).","stemAr":"أثناء الـ cell cycle، الـ DNA replication بيحصل في أنهي مرحلة؟","whyWrong":["في الـ prophase الـ chromosomes بتبقى أقصر وأتخن وتبان، والـ DNA متضاعف بالفعل من قبلها.","في الـ metaphase الـ chromosomes بتترص على الـ equatorial plane (metaphase plate).","في الـ anaphase كل d-chromosome بيتقسم عند الـ centromere والـ sister chromatids بتروح للقطبين.",null]},{"id":"F2023A-04","topic":"histo","concept":"Chromosomes & genetic disorders","source":"F2023A","stem":"In which of the following types, the chromosomes have short and long arms of unequal length with the centromere presents more towards one end?","options":["Acrocentric","Telocentric","Submetacentric","Metacentric"],"answer":2,"explanation":"الـ submetacentric: الـ centromere في النص ما بين المركز والطرف العلوي، فالـ short arm (p) أقصر من الـ long arm (q).","memoryTrick":"Sub = تحت النص بشوية.","stemAr":"في أنهي نوع من دول الـ chromosomes بيبقى ليها short arm و long arm مش متساويين والـ centromere أقرب لطرف واحد؟","whyWrong":["الـ acrocentric: الـ centromere قريب جدًا من الطرف العلوي والـ p arm قصير جدًا، وبعضها عليه satellites.","الـ telocentric: الـ centromere في الطرف خالص ومفيش short arm، ومش موجود في الإنسان.",null,"الـ metacentric: الـ centromere في النص والذراعين متساويين (p = q)."]},{"id":"F2023A-05","topic":"histo","concept":"Cytoplasmic organelles","source":"F2023A","stem":"Protein synthesizing cells are rich in which of the following structure?","options":["SER","Lipid droplets","Mucus granules","rER"],"answer":3,"explanation":"الخلايا اللي بتصنع بروتين غنية بالـ rER، لأن الـ polyribosomes اللي عليه هي اللي بتصنع البروتين (زي الـ plasma cells والـ fibroblasts).","memoryTrick":"Protein = Rough.","stemAr":"الخلايا اللي بتصنع بروتين بتكون غنية بأنهي structure من دول؟","whyWrong":["الـ sER مفيهوش ribosomes ومش للبروتين. ده للـ lipids والـ steroids والـ detoxification.","الـ lipid droplets من الـ inclusions (stored food)، مش organelle بيصنع بروتين.","الـ mucus granules منتج، مش الـ organelle اللي بيصنع البروتين.",null]},{"id":"F2023A-06","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"F2023A","stem":"Actin filaments are responsible for formation of which of the following?","options":["Centriole","Contractile ring","Mitotic spindle","Cilia"],"answer":1,"explanation":"في الخلايا اللي بتنقسم الـ actin filaments بتتفاعل مع الـ myosin وتعمل الـ contractile ring اللي بيقسم الـ cytoplasm. وفي الـ telophase الـ cleavage furrow بيحصل بانقباض الـ actin microfilaments. أما الـ centrioles والـ spindle والـ cilia فمن الـ microtubules.","memoryTrick":"Actin = الحزام اللي بيخنق الخلية (ring).","stemAr":"الـ actin filaments مسئولة عن تكوين أنهي واحد من دول؟","whyWrong":["الـ centriole من الـ microtubules.",null,"الـ mitotic spindle من الـ microtubules.","الـ cilia الـ core بتاعها من الـ microtubules (9 doublets + 2 singlets)، مش actin."]},{"id":"F2023A-07","topic":"histo","concept":"Cytoplasmic organelles","source":"F2023A","stem":"Which of the following is concerned with formation of ribosomes?","options":["Golgi","Centriole","RER","Nucleolus"],"answer":3,"explanation":"الـ rRNA بيتصنع في الـ nucleolus، وبيتجمع مع البروتينات في النواة ويكوّن الـ ribosomal subunits. يعني الـ nucleolus هو المسئول عن تكوين الـ ribosomes.","memoryTrick":"Nucleolus = Ribosomes.","stemAr":"أنهي واحد من دول مسئول عن تكوين الـ ribosomes؟","whyWrong":["الـ Golgi للـ packing وتكوين الـ secretory vesicles والـ lysosomes.","الـ centriole ليه دور في الـ cell division وتكوين الـ cilia والـ flagella.","الـ RER عليه ribosomes، بس مش هو اللي بيكوّنها. اللبس جاي من وجودها عليه.",null]},{"id":"F2023A-08","topic":"histo","concept":"Cell membrane & transport","source":"F2023A","stem":"In the molecular structure of the cell membrane, which of the following structures fill the gap between the fatty acid tails in a ratio one by one?","options":["Cholesterol","Lipid bilayer","Phospholipid","Integral protein"],"answer":0,"explanation":"الـ lipid component في الـ cell membrane عبارة عن phospholipids و cholesterol بنسبة 1:1. الـ cholesterol بيدخل بين الـ hydrophobic fatty acid tails، بيحدد حركتها وبينظّم الـ fluidity.","memoryTrick":"Cholesterol = الحشو بين الذيول.","stemAr":"في التركيب الجزيئي للـ cell membrane، أنهي structure من دول بيملا الفراغ بين ذيول الـ fatty acids بنسبة واحد لواحد؟","whyWrong":[null,"الـ lipid bilayer هو الغشا كله مش اللي بيملا الفراغ.","الـ phospholipid هو اللي عامل الفراغ أصلًا.","الـ integral proteins مدفونة كليًا أو جزئيًا في الـ lipid bilayer، ومش هي اللي بتملا الفراغ بين الذيول بنسبة 1:1."]},{"id":"F2023B-01","topic":"embryo","concept":"Female cycles & hormones","source":"F2023B","stem":"the secretory phase of the uterus is characterized by which of the following","options":["it is under the influence of progesterone","it starts from the 5th day till 14th day of the cycle","initiate the formation of a new layer of endometrium in the uterus","Thickness of endometrium in this stage is 0.5 mm"],"answer":0,"explanation":"الـ secretory phase (من يوم 16 لـ 28) بتحصل بعد الـ ovulation تحت تأثير الـ progesterone اللي بيفرزه الـ corpus luteum: الخلايا بتبقى columnar، والغدد convoluted ومليانة إفراز، والـ spiral arteries بتتسع وتتلوى.","memoryTrick":"Secretory = Progesterone (بعد التبويض).","stemAr":"الـ secretory phase بتاعة الـ uterus بتتميز بأنهي واحدة من دول؟","whyWrong":[null,"من يوم 5 لـ 15 ده الـ proliferative phase (تحت تأثير الـ estrogen).","الـ endometrium بيبدأ يتكون من جديد في الـ proliferative phase.","سُمك الـ endometrium 0.5 mm ده في الـ menstrual phase."]},{"id":"F2023B-02","topic":"embryo","concept":"Implantation & second week","source":"F2023B","stem":"what is the site of blastocyst implantation in placenta previa","options":["the tube","uterine cavity","ovary","rectouterine pouch"],"answer":1,"repeatOf":"EM2022-07","explanation":"الـ placenta previa = implantation جوه الـ uterine cavity لكن قريب من الـ internal os. أما الـ ovary والـ tube والـ peritoneal wall فدي implantation بره الرحم.","memoryTrick":"Previa = جوه الرحم بس تحت.","stemAr":"مكان زرع الـ blastocyst في حالة الـ placenta previa فين؟","whyWrong":["الـ tube أشهر مكان للـ implantation بره الرحم (95%).",null,"الـ ovary من أماكن الـ implantation بره الرحم.","الـ rectouterine pouch (peritoneal) من أماكن الـ implantation بره الرحم."]},{"id":"F2023B-03","topic":"embryo","concept":"Gametogenesis","source":"F2023B","stem":"Capacitation means which of the followings","options":["adaptation of sperms in female genital tract","Acrosome release proteolytic enzymes such as trypsin like substances.","It is induced by zona pellucida proteins","release of lysosomal enzymes from cortical granules"],"answer":0,"explanation":"الـ capacitation = adaptation للـ sperms في الـ female genital tract (حوالي 7 ساعات). بيحصل تغيير في الـ cell membrane بتاع الـ sperm وبتتشال طبقة glycoprotein (cleaning of the sperm).\nالنتيجة: منطقة الـ acrosomal cap بتتغير فيبقى الـ acrosome reaction ممكن، والـ sperm بيبقى hyperactive. ومن غير capacitation مفيش fertilization.","memoryTrick":"Capacitation = تأهيل في بيت الست.","stemAr":"الـ capacitation معناها أنهي واحدة من دول؟","whyWrong":[null,"ده وصف الـ acrosomal reaction.","الـ capacitation بتحصل بتأثير الـ female genital tract، مش بالـ zona pellucida.","ده وصف الـ cortical reaction اللي بتحصل في الـ ovum بعد دخول الـ sperm."]},{"id":"F2023B-04","topic":"anat","concept":"Anatomical position, planes & terms","source":"F2023B","stem":"In anatomical position the palm of the hand faces","options":["Anteriorly","Posteriorly","Superiorly","Inferiorly"],"answer":0,"explanation":"الـ anatomical position: واقف erect، الراس والعين والصوابع لقدام، الإيدين جنب الجسم، والـ palms بتبص لقدام (anteriorly)، والرجلين جنب بعض.","memoryTrick":"الكف قدّام 🖐️.","stemAr":"في الـ anatomical position، الـ palm بتبص ناحية:","whyWrong":[null,"الـ posterior ده في الـ pronation.","superior مش من الـ anatomical position.","inferior مش من الـ anatomical position."]},{"id":"F2023B-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"F2023B","stem":"which of the followings is responsible for the growth of the length of the bone","options":["periosteum","growing plate","arterial supply","nerve supply"],"answer":1,"explanation":"نمو العظمة:\n• في الطول: بترسيب عظم على جانبين الـ growing plate لحد ما تتعظم وتلتحم بالـ diaphysis.\n• في التخن: بترسيب عظم تحت الـ periosteum بالـ osteoblasts، والـ osteoclasts بتعمل الـ marrow cavity.","memoryTrick":"طول = Plate / تخن = Periosteum.","stemAr":"أنهي واحد من دول مسئول عن زيادة طول العظمة؟","whyWrong":["الـ periosteum (subperiosteal deposition) مسئول عن التخن مش الطول.",null,"الـ arterial supply بيغذي العظمة، مش هو المسئول عن النمو في الطول.","الـ nerve supply ملوش دور في النمو في الطول."]},{"id":"F2023B-06","topic":"embryo","concept":"Female cycles & hormones","source":"F2023B","stem":"the estrogen is secreted from","options":["granulosa cell","corpus luteum","cells of anterior lobe of pituitary gland","endometrial cells"],"answer":0,"explanation":"الـ proliferative phase بتحصل تحت تأثير الـ estrogen اللي بيفرزه الـ Graafian follicle. الإجابة المعتمدة إن مصدره الـ granulosa cells (خلايا الـ follicle).","memoryTrick":"Granulosa = Estrogen.","stemAr":"الـ estrogen بيتفرز من:","whyWrong":[null,"الـ corpus luteum بيفرز الـ progesterone (اللي بيعمل الـ secretory phase).","الـ pituitary gland بتفرز الـ FSH والـ LH.","الـ endometrium بيتأثر بالـ estrogen، مش هو اللي بيفرزه."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"F2023B-07","topic":"embryo","concept":"Fertilization & cleavage","source":"F2023B","stem":"which of the followings is true about the fertilization","options":["it occurs usually in the infundibulum of the fallopian tube","chromosomal sex of the embryo is determined at fertilization.","the oocyte remains viable for 5 days","all the sperms can penetrate the zona pellucida"],"answer":1,"explanation":"من نتائج الـ fertilization: تكوين الـ zygote، ورجوع العدد الطبيعي للـ chromosomes (46)، وتحديد الجنس (sex is defined)، وبداية الـ cleavage.","memoryTrick":"الجنس يتحدد من الأب لحظة التلقيح.","stemAr":"أنهي واحدة من دول صح عن الـ fertilization؟","whyWrong":["الـ fertilization بتحصل في الـ ampulla، مش الـ infundibulum.",null,"من غير fertilization الـ oocyte بيتحلل حوالي 24 ساعة بعد الـ ovulation، مش 5 أيام.","sperm واحد بس اللي بيدخل، وبعد دخوله الـ ovum بيعمل cortical and zonal reaction."]},{"id":"F2023B-08","topic":"anat","concept":"Movements","source":"F2023B","stem":"Medial rotation means","options":["Moving the limb externally around the long axis","Moving the limb internally around the long axis","Moving the limb upward around horizontal axis","Moving the limb downward around horizontal axis"],"answer":1,"explanation":"الـ rotation = حركة الجزء حوالين الـ long axis. الـ medial (internal) rotation بيقرّب الـ anterior surface للطرف من الـ median plane، والـ lateral (external) بيبعده.","memoryTrick":"Medial = لجوه.","stemAr":"الـ medial rotation معناها:","whyWrong":["ده الـ lateral (external) rotation.",null,"حركة لفوق حوالين horizontal axis تبقى flexion أو elevation، مش rotation.","نفس الكلام."]},{"id":"F2023B-09","topic":"anat","concept":"Anatomical position, planes & terms","source":"F2023B","stem":"Coronal plane divide the body into","options":["Upper and lower halves","Anterior and posterior halves","Right and left halves","Superior and inferior halves"],"answer":1,"explanation":"الـ coronal plane بيقسم الجسم لـ anterior و posterior.","memoryTrick":"Coronal = قدام/ورا.","stemAr":"الـ coronal plane بيقسم الجسم لـ:","whyWrong":["upper و lower ده الـ horizontal.",null,"right و left ده الـ sagittal.","superior و inferior ده الـ horizontal كمان."]},{"id":"F2023B-10","topic":"anat","concept":"Bone structure, blood supply & growth","source":"F2023B","stem":"Bone marrow is supplied by","options":["Periosteal artery","Epiphyseal artery","Nutrient artery"],"answer":2,"explanation":"الـ nutrient artery بتدخل العظمة من الـ nutrient canal وبتتقسم لـ proximal و distal branches في الـ medullary cavity، وبتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.","memoryTrick":"Nutrient = Marrow.","stemAr":"الـ bone marrow بيتغذى من:","whyWrong":["الـ periosteal arteries المصدر الأساسي لكل العظام، وبتغذي الـ outer compact bone.","الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).",null]},{"id":"F2023B-11","topic":"anat","concept":"Skeleton & types of bones","source":"F2023B","stem":"Which of the following is axial skeleton","options":["Femur","Humerus","Skull","Hip"],"answer":2,"explanation":"الـ axial body parts: الـ head (الـ skull) والـ neck والـ trunk. أما الـ upper و lower extremities فـ appendicular.","memoryTrick":"Skull = Axial.","stemAr":"أنهي واحد من دول من الـ axial skeleton؟","whyWrong":["الـ femur في الـ lower limb، فهو appendicular.","الـ humerus في الـ upper limb، فهو appendicular.",null,"⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."]},{"id":"F2023B-12","topic":"anat","concept":"Anatomical position, planes & terms","source":"F2023B","stem":"Planter aspect of the foot means","options":["Sole","Palm","Dorsum"],"answer":0,"explanation":"الـ plantar aspect = الـ sole of the foot. الـ palm للإيد والـ dorsum الضهر.","memoryTrick":"Plantar = Planta = باطن القدم.","stemAr":"الـ plantar aspect بتاع القدم معناه:","whyWrong":[null,"الـ palm لليد مش للقدم.","الـ dorsum الوش التاني للقدم (فوق)."]},{"id":"F2023B-13","topic":"anat","concept":"Skeleton & types of bones","source":"F2023B","stem":"Carpal bones are","options":["Long bone","Short bones","Irregular bones","Pneumatic bone"],"answer":1,"explanation":"الـ carpal bones (والـ tarsal) short bones.","memoryTrick":"Carpal & Tarsal = Short (قصيرين).","stemAr":"الـ carpal bones هي:","whyWrong":["الـ carpal مش long.",null,"مش irregular.","الـ pneumatic فيها هوا (عظام الجمجمة)."]},{"id":"F2023B-14","topic":"embryo","concept":"Gametogenesis","source":"F2023B","stem":"which of the followings is the character of oogenesis","options":["starts at puberty and extend till old age","it takes about 64 days","Primary oocyte complete its first meiotic division at puberty","Secondary oocyte completes its 2nd meiotic division at the time of ovulation"],"answer":2,"explanation":"في الـ oogenesis:\n• قبل الولادة: الـ primary oocyte بيبدأ meiosis I ويقف في الـ first meiotic prophase.\n• عند الـ puberty: الـ meiotic block بيتشال، فيكمّل الـ first meiotic division ويطلع secondary oocyte + first polar body.\n• عند الـ ovulation: الـ secondary oocyte بيدخل meiosis II ويقف في الـ metaphase II، ويكمّلها بس لو حصل fertilization.","memoryTrick":"1st division = Puberty / 2nd = Fertilization.","stemAr":"أنهي واحدة من دول من صفات الـ oogenesis؟","whyWrong":["ده وصف الـ spermatogenesis (بتبدأ عند الـ puberty وتستمر طول العمر). الـ oogenesis بتبدأ في الـ fetal life وتخلص عند الـ menopause.","الـ spermatogenesis هي اللي بتاخد حوالي شهرين، مش الـ oogenesis.",null,"عند الـ ovulation الـ secondary oocyte بيقف في الـ metaphase II، وبيكمّل الـ meiosis II بس لو حصل fertilization."]},{"id":"F2023B-15","topic":"embryo","concept":"Fertilization & cleavage","source":"F2023B","stem":"compaction means which of the followings","options":["the blastomere forming a compact ball of cells held together by tight junctions","changes in the zona reaction to prevent further binding and penetration of the sperm","release of the acrosomal enzymes helps penetration of the sperm to the zona pellucida","the ability of the sperm to fertize the ovum"],"answer":0,"explanation":"بعد الـ 8-cell stage الـ embryo بيعمل compaction بسبب زيادة الالتصاق بين الخلايا (cell-cell adhesion)، فيبقى كورة solid من 16-32 خلية شكلها زي التوتة = morula.","memoryTrick":"Compaction = ضغط الخلايا كورة واحدة.","stemAr":"الـ compaction معناها أنهي واحدة من دول؟","whyWrong":[null,"ده وصف الـ zonal reaction اللي بتحصل بعد دخول الـ sperm.","ده وصف الـ acrosomal reaction.","ده وصف الـ capacitation."]},{"id":"F2023B-16","topic":"embryo","concept":"Gametogenesis","source":"F2023B","stem":"morphological changes of spherical spermatids to form elongated sperm is called","options":["spermatogenesis","Spermiogenesis","acrosomal reaction"],"answer":1,"explanation":"الـ spermiogenesis هي تحوّل الـ spermatid المدوّر لـ sperm طويل (بدون انقسام).","memoryTrick":"Spermio = تغيير شكل بس.","stemAr":"التغيرات الشكلية اللي بتحوّل الـ spermatid الكروي لـ sperm طويل اسمها:","whyWrong":["الـ spermatogenesis العملية كلها من الـ spermatogonium للـ sperm. التحول الشكلي جزء منها اسمه spermiogenesis.",null,"الـ acrosome reaction بيحصل وقت الـ fertilization."]},{"id":"F2023B-17","topic":"embryo","concept":"Gametogenesis","source":"F2023B","stem":"the spermlysin lies in which part of the sperm","options":["Head","Neck","Middle piece","Tail"],"answer":0,"explanation":"الإنزيمات اللي بتساعد الـ sperm يخترق البويضة موجودة في الـ acrosome، والـ acrosome بيغطي الـ head من قدام.","memoryTrick":"Lysin في الراس.","stemAr":"الـ spermlysin موجود في أنهي جزء من الـ sperm؟","whyWrong":[null,"الـ neck فيه الـ centriole.","الـ middle piece فيه الـ mitochondria.","الـ tail للحركة. الـ spermlysin جوه الـ acrosome في الـ head."]},{"id":"F2023B-18","topic":"anat","concept":"Bone structure, blood supply & growth","source":"F2023B","stem":"which of the following is the character of the spongy bone","options":["it forms the out part of any bone","it is consists of number of cylindrical units called Haversian system","It is formed of trabeculae, the lamellae are branching and anastmose with"],"answer":2,"explanation":"الـ spongy bone مكوّن من trabeculae، والـ lamellae بتتفرع وتتشابك (anastomose) وبينهم مسافات فيها marrow. الـ Haversian systems خاصة بالـ compact.","memoryTrick":"Spongy = Trabeculae متشابكة.","stemAr":"أنهي واحدة من دول من صفات الـ spongy bone؟","whyWrong":["الجزء الخارجي compact.","الـ Haversian systems صفة الـ compact.",null]},{"id":"EM2023-01","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"The function of rough endoplasmic reticulum is to synthesize:","options":["Lipid.","Protein that will be secreted by the cell.","Cytoplasmic protein necessary for the cells' own existence.","Carbohydrates."],"answer":1,"explanation":"الـ attached ribosomes (على الـ rER) بتصنع البروتينات اللي هتتفرز برا الخلية (زي الإنزيمات والهرمونات). أما الـ free ribosomes فبتصنع البروتينات اللي بتستعملها الخلية جوه الـ cytosol.","memoryTrick":"Rough = للتصدير / Free = للاستهلاك المحلي.","stemAr":"وظيفة الـ rough endoplasmic reticulum إنه يصنع:","whyWrong":["الـ lipids (phospholipids والـ steroids) بيصنعها الـ sER.",null,"البروتينات اللي بتستعملها الخلية جوه الـ cytosol بتتصنع على الـ free ribosomes.","الـ carbohydrates بتتضاف للبروتينات كتعديل (في الـ Golgi)، والـ rER مش بيصنع carbohydrates."]},{"id":"EM2023-02","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"Smooth endoplasmic reticulum:","options":["Sometimes has ribosomes attached to its membrane","Is rarely found in skeletal muscle cells","Areas of localized basophilic indicate its presence","Is present in cells where drug detoxification is taking place"],"answer":3,"explanation":"من وظايف الـ sER الـ detoxification للأدوية والهرمونات والكحول في الـ liver cells. الـ sER مفيهوش polyribosomes، وبيكون well-developed في الـ muscle cells (بيطلع Ca ions وقت الانقباض).","memoryTrick":"Smooth = Detox.","stemAr":"الـ smooth endoplasmic reticulum:","whyWrong":["الـ sER مفيهوش ribosomes خالص. اللي عليه ribosomes هو الـ rER.","بالعكس، الـ sER well-developed في الـ muscle cells.","الـ localized basophilia سببها الـ rER (الـ RNA في الـ ribosomes). الـ sER لما يكتر بيدي acidophilia.",null]},{"id":"EM2023-03","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"The Golgi apparatus is:","options":["The site of packaging of secretory products of the cell.","The site of protein synthesis.","Continuous with smooth endoplasmic reticulum.","Capable of providing energy."],"answer":0,"explanation":"الـ Golgi apparatus مسئول عن الـ packing والـ concentration والتخزين للبروتينات اللي جاية من الـ rER، وتعديلها كيميائيًا، وتكوين الـ secretory vesicles والـ lysosomes.","memoryTrick":"Golgi = مكتب البريد 📦 (يستلم من الـ rER ويغلّف ويبعت).","stemAr":"الـ Golgi apparatus هو:","whyWrong":[null,"البروتين بيتصنع في الـ rER.","اللي متصل بالـ sER هو الـ rER. الـ Golgi بيوصله البروتين من الـ rER عن طريق transfer vesicles عند الـ cis face.","إنتاج الطاقة (ATP) شغل الـ mitochondria."]},{"id":"EM2023-04","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"Multivesicular bodies are:","options":["Primary lysosomes.","Formed as a result of digestion of solid material.","Formed as a result of digestion of fluid material.","Autophagic vacuoles."],"answer":2,"explanation":"الـ multivesicular body نوع من الـ secondary lysosomes: بيتكون لما الـ primary lysosome يندمج مع pinocytic vesicle (fluid material).","memoryTrick":"Multivesicular = Pinocytic (سوائل) / Heterolysosome = Phagocytic (صلب) / Autolysosome = organelles قديمة.","stemAr":"الـ multivesicular bodies هي:","whyWrong":["الـ primary lysosome لسه طالع من الـ Golgi وما دخلش في أي هضم.","هضم المواد الصلبة (primary lysosome + phagocytic vesicle) بيكوّن heterolysosome.",null,"الـ autolysosome بيتكون من primary lysosome + autophagic vesicle فيها organelles قديمة من الخلية نفسها."]},{"id":"EM2023-05","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2023","stem":"Microtubules have important role in:","options":["Carbohydrate metabolism.","Oxidative phosphorylation.","Water balance.","Formation of the mitotic spindle during mitosis."],"answer":3,"explanation":"من وظايف الـ microtubules: تحديد شكل الخلية، النقل جوه الخلية للـ macromolecules، تكوين الـ mitotic spindle وقت الانقسام، وتكوين الـ centrioles والـ cilia والـ flagella.","memoryTrick":"Microtubules = Spindle.","stemAr":"الـ microtubules ليها دور مهم في:","whyWrong":["الـ carbohydrate metabolism مش من وظايف الـ microtubules.","الـ oxidative phosphorylation بتحصل في الـ mitochondria (الـ elementary particles = ATP synthetase).","الـ water balance مش من وظايف الـ microtubules.",null]},{"id":"EM2023-06","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2023","stem":"DNA could be found in:","options":["Ribosomes.","Golgi apparatus.","Mitochondria.","Lysosomes."],"answer":2,"explanation":"الـ mitochondria عندها genetic apparatus خاص بيها: circular DNA في الـ matrix، وعشان كده بتتقسم بـ simple division.","memoryTrick":"Mitochondria = عندها DNA خاص.","stemAr":"الـ DNA ممكن يتلاقي في:","whyWrong":["الـ ribosomes مكوّنة من rRNA وبروتين، مفيهاش DNA.","الـ Golgi مفيهوش DNA.",null,"الـ lysosomes مفيهاش DNA."]},{"id":"EM2023-07","topic":"histo","concept":"Nucleus & chromatin","source":"EM2023","stem":"Heterochromatin is:","options":["Present in the nuclei of metabolically active cells.","Special type of stain.","Present in the nuclei of metabolically inactive cells","Type of cell inclusions."],"answer":2,"explanation":"الـ heterochromatin هو الـ chromatin المكثّف (condensed, inactive)، بيمثل chromosomes ملفوفة فيها inactive genes، زي في الـ small lymphocytes. أما الـ euchromatin (extended, active) ففيه الـ active genes في الخلايا اللي بتصنع بروتين.","memoryTrick":"Hetero = Hidden & Inactive.","stemAr":"الـ heterochromatin هو:","whyWrong":["الخلايا النشطة اللي بتصنع بروتين فيها euchromatin (vesicular nucleus).","ده نوع chromatin مش صبغة.",null,"الـ chromatin جزء من النواة وبيحمل الـ genetic material، مش من الـ cytoplasmic inclusions."]},{"id":"EM2023-08","topic":"histo","concept":"Nucleus & chromatin","source":"EM2023","stem":"The nucleolus is formed of:","options":["Heterochromatin and euchromatin.","Nucleolonema and pars amorpha.","Nucleolus associated and peripheral chromatin.","Condensed chromatin."],"answer":1,"explanation":"الـ nucleolus كتلة basophilic من غير غشا. فيه مناطق غامقة: pars amorpha (الـ nucleolar organizer) و pars fibrosa و pars granulosa. الـ pars fibrosa مع الـ pars granulosa بيتسموا nucleolonema. والمناطق الفاتحة اسمها nucleolar sap.","memoryTrick":"Nucleolus = Pars amorpha + Nucleolonema (fibrosa + granulosa).","stemAr":"الـ nucleolus مكوّن من:","whyWrong":["الـ heterochromatin والـ euchromatin نوعين الـ chromatin في النواة، مش مكونات الـ nucleolus.",null,"الـ nucleolus-associated chromatin والـ peripheral chromatin من أماكن الـ heterochromatin. الأول بيحيط بالـ nucleolus بس مش من مكوناته.","الـ condensed chromatin هو الـ heterochromatin."]},{"id":"EM2023-09","topic":"histo","concept":"Nucleus & chromatin","source":"EM2023","stem":"The nuclear pore:","options":["Is at regular intervals.","Is bridged by a unit membrane.","Is a transient structure.","Allows for communication between the nucleus and the cytoplasm"],"answer":3,"explanation":"الـ nuclear pore complexes فتحات دايرية على مسافات في المكان اللي الغشائين بيلتحموا فيه. وظيفتها نقل البروتينات للنواة وخروج الـ RNA والـ ribosomal subunits للـ cytoplasm، يعني التواصل بين النواة والـ cytoplasm.","memoryTrick":"Pore = باب بين النواة والسيتوبلازم.","stemAr":"الـ nuclear pore:","whyWrong":["الـ pores فعلًا موجودة على مسافات (at intervals) في الـ nuclear envelope، لكن الإجابة المعتمدة هي وظيفتها: التواصل بين النواة والـ cytoplasm.","الـ pore فتحة في المكان اللي الـ inner والـ outer membranes بيلتحموا فيه، مش مقفولة بـ unit membrane.","الـ pore complexes جزء من تركيب الـ nuclear envelope، مش مذكور إنها مؤقتة.",null],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2023-10","topic":"histo","concept":"Cell membrane & transport","source":"EM2023","stem":"Glycocalyx is:","options":["The protein component of the cell membrane.","The hydrophilic end of lipid.","The carbohydrate component of the cell membrane.","The hydrophobic end of lipid."],"answer":2,"explanation":"الـ cell coat (glycocalyx) هو الـ carbohydrate component للـ cell membrane: glycoproteins و glycolipids على السطح الخارجي، وفيه receptors للأدوية والهرمونات والبكتيريا والفيروسات.","memoryTrick":"Glyco = Carbohydrate.","stemAr":"الـ glycocalyx هو:","whyWrong":["الـ protein component (peripheral و integral) حوالي 50% من الغشا، وده غير الـ glycocalyx.","الـ hydrophilic polar head بتاع الـ phospholipid: charged ومتجه ناحية الـ aqueous solutions.",null,"الـ hydrophobic tail بتاع الـ phospholipid: non-charged ومتجه لجوه بعيد عن الـ aqueous solutions."]},{"id":"EM2023-11","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2023","stem":"Which of the following statements is incorrect?","options":["Microtubules are involved in ciliary movement and intracellular transport.","The cis (forming) face of Golgi apparatus is where secretory granules are formed.","The microtubules of the centrioles and in the basal body of cilia have a 9x3 arrangement.","Ribosomes, made of rrna and protein, are the site of protein synthesis."],"answer":1,"explanation":"الجملة الغلط B: الـ cis face (Entry = Convex = Forming = Immature) بتستقبل الـ transfer vesicles من الـ rER. أما الـ secretory vesicles فبتطلع من الـ trans face (Exit = Concave = Secretory = Mature).","memoryTrick":"Cis = داخل (من الـ rER) / Trans = خارج (إفراز).","stemAr":"أنهي جملة من دول غلط؟","whyWrong":["جملة صح: من وظايف الـ microtubules النقل جوه الخلية، والـ cilia الـ core بتاعها microtubules. والسؤال عن الغلط.",null,"جملة صح: جدار الـ centriole 9 bundles كل واحدة 3 MTs (triplets)، والـ basal body هو centriole بنفس الترتيب.","جملة صح: الـ ribosomes مكوّنة من rRNA وبروتين ووظيفتها الـ protein synthesis."]},{"id":"EM2023-12","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2023","stem":"Which of the following is one of the characteristics of anatomical position?","options":["The arms are abducted","The palm face anterior","The lower limbs are abducted","The toes directed to the left."],"answer":1,"explanation":"في الـ anatomical position: واقف، الرجلين مقفولين، الإيدين جنبه، والـ palms لقدام.","memoryTrick":"Palms Forward.","stemAr":"أنهي واحدة من دول من صفات الـ anatomical position؟","whyWrong":["الـ arms في الـ anatomical position جنب الجسم (adducted).",null,"الـ lower limbs مقفولة (adducted).","الـ toes لقدام مش للشمال."]},{"id":"EM2023-13","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2023","stem":"Which of the following anatomical planes divided the body into anterior and posterior parts?","options":["Horizontal plane.","Coronal plane","Midsagittal plane","Parasagittal plane"],"answer":1,"explanation":"الـ coronal plane بيقسم الجسم لـ anterior و posterior.","memoryTrick":"Coronal = قدام/ورا.","stemAr":"أنهي anatomical plane من دول بيقسم الجسم لجزء anterior وجزء posterior؟","whyWrong":["الـ horizontal فوق وتحت.",null,"الـ midsagittal يمين وشمال متساويين.","الـ parasagittal يمين وشمال مش متساويين."]},{"id":"EM2023-14","topic":"anat","concept":"Movements","source":"EM2023","stem":"Which of the following movement of the limb upward?","options":["Flexion","Elevation","Extension","Depression"],"answer":1,"explanation":"الـ elevation = تحريك الجزء لفوق (superiorly) زي رفع الكتف، والـ depression = تحريكه لتحت زي خفض الكتف.","memoryTrick":"Elevation = Elevator لفوق ⬆️.","stemAr":"أنهي حركة من دول بتحرك الطرف لفوق؟","whyWrong":["الـ flexion = bending ناحية الـ ventral surface (ثني المفصل).",null,"الـ extension = عكس الـ flexion، فرد المفصل.","الـ depression تحريك لتحت، عكس المطلوب."]},{"id":"EM2023-15","topic":"anat","concept":"Cartilage","source":"EM2023","stem":"Which of the following cartilage disappears in the adult?","options":["Growing plate","Articular cartilage","Costal cartilage","Cartilage of the auricle"],"answer":0,"explanation":"الغضروف بيفضل في أماكن معينة: الـ articular surfaces، الـ costal cartilage، الـ air passages (nasal و laryngeal و tracheal و bronchial)، والـ external ear والـ Eustachian tube. أما الـ growing plate فبتتعظم وتلتحم بالـ diaphysis.","memoryTrick":"Growth plate = بيقفل بعد البلوغ.","stemAr":"أنهي cartilage من دول بيختفي في البالغين؟","whyWrong":[null,"الـ articular cartilage بيفضل على أسطح المفاصل.","الـ costal cartilage بيفضل يوصّل الضلوع بالـ sternum.","غضروف الـ external ear بيفضل."]},{"id":"EM2023-16","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2023","stem":"There are two forms of bone, which of the following is the character of spongy bone?","options":["It consists of number of cylindrical units called haversian system","It is formed of trabeculae","It forms the surface layer of all bones","It provides strength for weight bearing"],"answer":1,"explanation":"الـ spongy (cancellous) bone مكوّن من trabeculae متشابكة بينها spaces فيها marrow. الـ Haversian systems والـ surface layer والـ weight bearing صفات الـ compact bone.","memoryTrick":"Spongy = إسفنجة = Trabeculae.","stemAr":"فيه نوعين من العظم، أنهي واحدة من دول صفة الـ spongy bone؟","whyWrong":["الـ Haversian systems صفة الـ compact.",null,"الطبقة الخارجية compact.","تحمّل الوزن والقوة صفة الـ compact."]},{"id":"EM2023-17","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2023","stem":"Which of the following arteries supplies the bone marrow?","options":["Periosteal artery","The articular artery","Epiphyseal artery","Nutrient artery"],"answer":3,"explanation":"الـ nutrient artery بتدخل العظمة من الـ nutrient canal وبتتقسم لـ proximal و distal branches في الـ medullary cavity، وبتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.","memoryTrick":"Nutrient = Marrow.","stemAr":"أنهي artery من دول بتغذي الـ bone marrow؟","whyWrong":["الـ periosteal arteries المصدر الأساسي لكل العظام، وبتغذي الـ outer compact bone.","الـ articular arteries بتغذي المفاصل وأطراف العظمة (epiphyseal و metaphyseal branches).","الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).",null]},{"id":"EM2023-18","topic":"embryo","concept":"Implantation & second week","source":"EM2023","stem":"Which structure does not take place in the late blastocyst?","options":["Zona pellucida","Trophoblast","Embryoblast","Blastocele"],"answer":0,"explanation":"قبل الـ implantation الـ blastocyst لازم يتخلص من الـ zona pellucida (hatching). الإجابة المعتمدة إن الـ late blastocyst هو اللي حصله hatching، ففيه trophoblast و inner cell mass (embryoblast) و blastocele من غير zona.","memoryTrick":"Late = خرج من الـ zona (Hatched).","stemAr":"أنهي structure مبيتكونش في الـ late blastocyst؟","whyWrong":[null,"الـ trophoblast (الـ outer layer) موجود في الـ blastocyst.","الـ embryoblast (inner cell mass) موجود.","الـ blastocele هو الـ cavity بتاعة الـ blastocyst نفسه."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2023-19","topic":"embryo","concept":"Implantation & second week","source":"EM2023","stem":"Which statement is true about the trophoblast?","options":["It differentiates into outer cytotrophoblast and inner syncytiotrophoblast","It differentiates into inner cytotrophoblast and outer syncytiotrophoblast","Structure called \"trophoblast\" does not exist during the development of human","It does not differentiate further"],"answer":1,"explanation":"الـ trophoblast بيتمايز لـ inner cytotrophoblast (خلايا واضحة الحدود) و outer syncytiotrophoblast (كتلة من غير حدود بتغزو الـ endometrium).","memoryTrick":"Syncytio بره (بيهجم) / Cyto جوه.","stemAr":"أنهي جملة صح عن الـ trophoblast؟","whyWrong":["مقلوبة: الـ cytotrophoblast جوه والـ syncytio برا.",null,"الـ trophoblast موجود فعلًا.","بيتمايز لطبقتين في الأسبوع التاني."]},{"id":"EM2023-20","topic":"embryo","concept":"Implantation & second week","source":"EM2023","stem":"Where originates the extraembryonic mesoderm?","options":["It is a result of the migration of cells from the neuroectoderm","In a site between trophoblast and embryoblast","In a site between hypoblast and epiblast","In a site between endoderm and ectoderm"],"answer":1,"explanation":"الـ extraembryonic mesoderm: خلايا بتظهر بين الـ inner surface بتاع الـ cytotrophoblast والـ outer surface بتاع الـ yolk sac، وبتكوّن طبقة loose connective tissue.","memoryTrick":"Extraembryonic = بين الـ trophoblast والـ embryo.","stemAr":"الـ extraembryonic mesoderm أصله منين؟","whyWrong":["الـ extraembryonic mesoderm بيظهر بين الـ cytotrophoblast والـ yolk sac، مش من الـ neuroectoderm.",null,"الـ hypoblast والـ epiblast هما الـ bilaminar germ disc نفسه، ومفيش بينهم المكان ده.","الـ extraembryonic mesoderm بيظهر بين الـ cytotrophoblast والـ yolk sac في الأسبوع التاني."]},{"id":"EM2023-21","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2023","stem":"Where the fertilization occurs usually?","options":["In the infundibular part of the Fallopian tube","In the ampullary part of the Fallopian tube","Horn of the uterus (cornua uteri)","Cavity of the uterus"],"answer":1,"explanation":"الـ fertilization بتحصل في الـ ampulla (الـ lateral third) of the uterine tube.","memoryTrick":"Ampulla.","stemAr":"الـ fertilization بيحصل عادةً فين؟","whyWrong":["الـ infundibulum مش مكان الـ fertilization.",null,"الـ cornua مش مكان الـ fertilization.","الـ uterine cavity مكان الـ implantation، مش الـ fertilization."]},{"id":"EM2023-22","topic":"embryo","concept":"Gametogenesis","source":"EM2023","stem":"What is a capacitation?","options":["Capacitation is a process in which the glycoprotein layer over the acrosome is dissolved","Capacitation is a process in which sperm penetrates zona pellucida","Capacitation is a process in which the tail of the sperm is inactivated","Capacitation is a process in which the tail of the sperm is activated"],"answer":0,"explanation":"الـ capacitation = adaptation للـ sperms في الـ female genital tract (حوالي 7 ساعات). بيحصل تغيير في الـ cell membrane بتاع الـ sperm وبتتشال طبقة glycoprotein (cleaning of the sperm).\nالنتيجة: منطقة الـ acrosomal cap بتتغير فيبقى الـ acrosome reaction ممكن، والـ sperm بيبقى hyperactive. ومن غير capacitation مفيش fertilization.","memoryTrick":"Capacitation = نشيل الغطا من فوق الـ acrosome.","stemAr":"يعني إيه capacitation؟","whyWrong":[null,"اختراق الـ zona بيحصل بعد الـ capacitation والـ acrosomal reaction.","بالعكس، الـ capacitation بيخلي الـ sperm hyperactive.","الـ capacitation بيخلي الـ sperm hyperactive فعلًا، لكن تعريفها الأساسي هو شيل طبقة الـ glycoprotein."]},{"id":"EM2023-23","topic":"embryo","concept":"Implantation & second week","source":"EM2023","stem":"When starts the implantation?","options":["Immediately after fertilization","3rd day after fertilization","6th day after fertilization","9th day after fertilization"],"answer":2,"explanation":"الـ implantation بتبدأ حوالي اليوم السادس بعد الـ fertilization.","memoryTrick":"Day 6 = Implantation.","stemAr":"الـ implantation بيبدأ إمتى؟","whyWrong":["بعد الـ fertilization على طول لسه في مرحلة الـ zygote جوه الـ tube.","يوم 3 الـ morula لسه في الـ tube.",null,"يوم 9 الـ implantation بيكون شغال بالفعل وقرب يكمل."]},{"id":"EM2023-24","topic":"embryo","concept":"Implantation & second week","source":"EM2023","stem":"The most common site for implantation in ectopic pregnancy is:","options":["internal os of the uterus","mesentery","ovary","uterine tube"],"answer":3,"explanation":"بعد الـ implantation الطبيعي بيكون في الـ posterior wall of the uterus near the fundus. الـ abnormal implantation بره الرحم: 95% في الـ fallopian tube، أو في الـ ovary، أو في الـ peritoneal wall. وجوه الرحم: placenta previa.","memoryTrick":"Ectopic = Tube (95%).","stemAr":"أشهر مكان للـ implantation في الـ ectopic pregnancy هو:","whyWrong":["الـ implantation عند الـ internal os جوه الرحم = placenta previa.","الـ peritoneal implantation بره الرحم، لكنه مش الأشهر.","الـ ovary من أماكن الـ implantation بره الرحم، لكنه مش الأشهر.",null]},{"id":"EM2023-25","topic":"embryo","concept":"Implantation & second week","source":"EM2023","stem":"The first week of human development is characterized by formation of the:","options":["inner cell mass","trophoblast","blastocyst","all of the above"],"answer":3,"explanation":"في الأسبوع الأول بيحصل cleavage وتكوين الـ blastocyst اللي فيه inner cell mass و trophoblast، فكلهم صح.","memoryTrick":"Week 1 = Blastocyst بكل أجزاؤه.","stemAr":"الأسبوع الأول من نمو الإنسان بيتميز بتكوين:","whyWrong":["صح بس ناقص، كلهم بيتكونوا.","صح بس ناقص.","صح بس ناقص.",null]},{"id":"EM2023-26","topic":"embryo","concept":"Gametogenesis","source":"EM2023","stem":"The ovulated mammalian oocyte is arrested at:","options":["prophase of meiosis I","metaphase of meiosis I","prophase of meiosis II","metaphase of meiosis II"],"answer":3,"explanation":"عند الـ ovulation الـ secondary oocyte بيدخل الـ meiosis II ويقف في الـ metaphase II، ولو حصل fertilization بيكمّلها في الـ uterine tube ويطلع mature ovum + second polar body.","memoryTrick":"Ovulation = Metaphase II ✌️.","stemAr":"الـ oocyte بعد الـ ovulation في الثدييات بيكون واقف (arrested) عند:","whyWrong":["الـ primary oocyte بيقف في الـ prophase I من قبل الولادة، والـ block ده بيتشال عند الـ puberty، فوقت الـ ovulation بيكون كمّل الـ meiosis I.","وقت الـ ovulation الـ oocyte كمّل الـ meiosis I بالفعل وبقى secondary oocyte.","الـ secondary oocyte بيقف في الـ metaphase II مش الـ prophase II.",null]},{"id":"EM2023-27","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2023","stem":"All but one of the following statements about cleavage are true. EXCEPT?","options":["Cleavage occurs when the embryo travels through the Fallopian tube","During cleavage, the amount of DNA inside the embryo increases","Embryo is closed inside zona pellucida during cleavage","Cleavage continues after implantation"],"answer":3,"explanation":"الغلط D: الـ cleavage = انقسامات mitotic سريعة بتحصل في الـ fallopian tube والـ embryo جوه الـ zona pellucida. بعدها الـ morula بتوصل الرحم حوالي يوم 4، وبعدين الـ blastocyst هو اللي بيعمل implantation حوالي يوم 6. يعني الـ cleavage بيخلص قبل الـ implantation.","memoryTrick":"Cleavage في الـ tube ➜ Morula ➜ Blastocyst ➜ Implantation.","stemAr":"كل الجمل دي عن الـ cleavage صح ما عدا واحدة. أنهي؟","whyWrong":["جملة صح: الـ cleavage بيحصل في الـ fallopian tube والـ zygote رايح ناحية الرحم. والسؤال عن الغلط.","جملة صح: كل خلية بتفضل 2N، وعدد الخلايا (blastomeres) بيزيد مع كل انقسام، فإجمالي الـ DNA في الـ embryo بيزيد. اللي مش بيزيد هو الحجم (not accompanied by growth).","جملة صح: الـ blastomeres بتفضل جوه الـ zona pellucida، وحتى الـ morula لسه محاطة بيها.",null]},{"id":"EM2023-28","topic":"embryo","concept":"Implantation & second week","source":"EM2023","stem":"Which embryonic structure gives rise to cells in our bodies?","options":["epiblast and hypoblast","Hypoblast","Epiblast","Extraembryonic mesoderm"],"answer":2,"explanation":"الإجابة المعتمدة: الـ epiblast هو اللي بيدي الـ germ layers (ectoderm و mesoderm و endoderm). في الأسبوع التاني الـ bilaminar germ disc فيه epiblast (high columnar ناحية الـ amniotic cavity) و hypoblast (small cuboidal ناحية الـ blastocyst cavity).","memoryTrick":"Epiblast = أبو الجسم كله.","stemAr":"أنهي embryonic structure بيدي خلايا جسمنا؟","whyWrong":["الـ hypoblast بيدي structures extraembryonic (زي الـ yolk sac)، مش خلايا الجسم.","نفس الكلام.",null,"الـ extraembryonic mesoderm برا الجنين."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"ES2023-01","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2023","stem":"One of the functions of smooth endoplasmic reticulum is?","options":["Protein synthesis","Regulation of intracellular calcium distribution","Excretion","Maintain the skeleton of the cell"],"answer":1,"explanation":"من وظايف الـ sER إنه بيطلع الـ Ca ions (pump) وقت الـ muscle contraction، والـ sER بيكون well-developed في الـ muscle cells.","memoryTrick":"Smooth = Steroids + Detox + Ca.","stemAr":"واحدة من وظايف الـ smooth endoplasmic reticulum هي؟","whyWrong":["تصنيع البروتين وظيفة الـ rER (الـ attached polyribosomes).",null,"الـ excretion مش وظيفة organelle بالمعنى ده.","الـ cytoskeleton هو اللي بيعمل الهيكل."]},{"id":"ES2023-02","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2023","stem":"Actine filaments are responsible for formation of which of the following?","options":["Centriole","Cilia","Microvilli","Mitotic spindle"],"answer":2,"explanation":"في الخلايا اللي عليها microvilli، الـ actin filaments بتعمل الـ core بتاع الـ microvilli عشان تحافظ على شكلها وتغيّر طولها (تقصر وتطول). أما الـ centrioles والـ cilia والـ mitotic spindle فمن الـ microtubules.","memoryTrick":"Microvilli = Actin / Cilia = Microtubules.","stemAr":"الـ actin filaments مسئولة عن تكوين أنهي واحد من دول؟","whyWrong":["الـ centriole من الـ microtubules.","الـ cilia من الـ microtubules.",null,"الـ mitotic spindle من الـ microtubules."]},{"id":"ES2023-03","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2023","stem":"Which of the following is concerned with formation of ribosomes?","options":["Centriole","Golgi","Nucleolus","RER"],"answer":2,"repeatOf":"F2023A-07","explanation":"الـ rRNA بيتصنع في الـ nucleolus، وبيتجمع مع البروتينات في النواة ويكوّن الـ ribosomal subunits. يعني الـ nucleolus هو المسئول عن تكوين الـ ribosomes.","memoryTrick":"Nucleolus = Ribosomes.","stemAr":"أنهي واحد من دول مسئول عن تكوين الـ ribosomes؟","whyWrong":["الـ centriole ليه دور في الـ cell division وتكوين الـ cilia والـ flagella.","الـ Golgi للـ packing وتكوين الـ secretory vesicles والـ lysosomes.",null,"الـ RER عليه ribosomes، بس مش هو اللي بيكوّنها. اللبس جاي من وجودها عليه."]},{"id":"ES2023-04","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2023","stem":"Which is the main organelle that plays role in muscle contraction?","options":["Free ribosomes","Lysosomes","RER","SER"],"answer":3,"explanation":"من وظايف الـ sER إنه بيطلع الـ Ca ions (pump) وقت الـ muscle contraction، والـ sER بيكون well-developed في الـ muscle cells.","memoryTrick":"Contraction = Ca من الـ sER.","stemAr":"إيه الـ organelle الأساسي اللي له دور في انقباض العضلات؟","whyWrong":["الـ free ribosomes بتصنع البروتينات اللي بتستعملها الخلية جوه الـ cytosol.","الـ lysosomes للـ intracytoplasmic digestion.","الـ rER لتصنيع البروتينات اللي بتتفرز.",null]},{"id":"ES2023-05","topic":"anat","concept":"Skeleton & types of bones","source":"ES2023","stem":"middle phalanx of the little finger is example to which type of bone ?","options":["Long","Short","Irregular","Flat"],"answer":0,"explanation":"الـ long bones ليها tubular shaft فيه medullary cavity وأطراف expanded articular، وأمثلتها: humerus، femur، metacarpals، و phalanges.","memoryTrick":"Phalanx = Long صغيرة (miniature long bone).","stemAr":"الـ middle phalanx بتاعة الصباع الصغير مثال لأنهي نوع من العظام؟","whyWrong":[null,"الـ short bones cuboidal زي الـ carpal والـ tarsal bones.","الـ irregular bones زي الـ vertebrae والـ hip bone.","الـ flat bones زي الـ vault of skull والـ ribs والـ sternum والـ scapula."]},{"id":"EM2024-01","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2024","stem":"The function of rough endoplasmic reticulum is to synthesize:","options":["Lipid","Protein that will be secreted by the cell","Cytoplasmic protein necessary for the cells' own existence","Carbohydrates"],"answer":1,"repeatOf":"EM2023-01","explanation":"الـ attached ribosomes (على الـ rER) بتصنع البروتينات اللي هتتفرز برا الخلية (زي الإنزيمات والهرمونات). أما الـ free ribosomes فبتصنع البروتينات اللي بتستعملها الخلية جوه الـ cytosol.","memoryTrick":"Rough = للتصدير / Free = للاستهلاك المحلي.","stemAr":"وظيفة الـ rough endoplasmic reticulum إنه يصنع:","whyWrong":["الـ lipids (phospholipids والـ steroids) بيصنعها الـ sER.",null,"البروتينات اللي بتستعملها الخلية جوه الـ cytosol بتتصنع على الـ free ribosomes.","الـ carbohydrates بتتضاف للبروتينات كتعديل (في الـ Golgi)، والـ rER مش بيصنع carbohydrates."]},{"id":"EM2024-02","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2024","stem":"Smooth endoplasmic reticulum:","options":["Sometimes has ribosomes attached to its membrane","Is rarely found in skeletal muscle cells","Areas of localized basophilic indicate its presence","Is present in cells where drug detoxification is taking place"],"answer":3,"repeatOf":"EM2023-02","explanation":"من وظايف الـ sER الـ detoxification للأدوية والهرمونات والكحول في الـ liver cells. الـ sER مفيهوش polyribosomes، وبيكون well-developed في الـ muscle cells (بيطلع Ca ions وقت الانقباض).","memoryTrick":"Smooth = Detox.","stemAr":"الـ smooth endoplasmic reticulum:","whyWrong":["الـ sER مفيهوش ribosomes خالص. اللي عليه ribosomes هو الـ rER.","بالعكس، الـ sER well-developed في الـ muscle cells.","الـ localized basophilia سببها الـ rER (الـ RNA في الـ ribosomes). الـ sER لما يكتر بيدي acidophilia.",null]},{"id":"EM2024-03","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2024","stem":"The Golgi apparatus is:","options":["The site of packaging of secretory products of the cell.","The site of protein synthesis.","Continuous with smooth endoplasmic reticulum.","Capable of providing energy."],"answer":0,"repeatOf":"EM2023-03","explanation":"الـ Golgi apparatus مسئول عن الـ packing والـ concentration والتخزين للبروتينات اللي جاية من الـ rER، وتعديلها كيميائيًا، وتكوين الـ secretory vesicles والـ lysosomes.","memoryTrick":"Golgi = مكتب البريد 📦 (يستلم من الـ rER ويغلّف ويبعت).","stemAr":"الـ Golgi apparatus هو:","whyWrong":[null,"البروتين بيتصنع في الـ rER.","اللي متصل بالـ sER هو الـ rER. الـ Golgi بيوصله البروتين من الـ rER عن طريق transfer vesicles عند الـ cis face.","إنتاج الطاقة (ATP) شغل الـ mitochondria."]},{"id":"EM2024-04","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2024","stem":"Multivesicular bodies are:","options":["Primary lysosomes","Formed as a result of digestion of solid material.","Formed as a result of digestion of fluid material","Autophagic vacuoles."],"answer":2,"repeatOf":"EM2023-04","explanation":"الـ multivesicular body نوع من الـ secondary lysosomes: بيتكون لما الـ primary lysosome يندمج مع pinocytic vesicle (fluid material).","memoryTrick":"Multivesicular = Pinocytic (سوائل) / Heterolysosome = Phagocytic (صلب) / Autolysosome = organelles قديمة.","stemAr":"الـ multivesicular bodies هي:","whyWrong":["الـ primary lysosome لسه طالع من الـ Golgi وما دخلش في أي هضم.","هضم المواد الصلبة (primary lysosome + phagocytic vesicle) بيكوّن heterolysosome.",null,"الـ autolysosome بيتكون من primary lysosome + autophagic vesicle فيها organelles قديمة من الخلية نفسها."]},{"id":"EM2024-05","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2024","stem":"Microtubules have important role in:","options":["Carbohydrate metabolism","Oxidative phosphorylation.","Water balance","Formation of mitotic spindle during mitosis."],"answer":3,"explanation":"من وظايف الـ microtubules: تحديد شكل الخلية، النقل جوه الخلية للـ macromolecules، تكوين الـ mitotic spindle وقت الانقسام، وتكوين الـ centrioles والـ cilia والـ flagella.","memoryTrick":"Spindle = Microtubules.","stemAr":"الـ microtubules ليها دور مهم في:","whyWrong":["الـ carbohydrate metabolism مش من وظايف الـ microtubules.","الـ oxidative phosphorylation بتحصل في الـ mitochondria (الـ elementary particles = ATP synthetase).","الـ water balance مش من وظايف الـ microtubules.",null]},{"id":"EM2024-06","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2024","stem":"DNA could be found in:","options":["Ribosomes","Golgi apparatus","Mitochondria","Lysosomes"],"answer":2,"repeatOf":"EM2023-06","explanation":"الـ mitochondria عندها genetic apparatus خاص بيها: circular DNA في الـ matrix، وعشان كده بتتقسم بـ simple division.","memoryTrick":"Mitochondria = عندها DNA خاص.","stemAr":"الـ DNA ممكن يتلاقي في:","whyWrong":["الـ ribosomes مكوّنة من rRNA وبروتين، مفيهاش DNA.","الـ Golgi مفيهوش DNA.",null,"الـ lysoso
