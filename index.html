<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Interactive medical question bank with training, timed exam and revision modes.">
<meta name="referrer" content="no-referrer">
<title>MedQ — Medical Question Bank</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23302248'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23E9DDF7' stroke-width='3.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --plum:#302248; --plum-2:#4a3870; --lav:#E9DDF7; --lav-2:#f3ecfb; --paper:#F8F7F5; --sage:#DDEBE4; --sage-ink:#2f5d4a;
  --ink:#231b33; --mut:#6b6478; --line:#e4dfe9; --white:#fff; --bad:#9c3a4f; --bad-bg:#f8e7eb; --warn:#8a5a12; --warn-bg:#fbf0dc;
  --r:14px; --r-sm:10px; --shadow:0 1px 2px rgba(48,34,72,.06),0 4px 16px rgba(48,34,72,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--font);overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0;color:var(--plum)}
h1{font-size:clamp(1.6rem,4.5vw,2.3rem);line-height:1.15}
h2{font-size:clamp(1.25rem,3.4vw,1.55rem);line-height:1.2}
h3{font-size:1.08rem}
p{margin:.4em 0}
a{color:var(--plum-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:3px solid #b48be0;outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,var(--safe-r)) 0 max(16px,var(--safe-l))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid transparent;font-weight:600;font-size:.95rem;line-height:1.2;text-align:center}
.btn-pri{background:var(--plum);color:#fff}
.btn-pri:disabled{opacity:.45;cursor:default}
.btn-sec{background:var(--lav);color:var(--plum)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--plum)}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-sm{min-height:44px;padding:8px 12px;font-size:.88rem;border-radius:10px}
.icon-btn{min-width:44px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;color:var(--plum);font-weight:600;font-size:.88rem}
.icon-btn[aria-pressed="true"]{background:var(--lav);border-color:#cdb6ea}
.icon-btn svg{width:18px;height:18px;flex:none}
@media (hover:hover) and (pointer:fine){
  .btn-pri:not(:disabled):hover{background:var(--plum-2)}
  .btn-sec:hover,.icon-btn:hover{border-color:#cdb6ea}
  .opt:not(:disabled):hover{border-color:#b9a2d8;background:#fcfaff}
  .navlink:hover{background:var(--lav-2)}
}

/* app header */
.apphead{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;padding-top:var(--safe-t)}
.apphead .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;min-height:44px;font-family:var(--serif);font-weight:700;font-size:1.2rem;color:var(--plum);text-decoration:none}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--plum);display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.topnav{display:flex;gap:4px;margin-inline-start:auto}
.navlink{border:none;background:none;min-height:44px;padding:8px 12px;border-radius:10px;color:var(--mut);font-weight:600;font-size:.92rem}
.navlink[aria-current="page"]{color:var(--plum);background:var(--lav)}
.bottomnav{display:none}
@media (max-width:760px){
  .apphead .langbtn{margin-inline-start:auto}
  .topnav{display:none}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:4px max(4px,var(--safe-r)) calc(4px + var(--safe-b)) max(4px,var(--safe-l))}
  .bottomnav .navlink{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;padding:6px 2px;min-height:52px}
  .bottomnav svg{width:20px;height:20px}
  body.has-bottomnav main{padding-bottom:calc(84px + var(--safe-b))}
}

main{padding:22px 0 48px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.muted{color:var(--mut)}
.small{font-size:.86rem}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--plum-2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--lav-2);color:var(--plum)}
.pill.sage{background:var(--sage);color:var(--sage-ink)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.notice{border-radius:var(--r-sm);padding:12px 14px;background:var(--lav-2);color:var(--plum);font-size:.92rem}
.notice.warn{background:var(--warn-bg);color:var(--warn)}

/* home */
.hero{padding:8px 0 6px}
.hero p{max-width:640px}
.modecard{display:flex;flex-direction:column;gap:10px}
.modecard .btn{align-self:flex-start;margin-top:auto}
.stat{font-family:var(--serif);font-size:1.9rem;color:var(--plum);line-height:1}
.statlbl{font-size:.82rem;color:var(--mut)}

/* forms */
fieldset{border:none;padding:0;margin:0}
legend{font-weight:700;color:var(--plum);margin-bottom:8px;padding:0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--plum);margin:0}
.check:has(input:checked){background:var(--lav);border-color:#cdb6ea}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;color:var(--plum);font-size:.92rem}
.input,select.input{min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;width:100%;font-size:16px}
textarea.input{min-height:110px;resize:vertical;line-height:1.5}
.switch{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.switch input{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:#d9d2e3;border-radius:999px;position:relative;margin:0;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked{background:var(--plum)}
.switch input:checked::after{transform:translateX(18px)}

/* session */
.sess-top{position:sticky;top:0;z-index:25;background:var(--paper);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.sess-top .wrap{display:flex;align-items:center;gap:10px;min-height:60px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.sess-title{font-weight:700;color:var(--plum)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;color:var(--plum);background:var(--lav);border-radius:10px;padding:6px 12px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.timer.low{background:var(--warn-bg);color:var(--warn)}
.timer.crit{background:var(--bad-bg);color:var(--bad)}
.progress{height:6px;background:#e8e2ef;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--plum);width:0;transition:width .25s}
.sess-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:960px){.sess-grid{grid-template-columns:minmax(0,1fr)}}
.navpane{position:sticky;top:76px}
@media (max-width:960px){
  .navpane{position:fixed;inset:auto 0 0 0;top:auto;z-index:40;max-height:75vh;overflow:auto;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .2s;padding-bottom:calc(20px + var(--safe-b))}
  .navpane.open{transform:none;box-shadow:0 -10px 40px rgba(48,34,72,.25)}
}
.scrim{position:fixed;inset:0;background:rgba(35,27,51,.35);z-index:35}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qid{font-size:.8rem;color:var(--mut);font-variant-numeric:tabular-nums}
.ink-host{position:relative}
.stem{font-size:1.08rem;line-height:1.6;margin:4px 0 16px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:1rem;line-height:1.45;overflow-wrap:anywhere}
.opt .key{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--lav-2);color:var(--plum);font-weight:700;font-size:.85rem}
.opt[aria-checked="true"]{border-color:var(--plum);background:var(--lav-2)}
.opt[aria-checked="true"] .key{background:var(--plum);color:#fff}
.opt.correct{border-color:#7fb39c;background:var(--sage)}
.opt.correct .key{background:var(--sage-ink);color:#fff}
.opt.wrong{border-color:#d9a1ad;background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--ink);-webkit-text-fill-color:currentColor;opacity:1}
.opt .tag{margin-inline-start:auto;font-size:.75rem;font-weight:700;align-self:center;white-space:nowrap}
.conf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.conf .lbl{font-size:.85rem;color:var(--mut);margin-inline-end:2px}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:.88rem;font-weight:600;color:var(--plum)}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hints{margin-top:12px}
.hint{background:var(--warn-bg);color:#5d3d0c;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.95rem}
.fb{margin-top:16px;display:grid;gap:12px}
.verdict{border-radius:12px;padding:12px 14px;font-weight:700}
.verdict.ok{background:var(--sage);color:var(--sage-ink)}
.verdict.no{background:var(--bad-bg);color:var(--bad)}
.verdict.skip{background:var(--lav-2);color:var(--plum)}
.sec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.sec h4{margin:0 0 6px;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--plum-2)}
.sec ul{margin:0;padding-inline-start:18px}
.sec li{margin:4px 0}
.sec.trick{background:var(--lav-2);border-color:#dccbef}
.sec.remember{background:#fff7e3;border-color:#f0dcae;border-inline-start:5px solid #d9a63a}
.sec.remember h4{color:#8a5a12}
.navrow{display:flex;gap:10px;margin-top:18px;align-items:center}
.navrow .btn{flex:1}
@media (min-width:600px){.navrow .btn{flex:0 0 auto}}

/* bubble sheet */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.bub{position:relative;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-variant-numeric:tabular-nums;color:var(--plum);font-size:.9rem}
.bub.ans{background:var(--plum);border-color:var(--plum);color:#fff}
.bub.ok{background:var(--sage);border-color:#7fb39c;color:var(--sage-ink)}
.bub.no{background:var(--bad-bg);border-color:#d9a1ad;color:var(--bad)}
.bub.cur{box-shadow:0 0 0 3px #b48be0}
.bub .fl{position:absolute;top:-5px;inset-inline-end:-5px;width:14px;height:14px;border-radius:50%;background:#d9a63a;border:2px solid #fff}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--mut);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1.5px solid var(--line);background:#fff}

/* annotation */
.ink-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;touch-action:auto}
.ink-host.drawing .ink-canvas{pointer-events:auto;touch-action:none;cursor:crosshair}
.ink-host.drawing{outline:2px dashed #cdb6ea;outline-offset:6px;border-radius:8px}
.inkbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--lav-2);border-radius:12px;padding:8px;margin-bottom:12px}
.inkbar .sw{width:44px;height:44px;border-radius:50%;border:5px solid #fff;box-shadow:0 0 0 1.5px var(--line);min-width:44px;padding:0}
.inkbar .sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--plum)}
.scratch-wrap{position:relative;height:min(60vh,520px);border:1.5px dashed #cdb6ea;border-radius:12px;background:#fff;background-image:radial-gradient(#e7dff2 1px,transparent 1px);background-size:22px 22px;overflow:hidden}
.scratch-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}

/* dialog */
.dlg-back{position:fixed;inset:0;background:rgba(35,27,51,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(35,27,51,.3)}
.dlg.wide{max-width:860px}
.dlg h2{margin-bottom:8px}
.dlg .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
kbd{font:600 .8rem var(--font);background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px}
.kbdtbl{width:100%;border-collapse:collapse}
.kbdtbl td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}

/* results */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,140px) 1fr 56px;gap:10px;align-items:center;font-size:.92rem}
.bar .track{height:10px;background:#ece6f2;border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--plum)}
.ritem{border-top:1px solid var(--line);padding:12px 0}
.ritem summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:flex-start;min-height:44px}
.ritem summary::-webkit-details-marker{display:none}
.ritem .num{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap}

/* bank */
.qrow{border-top:1px solid var(--line);padding:14px 0}
.qrow:first-child{border-top:none}
.qrow .opts-list{margin:8px 0 0;padding-inline-start:0;list-style:none;display:grid;gap:4px}
.qrow .opts-list li{padding:6px 10px;border-radius:8px;background:var(--paper);font-size:.95rem}
.qrow .opts-list li.correct{background:var(--sage);color:var(--sage-ink);font-weight:600}
mark{background:#f3e3a8;border-radius:3px;padding:0 1px}

footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--mut);font-size:.84rem}
body.has-bottomnav footer{padding-bottom:calc(96px + var(--safe-b))}

@media (max-width:420px){
  .lbl-txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  body{font-size:15px}
  .card{padding:16px}
  .stem{font-size:1.02rem}
  .opt{padding:11px 12px;font-size:.97rem}
  .sess-top .wrap{gap:8px}
}
@media (orientation:landscape) and (max-height:520px){
  .apphead .wrap,.sess-top .wrap{min-height:50px}
  main{padding-top:12px}
  .opts{display:grid;grid-template-columns:1fr 1fr}
  .navpane{max-height:90vh}
}

/* ---------- language / RTL ---------- */
.ulist{margin:6px 0 0;padding-inline-start:18px}
.rsub{padding:10px 0 0;padding-inline-start:40px}
.ltr{direction:ltr;unicode-bidi:isolate;text-align:left}
.content-auto{unicode-bidi:plaintext;text-align:start}
.savecard{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 16px}
.savecard .savehead{display:flex;align-items:center;gap:12px;flex:1 1 240px;min-width:0}
.savecard .saveic{font-size:1.5rem;line-height:1}
.savecard .saveacts{gap:8px;flex-wrap:wrap}
.savecard.due{border-color:#d9a441;background:#fff8ea}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.15rem;font-weight:700;letter-spacing:.06em;line-height:1.8;padding:12px 14px;border-radius:12px;background:var(--lav-2);color:var(--plum);text-align:center;user-select:all;-webkit-user-select:all}
.codebox .cg{display:inline-block;white-space:nowrap}
.codein{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;letter-spacing:.05em;padding:10px;border-radius:10px;border:1px solid var(--line);text-transform:uppercase}
.credit{margin:2px 0 6px;font-size:.78rem;color:var(--muted,#6b6478);text-align:start}
html[dir="rtl"] .credit{text-align:right}
.trbox{direction:rtl;text-align:right;unicode-bidi:isolate;background:var(--lav-2);border-inline-start:4px solid var(--plum);border-radius:10px;padding:10px 14px;margin:0 0 10px;font-family:"Noto Naskh Arabic","Segoe UI","Tahoma",system-ui,sans-serif;line-height:1.9;color:var(--plum)}
.cx{unicode-bidi:isolate;text-align:start}
.verdict .ansline{display:block;margin-top:4px}
.langbtn{margin-inline-start:8px;border:1.5px solid var(--line);background:#fff;min-height:44px;padding:6px 12px;border-radius:12px;font-weight:700;color:var(--plum);font-size:.9rem}
html[dir="rtl"] body{--font:"Noto Naskh Arabic","Noto Sans Arabic","Segoe UI","Geeza Pro","SF Arabic","Arabic UI Text",Tahoma,Arial,sans-serif;--serif:var(--font);line-height:1.75}
html[dir="rtl"] .eyebrow{letter-spacing:0;text-transform:none;font-size:.85rem}
html[dir="rtl"] .sec h4{letter-spacing:0;text-transform:none;font-size:.85rem}
html[dir="rtl"] .switch input:checked::after{transform:translateX(-18px)}
html[dir="rtl"] .key-ar{font-family:var(--font)}
.ltr, .stem, .opt{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;line-height:1.55}
.langscreen{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px max(16px,var(--safe-r)) calc(24px + var(--safe-b)) max(16px,var(--safe-l))}
.langcard{max-width:440px;width:100%;text-align:center}
.langcard .brand-mark{width:56px;height:56px;border-radius:16px;margin:0 auto 16px}
.langcard .brand-mark svg{width:30px;height:30px}
.langopts{display:grid;gap:12px;margin-top:22px}
.langopts button{min-height:64px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:1.2rem;font-weight:700;color:var(--plum)}
.langopts button:focus-visible,.langopts button:hover{border-color:var(--plum)}
.langopts button[lang="ar"]{font-family:"Noto Naskh Arabic","Noto Sans Arabic","Segoe UI","Geeza Pro",Tahoma,sans-serif;font-size:1.3rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{
  .apphead,.bottomnav,footer,.noprint,.sess-top{display:none!important}
  body{background:#fff}

tudents"},{"id":"SCALP","name":"Scalp and face quiz"},{"id":"MONA","name":"Dr Mona · General embryology"},{"id":"HIST","name":"Previous exams of Histology (bank)"}],"questions":[{"id":"EM2019A-01","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2019A","stem":"following bones contain red bone marrow in the adult except:","options":["Hip bone.","shaft of tibia.","sternum.","upper end of femur."],"answer":1,"explanation":"في الكبار الـ red bone marrow بيفضل في الـ flat & irregular bones (sternum، ribs، vertebrae، hip bone) وفي الـ upper ends بتاعة femur و humerus. أما الـ shaft بتاع الـ long bones زي tibia فبيتحول لـ yellow (fatty) marrow.","memoryTrick":"Shaft = Yellow 🟡 … الـ red في الـ flat والأطراف العليا.","stemAr":"كل العظام دي فيها red bone marrow في البالغين ما عدا:"},{"id":"EM2019A-02","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2019A","stem":"which of the following arteries supply the outer compact bone?","options":["epiphyseal arteries.","metaphyseal arteries.","nutrient arteries.","periosteal arteries."],"answer":3,"explanation":"الـ periosteal arteries بتدخل من الـ periosteum وتغذي الطبقة الخارجية من الـ compact bone. الـ nutrient artery بتغذي الـ marrow، والـ epiphyseal/metaphyseal بيغذوا الأطراف.","memoryTrick":"Periosteal = Peripheral (من بره) ← outer compact bone.","stemAr":"أنهي artery من دول بتغذي الـ outer compact bone؟"},{"id":"EM2019A-03","topic":"anat","concept":"Lymphatic system","source":"EM2019A","stem":"One of the following is lymphoid organ","options":["Liver","Lung","Pancreas","Spleen"],"answer":3,"explanation":"الـ spleen أكبر lymphoid organ في الجسم. الـ liver والـ lung والـ pancreas أعضاء مش lymphoid.","memoryTrick":"Spleen = أكبر مصنع lymphocytes 🏭.","stemAr":"واحد من دول lymphoid organ:"},{"id":"EM2019A-04","topic":"anat","concept":"Scalp & face","source":"EM2019A","stem":"The dangerous area of the scalp is:","options":["connective tissue layer","Epicranial aponeurosis","Skin layer","Subaponeurotic space"],"answer":3,"explanation":"الطبقة الرابعة في الـ scalp هي الـ loose areolar tissue = subaponeurotic space. اسمها dangerous لأن الـ emissary veins بتمر فيها وتوصّل الـ infection للـ intracranial venous sinuses.","memoryTrick":"SCALP: الحرف L (Loose) هو الـ Lethal layer.","stemAr":"الـ dangerous area في الـ scalp هي:"},{"id":"EM2019A-05","topic":"anat","concept":"Scalp & face","source":"EM2019A","stem":"The zygomatico temporal nerve arises from:","options":["Facial nerve","Mandibular nerve","Maxillary nerve","Ophthalmic nerve"],"answer":2,"explanation":"الـ zygomaticotemporal nerve فرع من الـ zygomatic nerve، وده فرع من الـ maxillary nerve (V2).","memoryTrick":"Zygomatic… = Maxillary (V2) — الخد في نص الوش.","stemAr":"الـ zygomaticotemporal nerve بيطلع من:"},{"id":"EM2019A-06","topic":"embryo","concept":"Gametogenesis","source":"EM2019A","stem":"The part of the sperm that contains proteolytic enzymes to digest the zona pellucida is the:","options":["Acrosome","Capacitator","Corona","Head"],"answer":0,"explanation":"الـ acrosome عبارة عن cap فوق الـ head فيه proteolytic enzymes (زي acrosin و hyaluronidase) بتهضم الـ zona pellucida وقت الـ fertilization.","memoryTrick":"Acrosome = الـ cap اللي فيه الإنزيمات (الخوذة اللي بتكسر الباب).","stemAr":"الجزء في الـ sperm اللي فيه proteolytic enzymes بتهضم الـ zona pellucida هو:"},{"id":"EM2019A-07","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2019A","stem":"The most distinctive character of a primary chorionic villus is its:","options":["Cytotrophoblastic core","Cytotrophoblastic shell","Extraembryonic visceral mesodermal core","Extraembryonic somatic mesodermal core"],"answer":0,"explanation":"الـ primary chorionic villus عبارة عن core من الـ cytotrophoblast مغطي بـ syncytiotrophoblast. الـ secondary فيه mesoderm core، والـ tertiary فيه blood vessels.","memoryTrick":"1ry = Cyto core / 2ry = Mesoderm / 3ry = Vessels (C-M-V).","stemAr":"أكتر صفة مميزة للـ primary chorionic villus هي:"},{"id":"EM2019A-08","topic":"embryo","concept":"Gametogenesis","source":"EM2019A","stem":"Which of the following undergoes differentiation process","options":["Primary spermatocyte","Secondary spermatocyte","Spermatid","Spermatogonia"],"answer":2,"explanation":"الـ differentiation (spermiogenesis) هي تحوّل الـ spermatid لـ spermatozoon بدون انقسام. الـ spermatogonia والـ spermatocytes بيعملوا انقسام مش differentiation.","memoryTrick":"Spermatid ➜ Sperm = تحوّل شكل بس (من غير انقسام).","stemAr":"أنهي واحد من دول بيحصله differentiation؟"},{"id":"EM2019A-09","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2019A","stem":"Pregnancy tests generally are based upon the detection in maternal urine of:","options":["Estrogen","Human chorionic corticotropin","Human chorionic gonadotrophin","Progesterone"],"answer":2,"explanation":"اختبار الحمل بيكشف الـ hCG اللي بيفرزه الـ syncytiotrophoblast، وبيظهر في الـ urine بعد الـ implantation.","memoryTrick":"Pregnancy test = hCG (Human Chorionic Gonadotropin).","stemAr":"اختبارات الحمل عمومًا بتعتمد على اكتشاف إيه في بول الأم؟"},{"id":"EM2019A-10","topic":"embryo","concept":"Implantation & second week","source":"EM2019A","stem":"The amniotic cavity develops:","options":["in extraembryonic mesoderm","on the ventral surface of embryonic disc","within the inner cell mass near the cytotrophoblast","within the outer cell mass"],"answer":2,"explanation":"الـ amniotic cavity بتظهر حوالي اليوم 8 جوه الـ inner cell mass (بين الـ epiblast والـ cytotrophoblast).","memoryTrick":"Amnion = جوه الـ ICM فوق الـ epiblast.","stemAr":"الـ amniotic cavity بتتكون:"},{"id":"EM2019A-11","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2019A","stem":"The wall of the chorionic sac is composed of:","options":["cytotrophoblast and syncytiotrophoblast","extraembryonic splanchnic mesoderm and both layers of trophoblast","trophoblast and exocoelomic membrane","two layers of trophoblast lined by extraembryonic somatic mesoderm"],"answer":3,"explanation":"الـ chorion = طبقتين الـ trophoblast (cyto + syncytio) ومبطنين من جوه بالـ extraembryonic somatic mesoderm.","memoryTrick":"Chorion = Trophoblast + Somatic mesoderm (زي ما الـ amnion + somatic كمان).","stemAr":"جدار الـ chorionic sac مكوّن من:"},{"id":"EM2019A-12","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2019A","stem":"Localized cytoplasmic basophilia indicates the presence of:","options":["Mitochondria.","DNA","sER.","rER"],"answer":3,"explanation":"الـ localized basophilia معناها تجمع ribosomes على الـ rER في منطقة معينة (زي الـ basal part في الخلايا المفرزة للبروتين). الـ diffuse basophilia من الـ free ribosomes.","memoryTrick":"Localized = rER 📍 / Diffuse = free ribosomes.","stemAr":"الـ localized cytoplasmic basophilia بتدل على وجود:"},{"id":"EM2019A-13","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2019A","stem":"In H&E stained sections of plasma cell, How can Golgi apparatus appears?","options":["Apical.","Basal.","Perinuclear.","Unstained."],"answer":3,"explanation":"في الـ plasma cell الـ Golgi بيظهر في H&E كـ negative image (منطقة فاتحة unstained) جنب النواة، لأنه مبيتصبغش.","memoryTrick":"Golgi في H&E = Negative image (بقعة فاضية).","stemAr":"في قطاعات الـ plasma cell المصبوغة بـ H&E، الـ Golgi apparatus بيظهر إزاي؟"},{"id":"EM2019A-14","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2019A","stem":"Which Two organelles share in the formation of lysosomes?","options":["Golgi & cell membrane.","rER & Golgi.","rER & sER.","sER & Golgi."],"answer":1,"explanation":"الـ lysosomal enzymes بتتصنع على الـ rER وبعدين تتغلف وتتعبى في الـ Golgi (trans face) فتطلع primary lysosomes.","memoryTrick":"rER يصنع ➜ Golgi يغلّف = Lysosome.","stemAr":"أنهي اتنين organelles بيشاركوا في تكوين الـ lysosomes؟"},{"id":"EM2019A-15","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2019A","stem":"What structure contributes to the cells cytoskeleton?","options":["Centrioles","Microfilaments","Peroxisome","Ribosomes"],"answer":1,"explanation":"الـ cytoskeleton مكوّن من microfilaments و intermediate filaments و microtubules. الـ ribosomes والـ peroxisomes مش جزء منه.","memoryTrick":"Cytoskeleton = Filaments + Tubules.","stemAr":"أنهي structure بيشارك في الـ cytoskeleton بتاع الخلية؟"},{"id":"EM2019A-16","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2019A","stem":"Down syndrome:","options":["caused by chromosome 21 trisomy.","due to duplication of chromosome 22.","due to multiple X syndrome.","due to X chromosome monosomy."],"answer":0,"explanation":"Down syndrome سببه الأشهر trisomy 21 (47 chromosomes) غالبًا بسبب nondisjunction.","memoryTrick":"Down = 21 (ثلاث نسخ من 21).","stemAr":"الـ Down syndrome:"},{"id":"EM2019B-01","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2019B","stem":"Which of the following bones ossifies in a membrane?","options":["Radius","Tibia","Vault of the skull","Vertebrae"],"answer":2,"explanation":"عظام الـ vault of the skull (والـ clavicle والـ mandible) بتتكون بـ intramembranous ossification. الـ long bones والـ vertebrae بـ cartilaginous.","memoryTrick":"Membrane = Flat (Vault, Face, Clavicle).","stemAr":"أنهي عظمة من دول بتتعظم في membrane (membranous ossification)؟"},{"id":"EM2019B-02","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2019B","stem":"which of the following arteries supply the bone marrow?","options":["epiphyseal arteries","metaphyseal arteries","nutrient arteries","periosteal arteries"],"answer":2,"explanation":"الـ nutrient artery بتدخل من الـ nutrient foramen في الـ shaft وتغذي الـ bone marrow والـ inner part.","memoryTrick":"Nutrient = Nourishes the Marrow.","stemAr":"أنهي artery من دول بتغذي الـ bone marrow؟"},{"id":"EM2019B-03","topic":"anat","concept":"Lymphatic system","source":"EM2019B","stem":"the lymph vessel is absent in following organ:","options":["Brain","Liver","Lung","Pancreas"],"answer":0,"explanation":"الـ lymph vessels غايبة عن الـ CNS (brain و spinal cord) وكمان عن الـ cartilage والـ epidermis والـ cornea.","memoryTrick":"Brain = no lymph (عنده CSF بداله).","stemAr":"الـ lymph vessels مش موجودة في أنهي organ من دول؟"},{"id":"EM2019B-04","topic":"anat","concept":"Scalp & face","source":"EM2019B","stem":"The occipital belly of occipitofrontalis is supplied by:","options":["Auriculotemporal nerve","3rd occipital nerve","Supratrochlear nerve","Posterior auricular nerve"],"answer":3,"explanation":"الـ occipital belly بيتغذى من الـ posterior auricular branch of facial nerve، والـ frontal belly من الـ temporal branch of facial.","memoryTrick":"Occipital = Posterior auricular (ورا الودن).","stemAr":"الـ occipital belly بتاع الـ occipitofrontalis بيتغذى عصبيًا من:"},{"id":"EM2019B-05","topic":"anat","concept":"Scalp & face","source":"EM2019B","stem":"The posterior aspect of the scalp drains into:","options":["Mastoid lymph nodes","Parotid lymph nodes","Submandibular lymph nodes","Submental lymph nodes"],"answer":0,"explanation":"الـ lymph من الجزء الخلفي للـ scalp بيروح لـ occipital والـ mastoid (retroauricular) nodes. الجزء الأمامي للـ parotid/submandibular.","memoryTrick":"ورا الودن = Mastoid.","stemAr":"الجزء الخلفي من الـ scalp بيصرّف (lymph) في:"},{"id":"EM2019B-06","topic":"embryo","concept":"Gametogenesis","source":"EM2019B","stem":"The time taken for a spermatogonium to develop into a mature spermatozoon is approximately:","options":["64 days","60 days","24 days","40 days"],"answer":0,"explanation":"الـ spermatogenesis من spermatogonium لحد sperm ناضج بتاخد حوالي 64 يوم (≈ شهرين).","memoryTrick":"64 يوم ≈ 2 شهر.","stemAr":"الوقت اللي بياخده الـ spermatogonium عشان يبقى spermatozoon ناضج تقريبًا:"},{"id":"EM2019B-07","topic":"embryo","concept":"Gametogenesis","source":"EM2019B","stem":"Capacitation of the sperm:","options":["is caused by the zona pellucida","is essential for fertilization","occurs in the male","prevents polyspermy"],"answer":1,"explanation":"الـ capacitation بتحصل في الـ female genital tract (مش في الذكر) وهي ضرورية عشان الـ sperm يقدر يعمل acrosome reaction ويخصّب.","memoryTrick":"Capacitation = تأشيرة دخول للـ fertilization (بتتعمل جوه الست).","stemAr":"الـ capacitation بتاعة الـ sperm:"},{"id":"EM2019B-08","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2019B","stem":"The most correct sequence of early development following fertilization is:","options":["zygote, blastomeres, morula, blastocyst","oocyte, zygote, morula, blastocyst","zygote, conceptus, blastocyst","polar bodies, zygote, conceptus, blastocyst"],"answer":0,"explanation":"الترتيب: zygote ➜ blastomeres (cleavage) ➜ morula (16 cell) ➜ blastocyst.","memoryTrick":"Z-B-M-B: Zygote, Blastomeres, Morula, Blastocyst.","stemAr":"أصح ترتيب لمراحل النمو الأولى بعد الـ fertilization هو:"},{"id":"EM2019B-09","topic":"embryo","concept":"Implantation & second week","source":"EM2019B","stem":"The amniotic cavity develops:","options":["in extraembryonic mesoderm","on the ventral surface of embryonic disc","within the inner cell mass near the cytotrophoblast","within the outer cell mass"],"answer":2,"repeatOf":"EM2019A-10","explanation":"الـ amniotic cavity بتظهر حوالي اليوم 8 جوه الـ inner cell mass (بين الـ epiblast والـ cytotrophoblast).","memoryTrick":"Amnion = جوه الـ ICM فوق الـ epiblast.","stemAr":"الـ amniotic cavity بتتكون:"},{"id":"EM2019B-10","topic":"histo","concept":"Cell membrane & transport","source":"EM2019B","stem":"What process is nicknamed \"cell drinking\"?","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":2,"explanation":"الـ pinocytosis هي ابتلاع fluid في vesicles صغيرة = cell drinking. الـ phagocytosis ابتلاع solids = cell eating.","memoryTrick":"Pino = Pint (شرب) / Phago = أكل.","stemAr":"أنهي عملية اسمها الشائع \"cell drinking\" (شرب الخلية)؟"},{"id":"EM2019B-11","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2019B","stem":"Which one is an endogenous pigment?","options":["Lead","Carotenes","Tattoo","Hemoglobin"],"answer":3,"explanation":"الـ endogenous pigments بتتصنع جوه الجسم زي hemoglobin ومشتقاته و melanin و lipofuscin. الـ lead والـ carotene والـ tattoo exogenous (من بره).","memoryTrick":"Endo = جوه (Hemoglobin, Melanin).","stemAr":"أنهي واحد endogenous pigment؟"},{"id":"EM2019B-12","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2019B","stem":"Where are ribosomes formed?","options":["Centrioles","Cytoskeleton","Microfilaments","Nucleoli"],"answer":3,"explanation":"الـ ribosomal RNA بيتصنع في الـ nucleolus وهناك بتتجمع الـ ribosomal subunits.","memoryTrick":"Nucleolus = مصنع الـ Ribosomes.","stemAr":"الـ ribosomes بتتكون فين؟"},{"id":"EM2019B-13","topic":"histo","concept":"Nucleus & chromatin","source":"EM2019B","stem":"The nucleus is surrounded by which of the following?","options":["A double membrane","A single membrane","No membrane around nucleus","Proteins"],"answer":0,"explanation":"الـ nuclear envelope عبارة عن double membrane (inner + outer) بينهم perinuclear space وفيها nuclear pores.","memoryTrick":"Nucleus = جدار مزدوج 🧱🧱.","stemAr":"النواة محاطة بإيه من دول؟"},{"id":"EM2019B-14","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2019B","stem":"Duplication of DNA occurs in:","options":["G1 phase","G2 phase","Interphase","S phase"],"answer":3,"explanation":"الـ DNA replication بتحصل في الـ S phase (S = Synthesis) من الـ interphase.","memoryTrick":"S = Synthesis of DNA.","stemAr":"تضاعف الـ DNA بيحصل في:"},{"id":"ES2019-01","topic":"anat","concept":"Scalp & face","source":"ES2019","stem":"Which one of the following is the dangerous layer of the scalp ?","options":["Connective subcutaneous tissue","Loose areolar tissue","Pericranium .","Skin"],"answer":1,"explanation":"الـ loose areolar tissue (الطبقة الرابعة) هي الـ dangerous layer بسبب الـ emissary veins اللي بتنقل الـ infection للـ cranial cavity.","memoryTrick":"L = Loose = Lethal.","stemAr":"أنهي طبقة من دول هي الـ dangerous layer في الـ scalp؟"},{"id":"ES2019-02","topic":"anat","concept":"Scalp & face","source":"ES2019","stem":"The motor nerve supply of the scalp behind the auricle is :","options":["Great auricular nerve","Greater occipital nerve","Lesser occipital nerve","Posterior auricular branch of facial nerve"],"answer":3,"explanation":"الـ motor supply للـ scalp ورا الودن (occipital belly) من الـ posterior auricular branch of facial nerve. الـ great auricular والـ occipital nerves sensory.","memoryTrick":"Motor في الـ scalp = Facial nerve دايمًا.","stemAr":"الـ motor nerve supply للـ scalp ورا الـ auricle (الودن) هو:"},{"id":"ES2019-03","topic":"anat","concept":"Lymphatic system","source":"ES2019","stem":"As regarding to the spleen which of the following statement is wrong?","options":["It destroys worn-out RBCs","It is Largest lymphoid organ","It lies below right cupola of diaphragm","It produces lymphocytes"],"answer":2,"explanation":"الجملة الغلط هي C: الـ spleen موجود تحت الـ left cupola of the diaphragm (في الـ left hypochondrium) مش اليمين.","memoryTrick":"Spleen على الشمال (Left) 👈.","stemAr":"بخصوص الـ spleen، أنهي جملة من دول غلط؟"},{"id":"ES2019-04","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2019","stem":"Which membranous organelle is prominent in cells synthesize steroid hormones?","options":["Golgi apparatus","Mitochondria","rER","sER"],"answer":3,"explanation":"الـ sER هو مكان تصنيع الـ lipids والـ steroid hormones، فبيكون prominent في خلايا الـ adrenal cortex والـ Leydig cells.","memoryTrick":"Steroid = Smooth (S & S).","stemAr":"أنهي membranous organelle بيكون واضح (prominent) في الخلايا اللي بتصنع steroid hormones؟"},{"id":"ES2019-05","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2019","stem":"What are the Ribosomes ?","options":["Exogenous pigment","Membranous organelles .","Non membranous organelle","Stored food"],"answer":2,"explanation":"الـ ribosomes non-membranous organelles مكونة من rRNA وبروتين.","memoryTrick":"Ribosome = من غير غشاء.","stemAr":"الـ ribosomes عبارة عن إيه؟"},{"id":"ES2019-06","topic":"histo","concept":"Cell membrane & transport","source":"ES2019","stem":"What is the polysaccharide coating that is sometimes found on the cell membrane?","options":["Cristae","Glycocalyx","Plasmalemma","protoplasm"],"answer":1,"explanation":"الـ glycocalyx (cell coat) هو الطبقة الـ carbohydrate (glycoproteins & glycolipids) على السطح الخارجي للـ cell membrane.","memoryTrick":"Glyco = سكر ➜ Glycocalyx = غلاف سكري.","stemAr":"إيه هو الغطا الـ polysaccharide اللي بيكون أحيانًا على الـ cell membrane؟"},{"id":"ES2019-07","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2019","stem":"What are ribosomes constructed ?","options":["Cytoskeleton","Microfilaments","Nucleoli","Peroxisome"],"answer":2,"explanation":"الـ ribosomes بتتكون (تتجمع subunits) في الـ nucleolus.","memoryTrick":"Nucleolus = Ribosome factory.","stemAr":"الـ ribosomes مكونة من إيه؟"},{"id":"ES2019R2-01","topic":"embryo","concept":"Fertilization & cleavage","source":"ES2019R2","stem":"Which sentence of the following does NOT true for fertilization?","options":["It is the union of a human ovum and sperm","It is occurring in the isthmus of the fallopian tube.","The result of this union is the production of a zygote cell","It can occur 12 24 hours after ovulation"],"answer":1,"explanation":"الجملة الغلط B: الـ fertilization بتحصل عادة في الـ ampulla of the uterine tube مش الـ isthmus.","memoryTrick":"Fertilization = Ampulla (A مع A).","stemAr":"أنهي جملة من دول مش صح عن الـ fertilization؟"},{"id":"ES2019R2-02","topic":"embryo","concept":"Gametogenesis","source":"ES2019R2","stem":"As regarding Anatomy of the Sperm which one of the following is WRONG?","options":["Its total length is about 50 µm","It consists of: head, neck, middle piece and tail","The head contains a nucleus, a pool of actin","The acrosome is a vesicle contains the genetic material of the sperm"],"answer":3,"explanation":"الغلط D: الـ acrosome مش فيه الـ genetic material؛ الـ genetic material في الـ nucleus جوه الـ head. الـ acrosome فيه enzymes.","memoryTrick":"Acrosome = Enzymes / Nucleus = DNA.","stemAr":"بخصوص تشريح الـ sperm، أنهي واحدة من دول غلط؟"},{"id":"ES2019R2-03","topic":"embryo","concept":"Gametogenesis","source":"ES2019R2","stem":"Acrosome Reaction is...........","options":["Alteration of the molecular structure of the glycoproteins in zona pellucida","Removal of the surface-coating proteins derived from seminal fluid","The digestive acrosomal enzymes at the tip of the sperm's head allow the sperm to burrow through the corona radiata","The enzymatic content of acrosome, which can dissolve the glycoproteins in zona pellucida, is thus released."],"answer":3,"explanation":"الـ acrosome reaction هي اندماج الـ acrosomal membrane مع الـ plasma membrane وخروج الإنزيمات اللي بتذوّب الـ glycoproteins بتاعة الـ zona pellucida.","memoryTrick":"Acrosome reaction = الإنزيمات تخرج لتذيب الـ zona.","stemAr":"الـ acrosome reaction هو..........."},{"id":"ES2019R2-04","topic":"anat","concept":"Scalp & face","source":"ES2019R2","stem":"Frontal belly of occipitofrontalis muscle is supplied by which of following nerve?","options":["Auriculotemporal","Temporal branch of facial","Zygomatic branch of facial","Zygomaticofacial"],"answer":1,"explanation":"الـ frontal belly of occipitofrontalis بيتغذى من الـ temporal branch of facial nerve.","memoryTrick":"Frontal = Temporal branch (الجبهة جنب الصدغ).","stemAr":"الـ frontal belly بتاع الـ occipitofrontalis بيتغذى عصبيًا من أنهي nerve؟"},{"id":"ES2019R2-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2019R2","stem":"The artery that supplies the bone marrow is........","options":["Periosteal","Epiphyseal","Metaphyseal","Nutrient"],"answer":3,"explanation":"الـ nutrient artery هي اللي بتغذي الـ bone marrow.","memoryTrick":"Nutrient = Marrow.","stemAr":"الـ artery اللي بتغذي الـ bone marrow هي........"},{"id":"ES2019R2-06","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2019R2","stem":"Localized cytoplasmic basophilia indicates the presence of.......","options":["DNA","Mitochondria","RER","SER"],"answer":2,"repeatOf":"EM2019A-12","explanation":"الـ localized basophilia معناها تجمع ribosomes على الـ rER في منطقة معينة (زي الـ basal part في الخلايا المفرزة للبروتين). الـ diffuse basophilia من الـ free ribosomes.","memoryTrick":"Localized = rER 📍 / Diffuse = free ribosomes.","stemAr":"الـ localized cytoplasmic basophilia بتدل على وجود:"},{"id":"ES2019R2-07","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2019R2","stem":"In H&E stained sections of plasma cell, how can Golgi apparatus appear?","options":["Apical","Basal","Perinuclear","Unstained"],"answer":3,"explanation":"الـ Golgi في الـ plasma cell بيظهر unstained (negative image) جنب النواة في H&E.","memoryTrick":"Golgi = Negative image.","stemAr":"في قطاعات الـ plasma cell المصبوغة بـ H&E، الـ Golgi apparatus بيظهر إزاي؟"},{"id":"ES2019R2-08","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2019R2","stem":"Which two organelles share in the formation of lysosomes?","options":["Golgi & cell membrane","RER & SER","SER & Golgi","RER & Golgi"],"answer":3,"repeatOf":"EM2019A-14","explanation":"الـ lysosomal enzymes بتتصنع على الـ rER وبعدين تتغلف وتتعبى في الـ Golgi (trans face) فتطلع primary lysosomes.","memoryTrick":"rER يصنع ➜ Golgi يغلّف = Lysosome.","stemAr":"أنهي اتنين organelles بيشاركوا في تكوين الـ lysosomes؟"},{"id":"ES2019R2-09","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2019R2","stem":"What structure contributes to the cell's cytoskeleton?","options":["Centrioles","Microfilaments","Peroxisome","Ribosomes"],"answer":1,"repeatOf":"EM2019A-15","explanation":"الـ cytoskeleton مكوّن من microfilaments و intermediate filaments و microtubules. الـ ribosomes والـ peroxisomes مش جزء منه.","memoryTrick":"Cytoskeleton = Filaments + Tubules.","stemAr":"أنهي structure بيشارك في الـ cytoskeleton بتاع الخلية؟"},{"id":"ES2020-01","topic":"anat","concept":"Scalp & face","source":"ES2020","stem":"Which of the following is the dangerous area of the scalp?","options":["The connective tissue layer","The pericranium","Loose areolar tissue layer","Skin layer"],"answer":2,"explanation":"الـ loose areolar tissue layer هي الـ dangerous area of the scalp.","memoryTrick":"L = Lethal.","stemAr":"أنهي واحدة من دول هي الـ dangerous area في الـ scalp؟"},{"id":"ES2020-02","topic":"anat","concept":"Scalp & face","source":"ES2020","stem":"The occipital belly is supplied by which of the following?","options":["Cervical branch of facial nerve","Posterior auricular nerve","Mandibular branch of facial nerve","Occipital branch of facial nerve"],"answer":1,"explanation":"الـ occipital belly بيتغذى من الـ posterior auricular nerve (فرع من الـ facial).","memoryTrick":"Occipital = Posterior auricular.","stemAr":"الـ occipital belly بيتغذى عصبيًا من أنهي واحد من دول؟"},{"id":"ES2020-03","topic":"anat","concept":"Movements","source":"ES2020","stem":"in which of the following movements the palm face posterior?","options":["Supination","Pronation","Eversion","Inversion"],"answer":1,"explanation":"في الـ pronation الـ radius بيلف على الـ ulna فالـ palm تبص لورا (posterior). الـ supination العكس.","memoryTrick":"Pronation = Palm Posterior (P-P).","stemAr":"في أنهي حركة من دول الـ palm بتبص لورا (posterior)؟"},{"id":"ES2020-04","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2020","stem":"which of the following arteries supply the bone marrow?","options":["epiphyseal arteries","metaphyseal arteries","nutrient arteries","periosteal arteries"],"answer":2,"repeatOf":"EM2019B-02","explanation":"الـ nutrient artery بتدخل من الـ nutrient foramen في الـ shaft وتغذي الـ bone marrow والـ inner part.","memoryTrick":"Nutrient = Nourishes the Marrow.","stemAr":"أنهي artery من دول بتغذي الـ bone marrow؟"},{"id":"ES2020-05","topic":"histo","concept":"Cell membrane & transport","source":"ES2020","stem":"Cell coat function all except:","options":["Cell adhesions.","Cell allergy.","Cell recognition.","Cell transport."],"answer":3,"explanation":"حسب الإجابة في الملزمة الـ cell coat (glycocalyx) وظايفه: cell recognition و cell adhesion و immune/allergic reactions، أما الـ transport فده شغل الـ membrane proteins نفسها.","memoryTrick":"Glycocalyx = ID card + glue (recognition & adhesion).","stemAr":"وظايف الـ cell coat كلها ما عدا:"},{"id":"ES2020-06","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2020","stem":"Which organelle produces protein for export?","options":["SER","RER","Lysosome.","Mitochondria","Golgi apparatus"],"answer":1,"explanation":"الـ rER عليه ribosomes بتصنع البروتين اللي هيخرج برا الخلية (secretory/export proteins).","memoryTrick":"Rough = Ribosomes = Protein for export.","stemAr":"أنهي organelle بيصنع بروتين للتصدير (يتفرز برا الخلية)؟"},{"id":"ES2020-07","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2020","stem":"The cytoplasmic side of the coated vesicle is surrounded by:","options":["Clathrin.","Tubulin.","Actin.","Spectrin."],"answer":0,"explanation":"الـ coated vesicles متغطية من ناحية الـ cytoplasm ببروتين clathrin.","memoryTrick":"Coated = Clathrin (C مع C).","stemAr":"الناحية اللي جوه الـ cytoplasm من الـ coated vesicle محاطة بـ:"},{"id":"ES2020-08","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2020","stem":"Which of the following share in formation of cilia & flagella?","options":["Glial cells .","Keratin","Centrioles .","Neurofilaments.","Cytoskeleton."],"answer":2,"explanation":"الـ centrioles بتعمل الـ basal bodies اللي بيطلع منها الـ cilia والـ flagella.","memoryTrick":"Centriole ➜ Basal body ➜ Cilia.","stemAr":"أنهي واحد من دول بيشارك في تكوين الـ cilia والـ flagella؟"},{"id":"ES2020-09","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2020","stem":"What structure contributes to the cells cytoskeleton?","options":["Centrioles .","Peroxisome.","Ribosomes.","Microfilaments"],"answer":3,"repeatOf":"EM2019A-15","explanation":"الـ cytoskeleton مكوّن من microfilaments و intermediate filaments و microtubules. الـ ribosomes والـ peroxisomes مش جزء منه.","memoryTrick":"Cytoskeleton = Filaments + Tubules.","stemAr":"أنهي structure بيشارك في الـ cytoskeleton بتاع الخلية؟"},{"id":"ES2020-10","topic":"anat","concept":"Anatomical position, planes & terms","source":"ES2020","stem":"which of the following plane divides the body into anterior and posterior parts?","options":["sagittal plane","coronal plane","parasagittal plane","horizontal plane"],"answer":1,"explanation":"الـ coronal (frontal) plane بيقسم الجسم لـ anterior و posterior.","memoryTrick":"Coronal = التاج (Crown) بيتحط من ودن لودن ➜ قدام/ورا.","stemAr":"أنهي plane من دول بيقسم الجسم لجزء anterior وجزء posterior؟"},{"id":"ES2020-11","topic":"anat","concept":"Movements","source":"ES2020","stem":"which of the following terms means abduction of the fingers?","options":["Move the finger away from the median plane","Moving the finger away from the index finger","Moving the finger away from the middle finger","Moving the finger away from the little finger"],"answer":2,"explanation":"في الإيد الـ abduction والـ adduction بيتقاسوا بالنسبة للـ middle finger (مش الـ median plane).","memoryTrick":"الإيد = Middle finger هو المحور / الرجل = 2nd toe.","stemAr":"أنهي مصطلح من دول معناه abduction للأصابع؟"},{"id":"ES2020-12","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2020","stem":"Which of the following bones contain red bone marrow in the adult?","options":["Shaft of femur","Shaft of radius","sternum","shaft of tibia"],"answer":2,"explanation":"الـ sternum (flat bone) فيه red marrow في الكبار. الـ shafts بتاعة femur و radius و tibia فيها yellow marrow.","memoryTrick":"Sternum = لسه أحمر طول العمر.","stemAr":"أنهي عظام من دول فيها red bone marrow في البالغين؟"},{"id":"ES2020-13","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2020","stem":"which of the following arteries supply the spongy bone?","options":["epiphyseal arteries","metaphyseal arteries","nutrient arteries","periosteal arteries"],"answer":2,"explanation":"الـ nutrient artery بتدخل من الـ nutrient foramen في الـ shaft، وبتغذي الـ bone marrow والـ spongy bone والجزء الداخلي من الـ compact bone. الـ periosteal arteries بتغذي الجزء الخارجي من الـ compact bone.","memoryTrick":"Nutrient = جوه (Marrow + Spongy) / Periosteal = برا (Outer compact).","stemAr":"أنهي artery من دول بتغذي الـ spongy bone؟"},{"id":"ES2020-14","topic":"anat","concept":"Scalp & face","source":"ES2020","stem":"The occipital belly is supplied by which of the following?","options":["Cervical branch of facial nerve","posterior auricular nerve","mandibular branch of facial nerve","occipital branch of facial nerve"],"answer":1,"repeatOf":"ES2020-02","explanation":"الـ occipital belly بيتغذى من الـ posterior auricular nerve (فرع من الـ facial).","memoryTrick":"Occipital = Posterior auricular.","stemAr":"الـ occipital belly بيتغذى عصبيًا من أنهي واحد من دول؟"},{"id":"ES2021-01","topic":"anat","concept":"Scalp & face","source":"ES2021","stem":"Which of the following is the dangerous area of the scalp?","options":["The connective tissue layer","The pericranium","Loose areolar tissue layer","Skin layer"],"answer":2,"repeatOf":"ES2020-01","explanation":"الـ loose areolar tissue layer هي الـ dangerous area of the scalp.","memoryTrick":"L = Lethal.","stemAr":"أنهي واحدة من دول هي الـ dangerous area في الـ scalp؟"},{"id":"ES2021-02","topic":"anat","concept":"Scalp & face","source":"ES2021","stem":"The occipital belly is supplied by which of the following?","options":["Cervical branch of facial nerve","Posterior auricular nerve","Mandibular branch of facial nerve","Occipital branch of facial nerve"],"answer":1,"repeatOf":"ES2020-02","explanation":"الـ occipital belly بيتغذى من الـ posterior auricular nerve (فرع من الـ facial).","memoryTrick":"Occipital = Posterior auricular.","stemAr":"الـ occipital belly بيتغذى عصبيًا من أنهي واحد من دول؟"},{"id":"ES2021-03","topic":"anat","concept":"Movements","source":"ES2021","stem":"In which of the following movements the palm face posterior?","options":["Supination","Pronation","Eversion","Inversion"],"answer":1,"repeatOf":"ES2020-03","explanation":"في الـ pronation الـ radius بيلف على الـ ulna فالـ palm تبص لورا (posterior). الـ supination العكس.","memoryTrick":"Pronation = Palm Posterior (P-P).","stemAr":"في أنهي حركة من دول الـ palm بتبص لورا (posterior)؟"},{"id":"ES2021-04","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2021","stem":"Which of the following arteries supply the bone marrow?","options":["Epiphyseal arteries","Metaphyseal arteries","Nutrient arteries","Periosteal arteries"],"answer":2,"repeatOf":"EM2019B-02","explanation":"الـ nutrient artery بتدخل من الـ nutrient foramen في الـ shaft وتغذي الـ bone marrow والـ inner part.","memoryTrick":"Nutrient = Nourishes the Marrow.","stemAr":"أنهي artery من دول بتغذي الـ bone marrow؟"},{"id":"ES2021-05","topic":"embryo","concept":"Implantation & second week","source":"ES2021","stem":"When does Implantation of human embryos typically occurs?","options":["about 1 day after fertilization","about one week (i.e. 7 days) after fertilization","about two weeks (i.e. 14 days) after fertilization","after gastrulation"],"answer":1,"explanation":"الـ implantation بتبدأ حوالي اليوم 6–7 بعد الـ fertilization (نهاية الأسبوع الأول).","memoryTrick":"Implantation = آخر الأسبوع الأول (Day 6-7).","stemAr":"الـ implantation للـ human embryo بيحصل عادةً إمتى؟"},{"id":"ES2021-06","topic":"embryo","concept":"Implantation & second week","source":"ES2021","stem":"Placenta previa means implantation in which of the following sites?","options":["Abdominal cavity","Uterine tube","Ovary","Near the cervix"],"answer":3,"explanation":"الـ placenta previa معناها implantation في الـ lower uterine segment قريب من الـ internal os of the cervix.","memoryTrick":"Previa = قدّام (قدام عنق الرحم).","stemAr":"الـ placenta previa معناها implantation في أنهي مكان من دول؟"},{"id":"ES2021-07","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2021","stem":"Which organelle is involved in lipid metabolism?","options":["RER","Golgi apparatus","SER","Lysosome"],"answer":2,"explanation":"الـ sER مسئول عن lipid metabolism و steroid synthesis و detoxification.","memoryTrick":"Smooth = Steroids & Lipids & Detox.","stemAr":"أنهي organelle له دور في الـ lipid metabolism؟"},{"id":"ES2021-08","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2021","stem":"Which is a non-renewing cell:","options":["Hepatocyte.","Epidermal cell.","Nerve cell.","Cartilage cell"],"answer":2,"explanation":"الـ nerve cells (neurons) permanent cells ومبتتجددش. الـ hepatocytes stable، والـ epidermal cells labile.","memoryTrick":"Neuron = Never renews.","stemAr":"أنهي واحدة من دول non-renewing cell (مبتتجددش)؟"},{"id":"ES2021-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2021","stem":"What is protein forming cells containing?","options":["rER and sER","rER and golgi apparatus","sER and lysosomes","sER and mitochondria"],"answer":1,"explanation":"الخلية اللي بتصنع بروتين للإفراز محتاجة rER (تصنيع) و Golgi (تغليف وإفراز).","memoryTrick":"Protein cell = rER + Golgi.","stemAr":"الخلايا اللي بتصنع بروتين بيكون فيها إيه؟"},{"id":"ES2021-10","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2021","stem":"Which is Numerical aberrations?","options":["Ring Chromosome.","Deletion","Inversion.","Klinefelter s syndrome."],"answer":3,"explanation":"Klinefelter (47,XXY) numerical aberration. الـ ring chromosome والـ deletion والـ inversion structural.","memoryTrick":"Numerical = عدد زيادة/ناقص (XXY).","stemAr":"أنهي واحد من دول numerical aberration (خلل في العدد)؟"},{"id":"ES2021-11","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2021","stem":"What structure contributes to the cells cytoskeleton?","options":["Centrioles","Peroxisome.","Ribosomes.","Microfilaments"],"answer":3,"repeatOf":"EM2019A-15","explanation":"الـ cytoskeleton مكوّن من microfilaments و intermediate filaments و microtubules. الـ ribosomes والـ peroxisomes مش جزء منه.","memoryTrick":"Cytoskeleton = Filaments + Tubules.","stemAr":"أنهي structure بيشارك في الـ cytoskeleton بتاع الخلية؟"},{"id":"F2022-01","topic":"histo","concept":"Cytoplasmic organelles","source":"F2022","stem":"Which organelle contains digestive enzymes?","options":["RER","Golgi apparatus","SER","Lysosome"],"answer":3,"explanation":"الـ lysosomes فيها hydrolytic digestive enzymes (acid hydrolases).","memoryTrick":"Lysis = تكسير ➜ Lysosome = معدة الخلية.","stemAr":"أنهي organelle فيه digestive enzymes؟"},{"id":"F2022-02","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"F2022","stem":"What structure is at the base of cilia?","options":["Ribosomes","Peroxisome","Microfilaments","Centrioles"],"answer":3,"explanation":"في قاعدة كل cilium فيه basal body، وده centriole معدّل (9 triplets).","memoryTrick":"Basal body = Centriole تحت الـ cilium.","stemAr":"إيه الـ structure اللي موجود عند قاعدة الـ cilia؟"},{"id":"F2022-03","topic":"histo","concept":"Inclusions, pigments & stains","source":"F2022","stem":"In H&E stained sections of plasma cell, Golgi apparatus appears:","options":["Perinuclear.","Apical.","Unstained.","Basal."],"answer":2,"explanation":"الـ Golgi مبيتصبغش بالـ H&E فبيبان كمنطقة فاتحة جنب النواة (negative Golgi image).","memoryTrick":"Golgi في H&E = بقعة بيضا.","stemAr":"في قطاعات الـ plasma cell المصبوغة بـ H&E، الـ Golgi apparatus بيظهر:"},{"id":"F2022-04","topic":"histo","concept":"Chromosomes & genetic disorders","source":"F2022","stem":"Down syndrome:","options":["due to duplication of chromosome 22.","due to X chromosome monosomy.","due to multiple X syndrome.","caused by chromosome 21 trisomy."],"answer":3,"repeatOf":"EM2019A-16","explanation":"Down syndrome سببه الأشهر trisomy 21 (47 chromosomes) غالبًا بسبب nondisjunction.","memoryTrick":"Down = 21 (ثلاث نسخ من 21).","stemAr":"الـ Down syndrome:"},{"id":"F2022-05","topic":"embryo","concept":"Fetal membranes & placenta","source":"F2022","stem":"The wall of the chorionic sac is composed of:","options":["cytotrophoblast and syncytiotrophoblast","two layers of trophoblast lined by extraembryonic somatic mesoderm","trophoblast and exocoelomic membrane","extraembryonic splanchnic mesoderm and both layers of trophoblast"],"answer":1,"repeatOf":"EM2019A-11","explanation":"الـ chorion = طبقتين الـ trophoblast (cyto + syncytio) ومبطنين من جوه بالـ extraembryonic somatic mesoderm.","memoryTrick":"Chorion = Trophoblast + Somatic mesoderm (زي ما الـ amnion + somatic كمان).","stemAr":"جدار الـ chorionic sac مكوّن من:"},{"id":"F2022-06","topic":"embryo","concept":"Fertilization & cleavage","source":"F2022","stem":"What is the most correct sequence of early development following fertilization?","options":["zygote, blastomeres, morula, blastocyst","oocyte, zygote, morula, blastocyst","zygote, conceptus, blastocyst","polar bodies, zygote, conceptus, blastocyst"],"answer":0,"explanation":"الترتيب الصح: zygote ➜ blastomeres ➜ morula ➜ blastocyst.","memoryTrick":"Z-B-M-B.","stemAr":"إيه أصح ترتيب لمراحل النمو الأولى بعد الـ fertilization؟"},{"id":"F2022-07","topic":"embryo","concept":"Fertilization & cleavage","source":"F2022","stem":"The early stages of cleavage are characterized by which of the following?","options":["formation of a hollow ball of cells","formation of the zona pellucida","increase in the size of the cells in the zygote","increase in the number of cells in the zygote"],"answer":3,"explanation":"الـ cleavage = انقسامات mitotic سريعة بتزوّد عدد الخلايا (blastomeres) من غير ما الحجم الكلي يزيد، فكل خلية بتصغر.","memoryTrick":"Cleavage = العدد يزيد والحجم ثابت.","stemAr":"المراحل الأولى من الـ cleavage بتتميز بإيه من دول؟"},{"id":"F2022-08","topic":"anat","concept":"Scalp & face","source":"F2022","stem":"The frontal belly of occipitofrontalis is supplied by which of the following?","options":["Cervical branch of facial nerve","posterior auricular nerve","mandibular branch of facial nerve","temporal branch of facial nerve"],"answer":3,"explanation":"الـ frontal belly بيتغذى من الـ temporal branch of facial nerve.","memoryTrick":"Frontal = Temporal.","stemAr":"الـ frontal belly بتاع الـ occipitofrontalis بيتغذى عصبيًا من أنهي واحد من دول؟"},{"id":"F2022-09","topic":"anat","concept":"Skeleton & types of bones","source":"F2022","stem":"Which of the following bones is a part of axial skeleton?","options":["Femur","humerus","Rib cage","Metacarpal bone"],"answer":2,"explanation":"الـ axial skeleton = skull + vertebral column + ribs + sternum. الـ femur والـ humerus والـ metacarpals appendicular.","memoryTrick":"Axial = المحور (الجمجمة والعمود والقفص).","stemAr":"أنهي عظمة من دول جزء من الـ axial skeleton؟"},{"id":"F2022-10","topic":"anat","concept":"Lymphatic system","source":"F2022","stem":"The vessel which carries fluid from the tissue to be filtered is called","options":["Artery","Vein","Lymph vessel","Blood capillary"],"answer":2,"explanation":"الـ lymph vessels بتشيل الـ tissue fluid الزيادة وتعدّيه على الـ lymph nodes عشان يتفلتر قبل ما يرجع للدم.","memoryTrick":"Lymph = فلتر الصرف الصحي للأنسجة.","stemAr":"الوعاء اللي بيشيل السائل من الأنسجة عشان يتفلتر اسمه:"},{"id":"EM2022-01","topic":"anat","concept":"Movements","source":"EM2022","stem":"Which of the followings means movement of a part of the body around its long axis?","options":["Circumduction","Eversion","Pronation","Rotation"],"answer":3,"explanation":"الـ rotation = حركة الجزء حوالين الـ long axis بتاعه (medial أو lateral).","memoryTrick":"Rotation = يلف حوالين نفسه.","stemAr":"أنهي واحدة من دول معناها حركة جزء من الجسم حوالين محوره الطولي (long axis)؟"},{"id":"EM2022-02","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2022","stem":"The amount of the hard bone increased at which of the followings?","options":["Lower end of the long bone","Medullary cavity","Middle of the shaft of the bone","Upper end of the long bone"],"answer":2,"explanation":"الـ compact (hard) bone بيكون أسمك في نص الـ shaft (diaphysis) عشان يتحمل الـ bending stress، والأطراف أغلبها spongy.","memoryTrick":"النص = Compact / الأطراف = Spongy.","stemAr":"كمية الـ hard bone (compact) بتزيد في أنهي مكان من دول؟"},{"id":"EM2022-03","topic":"anat","concept":"Scalp & face","source":"EM2022","stem":"Which of the followings is the dangerous area of the scalp?","options":["Connective tissue layer","Periosteum","Skin layer","Subaponeurotic space"],"answer":3,"explanation":"الـ subaponeurotic space (loose areolar tissue) هي الـ dangerous area بسبب الـ emissary veins.","memoryTrick":"تحت الـ aponeurosis = الخطر.","stemAr":"أنهي واحدة من دول هي الـ dangerous area في الـ scalp؟"},{"id":"EM2022-04","topic":"embryo","concept":"Gametogenesis","source":"EM2022","stem":"Where does capacitation of the sperm take place?","options":["Epididymis","female genital tract","prostatic gland.","testis"],"answer":1,"explanation":"الـ capacitation بتحصل في الـ female genital tract (غالبًا الـ uterine tube) وبتاخد حوالي 7 ساعات.","memoryTrick":"Capacitation = عند الست.","stemAr":"الـ capacitation بتاعة الـ sperm بتحصل فين؟"},{"id":"EM2022-05","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"Secondary yolk sac can be seen in which of the following stages?","options":["after folding","blastocyst stage","chorionic vesicle stage","morula stage"],"answer":2,"explanation":"الـ secondary (definitive) yolk sac بيظهر حوالي اليوم 13 في مرحلة الـ chorionic vesicle (آخر الأسبوع التاني).","memoryTrick":"Secondary yolk sac = Week 2 end (Chorionic vesicle).","stemAr":"الـ secondary yolk sac ممكن يتشاف في أنهي مرحلة من دول؟"},{"id":"EM2022-06","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"At what stage of embryonic development does an embryo normally begin to implant in the endometrium?","options":["Blastocyst","Four-cell stage","Morula","Trilaminar embryo"],"answer":0,"explanation":"الـ embryo بيبدأ يعمل implantation وهو في مرحلة الـ blastocyst (اليوم 6–7).","memoryTrick":"اللي بيزرع نفسه = Blastocyst.","stemAr":"في أنهي مرحلة من مراحل النمو الـ embryo بيبدأ طبيعيًا يزرع (implant) في الـ endometrium؟"},{"id":"EM2022-07","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"What is the site of blastocyst implantation in placenta previa?","options":["Ovary","rectouterine pouch","the tube","uterine cavity"],"answer":3,"explanation":"في الـ placenta previa الـ implantation بيكون جوه الـ uterine cavity بس في الجزء السفلي قريب من الـ internal os. الـ ovary والـ tube والـ pouch دي ectopic.","memoryTrick":"Previa = جوه الرحم بس تحت.","stemAr":"مكان زرع الـ blastocyst في حالة الـ placenta previa فين؟"},{"id":"EM2022-08","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"The blastocyst is called late blastocyst after which of the following:","options":["Implantation","Fertilization","Hatching","Cleavage"],"answer":2,"explanation":"الـ blastocyst بيتسمى late بعد الـ hatching (خروجه من الـ zona pellucida) وقبل الـ implantation على طول.","memoryTrick":"Hatching = Late blastocyst 🐣.","stemAr":"الـ blastocyst بيتسمى late blastocyst بعد أنهي واحدة من دول؟"},{"id":"EM2022-09","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2022","stem":"The cells by which the embryo nourished are which of the following:","options":["Cytotrophoblast","Decidual","Amnioblast","Blastomeres"],"answer":1,"explanation":"الـ decidual cells هي خلايا الـ endometrium بعد ما تتغير بسبب الـ implantation (decidual reaction). بتبقى كبيرة ومليانة glycogen و lipids، والـ syncytiotrophoblast بيآكلها، فبتكون أول مصدر لتغذية الـ embryo في الأسابيع الأولى قبل ما الـ placenta تشتغل.","memoryTrick":"Decidua = مطبخ الجنين الأول 🍱 (Glycogen + Lipids).","stemAr":"الخلايا اللي الـ embryo بيتغذى عن طريقها هي أنهي واحدة من دول؟"},{"id":"EM2022-10","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"After the blastocytic cavity is surrounded by exocoelemic membrane it is called:","options":["Amniotic cavity","Chorionic cavity","Primary yolk sac","Extraembryonic mesoderm"],"answer":2,"explanation":"لما الـ hypoblast cells تكوّن الـ exocoelomic (Heuser's) membrane وتبطن الـ blastocystic cavity، الـ cavity دي تتسمى primary yolk sac.","memoryTrick":"Heuser's membrane حوالين الـ cavity = Primary yolk sac.","stemAr":"بعد ما الـ blastocystic cavity تتحاط بالـ exocoelomic membrane بيبقى اسمها:"},{"id":"EM2022-11","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2022","stem":"Where does fertilization of the egg occur?","options":["Ovary","Internal Os of the Uterus","Fimbriae","Ampulla"],"answer":3,"explanation":"الـ fertilization بتحصل في الـ ampulla of the uterine tube (أوسع جزء).","memoryTrick":"Ampulla = مكان اللقاء 💍.","stemAr":"الـ fertilization بتاع البويضة بيحصل فين؟"},{"id":"EM2022-12","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"What implants into the nutrient-rich endometrium (i.e. decidua) about 8-9 days after ovulation?","options":["Blastocyst","Morula","Epiblast","Hypoblast"],"answer":0,"explanation":"الـ blastocyst هو اللي بيعمل implantation في الـ endometrium.","memoryTrick":"Blastocyst = اللي بيزرع.","stemAr":"إيه اللي بيزرع (implants) في الـ endometrium الغني بالغذا (الـ decidua) بعد الـ ovulation بحوالي 8–9 أيام؟"},{"id":"EM2022-13","topic":"embryo","concept":"Implantation & second week","source":"EM2022","stem":"Which two embryological structures together form the bilaminar disk?","options":["Cytotrophoblast and Hypoblast","Hypoblast and Epiblast","Epiblast and Cytotrophoblast","Syncytiotrophoblast and Inner cell mass"],"answer":1,"explanation":"الـ bilaminar disc = epiblast (فوق) + hypoblast (تحت).","memoryTrick":"Bi = اتنين: Epi + Hypo.","stemAr":"أنهي اتنين embryological structures مع بعض بيكوّنوا الـ bilaminar disc؟"},{"id":"EM2022-14","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2022","stem":"In H&E - stained sections of plasma cell, How can Golgi apparatus appears?","options":["Perinuclear.","Apical.","Unstained.","Basal."],"answer":2,"repeatOf":"EM2019A-13","explanation":"في الـ plasma cell الـ Golgi بيظهر في H&E كـ negative image (منطقة فاتحة unstained) جنب النواة، لأنه مبيتصبغش.","memoryTrick":"Golgi في H&E = Negative image (بقعة فاضية).","stemAr":"في قطاعات الـ plasma cell المصبوغة بـ H&E، الـ Golgi apparatus بيظهر إزاي؟"},{"id":"EM2022-15","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2022","stem":"Which Two organelles share in the formation of lysosomes?","options":["rER & SER.","sER & Golgi.","Golgi & cell membrane.","rER & Golgi."],"answer":3,"repeatOf":"EM2019A-14","explanation":"الـ lysosomal enzymes بتتصنع على الـ rER وبعدين تتغلف وتتعبى في الـ Golgi (trans face) فتطلع primary lysosomes.","memoryTrick":"rER يصنع ➜ Golgi يغلّف = Lysosome.","stemAr":"أنهي اتنين organelles بيشاركوا في تكوين الـ lysosomes؟"},{"id":"EM2022-16","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2022","stem":"What structure contributes to the cells cytoskeleton?","options":["Ribosomes","Peroxisome","Microfilaments","Centrioles"],"answer":2,"repeatOf":"EM2019A-15","explanation":"الـ cytoskeleton مكوّن من microfilaments و intermediate filaments و microtubules. الـ ribosomes والـ peroxisomes مش جزء منه.","memoryTrick":"Cytoskeleton = Filaments + Tubules.","stemAr":"أنهي structure بيشارك في الـ cytoskeleton بتاع الخلية؟"},{"id":"EM2022-17","topic":"histo","concept":"Cell membrane & transport","source":"EM2022","stem":"What is the polysaccharide coating that is sometimes found on the cell membrane?","options":["Plasmalemma","Glycocalyx","Protoplasm","Cristae"],"answer":1,"repeatOf":"ES2019-06","explanation":"الـ glycocalyx (cell coat) هو الطبقة الـ carbohydrate (glycoproteins & glycolipids) على السطح الخارجي للـ cell membrane.","memoryTrick":"Glyco = سكر ➜ Glycocalyx = غلاف سكري.","stemAr":"إيه هو الغطا الـ polysaccharide اللي بيكون أحيانًا على الـ cell membrane؟"},{"id":"EM2022-18","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2022","stem":"What does the cause of Down syndrome:","options":["due to duplication of chromosome 22.","due to X chromosome monosomy.","due to multiple X syndrome.","caused by chromosome 21 trisomy."],"answer":3,"explanation":"Down syndrome سببه trisomy 21.","memoryTrick":"Down = 21.","stemAr":"إيه سبب الـ Down syndrome؟"},{"id":"EM2022-19","topic":"histo","concept":"Cell membrane & transport","source":"EM2022","stem":"What is the term for the process used by cells for the transport solids?","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":3,"explanation":"الـ phagocytosis = ابتلاع جزيئات صلبة (cell eating). الـ pinocytosis للسوائل.","memoryTrick":"Phago = أكل (solids).","stemAr":"إيه اسم العملية اللي الخلايا بتستخدمها عشان تنقل المواد الصلبة (solids)؟"},{"id":"EM2022-20","topic":"histo","concept":"Cell membrane & transport","source":"EM2022","stem":"Cell coat function all except:","options":["Cell adhesions.","Cell allergy.","Cell recognition.","Cell transport"],"answer":3,"repeatOf":"ES2020-05","explanation":"حسب الإجابة في الملزمة الـ cell coat (glycocalyx) وظايفه: cell recognition و cell adhesion و immune/allergic reactions، أما الـ transport فده شغل الـ membrane proteins نفسها.","memoryTrick":"Glycocalyx = ID card + glue (recognition & adhesion).","stemAr":"وظايف الـ cell coat كلها ما عدا:"},{"id":"EM2022-21","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2022","stem":"The cytoplasmic side of the coated vesicle is surrounded by:","options":["Clathrin.","Tubulin.","Actin.","Spectrin."],"answer":0,"repeatOf":"ES2020-07","explanation":"الـ coated vesicles متغطية من ناحية الـ cytoplasm ببروتين clathrin.","memoryTrick":"Coated = Clathrin (C مع C).","stemAr":"الناحية اللي جوه الـ cytoplasm من الـ coated vesicle محاطة بـ:"},{"id":"EM2022-22","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2022","stem":"Which organelle is involved in lipid metabolism?","options":["rER","Golgi apparatus","sER","Lysosome"],"answer":2,"repeatOf":"ES2021-07","explanation":"الـ sER مسئول عن lipid metabolism و steroid synthesis و detoxification.","memoryTrick":"Smooth = Steroids & Lipids & Detox.","stemAr":"أنهي organelle له دور في الـ lipid metabolism؟"},{"id":"EM2022-23","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2022","stem":"What are the folds on the inner mitochondrial membrane called?","options":["Plasmalemma","Glycocalyx","Protoplasm","Cristae"],"answer":3,"explanation":"الـ cristae هي الثنيات في الـ inner mitochondrial membrane، وبتزوّد المساحة للـ oxidative phosphorylation.","memoryTrick":"Cristae = Crests (طيات) جوه الـ mitochondria.","stemAr":"الطيّات (folds) اللي في الـ inner mitochondrial membrane اسمها إيه؟"},{"id":"ES2022-01","topic":"anat","concept":"Scalp & face","source":"ES2022","stem":"The occipital belly of occipitofrontalis is supplied by which of the following?","options":["Buccal branch of facial nerve.","posterior auricular nerve.","mandibular branch of facial nerve.","temporal branch of facial nerve"],"answer":1,"explanation":"الـ occipital belly بيتغذى من الـ posterior auricular nerve.","memoryTrick":"Occipital = Posterior auricular.","stemAr":"الـ occipital belly بتاع الـ occipitofrontalis بيتغذى عصبيًا من أنهي واحد من دول؟"},{"id":"ES2022-02","topic":"anat","concept":"Scalp & face","source":"ES2022","stem":"The lateral part of the scalp is drained into which of the following?","options":["Parotid lymph nodes.","Mastoid lymph nodes.","Occipital lymph nodes.","Submandibular lymph nodes"],"answer":0,"explanation":"الجزء الجانبي (temporal) من الـ scalp قدام الودن بيصرف على الـ parotid (preauricular) lymph nodes.","memoryTrick":"قدام الودن = Parotid / ورا = Mastoid / الخلف = Occipital.","stemAr":"الجزء الجانبي (lateral) من الـ scalp بيصرّف في أنهي واحد من دول؟"},{"id":"F2023A-01","topic":"histo","concept":"Inclusions, pigments & stains","source":"F2023A","stem":"When the protein secreting cells stained with Hematoxylin and Eosin, There is a clear unstained area near the nucleus. This pale area is called:","options":["Brown network or granules","Cisternae","Negative Golgi image","Cristae"],"answer":2,"explanation":"المنطقة الفاتحة جنب النواة في الخلايا المفرزة للبروتين (زي الـ plasma cell) هي الـ negative Golgi image.","memoryTrick":"بقعة فاضية = Golgi.","stemAr":"لما الخلايا اللي بتفرز بروتين تتصبغ بـ Hematoxylin and Eosin، بيبان منطقة فاتحة مش مصبوغة جنب النواة. المنطقة الفاتحة دي اسمها:"},{"id":"F2023A-02","topic":"histo","concept":"Chromosomes & genetic disorders","source":"F2023A","stem":"The nucleus of which of the following cells shows Barr body in females (drum stick appearance):","options":["Lymphocyte","Neutrophil","Monocyte","Basophil"],"answer":1,"explanation":"الـ Barr body في الإناث بيظهر في الـ neutrophils كـ drumstick appendage على النواة.","memoryTrick":"Drumstick = Neutrophil 🥁.","stemAr":"نواة أنهي خلية من دول بيظهر فيها الـ Barr body في الإناث (شكل الـ drum stick)؟"},{"id":"F2023A-03","topic":"histo","concept":"Cell cycle & division","source":"F2023A","stem":"During the cell cycle, in which stage DNA replication takes place?","options":["Prophase","Metaphase","Anaphase","Interphase"],"answer":3,"explanation":"الـ DNA replication بتحصل في الـ interphase (تحديدًا الـ S phase) قبل الـ mitosis.","memoryTrick":"Replication = Interphase (S).","stemAr":"أثناء الـ cell cycle، الـ DNA replication بيحصل في أنهي مرحلة؟"},{"id":"F2023A-04","topic":"histo","concept":"Chromosomes & genetic disorders","source":"F2023A","stem":"In which of the following types, the chromosomes have short and long arms of unequal length with the centromere
