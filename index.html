tains red when stained with silver","It is found supranuclear in nerve cell","Appears as unstained area in deeply basophilic cytoplasm"],"answer":0,"explanation":"الـ ribosomes بتسبب cytoplasmic basophilia في الـ H&E بسبب الـ RNA اللي فيها. أما الصبغ بالـ silver والـ supranuclear والـ unstained area فدي صفات الـ Golgi.","memoryTrick":"RNA = Basophilic.","stemAr":"أنهي واحدة من دول صح بخصوص الـ ribosomes؟","whyWrong":[null,"الـ silver بيصبغ الـ Golgi كـ network من brown granules & fibrils، مش صفة للـ ribosomes.","الـ supranuclear (apical) ده شكل الـ Golgi بالـ silver في الخلايا المفرزة، وفي الـ nerve cells الـ Golgi بيكون perinuclear.","المنطقة الـ unstained في الـ cytoplasm الـ deeply basophilic هي الـ Negative Golgi image."]},{"id":"EM2025B-23","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following is absent from matrix of mitochondria?","options":["Circular DNA & RNA","Ca^{+2} acting as catalysts condensed within dense granules","Oxidative enzymes of Kreb's cycle","Hydrolytic digestive enzymes"],"answer":3,"explanation":"الـ mitochondrial matrix فيها: oxidative enzymes بتاعة الـ citric acid (Krebs) cycle، circular DNA، و mRNA و tRNA و rRNA، و electron-dense granules غنية بالـ Ca²⁺ بتشتغل catalysts. أما الـ hydrolytic enzymes فمكانها الـ lysosomes.","memoryTrick":"Hydrolytic = Lysosome.","stemAr":"أنهي واحد من دول مش موجود في الـ matrix بتاع الـ mitochondria؟","whyWrong":["الـ matrix فيها circular DNA و RNA فعلًا. والسؤال عن اللي مش موجود.","الـ matrix فيها electron-dense granules غنية بالـ Ca²⁺ بتشتغل catalysts.","الـ matrix فيها الـ oxidative enzymes بتاعة الـ Krebs cycle.",null]},{"id":"EM2025B-24","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following is truly- matching as regard each organelle?","options":["Cristae: inner mitochondrial membrane","Multivesicular bodies: Engulfed solid foreign bodies","SER: protein synthesis","Euchromatin: Nucleolus associated"],"answer":0,"explanation":"الصح A: الـ inner mitochondrial membrane بيعمل طيات اسمها cristae.\nالباقي غلط: الـ multivesicular bodies لهضم السوائل، وتصنيع البروتين على الـ rER، والـ nucleolus-associated chromatin من أماكن الـ heterochromatin.","memoryTrick":"Cristae = Inner.","stemAr":"أنهي واحدة من دول التوصيل فيها صح لكل organelle؟","whyWrong":[null,"الـ multivesicular body = primary lysosome + pinocytic vesicle (fluid). الأجسام الصلبة بتكوّن heterolysosome.","تصنيع البروتين بيحصل بالـ ribosomes (الـ attached على الـ rER أو الـ free)، والـ sER مفيهوش ribosomes.","الـ nucleolus-associated chromatin من أماكن الـ heterochromatin، مش euchromatin."]},{"id":"EM2025B-25","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following is mis matching as regard each organelle?","options":["Attached ribosomes: Synthesis of cytosol proteins","Primary lysosomes: Originate from trans- face of Golgi apparatus","RER: Initial protein modifications","Transfer vesicles: Transport proteins from RER to cis-face"],"answer":0,"explanation":"الغلط A: الـ attached ribosomes (على الـ rER) بتصنع البروتينات اللي بتتفرز (إنزيمات وهرمونات). أما بروتينات الـ cytosol فبتتصنع على الـ free ribosomes.","memoryTrick":"Attached = Export.","stemAr":"أنهي واحدة من دول التوصيل فيها غلط لكل organelle؟","whyWrong":[null,"مطابقة صح: الـ lysosomes بتطلع من الـ trans face بتاع الـ Golgi. والسؤال عن الغلط.","مطابقة صح: من وظايف الـ rER الـ initial glycosylation لبعض البروتينات.","مطابقة صح: الـ transfer vesicles بتنقل البروتين من الـ rER للـ cis face."]},{"id":"EM2025B-26","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2025B","stem":"What is the special stain of Golgi apparatus?","options":["Silver","Best's Carmine","Sudan III","Iron HX"],"answer":0,"repeatOf":"EM2025A-26","explanation":"الـ Golgi مبيظهرش في الـ H&E، والصبغة الخاصة بيه الـ silver (Ag): بيظهر network من brown granules & fibrils.","memoryTrick":"Golgi = Silver 🥈 / Glycogen = Best's carmine / Fat = Sudan / Centrioles = Iron HX.","stemAr":"إيه الـ special stain بتاع الـ Golgi apparatus؟","whyWrong":[null,"الـ Best's carmine بيصبغ الـ glycogen (red granules).","الـ Sudan III بيصبغ الـ fat (orange globules).","الـ iron hematoxylin بيظهّر الـ centrioles (two dark bodies جنب النواة) والـ mitochondria."]},{"id":"EM2025B-27","topic":"histo","concept":"Nucleus & chromatin","source":"EM2025B","stem":"Which of the following best describes peripheral chromatin?","options":["Connected to inner border of nuclear envelope","Connected to nucleoli","Clumped and scattered in the nuclear sap","Fine granules and scattered in the nuclear sap"],"answer":0,"repeatOf":"EM2025A-27","explanation":"الـ peripheral chromatin هو الـ heterochromatin اللي لازق في الـ inner surface of the nuclear envelope.","memoryTrick":"Peripheral = على الحافة (لازق في الغشا).","stemAr":"أنهي واحدة من دول أحسن وصف للـ peripheral chromatin؟","whyWrong":[null,"اللي حوالين الـ nucleolus اسمه nucleolus-associated chromatin.","ده الـ chromatin islands (scattered).","الـ fine granules ده شكل الـ euchromatin في الـ EM."]},{"id":"EM2025B-28","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following statements describe active cells?","options":["Dark nucleus","Heterochromatic nucleus","Euchromatic nucleus","Few Mitochondria."],"answer":2,"explanation":"الخلية النشطة اللي بتصنع بروتين نواتها euchromatic: الـ euchromatin (extended, active) بيدي pale nucleus (vesicular) وفيه الـ active genes. وكمان الـ mitochondria بتكون أكتر في الخلايا عالية النشاط.","memoryTrick":"Active = Euchromatic.","stemAr":"أنهي جملة من دول بتوصف الخلايا النشطة (active cells)؟","whyWrong":["النواة الـ condensed (الغامقة) بتدل على heterochromatin = inactive genes.","الـ heterochromatin = inactive genes، زي الـ small lymphocytes.",null,"الـ mitochondria بتكون أكتر عددًا في الخلايا عالية النشاط."]},{"id":"EM2025B-29","topic":"histo","concept":"Nucleus & chromatin","source":"EM2025B","stem":"What about heterochromatin?","options":["Makes the nucleus pale by LM","Appears as coarse granules in the nucleus","Contains active genes","Represents extended parts of chromatin"],"answer":1,"repeatOf":"EM2025A-29","explanation":"الـ heterochromatin هو الـ condensed (inactive) chromatin: في الـ LM بيدي condensed nucleus، وفي الـ EM بيظهر coarse granules، وفيه الـ inactive genes.","memoryTrick":"Hetero = Coarse & Condensed & Inactive.","stemAr":"إيه الصح عن الـ heterochromatin؟","whyWrong":["اللي بيخلي النواة pale (vesicular) هو الـ euchromatin.",null,"الـ active genes في الـ euchromatin.","الـ extended (uncoiled) chromatin هو الـ euchromatin."]},{"id":"EM2025B-30","topic":"histo","concept":"Cell membrane & transport","source":"EM2025B","stem":"Pinocytosis is the process by which cell membrane can engulf which of the following?","options":["Fluid droplets","solid particles","Bacteria","Foreign bodies"],"answer":0,"explanation":"الـ pinocytosis (cell drinking): زي الـ phagocytosis بس بـ invaginations أصغر في الغشا بتبلع extracellular fluid وتكوّن pinocytic vesicles.","memoryTrick":"Pino = سوائل.","stemAr":"الـ pinocytosis هي العملية اللي الـ cell membrane بتبلع بيها أنهي واحد من دول؟","whyWrong":[null,"بلع الـ solid particles = phagocytosis.","بلع البكتيريا = phagocytosis (زي الـ macrophages والـ neutrophils).","بلع المواد الصلبة الكبيرة = phagocytosis."]},{"id":"EM2025B-31","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2025B","stem":"Which one is regarded as exogenous pigment?","options":["Haemoglobin","Melanin","Carotene","Lipofuscin"],"answer":2,"explanation":"الـ pigments نوعين:\n• Endogenous (من جوه الجسم): hemoglobin (في الـ RBCs)، melanin، lipofuscin.\n• Exogenous (من بره): carbon & dust particles، carotene، tattoo marks.","memoryTrick":"Carotene = Carrot 🥕 (من بره).","stemAr":"أنهي واحد يعتبر exogenous pigment؟","whyWrong":["الـ hemoglobin endogenous: في الـ RBCs وبيشيل الـ O2 والـ CO2.","الـ melanin endogenous: في الجلد والشعر والعين، بيدي اللون ويحمي من الـ UV.",null,"الـ lipofuscin endogenous: waste products بتتجمع مع السن في الـ cardiac muscle والـ nerve cells."]},{"id":"ES2025B-01","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025B","stem":"Which organelle is responsible for cell digestion?","options":["RER","Golgi apparatus","SER","Lysosome"],"answer":3,"repeatOf":"ES2025A-01","explanation":"الـ lysosomes membranous vesicles فيها hydrolytic enzymes، ووظيفتها الـ intracytoplasmic digestion.","memoryTrick":"Lysosome = معدة الخلية.","stemAr":"أنهي organelle مسئول عن الهضم داخل الخلية؟","whyWrong":["الـ rER لتصنيع البروتين.","الـ Golgi للـ packing وتعديل البروتينات.","الـ sER للـ lipids والـ steroids والـ detoxification.",null]},{"id":"ES2025B-02","topic":"histo","concept":"Cell membrane & transport","source":"ES2025B","stem":"What is the term for the process by which the cells transport solids?","options":["Endocytosis.","Exocytosis","Pinocytosis","Phagocytosis"],"answer":3,"repeatOf":"ES2025A-02","explanation":"الـ phagocytosis (cell eating) نوع من الـ endocytosis لبلع مواد صلبة كبيرة: الـ macrophages والـ neutrophils بيبلعوا البكتيريا والـ protozoa والخلايا التالفة جوه phagosome. أما الـ pinocytosis (cell drinking) فبتبلع extracellular fluid.","memoryTrick":"Phago = أكل.","stemAr":"إيه اسم العملية اللي الخلايا بتنقل بيها المواد الصلبة (solids)؟","whyWrong":["الـ endocytosis مصطلح عام بيشمل الـ phagocytosis والـ pinocytosis والـ receptor-mediated endocytosis.","الـ exocytosis إخراج محتوى vesicle لبره الخلية.","الـ pinocytosis للسوائل (cell drinking).",null]},{"id":"ES2025B-03","topic":"histo","concept":"Cell membrane & transport","source":"ES2025B","stem":"Which of the following best describes the phospholipid molecules of cell membrane?","options":["The head is non-charged and hydrophobic","The head is directed inwards away from the aqueous solutions","The fatty acid tail is charged and hydrophilic","The head is directed towards the aqueous solutions"],"answer":3,"repeatOf":"ES2025A-03","explanation":"كل phospholipid ليه:\n• Hydrophilic polar head: charged و hydrophilic ومتجه ناحية الـ aqueous solutions، فالرؤوس بتبقى على السطح الخارجي والداخلي.\n• Hydrophobic tail (fatty acids): non-charged و hydrophobic ومتجه لجوه بعيد عن الـ aqueous solutions.","memoryTrick":"Head يحب المية / Tail يكرهها.","stemAr":"أنهي واحدة من دول أحسن وصف لجزيئات الـ phospholipid في الـ cell membrane؟","whyWrong":["الـ head بالعكس: charged و hydrophilic.","الـ head متجه ناحية الـ aqueous solutions مش بعيد عنها. اللي متجه لجوه هو الـ tail.","الـ tail بالعكس: non-charged و hydrophobic.",null]},{"id":"ES2025B-04","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025B","stem":"Regarding rER, which of the following describes it?","options":["Form proteins secreted by the cells","Form proteins used within the cytosol","Linked together by tRNA forming polysomes.","Bind to the outer surface of SER"],"answer":0,"repeatOf":"ES2025A-04","explanation":"الـ attached ribosomes على الـ rER (مربوطة بالـ large subunit في الـ ribophorins) بتصنع البروتينات اللي الخلية بتفرزها زي الإنزيمات والهرمونات.","memoryTrick":"Rough = Secreted.","stemAr":"بخصوص الـ rER، أنهي واحدة من دول بتوصفه؟","whyWrong":[null,"البروتينات اللي بتستعملها الخلية جوه الـ cytosol بتتصنع على الـ free ribosomes.","الـ ribosomes بيربطها الـ mRNA وتعمل rosettes أو spiral chains (polyribosomes)، مش الـ tRNA.","الـ ribosomes بتلزق في الـ outer surface بتاع الـ rER. الـ sER مفيهوش ribosomes."]},{"id":"ES2025B-05","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025B","stem":"Which feature of the followings describes centrioles?","options":["They are a membranous organelle.","Can be demonstrated with silver stain.","Formed of nine triplets of microtubules","Have the same number of microtubules as the shaft of cilia"],"answer":2,"repeatOf":"ES2025A-05","explanation":"الـ centriole تركيب اسطواني من microtubules منظمة (non-membranous). جداره 9 bundles كل واحدة 3 MTs (triplets) = 27 MT. في الـ LM بيظهر بالـ iron hematoxylin كـ two dark bodies جنب النواة.","memoryTrick":"Centriole = 9×3.","stemAr":"أنهي صفة من دول بتوصف الـ centrioles؟","whyWrong":["الـ centrioles non-membranous (من الـ cytoskeleton).","الـ centrioles بتتبيّن بالـ iron hematoxylin. الـ silver للـ Golgi.",null,"الـ centriole فيه 27 MT (9×3)، لكن الـ shaft بتاع الـ cilium فيه 20 MT (9 doublets + 2 singlets)."]},{"id":"ES2025B-06","topic":"histo","concept":"Nucleus & chromatin","source":"ES2025B","stem":"What is the typical feature of condensed chromatin?","options":["Appears dark acidophilic by LM","Appears as fine granules by EM","Contains the inactive genes","Appears pale basophilic by LM"],"answer":2,"repeatOf":"ES2025A-06","explanation":"الـ condensed chromatin (heterochromatin) بيمثل coiled chromosomes فيها الـ inactive genes. في الـ LM بيدي condensed nucleus (basophilic)، وفي الـ EM بيظهر coarse granules.","memoryTrick":"Condensed = Inactive.","stemAr":"إيه الصفة المميزة للـ condensed chromatin؟","whyWrong":["الـ chromatin basophilic (بسبب الـ DNA)، مش acidophilic.","الـ fine granules في الـ EM صفة الـ euchromatin.",null,"الـ pale basophilic (vesicular nucleus) صفة الـ euchromatin."]},{"id":"ES2025B-07","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025B","stem":"The cilia can be characterized by which of the followings?","options":["The basal body is formed of nine microtubules","The rootlet contains twenty-seven microtubules","move secretions over the tissue surface in one direction","Can be found in the male genital system"],"answer":2,"explanation":"الـ cilia وظيفتها تحريك الإفرازات أو الجزيئات على سطح النسيج في اتجاه واحد، زي في الـ respiratory والـ female genital system.\nتركيبها: basal body = 27 MT (9 triplets)، shaft (axoneme) = 9 doublets + 2 singlets = 20 MT، rootlets = 9 MT (من نمو الـ MT C في كل triplet).","memoryTrick":"Cilia = اتجاه واحد ➡️ / 27 basal - 20 shaft - 9 rootlets.","stemAr":"الـ cilia ممكن توصف بأنهي واحدة من دول؟","whyWrong":["الـ basal body هو centriole واحد من 27 MT (9 triplets)، مش 9.","الـ rootlets بتتكون من نمو الـ MT C في كل triplet، يعني 9 MT مش 27.",null,"الـ cilia متوصفة في الـ respiratory والـ female genital system. أما الـ male genital system فمذكور فيه الـ flagella (ذيل الـ sperm) والـ stereocilia، مش cilia."]},{"id":"ES2025B-08","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2025B","stem":"Which one of the following stains demonstrates lipid in the liver cells?","options":["Sudan III","PAS","Silver","trypan blue"],"answer":0,"repeatOf":"ES2025A-08","explanation":"الـ fat بيتخزن في الـ fat cells كـ large globules وفي الـ liver cells كـ small droplets. في الـ H&E بيدوب أثناء التحضير فيبان vacuoles. الصبغة الخاصة: Sudan III (orange globules) أو Sudan black (black globules).","memoryTrick":"Sudan = Fat / PAS & Best's carmine = Glycogen / Silver = Golgi.","stemAr":"أنهي stain من دول بيبيّن الـ lipid في خلايا الكبد؟","whyWrong":[null,"الـ PAS magenta بيصبغ الـ glycogen (red granules).","الـ silver بيصبغ الـ Golgi (brown network).","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."]},{"id":"ES2025B-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025B","stem":"What is the origin of secretory vesicles of Golgi apparatus?","options":["SER","RER","trans face of Golgi apparatus.","cell membrane"],"answer":2,"explanation":"الـ trans face (Exit = Concave = Secretory = Mature) بتاع الـ Golgi هو اللي بيطلع منه: الـ secretory vesicles (للـ exocytosis)، والـ lysosomes، والـ membrane renewal vesicles.","memoryTrick":"Trans = Exit 🚪","stemAr":"إيه أصل الـ secretory vesicles بتاعة الـ Golgi apparatus؟","whyWrong":["الـ sER مش أصل الـ secretory vesicles.","الـ rER بيطلع منه الـ transfer vesicles اللي رايحة للـ cis face بتاع الـ Golgi، مش الـ secretory vesicles.",null,"الـ secretory vesicle بتندمج مع الـ cell membrane وقت الـ exocytosis، يعني الغشا مكان خروجها مش أصلها."]},{"id":"ES2025B-10","topic":"anat","concept":"Scalp & face","source":"ES2025B","stem":"Why is the loose areolar tissue considered dangerous?","options":["It is highly vascularized","It contains sweat glands","It allows infection to spread to the brain via emissary veins","It is the thickest layer of the scalp"],"answer":2,"repeatOf":"ES2025A-10","explanation":"الطبقة الرابعة في الـ scalp هي الـ loose areolar tissue (بتملا الـ subaponeurotic space)، واسمها dangerous layer لأن الـ emissary veins بتفتح فيها وبتنقل أي infection لجوه المخ (الـ venous sinuses). والنزيف فيها بيعمل swelling في الـ scalp كله و black eye.","memoryTrick":"Emissary veins = طريق العدوى للمخ.","stemAr":"ليه الـ loose areolar tissue بتعتبر خطيرة (dangerous)؟","whyWrong":["الطبقة اللي فيها أوعية وأعصاب الـ scalp هي الـ connective tissue، مش ده سبب خطورة الـ loose areolar tissue.","الـ sweat glands في الجلد.",null,"مش سبب الخطورة. السبب الـ emissary veins."]},{"id":"ES2025B-11","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2025B","stem":"Which of the following arteries supply the outer compact bone?","options":["Nutrient artery","Periosteal artery","Epiphyseal artery","Metaphyseal artery"],"answer":1,"repeatOf":"ES2025A-11","explanation":"الـ periosteal arteries هي المصدر الأساسي للدم في كل أنواع العظام، وبتجي من الأوعية القريبة، وبتغذي الـ outer compact bone. والعظمة اللي يتشال منها الـ periosteum بتموت.","memoryTrick":"Periosteal = Outer.","stemAr":"أنهي artery من دول بتغذي الـ outer compact bone؟","whyWrong":["الـ nutrient artery بتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.",null,"الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis)."]},{"id":"ES2025B-12","topic":"embryo","concept":"Gametogenesis","source":"ES2025B","stem":"What is the primary mechanism that prevents polyspermy after the first sperm enters the egg?","options":["Cortical reaction","Decidual reaction","Acrosome reaction","Cleavage division"],"answer":0,"repeatOf":"ES2025A-12","explanation":"بعد دخول الـ sperm الـ ovum بيستجيب بـ cortical and zonal reaction (الـ cortical granules بتطلع محتواها فيتكون fertilization envelope)، وده اللي بيمنع دخول sperm تاني (polyspermy).","memoryTrick":"Cortical = Close the door 🚪.","stemAr":"إيه الآلية الأساسية اللي بتمنع الـ polyspermy بعد ما أول sperm يدخل البويضة؟","whyWrong":[null,"الـ decidual reaction بتحصل في الـ endometrium (زيادة الـ glycogen والـ lipids) مع الـ implantation.","الـ acrosomal reaction بتحصل في الـ sperm عشان يخترق الـ zona.","الـ cleavage انقسامات mitotic بعد الـ fertilization."]},{"id":"ES2025B-13","topic":"embryo","concept":"Implantation & second week","source":"ES2025B","stem":"Where originates the extraembryonic mesoderm?","options":["It is a result of the migration of cells from the neuroectoderm","In a site between trophoblast and embryoblast","In a site between hypoblast and epiblast","In a site between endoderm and ectoderm"],"answer":1,"repeatOf":"EM2023-20","explanation":"الـ extraembryonic mesoderm: خلايا بتظهر بين الـ inner surface بتاع الـ cytotrophoblast والـ outer surface بتاع الـ yolk sac، وبتكوّن طبقة loose connective tissue.","memoryTrick":"Extraembryonic = بين الـ trophoblast والـ embryo.","stemAr":"الـ extraembryonic mesoderm أصله منين؟","whyWrong":["الـ extraembryonic mesoderm بيظهر بين الـ cytotrophoblast والـ yolk sac، مش من الـ neuroectoderm.",null,"الـ hypoblast والـ epiblast هما الـ bilaminar germ disc نفسه، ومفيش بينهم المكان ده.","الـ extraembryonic mesoderm بيظهر بين الـ cytotrophoblast والـ yolk sac في الأسبوع التاني."]},{"id":"ES2025-01","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025","stem":"Which organelle is responsible for maintenance of cell health?","options":["Rough endoplasmic reticulum","Golgi apparatus","Smooth endoplasmic reticulum","Lysosome"],"answer":3,"explanation":"من وظايف الـ lysosomes إنها بتحافظ على صحة الخلية عن طريق التخلص من الـ organelles القديمة (autolysosome)، وكمان بتهضم الـ nutrients والـ foreign invaders زي البكتيريا والفيروسات.","memoryTrick":"Lysosome = عامل النظافة 🧹.","stemAr":"أنهي organelle مسئول عن الحفاظ على صحة الخلية؟","whyWrong":["الـ rER لتصنيع البروتين.","الـ Golgi للـ packing وتعديل البروتينات.","الـ sER للـ lipids والـ steroids والـ detoxification.",null]},{"id":"ES2025-02","topic":"histo","concept":"Cell membrane & transport","source":"ES2025","stem":"What is the term for the process by which the cells transport fluids?","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":2,"explanation":"الـ pinocytosis (cell drinking) نوع من الـ endocytosis: invaginations صغيرة في الغشا بتبلع extracellular fluid وتكوّن pinocytic vesicles. أما الـ phagocytosis (cell eating) فلبلع المواد الصلبة.","memoryTrick":"Pino = شرب.","stemAr":"إيه اسم العملية اللي الخلايا بتنقل بيها السوائل؟","whyWrong":["الـ endocytosis مصطلح عام بيشمل الـ phagocytosis والـ pinocytosis والـ receptor-mediated endocytosis.","الـ exocytosis إخراج محتوى vesicle لبره الخلية.",null,"الـ phagocytosis (cell eating) لبلع المواد الصلبة."]},{"id":"ES2025-03","topic":"histo","concept":"Cell membrane & transport","source":"ES2025","stem":"Which of the following best describes the phospholipid molecules of cell membrane?","options":["The head is non-charged and hydrophobic","The head is directed inwards away from the aqueous solutions","The fatty acid tail is charged and hydrophilic","The head is directed towards the aqueous solutions"],"answer":3,"repeatOf":"ES2025A-03","explanation":"كل phospholipid ليه:\n• Hydrophilic polar head: charged و hydrophilic ومتجه ناحية الـ aqueous solutions، فالرؤوس بتبقى على السطح الخارجي والداخلي.\n• Hydrophobic tail (fatty acids): non-charged و hydrophobic ومتجه لجوه بعيد عن الـ aqueous solutions.","memoryTrick":"Head يحب المية / Tail يكرهها.","stemAr":"أنهي واحدة من دول أحسن وصف لجزيئات الـ phospholipid في الـ cell membrane؟","whyWrong":["الـ head بالعكس: charged و hydrophilic.","الـ head متجه ناحية الـ aqueous solutions مش بعيد عنها. اللي متجه لجوه هو الـ tail.","الـ tail بالعكس: non-charged و hydrophobic.",null]},{"id":"ES2025-04","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025","stem":"Regarding free ribosomes, which of the following describes it?","options":["Form proteins secreted by the cells","Form proteins used within the cytosol","Linked together by tRNA forming polysomes","Bind to the outer surface of rER"],"answer":1,"explanation":"الـ free ribosomes (منفردة أو polyribosomes) بتصنع البروتينات اللي بتستعملها الخلية جوه الـ cytosol (زي الـ glycolytic enzymes). أما الـ attached ribosomes على الـ rER فبتصنع البروتينات اللي بتتفرز.","memoryTrick":"Free = للاستخدام المحلي.","stemAr":"بخصوص الـ free ribosomes، أنهي واحدة من دول بتوصفها؟","whyWrong":["البروتينات اللي بتتفرز بتصنعها الـ attached ribosomes على الـ rER.",null,"الـ ribosomes بيربطها الـ mRNA (rosettes أو spiral chains)، مش الـ tRNA.","اللي بيلزق في الـ outer surface بتاع الـ rER هو الـ attached ribosomes، مش الـ free."]},{"id":"ES2025-05","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025","stem":"Which feature of the followings describes centrioles?","options":["They are a membranous organelle","Can be demonstrated with iron hematoxylin stain","Formed of eight bundles of microtubules","Have the same number of microtubules as the shaft of cilia"],"answer":1,"explanation":"الـ centrioles في الـ LM بتتبيّن بالـ iron hematoxylin كـ two dark bodies جنب النواة. هي non-membranous، وجدارها 9 triplets (27 MT).","memoryTrick":"Centriole = Iron HX.","stemAr":"أنهي صفة من دول بتوصف الـ centrioles؟","whyWrong":["الـ centrioles non-membranous.",null,"جدار الـ centriole 9 bundles مش 8.","الـ centriole فيه 27 MT، والـ shaft بتاع الـ cilium فيه 20 MT."]},{"id":"ES2025-06","topic":"histo","concept":"Nucleus & chromatin","source":"ES2025","stem":"What is the typical feature of extended chromatin?","options":["Appears pale basophilic by LM","Appears as coarse granules by EM","Contains the inactive genes","Appears dark basophilic by LM"],"answer":0,"explanation":"الـ extended (active) chromatin = euchromatin: في الـ LM بيظهر pale basophilic (vesicular nucleus) لأنه بيمثل chromosomes مفرودة فيها الـ active genes اللي بتوجّه تصنيع البروتين. في الـ EM بيظهر fine granules.","memoryTrick":"Extended = Pale & Active.","stemAr":"إيه الصفة المميزة للـ extended chromatin؟","whyWrong":[null,"الـ coarse granules في الـ EM صفة الـ heterochromatin.","الـ inactive genes في الـ heterochromatin (condensed).","الـ condensed nucleus صفة الـ heterochromatin."]},{"id":"ES2025-07","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025","stem":"The cilia can be characterized by which of the followings?","options":["The basal body is formed of nine microtubules","The rootlet contains twenty-seven microtubules","move secretions over the tissue surface in two directions","Can be found in the female genital system"],"answer":3,"explanation":"الـ cilia وظيفتها تحريك الإفرازات أو الجزيئات على سطح النسيج في اتجاه واحد، وموجودة في الـ respiratory والـ female genital system.","memoryTrick":"Cilia في الـ tube بتسوق البويضة.","stemAr":"الـ cilia ممكن توصف بأنهي واحدة من دول؟","whyWrong":["الـ basal body هو centriole واحد من 27 MT (9 triplets)، مش 9.","الـ rootlets 9 MT (من نمو الـ MT C في كل triplet)، مش 27.","الـ cilia بتحرك الإفرازات في اتجاه واحد مش اتجاهين.",null]},{"id":"ES2025-08","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2025","stem":"Which one of the following stains demonstrates glycogen in the liver cells?","options":["Sudan III","PAS","Silver","Sudan black"],"answer":1,"explanation":"الـ glycogen بيتخزن في الـ liver والـ muscle cells. في الـ LM:\n• H&E: vacuoles.\n• Best's carmine: red granules.\n• PAS magenta: red granules.","memoryTrick":"Glycogen = PAS & Best's carmine 🔴 / Fat = Sudan.","stemAr":"أنهي stain من دول بيبيّن الـ glycogen في خلايا الكبد؟","whyWrong":["الـ Sudan III بيصبغ الـ fat (orange globules).",null,"الـ silver بيصبغ الـ Golgi.","الـ Sudan black بيصبغ الـ fat (black globules)."]},{"id":"ES2025-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025","stem":"What is the origin of transfer vesicles of Golgi apparatus?","options":["Smooth endoplasmic reticulum","Rough endoplasmic reticulum","The trans face of Golgi apparatus","The cell membrane"],"answer":1,"explanation":"الـ rER بيعبّي البروتينات اللي صنعها في transfer vesicles وبيبعتها للـ cis face بتاع الـ Golgi.","memoryTrick":"Transfer = من rER للـ Golgi.","stemAr":"إيه أصل الـ transfer vesicles بتاعة الـ Golgi apparatus؟","whyWrong":["الـ sER مش أصل الـ transfer vesicles.",null,"الـ trans face بيطلع منه الـ secretory vesicles والـ lysosomes، مش الـ transfer vesicles.","الـ cell membrane مش أصل الـ transfer vesicles."]},{"id":"ES2025-10","topic":"anat","concept":"Scalp & face","source":"ES2025","stem":"A 40 years old male patient came to the hospital with bleeding in the scalp region on examination the wound showing a large gap, what is the cause of this gap?","options":["cutting of the epicranial aponeurosis","cutting of the second layer of the scalp","cutting of the pericranium","the wound is superficial"],"answer":0,"explanation":"لو الـ epicranial aponeurosis (الطبقة التالتة، اللي بتوصل الـ frontal والـ occipital bellies) اتقطعت، الجرح بيفتح (gaping).","memoryTrick":"Gap = Aponeurosis اتقطعت.","stemAr":"راجل عنده 40 سنة جه المستشفى بنزيف في منطقة الـ scalp، وبالكشف الجرح كان مفتوح جامد (large gap). إيه سبب الفتحة دي؟","whyWrong":[null,"الطبقة التانية (connective tissue) بتربط الأولى بالتالتة، والجرح فيها بينزف profuse من غير gaping.","الـ pericranium loosely attached للعظم وfirmly adherent للـ sutures، ومش هو سبب الـ gaping.","الجرح السطحي (الطبقات الأولى والتانية) بيبقى من غير gaping."]},{"id":"ES2025-11","topic":"embryo","concept":"Gametogenesis","source":"ES2025","stem":"What is the primary mechanism that prevents polyspermy after the first sperm enters the egg?","options":["Cortical reaction","Decidual reaction","Acrosome reaction","Cleavage division"],"answer":0,"repeatOf":"ES2025A-12","explanation":"بعد دخول الـ sperm الـ ovum بيستجيب بـ cortical and zonal reaction (الـ cortical granules بتطلع محتواها فيتكون fertilization envelope)، وده اللي بيمنع دخول sperm تاني (polyspermy).","memoryTrick":"Cortical = Close the door 🚪.","stemAr":"إيه الآلية الأساسية اللي بتمنع الـ polyspermy بعد ما أول sperm يدخل البويضة؟","whyWrong":[null,"الـ decidual reaction بتحصل في الـ endometrium (زيادة الـ glycogen والـ lipids) مع الـ implantation.","الـ acrosomal reaction بتحصل في الـ sperm عشان يخترق الـ zona.","الـ cleavage انقسامات mitotic بعد الـ fertilization."]},{"id":"ES2025-12","topic":"embryo","concept":"Implantation & second week","source":"ES2025","stem":"Where originates the extraembryonic mesoderm?","options":["It is a result of the migration of cells from the neuroectoderm","In a site between trophoblast and embryoblast","In a site between hypoblast and epiblast","In a site between endoderm and ectoderm"],"answer":1,"repeatOf":"EM2023-20","explanation":"الـ extraembryonic mesoderm: خلايا بتظهر بين الـ inner surface بتاع الـ cytotrophoblast والـ outer surface بتاع الـ yolk sac، وبتكوّن طبقة loose connective tissue.","memoryTrick":"Extraembryonic = بين الـ trophoblast والـ embryo.","stemAr":"الـ extraembryonic mesoderm أصله منين؟","whyWrong":["الـ extraembryonic mesoderm بيظهر بين الـ cytotrophoblast والـ yolk sac، مش من الـ neuroectoderm.",null,"الـ hypoblast والـ epiblast هما الـ bilaminar germ disc نفسه، ومفيش بينهم المكان ده.","الـ extraembryonic mesoderm بيظهر بين الـ cytotrophoblast والـ yolk sac في الأسبوع التاني."]},{"id":"ES2026G1-01","topic":"anat","concept":"Movements","source":"ES2026G1","stem":"Movement of the shoulder superiorly is termed which of the following?","options":["Protraction","Elevation","Depression","Retraction"],"answer":1,"explanation":"حركة الكتف لفوق اسمها elevation، ولتحت depression.","memoryTrick":"Elevation = لفوق ⬆️.","stemAr":"حركة الكتف لفوق اسمها إيه؟","whyWrong":["الـ protraction حركة لقدام.",null,"الـ depression لتحت.","الـ retraction لورا."]},{"id":"ES2026G1-02","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2026G1","stem":"During the X-ray examination of a child, the bones appeared incomplete. The physician explained that the bones are still in the process of growing. Which of the following structures is responsible for increase the length of the bone?","options":["Periosteum","Endosteum","Epiphyseal plate (growth plate)","Articular cartilage"],"answer":2,"explanation":"العظمة بتطول بترسيب عظم على جانبين الـ growing (epiphyseal) plate لحد ما تتعظم وتلتحم بالـ diaphysis.","memoryTrick":"Length = Growth plate.","stemAr":"في أشعة X لطفل، العظام ظهرت مش مكتملة، والدكتور شرح إن العظام لسه بتنمو. أنهي structure من دول مسئول عن زيادة طول العظمة؟","whyWrong":["الـ periosteum مسئول عن التخن (subperiosteal deposition) مش الطول.","الـ endosteum مش هو المسئول عن الطول. الطول من الـ growing plate.",null,"الـ articular cartilage بيغطي أسطح المفاصل في الـ synovial joints، مش للطول."]},{"id":"ES2026G1-03","topic":"anat","concept":"Scalp & face","source":"ES2026G1","stem":"An 8-year-old child presents with fever and swelling of the scalp after a minor injury. The physician cautions that the infection may spread to the brain. Through which layer of the scalp can the infection reach the intracranial structures?","options":["Skin of the scalp","Connective tissue layer (dense subcutaneous tissue)","Loose areolar tissue layer","Pericranium"],"answer":2,"explanation":"الطبقة الرابعة في الـ scalp هي الـ loose areolar tissue (بتملا الـ subaponeurotic space)، واسمها dangerous layer لأن الـ emissary veins بتفتح فيها وبتنقل أي infection لجوه المخ (الـ venous sinuses). والنزيف فيها بيعمل swelling في الـ scalp كله و black eye.","memoryTrick":"L = Lethal.","stemAr":"طفل عنده 8 سنين جه بسخونية وورم في الـ scalp بعد إصابة بسيطة، والدكتور حذّر إن العدوى ممكن توصل للمخ. العدوى ممكن توصل للـ intracranial structures عن طريق أنهي طبقة من الـ scalp؟","whyWrong":["الـ skin الطبقة السطحية (فيها sebaceous glands و hair follicles)، مش الـ dangerous layer.","الـ connective tissue (dense subcutaneous) فيها أوعية وأعصاب الـ scalp، والنزيف منها بيبقى profuse لأن الألياف بتمنع الأوعية تنكمش، لكنها مش الـ dangerous layer.",null,"الـ pericranium loosely attached للعظم لكن firmly adherent للـ sutures، ومش هي الـ dangerous layer."]},{"id":"ES2026G1-04","topic":"embryo","concept":"Implantation & second week","source":"ES2026G1","stem":"An embryo shows failure of formation of the amniotic cavity. Which layer of the bilaminar disc is primarily affected?","options":["Hypoblast","Epiblast","Cytotrophoblast","Syncytiotrophoblast"],"answer":1,"explanation":"الـ amniotic cavity بتتكون فوق الـ epiblast، وخلايا الـ epiblast هي اللي بتعمل الـ amnioblasts.","memoryTrick":"Amnion فوق الـ Epiblast.","stemAr":"embryo فيه فشل في تكوين الـ amniotic cavity. أنهي طبقة من الـ bilaminar disc متأثرة أساسًا؟","whyWrong":["الـ hypoblast بيكوّن الـ yolk sac مش الـ amnion.",null,"الـ cytotrophoblast مش جزء من الـ disc.","الـ syncytiotrophoblast مش جزء من الـ disc."]},{"id":"ES2026G1-05","topic":"embryo","concept":"Implantation & second week","source":"ES2026G1","stem":"Failure of formation of extraembryonic mesoderm would prevent development of which of the following?","options":["Amniotic cavity","Chorionic cavity","Bilaminar germ disc","Trophoblastic shell"],"answer":1,"explanation":"الـ chorionic cavity (extraembryonic coelom) بتتكون من اندماج spaces جوه الـ extraembryonic mesoderm، فلو المسودرم ده مش موجود الـ cavity مش هتتكون.","memoryTrick":"Chorionic cavity = فجوات في الـ extraembryonic mesoderm.","stemAr":"فشل تكوين الـ extraembryonic mesoderm هيمنع تكوين أنهي واحد من دول؟","whyWrong":["الـ amniotic cavity بتتكون جوه الـ epiblast، مش محتاجة الـ extraembryonic mesoderm.",null,"الـ bilaminar disc بيتكون من الـ epiblast والـ hypoblast.","اللي بيتكون جوه الـ extraembryonic mesoderm هو الـ chorionic cavity، مش الـ trophoblastic shell."]},{"id":"ES2026G1-06","topic":"embryo","concept":"Implantation & second week","source":"ES2026G1","stem":"A placenta later shows placenta previa. The abnormality most likely originated from implantation of the blastocyst in which of the following?","options":["Fundus of uterus","Posterior uterine wall","Lower uterine segment","Myometrium"],"answer":2,"explanation":"الـ normal implantation في الـ posterior wall of the uterus near the fundus. أما الـ placenta previa فهي implantation جوه الرحم قريب من الـ internal os (الجزء السفلي).","memoryTrick":"Previa = تحت.","stemAr":"مشيمة ظهر فيها بعد كده placenta previa. العيب ده غالبًا جاي من إن الـ blastocyst زرع فين؟","whyWrong":["الـ fundus قريب من المكان الطبيعي للـ implantation.","الـ posterior wall (near the fundus) هو المكان الطبيعي.",null,"الـ placenta previa معناها implantation قريب من الـ internal os، مش في الـ myometrium."]},{"id":"ES2026G1-07","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026G1","stem":"A 15-year-old girl presents with primary amenorrhea, short stature, and webbed neck. What is her karyotype?","options":["46,XX","46,XY","45,X","47,XXX"],"answer":2,"explanation":"الـ Turner syndrome (45,X0) = monosomy of sex chromosome: أنثى عندها X واحد بس، ومفيش sex chromatin. من صفاته: short females مع mental retardation، edema في الأطراف، underdeveloped ovaries & external genitalia، و primary amenorrhea.","memoryTrick":"Turner = X لوحده (45,X0) = قصيرة + primary amenorrhea.","stemAr":"بنت عندها 15 سنة جاية بـ primary amenorrhea (الدورة مجتش خالص) وقِصَر قامة و webbed neck. إيه الـ karyotype بتاعها؟","whyWrong":["46,XX ده karyotype أنثى طبيعي.","46,XY ده karyotype ذكر طبيعي.",null,"الـ 47,XXX (multiple X) بيبقى فيه accelerated growth لحد البلوغ، مش short stature."]},{"id":"ES2026G1-08","topic":"histo","concept":"Cell cycle & division","source":"ES2026G1","stem":"Regarding the prophase of the first meiotic division, crossing over occurs in which of the following stages?","options":["Leptotene","Zygotene","Pachytene","Diplotene"],"answer":2,"explanation":"الـ prophase I فيها 5 stages. في الـ pachytene الـ bivalent بيقصر ويتخن ويبان كـ tetrad (4 chromatids)، والـ chromatids ممكن تتكسر بمساعدة الـ recombinase وتلتحم تاني، ويحصل تبادل أجزاء بين الـ non-sister chromatids = crossing over، والأماكن دي اسمها chiasmata.","memoryTrick":"Lepto (رفيع) ➜ Zygo (أزواج) ➜ Pachy (تخين = crossing over) ➜ Diplo (بيبعدوا) ➜ Diakinesis.","stemAr":"بخصوص الـ prophase بتاعة الـ first meiotic division، الـ crossing over بيحصل في أنهي مرحلة من دول؟","whyWrong":["في الـ leptotene الـ 46 d-chromosomes بتبان long thin threads مش مرتبطة ببعض.","في الـ zygotene الـ chromosomes بتترتب في 23 pair (bivalents)، كل pair من 2 homologous جنب بعض.",null,"في الـ diplotene الـ chromosomes بتبدأ تبعد عن بعض فتبان الـ chiasmata، يعني الـ crossing over حصل قبلها في الـ pachytene."]},{"id":"ES2026G1-09","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026G1","stem":"Which of the following describes the chromosomal microtubules?","options":["They are continuous","Arise from MTOC surrounding the centrioles","Responsible for elongation of the cell","Responsible for pulling the sister chromatids"],"answer":3,"explanation":"الـ mitotic spindle 3 أنواع:\n• Cytoplasmic MT: continuous، طالعة من الـ MTOC حوالين الـ centrioles، مسئولة عن elongation of cell.\n• Chromosomal MT: non-continuous، طالعة من الـ MTOC ومتربطة في الـ kinetochores، بترتب الـ chromosomes وتشد الـ sister chromatids.\n• Astral MT: star-like حوالين الـ centrioles، بتحدد axis of the spindle.","memoryTrick":"Chromosomal = الحبل اللي بيشد الـ chromatids / Cytoplasmic = بيطوّل الخلية.","stemAr":"أنهي واحدة من دول بتوصف الـ chromosomal microtubules؟","whyWrong":["الـ continuous ده وصف الـ cytoplasmic MT. الـ chromosomal non-continuous.","الطالعة من الـ MTOC حوالين الـ centrioles ده وصف الـ cytoplasmic MT.","الـ elongation of cell وظيفة الـ cytoplasmic MT.",null]},{"id":"ES2026G1-10","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026G1","stem":"Which of the following is considered as aneuploidy?","options":["Triploid","Trisomy","Tetraploid","Polyploidy"],"answer":1,"explanation":"الـ numerical aberrations نوعين:\n• Euploidy: مضاعف كامل للعدد (triploid 3n = 69، tetraploid 4n = 92، polyploidy).\n• Aneuploidy: مش مضاعف كامل، زيادة أو نقص chromosome واحد: trisomy (2n+1) أو monosomy (2n-1).","memoryTrick":"Aneuploidy = chromosome واحد زيادة/ناقص / Euploidy = set كامل.","stemAr":"أنهي واحد من دول يعتبر aneuploidy؟","whyWrong":["الـ triploid (3n) نوع من الـ euploidy.",null,"الـ tetraploid (4n) نوع من الـ euploidy.","الـ polyploidy نوع من الـ euploidy."]},{"id":"ES2026G1-11","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026G1","stem":"In which of the following chromosomal aberrations two copies of the same gene can be found on the same chromosome?","options":["Isochromosome","Ring chromosome","Addition","Translocation"],"answer":2,"explanation":"الـ Duplication (Addition) هو إضافة جزء مقطوع من chromosome كقطعة زيادة للـ homologous chromosome، وبيحصل غالبًا بسبب unequal crossing over. النتيجة وجود نسختين من نفس الـ genes على نفس الـ chromosome (double dose of genes).","memoryTrick":"Addition = Duplication = نفس الجين مرتين على نفس الـ chromosome.","stemAr":"في أنهي chromosomal aberration من دول ممكن نلاقي نسختين من نفس الـ gene على نفس الـ chromosome؟","whyWrong":["الـ isochromosome معناه إن الـ chromosome بينقسم بالعرض عند الـ centromere، فيطلع واحد بذراعين طوال وواحد بذراعين قصار. ده مش \"نسختين من نفس الـ genes على نفس الـ chromosome\"، اللي هو تعريف الـ Duplication.","الـ ring chromosome = كسرين وفقد أجزاء والتحام في شكل حلقة، يعني نقص مش تكرار.",null,"الـ translocation = نقل جزء لـ chromosome تاني non-homologous، مش تكرار على نفس الـ chromosome."],"note":"إجابة ملزمة الأسئلة كانت A) Isochromosome، والإجابة اتصححت لـ C) Addition."},{"id":"ES2026G1-12","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2026G1","stem":"Regarding the centrioles, which of the following describes it?","options":["Appear as two dark bodies with H&E","Share in the formation of cilia","Present as two pairs in non-dividing cells","Formed by dynamic microtubules"],"answer":1,"explanation":"من وظايف الـ centrioles إنها بتشارك في تكوين الـ cilia والـ flagella (الـ centrioles بتتضاعف وتعمل الـ basal bodies). في الـ LM بتظهر بالـ iron hematoxylin، وفي الـ non-dividing cells بيبقى فيه pair واحد، وجدارها من stable microtubules.","memoryTrick":"Centriole ➜ Cilia.","stemAr":"بخصوص الـ centrioles، أنهي واحدة من دول بتوصفها؟","whyWrong":["الـ centrioles بتبان two dark bodies بالـ iron hematoxylin، مش الـ H&E.",null,"في الـ non-dividing cells فيه 2 cylinders (pair واحد). بيتضاعفوا لـ two pairs في الـ S phase.","الـ centrioles من stable microtubules. الـ dynamic بيتجمع ويتفكك باستمرار."]},{"id":"ES2026G1-13","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2026G1","stem":"What is the typical description of glycogen granules?","options":["Alpha glycogen forms rosette aggregation in the liver","Appears red with H&E stain","Can be stained with osmic acid","Beta glycogen forms rosette aggregation in the liver"],"answer":0,"explanation":"الـ glycogen في الـ EM بيظهر يا إما single granules (β granules) أو rosette-shaped aggregations (α granules)، وغالبًا بيتركز في مناطق غنية بالـ sER. وبيتخزن في الـ liver والـ muscle cells.","memoryTrick":"Alpha = Aggregates (rosettes) / Beta = مفردة.","stemAr":"إيه الوصف المعتاد للـ glycogen granules؟","whyWrong":[null,"في الـ H&E الـ glycogen بيظهر vacuoles. اللون الأحمر بيظهر بالـ Best's carmine أو الـ PAS.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","الـ β granules مفردة، والـ α هي اللي بتعمل rosettes."]},{"id":"ES2026G1-14","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2026G1","stem":"Which of the following stains can demonstrate the plasma membrane?","options":["PAS","Osmic acid","Sudan II","Orcein"],"answer":0,"explanation":"الـ plasma membrane رفيع جدًا (7.5-10 nm) فصعب يتشاف في الـ LM، لكن ممكن يتبيّن بالصبغ بالـ silver (Ag) أو الـ PAS.","memoryTrick":"Membrane = Silver أو PAS.","stemAr":"أنهي stain من دول يقدر يبيّن الـ plasma membrane؟","whyWrong":[null,"الـ osmic acid مش من الصبغات المذكورة لإظهار الغشا. المذكور: silver و PAS.","الـ Sudan III والـ Sudan black بيصبغوا الـ fat، والـ Sudan II مش من الصبغات المذكورة للغشا.","الـ orcein مش من الصبغات المذكورة لإظهار الغشا. المذكور: silver و PAS."]},{"id":"ES2026G1-15","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2026G1","stem":"Diffuse cytoplasmic basophilia caused by ribosome can be found in which cells?","options":["Embryonic cells","Pancreatic cells","Nerve cells","Glial cells"],"answer":0,"explanation":"الـ ribosomes بتسبب cytoplasmic basophilia بسبب الـ RNA، وليها 3 أشكال:\n• Diffuse: embryonic cells.\n• Localized: pancreatic cells (في الـ base).\n• Focal: nerve cells (Nissl granules).","memoryTrick":"Diffuse = Embryonic / Localized = Pancreas / Focal = Nerve.","stemAr":"الـ diffuse cytoplasmic basophilia اللي سببها الـ ribosomes بنلاقيها في أنهي خلايا؟","whyWrong":[null,"الـ pancreatic cells فيها localized basophilia (في الـ base).","الـ nerve cells فيها focal basophilia (Nissl granules).","الـ glial cells مش من الأمثلة المذكورة للـ diffuse basophilia."]},{"id":"ES2026G1-16","topic":"histo","concept":"Nucleus & chromatin","source":"ES2026G1","stem":"Regarding nuclear chromatin, what is the typical character?","options":["Extended type appears dark basophilic with LM","Condensed type appears pale basophilic with LM","Extended type contains the active genes","Euchromatin appears as coarse granules with EM"],"answer":2,"explanation":"الـ extended chromatin (euchromatin) فيه الـ active genes وبيظهر pale.","memoryTrick":"Extended = Active.","stemAr":"بخصوص الـ nuclear chromatin، إيه الصفة المعتادة؟","whyWrong":["الـ extended (eu) بيظهر فاتح مش غامق.","الـ condensed بيظهر غامق مش فاتح.",null,"الـ euchromatin fine granules، والـ coarse صفة الـ hetero."]},{"id":"EM2026G1-01","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026G1","stem":"During dissection, the brain was sectioned into anterior and posterior parts. Which anatomical plane is used for the examination?","options":["coronal plane","parasagittal plane","midsagittal plane","horizontal plane"],"answer":0,"explanation":"تقسيم المخ لـ anterior و posterior = coronal plane.","memoryTrick":"Coronal.","stemAr":"أثناء الـ dissection، المخ اتقطع لجزء anterior وجزء posterior. أنهي anatomical plane اتستخدم؟","whyWrong":[null,"الـ parasagittal يمين وشمال مش متساويين.","الـ midsagittal يمين وشمال متساويين.","الـ horizontal فوق وتحت."]},{"id":"EM2026G1-02","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2026G1","stem":"Which of the following arteries can supply the bone marrow?","options":["epiphyseal","periosteal","metaphyseal","nutrient"],"answer":3,"repeatOf":"EM2025A-06","explanation":"الـ nutrient artery بتدخل العظمة من الـ nutrient canal وبتتقسم لـ proximal و distal branches في الـ medullary cavity، وبتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.","memoryTrick":"Nutrient = Marrow.","stemAr":"أنهي artery من دول ممكن تغذي الـ bone marrow؟","whyWrong":["الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ periosteal arteries المصدر الأساسي لكل العظام، وبتغذي الـ outer compact bone.","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis).",null]},{"id":"EM2026G1-03","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026G1","stem":"In which anatomical location are the deep plantar vessels found?","options":["in the palm of the hand away from the skin","in the sole of the foot near the skin","in the palm of the hand near the skin","in the sole of the foot away from the skin"],"answer":3,"explanation":"Deep = بعيد عن السطح، و Plantar = sole of the foot.","memoryTrick":"Plantar = Sole / Deep = بعيد عن الجلد.","stemAr":"الـ deep plantar vessels موجودة في أنهي مكان تشريحي؟","whyWrong":["plantar للقدم مش اليد.","deep يعني بعيد عن الجلد.","palm غلط، و near the skin = superficial.",null]},{"id":"EM2026G1-04","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2026G1","stem":"The amount of compact bone is increased in the middle of shaft of long bone. Why?","options":["To increase the length","As it looks like a sponge to sustain the pressure","As it makes bone narrow in the middle","As it provides strength for weight"],"answer":3,"explanation":"الـ compact bone بيدي قوة لتحمل الوزن (strength for weight bearing)، وفي الـ long bone كميته بتزيد في نص الـ shaft.","memoryTrick":"النص = أقوى نقطة (Compact).","stemAr":"كمية الـ compact bone بتزيد في نص الـ shaft بتاع الـ long bone. ليه؟","whyWrong":["الطول بيزيد من الـ growing plate.","شكل الإسفنجة صفة الـ spongy bone.","الهدف من زيادته القوة لتحمل الوزن.",null]},{"id":"EM2026G1-05","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026G1","stem":"To put the person in anatomical position, what is the correct position of the hand and the foot?","options":["The palm and the toes face anteriorly","The palm faces posterior and the toes face anterior","The palm faces anterior and the toes face posterior","The palm faces anterior and the toes face anterior"],"answer":3,"explanation":"في الـ anatomical position: الـ palms بتبص لقدام (anteriorly)، والراس والعينين والـ toes لقدام كمان.","memoryTrick":"كله لقدام.","stemAr":"عشان نحط الشخص في الـ anatomical position، إيه الوضع الصح لليد والقدم؟","whyWrong":["الاختيار ده كمان بيقول إن الـ palm والـ toes لقدام، فمعناه زي D. الإجابة المعتمدة D.","الـ palm بتبص لقدام مش لورا.","الـ toes بتبص لقدام مش لورا.",null],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2026G1-06","topic":"anat","concept":"Movements","source":"EM2026G1","stem":"Which term describes the movement of the distal end of the limb in a circle of 360 degree?","options":["circumduction","adduction","rotation","flexion"],"answer":0,"explanation":"الـ circumduction = الطرف البعيد بيرسم دايرة (مزيج flexion و abduction و extension و adduction).","memoryTrick":"Circum = دايرة ⭕.","stemAr":"أنهي مصطلح بيوصف حركة الطرف البعيد للـ limb في دايرة 360 درجة؟","whyWrong":[null,"الـ adduction ناحية الـ midline.","الـ rotation حوالين الـ long axis، مش دايرة بالطرف.","الـ flexion ثني."]},{"id":"EM2026G1-07","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G1","stem":"A researcher examines an embryo at day 9 post-fertilization and notes fluid accumulation between the epiblast and trophoblast. The cavity will develop into which structure?","options":["Chorionic cavity","Amniotic cavity","Yolk sac","Blastocyst cavity"],"answer":1,"explanation":"الـ amniotic cavity بتظهر كـ cavity صغيرة جوه الـ epiblast، وخلايا الـ epiblast اللي جنب الـ cytotrophoblast اسمها amnioblasts.","memoryTrick":"فوق الـ epiblast = Amnion.","stemAr":"باحث فحص embryo في اليوم 9 بعد الـ fertilization ولاحظ تجمع سائل بين الـ epiblast والـ trophoblast. الـ cavity دي هتتحول لأنهي structure؟","whyWrong":["الـ chorionic cavity بتتكون من اندماج cavities جوه الـ extraembryonic mesoderm.",null,"الـ primitive yolk sac بيتكون ناحية الـ hypoblast (الـ exocoelomic membrane حوالين الـ blastocyst cavity).","الـ blastocyst cavity موجودة من الأسبوع الأول، وبتتحول لـ primitive yolk sac."]},{"id":"EM2026G1-08","topic":"embryo","concept":"Gametogenesis","source":"EM2026G1","stem":"A 25-year-old male presents with infertility. Semen analysis shows azoospermia. Testicular biopsy reveals the presence of Sertoli cells but absence of germ cells. Which stage of gametogenesis is most likely affected?","options":["Meiosis I in primary spermatocytes","Mitosis of spermatogonia","Spermiogenesis","Migration of primordial germ cells"],"answer":3,"explanation":"الإجابة المعتمدة: وجود Sertoli cells من غير أي germ cells معناه إن المشكلة في هجرة الـ primordial germ cells. الـ spermatogenesis بتبدأ من الـ spermatogonia (primitive germ cells) في الـ seminiferous tubules.","memoryTrick":null,"stemAr":"راجل عنده 25 سنة جاي بعدم خصوبة. تحليل السائل المنوي بيبيّن azoospermia، والـ testicular biopsy بيبيّن وجود Sertoli cells وغياب الـ germ cells. أنهي مرحلة من الـ gametogenesis غالبًا متأثرة؟","whyWrong":["لو المشكلة في الـ meiosis I كان هيبقى فيه spermatogonia و primary spermatocytes.","لو المشكلة في الـ mitosis كان هيبقى فيه spermatogonia.","لو المشكلة في الـ spermiogenesis كان هيبقى فيه spermatids.",null],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2026G1-09","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G1","stem":"On day 5 post-fertilization, an embryo develops a fluid-filled cavity and differentiates into two cell types. Which gives rise to embryo proper?","options":["Syncytiotrophoblast","Cytotrophoblast","Trophoblast","Inner cell mass"],"answer":3,"explanation":"الـ blastocyst مكوّن من outer layer (trophoblast) و inner cell mass و blastocele. الـ inner cell mass هو الـ future embryo، أما الـ trophoblast فبيتمايز لـ cytotrophoblast و syncytiotrophoblast وبيشارك في تكوين الـ chorion.","memoryTrick":"Inner = الجنين / Outer = المشيمة.","stemAr":"في اليوم 5 بعد الـ fertilization، الـ embryo بيكوّن cavity مليانة سائل وبيتمايز لنوعين خلايا. أنهي واحد فيهم بيدي الـ embryo proper؟","whyWrong":["الـ syncytiotrophoblast من الـ trophoblast، مش الـ embryo.","الـ cytotrophoblast من الـ trophoblast، مش الـ embryo.","الـ trophoblast بيشارك في الـ chorion، مش الـ embryo proper.",null]},{"id":"EM2026G1-10","topic":"embryo","concept":"Implantation & second week","source":"EM2026G1","stem":"Implantation is complete by day 10-12 and the conceptus is fully embedded in the endometrium. Which layer of maternal trophoblast is directly responsible for eroding maternal capillaries to access blood?","options":["Syncytiotrophoblast","Cytotrophoblast","Epiblast","Extraembryonic mesoderm"],"answer":0,"explanation":"الـ syncytiotrophoblast هو اللي بيآكل (erodes) الـ maternal capillaries ويفتحها على الـ lacunae.","memoryTrick":"Syncytio = المهاجم.","stemAr":"الـ implantation بيكمل في اليوم 10–12 والـ conceptus بيبقى مدفون بالكامل في الـ endometrium. أنهي طبقة من الـ trophoblast مسئولة مباشرةً عن تآكل الـ maternal capillaries للوصول للدم؟","whyWrong":[null,"الـ cytotrophoblast الطبقة الداخلية، مش بيآكل.","الـ epiblast جزء من الـ disc.","الـ extraembryonic mesoderm بيبطن الـ chorion."]},{"id":"EM2026G1-11","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G1","stem":"After fertilization, the zygote begins dividing in a process known as cleavage. 16 cell stage is?","options":["Blastocyst","Zygote","Morula","Embryoblast"],"answer":2,"explanation":"بعد الـ 8-cell stage بيحصل compaction، والـ embryo بيبقى كورة solid من 16-32 خلية شكلها زي التوتة = morula، وبتوصل الرحم حوالي 72 ساعة بعد الـ fertilization.","memoryTrick":"Morula = توتة (16).","stemAr":"بعد الـ fertilization، الـ zygote بيبدأ ينقسم في عملية اسمها cleavage. مرحلة الـ 16 خلية اسمها إيه؟","whyWrong":["الـ blastocyst بيتكون بعد الـ morula لما السوائل تدخل وتعمل blastocele.","الـ zygote خلية واحدة.",null,"الـ embryoblast (inner cell mass) جزء جوه الـ blastocyst."]},{"id":"EM2026G1-12","topic":"histo","concept":"Cell cycle & division","source":"EM2026G1","stem":"Regarding metaphase I in second meiotic division, which of the following occurs?","options":["Crossing over occurs at this stage","The d-chromosome splits at the centromere into two chromatids","The 23-bivalent d-chromosomes become aligned in the equatorial plane","The 23 d-chromosomes are aligned at the equatorial plate"],"answer":3,"explanation":"في metaphase II الـ 23 d-chromosomes (كل واحد اتنين chromatids) بيترصّوا على الـ equatorial plate. الـ bivalents والـ crossing over في meiosis I.","memoryTrick":"Meiosis II = 23 single rows (مش bivalents).","stemAr":"بخصوص الـ metaphase في الـ second meiotic division، أنهي واحدة من دول بتحصل؟","whyWrong":["الـ crossing over في الـ prophase I.","انقسام الـ centromere في الـ anaphase II.","الـ bivalents في الـ meiosis I مش II.",null]},{"id":"EM2026G1-13","topic":"embryo","concept":"Gametogenesis","source":"EM2026G1","stem":"A 30-year-old woman undergoes in vitro fertilization (IVF). Eggs are retrieved after hormonal stimulation and are found to be arrested in metaphase II. What triggers the completion of meiosis II in the oocyte?","options":["Sperm penetration","LH surge","Estrogen peak","FSH rise"],"answer":0,"explanation":"عند الـ ovulation الـ secondary oocyte بيقف في الـ metaphase II، وبيكمّل الـ meiosis II بس لما يحصل fertilization (دخول الـ sperm) في الـ uterine tube.","memoryTrick":"Sperm يدخل ➜ Meiosis II تكمل.","stemAr":"ست عندها 30 سنة بتعمل حقن مجهري (IVF). البويضات اتسحبت بعد تنشيط هرموني ولقوها واقفة في metaphase II. إيه اللي بيخلّي الـ meiosis II تكمل في الـ oocyte؟","whyWrong":[null,"الـ LH surge بيعمل الـ ovulation.","الـ estrogen بيفرزه الـ Graafian follicle في الـ proliferative phase، مش هو اللي بيكمّل الـ meiosis II.","الـ FSH بيخلي الـ follicles تنمو."]},{"id":"EM2026G1-14","topic":"embryo","concept":"Gametogenesis","source":"EM2026G1","stem":"During fertilization a sperm secretes enzymes to penetrate the oocyte's outer layer. Which structure prevents polyspermy?","options":["Zona pellucida","Cell membrane","Endometrium","Corona radiata"],"answer":0,"explanation":"بعد دخول الـ sperm الـ ovum بيعمل cortical and zonal reaction: الـ zona pellucida بتتغير فتمنع دخول sperm تاني (polyspermy).","memoryTrick":"Zona = البوابة اللي بتقفل.","stemAr":"أثناء الـ fertilization الـ sperm بيفرز إنزيمات عشان يخترق الطبقة الخارجية للـ oocyte. أنهي structure بيمنع الـ polyspermy؟","whyWrong":[null,"الـ cell membrane بتاع الـ oocyte بيندمج مع الـ sperm (phase 3)، لكن اللي بيمنع الـ polyspermy هو تغيير الـ zona.","الـ endometrium مكان الـ implantation، ملوش علاقة بالـ fertilization.","الـ corona radiata الـ sperm بيخترقها في phase 1، ومش هي اللي بتمنع الـ polyspermy."]},{"id":"EM2026G1-15","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026G1","stem":"In an embryo at day 12 post-fertilization lacunar spaces appear within syncytiotrophoblast filled with maternal blood. What is this process critical for?","options":["Neurulation process","Gastrulation process","Uteroplacental circulation","Cleavage process"],"answer":2,"explanation":"الـ lacunae المليانة maternal blood هي بداية الـ uteroplacental circulation.","memoryTrick":"Lacunae = دورة الأم.","stemAr":"في embryo عمره 12 يوم بعد الـ fertilization، ظهرت lacunar spaces جوه الـ syncytiotrophoblast مليانة دم الأم. العملية دي مهمة لإيه؟","whyWrong":["الـ neurulation مش من أحداث الأسبوع التاني.","الـ gastrulation مش من أحداث الأسبوع التاني.",null,"الـ cleavage في الأسبوع الأول."]},{"id":"EM2026G1-16","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2026G1","stem":"Which of the following describes Barr body?","options":["The Y chromosome in male","The X chromosome in males","The XX chromosomes in females","The inactive X chromosome in females"],"answer":3,"explanation":"الـ Barr body = الـ X chromosome الـ inactive (condensed) في الإناث.","memoryTrick":"Barr = X نايم 😴.","stemAr":"أنهي واحدة من دول بتوصف الـ Barr body؟","whyWrong":["الـ Y مش هو الـ Barr body.","الذكر الطبيعي عنده X واحد بس وهو active، فمفيش Barr body. (الـ Barr body بيظهر في الذكر بس لو عنده X زيادة زي الـ Klinefelter XXY).","واحد بس من الـ XX هو اللي inactive وبيكوّن الـ Barr body، والتاني active (extended).",null]},{"id":"EM2026G1-17","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026G1","stem":"Which organelle is responsible for maintenance of cell health?","options":["Lysosome","Golgi apparatus","Rough endoplasmic reticulum","Smooth endoplasmic reticulum"],"answer":0,"repeatOf":"ES2025-01","explanation":"من وظايف الـ lysosomes إنها بتحافظ على صحة الخلية عن طريق التخلص من الـ organelles القديمة (autolysosome)، وكمان بتهضم الـ nutrients والـ foreign invaders زي البكتيريا والفيروسات.","memoryTrick":"Lysosome = عامل النظافة 🧹.","stemAr":"أنهي organelle مسئول عن الحفاظ على صحة الخلية؟","whyWrong":[null,"الـ Golgi للـ packing وتعديل البروتينات.","الـ rER لتصنيع البروتين.","الـ sER للـ lipids والـ steroids والـ detoxification."]},{"id":"EM2026G1-18","topic":"histo","concept":"Cell cycle & division","source":"EM2026G1","stem":"Which of the following cells are continuously turnover cells?","options":["Heart muscles","Blood cells","Nerve cells","Liver cells"],"answer":1,"explanation":"الخلايا من حيث التجدد 3 أنواع:\n• Continuously turn over: خلايا highly specialized ومش بتنقسم (end cells) لكن بتتعوض من الـ stem cells، زي الـ blood cells والـ sperms.\n• Potentially renewable: زي الـ liver cells.\n• Non-renewing: زي الـ heart muscles والـ nerve cells.","memoryTrick":"Blood & Sperm = بيتجددوا طول الوقت من الـ stem cells 🔄","stemAr":"أنهي خلايا من دول بتتجدد باستمرار (continuously turnover)؟","whyWrong":["الـ heart muscles من الـ non-renewing cells.",null,"الـ nerve cells من الـ non-renewing cells.","الـ liver cells من الـ potentially renewable cells (transient exit)."]},{"id":"EM2026G1-19","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026G1","stem":"Which of the following describes Multivesicular bodies?","options":["Primary lysosomes","Autophagic vacuoles","Formed as a result of digestion of solid material","Formed as a result of digestion of fluid material"],"answer":3,"explanation":"الـ multivesicular body نوع من الـ secondary lysosomes: بيتكون لما الـ primary lysosome يندمج مع pinocytic vesicle (fluid material).","memoryTrick":"Multivesicular = Pinocytic (سوائل) / Heterolysosome = Phagocytic (صلب) / Autolysosome = organelles قديمة.","stemAr":"أنهي واحدة من دول بتوصف الـ multivesicular bodies؟","whyWrong":["الـ primary lysosome لسه طالع من الـ Golgi وما دخلش في أي هضم.","الـ autolysosome بيتكون من primary lysosome + autophagic vesicle فيها organelles قديمة من الخلية نفسها.","هضم المواد الصلبة (primary lysosome + phagocytic vesicle) بيكوّن heterolysosome.",null]},{"id":"EM2026G1-20","topic":"histo","concept":"Cell membrane & transport","source":"EM2026G1","stem":"What is concerned with Glycocalyx?","options":["The protein component of the cell membrane","The hydrophobic end of lipid","The hydrophilic end of lipid","The carbohydrate component of the cell membrane"],"answer":3,"explanation":"الـ cell coat (glycocalyx) هو الـ carbohydrate component للـ cell membrane: glycoproteins و glycolipids على السطح الخارجي، وفيه receptors للأدوية والهرمونات والبكتيريا والفيروسات.","memoryTrick":"Glyco = سكر.","stemAr":"إيه اللي يخص الـ glycocalyx؟","whyWrong":["الـ protein component (peripheral و integral) حوالي 50% من الغشا، وده غير الـ glycocalyx.","الـ hydrophobic tail بتاع الـ phospholipid: non-charged ومتجه لجوه بعيد عن الـ aqueous solutions.","الـ hydrophilic polar head بتاع الـ phospholipid: charged ومتجه ناحية الـ aqueous solutions.",null]},{"id":"EM2026G1-21","topic":"histo","concept":"Nucleus & chromatin","source":"EM2026G1","stem":"Which of points related to Heterochromatin?","options":["Special type of stain","Present in the nuclei of metabolically active cells","Type of cell inclusions","Present in the nuclei of metabolically inactive cells"],"answer":3,"explanation":"الـ heterochromatin هو الـ chromatin المكثّف (condensed, inactive)، بيمثل chromosomes ملفوفة فيها inactive genes، زي في الـ small lymphocytes. أما الـ euchromatin (extended, active) ففيه الـ active genes في الخلايا اللي بتصنع بروتين.","memoryTrick":"Hetero = Inactive.","stemAr":"أنهي نقطة من دول مرتبطة بالـ heterochromatin؟","whyWrong":["الـ heterochromatin نوع من الـ chromatin، مش صبغة.","الخلايا النشطة اللي بتصنع بروتين فيها euchromatin (vesicular nucleus).","الـ chromatin جزء من النواة وبيحمل الـ genetic material، مش من الـ cytoplasmic inclusions.",null]},{"id":"EM2026G1-22","topic":"histo","concept":"Cell cycle & division","source":"EM2026G1","stem":"Regarding the Gap 1 phase of interphase, which of the following describes it?","options":["Each cell contains 92 s chromosomes","The nucleus of the daughter cell contains 46s chromosomes","The more specialized the cell, the shorter the G1-phase","Each cell contains 46 d chromosome"],"answer":1,"explanation":"في الـ G1 (حوالي 8 ساعات) نواة الـ daughter cell فيها 46 single (s) chromosomes. الخلية بتكبر وبتاخد طاقة وبتصنع RNA وبروتينات لازمة للـ DNA duplication. وكل ما الخلية تكون أكتر specialized الـ G1 بتطول ومعدل الانقسام بيقل.","memoryTrick":"G1 = 46 s / G2 = 46 d.","stemAr":"بخصوص الـ Gap 1 phase في الـ interphase، أنهي واحدة من دول بتوصفها؟","whyWrong":["في الـ G1 الخلية فيها 46 s chromosomes، مش 92.",null,"بالعكس: كل ما الخلية تكون أكتر specialized الـ G1 بتطول.","الـ 46 d chromosomes بتكون بعد الـ DNA duplication في الـ S phase."]},{"id":"EM2026G1-23","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2026G1","stem":"What is the typical feature of submetacentric chromosome?","options":["The centromere is terminal","The centromere is at the center of the chromosome","The centromere is midway between the center and upper end","The centromere is very close to upper end"],"answer":2,"explanation":"الـ submetacentric: الـ centromere في المسافة بين النص والطرف.","memoryTrick":"Sub = بعيد شوية عن النص.","stemAr":"إيه الصفة المميزة للـ submetacentric chromosome؟","whyWrong":["terminal = telocentric.","center = metacentric.",null,"قريب جدًا من الطرف = acrocentric."]},{"id":"EM2026G1-24","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026G1","stem":"What is true about smooth endoplasmic reticulum?","options":["Areas of localized basophilia indicate its presence","Is rarely found in skeletal muscle cells","Is present in cells where drug detoxification is taking place","Sometimes has ribosomes attached to its membrane"],"answer":2,"explanation":"من وظايف الـ sER الـ detoxification للأدوية والهرمونات والكحول في الـ liver cells. الـ sER مفيهوش polyribosomes، وبيكون well-developed في الـ muscle cells (بيطلع Ca ions وقت الانقباض).","memoryTrick":"Smooth = Detox.","stemAr":"إيه الصح عن الـ smooth endoplasmic reticulum؟","whyWrong":["الـ localized basophilia سببها الـ rER (الـ RNA في الـ ribosomes). الـ sER لما يكتر بيدي acidophilia.","بالعكس، الـ sER well-developed في الـ muscle cells.",null,"الـ sER مفيهوش ribosomes خالص. اللي عليه ribosomes هو الـ rER."]},{"id":"EM2026G1-25","topic":"histo","concept":"Nucleus & chromatin","source":"EM2026G1","stem":"What about the nuclear pore?","options":["Allows for communication between the nuclei & cytoplasm","Is a transient structure","Is at regular intervals","Is bridged by a unit membrane"],"answer":0,"explanation":"الـ nuclear pore complexes فتحات دايرية على مسافات في المكان اللي الغشائين بيلتحموا فيه. وظيفتها نقل البروتينات للنواة وخروج الـ RNA والـ ribosomal subunits للـ cytoplasm، يعني التواصل بين النواة والـ cytoplasm.","memoryTrick":"Pore = باب.","stemAr":"إيه الصح عن الـ nuclear pore؟","whyWrong":[null,"الـ pore complexes جزء من تركيب الـ nuclear envelope، مش مذكور إنها مؤقتة.","الـ pores فعلًا موجودة على مسافات (at intervals) في الـ nuclear envelope، لكن الإجابة المعتمدة هي وظيفتها: التواصل بين النواة والـ cytoplasm.","الـ pore فتحة في المكان اللي الـ inner والـ outer membranes بيلتحموا فيه، مش مقفولة بـ unit membrane."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2026G1-26","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2026G1","stem":"What is the function of rough endoplasmic reticulum?","options":["Cytoplasmic protein necessary for the cell's own existence","Carbohydrate synthesis","Lipid synthesis","Protein that will be secreted by the cell"],"answer":3,"explanation":"الـ attached ribosomes (على الـ rER) بتصنع البروتينات اللي هتتفرز برا الخلية (زي الإنزيمات والهرمونات). أما الـ free ribosomes فبتصنع البروتينات اللي بتستعملها الخلية جوه الـ cytosol.","memoryTrick":"Rough = Secreted.","stemAr":"إيه وظيفة الـ rough endoplasmic reticulum؟","whyWrong":["البروتينات اللي بتستعملها الخلية جوه الـ cytosol بتتصنع على الـ free ribosomes.","الـ carbohydrates بتتضاف للبروتينات كتعديل (في الـ Golgi)، والـ rER مش بيصنع carbohydrates.","الـ lipids (phospholipids والـ steroids) بيصنعها الـ sER.",null]},{"id":"EM2026G1-27","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2026G1","stem":"Isochromosome occurs mostly in which type of chromosomes?","options":["Acrocentric","Metacentric","Telocentric","Submetacentric"],"answer":3,"explanation":"الـ isochromosome بيحصل لما الـ chromosome ينقسم بالعرض (transversely) عند الـ centromere بدل الطول أثناء الـ anaphase، والنوع ده بيحصل غالبًا في الـ submetacentric chromosomes.","memoryTrick":"Iso ➜ Sub (Isochromosome غالبًا في الـ Submetacentric).","stemAr":"الـ isochromosome بيحصل غالبًا في أنهي نوع من الـ chromosomes؟","whyWrong":["الـ isochromosome بيحصل غالبًا في الـ submetacentric. أما الـ acrocentric (زي 21 و 14) فبيتذكر مع الـ Robertsonian translocation.","الـ metacentric الـ centromere في النص والذراعين متساويين، ومش هو النوع اللي بيحصل فيه الـ isochromosome غالبًا.","الـ telocentric مش موجود في الإنسان أصلًا.",null],"note":"إجابة ملزمة الأسئلة كانت A) Acrocentric، والإجابة اتصححت لـ D) Submetacentric."},{"id":"EM2026P-01","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026P","stem":"To put the person in anatomical position, what is the correct position of the arm?","options":["The palm faces anterior and the arm is adducted","The palm faces anterior and the arm is abducted","The palm faces posterior and the arm is adducted","The palm faces posterior and the arm is abducted"],"answer":0,"explanation":"في الـ anatomical position الـ arms جنب الجسم (adducted) والـ palms لقدام.","memoryTrick":"الإيد جنبك والكف لقدام.","stemAr":"عشان نحط الشخص في الـ anatomical position، إيه الوضع الصح للـ arm؟","whyWrong":[null,"الـ arm adducted مش abducted.","الـ palm لقدام.","الاتنين غلط."]},{"id":"EM2026P-02","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026P","stem":"During dissection, the brain was sectioned into equal right and left parts. Which plane is used for this division?","options":["Coronal plane","Horizontal plane","Midsagittal plane","Parasagittal plane"],"answer":2,"explanation":"التقسيم لنصين يمين وشمال متساويين = midsagittal (median) plane.","memoryTrick":"Mid = النص بالظبط.","stemAr":"أثناء الـ dissection، المخ اتقطع لجزئين يمين وشمال متساويين. أنهي plane اتستخدم للتقسيم ده؟","whyWrong":["الـ coronal قدام وورا.","الـ horizontal فوق وتحت.",null,"الـ parasagittal يمين وشمال مش متساويين."]},{"id":"EM2026P-03","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2026P","stem":"In which anatomical location are the deep palmar vessels found?","options":["In the palm of the hand near the skin","In the sole of the foot near the skin","In the sole of the foot deep","In the palm of the hand away from the skin"],"answer":3,"explanation":"Deep = بعيد عن الجلد، و Palmar = palm of the hand.","memoryTrick":"Palmar = Palm / Deep = جوه.","stemAr":"الـ deep palmar vessels موجودة في أنهي مكان تشريحي؟","whyWrong":["near the skin = superficial.","sole غلط، و near the skin غلط.","sole للقدم مش اليد (palmar).",null]},{"id":"EM2026P-04","topic":"anat","concept":"Movements","source":"EM2026P","stem":"Which term describes the movement of the distal end of the limb in a circle?","options":["Adduction","Circumduction","Flexion","Rotation"],"answer":1,"explanation":"الـ circumduction = حركة الطرف البعيد في دايرة.","memoryTrick":"Circum = دايرة.","stemAr":"أنهي مصطلح بيوصف حركة الطرف البعيد للـ limb في دايرة؟","whyWrong":["الـ adduction ناحية الـ midline.",null,"الـ flexion ثني.","الـ rotation حوالين الـ axis."]},{"id":"EM2026P-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2026P","stem":"The amount of compact bone is increased in the middle of shaft of long bones because:","options":["As it contains bone marrow in its meshes","As it looks like a sponge to sustain the pressure","As it provides strength for weight bearing","To increase its length"],"answer":2,"explanation":"الـ compact bone بيدي قوة لتحمل الوزن (strength for weight bearing)، وفي الـ long bone كميته بتزيد في نص الـ shaft.","memoryTrick":"Compact = Strength.","stemAr":"كمية الـ compact bone بتزيد في نص الـ shaft بتاع الـ long bones عشان:","whyWrong":["الـ bone marrow في الـ meshes صفة الـ spongy bone.","شكل الإسفنجة صفة الـ spongy bone.",null,"الطول بيزيد من الـ growing plate."]},{"id":"EM2026P-06","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2026P","stem":"Which of the following arteries can supply the outer compact bone?","options":["Epiphyseal","Metaphyseal","Nutrient","Periosteal"],"answer":3,"explanation":"الـ periosteal arteries هي المصدر الأساسي للدم في كل أنواع العظام، وبتجي من الأوعية القريبة، وبتغذي الـ outer compact bone. والعظمة اللي يتشال منها الـ periosteum بتموت.","memoryTrick":"Periosteal = Outer.","stemAr":"أنهي artery من دول ممكن تغذي الـ outer compact bone؟","whyWrong":["الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis).","الـ nutrient artery بتغذي الجزء العميق من الـ compact bone والـ marrow والـ spongy bone.",null]},{"id":"EM2026P-07","topic":"anat","concept":"Skin","source":"EM2026P","stem":"Which of the following squeezes the sebaceous gland to extrude its secretion?","options":["Deep fascia","Arrector pili muscle","Hair follicle","Hair root"],"answer":1,"explanation":"الـ sebaceous glands بتفتح في الـ hair follicle. الـ erector (arrector) pili muscle: band من smooth muscle بيوصل الـ follicle بالجزء السطحي من الـ dermis، متغذي من autonomic fibers، وبينقبض مع البرد أو الخوف أو الغضب، فبيعصر الـ sebaceous gland.","memoryTrick":"Arrector pili = بيعصر الـ sebaceous gland.","stemAr":"أنهي واحد من دول بيعصر الـ sebaceous gland عشان يطلّع إفرازها؟","whyWrong":["الـ deep fascia مش جزء من الـ skin appendages ومش بتعصر الغدة.",null,"الـ hair follicle هو الكيس اللي الـ sebaceous gland بتفتح فيه، مش اللي بيعصرها.","الـ hair root الجزء المدفون من الشعرة في الجلد."]},{"id":"EM2026P-08","topic":"anat","concept":"Skin","source":"EM2026P","stem":"Which of the following layers contains Langer's lines?","options":["Epidermis","Dermis","Superficial fascia","Deep fascia"],"answer":1,"explanation":"الـ dermis مكوّن أغلبه من collagen fibres ماشية في bundles متوازية، والـ bundles دي ممكن تتفصل من غير ما تتقطع على خطوط اسمها Langer's lines (lines of cleavage). الـ incisions على الخطوط دي بتلم بأقل scar.","memoryTrick":"Langer = Dermis (Collagen direction).","stemAr":"أنهي طبقة من دول فيها الـ Langer's lines؟","whyWrong":["الـ epidermis طبقة من خلايا وسطحها keratin، والـ collagen في الـ dermis.",null,"الـ superficial fascia تحت الـ dermis.","الـ deep fascia أعمق."]},{"id":"EM2026P-09","topic":"embryo","concept":"Implantation & second week","source":"EM2026P","stem":"A patient shows abnormal development of the yolk sac during the second week. Which embryonic layer directly contributes to the formation of the primary yolk sac?","options":["Epiblast","Hypoblast","Cytotrophoblast","Extraembryonic mesoderm"],"answer":1,"explanation":"الـ hypoblast هو اللي بيكوّن الـ primary yolk sac (عن طريق الـ exocoelomic membrane).","memoryTrick":"Hypo ➜ Yolk.","stemAr":"مريض عنده نمو غير طبيعي للـ yolk sac في الأسبوع التاني. أنهي embryonic layer بتشارك مباشرةً في تكوين الـ primary yolk sac؟","whyWrong":["الـ epiblast بيكوّن الـ amnion.",null,"الـ cytotrophoblast من الـ trophoblast.","الـ extraembryonic mesoderm بيتكون بعد الـ primary yolk sac."]},{"id":"EM2026P-10","topic":"embryo","concept":"Implantation & second week","source":"EM2026P","stem":"Histological examination of an implanted blastocyst shows persistence of the exocoelomic (Heuser's) membrane with inadequate hypoblast proliferation. Which structure will be affected?","options":["Amniotic cavity","Yolk sac","Chorionic cavity","Connecting stalk"],"answer":1,"explanation":"قلة تكاثر الـ hypoblast هتأثر على تكوين الـ secondary yolk sac.","memoryTrick":"Hypoblast مشكلة = Yolk sac مشكلة.","stemAr":"الفحص الـ histological لـ blastocyst مزروع بيبيّن استمرار الـ exocoelomic (Heuser's) membrane مع تكاثر ضعيف للـ hypoblast. أنهي structure هيتأثر؟","whyWrong":["الـ amniotic من الـ epiblast.",null,"الـ chorionic من الـ extraembryonic mesoderm.","الـ connecting stalk من الـ extraembryonic mesoderm."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2026P-11","topic":"embryo","concept":"Implantation & second week","source":"EM2026P","stem":"Which event marks the transition from week 1 to week 2 of human development?","options":["Appearance of the primitive streak","Completion of implantation","Formation of trilaminar disc","Closure of neural tube"],"answer":1,"explanation":"في الأسبوع التاني بيكمل الـ implantation (بيبدأ حوالي اليوم 6 وبيخلص يوم 11-12)، ومعاه تمايز الـ bilaminar germ disc والـ trophoblast وتكوين الـ cavities.","memoryTrick":"Week 2 = Implantation complete.","stemAr":"أنهي حدث بيعلن الانتقال من الأسبوع الأول للأسبوع التاني في نمو الإنسان؟","whyWrong":["الـ primitive streak مش من أحداث الأسبوع الأول أو التاني.",null,"في الأسبوع التاني الـ disc لسه bilaminar (epiblast + hypoblast).","الـ neural tube مش من أحداث الأسبوع الأول أو التاني."]},{"id":"EM2026P-12","topic":"embryo","concept":"Implantation & second week","source":"EM2026P","stem":"A teratogenic insult specifically damages the extraembryonic mesoderm during the second week. Which of the following structures is most likely to be malformed?","options":["Neural tube","Chorionic cavity","Epiblast","Primitive node"],"answer":1,"explanation":"خلايا الـ extraembryonic mesoderm بيظهر بينها cavities بتلتحم وتكوّن الـ chorionic cavity، فلو الـ extraembryonic mesoderm اتأذى الـ chorionic cavity هتتأثر.","memoryTrick":"Extraembryonic mesoderm ➜ Chorionic cavity.","stemAr":"مادة مشوِّهة (teratogenic insult) أذت الـ extraembryonic mesoderm تحديدًا في الأسبوع التاني. أنهي structure من دول غالبًا هيتكون بشكل غلط؟","whyWrong":["الـ neural tube مش من الـ extraembryonic mesoderm.",null,"الـ epiblast طبقة من الـ bilaminar germ disc، مش من الـ extraembryonic mesoderm.","الـ primitive node مش من الـ extraembryonic mesoderm."]},{"id":"EM2026P-13","topic":"embryo","concept":"Female cycles & hormones","source":"EM2026P","stem":"A 28-year-old woman has regular 28-day cycles. On day 21, serum progesterone is markedly elevated. Which ovarian structure is primarily responsible for this hormone level?","options":["Primary follicle","Secondary follicle","Corpus luteum","Corpus albicans"],"answer":2,"explanation":"بعد الـ ovulation الـ Graafian follicle بيتحول لـ corpus luteum، والـ corpus luteum بيفرز progesterone في الـ luteal phase (14-28)، فيوم 21 الـ progesterone مصدره الـ corpus luteum.","memoryTrick":"Day 21 = Corpus luteum peak.","stemAr":"ست عندها 28 سنة ودورتها منتظمة كل 28 يوم. في اليوم 21 الـ serum progesterone عالي جدًا. أنهي structure في المبيض مسئول أساسًا عن المستوى ده؟","whyWrong":["الـ primary follicle (oocyte محاط بـ cuboidal cells + zona) مرحلة نمو follicle، مش مصدر الـ progesterone.","الـ follicles في الـ follicular phase مرتبطة بالـ estrogen، مش الـ progesterone.",null,"الـ corpus albicans هو آخر مرحلة للـ corpus luteum بعد ما يضمر."]},{"id":"EM2026P-14","topic":"embryo","concept":"Female cycles & hormones","source":"EM2026P","stem":"A woman undergoing infertility evaluation shows failure of the LH surge despite adequate estrogen levels. Which phase of the reproductive cycle is most directly affected?","options":["Menstrual phase","Follicular phase","Ovulation","Luteal phase"],"answer":2,"explanation":"الـ ovulation بيحصل بسبب زيادة الضغط جوه الـ Graafian follicle نتيجة الـ LH surge، فلو مفيش LH surge مفيش ovulation.","memoryTrick":"No LH surge = No ovulation.","stemAr":"ست بتعمل تقييم لعدم الخصوبة، ظهر عندها فشل في الـ LH surge رغم إن الـ estrogen كفاية. أنهي مرحلة من الـ reproductive cycle متأثرة بشكل مباشر؟","whyWrong":["الـ menstrual phase مش معتمدة على الـ LH surge.","الـ follicular phase بتعتمد على الـ FSH (نمو الـ follicles).",null,"الـ luteal phase بتيجي بعد الـ ovulation، فاللي اتأثر مباشرةً هو الـ ovulation."]},{"id":"EM2026P-15","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2026P","stem":"A genetic defect prevents cortical granule release after fertilization. Which consequence is most likely?","options":["Failure of sperm capacitation","Polyspermy","Failure of the acrosome reaction","Inability of the zygote to implant"],"answer":1,"explanation":"بعد دخول الـ sperm الـ ovum بيعمل cortical and zonal reaction: الـ cortical granules بتطلع محتواها ويتكون fertilization envelope يمنع دخول sperm تاني. فلو الـ cortical granules مخرجتش ممكن يحصل polyspermy.","memoryTrick":"Cortical = Anti-polyspermy.","stemAr":"خلل جيني بيمنع خروج الـ cortical granules بعد الـ fertilization. إيه النتيجة الأكثر احتمالًا؟","whyWrong":["الـ capacitation بتحصل للـ sperm في الـ female genital tract قبل الـ fertilization.",null,"الـ acrosomal reaction بتحصل في الـ sperm.","الـ cortical granules دورها منع الـ polyspermy، مش الـ implantation."]},{"id":"EM2026P-16","topic":"embryo","concept":"Implantation & second week","source":"EM2026P","stem":"A mutation in the embryo prevents the differentiation and formation of the syncytiotrophoblast. Which of the following stages will be directly blocked?","options":["Fertilization","Cleavage","Implantation","Pronuclear formation"],"answer":2,"explanation":"الـ syncytiotrophoblast (الطبقة الخارجية multinucleated) هو اللي بيآكل الـ endometrium لحد ما الـ blastocyst يندفن جواه، فمن غيره الـ implantation مش هيحصل.","memoryTrick":"No syncytio = No implantation.","stemAr":"طفرة في الـ embryo بتمنع تمايز وتكوين الـ syncytiotrophoblast. أنهي مرحلة من دول هتتوقف مباش
