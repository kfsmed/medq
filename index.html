عدا:","whyWrong":["صح: الـ Golgi بيدي negative image في الـ cytoplasm الـ basophilic. والسؤال عن الغلط.","صح: بيتصبغ بالـ silver.",null,"صح: الـ trans face mature والـ cis immature. الغلط C، لأنه في الـ nerve cells بيكون perinuclear (حوالين النواة) مش supranuclear."]},{"id":"ES2024-02","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2024","stem":"The basal body of a cilium has a microtubular arrangement which is identical to the pattern found in:","options":["microvilli","centrioles","spindle fibers","stereocilia."],"answer":1,"explanation":"الـ basal body زي الـ centriole بالظبط: 9 triplets microtubules (9×3) من غير central pair.","memoryTrick":"Basal body = Centriole (9×3).","stemAr":"الـ basal body بتاع الـ cilium ترتيب الـ microtubules فيه مطابق للترتيب الموجود في:","whyWrong":["الـ microvilli من الـ actin.",null,"الـ spindle fibers microtubules بس مش بترتيب 9×3.","الـ stereocilia microvilli طويلة (actin)."]},{"id":"ES2024-03","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2024","stem":"The organelle most prominent in steroid secreting cells is:","options":["RER","SER","Lysosomes","Cilia"],"answer":1,"explanation":"الـ sER هو الأوضح في خلايا الـ steroids.","memoryTrick":"Steroid = Smooth.","stemAr":"الـ organelle الأوضح (most prominent) في الخلايا اللي بتفرز steroids هو:","whyWrong":["الـ RER للبروتين.",null,"الـ lysosomes للهضم.","الـ cilia مش organelle للتصنيع."]},{"id":"ES2024-04","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2024","stem":"One of the following is a numerical aberration of sex chromosomes:","options":["Turner's syndrome","Down's syndrome","Translocation","Isochromosome"],"answer":0,"explanation":"Turner syndrome (45,X) numerical aberration في الـ sex chromosomes. Down numerical بس في autosome (21)، والـ translocation والـ isochromosome structural.","memoryTrick":"Turner = X واحد ناقص.","stemAr":"واحد من دول numerical aberration في الـ sex chromosomes:","whyWrong":[null,"الـ Down numerical بس في الـ autosomes (21) مش الـ sex chromosomes.","الـ translocation structural.","الـ isochromosome structural."]},{"id":"ES2024-05","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2024","stem":"As regards ribosomes:","options":["Their subunits are formed in the nucleolus.","Cause cytoplasmic acidophilia.","Are formed of DNA associated with proteins.","Are formed of two subunits of equal size."],"answer":0,"explanation":"الـ ribosomal subunits بتتكون في الـ nucleolus. الـ ribosomes بتعمل basophilia (مش acidophilia)، ومكونة من rRNA (مش DNA)، والـ subunits مختلفين في الحجم (large & small).","memoryTrick":"Ribosome subunits ⬅ Nucleolus.","stemAr":"بخصوص الـ ribosomes:","whyWrong":[null,"الـ ribosomes بتدي basophilia (بسبب الـ RNA) مش acidophilia.","مكونة من rRNA وبروتين مش DNA.","الـ subunits مختلفين في الحجم (large و small)."]},{"id":"ES2024-06","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2024","stem":"Duplication of DNA occurs in:","options":["G1 phase","G2 phase","S phase","Mitosis"],"answer":2,"explanation":"الـ DNA duplication في الـ S phase.","memoryTrick":"S = Synthesis.","stemAr":"تضاعف الـ DNA بيحصل في:","whyWrong":["الـ G1 قبل الـ replication.","الـ G2 بعدها.",null,"في الـ mitosis الـ DNA بيتوزع مش بيتضاعف."]},{"id":"ES2024-07","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2024","stem":"One of the following is an endogenous pigment:","options":["Lead","Carotene","Tattoo","Hemoglobin"],"answer":3,"explanation":"الـ hemoglobin endogenous pigment.","memoryTrick":"Hemoglobin = من جوه.","stemAr":"واحد من دول endogenous pigment:","whyWrong":["الـ lead exogenous.","الـ carotene exogenous من الأكل.","الـ tattoo exogenous.",null]},{"id":"ES2024-08","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2024","stem":"Which of the following statements is incorrect?","options":["Heterochromatin, as seen in EM, is lighter staining DNA.","The nucleolus is the region within the nucleus where rRNA is formed.","The function of SER includes lipid synthesis.","RER and SER can be continuous"],"answer":0,"explanation":"الغلط A: الـ heterochromatin في الـ EM بيظهر dark (electron-dense) لأنه مكثّف، مش lighter. الـ euchromatin هو الفاتح.","memoryTrick":"Hetero = Dark / Eu = Light.","stemAr":"أنهي جملة من دول غلط؟","whyWrong":[null,"جملة صح: الـ nucleolus مكان تصنيع الـ rRNA.","صح: الـ SER بيصنع lipids.","صح: الـ RER والـ SER ممكن يكونوا متصلين. الغلط A، لأن الـ heterochromatin في الـ EM بيبان غامق (electron-dense) مش فاتح."]},{"id":"ES2024-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2024","stem":"Enzymes associated with drug detoxification are associated with:","options":["SER","RER","Golgi","Mitochondria"],"answer":0,"explanation":"إنزيمات الـ drug detoxification (زي cytochrome P450) موجودة على الـ sER.","memoryTrick":"Detox = Smooth.","stemAr":"الإنزيمات المرتبطة بالـ drug detoxification مرتبطة بـ:","whyWrong":[null,"الـ RER للبروتين.","الـ Golgi للتغليف.","الـ mitochondria للطاقة."]},{"id":"ES2024-10","topic":"anat","concept":"Scalp & face","source":"ES2024","stem":"A 13 years old male patient came to the hospital with bleeding in the scalp region on examination the wound was without gapping, this wound may be in which of the following layers of scalp?","options":["first and second","third","fourth","Fifth"],"answer":0,"explanation":"الجرح اللي مش بيفتح (non-gaping) بيكون في الطبقة الأولى والتانية (skin و dense connective tissue). لو اتقطعت الـ epicranial aponeurosis (التالتة) بالعرض الجرح بيفتح (gaping) بسبب شد الـ occipitofrontalis.","memoryTrick":"Gaping = اتقطعت الـ Aponeurosis (A).","stemAr":"ولد عنده 13 سنة جه المستشفى بنزيف في منطقة الـ scalp، وبالكشف الجرح مكانش مفتوح (without gaping). الجرح ده ممكن يكون في أنهي طبقة من طبقات الـ scalp؟","whyWrong":[null,"الطبقة التالتة (aponeurosis) لو اتقطعت بالعرض الجرح بيفتح (gaping).","الطبقة الرابعة (loose areolar) هي الـ dangerous، وجرحها بيفتح.","الطبقة الخامسة (pericranium) جرح عميق للعظم. الجرح من غير gaping في الطبقات السطحية (الجلد والـ connective tissue) لأنها لازقة في الـ aponeurosis."]},{"id":"ES2024-11","topic":"embryo","concept":"Gametogenesis","source":"ES2024","stem":"The secondary oocyte undergoes completion of the second meiotic division:","options":["Before ovulation","At fertilization","Prenatal","At puberty"],"answer":1,"explanation":"الـ secondary oocyte بيكمل الـ second meiotic division بس وقت الـ fertilization (لما الـ sperm يدخل).","memoryTrick":"Meiosis II = Fertilization.","stemAr":"الـ secondary oocyte بيكمّل الـ second meiotic division:","whyWrong":["قبل الـ ovulation بيكمّل الـ meiosis I، مش II.",null,"قبل الولادة الـ oocyte بيقف في prophase I.","عند البلوغ بيكمّل الـ meiosis I للـ follicle اللي بينضج."]},{"id":"ES2024-12","topic":"embryo","concept":"Implantation & second week","source":"ES2024","stem":"The embryonic epiblast gives rise to the following:","options":["Ectoderm","Mesoderm","Endoderm","All of the above"],"answer":3,"explanation":"الـ epiblast بيدي الـ 3 germ layers كلهم أثناء الـ gastrulation.","memoryTrick":"Epiblast = 3 layers.","stemAr":"الـ embryonic epiblast بيدي:","whyWrong":["صح بس ناقص.","صح بس ناقص.","صح بس ناقص. الـ epiblast بيدي التلات طبقات بالـ gastrulation.",null]},{"id":"ES2024-13","topic":"embryo","concept":"Fetal membranes & placenta","source":"ES2024","stem":"The wall of the chorionic sac is composed of:","options":["cytotrophoblast and syncytiotrophoblast","two layers of trophoblast lined by extraembryonic somatic mesoderm","trophoblast and exocoelomic membrane","extraembryonic splanchnic mesoderm and both layers of trophoblast"],"answer":1,"repeatOf":"EM2019A-11","explanation":"الـ chorion = طبقتين الـ trophoblast (cyto + syncytio) ومبطنين من جوه بالـ extraembryonic somatic mesoderm.","memoryTrick":"Chorion = Trophoblast + Somatic mesoderm (زي ما الـ amnion + somatic كمان).","stemAr":"جدار الـ chorionic sac مكوّن من:","whyWrong":["الـ cytotrophoblast والـ syncytiotrophoblast ناقصهم طبقة الـ extraembryonic somatic mesoderm.",null,"الـ exocoelomic membrane بتبطن الـ primary yolk sac مش الـ chorion.","الـ splanchnic mesoderm بيبطن الـ yolk sac مش الـ chorion. الـ chorion بيتبطن بالـ somatic."]},{"id":"ES2024-14","topic":"embryo","concept":"Female cycles & hormones","source":"ES2024","stem":"At the time of ovulation the endometrium is in the:","options":["Menstrual phase","Early proliferative phase","Late proliferative phase","Late secretory phase"],"answer":2,"explanation":"وقت الـ ovulation (يوم 14) الـ endometrium بيكون في آخر الـ proliferative phase.","memoryTrick":"Ovulation = نهاية الـ proliferative.","stemAr":"وقت الـ ovulation الـ endometrium بيكون في:","whyWrong":["الـ menstrual في أول الدورة (يوم 1–5).","الـ early proliferative بدري عن الـ ovulation.",null,"الـ late secretory في آخر الدورة."]},{"id":"EM2025A-01","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025A","stem":"Which of the following best describes the anatomical position of the lower limbs and toes?","options":["Knees flexed, the toes turned inward","Legs abducted, feet rotated outward","Legs extended and parallel, feet flat with toes directed forward","Knees flexed, feet together with toes pointing sideways"],"answer":2,"explanation":"في الـ anatomical position الرجلين ممدودين ومتوازيين، والقدم flat والأصابع لقدام.","memoryTrick":"واقف مستقيم وكل حاجة لقدام.","stemAr":"أنهي واحدة من دول أحسن وصف لوضع الـ lower limbs والأصابع في الـ anatomical position؟","whyWrong":["الركب مش مثنية في الـ anatomical position.","الرجلين مش abducted.",null,"الركب مش مثنية والصوابع لقدام."]},{"id":"EM2025A-02","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025A","stem":"Which plane divides the body into anterior and posterior parts?","options":["Midsagittal plane","Parasagittal plane","Coronal plane.","Horizontal plane"],"answer":2,"explanation":"الـ coronal plane = anterior و posterior.","memoryTrick":"Coronal = قدام/ورا.","stemAr":"أنهي plane بيقسم الجسم لجزء anterior وجزء posterior؟","whyWrong":["الـ midsagittal يمين وشمال.","الـ parasagittal يمين وشمال مش متساويين.",null,"الـ horizontal فوق وتحت."]},{"id":"EM2025A-03","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025A","stem":"What is the meaning of superficial dissection of the dorsal aspect of the neck?","options":["Dissection of the skin and front of the neck","Dissection of the skin and back of the neck","Dissection of the muscles and vessels of the back of the neck","Dissection of the muscles and vessels of the front of the neck"],"answer":1,"explanation":"الـ superficial = قريب من السطح (skin)، والـ dorsal = الخلف. يعني dissection للـ skin في back of the neck.","memoryTrick":"Superficial = Skin / Dorsal = Back.","stemAr":"يعني إيه superficial dissection للـ dorsal aspect بتاع الرقبة؟","whyWrong":["الـ front = ventral مش dorsal.",null,"الـ muscles والـ vessels أعمق، فده مش superficial.","الـ front والعمق الاتنين غلط."]},{"id":"EM2025A-04","topic":"anat","concept":"Movements","source":"EM2025A","stem":"Moving the distal segment away from the proximal segment is called which of the following?","options":["Adduction","Abduction","Flexion","Extension"],"answer":3,"explanation":"الـ extension هو فرد المفصل، فالجزء البعيد (distal segment) بيبعد عن الجزء القريب (proximal segment) والزاوية بينهم بتكبر. الـ flexion العكس: الجزئين بيقربوا من بعض.","memoryTrick":"Extension = فرد ➜ البعيد يبعد / Flexion = ثني ➜ يقرب.","stemAr":"تحريك الجزء البعيد (distal segment) بعيد عن الجزء القريب (proximal segment) اسمه إيه؟","whyWrong":["الـ adduction حركة ناحية الـ midline.","الـ abduction بعيد عن الـ midline، مش بين جزئين من الطرف. وده اللبس الشائع.","الـ flexion بيقرّب الجزئين من بعض.",null]},{"id":"EM2025A-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2025A","stem":"Which of the following is the character of the compact bone?","options":["Contains large spaces filled with bone marrow","Composed of loosely arranged trabeculae","Dense and organized into a number of cylindrical units","Found only in the epiphysis of long bones"],"answer":2,"explanation":"الـ compact bone كثيف ومنظم في cylindrical units اسمها Haversian systems (osteons).","memoryTrick":"Compact = Haversian (Osteons).","stemAr":"أنهي واحدة من دول صفة الـ compact bone؟","whyWrong":["المسافات الكبيرة المليانة marrow صفة الـ spongy.","الـ trabeculae صفة الـ spongy.",null,"الـ compact موجود في كل العظام، وأكتر حاجة في الـ shaft."]},{"id":"EM2025A-06","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2025A","stem":"Which of the following arteries can supply the bone marrow?","options":["Periosteal","Epiphyseal","Metaphyseal","Nutrient"],"answer":3,"explanation":"الـ nutrient artery بتغذي الـ bone marrow.","memoryTrick":"Nutrient = Marrow.","stemAr":"أنهي artery من دول ممكن تغذي الـ bone marrow؟","whyWrong":["الـ periosteal للـ outer compact.","الـ epiphyseal للأطراف.","الـ metaphyseal للـ metaphysis.",null]},{"id":"EM2025A-07","topic":"anat","concept":"Skeleton & types of bones","source":"EM2025A","stem":"Which of the following is considered a short bone?","options":["Carpal bone","Phalanges","Patella","Clavicle"],"answer":0,"explanation":"الـ carpal bones short bones. الـ phalanges long، والـ patella sesamoid، والـ clavicle long (modified).","memoryTrick":"Carpal = Short.","stemAr":"أنهي واحدة من دول تعتبر short bone؟","whyWrong":[null,"الـ phalanges long.","الـ patella sesamoid.","الـ clavicle long (رغم إنها مختلفة)."]},{"id":"EM2025A-08","topic":"embryo","concept":"Female cycles & hormones","source":"EM2025A","stem":"If Sara's cycle is 38 days, on which day is she most likely to ovulate?","options":["Day 14","Day 24","Day 28","Day 35"],"answer":1,"explanation":"الـ ovulation بتحصل 14 يوم قبل الدورة الجاية (الـ luteal phase ثابتة 14 يوم)، فـ 38 − 14 = يوم 24.","memoryTrick":"Ovulation = طول الدورة − 14.","stemAr":"لو الدورة عند سارة 38 يوم، غالبًا هيحصلها ovulation في يوم كام؟","whyWrong":["يوم 14 للدورة الـ 28 يوم بس. الـ ovulation بيحصل قبل نهاية الدورة بـ 14 يوم.",null,"28 مش صح، 38−14 = 24.","35 مش صح."]},{"id":"EM2025A-09","topic":"embryo","concept":"Female cycles & hormones","source":"EM2025A","stem":"Which hormone surges right before ovulation, triggering the release of an egg?","options":["Progesterone","Estrogen","Luteinizing hormone (LH)","Follicle-stimulating hormone (FSH)"],"answer":2,"explanation":"الـ LH surge هو اللي بيعمل الـ ovulation (بعده بحوالي 24–36 ساعة).","memoryTrick":"LH = Let Hatch (اطلق البويضة).","stemAr":"أنهي hormone بيعمل surge (ارتفاع مفاجئ) قبل الـ ovulation مباشرةً فيخلّي البويضة تنزل؟","whyWrong":["الـ progesterone بيعلى بعد الـ ovulation.","الـ estrogen بيعلى قبلها وهو اللي بيحفّز الـ LH surge، بس مش هو الـ surge نفسه.",null,"الـ FSH بيعلى شوية مع الـ LH، بس الـ trigger الأساسي هو الـ LH."]},{"id":"EM2025A-10","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"If Sarah doesn't conceive, what event marks the end of the luteal phase?","options":["Ovulation","Menstruation","LH surge","Implantation"],"answer":1,"explanation":"لو مفيش حمل الـ corpus luteum بيضمر، الـ progesterone ينزل، فتحصل الـ menstruation ودي نهاية الـ luteal phase.","memoryTrick":"مفيش حمل = Menstruation.","stemAr":"لو سارة محملتش، إيه الحدث اللي بيعلن نهاية الـ luteal phase؟","whyWrong":["الـ ovulation بداية الـ luteal phase مش نهايتها.",null,"الـ LH surge قبل الـ ovulation.","الـ implantation يعني حمل، والسؤال إنها ما حملتش."]},{"id":"EM2025A-11","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"Which hormone is released after implantation and is used to confirm pregnancy?","options":["LH (Luteinizing hormone)","FSH (Follicle-stimulating hormone)","HCG (Human chorionic Gonadotropin)","Estrogen"],"answer":2,"explanation":"الـ hCG بيتفرز من الـ syncytiotrophoblast بعد الـ implantation وهو اللي بيتقاس في pregnancy test.","memoryTrick":"Pregnancy = hCG.","stemAr":"أنهي hormone بيتفرز بعد الـ implantation وبيستخدم لتأكيد الحمل؟","whyWrong":["الـ LH بيعلى كل شهر.","الـ FSH بيعلى كل شهر.",null,"الـ estrogen موجود من غير حمل."]},{"id":"EM2025A-12","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2025A","stem":"At what stage does the fertilized egg typically implant in the uterus?","options":["Zygote","Morula","Blastocyst","Embryo"],"answer":2,"explanation":"الـ implantation بتحصل في مرحلة الـ blastocyst.","memoryTrick":"Blastocyst = يزرع.","stemAr":"البويضة الملقّحة بتزرع في الرحم عادةً في أنهي مرحلة؟","whyWrong":["الـ zygote لسه في الـ tube بعد الـ fertilization على طول.","الـ morula بتوصل الرحم بس لسه محاطة بالـ zona ومبتزرعش.",null,"مصطلح embryo بيطلق بعد الـ implantation."]},{"id":"EM2025A-13","topic":"embryo","concept":"Gametogenesis","source":"EM2025A","stem":"Which term describes complete absence of sperm in semen analysis?","options":["Azoospermia","Oligospermia","Teratozoospermia","Asthenozoospermia"],"answer":0,"explanation":"الـ azoospermia = غياب الـ sperm تمامًا. Oligo = عدد قليل، Terato = شكل غلط، Astheno = حركة ضعيفة.","memoryTrick":"A-zoo = مفيش حيوانات خالص.","stemAr":"أنهي مصطلح بيوصف الغياب التام للـ sperm في تحليل السائل المنوي؟","whyWrong":[null,"الـ oligospermia = عدد قليل.","الـ teratozoospermia = شكل غير طبيعي.","الـ asthenozoospermia = حركة ضعيفة."]},{"id":"EM2025A-14","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"What major event typically occurs at the start of the second week of development?","options":["Gastrulation","Fertilization","Implantation of the blastocyst","Formation of the neural tube"],"answer":2,"explanation":"بداية الأسبوع التاني بيكمل فيها الـ implantation (الـ blastocyst بيندفن في الـ endometrium).","memoryTrick":"Week 2 = Implantation + Two layers.","stemAr":"إيه الحدث الكبير اللي بيحصل عادةً في بداية الأسبوع التاني من النمو؟","whyWrong":["الـ gastrulation في الأسبوع التالت.","الـ fertilization في الأسبوع الأول.",null,"الـ neural tube في الأسبوع التالت والرابع."]},{"id":"EM2025A-15","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"What cavity begins to develop during the end of the second week?","options":["Chorionic cavity","Amniotic cavity","Yolk sac.","Blastocoele"],"answer":0,"explanation":"الـ chorionic cavity (extraembryonic coelom) بتتكون آخر الأسبوع التاني من اندماج spaces في الـ extraembryonic mesoderm.","memoryTrick":"آخر Week 2 = Chorionic cavity.","stemAr":"أنهي cavity بتبدأ تتكون في آخر الأسبوع التاني؟","whyWrong":[null,"الـ amniotic cavity بتبدأ بدري في الأسبوع التاني (يوم 8)، مش آخره.","الـ yolk sac بيتكون بدري في الأسبوع التاني.","الـ blastocoele في الأسبوع الأول."]},{"id":"EM2025A-16","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"Which part of the blastocyst directly interacts with the endometrial lining during implantation?","options":["Inner cell mass (Embryoblast)","Syncytiotrophoblast","Amniotic cavity","Cytotrophoblast"],"answer":1,"explanation":"الـ syncytiotrophoblast هو اللي بيلمس ويغزو الـ endometrium وقت الـ implantation.","memoryTrick":"Syncytio = الهجوم 🗡️.","stemAr":"أنهي جزء من الـ blastocyst بيتعامل مباشرةً مع بطانة الـ endometrium أثناء الـ implantation؟","whyWrong":["الـ inner cell mass جوه ومش بيلمس الـ endometrium.",null,"الـ amniotic cavity جوه الجنين.","الـ cytotrophoblast الطبقة الداخلية، وبره منه الـ syncytio هو اللي بيلمس ويغزو."]},{"id":"EM2025A-17","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"What hormone prepares the endometrium for implantation?","options":["Estrogen","Follicle-stimulating hormone (FSH)","Progesterone","Luteinizing hormone (LH)"],"answer":2,"explanation":"الـ progesterone (من الـ corpus luteum) بيجهّز الـ endometrium (secretory phase) للـ implantation.","memoryTrick":"Pro-gestation = يجهز للحمل.","stemAr":"أنهي hormone بيجهّز الـ endometrium للـ implantation؟","whyWrong":["الـ estrogen بيعمل proliferation، بس اللي بيجهز الـ endometrium (secretory) للـ implantation هو الـ progesterone.","الـ FSH بيأثر على المبيض مش الـ endometrium.",null,"الـ LH بيعمل ovulation."]},{"id":"EM2025A-18","topic":"embryo","concept":"Implantation & second week","source":"EM2025A","stem":"Which layer of the bilaminar disc contributes to the formation of the primitive yolk sac?","options":["Hypoblast","Epiblast","Cytotrophoblast.","Syncytiotrophoblast"],"answer":0,"explanation":"خلايا الـ hypoblast بتكوّن الـ exocoelomic membrane اللي بتعمل الـ primitive (primary) yolk sac.","memoryTrick":"Hypo = Yolk (تحت) / Epi = Amnion (فوق).","stemAr":"أنهي طبقة من الـ bilaminar disc بتشارك في تكوين الـ primitive yolk sac؟","whyWrong":[null,"الـ epiblast بيكوّن الـ amnion.","الـ cytotrophoblast مش جزء من الـ disc.","الـ syncytiotrophoblast مش جزء من الـ disc."]},{"id":"EM2025A-19","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025A","stem":"Which cells form the inner layer of the chorion?","options":["Epiblast cells","Syncytiotrophoblast","Hypoblast cells","Primary mesoderm"],"answer":3,"explanation":"الطبقة الداخلية للـ chorion هي الـ extraembryonic (somatic) mesoderm = primary mesoderm.","memoryTrick":"Chorion = Trophoblast + Mesoderm من جوه.","stemAr":"أنهي خلايا بتكوّن الطبقة الداخلية للـ chorion؟","whyWrong":["الـ epiblast بيكوّن الـ amnion والجنين.","الـ syncytio الطبقة الخارجية للـ chorion.","الـ hypoblast بيكوّن الـ yolk sac.",null]},{"id":"EM2025A-20","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025A","stem":"During which week of development does the chorionic cavity form?","options":["First week","Second week","Third week","Fourth week"],"answer":1,"explanation":"الـ chorionic cavity بتتكون في الأسبوع التاني.","memoryTrick":"Week 2.","stemAr":"الـ chorionic cavity بتتكون في أنهي أسبوع من النمو؟","whyWrong":["الأسبوع الأول فيه الـ blastocyst بس.",null,"الأسبوع التالت فيه الـ gastrulation، والـ chorionic cavity كانت موجودة قبلها.","متأخر."]},{"id":"EM2025A-21","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025A","stem":"Which structure is responsible for the establishment of uteroplacental circulation?","options":["Blastocyst","Amnion","Yolk sac","Syncytiotrophoblast"],"answer":3,"explanation":"الـ lacunae في الـ syncytiotrophoblast بتفتح على الـ maternal sinusoids فيبدأ الـ uteroplacental circulation (حوالي يوم 11–12).","memoryTrick":"Syncytio + Lacunae = دورة الأم والجنين.","stemAr":"أنهي structure مسئول عن إنشاء الـ uteroplacental circulation؟","whyWrong":["الـ blastocyst مرحلة كاملة مش structure محدد.","الـ amnion بيحيط بالجنين.","الـ yolk sac للتغذية الأولية وتكوين الدم بعدين.",null]},{"id":"EM2025A-22","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following is true as regard Ribosomes?","options":["Appears basophilic when stained with H & E.","Stains red when stained with silver.","It is found supranuclear in nerve cells.","Appears as unstained area in deeply basophilic cytoplasm."],"answer":0,"explanation":"الـ ribosomes غنية بالـ rRNA (acidic) فبتاخد الـ hematoxylin وتظهر basophilic في H&E. الـ silver stain و الـ negative image و الـ supranuclear صفات الـ Golgi.","memoryTrick":"Ribosome = RNA = أزرق (basophilic).","stemAr":"أنهي واحدة من دول صح بخصوص الـ ribosomes؟","whyWrong":[null,"الـ silver بيصبغ الـ Golgi (brown/black)، والـ ribosomes مش بتتصبغ أحمر بيه.","الـ supranuclear صفة الـ Golgi في بعض الخلايا.","الـ unstained area صفة الـ Golgi (negative image)."]},{"id":"EM2025A-23","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following is absent from matrix of mitochondria?","options":["Circular DNA & RNA.","Ca²⁺ acting as catalysts condensed within dense granules.","Oxidative enzymes of Krebs cycle.","Hydrolytic digestive enzymes."],"answer":3,"explanation":"الـ matrix of mitochondria فيها circular DNA و RNA و Krebs cycle enzymes و dense granules فيها Ca²⁺. الـ hydrolytic digestive enzymes مكانها الـ lysosomes.","memoryTrick":"Hydrolytic = Lysosome مش Mitochondria.","stemAr":"أنهي واحد من دول مش موجود في الـ matrix بتاع الـ mitochondria؟","whyWrong":["الـ mitochondria فيها circular DNA و RNA فعلًا.","فيها granules فيها Ca²⁺.","فيها إنزيمات الـ Krebs. الـ hydrolytic enzymes مكانها الـ lysosomes.",null]},{"id":"EM2025A-24","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following is truly matching as regard each organelle?","options":["Inner mitochondrial membrane → Cristae.","Multivesicular bodies → Engulfed solid foreign bodies.","Protein synthesis → SER.","Euchromatin → Nucleolus associated."],"answer":0,"explanation":"الصح A: الـ cristae هي ثنيات الـ inner mitochondrial membrane. الـ multivesicular bodies للسوائل، والبروتين على الـ rER، والـ nucleolus-associated chromatin غالبًا heterochromatin.","memoryTrick":"Cristae = Inner membrane.","stemAr":"أنهي واحدة من دول التوصيل فيها صح لكل organelle؟","whyWrong":[null,"الـ multivesicular body لهضم السوائل (pinocytic vesicles) مش الأجسام الصلبة.","تصنيع البروتين في الـ RER.","الـ nucleolus-associated chromatin heterochromatin."]},{"id":"EM2025A-25","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following is mis-matching as regard each organelle?","options":["Attached ribosomes → Synthesis of cytosol proteins.","Primary lysosomes → Originate from trans-face of Golgi apparatus.","Initial protein modifications → RER.","Transfer vesicles → Transport proteins from RER to cis-face."],"answer":0,"explanation":"الغلط A: الـ attached ribosomes (على الـ rER) بتصنع بروتين للإفراز، أما بروتين الـ cytosol فبيتصنع على الـ free ribosomes.","memoryTrick":"Attached = Export / Free = Home use.","stemAr":"أنهي واحدة من دول التوصيل فيها غلط لكل organelle؟","whyWrong":[null,"مطابقة صح: الـ primary lysosomes من الـ trans face.","صح: أول تعديلات البروتين في الـ RER.","صح: الـ transfer vesicles من الـ RER للـ cis face. الغلط A، لأن الـ attached ribosomes بتصنع proteins للإفراز مش للـ cytosol."]},{"id":"EM2025A-26","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2025A","stem":"What is the special stain of Golgi apparatus?","options":["Silver","Best's Carmine","Sudan III","Iron HX"],"answer":0,"explanation":"الـ Golgi بيتصبغ بالـ silver (أو osmium) impregnation فيظهر brown/black network.","memoryTrick":"Golgi = Silver 🥈.","stemAr":"إيه الـ special stain بتاع الـ Golgi apparatus؟","whyWrong":[null,"الـ Best's carmine للـ glycogen.","الـ Sudan III للـ fat.","الـ iron hematoxylin للـ centrioles."]},{"id":"EM2025A-27","topic":"histo","concept":"Nucleus & chromatin","source":"EM2025A","stem":"Which of the following best describes peripheral chromatin?","options":["Connected to inner border of nuclear envelope","Connected to nucleoli","Clumped and scattered in the nuclear sap","Fine granules and scattered in the nuclear sap"],"answer":0,"explanation":"الـ peripheral chromatin هو الـ heterochromatin اللي لازق في الـ inner surface of the nuclear envelope.","memoryTrick":"Peripheral = على الحافة (لازق في الغشا).","stemAr":"أنهي واحدة من دول أحسن وصف للـ peripheral chromatin؟","whyWrong":[null,"اللي حوالين الـ nucleolus اسمه nucleolus-associated chromatin.","ده الـ chromatin islands (scattered).","ده وصف الـ euchromatin."]},{"id":"EM2025A-28","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025A","stem":"Which of the following statements describes active cells?","options":["Dark nucleus","Heterochromatic nucleus","Euchromatic nucleus","Few mitochondria"],"answer":2,"explanation":"الخلية النشطة نواتها euchromatic (فاتحة، الـ DNA مفرود وبيتعمله transcription) ومليانة mitochondria.","memoryTrick":"Active = Euchromatic (Eu = Good working).","stemAr":"أنهي جملة من دول بتوصف الخلايا النشطة (active cells)؟","whyWrong":["النواة الغامقة علامة خلية خاملة.","الـ heterochromatic = خاملة.",null,"الخلايا النشطة فيها mitochondria كتير."]},{"id":"EM2025A-29","topic":"histo","concept":"Nucleus & chromatin","source":"EM2025A","stem":"What about heterochromatin?","options":["Makes the nucleus pale by LM.","Appears as coarse granules in the nucleus.","Contains active genes.","Represents extended parts of chromatin."],"answer":1,"explanation":"الـ heterochromatin بيظهر coarse dark granules، وهو condensed وغير نشط، وبيخلي النواة غامقة.","memoryTrick":"Hetero = Coarse & Dark.","stemAr":"إيه الصح عن الـ heterochromatin؟","whyWrong":["الـ heterochromatin بيخلي النواة غامقة.",null,"الـ active genes في الـ euchromatin.","الـ extended هو الـ euchromatin."]},{"id":"EM2025A-30","topic":"histo","concept":"Cell membrane & transport","source":"EM2025A","stem":"Pinocytosis is the process by which the cell membrane can engulf which of the following?","options":["Fluid droplets.","Solid particles","Bacteria","Foreign bodies"],"answer":0,"explanation":"الـ pinocytosis = ابتلاع fluid droplets.","memoryTrick":"Pino = سوائل.","stemAr":"الـ pinocytosis هي العملية اللي الـ cell membrane بتبلع بيها أنهي واحد من دول؟","whyWrong":[null,"الـ solid particles = phagocytosis.","الـ bacteria = phagocytosis.","الـ foreign bodies = phagocytosis."]},{"id":"EM2025A-31","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2025A","stem":"Which one is regarded as an exogenous pigment?","options":["Haemoglobin","Melanin","Carotene","Lipofuscin"],"answer":2,"explanation":"الـ carotene exogenous pigment (من الأكل زي الجزر). الـ hemoglobin والـ melanin والـ lipofuscin endogenous.","memoryTrick":"Carotene = Carrot 🥕 (من بره).","stemAr":"أنهي واحد يعتبر exogenous pigment؟","whyWrong":["الـ hemoglobin endogenous.","الـ melanin endogenous.",null,"الـ lipofuscin endogenous (wear and tear)."]},{"id":"ES2025A-01","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025A","stem":"Which organelle is responsible for cell digestion?","options":["rER","Golgi apparatus","sER","Lysosome"],"answer":3,"explanation":"الـ lysosome مسئول عن الـ intracellular digestion.","memoryTrick":"Lysosome = معدة الخلية.","stemAr":"أنهي organelle مسئول عن الهضم داخل الخلية؟","whyWrong":["الـ rER للبروتين.","الـ Golgi للتغليف.","الـ sER للـ lipids.",null]},{"id":"ES2025A-02","topic":"histo","concept":"Cell membrane & transport","source":"ES2025A","stem":"What is the term for the process by which the cells transport solids?","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":3,"explanation":"الـ phagocytosis = ابتلاع solids.","memoryTrick":"Phago = أكل.","stemAr":"إيه اسم العملية اللي الخلايا بتنقل بيها المواد الصلبة (solids)؟","whyWrong":["الـ endocytosis عام.","الـ exocytosis إخراج.","الـ pinocytosis للسوائل.",null]},{"id":"ES2025A-03","topic":"histo","concept":"Cell membrane & transport","source":"ES2025A","stem":"Which of the following best describes the phospholipid molecules of cell membrane?","options":["The head is non-charged and hydrophobic","The head is directed inwards away from the aqueous solutions","The fatty acid tail is charged and hydrophilic","The head is directed towards the aqueous solutions"],"answer":3,"explanation":"الـ phospholipid: head (phosphate) charged و hydrophilic وبيبص ناحية الـ aqueous solutions (بره وجوه)، والـ tails hydrophobic في نص الغشا.","memoryTrick":"Head يحب المية / Tail يكرهها.","stemAr":"أنهي واحدة من دول أحسن وصف لجزيئات الـ phospholipid في الـ cell membrane؟","whyWrong":["الراس charged و hydrophilic.","الراس بيبص ناحية المية مش بعيد عنها.","الديل non-charged و hydrophobic.",null]},{"id":"ES2025A-04","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025A","stem":"Regarding rER, which of the following describes it?","options":["Form proteins secreted by the cells","Form proteins used within the cytosol","Linked together by tRNA forming polysomes.","Bind to the outer surface of SER"],"answer":0,"explanation":"الـ rER بيصنع البروتينات اللي هتتفرز برا الخلية.","memoryTrick":"Rough = Secreted.","stemAr":"بخصوص الـ rER، أنهي واحدة من دول بتوصفه؟","whyWrong":[null,"بروتينات الـ cytosol بتتصنع على الـ free ribosomes.","الـ polysomes بيربطها الـ mRNA مش الـ tRNA.","الـ ribosomes بتلزق في الـ rER مش الـ SER (لو لزقت يبقى rER)."]},{"id":"ES2025A-05","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025A","stem":"Which feature of the followings describes centrioles?","options":["They are a membranous organelle","Can be demonstrated with silver stain","Formed of nine triplets of microtubules","Have the same number of microtubules as the shaft of cilia"],"answer":2,"explanation":"الـ centriole اسطوانة جدارها 9 triplets من الـ microtubules (27 microtubule)، وهو non-membranous. الـ cilia shaft فيه 9×2+2 = 20.","memoryTrick":"Centriole = 9×3.","stemAr":"أنهي صفة من دول بتوصف الـ centrioles؟","whyWrong":["الـ centrioles non-membranous.","الـ centrioles بتتبيّن بالـ iron hematoxylin. الـ silver للـ Golgi.",null,"الـ centriole 27 microtubule (9×3)، والـ cilium shaft فيه 20 (9×2+2)."]},{"id":"ES2025A-06","topic":"histo","concept":"Nucleus & chromatin","source":"ES2025A","stem":"What is the typical feature of condensed chromatin?","options":["Appears dark acidophilic by LM","Appears as fine granules by EM","Contains the inactive genes","Appears pale basophilic by LM"],"answer":2,"explanation":"الـ condensed chromatin (heterochromatin) فيه الـ inactive genes وبيظهر dark basophilic ومن coarse granules.","memoryTrick":"Condensed = Inactive.","stemAr":"إيه الصفة المميزة للـ condensed chromatin؟","whyWrong":["الـ condensed chromatin basophilic مش acidophilic.","الـ fine granules صفة الـ euchromatin.",null,"الـ pale صفة الـ euchromatin."]},{"id":"ES2025A-07","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025A","stem":"The cilia can be characterized by which of the followings?","options":["The basal body is formed of nine microtubules","The rootlet contains twenty-seven microtubules","move secretions over the tissue surface in one directions","Can be found in the male genital system"],"answer":2,"explanation":"الـ cilia بتتحرك بشكل منتظم فتحرّك الإفرازات على السطح في اتجاه واحد (زي الـ respiratory tract). الـ basal body 27 microtubule مش 9.","memoryTrick":"Cilia = حركة في اتجاه واحد (زي المجداف).","stemAr":"الـ cilia ممكن توصف بأنهي واحدة من دول؟","whyWrong":["الـ basal body 9 triplets = 27 microtubule مش 9.","الـ rootlet مش 27 microtubule (فيه striated fibrils).",null,"حسب المنهج الـ cilia موجودة في الـ female genital tract (الـ fallopian tube). في الـ male بتكون stereocilia (microvilli)، وده مصدر اللبس."]},{"id":"ES2025A-08","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2025A","stem":"Which one of the following stains demonstrates lipid in the liver cells?","options":["Sudan III","PAS","Silver","trypan blue"],"answer":0,"explanation":"الـ Sudan III بيصبغ الـ lipids (برتقالي/أحمر). الـ PAS للـ glycogen.","memoryTrick":"Sudan = Fat / PAS = Glycogen.","stemAr":"أنهي stain من دول بيبيّن الـ lipid في خلايا الكبد؟","whyWrong":[null,"الـ PAS للـ glycogen.","الـ silver للـ Golgi.","الـ trypan blue vital stain للـ macrophages."]},{"id":"ES2025A-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025A","stem":"What is the origin of secretory vesicles of Golgi apparatus?","options":["Smooth endoplasmic reticulum","Rough endoplasmic reticulum","The trans face of Golgi apparatus","The cell membrane"],"answer":2,"explanation":"الـ secretory vesicles بتطلع من الـ trans face of Golgi.","memoryTrick":"Trans = Exit.","stemAr":"إيه أصل الـ secretory vesicles بتاعة الـ Golgi apparatus؟","whyWrong":["الـ sER مش أصل الـ secretory vesicles.","الـ RER أصل الـ transfer vesicles (اللي رايحة للـ Golgi)، مش الـ secretory. وده لبس شائع.",null,"الـ cell membrane مكان خروجها مش أصلها."]},{"id":"ES2025A-10","topic":"anat","concept":"Scalp & face","source":"ES2025A","stem":"Why is the loose areolar tissue considered dangerous?","options":["It is highly vascularized","It contains sweat glands","It allows infection to spread to the brain via emissary veins","It is the thickest layer of the scalp"],"answer":2,"explanation":"الـ loose areolar tissue خطيرة لأن الـ emissary veins اللي بتعدي فيها (من غير valves) بتوصل الـ infection للـ intracranial venous sinuses والمخ.","memoryTrick":"Emissary veins = طريق العدوى للمخ.","stemAr":"ليه الـ loose areolar tissue بتعتبر خطيرة (dangerous)؟","whyWrong":["الـ connective tissue layer هي اللي فيها الأوعية الكتير.","الـ sweat glands في الجلد.",null,"مش أتخن طبقة."]},{"id":"ES2025A-11","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2025A","stem":"which of the following arteries supply the outer compact bone?","options":["Nutrient artery","Periosteal artery","Epiphyseal artery","metaphyseal artery"],"answer":1,"explanation":"الـ periosteal artery بتغذي الـ outer compact bone.","memoryTrick":"Periosteal = Outer.","stemAr":"أنهي artery من دول بتغذي الـ outer compact bone؟","whyWrong":["الـ nutrient للـ marrow والجزء الداخلي.",null,"الـ epiphyseal للأطراف.","الـ metaphyseal للـ metaphysis."]},{"id":"ES2025A-12","topic":"embryo","concept":"Gametogenesis","source":"ES2025A","stem":"What is the primary mechanism that prevents polyspermy after the first sperm enters the egg?","options":["Cortical reaction","Decidual reaction","Acrosome reaction","Cleavage division"],"answer":0,"explanation":"بعد دخول أول sperm بتحصل الـ cortical reaction: الـ cortical granules بتطلع إنزيمات تغير الـ zona pellucida (zona reaction) فتمنع الـ polyspermy.","memoryTrick":"Cortical = Close the door 🚪.","stemAr":"إيه الآلية الأساسية اللي بتمنع الـ polyspermy بعد ما أول sperm يدخل البويضة؟","whyWrong":[null,"الـ decidual reaction في الـ endometrium بعد الـ implantation.","الـ acrosome reaction في الـ sperm عشان يخترق.","الـ cleavage انقسامات بعد الـ fertilization."]},{"id":"ES2025A-13","topic":"embryo","concept":"Implantation & second week","source":"ES2025A","stem":"Where originates the extraembryonic mesoderm?","options":["It is a result of the migration of cells from the neuroectoderm","In a site between trophoblast and embryoblast","In a site between hypoblast and epiblast","In a site between endoderm and ectoderm"],"answer":1,"repeatOf":"EM2023-20","explanation":"حسب الملزمة الـ extraembryonic mesoderm بيظهر في المسافة بين الـ trophoblast (cytotrophoblast) والـ embryoblast/exocoelomic membrane.","memoryTrick":"Extraembryonic = بين الـ trophoblast والـ embryo.","stemAr":"الـ extraembryonic mesoderm أصله منين؟","whyWrong":["الـ neuroectoderm بيتكون بعد كده بكتير (الأسبوع التالت).",null,"بين الـ hypoblast والـ epiblast مفيش مكان. ده الـ disc نفسه.","الـ endoderm والـ ectoderm بيتكونوا في الأسبوع التالت، بعد الـ extraembryonic mesoderm."]},{"id":"EM2025B-01","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025B","stem":"Which of the following best describes the anatomical position of the lower limbs and toes?","options":["Knees flexed, the toes turned inward.","Legs abducted, feet rotated outward.","Legs extended and parallel, feet flat with toes directed forward.","Knees flexed, feet together with toes pointing sideways."],"answer":2,"repeatOf":"EM2025A-01","explanation":"في الـ anatomical position الرجلين ممدودين ومتوازيين، والقدم flat والأصابع لقدام.","memoryTrick":"واقف مستقيم وكل حاجة لقدام.","stemAr":"أنهي واحدة من دول أحسن وصف لوضع الـ lower limbs والأصابع في الـ anatomical position؟","whyWrong":["الركب مش مثنية في الـ anatomical position.","الرجلين مش abducted.",null,"الركب مش مثنية والصوابع لقدام."]},{"id":"EM2025B-02","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025B","stem":"Which plane divides the body into anterior and posterior parts?","options":["midsagittal.","parasagittal.","coronal.","horizontal."],"answer":2,"explanation":"الـ coronal plane = anterior و posterior.","memoryTrick":"Coronal.","stemAr":"أنهي plane بيقسم الجسم لجزء anterior وجزء posterior؟","whyWrong":["الـ midsagittal يمين وشمال.","الـ parasagittal يمين وشمال مش متساويين.",null,"الـ horizontal فوق وتحت."]},{"id":"EM2025B-03","topic":"anat","concept":"Anatomical position, planes & terms","source":"EM2025B","stem":"What is the meaning of superficial dissection of the dorsal aspect of the neck?","options":["dissection of the skin and front of the neck.","dissection of the skin and back of the neck.","dissection of the muscles and vessels and back of the neck.","dissection of the muscles and vessels and front of the neck."],"answer":1,"explanation":"Superficial = skin، و Dorsal = back of the neck.","memoryTrick":"Superficial = Skin.","stemAr":"يعني إيه superficial dissection للـ dorsal aspect بتاع الرقبة؟","whyWrong":["الـ front = ventral.",null,"الـ muscles أعمق.","الاتنين غلط."]},{"id":"EM2025B-04","topic":"anat","concept":"Movements","source":"EM2025B","stem":"Moving the distal segment away from the proximal segment is called which of the following?","options":["Adduction.","abduction.","flexion.","extension."],"answer":3,"repeatOf":"EM2025A-04","explanation":"الـ extension هو فرد المفصل، فالجزء البعيد (distal segment) بيبعد عن الجزء القريب (proximal segment) والزاوية بينهم بتكبر. الـ flexion العكس: الجزئين بيقربوا من بعض.","memoryTrick":"Extension = فرد ➜ البعيد يبعد / Flexion = ثني ➜ يقرب.","stemAr":"تحريك الجزء البعيد (distal segment) بعيد عن الجزء القريب (proximal segment) اسمه إيه؟","whyWrong":["الـ adduction حركة ناحية الـ midline.","الـ abduction بعيد عن الـ midline، مش بين جزئين من الطرف. وده اللبس الشائع.","الـ flexion بيقرّب الجزئين من بعض.",null]},{"id":"EM2025B-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2025B","stem":"Which of the following is the character of the compact bone?","options":["Contains large spaces filled with bone marrow","Composed of loosely arranged trabeculae.","Dense and organized into number of cylindrical units","Found only in the epiphysis of long bones."],"answer":2,"explanation":"الـ compact bone كثيف ومنظم في Haversian systems.","memoryTrick":"Compact = Osteons.","stemAr":"أنهي واحدة من دول صفة الـ compact bone؟","whyWrong":["صفة الـ spongy.","صفة الـ spongy.",null,"الـ compact في كل العظام."]},{"id":"EM2025B-06","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2025B","stem":"Which of the following arteries can supply the bone marrow?","options":["periosteal","epiphyseal","metaphyseal","nutrient"],"answer":3,"repeatOf":"EM2025A-06","explanation":"الـ nutrient artery بتغذي الـ bone marrow.","memoryTrick":"Nutrient = Marrow.","stemAr":"أنهي artery من دول ممكن تغذي الـ bone marrow؟","whyWrong":["الـ periosteal للـ outer compact.","الـ epiphyseal للأطراف.","الـ metaphyseal للـ metaphysis.",null]},{"id":"EM2025B-07","topic":"anat","concept":"Skeleton & types of bones","source":"EM2025B","stem":"Which of the following is considered short bone?","options":["Carpal bone","phalanges","patella","clavicle"],"answer":0,"explanation":"الـ carpal bones short bones.","memoryTrick":"Carpal = Short.","stemAr":"أنهي واحدة من دول تعتبر short bone؟","whyWrong":[null,"الـ phalanges long.","الـ patella sesamoid.","الـ clavicle long."]},{"id":"EM2025B-08","topic":"embryo","concept":"Female cycles & hormones","source":"EM2025B","stem":"If Sara's cycle is 38 days, on which day is she most likely to ovulate?","options":["Day 14","Day 24","Day 28","Day 35"],"answer":1,"repeatOf":"EM2025A-08","explanation":"الـ ovulation بتحصل 14 يوم قبل الدورة الجاية (الـ luteal phase ثابتة 14 يوم)، فـ 38 − 14 = يوم 24.","memoryTrick":"Ovulation = طول الدورة − 14.","stemAr":"لو الدورة عند سارة 38 يوم، غالبًا هيحصلها ovulation في يوم كام؟","whyWrong":["يوم 14 للدورة الـ 28 يوم بس. الـ ovulation بيحصل قبل نهاية الدورة بـ 14 يوم.",null,"28 مش صح، 38−14 = 24.","35 مش صح."]},{"id":"EM2025B-09","topic":"embryo","concept":"Female cycles & hormones","source":"EM2025B","stem":"Which hormone surges right before ovulation, triggering the release of an egg?","options":["Progesterone","Estrogen","(LH)","(FSH)"],"answer":2,"explanation":"الـ LH surge بيعمل الـ ovulation.","memoryTrick":"LH surge ➜ Ovulation.","stemAr":"أنهي hormone بيعمل surge قبل الـ ovulation مباشرةً فيخلّي البويضة تنزل؟","whyWrong":["الـ progesterone بعد الـ ovulation.","الـ estrogen بيحفّز الـ surge بس مش هو.",null,"الـ FSH مش الـ trigger الأساسي."]},{"id":"EM2025B-10","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"If Sarah doesn't conceive, what event marks the end of the luteal phase?","options":["Ovulation","Menstruation","LH surge","Implantation"],"answer":1,"repeatOf":"EM2025A-10","explanation":"لو مفيش حمل الـ corpus luteum بيضمر، الـ progesterone ينزل، فتحصل الـ menstruation ودي نهاية الـ luteal phase.","memoryTrick":"مفيش حمل = Menstruation.","stemAr":"لو سارة محملتش، إيه الحدث اللي بيعلن نهاية الـ luteal phase؟","whyWrong":["الـ ovulation بداية الـ luteal phase مش نهايتها.",null,"الـ LH surge قبل الـ ovulation.","الـ implantation يعني حمل، والسؤال إنها ما حملتش."]},{"id":"EM2025B-11","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"Which hormone is released after implantation and is used to confirm pregnancy?","options":["LH","FSH","HCG (Human chorionic Gonadotropin)","Estrogen"],"answer":2,"explanation":"الـ hCG هو هرمون اختبار الحمل.","memoryTrick":"hCG.","stemAr":"أنهي hormone بيتفرز بعد الـ implantation وبيستخدم لتأكيد الحمل؟","whyWrong":["الـ LH كل شهر.","الـ FSH كل شهر.",null,"الـ estrogen من غير حمل."]},{"id":"EM2025B-12","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2025B","stem":"At what stage does the fertilized egg typically implant in the uterus?","options":["Zygote","Morula","Blastocyst","Embryo"],"answer":2,"repeatOf":"EM2025A-12","explanation":"الـ implantation بتحصل في مرحلة الـ blastocyst.","memoryTrick":"Blastocyst = يزرع.","stemAr":"البويضة الملقّحة بتزرع في الرحم عادةً في أنهي مرحلة؟","whyWrong":["الـ zygote لسه في الـ tube بعد الـ fertilization على طول.","الـ morula بتوصل الرحم بس لسه محاطة بالـ zona ومبتزرعش.",null,"مصطلح embryo بيطلق بعد الـ implantation."]},{"id":"EM2025B-13","topic":"embryo","concept":"Gametogenesis","source":"EM2025B","stem":"Which term describes complete absence of sperm in semen analysis?","options":["Azoospermia","Oligospermia","Teratozoospermia","Asthenozoospermia"],"answer":0,"repeatOf":"EM2025A-13","explanation":"الـ azoospermia = غياب الـ sperm تمامًا. Oligo = عدد قليل، Terato = شكل غلط، Astheno = حركة ضعيفة.","memoryTrick":"A-zoo = مفيش حيوانات خالص.","stemAr":"أنهي مصطلح بيوصف الغياب التام للـ sperm في تحليل السائل المنوي؟","whyWrong":[null,"الـ oligospermia = عدد قليل.","الـ teratozoospermia = شكل غير طبيعي.","الـ asthenozoospermia = حركة ضعيفة."]},{"id":"EM2025B-14","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"What major event typically occurs at the start of the second week of development?","options":["Gastrulation","Fertilization","Implantation of the blastocyst","Formation of the neural tube"],"answer":2,"repeatOf":"EM2025A-14","explanation":"بداية الأسبوع التاني بيكمل فيها الـ implantation (الـ blastocyst بيندفن في الـ endometrium).","memoryTrick":"Week 2 = Implantation + Two layers.","stemAr":"إيه الحدث الكبير اللي بيحصل عادةً في بداية الأسبوع التاني من النمو؟","whyWrong":["الـ gastrulation في الأسبوع التالت.","الـ fertilization في الأسبوع الأول.",null,"الـ neural tube في الأسبوع التالت والرابع."]},{"id":"EM2025B-15","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"What cavity begins to develop during the end of the second week?","options":["Chorionic cavity","Amniotic cavity","Yolk sac","Blastocoele"],"answer":0,"repeatOf":"EM2025A-15","explanation":"الـ chorionic cavity (extraembryonic coelom) بتتكون آخر الأسبوع التاني من اندماج spaces في الـ extraembryonic mesoderm.","memoryTrick":"آخر Week 2 = Chorionic cavity.","stemAr":"أنهي cavity بتبدأ تتكون في آخر الأسبوع التاني؟","whyWrong":[null,"الـ amniotic cavity بتبدأ بدري في الأسبوع التاني (يوم 8)، مش آخره.","الـ yolk sac بيتكون بدري في الأسبوع التاني.","الـ blastocoele في الأسبوع الأول."]},{"id":"EM2025B-16","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"Which part of the blastocyst directly interacts with the endometrial lining during implantation?","options":["Inner cell mass (embryoblast)","Syncytiotrophoblast","Amniotic cavity","Cytotrophoblast"],"answer":1,"repeatOf":"EM2025A-16","explanation":"الـ syncytiotrophoblast هو اللي بيلمس ويغزو الـ endometrium وقت الـ implantation.","memoryTrick":"Syncytio = الهجوم 🗡️.","stemAr":"أنهي جزء من الـ blastocyst بيتعامل مباشرةً مع بطانة الـ endometrium أثناء الـ implantation؟","whyWrong":["الـ inner cell mass جوه ومش بيلمس الـ endometrium.",null,"الـ amniotic cavity جوه الجنين.","الـ cytotrophoblast الطبقة الداخلية، وبره منه الـ syncytio هو اللي بيلمس ويغزو."]},{"id":"EM2025B-17","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"What hormone prepares the endometrium for implantation?","options":["Estrogen","(FSH)","Progesterone","(LH)"],"answer":2,"explanation":"الـ progesterone بيجهّز الـ endometrium للـ implantation.","memoryTrick":"Progesterone = Pro-pregnancy.","stemAr":"أنهي hormone بيجهّز الـ endometrium للـ implantation؟","whyWrong":["الـ estrogen للـ proliferation.","الـ FSH للمبيض.",null,"الـ LH للـ ovulation."]},{"id":"EM2025B-18","topic":"embryo","concept":"Implantation & second week","source":"EM2025B","stem":"Which layer of the bilaminar disc contributes to the formation of the primitive yolk sac?","options":["Hypoblast.","Epiblast.","Cytotrophoblast.","Syncytiotrophoblast."],"answer":0,"repeatOf":"EM2025A-18","explanation":"خلايا الـ hypoblast بتكوّن الـ exocoelomic membrane اللي بتعمل الـ primitive (primary) yolk sac.","memoryTrick":"Hypo = Yolk (تحت) / Epi = Amnion (فوق).","stemAr":"أنهي طبقة من الـ bilaminar disc بتشارك في تكوين الـ primitive yolk sac؟","whyWrong":[null,"الـ epiblast بيكوّن الـ amnion.","الـ cytotrophoblast مش جزء من الـ disc.","الـ syncytiotrophoblast مش جزء من الـ disc."]},{"id":"EM2025B-19","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025B","stem":"Which cells form the inner layer of the chorion?","options":["Epiblast cells","Syncytiotrophoblast","Hypoblast cells","Primary mesoderm"],"answer":3,"repeatOf":"EM2025A-19","explanation":"الطبقة الداخلية للـ chorion هي الـ extraembryonic (somatic) mesoderm = primary mesoderm.","memoryTrick":"Chorion = Trophoblast + Mesoderm من جوه.","stemAr":"أنهي خلايا بتكوّن الطبقة الداخلية للـ chorion؟","whyWrong":["الـ epiblast بيكوّن الـ amnion والجنين.","الـ syncytio الطبقة الخارجية للـ chorion.","الـ hypoblast بيكوّن الـ yolk sac.",null]},{"id":"EM2025B-20","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025B","stem":"During which week of development does the chorionic cavity form?","options":["First week","Second week","Third week","Fourth week"],"answer":1,"repeatOf":"EM2025A-20","explanation":"الـ chorionic cavity بتتكون في الأسبوع التاني.","memoryTrick":"Week 2.","stemAr":"الـ chorionic cavity بتتكون في أنهي أسبوع من النمو؟","whyWrong":["الأسبوع الأول فيه الـ blastocyst بس.",null,"الأسبوع التالت فيه الـ gastrulation، والـ chorionic cavity كانت موجودة قبلها.","متأخر."]},{"id":"EM2025B-21","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2025B","stem":"Which structure is responsible for the establishment of uteroplacental circulation?","options":["Blastocyst.","Amnion.","Yolk sac.","Syncytiotrophoblast."],"answer":3,"repeatOf":"EM2025A-21","explanation":"الـ lacunae في الـ syncytiotrophoblast بتفتح على الـ maternal sinusoids فيبدأ الـ uteroplacental circulation (حوالي يوم 11–12).","memoryTrick":"Syncytio + Lacunae = دورة الأم والجنين.","stemAr":"أنهي structure مسئول عن إنشاء الـ uteroplacental circulation؟","whyWrong":["الـ blastocyst مرحلة كاملة مش structure محدد.","الـ amnion بيحيط بالجنين.","الـ yolk sac للتغذية الأولية وتكوين الدم بعدين.",null]},{"id":"EM2025B-22","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following is true as regard Ribosomes?","options":["Appears basophilic when stained with H & E","Stains red when stained with silver","It is found supranuclear in nerve cell","Appears as unstained area in deeply basophilic cytoplasm"],"answer":0,"explanation":"الـ ribosomes basophilic في H&E.","memoryTrick":"RNA = Basophilic.","stemAr":"أنهي واحدة من دول صح بخصوص الـ ribosomes؟","whyWrong":[null,"الـ silver للـ Golgi.","الـ supranuclear للـ Golgi.","الـ unstained area للـ Golgi."]},{"id":"EM2025B-23","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following is absent from matrix of mitochondria?","options":["Circular DNA & RNA","Ca^{+2} acting as catalysts condensed within dense granules","Oxidative enzymes of Kreb's cycle","Hydrolytic digestive enzymes"],"answer":3,"explanation":"الـ hydrolytic enzymes في الـ lysosomes مش في الـ mitochondrial matrix.","memoryTrick":"Hydrolytic = Lysosome.","stemAr":"أنهي واحد من دول مش موجود في الـ matrix بتاع الـ mitochondria؟","whyWrong":["موجود.","موجود.","موجود. الـ hydrolytic في الـ lysosomes.",null]},{"id":"EM2025B-24","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following is truly- matching as regard each organelle?","options":["Cristae: inner mitochondrial membrane","Multivesicular bodies: Engulfed solid foreign bodies","SER: protein synthesis","Euchromatin: Nucleolus associated"],"answer":0,"explanation":"الـ cristae = folds of the inner mitochondrial membrane.","memoryTrick":"Cristae = Inner.","stemAr":"أنهي واحدة من دول التوصيل فيها صح لكل organelle؟","whyWrong":[null,"للسوائل مش الصلبة.","البروتين في الـ RER.","الـ nucleolus-associated heterochromatin."]},{"id":"EM2025B-25","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2025B","stem":"Which of the following is mis matching as regard each organelle?","options":["Attached ribosomes: Synthesis of cytosol proteins","Primary lysosomes: Originate from trans- face of Golgi apparatus","RER: Initial :"Active = Euchromatic.","stemAr":"أنهي جملة من دول بتوصف الخلايا النشطة (active cells)؟","whyWrong":["خاملة.","خاملة.",null,"الخلايا النشطة فيها mitochondria كتير."]},{"id":"EM2025B-29","topic":"histo","concept":"Nucleus & chromatin","source":"EM2025B","stem":"What about heterochromatin?","options":["Makes the nucleus pale by LM","Appears as coarse granules in the nucleus","Contains active genes","Represents extended parts of chromatin"],"answer":1,"repeatOf":"EM2025A-29","explanation":"الـ heterochromatin بيظهر coarse dark granules، وهو condensed وغير نشط، وبيخلي النواة غامقة.","memoryTrick":"Hetero = Coarse & Dark.","stemAr":"إيه الصح عن الـ heterochromatin؟","whyWrong":["الـ heterochromatin بيخلي النواة غامقة.",null,"الـ active genes في الـ euchromatin.","الـ extended هو الـ euchromatin."]},{"id":"EM2025B-30","topic":"histo","concept":"Cell membrane & transport","source":"EM2025B","stem":"Pinocytosis is the process by which cell membrane can engulf which of the following?","options":["Fluid droplets","solid particles","Bacteria","Foreign bodies"],"answer":0,"explanation":"الـ pinocytosis = fluid droplets.","memoryTrick":"Pino = سوائل.","stemAr":"الـ pinocytosis هي العملية اللي الـ cell membrane بتبلع بيها أنهي واحد من دول؟","whyWrong":[null,"phagocytosis.","phagocytosis.","phagocytosis."]},{"id":"EM2025B-31","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2025B","stem":"Which one is regarded as exogenous pigment?","options":["Haemoglobin","Melanin","Carotene","Lipofuscin"],"answer":2,"explanation":"الـ carotene exogenous pigment.","memoryTrick":"Carotene = Carrot 🥕.","stemAr":"أنهي واحد يعتبر exogenous pigment؟","whyWrong":["endogenous.","endogenous.",null,"endogenous."]},{"id":"ES2025B-01","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025B","stem":"Which organelle is responsible for cell digestion?","options":["RER","Golgi apparatus","SER","Lysosome"],"answer":3,"repeatOf":"ES2025A-01","explanation":"الـ lysosome مسئول عن الـ intracellular digestion.","memoryTrick":"Lysosome = معدة الخلية.","stemAr":"أنهي organelle مسئول عن الهضم داخل الخلية؟","whyWrong":["الـ rER للبروتين.","الـ Golgi للتغليف.","الـ sER للـ lipids.",null]},{"id":"ES2025B-02","topic":"histo","concept":"Cell membrane & transport","source":"ES2025B","stem":"What is the term for the process by which the cells transport solids?","options":["Endocytosis.","Exocytosis","Pinocytosis","Phagocytosis"],"answer":3,"repeatOf":"ES2025A-02","explanation":"الـ phagocytosis = ابتلاع solids.","memoryTrick":"Phago = أكل.","stemAr":"إيه اسم العملية اللي الخلايا بتنقل بيها المواد الصلبة (solids)؟","whyWrong":["الـ endocytosis عام.","الـ exocytosis إخراج.","الـ pinocytosis للسوائل.",null]},{"id":"ES2025B-03","topic":"histo","concept":"Cell membrane & transport","source":"ES2025B","stem":"Which of the following best describes the phospholipid molecules of cell membrane?","options":["The head is non-charged and hydrophobic","The head is directed inwards away from the aqueous solutions","The fatty acid tail is charged and hydrophilic","The head is directed towards the aqueous solutions"],"answer":3,"repeatOf":"ES2025A-03","explanation":"الـ phospholipid: head (phosphate) charged و hydrophilic وبيبص ناحية الـ aqueous solutions (بره وجوه)، والـ tails hydrophobic في نص الغشا.","memoryTrick":"Head يحب المية / Tail يكرهها.","stemAr":"أنهي واحدة من دول أحسن وصف لجزيئات الـ phospholipid في الـ cell membrane؟","whyWrong":["الراس charged و hydrophilic.","الراس بيبص ناحية المية مش بعيد عنها.","الديل non-charged و hydrophobic.",null]},{"id":"ES2025B-04","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025B","stem":"Regarding rER, which of the following describes it?","options":["Form proteins secreted by the cells","Form proteins used within the cytosol","Linked together by tRNA forming polysomes.","Bind to the outer surface of SER"],"answer":0,"repeatOf":"ES2025A-04","explanation":"الـ rER بيصنع البروتينات اللي هتتفرز برا الخلية.","memoryTrick":"Rough = Secreted.","stemAr":"بخصوص الـ rER، أنهي واحدة من دول بتوصفه؟","whyWrong":[null,"بروتينات الـ cytosol بتتصنع على الـ free ribosomes.","الـ polysomes بيربطها الـ mRNA مش الـ tRNA.","الـ ribosomes بتلزق في الـ rER مش الـ SER (لو لزقت يبقى rER)."]},{"id":"ES2025B-05","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025B","stem":"Which feature of the followings describes centrioles?","options":["They are a membranous organelle.","Can be demonstrated with silver stain.","Formed of nine triplets of microtubules","Have the same number of microtubules as the shaft of cilia"],"answer":2,"repeatOf":"ES2025A-05","explanation":"الـ centriole اسطوانة جدارها 9 triplets من الـ microtubules (27 microtubule)، وهو non-membranous. الـ cilia shaft فيه 9×2+2 = 20.","memoryTrick":"Centriole = 9×3.","stemAr":"أنهي صفة من دول بتوصف الـ centrioles؟","whyWrong":["الـ centrioles non-membranous.","الـ centrioles بتتبيّن بالـ iron hematoxylin. الـ silver للـ Golgi.",null,"الـ centriole 27 microtubule (9×3)، والـ cilium shaft فيه 20 (9×2+2)."]},{"id":"ES2025B-06","topic":"histo","concept":"Nucleus & chromatin","source":"ES2025B","stem":"What is the typical feature of condensed chromatin?","options":["Appears dark acidophilic by LM","Appears as fine granules by EM","Contains the inactive genes","Appears pale basophilic by LM"],"answer":2,"repeatOf":"ES2025A-06","explanation":"الـ condensed chromatin (heterochromatin) فيه الـ inactive genes وبيظهر dark basophilic ومن coarse granules.","memoryTrick":"Condensed = Inactive.","stemAr":"إيه الصفة المميزة للـ condensed chromatin؟","whyWrong":["الـ condensed chromatin basophilic مش acidophilic.","الـ fine granules صفة الـ euchromatin.",null,"الـ pale صفة الـ euchromatin."]},{"id":"ES2025B-07","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025B","stem":"The cilia can be characterized by which of the followings?","options":["The basal body is formed of nine microtubules","The rootlet contains twenty-seven microtubules","move secretions over the tissue surface in one direction","Can be found in the male genital system"],"answer":2,"explanation":"الـ cilia بتحرك الإفرازات في اتجاه واحد.","memoryTrick":"اتجاه واحد.","stemAr":"الـ cilia ممكن توصف بأنهي واحدة من دول؟","whyWrong":["الـ basal body 27 microtubule.","الـ rootlet مش 27.",null,"في الـ male بتكون stereocilia."]},{"id":"ES2025B-08","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2025B","stem":"Which one of the following stains demonstrates lipid in the liver cells?","options":["Sudan III","PAS","Silver","trypan blue"],"answer":0,"repeatOf":"ES2025A-08","explanation":"الـ Sudan III بيصبغ الـ lipids (برتقالي/أحمر). الـ PAS للـ glycogen.","memoryTrick":"Sudan = Fat / PAS = Glycogen.","stemAr":"أنهي stain من دول بيبيّن الـ lipid في خلايا الكبد؟","whyWrong":[null,"الـ PAS للـ glycogen.","الـ silver للـ Golgi.","الـ trypan blue vital stain للـ macrophages."]},{"id":"ES2025B-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025B","stem":"What is the origin of secretory vesicles of Golgi apparatus?","options":["SER","RER","trans face of Golgi apparatus.","cell membrane"],"answer":2,"explanation":"الـ secretory vesicles من الـ trans face.","memoryTrick":"Trans = Exit.","stemAr":"إيه أصل الـ secretory vesicles بتاعة الـ Golgi apparatus؟","whyWrong":["مش من الـ SER.","الـ RER أصل الـ transfer vesicles مش الـ secretory.",null,"الـ cell membrane مكان الخروج."]},{"id":"ES2025B-10","topic":"anat","concept":"Scalp & face","source":"ES2025B","stem":"Why is the loose areolar tissue considered dangerous?","options":["It is highly vascularized","It contains sweat glands","It allows infection to spread to the brain via emissary veins","It is the thickest layer of the scalp"],"answer":2,"repeatOf":"ES2025A-10","explanation":"الـ loose areolar tissue خطيرة لأن الـ emissary veins اللي بتعدي فيها (من غير valves) بتوصل الـ infection للـ intracranial venous sinuses والمخ.","memoryTrick":"Emissary veins = طريق العدوى للمخ.","stemAr":"ليه الـ loose areolar tissue بتعتبر خطيرة (dangerous)؟","whyWrong":["الـ connective tissue layer هي اللي فيها الأوعية الكتير.","الـ sweat glands في الجلد.",null,"مش أتخن طبقة."]},{"id":"ES2025B-11","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2025B","stem":"Which of the following arteries supply the outer compact bone?","options":["Nutrient artery","Periosteal artery","Epiphyseal artery","Metaphyseal artery"],"answer":1,"repeatOf":"ES2025A-11","explanation":"الـ periosteal artery بتغذي الـ outer compact bone.","memoryTrick":"Periosteal = Outer.","stemAr":"أنهي artery من دول بتغذي الـ outer compact bone؟","whyWrong":["الـ nutrient للـ marrow والجزء الداخلي.",null,"الـ epiphyseal للأطراف.","الـ metaphyseal للـ metaphysis."]},{"id":"ES2025B-12","topic":"embryo","concept":"Gametogenesis","source":"ES2025B","stem":"What is the primary mechanism that prevents polyspermy after the first sperm enters the egg?","options":["Cortical reaction","Decidual reaction","Acrosome reaction","Cleavage division"],"answer":0,"repeatOf":"ES2025A-12","explanation":"بعد دخول أول sperm بتحصل الـ cortical reaction: الـ cortical granules بتطلع إنزيمات تغير الـ zona pellucida (zona reaction) فتمنع الـ polyspermy.","memoryTrick":"Cortical = Close the door 🚪.","stemAr":"إيه الآلية الأساسية اللي بتمنع الـ polyspermy بعد ما أول sperm يدخل البويضة؟","whyWrong":[null,"الـ decidual reaction في الـ endometrium بعد الـ implantation.","الـ acrosome reaction في الـ sperm عشان يخترق.","الـ cleavage انقسامات بعد الـ fertilization."]},{"id":"ES2025B-13","topic":"embryo","concept":"Implantation & second week","source":"ES2025B","stem":"Where originates the extraembryonic mesoderm?","options":["It is a result of the migration of cells from the neuroectoderm","In a site between trophoblast and embryoblast","In a site between hypoblast and epiblast","In a site between endoderm and ectoderm"],"answer":1,"repeatOf":"EM2023-20","explanation":"حسب الملزمة الـ extraembryonic mesoderm بيظهر في المسافة بين الـ trophoblast (cytotrophoblast) والـ embryoblast/exocoelomic membrane.","memoryTrick":"Extraembryonic = بين الـ trophoblast والـ embryo.","stemAr":"الـ extraembryonic mesoderm أصله منين؟","whyWrong":["الـ neuroectoderm بيتكون بعد كده بكتير (الأسبوع التالت).",null,"بين الـ hypoblast والـ epiblast مفيش مكان. ده الـ disc نفسه.","الـ endoderm والـ ectoderm بيتكونوا في الأسبوع التالت، بعد الـ extraembryonic mesoderm."]},{"id":"ES2025-01","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025","stem":"Which organelle is responsible for maintenance of cell health?","options":["Rough endoplasmic reticulum","Golgi apparatus","Smooth endoplasmic reticulum","Lysosome"],"answer":3,"explanation":"الـ lysosome بيحافظ على صحة الخلية بإنه يهضم الـ worn-out organelles (autophagy) والمواد الغريبة.","memoryTrick":"Lysosome = عامل النظافة 🧹.","stemAr":"أنهي organelle مسئول عن الحفاظ على صحة الخلية؟","whyWrong":["الـ rER للبروتين.","الـ Golgi للتغليف.","الـ sER للـ lipids. الـ lysosome بيشيل الـ organelles القديمة والفضلات (autophagy).",null]},{"id":"ES2025-02","topic":"histo","concept":"Cell membrane & transport","source":"ES2025","stem":"What is the term for the process by which the cells transport fluids?","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":2,"explanation":"الـ pinocytosis = نقل fluids.","memoryTrick":"Pino = شرب.","stemAr":"إيه اسم العملية اللي الخلايا بتنقل بيها السوائل؟","whyWrong":["الـ endocytosis عام.","الـ exocytosis إخراج.",null,"الـ phagocytosis للصلب."]},{"id":"ES2025-03","topic":"histo","concept":"Cell membrane & transport","source":"ES2025","stem":"Which of the following best describes the phospholipid molecules of cell membrane?","options":["The head is non-charged and hydrophobic","The head is directed inwards away from the aqueous solutions","The fatty acid tail is charged and hydrophilic","The head is directed towards the aqueous solutions"],"answer":3,"repeatOf":"ES2025A-03","explanation":"الـ phospholipid: head (phosphate) charged و hydrophilic وبيبص ناحية الـ aqueous solutions (بره وجوه)، والـ tails hydrophobic في نص الغشا.","memoryTrick":"Head يحب المية / Tail يكرهها.","stemAr":"أنهي واحدة من دول أحسن وصف لجزيئات الـ phospholipid في الـ cell membrane؟","whyWrong":["الراس charged و hydrophilic.","الراس بيبص ناحية المية مش بعيد عنها.","الديل non-charged و hydrophobic.",null]},{"id":"ES2025-04","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025","stem":"Regarding free ribosomes, which of the following describes it?","options":["Form proteins secreted by the cells","Form proteins used within the cytosol","Linked together by tRNA forming polysomes","Bind to the outer surface of rER"],"answer":1,"explanation":"الـ free ribosomes بتصنع البروتينات اللي هتتستخدم جوه الـ cytosol نفسه.","memoryTrick":"Free = للاستخدام المحلي.","stemAr":"بخصوص الـ free ribosomes، أنهي واحدة من دول بتوصفها؟","whyWrong":["البروتين المُفرز من الـ attached ribosomes على الـ rER.",null,"الـ polysomes بيربطها الـ mRNA.","الـ free ribosomes مش مربوطة بحاجة، ولو اتربطت تبقى attached."]},{"id":"ES2025-05","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025","stem":"Which feature of the followings describes centrioles?","options":["They are a membranous organelle","Can be demonstrated with iron hematoxylin stain","Formed of eight bundles of microtubules","Have the same number of microtubules as the shaft of cilia"],"answer":1,"explanation":"الـ centrioles بتظهر بالـ iron hematoxylin stain. هي non-membranous ومكونة من 9 triplets (مش 8)، ومختلفة عن الـ cilia shaft.","memoryTrick":"Centriole = Iron HX.","stemAr":"أنهي صفة من دول بتوصف الـ centrioles؟","whyWrong":["non-membranous.",null,"الـ centriole 9 triplets مش 8.","27 مش 20."]},{"id":"ES2025-06","topic":"histo","concept":"Nucleus & chromatin","source":"ES2025","stem":"What is the typical feature of extended chromatin?","options":["Appears pale basophilic by LM","Appears as coarse granules by EM","Contains the inactive genes","Appears dark basophilic by LM"],"answer":0,"explanation":"الـ extended chromatin (euchromatin) بيظهر pale basophilic في الـ LM وفيه الـ active genes.","memoryTrick":"Extended = Pale & Active.","stemAr":"إيه الصفة المميزة للـ extended chromatin؟","whyWrong":[null,"الـ coarse granules صفة الـ heterochromatin.","الـ inactive genes في الـ condensed.","الـ dark صفة الـ condensed."]},{"id":"ES2025-07","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2025","stem":"The cilia can be characterized by which of the followings?","options":["The basal body is formed of nine microtubules","The rootlet contains twenty-seven microtubules","move secretions over the tissue surface in two directions","Can be found in the female genital system"],"answer":3,"explanation":"الـ cilia موجودة في الـ female genital system (الـ uterine tube) وبتحرك الـ ovum. الـ basal body 27 microtubule، والحركة في اتجاه واحد.","memoryTrick":"Cilia في الـ tube بتسوق البويضة.","stemAr":"الـ cilia ممكن توصف بأنهي واحدة من دول؟","whyWrong":["27 مش 9.","الـ rootlet مش 27.","الـ cilia بتحرك الإفرازات في اتجاه واحد مش اتجاهين.",null]},{"id":"ES2025-08","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2025","stem":"Which one of the following stains demonstrates glycogen in the liver cells?","options":["Sudan III","PAS","Silver","Sudan black"],"answer":1,"explanation":"الـ PAS بيصبغ الـ glycogen (magenta).","memoryTrick":"PAS = Polysaccharide (Glycogen).","stemAr":"أنهي stain من دول بيبيّن الـ glycogen في خلايا الكبد؟","whyWrong":["الـ Sudan III للـ fat.",null,"الـ silver للـ Golgi.","الـ Sudan black للـ fat."]},{"id":"ES2025-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2025","stem":"What is the origin of transfer vesicles of Golgi apparatus?","options":["Smooth endoplasmic reticulum","Rough endoplasmic reticulum","The trans face of Golgi apparatus","The cell membrane"],"answer":1,"explanation":"الـ transfer vesicles بتنقل البروتين من الـ rER للـ cis face of Golgi، فأصلها الـ rER.","memoryTrick":"Transfer = من rER للـ Golgi.","stemAr":"إيه أصل الـ transfer vesicles بتاعة الـ Golgi apparatus؟","whyWrong":["مش من الـ SER.",null,"الـ trans face أصل الـ secretory vesicles مش الـ transfer.","مش من الـ cell membrane."]},{"id":"ES2025-10","topic":"anat","concept":"Scalp & face","source":"ES2025","stem":"A 40 years old male patient came to the hospital with bleeding in the scalp region on examination the wound showing a large gap, what is the cause of this gap?","options":["cutting of the epicranial aponeurosis","cutting of the second layer of the scalp","cutting of the pericranium","the wound is superficial"],"answer":0,"explanation":"الجرح بيفتح (gaping) لما الـ epicranial aponeurosis تتقطع بالعرض، لأن الـ frontal والـ occipital bellies بيشدوا الحافتين في اتجاهين عكس بعض.","memoryTrick":"Gap = Aponeurosis اتقطعت.","stemAr":"راجل عنده 40 سنة جه المستشفى بنزيف في منطقة الـ scalp، وبالكشف الجرح كان مفتوح جامد (large gap). إيه سبب الفتحة دي؟","whyWrong":[null,"الطبقة التانية لازقة في الـ aponeurosis، فقطعها لوحدها مش بيفتح الجرح.","الـ pericranium لازق في العظم.","الجرح السطحي مش بيفتح."]},{"id":"ES2025-11","topic":"embryo","concept":"Gametogenesis","source":"ES2025","stem":"What is the primary mechanism that prevents polyspermy after the first sperm enters the egg?","options":["Cortical reaction","Decidual reaction","Acrosome reaction","Cleavage division"],"answer":0,"repeatOf":"ES2025A-12","explanation":"بعد دخول أول sperm بتحصل الـ cortical reaction: الـ cortical granules بتطلع إنزيمات تغير الـ zona pellucida (zona reaction) فتمنع الـ polyspermy.","memoryTrick":"Cortical = Close the door 🚪.","stemAr":"إيه الآلية الأساسية اللي بتمنع الـ polyspermy بعد ما أول sperm يدخل البويضة؟","whyWrong":[null,"الـ decidual reaction في الـ endometrium بعد الـ implantation.","الـ acrosome reaction في الـ sperm عشان يخترق.","الـ cleavage انقسامات بعد الـ fertilization."]},{"id":"ES2025-12","topic":"embryo","concept":"Implantation & second week","source":"ES2025","stem":"Where originates the extraembryonic mesoderm?","options":["It is a result of the migration of cells from the neuroectoderm","In a site between trophoblast and embryoblast","In a site between hypoblast and epiblast","In a site between endoderm and ectoderm"],"answer":1,"repeatOf":"EM2023-20","explanation":"حسب الملزمة الـ extraembryonic mesoderm بيظهر في المسافة بين الـ trophoblast (cytotrophoblast) والـ embryoblast/exocoelomic membrane.","memoryTrick":"Extraembryonic = بين الـ trophoblast والـ embryo.","stemAr":"الـ extraembryonic mesoderm أصله منين؟","whyWrong":["الـ neuroectoderm بيتكون بعد كده بكتير (الأسبوع التالت).",null,"بين الـ hypoblast والـ epiblast مفيش مكان. ده الـ disc نفسه.","الـ endoderm والـ ectoderm بيتكونوا في الأسبوع التالت، بعد الـ extraembryonic mesoderm."]},{"id":"ES2026G1-01","topic":"anat","concept":"Movements","source":"ES2026G1","stem":"Movement of the shoulder superiorly is termed which of the following?","options":["Protraction","Elevation","Depression","Retraction"],"answer":1,"explanation":"حركة الكتف لفوق اسمها elevation، ولتحت depression.","memoryTrick":"Elevation = لفوق ⬆️.","stemAr":"حركة الكتف لفوق اسمها إيه؟","whyWrong":["الـ protraction حركة لقدام.",null,"الـ depression لتحت.","الـ retraction لورا."]},{"id":"ES2026G1-02","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2026G1","stem":"During the X-ray examination of a child, the bones appeared incomplete. The physician explained that the bones are still in the process of growing. Which of the following structures is responsible for increase the length of the bone?","options":["Periosteum","Endosteum","Epiphyseal plate (growth plate)","Articular cartilage"],"answer":2,"explanation":"الـ epiphyseal (growth) plate مسئول عن زيادة طول العظمة.","memoryTrick":"Length = Growth plate.","stemAr":"في أشعة X لطفل، العظام ظهرت مش مكتملة، والدكتور شرح إن العظام لسه بتنمو. أنهي structure من دول مسئول عن زيادة طول العظمة؟","whyWrong":["الـ periosteum للتخن.","الـ endosteum بيبطن الـ medullary cavity.",null,"الـ articular cartilage على أسطح المفاصل، مش للطول."]},{"id":"ES2026G1-03","topic":"anat","concept":"Scalp & face","source":"ES2026G1","stem":"An 8-year-old child presents with fever and swelling of the scalp after a minor injury. The physician cautions that the infection may spread to the brain. Through which layer of the scalp can the infection reach the intracranial structures?","options":["Skin of the scalp","Connective tissue layer (dense subcutaneous tissue)","Loose areolar tissue layer","Pericranium"],"answer":2,"explanation":"العدوى بتوصل للمخ من خلال الـ loose areolar tissue عن طريق الـ emissary veins.","memoryTrick":"L = Lethal.","stemAr":"طفل عنده 8 سنين جه بسخونية وورم في الـ scalp بعد إصابة بسيطة، والدكتور حذّر إن العدوى ممكن توصل للمخ. العدوى ممكن توصل للـ intracranial structures عن طريق أنهي طبقة من الـ scalp؟","whyWrong":["الجلد سطحي.","الـ connective tissue فيها أوعية، بس العدوى فيها بتفضل محصورة.",null,"الـ pericranium العدوى تحته بتتحصر بالـ sutures."]},{"id":"ES2026G1-04","topic":"embryo","concept":"Implantation & second week","source":"ES2026G1","stem":"An embryo shows failure of formation of the amniotic cavity. Which layer of the bilaminar disc is primarily affected?","options":["Hypoblast","Epiblast","Cytotrophoblast","Syncytiotrophoblast"],"answer":1,"explanation":"الـ amniotic cavity بتتكون فوق الـ epiblast، وخلايا الـ epiblast هي اللي بتعمل الـ amnioblasts.","memoryTrick":"Amnion فوق الـ Epiblast.","stemAr":"embryo فيه فشل في تكوين الـ amniotic cavity. أنهي طبقة من الـ bilaminar disc متأثرة أساسًا؟","whyWrong":["الـ hypoblast بيكوّن الـ yolk sac مش الـ amnion.",null,"الـ cytotrophoblast مش جزء من الـ disc.","الـ syncytiotrophoblast مش جزء من الـ disc."]},{"id":"ES2026G1-05","topic":"embryo","concept":"Implantation & second week","source":"ES2026G1","stem":"Failure of formation of extraembryonic mesoderm would prevent development of which of the following?","options":["Amniotic cavity","Chorionic cavity","Bilaminar germ disc","Trophoblastic shell"],"answer":1,"explanation":"الـ chorionic cavity (extraembryonic coelom) بتتكون من اندماج spaces جوه الـ extraembryonic mesoderm، فلو المسودرم ده مش موجود الـ cavity مش هتتكون.","memoryTrick":"Chorionic cavity = فجوات في الـ extraembryonic mesoderm.","stemAr":"فشل تكوين الـ extraembryonic mesoderm هيمنع تكوين أنهي واحد من دول؟","whyWrong":["الـ amniotic cavity بتتكون جوه الـ epiblast، مش محتاجة الـ extraembryonic mesoderm.",null,"الـ bilaminar disc بيتكون من الـ epiblast والـ hypoblast.","الـ trophoblastic shell من الـ cytotrophoblast."]},{"id":"ES2026G1-06","topic":"embryo","concept":"Implantation & second week","source":"ES2026G1","stem":"A placenta later shows placenta previa. The abnormality most likely originated from implantation of the blastocyst in which of the following?","options":["Fundus of uterus","Posterior uterine wall","Lower uterine segment","Myometrium"],"answer":2,"explanation":"الـ placenta previa سببها implantation في الـ lower uterine segment.","memoryTrick":"Previa = تحت.","stemAr":"مشيمة ظهر فيها بعد كده placenta previa. العيب ده غالبًا جاي من إن الـ blastocyst زرع فين؟","whyWrong":["الـ fundus مكان طبيعي للـ implantation.","الـ posterior wall أشهر مكان طبيعي.",null,"الـ myometrium = placenta increta/percreta، مش previa."]},{"id":"ES2026G1-07","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026G1","stem":"A 15-year-old girl presents with primary amenorrhea, short stature, and webbed neck. What is her karyotype?","options":["46,XX","46,XY","45,X","47,XXX"],"answer":2,"explanation":"Turner syndrome (45,X): amenorrhea وقصر قامة و webbed neck.","memoryTrick":"Turner = X لوحده (45,X).","stemAr":"بنت عندها 15 سنة جاية بـ primary amenorrhea (الدورة مجتش خالص) وقِصَر قامة و webbed neck. إيه الـ karyotype بتاعها؟","whyWrong":["46,XX karyotype طبيعي.","46,XY ذكر طبيعي (أو AIS، بس الأعراض دي مش بتاعته).",null,"47,XXX غالبًا طولها طبيعي أو أطول ومفيش webbed neck."]},{"id":"ES2026G1-08","topic":"histo","concept":"Cell cycle & division","source":"ES2026G1","stem":"Regarding the prophase of the first meiotic division, crossing over occurs in which of the following stages?","options":["Leptotene","Zygotene","Pachytene","Diplotene"],"answer":2,"explanation":"الـ crossing over بيحصل في الـ pachytene (بعد الـ synapsis في الـ zygotene).","memoryTrick":"Pachy = تخين ➜ تبادل الجينات.","stemAr":"بخصوص الـ prophase بتاعة الـ first meiotic division، الـ crossing over بيحصل في أنهي مرحلة من دول؟","whyWrong":["في الـ leptotene الـ chromosomes بتبدأ تتكثف.","في الـ zygotene الـ homologous بيتقابلوا (synapsis).",null,"في الـ diplotene الـ chiasmata بتبان بعد ما الـ crossing over حصل. واللبس شائع لأن الـ chiasma بتتشاف فيها."]},{"id":"ES2026G1-09","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026G1","stem":"Which of the following describes the chromosomal microtubules?","options":["They are continuous","Arise from MTOC surrounding the centrioles","Responsible for elongation of the cell","Responsible for pulling the sister chromatids"],"answer":3,"explanation":"الـ chromosomal (kinetochore) microtubules بتتربط في الـ centromere وبتشد الـ sister chromatids للأقطاب.","memoryTrick":"Chromosomal MT = الحبل اللي بيشد.","stemAr":"أنهي واحدة من دول بتوصف الـ chromosomal microtubules؟","whyWrong":["الـ continuous fibers نوع تاني (بيوصل بين القطبين).","كل الـ spindle microtubules بتطلع من الـ MTOC، فده مش وصف مميز.","استطالة الخلية بتعملها الـ continuous (polar) microtubules.",null]},{"id":"ES2026G1-10","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2026G1","stem":"Which of the following is considered as aneuploidy?","options":["Triploid","Trisomy","Tetraploid","Polyploidy"],"answer":1,"explanation":"الـ aneuploidy = زيادة أو نقص chromosome واحد أو أكتر (زي trisomy أو monosomy). الـ triploid والـ tet
