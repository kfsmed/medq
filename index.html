<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='11' fill='%2314283F'/%3E%3Cpath d='M21.74 35.8A13 13 0 1 1 35.78 28.49' fill='none' stroke='%23F7F7F3' stroke-width='3.5' stroke-linecap='round'/%3E%3Cpath d='M17.5 28V17.5l6.5 7 6.5-7V28' fill='none' stroke='%23F7F7F3' stroke-width='3.25' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M24 36H37' stroke='%236FB8BE' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>

:root,[data-theme="light"]{
  /* MedQore tokens — Premium Academic (see design system). Light is the default theme. */
  --bg:#f7f7f3; --surface:#ffffff; --surface-sunken:#efefe9; --surface-raised:#ffffff;
  --border:#e3e3db; --border-strong:#c4c7c1; --border-input:#879099;
  --text:#14283f; --text-secondary:#637386; --text-disabled:#9aa4af;
  --brand:#14283f; --brand-hover:#1f3a59; --on-brand:#ffffff;
  --accent:#246b72; --accent-hover:#1c565c; --accent-soft:#e2efef; --on-accent:#ffffff; --focus:#246b72;
  --success:#27836d; --success-text:#1e6a58; --success-soft:#e5f2ec;
  --error:#c65c5c; --error-text:#a23e3f; --error-soft:#f9e9e8;
  --warning:#c38b3d; --warning-text:#865b1e; --warning-soft:#faf1e1;
  --info:#547eab; --info-text:#3d6591; --info-soft:#eaf0f7;
  --subject-anatomy:#405f9a; --subject-anatomy-soft:#e9eef7; --subject-histology:#916b9a; --subject-histology-soft:#f3ecf4;
  --subject-embryology:#398477; --subject-embryology-soft:#e5f1ee; --subject-biochemistry:#b4874c; --subject-biochemistry-soft:#f7efe3;
  --subject-genetics:#6b7a3a; --subject-genetics-soft:#eef1e3;
  --scrim:rgba(12,23,36,.48);
  --shadow-1:0 1px 2px rgba(20,40,63,.05); --shadow-2:0 2px 6px rgba(20,40,63,.06),0 8px 24px rgba(20,40,63,.06); --shadow-3:0 12px 40px rgba(20,40,63,.18);
}
[data-theme="dark"]{
  /* Designed dark theme — not yet switchable (Phase 5). */
  --bg:#0c1724; --surface:#122133; --surface-sunken:#0f1c2c; --surface-raised:#182a3f;
  --border:#22354b; --border-strong:#3a5068; --border-input:#5e7590;
  --text:#e8ebe4; --text-secondary:#9daaba; --text-disabled:#5d6e81;
  --brand:#e8ebe4; --brand-hover:#ffffff; --on-brand:#0c1724;
  --accent:#6fb8be; --accent-hover:#8ccbd0; --accent-soft:#16343a; --on-accent:#0c1724; --focus:#8ccbd0;
  --success:#5dc2a2; --success-text:#7dd3b7; --success-soft:#123129;
  --error:#e8898a; --error-text:#f0a3a3; --error-soft:#361c21;
  --warning:#e2b46f; --warning-text:#ebc68c; --warning-soft:#33281a;
  --info:#8db3dd; --info-text:#a8c6e8; --info-soft:#18293d;
  --subject-anatomy:#93acdd; --subject-anatomy-soft:#1a2742; --subject-histology:#cda9d4; --subject-histology-soft:#2c2034;
  --subject-embryology:#77c4b6; --subject-embryology-soft:#132f2b; --subject-biochemistry:#deb47d; --subject-biochemistry-soft:#33281a;
  --subject-genetics:#b4c47e; --subject-genetics-soft:#252b16;
  --scrim:rgba(0,0,0,.6);
  --shadow-1:0 1px 2px rgba(0,0,0,.35); --shadow-2:0 2px 8px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --shadow-3:0 16px 48px rgba(0,0,0,.55);
}
:root{
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px;
  --radius-xs:6px; --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:22px; --radius-pill:999px;
  --duration-fast:120ms; --duration-base:180ms; --duration-slow:260ms;
  --font-display:Manrope,"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-sans:Inter,"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-arabic:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  /* Legacy names → new tokens, so every existing rule keeps working (removed in Phase 4). */
  --plum:var(--brand); --plum-2:var(--accent); --lav:var(--accent-soft); --lav-2:var(--surface-sunken); --paper:var(--bg);
  --sage:var(--success-soft); --sage-ink:var(--success-text); --ink:var(--text); --mut:var(--text-secondary); --line:var(--border);
  --white:var(--surface); --bad:var(--error-text); --bad-bg:var(--error-soft); --warn:var(--warning-text); --warn-bg:var(--warning-soft);
  --r:var(--radius-lg); --r-sm:10px; --shadow:var(--shadow-1);
  --font:var(--font-sans); --serif:var(--font-display);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px); --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--font);overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background-color var(--duration-base)}
h1,h2,h3,h4{font-family:var(--serif);margin:0;color:var(--text)}
h1{font-weight:800;font-size:clamp(1.55rem,4.4vw,2.05rem);line-height:1.15;letter-spacing:-.02em}
h2{font-weight:700;font-size:clamp(1.2rem,3.2vw,1.35rem);line-height:1.3;letter-spacing:-.012em}
h3{font-weight:700;font-size:1.06rem;line-height:1.4;letter-spacing:-.005em}
p{margin:.4em 0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,var(--safe-r)) 0 max(16px,var(--safe-l))}
@media (min-width:768px){.wrap{padding:0 max(28px,var(--safe-r)) 0 max(28px,var(--safe-l))}}
.ico{display:inline-flex;width:20px;height:20px;flex:none}
.ico svg,.icon-btn svg,.navlink svg,.btn svg{width:100%;height:100%;display:block}
.btn svg{width:18px;height:18px;flex:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:var(--radius-md);border:1px solid transparent;font:600 .9375rem/1.25 var(--font);text-align:center;text-decoration:none;transition:background-color var(--duration-fast),border-color var(--duration-fast),color var(--duration-fast),transform var(--duration-fast)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-pri{background:var(--brand);color:var(--on-brand)}
.btn-sec{background:var(--accent-soft);color:var(--accent)}
.btn-ghost{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-danger{background:var(--error-soft);color:var(--error-text)}
.btn-link{background:transparent;color:var(--accent);padding-inline:8px}
.btn-sm{min-height:40px;padding:8px 14px;font-size:.875rem;border-radius:var(--radius-sm)}
.btn-block{width:100%}
.btn:disabled{background:var(--surface-sunken);color:var(--text-disabled);border-color:transparent;cursor:not-allowed;transform:none}
.icon-btn{min-width:44px;min-height:44px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;color:var(--text-secondary);font:600 .875rem/1.2 var(--font);text-decoration:none;transition:background-color var(--duration-fast),color var(--duration-fast),border-color var(--duration-fast)}
.icon-btn svg{width:20px;height:20px;flex:none}
.icon-btn.boxed,.inkbar .icon-btn{border-color:var(--border);background:var(--surface);color:var(--text)}
.icon-btn[aria-pressed="true"],.icon-btn[aria-expanded="true"]{background:var(--accent-soft);color:var(--accent)}
#flagbtn[aria-pressed="true"],[data-flag][aria-pressed="true"]{background:var(--warning-soft);color:var(--warning-text)}
#favbtn[aria-pressed="true"],[data-fav][aria-pressed="true"]{background:var(--warning-soft);color:var(--warning-text)}
.icon-btn:disabled{opacity:.45;cursor:default}
@media (hover:hover) and (pointer:fine){
  .btn-pri:not(:disabled):hover{background:var(--brand-hover)}
  .btn-sec:not(:disabled):hover{color:var(--accent-hover);box-shadow:inset 0 0 0 1px var(--accent)}
  .btn-ghost:not(:disabled):hover{border-color:var(--accent)}
  .btn-danger:not(:disabled):hover{box-shadow:inset 0 0 0 1px var(--error)}
  .icon-btn:not(:disabled):hover{background:var(--surface-sunken);color:var(--text)}
  .opt:not(:disabled):hover{border-color:var(--accent)}
  .navlink:hover{color:var(--text);background:var(--surface-sunken)}
  .module:not(.soon):hover,.subj:hover,.maplink:hover{border-color:var(--border-strong);box-shadow:var(--shadow-2)}
}

/* ---------- header & navigation ---------- */
.apphead{background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;padding-top:var(--safe-t)}
.apphead .wrap{display:flex;align-items:center;gap:12px;min-height:60px}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;font:800 1.25rem/1 var(--font-display);letter-spacing:-.025em;color:var(--text);text-decoration:none}
.brand-mark{width:32px;height:32px;display:inline-flex;flex:none}
.brand-mark svg{width:100%;height:100%}
.mq-ring,.mq-m{fill:none;stroke:var(--text);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.mq-m{stroke-width:3.25}
.mq-tail{stroke:var(--accent);stroke-width:3.5;stroke-linecap:round}
.topnav{display:flex;gap:2px;margin-inline-start:auto}
.navlink{display:inline-flex;align-items:center;gap:8px;border:none;background:none;min-height:40px;padding:8px 12px;border-radius:var(--radius-sm);color:var(--text-secondary);font:600 .875rem/1.2 var(--font);white-space:nowrap;transition:background-color var(--duration-fast),color var(--duration-fast)}
.navlink[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.headtools{display:flex;align-items:center;gap:6px;margin-inline-start:8px}
.langbtn{border:1px solid var(--border);background:var(--surface);min-height:40px;min-width:44px;padding:6px 12px;border-radius:var(--radius-sm);font-weight:700;color:var(--text);font-size:.875rem}
.langbtn[lang="ar"]{font-family:var(--font-arabic);font-size:.95rem}
.themebtn{border:1px solid var(--border);background:var(--surface);color:var(--text)}
.bottomnav{display:none}
@media (max-width:860px){
  .topnav{display:none}
  .headtools{margin-inline-start:auto}
  .bottomnav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:4px max(4px,var(--safe-r)) calc(4px + var(--safe-b)) max(4px,var(--safe-l))}
  .bottomnav .navlink{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.6875rem;line-height:1.1;padding:6px 1px;min-height:54px;min-width:0;white-space:nowrap;background:none;border-radius:var(--radius-md)}
  .bottomnav .navlink span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .bottomnav svg{width:22px;height:22px;box-sizing:content-box;padding:3px 12px;border-radius:999px;transition:background-color var(--duration-base)}
  .bottomnav .navlink[aria-current="page"]{background:none}
  .bottomnav .navlink[aria-current="page"] svg{background:var(--accent-soft)}
  body.has-bottomnav main{padding-bottom:calc(88px + var(--safe-b))}
}
main{padding:22px 0 48px}
@media (min-width:768px){main{padding-top:32px}}

/* ---------- layout & generic ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:16px}
@media (min-width:600px){.card{padding:22px}}
.muted{color:var(--text-secondary)}
.small{font-size:.875rem;line-height:1.45}
.eyebrow{font:700 .75rem/1.3 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.stack>*+*{margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;min-height:26px;font:600 .78rem/1.2 var(--font);background:var(--surface-sunken);color:var(--text);white-space:nowrap}
.pill[data-subject]{background:var(--subj-soft)}
.pill[data-subject]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--subj);flex:none}
.pill.outline{background:transparent;box-shadow:inset 0 0 0 1px var(--border);color:var(--text-secondary)}
.pill.sage{background:var(--success-soft);color:var(--success-text)}
.pill.bad{background:var(--error-soft);color:var(--error-text)}
.pill.warn{background:var(--warning-soft);color:var(--warning-text)}
.pill.soon{background:var(--surface-sunken);color:var(--text-secondary)}
.notice{display:block;border-radius:var(--radius-md);padding:12px 14px;background:var(--info-soft);color:var(--text);font-size:.9rem;line-height:1.5}
.notice.warn{background:var(--warning-soft);color:var(--warning-text)}
.notice.row{display:flex}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sechead a,.sechead .btn-link{font:600 .875rem/1.2 var(--font);text-decoration:none}
.pagehead{display:grid;gap:6px}
.pagehead p{margin:0;max-width:62ch}
.backlink{margin-inline-start:-8px}

/* ---------- subject identity ---------- */
[data-subject]{--subj:var(--accent);--subj-soft:var(--accent-soft)}
[data-subject="anatomy"]{--subj:var(--subject-anatomy);--subj-soft:var(--subject-anatomy-soft)}
[data-subject="histology"]{--subj:var(--subject-histology);--subj-soft:var(--subject-histology-soft)}
[data-subject="embryology"]{--subj:var(--subject-embryology);--subj-soft:var(--subject-embryology-soft)}
[data-subject="biochemistry"]{--subj:var(--subject-biochemistry);--subj-soft:var(--subject-biochemistry-soft)}
[data-subject="genetics"]{--subj:var(--subject-genetics);--subj-soft:var(--subject-genetics-soft)}
.glyph{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;border-radius:var(--radius-sm);background:var(--subj-soft);color:var(--text);font:800 .9rem/1 var(--font-display);letter-spacing:-.02em;position:relative}
.glyph::after{content:"";position:absolute;inset-inline-end:5px;bottom:5px;width:6px;height:6px;border-radius:50%;background:var(--subj)}
.glyph.sm{width:30px;height:30px;font-size:.72rem;border-radius:var(--radius-xs)}
.glyph.sm::after{width:4px;height:4px;inset-inline-end:3px;bottom:3px}

/* ---------- home ---------- */
.hero{display:grid;gap:6px;padding:4px 0 0}
.hero h1{font-size:clamp(1.75rem,5.2vw,2.35rem);line-height:1.1;letter-spacing:-.025em;max-width:22ch}
.hero p{max-width:60ch;margin:0}
.homegrid{display:grid;gap:16px}
@media (min-width:760px){.homegrid{grid-template-columns:1.15fr 1fr;align-items:start}}
.homeside{display:grid;gap:16px;align-content:start}
.quick{display:grid;gap:14px;background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.quick h2,.quick h3{color:var(--on-brand)}
.quick .qhead{display:flex;align-items:center;gap:12px}
.quick .qicon{display:grid;place-items:center;width:40px;height:40px;border-radius:var(--radius-sm);background:color-mix(in srgb,var(--on-brand) 14%,transparent);flex:none}
.quick .qicon svg{width:22px;height:22px}
.quick .qsub{font-size:.875rem;opacity:.82;margin:2px 0 0}
.quick .qxrow{display:flex;gap:12px;flex-wrap:wrap}
.quick .qfield{display:grid;gap:4px;flex:1;min-width:130px}
.quick .qfield>span{font:600 .78rem/1.2 var(--font);opacity:.82}
.quick .stepper{background:color-mix(in srgb,var(--on-brand) 10%,transparent);border-color:color-mix(in srgb,var(--on-brand) 22%,transparent);color:var(--on-brand)}
.quick .stepper button{color:var(--on-brand)}
.quick .btn-pri{background:var(--on-brand);color:var(--brand)}
.quick .btn-pri:not(:disabled):hover{background:var(--on-brand);opacity:.92}
.quick .qnote{font-size:.8rem;opacity:.75;margin:0}
html[data-theme="dark"] .quick:not(.inline){background:var(--surface-raised);border-color:var(--border-strong);color:var(--text)}
html[data-theme="dark"] .quick:not(.inline) h2{color:var(--text)}
html[data-theme="dark"] .quick:not(.inline) .qicon{background:var(--accent-soft);color:var(--accent)}
html[data-theme="dark"] .quick:not(.inline) .stepper{background:var(--surface);border-color:var(--border-input);color:var(--text)}
html[data-theme="dark"] .quick:not(.inline) .stepper button{color:var(--accent)}
html[data-theme="dark"] .quick:not(.inline) .btn-pri{background:var(--brand);color:var(--on-brand)}
.quick.inline{background:var(--surface);border-color:var(--border);color:var(--text)}
.quick.inline h2,.quick.inline h3{color:var(--text)}
.quick.inline .qicon{background:var(--accent-soft);color:var(--accent)}
.quick.inline .stepper{background:var(--surface);border-color:var(--border-input);color:var(--text)}
.quick.inline .stepper button{color:var(--accent)}
.quick.inline .btn-pri{background:var(--brand);color:var(--on-brand)}
.rowcard{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:start;width:100%;color:var(--text);font:inherit}
.rowcard .rc-body{flex:1;min-width:0}
.rowcard .rc-title{display:block;font:700 1rem/1.35 var(--font-display)}
.rowcard .rc-sub{display:block;font-size:.875rem;line-height:1.4;color:var(--text-secondary)}
.rowcard .rc-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:var(--radius-sm);background:var(--accent-soft);color:var(--accent);flex:none}
.rowcard .rc-icon svg{width:22px;height:22px}
.rowcard .rc-icon.err{background:var(--error-soft);color:var(--error-text)}
.rowcard .rc-icon.warn{background:var(--warning-soft);color:var(--warning-text)}
.rowcard .rc-chev{color:var(--text-secondary);display:inline-flex;width:20px;height:20px}
[dir="rtl"] .rc-chev svg,[dir="rtl"] .module .go svg{transform:scaleX(-1)}
button.rowcard{cursor:pointer}
button.rowcard:disabled{cursor:default;opacity:.7}
.modules{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.module{position:relative;display:flex;flex-direction:column;gap:14px;text-align:start;width:100%;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);color:var(--text);font:inherit;cursor:pointer;transition:border-color var(--duration-fast),box-shadow var(--duration-base),transform var(--duration-fast)}
.module:active:not(.soon){transform:translateY(1px)}
.module .mtop{display:flex;align-items:flex-start;gap:8px}
.module .mglyphs{display:flex;gap:6px}
.module .mglyphs .glyph{width:36px;height:36px;font-size:.8rem}

 skull، vertebrae، sternum، ribs، hip، والـ upper end of femur و humerus. أما الـ medullary cavity بتاعة كل الـ long bones ففيها yellow bone marrow بس.","memoryTrick":"Shaft = Yellow 🟡 / Red = Skull, Vertebrae, Sternum, Ribs, Hip + upper end of femur & humerus.","stemAr":"كل العظام دي فيها red bone marrow في البالغين ما عدا:","whyWrong":["الـ hip من أماكن الـ red marrow في الكبار.",null,"الـ sternum من أماكن الـ red marrow في الكبار.","الـ upper end of femur من أماكن الـ red marrow في الكبار."]},{"id":"EM2019A-02","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2019A","stem":"which of the following arteries supply the outer compact bone?","options":["epiphyseal arteries.","metaphyseal arteries.","nutrient arteries.","periosteal arteries."],"answer":3,"explanation":"الـ periosteal arteries هي المصدر الأساسي للدم في كل أنواع العظام، وبتجي من الأوعية القريبة، وبتغذي الـ outer compact bone. والعظمة اللي يتشال منها الـ periosteum بتموت.","memoryTrick":"Periosteal = Peripheral (من بره) ← outer compact bone.","stemAr":"أنهي artery من دول بتغذي الـ outer compact bone؟","whyWrong":["الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis).","الـ nutrient artery بتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone، مش الـ outer.",null]},{"id":"EM2019A-03","topic":"anat","concept":"Lymphatic system","source":"EM2019A","stem":"One of the following is lymphoid organ","options":["Liver","Lung","Pancreas","Spleen"],"answer":3,"explanation":"الـ spleen أكبر lymphoid organ، تحت الـ left cupola of diaphragm. وظايفه: تكسير الـ RBCs القديمة، reservoir للـ blood cells، وتكوين lymphocytes.","memoryTrick":"Spleen = أكبر مصنع lymphocytes 🏭.","stemAr":"واحد من دول lymphoid organ:","whyWrong":["الـ liver مش من الـ lymphoid organs (الـ spleen، الـ tonsils، الـ adenoids، الـ thymus، الـ lymph nodes).","الـ lung مش من الـ lymphoid organs.","الـ pancreas مش من الـ lymphoid organs.",null]},{"id":"EM2019A-04","topic":"anat","concept":"Scalp & face","source":"EM2019A","stem":"The dangerous area of the scalp is:","options":["connective tissue layer","Epicranial aponeurosis","Skin layer","Subaponeurotic space"],"answer":3,"explanation":"الطبقة الرابعة في الـ scalp هي الـ loose areolar tissue (بتملا الـ subaponeurotic space)، واسمها dangerous layer لأن الـ emissary veins بتفتح فيها وبتنقل أي infection لجوه المخ (الـ venous sinuses). والنزيف فيها بيعمل swelling في الـ scalp كله و black eye.","memoryTrick":"SCALP: الحرف L (Loose) هو الـ Lethal layer.","stemAr":"الـ dangerous area في الـ scalp هي:","whyWrong":["الـ connective tissue (dense subcutaneous) فيها أوعية وأعصاب الـ scalp، والنزيف منها بيبقى profuse لأن الألياف بتمنع الأوعية تنكمش، لكنها مش الـ dangerous layer.","الـ aponeurosis طبقة tendinous بتوصل الـ frontal بالـ occipital belly، والخطر في المسافة اللي تحتها.","الـ skin الطبقة السطحية (فيها sebaceous glands و hair follicles)، مش الـ dangerous layer.",null]},{"id":"EM2019A-05","topic":"anat","concept":"Scalp & face","source":"EM2019A","stem":"The zygomatico temporal nerve arises from:","options":["Facial nerve","Mandibular nerve","Maxillary nerve","Ophthalmic nerve"],"answer":2,"explanation":"الإجابة المعتمدة: الـ maxillary nerve. الـ zygomaticotemporal nerve من الـ 4 sensory nerves اللي بتغذي الـ scalp قدام الـ auricle، وكلهم من الـ trigeminal nerve (supratrochlear، supraorbital، zygomaticotemporal، auriculotemporal).","memoryTrick":null,"stemAr":"الـ zygomaticotemporal nerve بيطلع من:","whyWrong":["الـ facial nerve بيدي الـ motor supply (temporal و posterior auricular branches)، والـ zygomaticotemporal sensory من الـ trigeminal.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.",null,"⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2019A-06","topic":"embryo","concept":"Gametogenesis","source":"EM2019A","stem":"The part of the sperm that contains proteolytic enzymes to digest the zona pellucida is the:","options":["Acrosome","Capacitator","Corona","Head"],"answer":0,"explanation":"الـ head فيه الـ nucleus ومتغطي من قدام بالـ acrosome. الـ acrosome فيه digestive enzymes، وفي الـ acrosomal reaction بيطلّع proteolytic enzymes (زي trypsin-like substances) بتساعد الـ sperm يعدّي الـ zona pellucida.","memoryTrick":"Acrosome = الـ cap اللي فيه الإنزيمات (الخوذة اللي بتكسر الباب).","stemAr":"الجزء في الـ sperm اللي فيه proteolytic enzymes بتهضم الـ zona pellucida هو:","whyWrong":[null,"مفيش جزء في الـ sperm اسمه capacitator. الـ capacitation عملية adaptation للـ sperm في الـ female genital tract.","الـ corona radiata من الأغلفة اللي حوالين الـ ovum، مش جزء من الـ sperm.","الـ head فيه الـ nucleus والـ acrosome، لكن الإنزيمات نفسها جوه الـ acrosome، فهو الإجابة الأدق."]},{"id":"EM2019A-07","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2019A","stem":"The most distinctive character of a primary chorionic villus is its:","options":["Cytotrophoblastic core","Cytotrophoblastic shell","Extraembryonic visceral mesodermal core","Extraembryonic somatic mesodermal core"],"answer":0,"explanation":"الإجابة المعتمدة: الـ primary chorionic villus مميز بإن الـ core بتاعه cytotrophoblast. الـ primary chorionic villi بتظهر في اليوم 13 تقريبًا.","memoryTrick":null,"stemAr":"أكتر صفة مميزة للـ primary chorionic villus هي:","whyWrong":[null,"⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"EM2019A-08","topic":"embryo","concept":"Gametogenesis","source":"EM2019A","stem":"Which of the following undergoes differentiation process","options":["Primary spermatocyte","Secondary spermatocyte","Spermatid","Spermatogonia"],"answer":2,"explanation":"الـ differentiation (spermiogenesis) هي تحوّل الـ spermatid لـ spermatozoon بدون انقسام. الـ spermatogonia والـ spermatocytes بيعملوا انقسام مش differentiation.","memoryTrick":"Spermatid ➜ Sperm = تحوّل شكل بس (من غير انقسام).","stemAr":"أنهي واحد من دول بيحصله differentiation؟","whyWrong":["الـ primary spermatocyte بيعمل meiosis I (انقسام)، مش differentiation في الشكل.","الـ secondary spermatocyte بيعمل meiosis II بسرعة، مش differentiation.",null,"الـ spermatogonia بتعمل mitosis للتكاثر. الـ differentiation (spermiogenesis) بتحصل للـ spermatid."]},{"id":"EM2019A-09","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2019A","stem":"Pregnancy tests generally are based upon the detection in maternal urine of:","options":["Estrogen","Human chorionic corticotropin","Human chorionic gonadotrophin","Progesterone"],"answer":2,"explanation":"الـ hCG (human chorionic gonadotrophin) بيفرزه الـ syncytiotrophoblast، وبيحافظ على الـ corpus luteum عشان يكمّل يفرز progesterone و estrogen. وبالـ hCG (وبالـ ultrasonography) نقدر نكشف الـ implantation حوالي آخر الأسبوع التاني.","memoryTrick":"Pregnancy test = hCG (Human Chorionic Gonadotropin).","stemAr":"اختبارات الحمل عمومًا بتعتمد على اكتشاف إيه في بول الأم؟","whyWrong":["الـ estrogen بيتفرز في كل دورة عادية من الـ Graafian follicle، فمش علامة الحمل.","الاسم الصح gonadotrophin مش corticotropin. ده فخ في الكلمة.",null,"الـ progesterone بيفرزه الـ corpus luteum في كل دورة بعد الـ ovulation، فمش علامة الحمل."]},{"id":"EM2019A-10","topic":"embryo","concept":"Implantation & second week","source":"EM2019A","stem":"The amniotic cavity develops:","options":["in extraembryonic mesoderm","on the ventral surface of embryonic disc","within the inner cell mass near the cytotrophoblast","within the outer cell mass"],"answer":2,"explanation":"الـ amniotic cavity بتظهر كـ cavity صغيرة جوه الـ epiblast (جزء من الـ inner cell mass). خلايا الـ epiblast اللي جنب الـ cytotrophoblast اسمها amnioblasts.","memoryTrick":"Amnion = جوه الـ ICM فوق الـ epiblast.","stemAr":"الـ amniotic cavity بتتكون:","whyWrong":["الـ cavities اللي بتظهر في الـ extraembryonic mesoderm بتلتحم وتكوّن الـ chorionic cavity، مش الـ amniotic.","الـ amniotic cavity بتظهر جوه الـ epiblast، والـ hypoblast هو اللي ناحية الـ blastocyst cavity (اللي بتبقى الـ primitive yolk sac).",null,"الـ outer layer بتاع الـ blastocyst هو الـ trophoblast، والـ amniotic cavity بتتكون جوه الـ inner cell mass."]},{"id":"EM2019A-11","topic":"embryo","concept":"Fetal membranes & placenta","source":"EM2019A","stem":"The wall of the chorionic sac is composed of:","options":["cytotrophoblast and syncytiotrophoblast","extraembryonic splanchnic mesoderm and both layers of trophoblast","trophoblast and exocoelomic membrane","two layers of trophoblast lined by extraembryonic somatic mesoderm"],"answer":3,"explanation":"الـ chorion هو أبعد fetal membrane حوالين الـ embryo، ومكوّن من:\n1. Extraembryonic somatic mesoderm.\n2. Cytotrophoblast.\n3. Syncytiotrophoblast.","memoryTrick":"Chorion = Trophoblast (cyto + syncytio) + Somatic mesoderm.","stemAr":"جدار الـ chorionic sac مكوّن من:","whyWrong":["ناقص الطبقة التالتة: الـ extraembryonic somatic mesoderm.","الـ chorion مبطن بالـ somatic مش الـ splanchnic mesoderm.","الـ exocoelomic membrane بتحيط بالـ blastocyst cavity وتحولها لـ primitive yolk sac، مش جزء من الـ chorion.",null]},{"id":"EM2019A-12","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2019A","stem":"Localized cytoplasmic basophilia indicates the presence of:","options":["Mitochondria.","DNA","sER.","rER"],"answer":3,"explanation":"الـ ribosomes بتسبب cytoplasmic basophilia بسبب الـ RNA اللي فيها. الـ rER بيظهر في الـ H&E كـ localized أو diffuse basophilia.\n• Localized basophilia: زي الـ pancreatic cells (في الـ base بتاع الخلية) = rER.\n• Diffuse basophilia: في الـ embryonic cells.\n• Focal basophilia: في الـ nerve cells (Nissl granules).","memoryTrick":"Localized = Pancreas (rER في القاعدة) 📍 / Diffuse = Embryonic / Focal = Nerve (Nissl).","stemAr":"الـ localized cytoplasmic basophilia بتدل على وجود:","whyWrong":["الـ mitochondria بتظهر eosinophilic (acidophilic) في الـ LM، مش basophilic.","الـ DNA في النواة، والسؤال عن basophilia في الـ cytoplasm.","الـ sER مفيهوش ribosomes، ولما يكون كتير بيسبب cytoplasmic acidophilia مش basophilia.",null]},{"id":"EM2019A-13","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2019A","stem":"In H&E stained sections of plasma cell, How can Golgi apparatus appears?","options":["Apical.","Basal.","Perinuclear.","Unstained."],"answer":3,"explanation":"الـ Golgi مبيظهرش في الـ H&E. في الخلايا اللي بتصنع بروتين زي الـ plasma cell (الـ cytoplasm بتاعها deeply basophilic) بيبان كمنطقة فاتحة unstained جنب النواة، ودي اسمها Negative Golgi image.","memoryTrick":"Golgi في H&E = Negative image (بقعة فاتحة) / بالـ Silver = Apical أو Perinuclear.","stemAr":"في قطاعات الـ plasma cell المصبوغة بـ H&E، الـ Golgi apparatus بيظهر إزاي؟","whyWrong":["الـ apical (supranuclear) ده شكل الـ Golgi لما يتصبغ بالـ silver في الخلايا المفرزة زي الـ epididymis، مش شكله في الـ H&E.","الـ Golgi مش بيوصف إنه basal. في الـ H&E بيظهر unstained (negative image).","الـ perinuclear (بيحيط بالنواة كلها) ده شكل الـ Golgi بالـ silver stain في الـ nerve cells. في الـ H&E في الـ plasma cell بيبان unstained.",null]},{"id":"EM2019A-14","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2019A","stem":"Which Two organelles share in the formation of lysosomes?","options":["Golgi & cell membrane.","rER & Golgi.","rER & sER.","sER & Golgi."],"answer":1,"explanation":"الـ lysosomal enzymes بتتصنع على الـ rER وبعدين تتغلف وتتعبى في الـ Golgi (trans face) فتطلع primary lysosomes.","memoryTrick":"rER يصنع ➜ Golgi يغلّف = Lysosome.","stemAr":"أنهي اتنين organelles بيشاركوا في تكوين الـ lysosomes؟","whyWrong":["الـ cell membrane مش بيصنع إنزيمات الـ lysosome.",null,"الـ sER مش بيصنع البروتينات (الإنزيمات)، اللي بيصنعها الـ rER.","الـ sER مش مسئول عن الإنزيمات. الصح rER (يصنع) و Golgi (يغلّف)."]},{"id":"EM2019A-15","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"EM2019A","stem":"What structure contributes to the cells cytoskeleton?","options":["Centrioles","Microfilaments","Peroxisome","Ribosomes"],"answer":1,"explanation":"الـ cytoskeleton شبكة معقدة من الـ microtubules والـ filaments (والـ microfilaments منها)، مع بروتينات بتربطهم ببعض وبالـ cell membrane وبتعمل framework للخلية.","memoryTrick":"Cytoskeleton = Microtubules + Filaments.","stemAr":"أنهي structure بيشارك في الـ cytoskeleton بتاع الخلية؟","whyWrong":["الـ centrioles تراكيب بتتكون من stable microtubules، لكن الإجابة اللي هي نفسها جزء من الـ cytoskeleton هي الـ microfilaments.",null,"الـ peroxisome من الـ membranous organelles وشغلها الـ oxidation، مش جزء من الـ cytoskeleton.","الـ ribosomes لتصنيع البروتين، مش جزء من الـ cytoskeleton."]},{"id":"EM2019A-16","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2019A","stem":"Down syndrome:","options":["caused by chromosome 21 trisomy.","due to duplication of chromosome 22.","due to multiple X syndrome.","due to X chromosome monosomy."],"answer":0,"explanation":"الـ Down syndrome (mongolism) هو trisomy 21 (2n+1)، يعني نسخة زيادة من chromosome 21، وسببه غالبًا non-disjunction.","memoryTrick":"Down = Trisomy 21.","stemAr":"الـ Down syndrome:","whyWrong":[null,"الـ chromosome 22 بيرتبط بالـ Philadelphia chromosome، وده reciprocal translocation بين 9 و 22 (في الـ CML)، مش duplication ومش Down.","الـ multiple X syndrome هو 47,XXX: أنثى عندها X زيادة. ده مش Down.","الـ X monosomy (45,X0) هو الـ Turner syndrome."]},{"id":"EM2019B-01","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2019B","stem":"Which of the following bones ossifies in a membrane?","options":["Radius","Tibia","Vault of the skull","Vertebrae"],"answer":2,"explanation":"الـ development of the bone نوعين:\n• Membranous ossification: زي الـ vault of the skull والـ face.\n• Cartilaginous ossification: زي عظام الـ upper و lower limbs.","memoryTrick":"Membrane = Vault & Face / Cartilage = Limbs.","stemAr":"أنهي عظمة من دول بتتعظم في membrane (membranous ossification)؟","whyWrong":["الـ radius من عظام الـ upper limb، بيتكون بـ cartilaginous ossification.","الـ tibia من عظام الـ lower limb، بيتكون بـ cartilaginous ossification.",null,"⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."]},{"id":"EM2019B-02","topic":"anat","concept":"Bone structure, blood supply & growth","source":"EM2019B","stem":"which of the following arteries supply the bone marrow?","options":["epiphyseal arteries","metaphyseal arteries","nutrient arteries","periosteal arteries"],"answer":2,"explanation":"الـ nutrient artery بتدخل العظمة من الـ nutrient canal وبتتقسم لـ proximal و distal branches في الـ medullary cavity، وبتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.","memoryTrick":"Nutrient = Nourishes the Marrow.","stemAr":"أنهي artery من دول بتغذي الـ bone marrow؟","whyWrong":["الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis).",null,"الـ periosteal arteries المصدر الأساسي لكل العظام، وبتغذي الـ outer compact bone."]},{"id":"EM2019B-03","topic":"anat","concept":"Lymphatic system","source":"EM2019B","stem":"the lymph vessel is absent in following organ:","options":["Brain","Liver","Lung","Pancreas"],"answer":0,"explanation":"الـ lymphatic vessels غايبة في: الـ brain، الـ spinal cord، الـ eyeball، الـ bone marrow، الـ splenic pulp، الـ hyaline cartilage، والشعر.","memoryTrick":"No lymph: Brain, Spinal cord, Eyeball, Bone marrow, Splenic pulp, Hyaline cartilage, Hair.","stemAr":"الـ lymph vessels مش موجودة في أنهي organ من دول؟","whyWrong":[null,"الـ liver مش من الأماكن اللي مفيهاش lymph vessels.","الـ lung مش من الأماكن اللي مفيهاش lymph vessels.","الـ pancreas مش من الأماكن اللي مفيهاش lymph vessels."]},{"id":"EM2019B-04","topic":"anat","concept":"Scalp & face","source":"EM2019B","stem":"The occipital belly of occipitofrontalis is supplied by:","options":["Auriculotemporal nerve","3rd occipital nerve","Supratrochlear nerve","Posterior auricular nerve"],"answer":3,"explanation":"الـ occipitofrontalis:\n• الـ occipital belly بيتغذى من الـ posterior auricular branch of facial nerve.\n• الـ frontal belly بيتغذى من الـ temporal branch of facial nerve.","memoryTrick":"Occipital = Posterior auricular (ورا الودن).","stemAr":"الـ occipital belly بتاع الـ occipitofrontalis بيتغذى عصبيًا من:","whyWrong":["الـ auriculotemporal nerve من الـ sensory nerves (من الـ trigeminal)، مش motor.","الـ 3rd occipital nerve sensory (من الـ cervical nerves).","الـ supratrochlear nerve sensory (من الـ trigeminal).",null]},{"id":"EM2019B-05","topic":"anat","concept":"Scalp & face","source":"EM2019B","stem":"The posterior aspect of the scalp drains into:","options":["Mastoid lymph nodes","Parotid lymph nodes","Submandibular lymph nodes","Submental lymph nodes"],"answer":0,"explanation":"الـ lymphatic drainage of the scalp:\n• الجزء الأمامي ➜ submandibular lymph nodes.\n• الجزء الـ lateral والجبهة ➜ superficial parotid (preauricular) nodes.\n• الجزء الخلفي ورا الودن ➜ mastoid nodes.","memoryTrick":"قدام = Submandibular / جنب = Parotid / ورا الودن = Mastoid.","stemAr":"الجزء الخلفي من الـ scalp بيصرّف (lymph) في:","whyWrong":[null,"الـ parotid nodes للجزء الـ lateral والجبهة.","الـ submandibular nodes للجزء الأمامي.","الـ submental nodes مش من الـ nodes المذكورة لتصريف الـ scalp."]},{"id":"EM2019B-06","topic":"embryo","concept":"Gametogenesis","source":"EM2019B","stem":"The time taken for a spermatogonium to develop into a mature spermatozoon is approximately:","options":["64 days","60 days","24 days","40 days"],"answer":0,"explanation":"الـ spermatogenesis بتاخد حوالي شهرين (about two months). أما رقم 64 يوم بالتحديد فهو إجابة ملزمة الأسئلة.","memoryTrick":"Spermatogenesis ≈ شهرين.","stemAr":"الوقت اللي بياخده الـ spermatogonium عشان يبقى spermatozoon ناضج تقريبًا:","whyWrong":[null,"\"حوالي شهرين\" ممكن تتفهم 60 يوم كمان. الإجابة المطلوبة حسب ملزمة الأسئلة 64. راجع الدكتور.","24 يوم أقل بكتير من الشهرين.","40 يوم أقل من الشهرين."],"note":"⚠️ المدة المعروفة \"حوالي شهرين\" من غير رقم محدد بالأيام. سبنا إجابة ملزمة الأسئلة (64 يوم). راجع الدكتور."},{"id":"EM2019B-07","topic":"embryo","concept":"Gametogenesis","source":"EM2019B","stem":"Capacitation of the sperm:","options":["is caused by the zona pellucida","is essential for fertilization","occurs in the male","prevents polyspermy"],"answer":1,"explanation":"الـ capacitation = adaptation للـ sperms في الـ female genital tract (حوالي 7 ساعات). بيحصل تغيير في الـ cell membrane بتاع الـ sperm وبتتشال طبقة glycoprotein (cleaning of the sperm).\nالنتيجة: منطقة الـ acrosomal cap بتتغير فيبقى الـ acrosome reaction ممكن، والـ sperm بيبقى hyperactive. ومن غير capacitation مفيش fertilization.","memoryTrick":"Capacitation = تأشيرة دخول للـ fertilization (بتتعمل جوه الست).","stemAr":"الـ capacitation بتاعة الـ sperm:","whyWrong":["الـ capacitation بتحصل في الـ female genital tract بشيل طبقة الـ glycoprotein، مش بسبب الـ zona.",null,"بتحصل في الـ female genital tract مش في الذكر.","بعد دخول الـ sperm الـ ovum بيعمل cortical and zonal reaction، وده مش الـ capacitation."]},{"id":"EM2019B-08","topic":"embryo","concept":"Fertilization & cleavage","source":"EM2019B","stem":"The most correct sequence of early development following fertilization is:","options":["zygote, blastomeres, morula, blastocyst","oocyte, zygote, morula, blastocyst","zygote, conceptus, blastocyst","polar bodies, zygote, conceptus, blastocyst"],"answer":0,"explanation":"بعد الـ fertilization:\nzygote ➜ cleavage (انقسامات mitotic سريعة والخلايا الناتجة اسمها blastomeres) ➜ morula (كورة solid من 16-32 خلية) ➜ blastocyst (trophoblast + inner cell mass + blastocele).","memoryTrick":"Z-B-M-B: Zygote, Blastomeres, Morula, Blastocyst.","stemAr":"أصح ترتيب لمراحل النمو الأولى بعد الـ fertilization هو:","whyWrong":[null,"الـ oocyte قبل الـ fertilization، والسؤال عن اللي بعدها، وكمان ناقص الـ blastomeres.","الترتيب ناقص الـ blastomeres والـ morula.","الـ polar bodies نواتج انقسام الـ oocyte، مش مرحلة من مراحل النمو بعد الـ fertilization."]},{"id":"EM2019B-09","topic":"embryo","concept":"Implantation & second week","source":"EM2019B","stem":"The amniotic cavity develops:","options":["in extraembryonic mesoderm","on the ventral surface of embryonic disc","within the inner cell mass near the cytotrophoblast","within the outer cell mass"],"answer":2,"repeatOf":"EM2019A-10","explanation":"الـ amniotic cavity بتظهر كـ cavity صغيرة جوه الـ epiblast (جزء من الـ inner cell mass). خلايا الـ epiblast اللي جنب الـ cytotrophoblast اسمها amnioblasts.","memoryTrick":"Amnion = جوه الـ ICM فوق الـ epiblast.","stemAr":"الـ amniotic cavity بتتكون:","whyWrong":["الـ cavities اللي بتظهر في الـ extraembryonic mesoderm بتلتحم وتكوّن الـ chorionic cavity، مش الـ amniotic.","الـ amniotic cavity بتظهر جوه الـ epiblast، والـ hypoblast هو اللي ناحية الـ blastocyst cavity (اللي بتبقى الـ primitive yolk sac).",null,"الـ outer layer بتاع الـ blastocyst هو الـ trophoblast، والـ amniotic cavity بتتكون جوه الـ inner cell mass."]},{"id":"EM2019B-10","topic":"histo","concept":"Cell membrane & transport","source":"EM2019B","stem":"What process is nicknamed \"cell drinking\"?","options":["Endocytosis","Exocytosis","Pinocytosis","Phagocytosis"],"answer":2,"explanation":"الـ pinocytosis (cell drinking) نوع من الـ endocytosis: invaginations صغيرة في الغشا بتبلع extracellular fluid وتكوّن pinocytic vesicles. أما الـ phagocytosis (cell eating) فلبلع المواد الصلبة.","memoryTrick":"Pino = Pint (شرب) / Phago = أكل.","stemAr":"أنهي عملية اسمها الشائع \"cell drinking\" (شرب الخلية)؟","whyWrong":["الـ endocytosis مصطلح عام بيشمل الـ phagocytosis والـ pinocytosis والـ receptor-mediated endocytosis.","الـ exocytosis إخراج محتوى vesicle لبره الخلية.",null,"الـ phagocytosis = cell eating (بلع مواد صلبة)."]},{"id":"EM2019B-11","topic":"histo","concept":"Inclusions, pigments & stains","source":"EM2019B","stem":"Which one is an endogenous pigment?","options":["Lead","Carotenes","Tattoo","Hemoglobin"],"answer":3,"explanation":"الـ pigments نوعين:\n• Endogenous (من جوه الجسم): hemoglobin (في الـ RBCs)، melanin، lipofuscin.\n• Exogenous (من بره): carbon & dust particles، carotene، tattoo marks.","memoryTrick":"Endo = جوه (Hb, Melanin, Lipofuscin) / Exo = بره (Carbon, Carotene, Tattoo).","stemAr":"أنهي واحد endogenous pigment؟","whyWrong":["الـ lead مادة بتدخل الجسم من بره، مش بيصنعها الجسم، فمش endogenous.","الـ carotene من الـ exogenous pigments (من الأكل زي الجزر).","الـ tattoo marks من الـ exogenous pigments: صبغات بتتحقن تحت الجلد وتاخدها الـ phagocytic cells.",null]},{"id":"EM2019B-12","topic":"histo","concept":"Cytoplasmic organelles","source":"EM2019B","stem":"Where are ribosomes formed?","options":["Centrioles","Cytoskeleton","Microfilaments","Nucleoli"],"answer":3,"explanation":"الـ rRNA بيتصنع في الـ nucleolus، والبروتينات بتتصنع في الـ cytoplasm، وبيتجمعوا في النواة على شكل small و large subunits وبعدين يطلعوا للـ cytoplasm. يعني الـ nucleolus هو مكان تكوين الـ ribosomal subunits.","memoryTrick":"Nucleolus = مصنع الـ Ribosomes.","stemAr":"الـ ribosomes بتتكون فين؟","whyWrong":["الـ centrioles ليها دور في الـ cell division وبتشارك في تكوين الـ cilia والـ flagella، مش ribosomes.","الـ cytoskeleton هو هيكل الخلية (microtubules & filaments)، مش مكان تكوين الـ ribosomes.","الـ microfilaments (actin) جزء من الـ cytoskeleton، مش مكان تكوين الـ ribosomes.",null]},{"id":"EM2019B-13","topic":"histo","concept":"Nucleus & chromatin","source":"EM2019B","stem":"The nucleus is surrounded by which of the following?","options":["A double membrane","A single membrane","No membrane around nucleus","Proteins"],"answer":0,"explanation":"الـ nuclear envelope عبارة عن double membrane (inner + outer) بينهم perinuclear space وفيها nuclear pores.","memoryTrick":"Nucleus = جدار مزدوج 🧱🧱.","stemAr":"النواة محاطة بإيه من دول؟","whyWrong":[null,"الـ nuclear envelope مكوّن من غشائين مش غشا واحد.","النواة ليها nuclear membrane (envelope) واضح، فاختيار إنها من غير غشا غلط.","البروتينات (زي الـ lamina) بتدعم الغشا من جوه، بس مش هي اللي بتحيط بالنواة."]},{"id":"EM2019B-14","topic":"histo","concept":"Chromosomes & genetic disorders","source":"EM2019B","stem":"Duplication of DNA occurs in:","options":["G1 phase","G2 phase","Interphase","S phase"],"answer":3,"explanation":"الـ DNA duplication بتحصل في الـ S phase (حوالي 8 ساعات)، والنتيجة 46 d-chromosomes. وكمان الـ centrioles بتتضاعف فيها.","memoryTrick":"S = Synthesis of DNA.","stemAr":"تضاعف الـ DNA بيحصل في:","whyWrong":["في الـ G1 الخلية بتكبر وبتصنع RNA وبروتينات لازمة للـ DNA duplication، لكن لسه ما ضاعفتش.","الـ G2 بعد الـ S: فيها تصنيع RNA وبروتينات للانقسام وتصنيع الـ tubulin ومراجعة الـ DNA.","الـ interphase بتشمل G1 و S و G2. الإجابة الأدق هي الـ S phase تحديدًا.",null]},{"id":"ES2019-01","topic":"anat","concept":"Scalp & face","source":"ES2019","stem":"Which one of the following is the dangerous layer of the scalp ?","options":["Connective subcutaneous tissue","Loose areolar tissue","Pericranium .","Skin"],"answer":1,"explanation":"الطبقة الرابعة في الـ scalp هي الـ loose areolar tissue (بتملا الـ subaponeurotic space)، واسمها dangerous layer لأن الـ emissary veins بتفتح فيها وبتنقل أي infection لجوه المخ (الـ venous sinuses). والنزيف فيها بيعمل swelling في الـ scalp كله و black eye.","memoryTrick":"L = Loose = Lethal.","stemAr":"أنهي طبقة من دول هي الـ dangerous layer في الـ scalp؟","whyWrong":["الـ connective tissue (dense subcutaneous) فيها أوعية وأعصاب الـ scalp، والنزيف منها بيبقى profuse لأن الألياف بتمنع الأوعية تنكمش، لكنها مش الـ dangerous layer.",null,"الـ pericranium loosely attached للعظم لكن firmly adherent للـ sutures، ومش هي الـ dangerous layer.","الـ skin الطبقة السطحية (فيها sebaceous glands و hair follicles)، مش الـ dangerous layer."]},{"id":"ES2019-02","topic":"anat","concept":"Scalp & face","source":"ES2019","stem":"The motor nerve supply of the scalp behind the auricle is :","options":["Great auricular nerve","Greater occipital nerve","Lesser occipital nerve","Posterior auricular branch of facial nerve"],"answer":3,"explanation":"الـ nerve supply of the scalp ورا الـ auricle: 1 motor (posterior auricular branch of facial) و 4 sensory من الـ cervical nerves (great auricular، lesser occipital، greater occipital، 3rd occipital).","memoryTrick":"Motor في الـ scalp = Facial nerve دايمًا.","stemAr":"الـ motor nerve supply للـ scalp ورا الـ auricle (الودن) هو:","whyWrong":["الـ great auricular nerve sensory (من الـ cervical nerves).","الـ greater occipital nerve sensory (من الـ cervical nerves).","الـ lesser occipital nerve sensory (من الـ cervical nerves).",null]},{"id":"ES2019-03","topic":"anat","concept":"Lymphatic system","source":"ES2019","stem":"As regarding to the spleen which of the following statement is wrong?","options":["It destroys worn-out RBCs","It is Largest lymphoid organ","It lies below right cupola of diaphragm","It produces lymphocytes"],"answer":2,"explanation":"الجملة الغلط C: الـ spleen موجود تحت الـ left cupola of diaphragm مش الـ right.","memoryTrick":"Spleen على الشمال (Left) 👈.","stemAr":"بخصوص الـ spleen، أنهي جملة من دول غلط؟","whyWrong":["جملة صح: من وظايفه تكسير الـ worn-out RBCs. والسؤال عن الغلط.","جملة صح: الـ spleen أكبر lymphoid organ.",null,"جملة صح: من وظايفه تكوين الـ lymphocytes."]},{"id":"ES2019-04","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2019","stem":"Which membranous organelle is prominent in cells synthesize steroid hormones?","options":["Golgi apparatus","Mitochondria","rER","sER"],"answer":3,"explanation":"الـ sER بيكون well-developed في الخلايا اللي بتصنع fat و steroid hormones (زي الـ adrenal cortex والـ endocrine cells والـ liver cells). من وظايفه تصنيع الـ steroid hormones (cortisone و testosterone).","memoryTrick":"Steroid = Smooth (S & S).","stemAr":"أنهي membranous organelle بيكون واضح (prominent) في الخلايا اللي بتصنع steroid hormones؟","whyWrong":["الـ Golgi شغله packing و concentration وتعديل البروتينات اللي جاية من الـ rER، مش تصنيع الـ steroids.","الـ mitochondria وظيفتها الأساسية الـ cell respiration وإنتاج الطاقة (ATP)، مش هي الـ organelle المميزة لتصنيع الـ steroids.","الـ rER لتصنيع البروتين، والـ steroids مش بروتينات.",null]},{"id":"ES2019-05","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2019","stem":"What are the Ribosomes ?","options":["Exogenous pigment","Membranous organelles .","Non membranous organelle","Stored food"],"answer":2,"explanation":"الـ ribosomes non-membranous organelles مكونة من rRNA وبروتين.","memoryTrick":"Ribosome = من غير غشاء.","stemAr":"الـ ribosomes عبارة عن إيه؟","whyWrong":["الـ ribosomes organelle مش pigment.","الـ ribosomes معندهاش غشا.",null,"الـ stored food زي الـ glycogen والـ lipid تعتبر inclusions مش organelles."]},{"id":"ES2019-06","topic":"histo","concept":"Cell membrane & transport","source":"ES2019","stem":"What is the polysaccharide coating that is sometimes found on the cell membrane?","options":["Cristae","Glycocalyx","Plasmalemma","protoplasm"],"answer":1,"explanation":"الـ glycocalyx (cell coat) هو الطبقة الـ carbohydrate (glycoproteins & glycolipids) على السطح الخارجي للـ cell membrane.","memoryTrick":"Glyco = سكر ➜ Glycocalyx = غلاف سكري.","stemAr":"إيه هو الغطا الـ polysaccharide اللي بيكون أحيانًا على الـ cell membrane؟","whyWrong":["الـ cristae طيات الـ inner mitochondrial membrane.",null,"الـ plasmalemma هو اسم الـ cell membrane نفسه، مش الطبقة اللي عليه.","الـ protoplasm مش هو الطبقة الـ carbohydrate اللي على السطح الخارجي للغشا. الطبقة دي اسمها cell coat (glycocalyx)."]},{"id":"ES2019-07","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2019","stem":"What are ribosomes constructed ?","options":["Cytoskeleton","Microfilaments","Nucleoli","Peroxisome"],"answer":2,"explanation":"الـ ribosomes بتتكون (تتجمع subunits) في الـ nucleolus.","memoryTrick":"Nucleolus = Ribosome factory.","stemAr":"الـ ribosomes مكونة من إيه؟","whyWrong":["الـ cytoskeleton هيكل الخلية ومش بيصنع ribosomes.","الـ microfilaments (actin) جزء من الـ cytoskeleton.",null,"الـ peroxisome organelle غشائي وظيفته الـ beta oxidation للـ fatty acids، مش تكوين الـ ribosomes."]},{"id":"ES2019R2-01","topic":"embryo","concept":"Fertilization & cleavage","source":"ES2019R2","stem":"Which sentence of the following does NOT true for fertilization?","options":["It is the union of a human ovum and sperm","It is occurring in the isthmus of the fallopian tube.","The result of this union is the production of a zygote cell","It can occur 12 24 hours after ovulation"],"answer":1,"explanation":"الجملة الغلط B: الـ fertilization بتحصل في الـ ampulla (الـ lateral third) of the uterine tube، مش الـ isthmus.","memoryTrick":"Fertilization = Ampulla (A مع A).","stemAr":"أنهي جملة من دول مش صح عن الـ fertilization؟","whyWrong":["جملة صح: الـ fertilization = اتحاد sperm و oocyte وانصهار النواتين. والسؤال عن الغلط.",null,"جملة صح: الناتج zygote.","جملة صح تقريبًا: من غير fertilization الـ oocyte بيتحلل حوالي 24 ساعة بعد الـ ovulation."]},{"id":"ES2019R2-02","topic":"embryo","concept":"Gametogenesis","source":"ES2019R2","stem":"As regarding Anatomy of the Sperm which one of the following is WRONG?","options":["Its total length is about 50 µm","It consists of: head, neck, middle piece and tail","The head contains a nucleus, a pool of actin","The acrosome is a vesicle contains the genetic material of the sperm"],"answer":3,"explanation":"الغلط D: الـ genetic material في الـ nucleus جوه الـ head. الـ acrosome بيغطي الـ head من قدام وفيه digestive enzymes.","memoryTrick":"Acrosome = Enzymes / Nucleus = DNA.","stemAr":"بخصوص تشريح الـ sperm، أنهي واحدة من دول غلط؟","whyWrong":["طول الـ sperm حوالي 60 µm (وفي مقارنة الـ sperm بالـ ovum بيتكتب 50 µ)، فالجملة دي مش غلط واضح زي D.","جملة صح: الـ sperm 4 أجزاء: head و neck و body (middle piece) و tail.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.",null],"note":"⚠️ طول الـ sperm بيتذكر مرة 60 µm ومرة 50 µ، فالاختيار A ممكن يتحسب صح. سبنا إجابة ملزمة الأسئلة D لأن الـ acrosome أكيد مش فيه المادة الوراثية. راجع الدكتور."},{"id":"ES2019R2-03","topic":"embryo","concept":"Gametogenesis","source":"ES2019R2","stem":"Acrosome Reaction is...........","options":["Alteration of the molecular structure of the glycoproteins in zona pellucida","Removal of the surface-coating proteins derived from seminal fluid","The digestive acrosomal enzymes at the tip of the sperm's head allow the sperm to burrow through the corona radiata","The enzymatic content of acrosome, which can dissolve the glycoproteins in zona pellucida, is thus released."],"answer":3,"explanation":"في الـ acrosomal reaction الـ acrosome بيطلّع proteolytic enzymes (زي trypsin-like substances) بتساعد الـ sperm يخترق الـ zona pellucida. وده بيبقى ممكن بعد الـ capacitation.","memoryTrick":"Acrosome reaction = الإنزيمات تخرج لتذيب الـ zona.","stemAr":"الـ acrosome reaction هو...........","whyWrong":["ده وصف الـ zona reaction (بتحصل في البويضة بعد الـ fertilization)، مش الـ acrosome reaction.","ده تعريف الـ capacitation.","ده وصف اختراق الـ corona radiata، بيحصل بإنزيمات بس قبل التفاعل مع الـ zona. الإجابة الأدق للـ acrosome reaction هي خروج الإنزيمات اللي بتذوّب الـ zona.",null]},{"id":"ES2019R2-04","topic":"anat","concept":"Scalp & face","source":"ES2019R2","stem":"Frontal belly of occipitofrontalis muscle is supplied by which of following nerve?","options":["Auriculotemporal","Temporal branch of facial","Zygomatic branch of facial","Zygomaticofacial"],"answer":1,"explanation":"الـ occipitofrontalis:\n• الـ occipital belly بيتغذى من الـ posterior auricular branch of facial nerve.\n• الـ frontal belly بيتغذى من الـ temporal branch of facial nerve.","memoryTrick":"Frontal = Temporal branch (الجبهة جنب الصدغ).","stemAr":"الـ frontal belly بتاع الـ occipitofrontalis بيتغذى عصبيًا من أنهي nerve؟","whyWrong":["الـ auriculotemporal nerve sensory (من الـ trigeminal).",null,"الـ occipitofrontalis motor supply من الـ temporal branch (frontal belly) والـ posterior auricular branch (occipital belly) بس.","الـ zygomaticofacial مش من أعصاب الـ scalp المذكورة، وهو مش الـ motor supply للـ frontal belly."]},{"id":"ES2019R2-05","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2019R2","stem":"The artery that supplies the bone marrow is........","options":["Periosteal","Epiphyseal","Metaphyseal","Nutrient"],"answer":3,"explanation":"الـ nutrient artery بتدخل العظمة من الـ nutrient canal وبتتقسم لـ proximal و distal branches في الـ medullary cavity، وبتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.","memoryTrick":"Nutrient = Marrow.","stemAr":"الـ artery اللي بتغذي الـ bone marrow هي........","whyWrong":["الـ periosteal arteries المصدر الأساسي لكل العظام، وبتغذي الـ outer compact bone.","الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis).",null]},{"id":"ES2019R2-06","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2019R2","stem":"Localized cytoplasmic basophilia indicates the presence of.......","options":["DNA","Mitochondria","RER","SER"],"answer":2,"repeatOf":"EM2019A-12","explanation":"الـ ribosomes بتسبب cytoplasmic basophilia بسبب الـ RNA اللي فيها. الـ rER بيظهر في الـ H&E كـ localized أو diffuse basophilia.\n• Localized basophilia: زي الـ pancreatic cells (في الـ base بتاع الخلية) = rER.\n• Diffuse basophilia: في الـ embryonic cells.\n• Focal basophilia: في الـ nerve cells (Nissl granules).","memoryTrick":"Localized = Pancreas (rER في القاعدة) 📍 / Diffuse = Embryonic / Focal = Nerve (Nissl).","stemAr":"الـ localized cytoplasmic basophilia بتدل على وجود:","whyWrong":["الـ DNA في النواة، والسؤال عن basophilia في الـ cytoplasm.","الـ mitochondria بتظهر eosinophilic (acidophilic) في الـ LM، مش basophilic.",null,"الـ sER مفيهوش ribosomes، ولما يكون كتير بيسبب cytoplasmic acidophilia مش basophilia."]},{"id":"ES2019R2-07","topic":"histo","concept":"Inclusions, pigments & stains","source":"ES2019R2","stem":"In H&E stained sections of plasma cell, how can Golgi apparatus appear?","options":["Apical","Basal","Perinuclear","Unstained"],"answer":3,"explanation":"الـ Golgi مبيظهرش في الـ H&E. في الخلايا اللي بتصنع بروتين زي الـ plasma cell (الـ cytoplasm بتاعها deeply basophilic) بيبان كمنطقة فاتحة unstained جنب النواة، ودي اسمها Negative Golgi image.","memoryTrick":"Golgi في H&E = Negative image (بقعة فاتحة) / بالـ Silver = Apical أو Perinuclear.","stemAr":"في قطاعات الـ plasma cell المصبوغة بـ H&E، الـ Golgi apparatus بيظهر إزاي؟","whyWrong":["الـ apical (supranuclear) ده شكل الـ Golgi لما يتصبغ بالـ silver في الخلايا المفرزة زي الـ epididymis، مش شكله في الـ H&E.","الـ Golgi مش بيوصف إنه basal. في الـ H&E بيظهر unstained (negative image).","الـ perinuclear (بيحيط بالنواة كلها) ده شكل الـ Golgi بالـ silver stain في الـ nerve cells. في الـ H&E في الـ plasma cell بيبان unstained.",null]},{"id":"ES2019R2-08","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2019R2","stem":"Which two organelles share in the formation of lysosomes?","options":["Golgi & cell membrane","RER & SER","SER & Golgi","RER & Golgi"],"answer":3,"repeatOf":"EM2019A-14","explanation":"الـ lysosomal enzymes بتتصنع على الـ rER وبعدين تتغلف وتتعبى في الـ Golgi (trans face) فتطلع primary lysosomes.","memoryTrick":"rER يصنع ➜ Golgi يغلّف = Lysosome.","stemAr":"أنهي اتنين organelles بيشاركوا في تكوين الـ lysosomes؟","whyWrong":["الـ cell membrane مش بيصنع إنزيمات الـ lysosome.","الـ sER مش بيصنع البروتينات (الإنزيمات)، اللي بيصنعها الـ rER.","الـ sER مش مسئول عن الإنزيمات. الصح rER (يصنع) و Golgi (يغلّف).",null]},{"id":"ES2019R2-09","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2019R2","stem":"What structure contributes to the cell's cytoskeleton?","options":["Centrioles","Microfilaments","Peroxisome","Ribosomes"],"answer":1,"repeatOf":"EM2019A-15","explanation":"الـ cytoskeleton شبكة معقدة من الـ microtubules والـ filaments (والـ microfilaments منها)، مع بروتينات بتربطهم ببعض وبالـ cell membrane وبتعمل framework للخلية.","memoryTrick":"Cytoskeleton = Microtubules + Filaments.","stemAr":"أنهي structure بيشارك في الـ cytoskeleton بتاع الخلية؟","whyWrong":["الـ centrioles تراكيب بتتكون من stable microtubules، لكن الإجابة اللي هي نفسها جزء من الـ cytoskeleton هي الـ microfilaments.",null,"الـ peroxisome من الـ membranous organelles وشغلها الـ oxidation، مش جزء من الـ cytoskeleton.","الـ ribosomes لتصنيع البروتين، مش جزء من الـ cytoskeleton."]},{"id":"ES2020-01","topic":"anat","concept":"Scalp & face","source":"ES2020","stem":"Which of the following is the dangerous area of the scalp?","options":["The connective tissue layer","The pericranium","Loose areolar tissue layer","Skin layer"],"answer":2,"explanation":"الطبقة الرابعة في الـ scalp هي الـ loose areolar tissue (بتملا الـ subaponeurotic space)، واسمها dangerous layer لأن الـ emissary veins بتفتح فيها وبتنقل أي infection لجوه المخ (الـ venous sinuses). والنزيف فيها بيعمل swelling في الـ scalp كله و black eye.","memoryTrick":"L = Lethal.","stemAr":"أنهي واحدة من دول هي الـ dangerous area في الـ scalp؟","whyWrong":["الـ connective tissue (dense subcutaneous) فيها أوعية وأعصاب الـ scalp، والنزيف منها بيبقى profuse لأن الألياف بتمنع الأوعية تنكمش، لكنها مش الـ dangerous layer.","الـ pericranium loosely attached للعظم لكن firmly adherent للـ sutures، ومش هي الـ dangerous layer.",null,"الـ skin الطبقة السطحية (فيها sebaceous glands و hair follicles)، مش الـ dangerous layer."]},{"id":"ES2020-02","topic":"anat","concept":"Scalp & face","source":"ES2020","stem":"The occipital belly is supplied by which of the following?","options":["Cervical branch of facial nerve","Posterior auricular nerve","Mandibular branch of facial nerve","Occipital branch of facial nerve"],"answer":1,"explanation":"الـ occipitofrontalis:\n• الـ occipital belly بيتغذى من الـ posterior auricular branch of facial nerve.\n• الـ frontal belly بيتغذى من الـ temporal branch of facial nerve.","memoryTrick":"Occipital = Posterior auricular.","stemAr":"الـ occipital belly بيتغذى عصبيًا من أنهي واحد من دول؟","whyWrong":["الـ occipitofrontalis motor supply من الـ temporal branch (frontal belly) والـ posterior auricular branch (occipital belly) بس.",null,"الـ occipitofrontalis motor supply من الـ temporal branch (frontal belly) والـ posterior auricular branch (occipital belly) بس.","مفيش فرع للـ facial اسمه occipital branch. الـ occipital belly بيتغذى من الـ posterior auricular branch."]},{"id":"ES2020-03","topic":"anat","concept":"Movements","source":"ES2020","stem":"in which of the following movements the palm face posterior?","options":["Supination","Pronation","Eversion","Inversion"],"answer":1,"explanation":"الـ pronation والـ supination حركات rotational للـ forearm والإيد: الطرف البعيد للـ radius بيلف medially و laterally حوالين الـ ulna. في الـ pronation الـ palm بتبص لورا (posterior) والـ dorsum لقدام.","memoryTrick":"Pronation = Palm Posterior (P-P).","stemAr":"في أنهي حركة من دول الـ palm بتبص لورا (posterior)؟","whyWrong":["الـ supination عكس الـ pronation: بترجّع الـ forearm للـ anatomical position (الـ palm لقدام).",null,"الـ eversion حركة للقدم: الـ sole بيبص لبره (laterally).","الـ inversion حركة للقدم: الـ sole بيبص لجوه (medially)."]},{"id":"ES2020-04","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2020","stem":"which of the following arteries supply the bone marrow?","options":["epiphyseal arteries","metaphyseal arteries","nutrient arteries","periosteal arteries"],"answer":2,"repeatOf":"EM2019B-02","explanation":"الـ nutrient artery بتدخل العظمة من الـ nutrient canal وبتتقسم لـ proximal و distal branches في الـ medullary cavity، وبتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.","memoryTrick":"Nutrient = Nourishes the Marrow.","stemAr":"أنهي artery من دول بتغذي الـ bone marrow؟","whyWrong":["الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis).",null,"الـ periosteal arteries المصدر الأساسي لكل العظام، وبتغذي الـ outer compact bone."]},{"id":"ES2020-05","topic":"histo","concept":"Cell membrane & transport","source":"ES2020","stem":"Cell coat function all except:","options":["Cell adhesions.","Cell allergy.","Cell recognition.","Cell transport."],"answer":3,"explanation":"وظايف الـ cell coat: cell immunity، cell adhesion، cell protection، cell recognition (cell identity).\nالـ transport (exchange of materials) من وظايف الـ plasma membrane نفسه (passive diffusion، facilitated diffusion، active transport، bulk transport)، مش الـ cell coat.","memoryTrick":"Cell coat = I A P R (Immunity, Adhesion, Protection, Recognition).","stemAr":"وظايف الـ cell coat كلها ما عدا:","whyWrong":["الـ cell adhesion من وظايف الـ cell coat، والسؤال عن اللي مش من وظايفه.","الـ allergy مش مذكورة بالاسم في وظايف الـ cell coat، لكنها رد فعل مناعي فأقرب للـ cell immunity. الإجابة المعتمدة هي D (transport).","الـ cell recognition (cell identity) من وظايفه.",null],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"ES2020-06","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2020","stem":"Which organelle produces protein for export?","options":["SER","RER","Lysosome.","Mitochondria","Golgi apparatus"],"answer":1,"explanation":"الـ rER عليه ribosomes بتصنع البروتين اللي هيخرج برا الخلية (secretory/export proteins).","memoryTrick":"Rough = Ribosomes = Protein for export.","stemAr":"أنهي organelle بيصنع بروتين للتصدير (يتفرز برا الخلية)؟","whyWrong":["الـ sER للـ lipids والـ detox، مفيهوش ribosomes.",null,"الـ lysosome للهضم.","الـ mitochondria للطاقة.","الـ Golgi بيغلّف البروتين، لكن اللي بيصنعه الـ rER."]},{"id":"ES2020-07","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2020","stem":"The cytoplasmic side of the coated vesicle is surrounded by:","options":["Clathrin.","Tubulin.","Actin.","Spectrin."],"answer":0,"explanation":"الإجابة المعتمدة: الـ coated vesicle متغطية من ناحية الـ cytoplasm بالـ clathrin.","memoryTrick":null,"stemAr":"الناحية اللي جوه الـ cytoplasm من الـ coated vesicle محاطة بـ:","whyWrong":[null,"الـ tubulin (alpha & beta) هو البروتين اللي بيتكون منه الـ microtubules.","الـ actin هو البروتين اللي بيتكون منه الـ microfilaments.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"ES2020-08","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2020","stem":"Which of the following share in formation of cilia & flagella?","options":["Glial cells .","Keratin","Centrioles .","Neurofilaments.","Cytoskeleton."],"answer":2,"explanation":"من وظايف الـ centrioles إنها بتشارك في تكوين الـ cilia والـ flagella: الـ centrioles بتتضاعف آلاف المرات وتعمل الـ basal bodies اللي بتروح للـ apical cytoplasm، وبيطلع من كل واحدة shaft.","memoryTrick":"Centriole ➜ Basal body ➜ Cilia.","stemAr":"أنهي واحد من دول بيشارك في تكوين الـ cilia والـ flagella؟","whyWrong":["الـ glial cells خلايا، مش organelle. اللي فيها هو الـ glial filaments (intermediate filaments).","الـ cytokeratin نوع من الـ intermediate filaments في الـ epithelial cells وبيكوّن الشعر والضوافر.",null,"الـ neurofilaments نوع من الـ intermediate filaments في الـ neurons.","الـ cytoskeleton مصطلح واسع (microtubules & filaments). اللي بيشارك تحديدًا في تكوين الـ cilia والـ flagella هو الـ centrioles."]},{"id":"ES2020-09","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2020","stem":"What structure contributes to the cells cytoskeleton?","options":["Centrioles .","Peroxisome.","Ribosomes.","Microfilaments"],"answer":3,"repeatOf":"EM2019A-15","explanation":"الـ cytoskeleton شبكة معقدة من الـ microtubules والـ filaments (والـ microfilaments منها)، مع بروتينات بتربطهم ببعض وبالـ cell membrane وبتعمل framework للخلية.","memoryTrick":"Cytoskeleton = Microtubules + Filaments.","stemAr":"أنهي structure بيشارك في الـ cytoskeleton بتاع الخلية؟","whyWrong":["الـ centrioles تراكيب بتتكون من stable microtubules، لكن الإجابة اللي هي نفسها جزء من الـ cytoskeleton هي الـ microfilaments.","الـ peroxisome من الـ membranous organelles وشغلها الـ oxidation، مش جزء من الـ cytoskeleton.","الـ ribosomes لتصنيع البروتين، مش جزء من الـ cytoskeleton.",null]},{"id":"ES2020-10","topic":"anat","concept":"Anatomical position, planes & terms","source":"ES2020","stem":"which of the following plane divides the body into anterior and posterior parts?","options":["sagittal plane","coronal plane","parasagittal plane","horizontal plane"],"answer":1,"explanation":"الـ coronal (frontal) plane بيقسم الجسم لـ anterior و posterior.","memoryTrick":"Coronal = التاج (Crown) بيتحط من ودن لودن ➜ قدام/ورا.","stemAr":"أنهي plane من دول بيقسم الجسم لجزء anterior وجزء posterior؟","whyWrong":["الـ sagittal بيقسم يمين وشمال.",null,"الـ parasagittal يمين وشمال مش متساويين.","الـ horizontal فوق وتحت."]},{"id":"ES2020-11","topic":"anat","concept":"Movements","source":"ES2020","stem":"which of the following terms means abduction of the fingers?","options":["Move the finger away from the median plane","Moving the finger away from the index finger","Moving the finger away from the middle finger","Moving the finger away from the little finger"],"answer":2,"explanation":"الإجابة المعتمدة: الـ abduction في الأصابع بيتقاس بالنسبة للـ middle finger. (الـ abduction عمومًا = moving away from the median plane).","memoryTrick":null,"stemAr":"أنهي مصطلح من دول معناه abduction للأصابع؟","whyWrong":["الـ median plane هو مرجع الـ abduction للجسم عمومًا، والإجابة المعتمدة للأصابع هي الـ middle finger.","⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور.",null,"⚠️ الاختيار ده محتاج تأكيد، راجع الدكتور."],"note":"⚠️ المعلومة دي محتاجة تأكيد، راجع الدكتور."},{"id":"ES2020-12","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2020","stem":"Which of the following bones contain red bone marrow in the adult?","options":["Shaft of femur","Shaft of radius","sternum","shaft of tibia"],"answer":2,"explanation":"في الكبار الـ red bone marrow موجود في الـ meshes بتاعة الـ spongy bones: الـ skull، vertebrae، sternum، ribs، hip، والـ upper end of femur و humerus. والـ medullary cavity بتاعة كل الـ long bones فيها yellow marrow بس.","memoryTrick":"Sternum = لسه أحمر طول العمر.","stemAr":"أنهي عظام من دول فيها red bone marrow في البالغين؟","whyWrong":["الـ shaft of femur (medullary cavity) فيه yellow marrow في الكبار.","الـ shaft of radius فيه yellow marrow.",null,"الـ shaft of tibia فيه yellow marrow."]},{"id":"ES2020-13","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2020","stem":"which of the following arteries supply the spongy bone?","options":["epiphyseal arteries","metaphyseal arteries","nutrient arteries","periosteal arteries"],"answer":2,"explanation":"الـ nutrient artery بتدخل العظمة من الـ nutrient canal وبتتقسم لـ proximal و distal branches في الـ medullary cavity، وبتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.","memoryTrick":"Nutrient = جوه (Marrow + Spongy) / Periosteal = برا (Outer compact).","stemAr":"أنهي artery من دول بتغذي الـ spongy bone؟","whyWrong":["الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis).",null,"الـ periosteal arteries المصدر الأساسي لكل العظام، وبتغذي الـ outer compact bone."]},{"id":"ES2020-14","topic":"anat","concept":"Scalp & face","source":"ES2020","stem":"The occipital belly is supplied by which of the following?","options":["Cervical branch of facial nerve","posterior auricular nerve","mandibular branch of facial nerve","occipital branch of facial nerve"],"answer":1,"repeatOf":"ES2020-02","explanation":"الـ occipitofrontalis:\n• الـ occipital belly بيتغذى من الـ posterior auricular branch of facial nerve.\n• الـ frontal belly بيتغذى من الـ temporal branch of facial nerve.","memoryTrick":"Occipital = Posterior auricular.","stemAr":"الـ occipital belly بيتغذى عصبيًا من أنهي واحد من دول؟","whyWrong":["الـ occipitofrontalis motor supply من الـ temporal branch (frontal belly) والـ posterior auricular branch (occipital belly) بس.",null,"الـ occipitofrontalis motor supply من الـ temporal branch (frontal belly) والـ posterior auricular branch (occipital belly) بس.","مفيش فرع للـ facial اسمه occipital branch. الـ occipital belly بيتغذى من الـ posterior auricular branch."]},{"id":"ES2021-01","topic":"anat","concept":"Scalp & face","source":"ES2021","stem":"Which of the following is the dangerous area of the scalp?","options":["The connective tissue layer","The pericranium","Loose areolar tissue layer","Skin layer"],"answer":2,"repeatOf":"ES2020-01","explanation":"الطبقة الرابعة في الـ scalp هي الـ loose areolar tissue (بتملا الـ subaponeurotic space)، واسمها dangerous layer لأن الـ emissary veins بتفتح فيها وبتنقل أي infection لجوه المخ (الـ venous sinuses). والنزيف فيها بيعمل swelling في الـ scalp كله و black eye.","memoryTrick":"L = Lethal.","stemAr":"أنهي واحدة من دول هي الـ dangerous area في الـ scalp؟","whyWrong":["الـ connective tissue (dense subcutaneous) فيها أوعية وأعصاب الـ scalp، والنزيف منها بيبقى profuse لأن الألياف بتمنع الأوعية تنكمش، لكنها مش الـ dangerous layer.","الـ pericranium loosely attached للعظم لكن firmly adherent للـ sutures، ومش هي الـ dangerous layer.",null,"الـ skin الطبقة السطحية (فيها sebaceous glands و hair follicles)، مش الـ dangerous layer."]},{"id":"ES2021-02","topic":"anat","concept":"Scalp & face","source":"ES2021","stem":"The occipital belly is supplied by which of the following?","options":["Cervical branch of facial nerve","Posterior auricular nerve","Mandibular branch of facial nerve","Occipital branch of facial nerve"],"answer":1,"repeatOf":"ES2020-02","explanation":"الـ occipitofrontalis:\n• الـ occipital belly بيتغذى من الـ posterior auricular branch of facial nerve.\n• الـ frontal belly بيتغذى من الـ temporal branch of facial nerve.","memoryTrick":"Occipital = Posterior auricular.","stemAr":"الـ occipital belly بيتغذى عصبيًا من أنهي واحد من دول؟","whyWrong":["الـ occipitofrontalis motor supply من الـ temporal branch (frontal belly) والـ posterior auricular branch (occipital belly) بس.",null,"الـ occipitofrontalis motor supply من الـ temporal branch (frontal belly) والـ posterior auricular branch (occipital belly) بس.","مفيش فرع للـ facial اسمه occipital branch. الـ occipital belly بيتغذى من الـ posterior auricular branch."]},{"id":"ES2021-03","topic":"anat","concept":"Movements","source":"ES2021","stem":"In which of the following movements the palm face posterior?","options":["Supination","Pronation","Eversion","Inversion"],"answer":1,"repeatOf":"ES2020-03","explanation":"الـ pronation والـ supination حركات rotational للـ forearm والإيد: الطرف البعيد للـ radius بيلف medially و laterally حوالين الـ ulna. في الـ pronation الـ palm بتبص لورا (posterior) والـ dorsum لقدام.","memoryTrick":"Pronation = Palm Posterior (P-P).","stemAr":"في أنهي حركة من دول الـ palm بتبص لورا (posterior)؟","whyWrong":["الـ supination عكس الـ pronation: بترجّع الـ forearm للـ anatomical position (الـ palm لقدام).",null,"الـ eversion حركة للقدم: الـ sole بيبص لبره (laterally).","الـ inversion حركة للقدم: الـ sole بيبص لجوه (medially)."]},{"id":"ES2021-04","topic":"anat","concept":"Bone structure, blood supply & growth","source":"ES2021","stem":"Which of the following arteries supply the bone marrow?","options":["Epiphyseal arteries","Metaphyseal arteries","Nutrient arteries","Periosteal arteries"],"answer":2,"repeatOf":"EM2019B-02","explanation":"الـ nutrient artery بتدخل العظمة من الـ nutrient canal وبتتقسم لـ proximal و distal branches في الـ medullary cavity، وبتغذي الـ bone marrow والـ spongy bone والجزء العميق من الـ compact bone.","memoryTrick":"Nutrient = Nourishes the Marrow.","stemAr":"أنهي artery من دول بتغذي الـ bone marrow؟","whyWrong":["الـ epiphyseal arteries فروع من الـ articular arteries، بتغذي الـ ends of the bones (الـ epiphysis).","الـ metaphyseal arteries فروع من الـ articular arteries، بتغذي أطراف العظمة (الـ metaphysis).",null,"الـ periosteal arteries المصدر الأساسي لكل العظام، وبتغذي الـ outer compact bone."]},{"id":"ES2021-05","topic":"embryo","concept":"Implantation & second week","source":"ES2021","stem":"When does Implantation of human embryos typically occurs?","options":["about 1 day after fertilization","about one week (i.e. 7 days) after fertilization","about two weeks (i.e. 14 days) after fertilization","after gastrulation"],"answer":1,"explanation":"الـ implantation بتبدأ حوالي اليوم السادس بعد الـ fertilization (آخر الأسبوع الأول) وبتخلص في اليوم 11 أو 12.","memoryTrick":"Implantation: تبدأ Day 6 وتخلص Day 11-12.","stemAr":"الـ implantation للـ human embryo بيحصل عادةً إمتى؟","whyWrong":["بعد يوم واحد لسه في الـ cleavage (أول cleavage بعد حوالي 30 ساعة) جوه الـ fallopian tube.",null,"في اليوم 14 الـ implantation بيكون خلص بالفعل (بيخلص يوم 11-12).","الـ implantation بيبدأ حوالي اليوم 6، يعني في آخر الأسبوع الأول، مش بعد مراحل لاحقة."]},{"id":"ES2021-06","topic":"embryo","concept":"Implantation & second week","source":"ES2021","stem":"Placenta previa means implantation in which of the following sites?","options":["Abdominal cavity","Uterine tube","Ovary","Near the cervix"],"answer":3,"explanation":"الـ abnormal implantation:\n• جوه الرحم: placenta previa (implantation قريب من الـ internal os).\n• بره الرحم: 95% في الـ fallopian tube، أو في الـ ovary، أو في الـ peritoneal wall.","memoryTrick":"Previa = قدّام (قدام عنق الرحم).","stemAr":"الـ placenta previa معناها implantation في أنهي مكان من دول؟","whyWrong":["الـ abdominal (peritoneal) implantation بره الرحم، مش placenta previa.","الـ uterine tube أشهر مكان للـ implantation بره الرحم (95%).","الـ ovary من أماكن الـ implantation بره الرحم.",null]},{"id":"ES2021-07","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2021","stem":"Which organelle is involved in lipid metabolism?","options":["RER","Golgi apparatus","SER","Lysosome"],"answer":2,"explanation":"الـ sER مسئول عن تصنيع الـ phospholipids (للـ cell membranes) والـ steroid hormones، وكمان الـ detoxification في الـ liver cells.","memoryTrick":"Smooth = Steroids & Lipids & Detox.","stemAr":"أنهي organelle له دور في الـ lipid metabolism؟","whyWrong":["الـ RER للبروتين.","الـ Golgi شغله packing وتعديل البروتينات وتكوين الـ secretory vesicles والـ lysosomes.",null,"الـ lysosome للهضم جوه الخلية (intracytoplasmic digestion)."]},{"id":"ES2021-08","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2021","stem":"Which is a non-renewing cell:","options":["Hepatocyte.","Epidermal cell.","Nerve cell.","Cartilage cell"],"answer":2,"explanation":"الخلايا من حيث التجدد 3 أنواع:\n• Non-renewing: خلايا highly specialized بتسيب الـ cycle في G1 وتروح G0 للأبد (permanent exit). لو ماتت مبتتعوضش، زي الـ heart muscles والـ nerve cells.\n• Potentially renewable: زي الـ liver cells (transient exit).\n• Continuously turn over: بتتعوض من الـ stem cells، زي الـ blood cells والـ sperms.","memoryTrick":"Nerve & Heart = Never renew 🚫","stemAr":"أنهي واحدة من دول non-renewing cell (مبتتجددش)؟","whyWrong":["الـ liver cells (hepatocytes) من الـ potentially renewable cells: لو اتشال جزء من الكبد الخلايا ممكن ترجع للـ cycle وترجّع حجمه الطبيعي.","الـ epidermis بيتجدد باستمرار من الـ basal layer، فمش non-renewing.",null,"الـ cartilage cells مش من الأمثلة المذكورة للـ non-renewing. الأمثلة هي الـ heart muscles والـ nerve cells."]},{"id":"ES2021-09","topic":"histo","concept":"Cytoplasmic organelles","source":"ES2021","stem":"What is protein forming cells containing?","options":["rER and sER","rER and golgi apparatus","sER and lysosomes","sER and mitochondria"],"answer":1,"explanation":"الخلية اللي بتصنع بروتين للإفراز فيها rER واضح (لتصنيع البروتين بالـ attached polyribosomes) و Golgi well-developed (للـ packing والتعديل وتكوين الـ secretory vesicles).","memoryTrick":"Protein cell = rER + Golgi.","stemAr":"الخلايا اللي بتصنع بروتين بيكون فيها إيه؟","whyWrong":["الـ sER مش للبروتين.",null,"الـ sER والـ lysosomes مش للتصنيع.","الـ sER والـ mitochondria. الخلايا اللي بتصنع بروتين بتحتاج rER و Golgi."]},{"id":"ES2021-10","topic":"histo","concept":"Chromosomes & genetic disorders","source":"ES2021","stem":"Which is Numerical aberrations?","options":["Ring Chromosome.","Deletion","Inversion.","Klinefelter s syndrome."],"answer":3,"explanation":"Klinefelter (47,XXY) numerical aberration. الـ ring chromosome والـ deletion والـ inversion structural.","memoryTrick":"Numerical = عدد زيادة/ناقص (XXY).","stemAr":"أنهي واحد من دول numerical aberration (خلل في العدد)؟","whyWrong":["الـ ring chromosome structural.","الـ deletion structural.","الـ inversion structural. الـ numerical بيغيّر العدد زي الـ Klinefelter (47,XXY).",null]},{"id":"ES2021-11","topic":"histo","concept":"Cytoskeleton, centrioles & cilia","source":"ES2021","stem":"What structure contributes to the cells cytoskeleton?","options":["Centrioles","Peroxisome.","Ribosomes.","Microfilaments"],"answer":3,"repeatOf":"EM2019A-15","explanation":"الـ cytoskeleton شبكة معقدة من الـ microtubules والـ filaments (والـ microfilaments منها)، مع بروتينات بتربطهم ببعض وبالـ cell membrane وبتعمل framework للخلية.","memoryTrick":"Cytoskeleton = Microtubules + Filaments.","stemAr":"أنهي structure بيشارك في الـ cytoskeleton بتاع الخلية؟","whyWrong":["الـ centrioles تراكيب بتتكون من stable microtubules، لكن الإجابة اللي هي نفسها جزء من الـ cytoskeleton هي الـ microfilaments.","الـ peroxisome من الـ membranous organelles وشغلها الـ oxidation، مش جزء من الـ cytoskeleton.","الـ ribosomes لتصنيع البروتين، مش جزء من الـ cytoskeleton.",null]},{"id":"F2022-01","topic":"histo","concept":"Cytoplasmic organelles","source":"F2022","stem":"Which organelle contains digestive enzymes?","options":["RER","Golgi apparatus","SER","Lysosome"],"answer":3,"explanation":"الـ l
